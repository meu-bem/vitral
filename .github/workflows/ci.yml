# Testes, validação de dados e conteúdo, e build de teste de um ano.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema para o WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Dependências Python (fixadas por hash)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q
        env:
          PYTHONPATH: src
      - name: Validação de dados e conteúdo (erros falham; lacunas só são listadas)
        run: python -m vitral.validate --anos 2
        env:
          PYTHONPATH: src

  build-de-teste:
    runs-on: ubuntu-24.04
    needs: testes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Gerar PDF e EPUB do próximo ano litúrgico
        run: python -m vitral.build --ano "$(python -c 'from vitral.validate import current_liturgical_year as c; print(c()+1)')" --formatos pdf,epub --saida dist
        env:
          PYTHONPATH: src
      - name: epubcheck
        run: |
          curl -sSLo epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  epubcheck.zip" | sha256sum -c -
          unzip -q epubcheck.zip
          for f in dist/*/*.epub; do java -jar epubcheck-5.4.0/epubcheck.jar "$f"; done
