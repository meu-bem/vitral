# Publica os livros (GitHub Releases) e o site (GitHub Pages).
#
# Roda todo dia e sob demanda. É idempotente: só gera um ano se as entradas mudaram.
# Pré-gera os próximos N anos (padrão 10) porque o GitHub desativa agendamentos de
# repositórios sem atividade por 60 dias: mesmo que este agendamento pare, os livros
# dos próximos anos já estarão nas Releases. Ver docs/SUCESSAO.md.
name: publicar

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano litúrgico (ano civil do 1º Domingo do Advento). Vazio = regra automática."
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["data/**", "livro/**", "src/**", "conteudo/**", "requirements.txt", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  VITRAL_ANOS_A_FRENTE: ${{ vars.VITRAL_ANOS_A_FRENTE || '10' }}

jobs:
  livros:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema (WeasyPrint) e Calibre (AZW3, opcional)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          sudo apt-get install -y --no-install-recommends calibre || echo "Calibre indisponível: AZW3 não será gerado"
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Validar dados (erros impedem publicar)
        run: python -m vitral.validate --so-erros
        env:
          PYTHONPATH: src
      - name: Gerar e publicar Releases
        run: python scripts/publish.py ${{ inputs.ano && format('--ano {0}', inputs.ano) || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: dist/catalog.json
      - name: Manter o agendamento ativo (tentativa; ver docs/SUCESSAO.md)
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/publicar.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  site:
    needs: livros
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog
          path: site/dados
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Build estático
        working-directory: site
        run: |
          npm ci
          npm run build
        env:
          VITRAL_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITRAL_CATALOG: dados/catalog.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    needs: site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy

  arquivar:
    # Opcional e desligado por padrão: envio ao Internet Archive. Para ligar, veja docs/SUCESSAO.md.
    needs: livros
    if: vars.ARQUIVAR_INTERNET_ARCHIVE == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Enviar os anos publicados ao Internet Archive
        run: python scripts/archive_ia.py
        env:
          GH_TOKEN: ${{ github.token }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_PREFIXO: ${{ vars.IA_PREFIXO }}
