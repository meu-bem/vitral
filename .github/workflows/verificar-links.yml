# Verifica os links estáveis uma vez por mês. Se algum quebrar, abre (ou comenta) uma issue.
# Não altera nada sozinho.
name: verificar-links

on:
  schedule:
    - cron: "41 11 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Verificar
        id: verificar
        run: python scripts/check_links.py relatorio-links.md
        continue-on-error: true
      - name: Abrir ou comentar issue
        if: steps.verificar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label links-quebrados --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file relatorio-links.md
          else
            gh label create links-quebrados --color B60205 --description "Links de data/links.yaml fora do ar" 2>/dev/null || true
            gh issue create --title "Links quebrados em data/links.yaml" --label links-quebrados --body-file relatorio-links.md
          fi
