# Fórmulas fixas do livro: nomes dos livros, anúncio, abertura e conclusão das leituras.
#
# Não é texto bíblico nem tradução. São os títulos e as aclamações que a liturgia usa em volta da leitura
# (Introdução Geral ao Lecionário, n. 120-125: anúncio, palavras iniciais, "Palavra do Senhor"), escritos à mão.
# O livro aplica estas regras no build, sem IA (src/vitral/proclamacao.py). Exceções por leitura: data/inicios.yaml.

conclusoes:
  leitura: Palavra do Senhor.
  evangelho: Palavra da Salvação.

# Palavras iniciais, antes do texto. Terminam em vírgula; o texto segue em minúscula (salvo nome próprio).
aberturas:
  evangelho: "Naquele tempo,"
  discurso: "Naquele tempo, Jesus disse:"   # evangelho que começa no meio de uma fala (ver proclamacao.py)
  naqueles-dias: "Naqueles dias,"
  irmaos: "Irmãos,"
  carissimo: "Caríssimo,"
  carissimos: "Caríssimos,"

# Não se acrescenta abertura quando o texto já começa com marca de tempo.
dispensam_abertura:
  - Naquele
  - Naquela
  - Naqueles
  - Naquelas
  - No princípio
  - No primeiro dia
  - Ao anoitecer

# Nas cartas, também não: o texto já traz o vocativo ou o autor se apresentando.
dispensam_abertura_nas_cartas:
  - Irmãos
  - Meus irmãos
  - Caríssimo
  - Caríssimos
  - Amados
  - Meus amados
  - Filhinhos
  - Meus filhinhos
  - Paulo
  - Eu, Paulo
  - Pedro
  - Simão Pedro
  - Tiago
  - Judas
  - Eu, João

# Conjunção que abre o trecho e que se tira ao proclamar ("E Maria disse" -> "Maria disse").
conjuncoes_iniciais: [E, Mas, Pois, Então, Ora, Porém, Contudo]

