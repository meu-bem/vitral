# Exceções de abertura. Chave: o versículo onde a leitura começa (ex.: "Jo 5,17"; com letra, "Lc 9,11b").
# Vale para toda leitura do Lecionário que começa ali, qualquer que seja o fim.
#   abertura: palavras iniciais no lugar das automáticas ("" = nenhuma);
#   troca: [início, substituto], troca o começo do 1º versículo (ex.: "Ele lhes respondeu" -> "Jesus lhes respondeu");
#   motivo: por que a exceção existe.
# Sem exceção, valem as regras de data/formulas.yaml (src/vitral/proclamacao.py). O programa não adivinha o sujeito
# de um verbo solto: o Lecionário o escreve ("Jesus"), e aqui se faz o mesmo, à mão e com o motivo registrado.
