livro: DEU
fonte: oshb
versiculos:
  '4:1':
    texto: Agora, Israel, escuta os estatutos e os juízos que eu vos ensino a cumprir, para que vivais,
      entreis e possuais a terra que o Senhor, Deus dos vossos pais, vos dá.
    status: ia-sem-revisao
  '4:2':
    texto: Não acrescentareis nada à palavra que eu vos ordeno, nem tirareis dela, para guardardes os
      mandamentos do Senhor, vosso Deus, que eu vos ordeno.
    status: ia-sem-revisao
  '4:5':
    texto: 'Vede: eu vos ensinei estatutos e juízos, como me ordenou o Senhor, meu Deus, para que assim
      os cumprais no meio da terra em que ides entrar para a possuir.'
    status: ia-sem-revisao
  '4:6':
    texto: 'Guardai-os e cumpri-os, pois isso é a vossa sabedoria e o vosso entendimento aos olhos dos
      povos, que, ao ouvirem todos esses estatutos, dirão: “Este grande povo é de fato um povo sábio e
      inteligente.”'
    status: ia-sem-revisao
  '4:7':
    texto: Pois que grande nação tem deuses tão próximos de si como o Senhor, nosso Deus, está próximo
      de nós sempre que o invocamos?
    status: ia-sem-revisao
  '4:8':
    texto: E que grande nação tem estatutos e juízos tão justos como toda esta lei que hoje ponho diante
      de vós?
    status: ia-sem-revisao
  '4:9':
    texto: Mas guarda-te e guarda bem a tua alma, para que não esqueças as coisas que os teus olhos viram,
      e elas não se apartem do teu coração todos os dias da tua vida; ensina-as aos teus filhos e aos
      filhos dos teus filhos.
    status: ia-sem-revisao
  '4:32':
    texto: Pergunta, pois, aos dias antigos que te precederam, desde o dia em que Deus criou o homem sobre
      a terra, de uma extremidade do céu à outra, se aconteceu coisa tão grande como esta, ou se algo
      semelhante se ouviu.
    status: ia-sem-revisao
  '4:33':
    texto: Algum povo ouviu a voz de Deus falando do meio do fogo, como tu ouviste, e continuou vivo?
    status: ia-sem-revisao
  '4:34':
    texto: Ou tentou Deus vir tomar para si uma nação do meio de outra nação, com provas, sinais, prodígios
      e guerra, com mão forte e braço estendido e com grandes terrores, como tudo o que o Senhor, vosso
      Deus, fez por vós no Egito, diante dos teus olhos?
    status: ia-sem-revisao
  '4:35':
    texto: Foste tu quem o viste, para saberes que o Senhor é Deus e que não há outro além dele.
    status: ia-sem-revisao
  '4:36':
    texto: Do céu te fez ouvir a sua voz para te instruir, e sobre a terra te mostrou o seu grande fogo,
      e ouviste as suas palavras do meio do fogo.
    status: ia-sem-revisao
  '4:37':
    texto: Porque amou os teus pais, escolheu a sua descendência depois deles e te tirou do Egito, pessoalmente,
      com o seu grande poder,
    status: ia-sem-revisao
  '4:38':
    texto: para expulsar diante de ti nações maiores e mais fortes do que tu, e te fazer entrar e te dar
      a terra delas em herança, como hoje se vê.
    status: ia-sem-revisao
  '4:39':
    texto: Reconhece, pois, hoje e grava no teu coração que o Senhor é Deus, em cima, no céu, e embaixo,
      na terra; não há outro.
    status: ia-sem-revisao
  '4:40':
    texto: Guarda os seus estatutos e mandamentos que hoje te ordeno, para que sejas feliz, tu e os teus
      filhos depois de ti, e para que prolongues os teus dias sobre a terra que o Senhor, teu Deus, te
      dá por todos os dias.
    status: ia-sem-revisao
  '5:12':
    texto: Guarda o dia de sábado para o santificar, como te ordenou o Senhor, teu Deus.
    status: ia-sem-revisao
  '5:13':
    texto: Trabalharás seis dias e farás toda a tua obra,
    status: ia-sem-revisao
  '5:14':
    texto: mas o sétimo dia é sábado para o Senhor, teu Deus; não farás nenhum trabalho, nem tu, nem teu
      filho, nem tua filha, nem teu servo, nem tua serva, nem teu boi, nem teu jumento, nem qualquer dos
      teus animais, nem o estrangeiro que está dentro das tuas portas, para que o teu servo e a tua serva
      descansem como tu.
    status: ia-sem-revisao
  '5:15':
    texto: Lembra-te de que foste servo na terra do Egito e de que o Senhor, teu Deus, te tirou de lá
      com mão forte e braço estendido; por isso o Senhor, teu Deus, te ordenou que celebrasses o dia de
      sábado.
    status: ia-sem-revisao
  '6:2':
    texto: para que temas o Senhor, teu Deus, guardando todos os seus estatutos e mandamentos que eu te
      ordeno, tu, teu filho e o filho do teu filho, todos os dias da tua vida, e para que se prolonguem
      os teus dias.
    status: ia-sem-revisao
  '6:3':
    texto: Escuta, Israel, e procura cumprir o que te fará feliz e te multiplicará muito, como o Senhor,
      Deus dos teus pais, te falou, numa terra onde correm leite e mel.
    status: ia-sem-revisao
  '6:4':
    texto: 'Escuta, Israel: o Senhor é nosso Deus, o Senhor é um só.'
    status: ia-sem-revisao
    observacao: 'ou: o Senhor, nosso Deus, é o único Senhor.'
  '6:5':
    texto: Amarás o Senhor, teu Deus, com todo o teu coração, com toda a tua alma e com todas as tuas
      forças.
    status: ia-sem-revisao
  '6:6':
    texto: Estas palavras que hoje te ordeno estarão no teu coração.
    status: ia-sem-revisao
  '6:7':
    texto: Repeti-las-ás aos teus filhos e falarás delas quando estiveres sentado em tua casa, quando
      caminhares pela estrada, quando te deitares e quando te levantares.
    status: ia-sem-revisao
  '6:8':
    texto: Atá-las-ás como sinal na tua mão, e serão como faixas entre os teus olhos.
    status: ia-sem-revisao
  '6:9':
    texto: Escrevê-las-ás nos batentes da tua casa e nas tuas portas.
    status: ia-sem-revisao
  '6:10':
    texto: Quando o Senhor, teu Deus, te introduzir na terra que jurou aos teus pais, Abraão, Isaac e
      Jacó, que te daria, com cidades grandes e boas que não edificaste,
    status: ia-sem-revisao
  '6:11':
    texto: casas cheias de tudo o que é bom que não encheste, cisternas escavadas que não escavaste, vinhas
      e oliveiras que não plantaste, e comeres e te fartares,
    status: ia-sem-revisao
  '6:12':
    texto: guarda-te de esquecer o Senhor, que te tirou da terra do Egito, da casa da escravidão.
    status: ia-sem-revisao
  '6:13':
    texto: Ao Senhor, teu Deus, temerás; a ele servirás e pelo seu nome jurarás.
    status: ia-sem-revisao
  '7:6':
    texto: Pois és um povo santo para o Senhor, teu Deus; o Senhor, teu Deus, te escolheu para seres,
      dentre todos os povos que há sobre a face da terra, o povo de sua propriedade.
    status: ia-sem-revisao
  '7:7':
    texto: Não foi por serdes mais numerosos do que todos os povos que o Senhor se afeiçoou a vós e vos
      escolheu, pois sois o menor de todos os povos;
    status: ia-sem-revisao
  '7:8':
    texto: foi por amor do Senhor por vós e por guardar o juramento que fez aos vossos pais que o Senhor
      vos tirou com mão forte e te resgatou da casa da escravidão, da mão do faraó, rei do Egito.
    status: ia-sem-revisao
  '7:9':
    texto: Saberás, pois, que o Senhor, teu Deus, é Deus, o Deus fiel, que guarda a aliança e a misericórdia
      por mil gerações com os que o amam e guardam os seus mandamentos,
    status: ia-sem-revisao
  '7:10':
    texto: 'e retribui pessoalmente aos que o odeiam, destruindo-os; não tarda com quem o odeia: pessoalmente
      lhe retribui.'
    status: ia-sem-revisao
  '7:11':
    texto: Guarda, pois, o mandamento, os estatutos e os juízos que hoje te ordeno cumprir.
    status: ia-sem-revisao
  '8:2':
    texto: 'Lembrar-te-ás de todo o caminho que o Senhor, teu Deus, te fez percorrer durante estes quarenta
      anos no deserto, para te humilhar e te provar, a fim de saber o que havia no teu coração: se guardarias
      ou não os seus mandamentos.'
    status: ia-sem-revisao
  '8:3':
    texto: Humilhou-te, fez-te passar fome e te alimentou com o maná, que não conhecias nem conheciam
      os teus pais, para te ensinar que não só de pão vive o homem, mas de tudo o que procede da boca
      do Senhor vive o homem.
    status: ia-sem-revisao
  '8:14':
    texto: o teu coração se elevará, e esquecerás o Senhor, teu Deus, que te tirou da terra do Egito,
      da casa da escravidão,
    partes:
    - o teu coração se elevará,
    - e esquecerás o Senhor, teu Deus, que te tirou da terra do Egito, da casa da escravidão,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '8:15':
    texto: que te conduziu por esse deserto grande e terrível, de serpentes ardentes, escorpiões e sede,
      terra sem água, e fez sair para ti água da rocha dura;
    status: ia-sem-revisao
  '8:16':
    texto: que no deserto te alimentou com o maná, que os teus pais não conheciam, para te humilhar e
      te provar, para te fazer bem no teu futuro.
    partes:
    - que no deserto te alimentou com o maná, que os teus pais não conheciam, para te humilhar e te provar,
    - para te fazer bem no teu futuro.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '10:12':
    texto: Agora, Israel, que te pede o Senhor, teu Deus, senão que temas o Senhor, teu Deus, andes em
      todos os seus caminhos, o ames e sirvas o Senhor, teu Deus, com todo o teu coração e com toda a
      tua alma,
    status: ia-sem-revisao
  '10:13':
    texto: guardando os mandamentos do Senhor e os seus estatutos, que hoje te ordeno, para o teu bem?
    status: ia-sem-revisao
  '10:14':
    texto: Eis que ao Senhor, teu Deus, pertencem o céu, o céu dos céus, a terra e tudo o que nela há.
    status: ia-sem-revisao
  '10:15':
    texto: No entanto, foi dos teus pais que o Senhor se agradou, amando-os, e escolheu a descendência
      deles depois deles, a vós, entre todos os povos, como hoje se vê.
    status: ia-sem-revisao
  '10:16':
    texto: Circuncidai, pois, o prepúcio do vosso coração e não endureçais mais a vossa nuca.
    status: ia-sem-revisao
  '10:17':
    texto: Porque o Senhor, vosso Deus, é o Deus dos deuses e o Senhor dos senhores, o Deus grande, forte
      e terrível, que não faz acepção de pessoas nem aceita suborno,
    status: ia-sem-revisao
  '10:18':
    texto: que faz justiça ao órfão e à viúva, ama o estrangeiro e lhe dá pão e roupa.
    status: ia-sem-revisao
  '10:19':
    texto: Amai, pois, o estrangeiro, porque fostes estrangeiros na terra do Egito.
    status: ia-sem-revisao
  '10:20':
    texto: Ao Senhor, teu Deus, temerás; a ele servirás, a ele te apegarás e pelo seu nome jurarás.
    status: ia-sem-revisao
  '10:21':
    texto: Ele é o teu louvor e o teu Deus, que fez contigo essas coisas grandes e terríveis que os teus
      olhos viram.
    status: ia-sem-revisao
  '10:22':
    texto: Com setenta pessoas desceram os teus pais ao Egito, e agora o Senhor, teu Deus, te fez numeroso
      como as estrelas do céu.
    status: ia-sem-revisao
  '11:18':
    texto: Colocai estas minhas palavras no vosso coração e na vossa alma; atai-as como sinal na vossa
      mão, e serão como faixas entre os vossos olhos.
    status: ia-sem-revisao
  '11:26':
    texto: 'Vede: ponho hoje diante de vós a bênção e a maldição:'
    status: ia-sem-revisao
  '11:27':
    texto: a bênção, se ouvirdes os mandamentos do Senhor, vosso Deus, que hoje vos ordeno;
    status: ia-sem-revisao
  '11:28':
    texto: e a maldição, se não ouvirdes os mandamentos do Senhor, vosso Deus, e vos desviardes do caminho
      que hoje vos ordeno, indo atrás de outros deuses que não conhecestes.
    status: ia-sem-revisao
  '18:15':
    texto: O Senhor, teu Deus, suscitará para ti, do meio de ti, dentre os teus irmãos, um profeta como
      eu; a ele ouvireis.
    status: ia-sem-revisao
  '18:16':
    texto: 'Foi isso que pediste ao Senhor, teu Deus, no Horeb, no dia da assembleia, quando disseste:
      “Não quero continuar a ouvir a voz do Senhor, meu Deus, nem ver este grande fogo, para que não morra.”'
    status: ia-sem-revisao
  '18:17':
    texto: 'O Senhor me disse: “Fizeram bem em falar assim.'
    status: ia-sem-revisao
  '18:18':
    texto: Suscitarei para eles, do meio de seus irmãos, um profeta como tu; porei as minhas palavras
      na sua boca, e ele lhes dirá tudo o que eu lhe ordenar.
    status: ia-sem-revisao
  '18:19':
    texto: Se alguém não ouvir as minhas palavras, que ele falará em meu nome, eu lhe pedirei contas.
    status: ia-sem-revisao
  '18:20':
    texto: Mas o profeta que tiver a presunção de dizer em meu nome uma palavra que não lhe ordenei dizer,
      ou que falar em nome de outros deuses, esse profeta morrerá.”
    status: ia-sem-revisao
  '26:4':
    texto: O sacerdote tomará o cesto da tua mão e o colocará diante do altar do Senhor, teu Deus.
    status: ia-sem-revisao
  '26:5':
    texto: 'Então tomarás a palavra e dirás diante do Senhor, teu Deus: “Meu pai era um arameu à beira
      da morte; desceu ao Egito e ali viveu como estrangeiro, com poucas pessoas, e ali se tornou uma
      nação grande, forte e numerosa.'
    status: ia-sem-revisao
    observacao: 'ou: arameu errante.'
  '26:6':
    texto: Os egípcios nos maltrataram, nos oprimiram e nos impuseram uma dura servidão.
    status: ia-sem-revisao
  '26:7':
    texto: Clamamos ao Senhor, Deus dos nossos pais, e o Senhor ouviu a nossa voz, viu a nossa aflição,
      o nosso trabalho e a nossa opressão.
    status: ia-sem-revisao
  '26:8':
    texto: O Senhor nos tirou do Egito com mão forte e braço estendido, com grande terror, sinais e prodígios.
    status: ia-sem-revisao
  '26:9':
    texto: Trouxe-nos a este lugar e nos deu esta terra, terra onde correm leite e mel.
    status: ia-sem-revisao
  '26:10':
    texto: Agora trouxe as primícias do fruto da terra que me deste, Senhor.” Então as depositarás diante
      do Senhor, teu Deus, e te prostrarás diante do Senhor, teu Deus.
    status: ia-sem-revisao
  '26:16':
    texto: Hoje o Senhor, teu Deus, te ordena cumprir estes estatutos e juízos; guarda-os e cumpre-os
      com todo o teu coração e com toda a tua alma.
    status: ia-sem-revisao
  '26:17':
    texto: Hoje declaraste que o Senhor será o teu Deus, que andarás nos seus caminhos, guardarás os seus
      estatutos, mandamentos e juízos e ouvirás a sua voz.
    status: ia-sem-revisao
  '26:18':
    texto: E o Senhor hoje declarou que serás o povo de sua propriedade, como te falou, para guardares
      todos os seus mandamentos,
    status: ia-sem-revisao
  '26:19':
    texto: e para te elevar acima de todas as nações que fez, em louvor, renome e glória, e para que sejas
      um povo santo para o Senhor, teu Deus, como falou.
    status: ia-sem-revisao
  '30:10':
    texto: Quando ouvires a voz do Senhor, teu Deus, guardando os seus mandamentos e estatutos escritos
      neste livro da lei, quando te converteres ao Senhor, teu Deus, com todo o teu coração e com toda
      a tua alma.
    status: ia-sem-revisao
  '30:11':
    texto: Pois este mandamento que hoje te ordeno não é demasiado difícil para ti, nem está longe.
    status: ia-sem-revisao
  '30:12':
    texto: 'Não está no céu, para que digas: “Quem subirá por nós ao céu, para o tomar e fazer-nos ouvi-lo,
      a fim de o cumprirmos?”'
    status: ia-sem-revisao
  '30:13':
    texto: 'Nem está além do mar, para que digas: “Quem atravessará por nós o mar, para o tomar e fazer-nos
      ouvi-lo, a fim de o cumprirmos?”'
    status: ia-sem-revisao
  '30:14':
    texto: Pois a palavra está muito perto de ti, na tua boca e no teu coração, para a cumprires.
    status: ia-sem-revisao
  '30:15':
    texto: 'Vê: hoje ponho diante de ti a vida e o bem, a morte e o mal.'
    status: ia-sem-revisao
  '30:16':
    texto: Se hoje te ordeno amar o Senhor, teu Deus, andar nos seus caminhos e guardar os seus mandamentos,
      estatutos e juízos, viverás e te multiplicarás, e o Senhor, teu Deus, te abençoará na terra em que
      vais entrar para a possuir.
    status: ia-sem-revisao
  '30:17':
    texto: Mas, se o teu coração se desviar e não escutares, e fores seduzido a prostrar-te diante de
      outros deuses e a servi-los,
    status: ia-sem-revisao
  '30:18':
    texto: hoje vos declaro que certamente perecereis; não prolongareis os dias sobre a terra que vais
      possuir ao passar o Jordão.
    status: ia-sem-revisao
  '30:19':
    texto: 'Hoje tomo por testemunhas contra vós o céu e a terra: ponho diante de ti a vida e a morte,
      a bênção e a maldição. Escolhe a vida, para que vivas, tu e a tua descendência,'
    status: ia-sem-revisao
  '30:20':
    texto: amando o Senhor, teu Deus, ouvindo a sua voz e apegando-te a ele, pois ele é a tua vida e a
      duração dos teus dias, para habitares na terra que o Senhor jurou dar aos teus pais, Abraão, Isaac
      e Jacó.
    status: ia-sem-revisao
  '31:1':
    texto: Moisés foi e disse estas palavras a todo o Israel.
    status: ia-sem-revisao
  '31:2':
    texto: 'Disse-lhes: “Hoje tenho cento e vinte anos; já não posso sair nem entrar, e o Senhor me disse:
      ‘Não atravessarás este Jordão.’'
    status: ia-sem-revisao
  '31:3':
    texto: O Senhor, teu Deus, é quem passa diante de ti; ele destruirá estas nações diante de ti, e as
      possuirás. Josué é quem passará diante de ti, como o Senhor falou.
    status: ia-sem-revisao
  '31:4':
    texto: O Senhor lhes fará como fez a Seon e a Og, reis dos amorreus, e à sua terra, que destruiu.
    status: ia-sem-revisao
  '31:5':
    texto: O Senhor os entregará diante de vós, e fareis com eles segundo todo o mandamento que vos ordenei.
    status: ia-sem-revisao
  '31:6':
    texto: Sede fortes e corajosos; não temais nem vos assusteis diante deles, porque o Senhor, teu Deus,
      é quem caminha contigo; não te deixará nem te abandonará.”
    status: ia-sem-revisao
  '31:7':
    texto: 'Moisés chamou Josué e lhe disse, diante de todo o Israel: “Sê forte e corajoso, pois tu entrarás
      com este povo na terra que o Senhor jurou aos seus pais dar-lhes, e tu a repartirás em herança entre
      eles.'
    status: ia-sem-revisao
  '31:8':
    texto: O Senhor é quem vai diante de ti; ele estará contigo, não te deixará nem te abandonará. Não
      temas nem te acovardes.”
    status: ia-sem-revisao
  '32:3':
    texto: Pois invocarei o nome do Senhor; dai grandeza ao nosso Deus!
    status: ia-sem-revisao
  '32:4':
    texto: 'A Rocha: perfeita é a sua obra, pois todos os seus caminhos são justiça; Deus fiel, sem injustiça,
      justo e reto é ele.'
    partes:
    - 'A Rocha: perfeita é a sua obra,'
    - pois todos os seus caminhos são justiça;
    - Deus fiel, sem injustiça,
    - justo e reto é ele.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '32:7':
    texto: 'Lembra-te dos dias antigos, considera os anos de geração em geração; pergunta ao teu pai,
      e ele te contará, aos teus anciãos, e eles te dirão:'
    status: ia-sem-revisao
  '32:8':
    texto: Quando o Altíssimo repartiu as nações em herança, quando separou os filhos de Adão, fixou os
      limites dos povos segundo o número dos filhos de Israel.
    status: ia-sem-revisao
  '32:9':
    texto: Pois a porção do Senhor é o seu povo; Jacó é a parte da sua herança.
    status: ia-sem-revisao
  '32:12':
    texto: Só o Senhor o conduziu, e não havia com ele deus estrangeiro.
    status: ia-sem-revisao
  '32:18':
    texto: Abandonaste a Rocha que te gerou e esqueceste o Deus que te deu à luz.
    status: ia-sem-revisao
  '32:19':
    texto: O Senhor viu e se irritou com a provocação dos seus filhos e filhas.
    status: ia-sem-revisao
  '32:20':
    texto: 'Disse: “Esconderei deles o meu rosto e verei qual será o seu fim, pois são uma geração perversa,
      filhos em quem não há fidelidade.'
    status: ia-sem-revisao
  '32:21':
    texto: Provocaram o meu ciúme com o que não é Deus, irritaram-me com os seus ídolos vãos; eu provocarei
      o seu ciúme com o que não é povo, irritá-los-ei com uma nação insensata.
    status: ia-sem-revisao
  '32:26':
    texto: 'Eu disse: ‘Dispersá-los-ei, apagarei entre os homens a sua memória’,'
    status: ia-sem-revisao
  '32:27':
    texto: 'se eu não temesse a provocação do inimigo, que os seus adversários se enganassem e dissessem:
      ‘A nossa mão se exaltou, e não foi o Senhor quem fez tudo isso.’'
    status: ia-sem-revisao
  '32:28':
    texto: Pois são uma nação que perdeu o conselho, e não há neles inteligência.
    status: ia-sem-revisao
  '32:30':
    texto: Como um só perseguiria mil, e dois porão em fuga dez mil, se a sua Rocha não os tivesse vendido,
      e o Senhor não os tivesse entregue?
    status: ia-sem-revisao
  '32:35':
    texto: Minha é a vingança e a retribuição, no tempo em que o seu pé vacilar, pois está próximo o dia
      da sua ruína, e depressa vem o que lhes está preparado.
    partes:
    - Minha é a vingança e a retribuição,
    - no tempo em que o seu pé vacilar,
    - pois está próximo o dia da sua ruína,
    - e depressa vem o que lhes está preparado.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '32:36':
    texto: Pois o Senhor julgará o seu povo e se compadecerá dos seus servos, quando vir que a força se
      foi e que já não há retido nem abandonado.
    partes:
    - Pois o Senhor julgará o seu povo
    - e se compadecerá dos seus servos,
    - quando vir que a força se foi
    - e que já não há retido nem abandonado.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '32:39':
    texto: Vede agora que eu, eu o sou, e não há deus junto de mim; eu faço morrer e faço viver, firo,
      e eu curarei, e ninguém livra da minha mão.
    partes:
    - Vede agora que eu, eu o sou,
    - e não há deus junto de mim;
    - eu faço morrer e faço viver,
    - firo, e eu curarei, e ninguém livra da minha mão.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '32:41':
    texto: Se afiar o brilho da minha espada e a minha mão tomar o juízo, retribuirei a vingança aos meus
      adversários e pagarei aos que me odeiam.
    status: ia-sem-revisao
  '34:1':
    texto: 'Moisés subiu das estepes de Moab ao monte Nebo, ao cume do Fasga, defronte de Jericó, e o
      Senhor lhe mostrou toda a terra: Galaad até Dã,'
    status: ia-sem-revisao
  '34:2':
    texto: todo o Neftali, a terra de Efraim e Manassés, toda a terra de Judá até o mar ocidental,
    status: ia-sem-revisao
  '34:3':
    texto: o Negueb e o Círculo, o vale de Jericó, cidade das palmeiras, até Segor.
    status: ia-sem-revisao
  '34:4':
    texto: 'O Senhor lhe disse: “Esta é a terra que jurei a Abraão, Isaac e Jacó: ‘Darei à tua descendência.’
      Deixei que a vissem os teus olhos, mas não passarás para lá.”'
    status: ia-sem-revisao
  '34:5':
    texto: Ali morreu Moisés, servo do Senhor, na terra de Moab, conforme a palavra do Senhor.
    status: ia-sem-revisao
  '34:6':
    texto: Foi sepultado no vale, na terra de Moab, defronte de Bet-Fegor, e ninguém conhece o seu sepulcro
      até hoje.
    status: ia-sem-revisao
  '34:7':
    texto: Moisés tinha cento e vinte anos quando morreu; os seus olhos não se tinham enfraquecido, nem
      o seu vigor se tinha perdido.
    status: ia-sem-revisao
  '34:8':
    texto: Os filhos de Israel choraram Moisés nas estepes de Moab durante trinta dias, e assim se cumpriram
      os dias de choro do luto por Moisés.
    status: ia-sem-revisao
  '34:9':
    texto: Josué, filho de Nun, estava cheio do espírito de sabedoria, porque Moisés lhe impusera as mãos;
      e os filhos de Israel lhe obedeceram e fizeram como o Senhor ordenara a Moisés.
    status: ia-sem-revisao
  '34:10':
    texto: Nunca mais surgiu em Israel um profeta como Moisés, a quem o Senhor conhecia face a face,
    status: ia-sem-revisao
  '34:11':
    texto: por todos os sinais e prodígios que o Senhor o enviou fazer na terra do Egito, ao faraó, a
      todos os seus servos e a toda a sua terra,
    status: ia-sem-revisao
  '34:12':
    texto: e por toda a mão forte e por todo o grande terror que Moisés exerceu diante dos olhos de todo
      o Israel.
    status: ia-sem-revisao
