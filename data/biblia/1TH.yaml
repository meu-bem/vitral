livro: 1TH
fonte: sblgnt
versiculos:
  '1:1':
    texto: 'Paulo, Silvano e Timóteo, à Igreja dos tessalonicenses em Deus Pai e no Senhor Jesus Cristo:
      graça e paz a vós.'
    status: ia-sem-revisao
  '1:2':
    texto: Damos sempre graças a Deus por todos vós, fazendo memória de vós nas nossas orações,
    status: ia-sem-revisao
  '1:3':
    texto: Lembrando-nos sem cessar, diante de nosso Deus e Pai, da obra da vossa fé, do trabalho do vosso
      amor e da perseverança da vossa esperança em nosso Senhor Jesus Cristo,
    status: ia-sem-revisao
  '1:4':
    texto: Sabendo, irmãos amados por Deus, da vossa eleição,
    status: ia-sem-revisao
  '1:5':
    texto: Porque o nosso Evangelho não chegou até vós somente em palavra, mas também em poder, no Espírito
      Santo e em plena convicção, como sabeis que fomos entre vós, por vossa causa.
    status: ia-sem-revisao
  '1:6':
    texto: E vós vos tornastes imitadores nossos e do Senhor, acolhendo a palavra em meio a muita tribulação,
      com a alegria do Espírito Santo,
    status: ia-sem-revisao
  '1:7':
    texto: De modo que vos tornastes modelo para todos os que creem na Macedônia e na Acaia.
    status: ia-sem-revisao
  '1:8':
    texto: Pois de vós ressoou a palavra do Senhor, não somente na Macedônia e na Acaia, mas em todo lugar
      a vossa fé em Deus se divulgou, de modo que não precisamos dizer nada;
    status: ia-sem-revisao
  '1:9':
    texto: Eles mesmos contam a nosso respeito que acolhida tivemos entre vós, e como vos convertestes
      dos ídolos a Deus, para servir ao Deus vivo e verdadeiro,
    status: ia-sem-revisao
  '1:10':
    texto: E para esperar dos céus o seu Filho, a quem ressuscitou dos mortos, Jesus, que nos livra da
      ira que vem.
    status: ia-sem-revisao
  '2:1':
    texto: Vós mesmos sabeis, irmãos, que a nossa chegada entre vós não foi vã,
    status: ia-sem-revisao
  '2:2':
    texto: Mas, tendo antes sofrido e sido ultrajados em Filipos, como sabeis, tivemos a ousadia, em nosso
      Deus, de vos anunciar o Evangelho de Deus em meio a muito combate.
    status: ia-sem-revisao
  '2:3':
    texto: Pois a nossa exortação não procede de erro nem de impureza, nem se faz com engano,
    status: ia-sem-revisao
  '2:4':
    texto: Mas, como fomos aprovados por Deus para que nos fosse confiado o Evangelho, assim falamos,
      não para agradar aos homens, mas a Deus, que prova os nossos corações.
    status: ia-sem-revisao
  '2:5':
    texto: Nunca, de fato, usamos de palavras de adulação, como sabeis, nem de pretexto de ganância —
      Deus é testemunha —,
    status: ia-sem-revisao
  '2:6':
    texto: Nem buscamos glória dos homens, nem de vós nem de outros,
    status: ia-sem-revisao
  '2:7':
    texto: Embora pudéssemos impor-nos com autoridade como apóstolos de Cristo; mas fomos bondosos no
      meio de vós, como uma mãe que acalenta os seus próprios filhos.
    status: ia-sem-revisao
  '2:8':
    texto: Assim, ternamente afeiçoados a vós, queríamos dar-vos não só o Evangelho de Deus, mas também
      a nossa própria vida, porque vos tornastes muito queridos para nós.
    status: ia-sem-revisao
  '2:9':
    texto: 'Lembrai-vos, irmãos, do nosso trabalho e fadiga: trabalhando noite e dia para não pesar a
      nenhum de vós, proclamamos entre vós o Evangelho de Deus.'
    status: ia-sem-revisao
  '2:10':
    texto: Vós sois testemunhas, e Deus também, de como nos comportamos santa, justa e irrepreensivelmente
      para convosco, que credes,
    status: ia-sem-revisao
  '2:11':
    texto: Como sabeis que a cada um de vós, como um pai a seus filhos,
    status: ia-sem-revisao
  '2:12':
    texto: Exortávamos, consolávamos e conjurávamos, para que andásseis de modo digno de Deus, que vos
      chama ao seu Reino e glória.
    status: ia-sem-revisao
  '2:13':
    texto: Por isso também nós damos graças a Deus sem cessar, porque, ao receberdes a palavra de Deus
      que de nós ouvistes, a acolhestes não como palavra de homens, mas, como de fato é, como palavra
      de Deus, que também atua em vós, os que credes.
    status: ia-sem-revisao
  '2:14':
    texto: Pois vós, irmãos, vos tornastes imitadores das Igrejas de Deus que estão na Judeia em Cristo
      Jesus, porque sofrestes as mesmas coisas da parte dos vossos próprios compatriotas, como eles da
      parte dos judeus,
    status: ia-sem-revisao
  '2:15':
    texto: Que mataram o Senhor Jesus e os profetas e nos perseguiram, que não agradam a Deus e são contrários
      a todos os homens,
    status: ia-sem-revisao
  '2:16':
    texto: Impedindo-nos de falar às nações para que sejam salvas, completando sempre a medida dos seus
      pecados. Mas a ira chegou sobre eles até o fim.
    status: ia-sem-revisao
  '2:17':
    texto: Quanto a nós, irmãos, privados de vós por um breve tempo, de rosto e não de coração, desejamos
      com ainda maior empenho ver o vosso rosto, com grande saudade.
    status: ia-sem-revisao
  '2:18':
    texto: Por isso quisemos ir ter convosco — eu, Paulo, mais de uma vez —, mas Satanás nos impediu.
    status: ia-sem-revisao
  '2:19':
    texto: Pois quem é a nossa esperança, alegria ou coroa de glória — não sois vós? — diante de nosso
      Senhor Jesus, na sua vinda?
    status: ia-sem-revisao
  '2:20':
    texto: Sim, vós sois a nossa glória e alegria.
    status: ia-sem-revisao
  '3:1':
    texto: Por isso, não podendo mais suportar, resolvemos ficar sozinhos em Atenas,
    status: ia-sem-revisao
  '3:2':
    texto: E enviamos Timóteo, nosso irmão e colaborador de Deus no Evangelho de Cristo, para vos confirmar
      e exortar na vossa fé,
    status: ia-sem-revisao
  '3:3':
    texto: Para que ninguém se abale nestas tribulações. Vós mesmos sabeis que fomos destinados a isto;
    status: ia-sem-revisao
  '3:4':
    texto: Pois, quando estávamos convosco, vos predizíamos que haveríamos de sofrer tribulações, como
      aconteceu e sabeis.
    status: ia-sem-revisao
  '3:5':
    texto: Por isso também eu, não podendo mais suportar, enviei para conhecer a vossa fé, temendo que
      o tentador vos tivesse tentado e o nosso trabalho fosse em vão.
    status: ia-sem-revisao
  '3:6':
    texto: Agora, porém, tendo chegado Timóteo de junto de vós e dado boas notícias da vossa fé e do vosso
      amor, e de que guardais boa lembrança de nós, desejando ver-nos, como também nós a vós,
    status: ia-sem-revisao
  '3:7':
    texto: Por isso fomos consolados, irmãos, a vosso respeito, em toda a nossa necessidade e tribulação,
      pela vossa fé;
    status: ia-sem-revisao
  '3:8':
    texto: Pois agora vivemos, se vós permaneceis firmes no Senhor.
    status: ia-sem-revisao
  '3:9':
    texto: Que ação de graças podemos render a Deus por vós, por toda a alegria com que nos alegramos
      por vossa causa diante de nosso Deus,
    status: ia-sem-revisao
  '3:10':
    texto: Pedindo noite e dia, com insistência, para ver o vosso rosto e completar o que falta à vossa
      fé?
    status: ia-sem-revisao
  '3:11':
    texto: O próprio Deus, nosso Pai, e nosso Senhor Jesus dirijam o nosso caminho para vós;
    status: ia-sem-revisao
  '3:12':
    texto: E a vós o Senhor faça crescer e abundar no amor uns para com os outros e para com todos, como
      também nós para convosco,
    status: ia-sem-revisao
  '3:13':
    texto: Para confirmar os vossos corações irrepreensíveis em santidade diante de nosso Deus e Pai,
      na vinda de nosso Senhor Jesus com todos os seus santos.
    status: ia-sem-revisao
  '4:1':
    texto: Quanto ao mais, irmãos, pedimos e exortamos no Senhor Jesus que, como de nós recebestes a maneira
      de andar e agradar a Deus — e já assim andais —, progridais ainda mais.
    status: ia-sem-revisao
  '4:2':
    texto: Sabeis, com efeito, que instruções vos demos da parte do Senhor Jesus.
    status: ia-sem-revisao
  '4:3':
    texto: 'Pois esta é a vontade de Deus: a vossa santificação, que vos abstenhais da imoralidade,'
    status: ia-sem-revisao
  '4:4':
    texto: Que cada um de vós saiba possuir o seu próprio corpo em santidade e honra,
    status: ia-sem-revisao
  '4:5':
    texto: Não em paixão de desejo, como as nações que não conhecem a Deus,
    status: ia-sem-revisao
  '4:6':
    texto: Que ninguém ofenda nem defraude o seu irmão neste assunto, pois o Senhor é vingador de todas
      estas coisas, como já vos dissemos e atestamos.
    status: ia-sem-revisao
  '4:7':
    texto: Pois Deus não nos chamou para a impureza, mas para a santidade.
    status: ia-sem-revisao
  '4:8':
    texto: Assim, quem rejeita isto não rejeita um homem, mas a Deus, que também vos dá o seu Espírito
      Santo.
    status: ia-sem-revisao
  '4:9':
    texto: Quanto ao amor fraterno, não precisais que vos escrevamos, pois vós mesmos fostes ensinados
      por Deus a amar-vos uns aos outros;
    status: ia-sem-revisao
  '4:10':
    texto: E de fato o fazeis com todos os irmãos em toda a Macedônia. Exortamo-vos, porém, irmãos, a
      progredir ainda mais,
    status: ia-sem-revisao
  '4:11':
    texto: E a procurar viver tranquilamente, cuidar dos vossos assuntos e trabalhar com as vossas mãos,
      como vos recomendamos,
    status: ia-sem-revisao
  '4:12':
    texto: Para que vos comporteis decentemente diante dos de fora e não tenhais necessidade de ninguém.
    status: ia-sem-revisao
  '4:13':
    texto: Não queremos, irmãos, que ignoreis a sorte dos que adormeceram, para que não vos entristeçais
      como os demais, que não têm esperança.
    status: ia-sem-revisao
  '4:14':
    texto: Pois, se cremos que Jesus morreu e ressuscitou, assim também Deus, por meio de Jesus, levará
      consigo os que adormeceram.
    status: ia-sem-revisao
  '4:15':
    texto: 'Isto vos dizemos por palavra do Senhor: nós, os vivos, que ficarmos até a vinda do Senhor,
      não precederemos os que adormeceram;'
    status: ia-sem-revisao
  '4:16':
    texto: Pois o próprio Senhor, com uma ordem, com voz de arcanjo e com trombeta de Deus, descerá do
      céu, e os mortos em Cristo ressuscitarão primeiro;
    status: ia-sem-revisao
  '4:17':
    texto: Depois nós, os vivos, que tivermos ficado, seremos arrebatados juntamente com eles, nas nuvens,
      ao encontro do Senhor, nos ares; e assim estaremos sempre com o Senhor.
    status: ia-sem-revisao
  '4:18':
    texto: Consolai-vos, pois, uns aos outros com estas palavras.
    status: ia-sem-revisao
  '5:1':
    texto: Quanto aos tempos e momentos, irmãos, não precisais que vos escrevamos,
    status: ia-sem-revisao
  '5:2':
    texto: Pois vós mesmos sabeis perfeitamente que o dia do Senhor vem como um ladrão na noite.
    status: ia-sem-revisao
  '5:3':
    texto: 'Quando disserem: “Paz e segurança”, então lhes sobrevirá de repente a ruína, como as dores
      à mulher grávida, e não escaparão.'
    status: ia-sem-revisao
  '5:4':
    texto: Vós, porém, irmãos, não estais nas trevas, para que esse dia vos surpreenda como um ladrão;
    status: ia-sem-revisao
  '5:5':
    texto: Pois todos vós sois filhos da luz e filhos do dia. Não somos da noite nem das trevas.
    status: ia-sem-revisao
  '5:6':
    texto: Portanto, não durmamos como os demais, mas vigiemos e sejamos sóbrios.
    status: ia-sem-revisao
  '5:7':
    texto: Pois os que dormem dormem de noite, e os que se embriagam embriagam-se de noite;
    status: ia-sem-revisao
  '5:8':
    texto: Nós, porém, que somos do dia, sejamos sóbrios, revestidos da couraça da fé e do amor e do capacete
      da esperança da salvação,
    status: ia-sem-revisao
  '5:9':
    texto: Pois Deus não nos destinou para a ira, mas para alcançarmos a salvação por nosso Senhor Jesus
      Cristo,
    status: ia-sem-revisao
  '5:10':
    texto: Que morreu por nós, para que, quer vigiemos, quer durmamos, vivamos juntos com ele.
    status: ia-sem-revisao
  '5:11':
    texto: Por isso, consolai-vos uns aos outros e edificai-vos mutuamente, como já fazeis.
    status: ia-sem-revisao
  '5:12':
    texto: Pedimos-vos, irmãos, que reconheçais os que trabalham entre vós, os que vos presidem no Senhor
      e vos advertem,
    status: ia-sem-revisao
  '5:13':
    texto: E que os tenhais em máxima consideração, no amor, por causa da sua obra. Vivei em paz entre
      vós.
    status: ia-sem-revisao
  '5:14':
    texto: 'Exortamo-vos, irmãos: adverti os desordeiros, consolai os desanimados, amparai os fracos,
      sede pacientes com todos.'
    status: ia-sem-revisao
  '5:15':
    texto: Cuidai que ninguém pague a outrem mal com mal; procurai sempre o bem uns para com os outros
      e para com todos.
    status: ia-sem-revisao
  '5:16':
    texto: Alegrai-vos sempre,
    status: ia-sem-revisao
  '5:17':
    texto: Orai sem cessar,
    status: ia-sem-revisao
  '5:18':
    texto: Em tudo dai graças; pois esta é a vontade de Deus em Cristo Jesus para convosco.
    status: ia-sem-revisao
  '5:19':
    texto: Não extingais o Espírito,
    status: ia-sem-revisao
  '5:20':
    texto: Não desprezeis as profecias;
    status: ia-sem-revisao
  '5:21':
    texto: Examinai tudo, retende o que é bom,
    status: ia-sem-revisao
  '5:22':
    texto: Abstende-vos de toda espécie de mal.
    status: ia-sem-revisao
  '5:23':
    texto: O próprio Deus da paz vos santifique totalmente, e o vosso espírito, a vossa alma e o vosso
      corpo sejam conservados íntegros e irrepreensíveis na vinda de nosso Senhor Jesus Cristo.
    status: ia-sem-revisao
  '5:24':
    texto: Fiel é aquele que vos chama, e ele o fará.
    status: ia-sem-revisao
  '5:25':
    texto: Irmãos, orai por nós.
    status: ia-sem-revisao
  '5:26':
    texto: Saudai todos os irmãos com um beijo santo.
    status: ia-sem-revisao
  '5:27':
    texto: Conjuro-vos, pelo Senhor, que esta carta seja lida a todos os irmãos.
    status: ia-sem-revisao
  '5:28':
    texto: A graça de nosso Senhor Jesus Cristo esteja convosco.
    status: ia-sem-revisao
