livro: ISA
fonte: oshb
versiculos:
  '1:10':
    texto: Ouvi a palavra do Senhor, chefes de Sodoma; escutai a instrução do nosso Deus, povo de Gomorra.
    status: ia-sem-revisao
  '1:11':
    texto: De que me serve a multidão dos vossos sacrifícios?, diz o Senhor. Estou farto de holocaustos
      de carneiros e da gordura de animais cevados; não me agrado do sangue de touros, cordeiros e bodes.
    status: ia-sem-revisao
  '1:12':
    texto: Quando vindes comparecer diante de mim, quem vos pediu que pisásseis os meus átrios?
    status: ia-sem-revisao
  '1:13':
    texto: 'Não continueis a trazer ofertas vãs: o incenso é para mim uma abominação. Lua nova, sábado
      e assembleias: não suporto o crime junto com a festa.'
    status: ia-sem-revisao
  '1:14':
    texto: As vossas luas novas e as vossas solenidades, a minha alma as odeia; tornaram-se para mim um
      fardo; estou cansado de os carregar.
    status: ia-sem-revisao
  '1:15':
    texto: 'Quando estendeis as mãos, escondo de vós os meus olhos; ainda que multipliqueis as orações,
      não as ouvirei: as vossas mãos estão cheias de sangue.'
    status: ia-sem-revisao
  '1:16':
    texto: Lavai-vos, purificai-vos, tirai da minha vista a maldade das vossas ações; cessai de fazer
      o mal.
    status: ia-sem-revisao
  '1:17':
    texto: Aprendei a fazer o bem, buscai o direito, socorrei o oprimido, fazei justiça ao órfão, defendei
      a causa da viúva.
    status: ia-sem-revisao
  '1:18':
    texto: Vinde, pois, e discutamos, diz o Senhor. Ainda que os vossos pecados sejam como escarlate,
      ficarão brancos como a neve; ainda que sejam rubros como o carmesim, ficarão como a lã.
    status: ia-sem-revisao
  '1:19':
    texto: Se quiserdes e obedecerdes, comereis o que a terra tem de melhor;
    status: ia-sem-revisao
  '1:20':
    texto: mas, se recusardes e vos rebelardes, sereis devorados pela espada. Pois a boca do Senhor o
      disse.
    status: ia-sem-revisao
  '2:1':
    texto: Palavra que Isaías, filho de Amós, viu a respeito de Judá e de Jerusalém.
    status: ia-sem-revisao
  '2:2':
    texto: Acontecerá, nos dias futuros, que o monte da casa do Senhor será firmado no cimo dos montes
      e se elevará acima das colinas; e para ele afluirão todas as nações.
    status: ia-sem-revisao
  '2:3':
    texto: 'Virão muitos povos e dirão: “Vinde, subamos ao monte do Senhor, à casa do Deus de Jacó, para
      que nos ensine os seus caminhos e andemos nas suas veredas.” Pois de Sião sairá a lei, e a palavra
      do Senhor, de Jerusalém.'
    status: ia-sem-revisao
  '2:4':
    texto: Ele julgará entre as nações e será árbitro de muitos povos; estes forjarão das suas espadas
      arados e das suas lanças foices; uma nação não levantará a espada contra outra, e já não se instruirão
      para a guerra.
    status: ia-sem-revisao
  '2:5':
    texto: Casa de Jacó, vinde, andemos à luz do Senhor.
    status: ia-sem-revisao
  '4:2':
    texto: Naquele dia, o broto do Senhor será ornamento e glória, e o fruto da terra será orgulho e esplendor
      para os sobreviventes de Israel.
    status: ia-sem-revisao
  '4:3':
    texto: 'Quem ficar em Sião e quem sobrar em Jerusalém será chamado santo: todo aquele que estiver
      inscrito entre os vivos em Jerusalém.'
    status: ia-sem-revisao
  '4:4':
    texto: Quando o Senhor tiver lavado a imundície das filhas de Sião e purificado Jerusalém do sangue
      que há no seu meio, com um sopro de juízo e um sopro de fogo,
    status: ia-sem-revisao
  '4:5':
    texto: então o Senhor criará sobre todo o monte Sião e sobre as suas assembleias uma nuvem de dia,
      e fumaça e esplendor de fogo flamejante de noite; pois sobre toda a glória haverá um dossel.
    status: ia-sem-revisao
  '4:6':
    texto: Haverá uma tenda que dê sombra de dia contra o calor, e sirva de refúgio e abrigo contra a
      tempestade e a chuva.
    status: ia-sem-revisao
  '5:1':
    texto: Cantarei ao meu amado o cântico do meu amigo sobre a sua vinha. Meu amado tinha uma vinha numa
      fértil encosta.
    status: ia-sem-revisao
  '5:2':
    texto: Cavou-a, tirou-lhe as pedras e plantou nela vides escolhidas; edificou no meio dela uma torre
      e também escavou nela um lagar; esperava que desse uvas, mas deu uvas azedas.
    status: ia-sem-revisao
  '5:3':
    texto: Agora, habitantes de Jerusalém e homens de Judá, julgai entre mim e a minha vinha.
    status: ia-sem-revisao
  '5:4':
    texto: Que mais se podia fazer pela minha vinha que eu não tenha feito? Por que, esperando eu que
      desse uvas, deu uvas azedas?
    status: ia-sem-revisao
  '5:5':
    texto: 'Agora vos farei saber o que vou fazer à minha vinha: tirarei a sua cerca, e será devorada;
      derrubarei o seu muro, e será pisada.'
    status: ia-sem-revisao
  '5:6':
    texto: 'Farei dela uma ruína: não será podada nem capinada, e crescerão nela espinhos e abrolhos;
      e às nuvens ordenarei que não derramem chuva sobre ela.'
    status: ia-sem-revisao
  '5:7':
    texto: Pois a vinha do Senhor dos exércitos é a casa de Israel, e os homens de Judá são a sua plantação
      predileta. Ele esperava o direito, e eis o derramamento de sangue; esperava a justiça, e eis o grito
      dos oprimidos.
    status: ia-sem-revisao
  '6:1':
    texto: No ano em que morreu o rei Ozias, vi o Senhor sentado sobre um trono alto e elevado; a orla
      do seu manto enchia o templo.
    status: ia-sem-revisao
  '6:2':
    texto: 'Serafins estavam de pé acima dele; cada um tinha seis asas: com duas cobriam o rosto, com
      duas cobriam os pés e com duas voavam.'
    status: ia-sem-revisao
  '6:3':
    texto: 'Clamavam uns para os outros: “Santo, santo, santo é o Senhor dos exércitos; toda a terra está
      cheia da sua glória.”'
    status: ia-sem-revisao
  '6:4':
    texto: Os batentes das portas estremeceram à voz de quem clamava, e a casa encheu-se de fumaça.
    status: ia-sem-revisao
  '6:5':
    texto: 'Eu disse: “Ai de mim, estou perdido! Pois sou um homem de lábios impuros e habito no meio
      de um povo de lábios impuros, e os meus olhos viram o Rei, o Senhor dos exércitos.”'
    status: ia-sem-revisao
  '6:6':
    texto: Voou então para mim um dos serafins, trazendo na mão uma brasa que tirara do altar com uma
      tenaz.
    status: ia-sem-revisao
  '6:7':
    texto: 'Tocou-me a boca e disse: “Eis que isto tocou os teus lábios: a tua culpa foi removida, e o
      teu pecado, perdoado.”'
    status: ia-sem-revisao
  '6:8':
    texto: 'Ouvi a voz do Senhor que dizia: “Quem enviarei? E quem irá por nós?” Eu respondi: “Eis-me
      aqui: envia-me.”'
    status: ia-sem-revisao
  '7:1':
    texto: No tempo de Acaz, filho de Joatão, filho de Ozias, rei de Judá, Rasin, rei da Síria, e Facéia,
      filho de Romelias, rei de Israel, subiram contra Jerusalém para a combater, mas não conseguiram
      vencê-la.
    status: ia-sem-revisao
  '7:2':
    texto: 'Anunciaram à casa de Davi: “A Síria está aliada a Efraim.” O coração de Acaz e o coração do
      seu povo tremeram, como as árvores da floresta tremem ao vento.'
    status: ia-sem-revisao
  '7:3':
    texto: 'O Senhor disse a Isaías: “Sai ao encontro de Acaz, tu e teu filho Searjasub, ao fim do canal
      do tanque superior, na estrada do campo do lavandeiro,'
    status: ia-sem-revisao
  '7:4':
    texto: 'e dize-lhe: Cuida de ficar calmo; não temas, e que o teu coração não desfaleça diante desses
      dois cotos de tições fumegantes, diante do furor da ira de Rasin e da Síria e do filho de Romelias.'
    status: ia-sem-revisao
  '7:5':
    texto: 'Porque a Síria, Efraim e o filho de Romelias tramaram o mal contra ti, dizendo:'
    status: ia-sem-revisao
  '7:6':
    texto: ‘Subamos contra Judá, aterrorizemo-la, abramos nela uma brecha e façamos reinar ali o filho
      de Tabeel.’
    status: ia-sem-revisao
  '7:7':
    texto: 'Assim diz o Senhor Deus: Isso não se firmará, não acontecerá.'
    status: ia-sem-revisao
  '7:8':
    texto: Pois a cabeça da Síria é Damasco, e a cabeça de Damasco é Rasin; e dentro de sessenta e cinco
      anos Efraim será destruído e deixará de ser povo.
    status: ia-sem-revisao
  '7:9':
    texto: A cabeça de Efraim é Samaria, e a cabeça de Samaria é o filho de Romelias. Se não crerdes,
      não subsistireis.”
    status: ia-sem-revisao
  '7:10':
    texto: 'O Senhor continuou a falar a Acaz:'
    status: ia-sem-revisao
  '7:11':
    texto: “Pede ao Senhor, teu Deus, um sinal, seja nas profundezas do abismo, seja nas alturas do alto.”
    status: ia-sem-revisao
  '7:12':
    texto: 'Acaz respondeu: “Não pedirei, não tentarei o Senhor.”'
    status: ia-sem-revisao
  '7:13':
    texto: 'Isaías disse: “Ouvi, casa de Davi: não vos basta cansar os homens, para cansardes também o
      meu Deus?'
    status: ia-sem-revisao
  '7:14':
    texto: 'Por isso o próprio Senhor vos dará um sinal: eis que a jovem está grávida e dará à luz um
      filho, e lhe porá o nome de Emanuel.'
    status: ia-sem-revisao
  '8:10':
    texto: Fazei planos, e serão frustrados; dai ordens, e não se cumprirão, porque Deus está conosco.
    status: ia-sem-revisao
  '8:23':
    texto: Contudo, não haverá mais trevas para a terra que estava angustiada. No passado, humilhou a
      terra de Zabulon e a terra de Neftali; no futuro, cobrirá de glória o caminho do mar, além do Jordão,
      a Galileia das nações.
    status: ia-sem-revisao
  '9:1':
    texto: O povo que andava nas trevas viu uma grande luz; sobre os que habitavam em terra de sombra
      de morte, uma luz brilhou.
    status: ia-sem-revisao
  '9:2':
    texto: Multiplicaste a nação, aumentaste a alegria; alegram-se diante de ti como se alegram na colheita,
      como exultam os que repartem o despojo.
    status: ia-sem-revisao
  '9:3':
    texto: Pois o jugo que o oprimia, a vara que lhe feria o ombro, o cetro do seu opressor, tu os quebraste
      como no dia de Madiã.
    status: ia-sem-revisao
  '9:5':
    texto: 'Porque um menino nos nasceu, um filho nos foi dado; o poder está sobre o seu ombro, e o seu
      nome será: Conselheiro admirável, Deus forte, Pai para sempre, Príncipe da paz.'
    status: ia-sem-revisao
  '9:6':
    texto: Grande será o seu domínio, e a paz não terá fim sobre o trono de Davi e sobre o seu reino,
      para o firmar e o sustentar com direito e justiça, desde agora e para sempre. O zelo do Senhor dos
      exércitos fará isto.
    status: ia-sem-revisao
  '10:5':
    texto: Ai da Assíria, vara da minha ira! O bastão que tem na mão é o meu furor.
    status: ia-sem-revisao
  '10:6':
    texto: Envio-a contra uma nação ímpia, e a ordeno contra o povo da minha ira, para saquear e pilhar
      e para o pisotear como a lama das ruas.
    status: ia-sem-revisao
  '10:7':
    texto: 'Mas ela não pensa assim, e o seu coração não planeja assim: o seu desejo é destruir e exterminar
      nações em grande número.'
    status: ia-sem-revisao
  '10:13':
    texto: 'Pois ele diz: “Fi-lo pela força da minha mão e pela minha sabedoria, porque sou inteligente;
      removi as fronteiras dos povos, saqueei os seus tesouros e, como um valente, derrubei os que estavam
      assentados.'
    status: ia-sem-revisao
  '10:14':
    texto: A minha mão achou, como um ninho, a riqueza dos povos; como se recolhem ovos abandonados, recolhi
      toda a terra; e não houve quem batesse asa, abrisse o bico ou piasse.”
    status: ia-sem-revisao
  '10:15':
    texto: Acaso o machado se gloria diante de quem o maneja? Ou a serra se engrandece diante de quem
      a move? Como se a vara movesse quem a levanta, como se o bastão levantasse quem não é de madeira!
    status: ia-sem-revisao
  '10:16':
    texto: Por isso o Senhor, o Senhor dos exércitos, enviará a doença aos seus robustos, e sob a sua
      glória acenderá uma fogueira como a de um incêndio.
    status: ia-sem-revisao
  '11:1':
    texto: Um ramo sairá do tronco de Jessé, e um rebento brotará das suas raízes.
    status: ia-sem-revisao
  '11:2':
    texto: 'Sobre ele repousará o espírito do Senhor: espírito de sabedoria e de inteligência, espírito
      de conselho e de fortaleza, espírito de conhecimento e de temor do Senhor.'
    status: ia-sem-revisao
  '11:3':
    texto: Ele se deleitará no temor do Senhor. Não julgará pelas aparências, nem decidirá pelo que ouvir
      dizer.
    status: ia-sem-revisao
  '11:4':
    texto: Julgará os fracos com justiça e decidirá com retidão em favor dos pobres da terra; ferirá a
      terra com a vara da sua boca e com o sopro dos seus lábios matará o ímpio.
    status: ia-sem-revisao
  '11:5':
    texto: A justiça será o cinto dos seus rins, e a fidelidade, o cinto dos seus flancos.
    status: ia-sem-revisao
  '11:6':
    texto: O lobo habitará com o cordeiro, e o leopardo se deitará com o cabrito; o bezerro, o leão novo
      e o animal cevado andarão juntos, e um menino pequeno os conduzirá.
    status: ia-sem-revisao
  '11:7':
    texto: A vaca e a ursa pastarão juntas, e as suas crias se deitarão juntas; e o leão comerá palha
      como o boi.
    status: ia-sem-revisao
  '11:8':
    texto: A criança de peito brincará sobre a toca da víbora, e a criança desmamada meterá a mão na cova
      da serpente.
    status: ia-sem-revisao
  '11:9':
    texto: Não se fará mal nem dano em todo o meu santo monte, porque a terra estará cheia do conhecimento
      do Senhor, como as águas cobrem o mar.
    status: ia-sem-revisao
  '11:10':
    texto: Naquele dia, a raiz de Jessé será erguida como bandeira para os povos; as nações a procurarão,
      e a sua morada será gloriosa.
    status: ia-sem-revisao
  '12:2':
    texto: Eis que Deus é a minha salvação; confiarei e não temerei, porque o Senhor é a minha força e
      o meu canto, e foi para mim a salvação.
    status: ia-sem-revisao
  '12:3':
    texto: Tirareis águas com alegria das fontes da salvação.
    status: ia-sem-revisao
  '12:4':
    texto: 'E direis naquele dia: “Dai graças ao Senhor, invocai o seu nome, anunciai entre os povos as
      suas obras, proclamai que o seu nome é sublime.'
    partes:
    - 'E direis naquele dia: “Dai graças ao Senhor,'
    - invocai o seu nome,
    - anunciai entre os povos as suas obras,
    - proclamai que o seu nome é sublime.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '12:5':
    texto: Cantai ao Senhor, porque fez coisas grandiosas; que isto seja conhecido em toda a terra.
    status: ia-sem-revisao
  '12:6':
    texto: Exulta e canta de alegria, habitante de Sião, porque grande é no meio de ti o Santo de Israel.”
    status: ia-sem-revisao
  '22:19':
    texto: Eu te expulsarei do teu posto, e do teu lugar serás derrubado.
    status: ia-sem-revisao
  '22:20':
    texto: Naquele dia, chamarei o meu servo Eliacim, filho de Helcias.
    status: ia-sem-revisao
  '22:21':
    texto: Eu o vestirei com a tua túnica, o cingirei com o teu cinto e entregarei o teu poder nas suas
      mãos; ele será um pai para os habitantes de Jerusalém e para a casa de Judá.
    status: ia-sem-revisao
  '22:22':
    texto: 'Porei sobre o seu ombro a chave da casa de Davi: ele abrirá, e ninguém fechará; fechará, e
      ninguém abrirá.'
    status: ia-sem-revisao
  '22:23':
    texto: Eu o fixarei como estaca em lugar seguro, e será um trono de glória para a casa de seu pai.
    status: ia-sem-revisao
  '25:6':
    texto: O Senhor dos exércitos preparará para todos os povos, neste monte, um banquete de carnes gordas,
      um banquete de vinhos velhos, de carnes gordas e medulosas, de vinhos velhos e depurados.
    status: ia-sem-revisao
  '25:7':
    texto: Neste monte rasgará o véu que cobre todos os povos e a coberta que envolve todas as nações.
    status: ia-sem-revisao
  '25:8':
    texto: Destruirá a morte para sempre; o Senhor Deus enxugará as lágrimas de todos os rostos e removerá
      de toda a terra a humilhação do seu povo, porque o Senhor falou.
    status: ia-sem-revisao
  '25:9':
    texto: 'Naquele dia se dirá: “Eis o nosso Deus, em quem esperamos para que nos salve; este é o Senhor
      em quem esperamos; exultemos e alegremo-nos na sua salvação.”'
    status: ia-sem-revisao
  '25:10':
    texto: Pois a mão do Senhor repousará sobre este monte, e Moab será pisado no seu lugar, como se pisa
      a palha no esterco.
    partes:
    - Pois a mão do Senhor repousará sobre este monte,
    - e Moab será pisado no seu lugar, como se pisa a palha no esterco.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '26:1':
    texto: 'Naquele dia, se cantará este cântico na terra de Judá: “Temos uma cidade forte; a salvação
      ele pôs por muralhas e baluarte.'
    status: ia-sem-revisao
  '26:2':
    texto: Abri as portas, para que entre uma nação justa, que guarda a fidelidade.
    status: ia-sem-revisao
  '26:3':
    texto: O coração firme, tu o guardas na paz, na paz, porque confia em ti.
    status: ia-sem-revisao
  '26:4':
    texto: Confiai no Senhor para sempre, porque o Senhor é a rocha eterna.
    status: ia-sem-revisao
  '26:5':
    texto: Pois ele humilhou os que habitavam nas alturas e abateu a cidade altaneira; abateu-a até o
      chão, derrubou-a até o pó.
    status: ia-sem-revisao
  '26:6':
    texto: Pisam-na os pés, os pés dos pobres, os passos dos fracos.
    status: ia-sem-revisao
  '26:7':
    texto: O caminho do justo é reto; tu, o Reto, aplainas a vereda do justo.
    status: ia-sem-revisao
  '26:8':
    texto: Também no caminho dos teus juízos, Senhor, esperamos em ti; o desejo da nossa alma é o teu
      nome e a tua lembrança.
    status: ia-sem-revisao
  '26:9':
    texto: De noite a minha alma suspira por ti; sim, o meu espírito dentro de mim te procura, pois, quando
      os teus juízos se exercem sobre a terra, os habitantes do mundo aprendem a justiça.
    status: ia-sem-revisao
  '26:12':
    texto: Senhor, tu nos concederás a paz, pois também todas as nossas obras tu as fizeste por nós.
    status: ia-sem-revisao
  '26:16':
    texto: Senhor, na angústia te procuraram; derramaram uma oração sussurrada quando a tua correção os
      atingiu.
    status: ia-sem-revisao
  '26:17':
    texto: Como a mulher grávida, prestes a dar à luz, se contorce e grita nas suas dores, assim fomos
      nós diante de ti, Senhor.
    status: ia-sem-revisao
  '26:18':
    texto: 'Concebemos, sentimos dores, mas, por assim dizer, demos à luz vento: não trouxemos a salvação
      à terra, nem nasceram habitantes para o mundo.'
    status: ia-sem-revisao
  '26:19':
    texto: Os teus mortos viverão, os seus cadáveres ressurgirão. Despertai e exultai, vós que habitais
      no pó, porque o teu orvalho é orvalho de luz, e a terra devolverá os mortos à vida.”
    status: ia-sem-revisao
  '29:17':
    texto: Não falta mais um pouco de tempo para que o Líbano se transforme em pomar, e o pomar seja considerado
      floresta?
    status: ia-sem-revisao
  '29:18':
    texto: Naquele dia, os surdos ouvirão as palavras de um livro, e, libertos da escuridão e das trevas,
      os olhos dos cegos verão.
    status: ia-sem-revisao
  '29:19':
    texto: Os humildes terão de novo alegria no Senhor, e os pobres exultarão no Santo de Israel.
    status: ia-sem-revisao
  '29:20':
    texto: Pois o tirano deixará de existir, o zombador desaparecerá, e serão exterminados todos os que
      espreitam para fazer o mal,
    status: ia-sem-revisao
  '29:21':
    texto: os que fazem o homem culpado por uma palavra, armam laços ao que defende no tribunal e, com
      futilidades, desviam o justo.
    status: ia-sem-revisao
  '29:22':
    texto: 'Por isso, assim diz o Senhor à casa de Jacó, ele que resgatou Abraão: Jacó já não será envergonhado,
      e o seu rosto já não empalidecerá.'
    status: ia-sem-revisao
  '29:23':
    texto: Pois, quando ele vir os seus filhos, obra das minhas mãos, no meio de si, santificarão o meu
      nome; santificarão o Santo de Jacó e temerão o Deus de Israel.
    status: ia-sem-revisao
  '29:24':
    texto: Os que erram de espírito virão a ter entendimento, e os murmuradores aceitarão a instrução.
    status: ia-sem-revisao
  '30:19':
    texto: Sim, povo de Sião, que habitas em Jerusalém, não chorarás mais. Ele certamente se compadecerá
      de ti à voz do teu clamor; ao ouvi-lo, te responderá.
    status: ia-sem-revisao
  '30:20':
    texto: O Senhor vos dará pão de angústia e água de aflição, mas o teu mestre já não se esconderá,
      e os teus olhos verão o teu mestre.
    status: ia-sem-revisao
  '30:21':
    texto: 'Os teus ouvidos ouvirão atrás de ti uma palavra que dirá: “Este é o caminho; andai por ele”,
      quando te desviares para a direita ou para a esquerda.'
    status: ia-sem-revisao
  '30:23':
    texto: Ele dará chuva para a semente que semeares na terra, e o pão, produto da terra, será abundante
      e substancioso; naquele dia o teu gado pastará em vastas pastagens.
    status: ia-sem-revisao
  '30:24':
    texto: Os bois e os jumentos que lavram a terra comerão forragem salgada, peneirada com a pá e o forcado.
    status: ia-sem-revisao
  '30:25':
    texto: Em todo monte alto e em toda colina elevada haverá riachos e correntes de água, no dia da grande
      matança, quando caírem as torres.
    status: ia-sem-revisao
  '30:26':
    texto: A luz da lua será como a luz do sol, e a luz do sol será sete vezes mais forte, como a luz
      de sete dias, no dia em que o Senhor atar a fratura do seu povo e curar a ferida dos seus golpes.
    status: ia-sem-revisao
  '35:1':
    texto: Alegrem-se o deserto e a terra seca; exulte a estepe e floresça como o narciso.
    status: ia-sem-revisao
  '35:2':
    texto: Cubra-se de flores e exulte com alegria e cantos de júbilo. A glória do Líbano lhe será dada,
      o esplendor do Carmelo e do Sarom; eles verão a glória do Senhor, o esplendor do nosso Deus.
    status: ia-sem-revisao
  '35:3':
    texto: Fortalecei as mãos enfraquecidas, firmai os joelhos vacilantes.
    status: ia-sem-revisao
  '35:4':
    texto: 'Dizei aos de coração aflito: “Sede fortes, não temais! Eis o vosso Deus; vem a vingança, a
      retribuição de Deus. Ele mesmo vem e vos salvará.”'
    status: ia-sem-revisao
  '35:5':
    texto: Então se abrirão os olhos dos cegos, e se desimpedirão os ouvidos dos surdos.
    status: ia-sem-revisao
  '35:6':
    texto: Então o coxo saltará como o cervo, e a língua do mudo cantará de alegria; pois águas jorrarão
      no deserto, e torrentes na estepe.
    partes:
    - Então o coxo saltará como o cervo, e a língua do mudo cantará de alegria;
    - pois águas jorrarão no deserto, e torrentes na estepe.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '35:7':
    texto: A terra seca se transformará em lago, e a terra sedenta, em fontes de água; no covil onde repousavam
      os chacais, haverá junco e papiro.
    partes:
    - A terra seca se transformará em lago, e a terra sedenta, em fontes de água;
    - no covil onde repousavam os chacais, haverá junco e papiro.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '35:8':
    texto: Haverá ali uma estrada, um caminho, que se chamará Caminho Santo. O impuro não passará por
      ele; será só para o povo dele, e os insensatos não se perderão nele.
    status: ia-sem-revisao
  '35:9':
    texto: Não haverá ali leão, e animal feroz não subirá por ele, nem ali se encontrará; ali andarão
      os resgatados.
    status: ia-sem-revisao
  '35:10':
    texto: Os redimidos do Senhor voltarão e entrarão em Sião com cantos de júbilo; alegria eterna coroará
      as suas cabeças; alcançarão o júbilo e a alegria, e fugirão a tristeza e o gemido.
    status: ia-sem-revisao
  '38:1':
    texto: 'Naqueles dias, Ezequias adoeceu mortalmente. O profeta Isaías, filho de Amós, foi ter com
      ele e lhe disse: “Assim diz o Senhor: Põe em ordem a tua casa, porque vais morrer e não viverás.”'
    status: ia-sem-revisao
  '38:2':
    texto: Ezequias voltou o rosto para a parede e orou ao Senhor.
    status: ia-sem-revisao
  '38:3':
    texto: 'Disse: “Ah, Senhor, lembra-te de que andei diante de ti com fidelidade e com coração íntegro,
      e fiz o que era bom aos teus olhos.” E Ezequias chorou amargamente.'
    status: ia-sem-revisao
  '38:4':
    texto: 'A palavra do Senhor foi dirigida a Isaías:'
    status: ia-sem-revisao
  '38:5':
    texto: '“Vai e dize a Ezequias: Assim diz o Senhor, Deus de Davi, teu pai: Ouvi a tua oração, vi as
      tuas lágrimas; eis que acrescento quinze anos à tua vida.'
    status: ia-sem-revisao
  '38:6':
    texto: Eu te livrarei, a ti e a esta cidade, das mãos do rei da Assíria, e protegerei esta cidade.
    status: ia-sem-revisao
  '38:7':
    texto: 'Este é o sinal que te dá o Senhor de que ele cumprirá a palavra que disse:'
    status: ia-sem-revisao
  '38:8':
    texto: Eis que farei voltar atrás dez graus a sombra que desceu nos degraus de Acaz com o sol.” E
      o sol voltou atrás dez graus nos degraus por onde tinha descido.
    status: ia-sem-revisao
  '38:10':
    texto: 'Eu disse: “No meio dos meus dias, devo ir às portas do abismo; fui privado do resto dos meus
      anos.”'
    status: ia-sem-revisao
  '38:11':
    texto: 'Eu disse: “Não verei mais o Senhor na terra dos vivos; não verei mais homem algum entre os
      habitantes do mundo.'
    status: ia-sem-revisao
  '38:12':
    texto: A minha morada foi arrancada e levada para longe de mim, como uma tenda de pastor. Como o tecelão,
      enrolei a minha vida; ele me corta do tear. Do dia até a noite me acabarás.
    status: ia-sem-revisao
  '38:16':
    texto: Senhor, por tais coisas se vive, e em tudo isto está a vida do meu espírito; tu me curarás
      e me darás vida.
    status: ia-sem-revisao
  '38:21':
    texto: 'Isaías disse: “Tragam uma pasta de figos e apliquem-na sobre a úlcera, e ele viverá.”'
    status: ia-sem-revisao
  '38:22':
    texto: 'Ezequias disse: “Qual é o sinal de que subirei à casa do Senhor?”'
    status: ia-sem-revisao
  '40:1':
    texto: Consolai, consolai o meu povo, diz o vosso Deus.
    status: ia-sem-revisao
  '40:2':
    texto: Falai ao coração de Jerusalém e proclamai-lhe que acabou o seu serviço, que a sua culpa está
      expiada, que recebeu da mão do Senhor o dobro por todos os seus pecados.
    status: ia-sem-revisao
  '40:3':
    texto: 'Uma voz clama: “No deserto abri um caminho para o Senhor; na estepe, aplainai uma estrada
      para o nosso Deus.'
    status: ia-sem-revisao
  '40:4':
    texto: Todo vale seja elevado, todo monte e colina sejam abaixados; o que é torto se endireite, e
      o terreno acidentado se aplaine.
    status: ia-sem-revisao
  '40:5':
    texto: Então a glória do Senhor se revelará, e toda carne a verá, pois a boca do Senhor o disse.”
    status: ia-sem-revisao
  '40:6':
    texto: 'Uma voz diz: “Clama!” Ele respondeu: “Que hei de clamar?” “Toda carne é erva, e toda a sua
      graça, como a flor do campo.'
    status: ia-sem-revisao
  '40:7':
    texto: A erva seca, a flor murcha, quando o sopro do Senhor passa sobre ela. Sim, o povo é erva.
    status: ia-sem-revisao
  '40:8':
    texto: A erva seca, a flor murcha, mas a palavra do nosso Deus permanece para sempre.”
    status: ia-sem-revisao
  '40:9':
    texto: 'Sobe a um monte alto, tu que anuncias boas notícias a Sião; levanta com força a voz, tu que
      anuncias boas notícias a Jerusalém; levanta-a, não temas; dize às cidades de Judá: “Eis o vosso
      Deus!”'
    status: ia-sem-revisao
  '40:10':
    texto: Eis que o Senhor Deus vem com poder, e o seu braço domina; eis que o seu salário está com ele,
      e a sua recompensa vai diante dele.
    status: ia-sem-revisao
  '40:11':
    texto: Como um pastor apascenta o seu rebanho, reúne os cordeiros com o braço e os leva ao colo; conduz
      com cuidado as ovelhas que amamentam.
    status: ia-sem-revisao
  '40:25':
    texto: A quem me comparareis, para que eu seja igual a ele?, diz o Santo.
    status: ia-sem-revisao
  '40:26':
    texto: 'Levantai os olhos para o alto e vede: quem criou estas coisas? Aquele que faz sair o seu exército
      em ordem contada e chama todos pelo nome; por causa da sua grande força e do seu poder, nenhum falta.'
    status: ia-sem-revisao
  '40:27':
    texto: 'Por que dizes, Jacó, e afirmas, Israel: “O meu caminho está oculto ao Senhor, e o meu direito
      passa despercebido ao meu Deus”?'
    status: ia-sem-revisao
  '40:28':
    texto: Não sabes? Não ouviste? O Senhor é o Deus eterno, criador dos confins da terra; não se cansa
      nem se fatiga, e a sua inteligência é insondável.
    status: ia-sem-revisao
  '40:29':
    texto: Dá força ao cansado e multiplica o vigor do que não tem forças.
    status: ia-sem-revisao
  '40:30':
    texto: Até os jovens se cansam e se fatigam, e os moços tropeçam e caem;
    status: ia-sem-revisao
  '40:31':
    texto: mas os que esperam no Senhor renovam as suas forças, sobem com asas como águias, correm e não
      se fatigam, caminham e não se cansam.
    status: ia-sem-revisao
  '41:13':
    texto: 'Pois eu sou o Senhor, teu Deus, que te seguro pela direita e te digo: Não temas, eu te ajudo.'
    status: ia-sem-revisao
  '41:14':
    texto: 'Não temas, vermezinho de Jacó, pequeno Israel: eu te ajudo, oráculo do Senhor; o teu redentor
      é o Santo de Israel.'
    status: ia-sem-revisao
  '41:15':
    texto: 'Eis que te faço um trilho novo, afiado, de muitos dentes: debulharás os montes e os esmagarás,
      e farás das colinas palha.'
    status: ia-sem-revisao
  '41:16':
    texto: Tu os joeirarás, o vento os levará, e o turbilhão os dispersará; e tu exultarás no Senhor,
      te gloriarás no Santo de Israel.
    status: ia-sem-revisao
  '41:17':
    texto: Os pobres e os indigentes procuram água, e não há; a sua língua está seca de sede. Eu, o Senhor,
      os atenderei; eu, o Deus de Israel, não os abandonarei.
    status: ia-sem-revisao
  '41:18':
    texto: Abrirei rios nas colinas desertas e fontes no meio dos vales; transformarei o deserto em lago
      e a terra seca em mananciais.
    status: ia-sem-revisao
  '41:19':
    texto: Plantarei no deserto cedros, acácias, murtas e oliveiras; porei na estepe ciprestes, ulmeiros
      e buxos, todos juntos,
    status: ia-sem-revisao
  '41:20':
    texto: para que vejam e saibam, considerem e compreendam todos juntos que a mão do Senhor fez isto
      e que o Santo de Israel o criou.
    status: ia-sem-revisao
  '42:1':
    texto: 'Eis o meu servo, a quem sustento, o meu eleito, em quem a minha alma se compraz. Pus nele
      o meu espírito: ele levará o direito às nações.'
    status: ia-sem-revisao
  '42:2':
    texto: Não clamará nem levantará a voz, nem fará ouvir a sua voz nas ruas.
    status: ia-sem-revisao
  '42:3':
    texto: Não quebrará a cana rachada, nem apagará a mecha que ainda fumega; fará brotar o direito com
      fidelidade.
    status: ia-sem-revisao
  '42:4':
    texto: Não desfalecerá nem esmorecerá, até estabelecer o direito na terra; e as ilhas esperam a sua
      instrução.
    status: ia-sem-revisao
  '42:5':
    texto: 'Assim diz Deus, o Senhor, que criou os céus e os estendeu, que firmou a terra e o que dela
      brota, que dá o sopro ao povo que nela está e o espírito aos que nela andam:'
    status: ia-sem-revisao
  '42:6':
    texto: “Eu, o Senhor, chamei-te com justiça, tomei-te pela mão, guardei-te e fiz de ti aliança do
      povo e luz das nações,
    status: ia-sem-revisao
  '42:7':
    texto: para abrires os olhos dos cegos, para tirares do cárcere os presos e da prisão os que habitam
      nas trevas.
    status: ia-sem-revisao
  '43:16':
    texto: Assim diz o Senhor, que abriu um caminho no mar e uma vereda nas águas impetuosas,
    status: ia-sem-revisao
  '43:17':
    texto: 'que fez sair carros e cavalos, exército e herói juntos: jazem ali, não se levantarão; extinguiram-se,
      apagaram-se como uma mecha.'
    status: ia-sem-revisao
  '43:18':
    texto: Não vos lembreis das coisas passadas, nem considereis as coisas antigas.
    status: ia-sem-revisao
  '43:19':
    texto: 'Eis que faço uma coisa nova: já está brotando; não o percebeis? Abrirei um caminho no deserto
      e rios na terra seca.'
    status: ia-sem-revisao
  '43:20':
    texto: Os animais do campo me glorificarão, os chacais e as avestruzes, porque dei água ao deserto
      e rios à terra seca, para dar de beber ao meu povo, ao meu eleito.
    status: ia-sem-revisao
  '43:21':
    texto: O povo que formei para mim proclamará o meu louvor.
    status: ia-sem-revisao
  '43:22':
    texto: Mas não foi a mim que invocaste, Jacó, porque te cansaste de mim, Israel.
    status: ia-sem-revisao
  '43:24':
    texto: Não compraste para mim cana aromática com dinheiro, nem me saciaste com a gordura dos teus
      sacrifícios; mas me sobrecarregaste com os teus pecados e me cansaste com as tuas culpas.
    partes:
    - Não compraste para mim cana aromática com dinheiro, nem me saciaste com a gordura dos teus sacrifícios;
    - mas me sobrecarregaste com os teus pecados e me cansaste com as tuas culpas.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '43:25':
    texto: Eu, eu mesmo, apago as tuas transgressões por amor de mim e não me lembro dos teus pecados.
    status: ia-sem-revisao
  '45:1':
    texto: 'Assim diz o Senhor ao seu ungido, a Ciro, que tomei pela mão direita para submeter nações
      diante dele e desatar o cinto dos reis, para abrir diante dele as portas, de modo que os portões
      não se fechem:'
    status: ia-sem-revisao
  '45:4':
    texto: Por causa de Jacó, meu servo, e de Israel, meu eleito, chamei-te pelo teu nome, dei-te um título,
      embora não me conhecesses.
    status: ia-sem-revisao
  '45:5':
    texto: Eu sou o Senhor, e não há outro; fora de mim não há Deus. Cingi-te, embora não me conhecesses,
    status: ia-sem-revisao
  '45:6':
    texto: para que se saiba, do nascer do sol ao seu ocaso, que fora de mim não há nada. Eu sou o Senhor,
      e não há outro.
    status: ia-sem-revisao
  '45:7':
    texto: Eu formo a luz e crio as trevas, faço a paz e crio a desgraça; eu, o Senhor, faço tudo isto.
    status: ia-sem-revisao
  '45:8':
    texto: Céus, destilai do alto, e as nuvens derramem a justiça; abra-se a terra e produza a salvação,
      e brote juntamente a justiça. Eu, o Senhor, a criei.
    status: ia-sem-revisao
  '45:18':
    texto: 'Pois assim diz o Senhor, que criou os céus — ele é Deus —, que formou a terra e a fez, ele
      a firmou, não a criou vazia, mas a formou para ser habitada: Eu sou o Senhor, e não há outro.'
    status: ia-sem-revisao
  '45:21':
    texto: 'Anunciai, apresentai as vossas provas, consultai-vos juntos: quem fez ouvir isto desde a antiguidade
      e o anunciou há muito tempo? Não fui eu, o Senhor? Fora de mim não há outro Deus; Deus justo e salvador,
      não há outro além de mim.'
    status: ia-sem-revisao
  '45:22':
    texto: Voltai-vos para mim e sede salvos, todos os confins da terra, pois eu sou Deus, e não há outro.
    status: ia-sem-revisao
  '45:23':
    texto: 'Por mim mesmo jurei; da minha boca saiu a justiça, uma palavra que não voltará atrás: diante
      de mim se dobrará todo joelho, e toda língua jurará por mim.'
    status: ia-sem-revisao
  '45:24':
    texto: 'Dir-se-á de mim: “Só no Senhor há justiça e força.” A ele virão envergonhados todos os que
      se irritavam contra ele.'
    status: ia-sem-revisao
  '45:25':
    texto: No Senhor serão justificados e se gloriarão todos os descendentes de Israel.
    status: ia-sem-revisao
  '48:17':
    texto: 'Assim diz o Senhor, o teu redentor, o Santo de Israel: Eu sou o Senhor, teu Deus, que te ensino
      para o teu bem e te guio pelo caminho que deves seguir.'
    status: ia-sem-revisao
  '48:18':
    texto: Se tivesses prestado atenção aos meus mandamentos, a tua paz seria como um rio, e a tua justiça,
      como as ondas do mar.
    status: ia-sem-revisao
  '48:19':
    texto: A tua descendência seria como a areia, e os filhos das tuas entranhas, como os seus grãos;
      o seu nome não seria cortado nem apagado da minha presença.
    status: ia-sem-revisao
  '49:1':
    texto: Ouvi-me, ilhas, e prestai atenção, povos distantes. O Senhor chamou-me desde o ventre, desde
      as entranhas de minha mãe pronunciou o meu nome.
    status: ia-sem-revisao
  '49:2':
    texto: Fez da minha boca uma espada afiada, escondeu-me à sombra da sua mão; fez de mim uma flecha
      polida, guardou-me na sua aljava.
    status: ia-sem-revisao
  '49:3':
    texto: 'Disse-me: “Tu és o meu servo, Israel, em quem me glorificarei.”'
    status: ia-sem-revisao
  '49:4':
    texto: 'Eu, porém, disse: “Em vão me cansei, gastei inutilmente a minha força por nada.” Mas o meu
      direito está com o Senhor, e a minha recompensa, com o meu Deus.'
    status: ia-sem-revisao
  '49:5':
    texto: E agora diz o Senhor, que me formou desde o ventre para ser seu servo, para reconduzir Jacó
      a ele e para que Israel seja reunido a ele — pois fui honrado aos olhos do Senhor, e o meu Deus
      tornou-se a minha força —
    status: ia-sem-revisao
    observacao: 'O hebraico escrito (ketiv) traz “para que Israel não seja reunido”; seguiu-se a leitura
      tradicional (qere): “a ele”.'
  '49:6':
    texto: 'disse: “É muito pouco que sejas o meu servo para restabelecer as tribos de Jacó e reconduzir
      os sobreviventes de Israel; farei de ti luz das nações, para que a minha salvação chegue até os
      confins da terra.”'
    status: ia-sem-revisao
  '49:8':
    texto: 'Assim diz o Senhor: No tempo favorável eu te respondi, no dia da salvação te ajudei; guardei-te
      e fiz de ti aliança do povo, para restaurar a terra e repartir as heranças desoladas,'
    status: ia-sem-revisao
  '49:9':
    texto: 'para dizer aos presos: “Saí”, e aos que estão nas trevas: “Vinde à luz.” Eles pastarão pelos
      caminhos, e em todas as colinas desertas terão pasto.'
    status: ia-sem-revisao
  '49:10':
    texto: Não terão fome nem sede, nem os ferirá o calor ou o sol; pois aquele que tem compaixão deles
      os guiará e os conduzirá a fontes de água.
    status: ia-sem-revisao
  '49:11':
    texto: Farei de todos os meus montes um caminho, e as minhas estradas serão elevadas.
    status: ia-sem-revisao
  '49:12':
    texto: Eis que uns vêm de longe, outros do norte e do ocidente, e outros da terra de Sinim.
    status: ia-sem-revisao
  '49:13':
    texto: Exultai, céus; alegra-te, terra; montes, rompei em cantos de júbilo; porque o Senhor consolou
      o seu povo e se compadece dos seus aflitos.
    status: ia-sem-revisao
  '49:14':
    texto: 'Sião dizia: “O Senhor me abandonou, o meu Senhor se esqueceu de mim.”'
    status: ia-sem-revisao
  '49:15':
    texto: Pode uma mulher esquecer-se do seu filho de peito, sem ter compaixão do fruto do seu ventre?
      Mesmo que ela se esquecesse, eu não me esqueceria de ti.
    status: ia-sem-revisao
  '50:4':
    texto: O Senhor Deus deu-me uma língua de discípulo, para que eu saiba sustentar com uma palavra o
      que está cansado. Ele desperta, manhã após manhã, desperta o meu ouvido, para que eu escute como
      os discípulos.
    status: ia-sem-revisao
  '50:5':
    texto: O Senhor Deus abriu-me o ouvido, e eu não me rebelei, não recuei.
    status: ia-sem-revisao
  '50:6':
    texto: Entreguei o meu dorso aos que me feriam e as minhas faces aos que me arrancavam a barba; não
      escondi o rosto das injúrias e dos escarros.
    status: ia-sem-revisao
  '50:7':
    texto: Mas o Senhor Deus me ajuda; por isso não fico confundido; por isso tornei o meu rosto como
      pedra, e sei que não serei envergonhado.
    status: ia-sem-revisao
  '50:8':
    texto: Está perto aquele que me justifica; quem quer litigar comigo? Compareçamos juntos! Quem é o
      meu adversário? Que se apresente a mim.
    status: ia-sem-revisao
  '50:9':
    texto: 'Eis que o Senhor Deus me ajuda: quem me condenará? Todos eles se gastarão como um manto, a
      traça os devorará.'
    partes:
    - 'Eis que o Senhor Deus me ajuda: quem me condenará?'
    - Todos eles se gastarão como um manto, a traça os devorará.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '52:7':
    texto: 'Como são belos sobre os montes os pés do mensageiro que anuncia a paz, que traz boas notícias,
      que anuncia a salvação, que diz a Sião: “O teu Deus reina!”'
    status: ia-sem-revisao
  '52:8':
    texto: 'Eis a voz das tuas sentinelas: levantam a voz, juntas exultam, porque veem com os seus próprios
      olhos o Senhor que volta a Sião.'
    status: ia-sem-revisao
  '52:9':
    texto: Rompei em júbilo, cantai juntas, ruínas de Jerusalém, porque o Senhor consolou o seu povo,
      resgatou Jerusalém.
    status: ia-sem-revisao
  '52:10':
    texto: O Senhor desnudou o seu santo braço à vista de todas as nações, e todos os confins da terra
      verão a salvação do nosso Deus.
    status: ia-sem-revisao
  '52:13':
    texto: Eis que o meu servo prosperará, será exaltado, elevado e muito engrandecido.
    status: ia-sem-revisao
  '52:14':
    texto: Assim como muitos ficaram espantados ao vê-lo — tão desfigurado estava o seu aspecto, que já
      não parecia humano, nem a sua forma a de um filho de homem —,
    status: ia-sem-revisao
  '52:15':
    texto: assim ele fará estremecer muitas nações; diante dele os reis fecharão a boca, porque verão
      o que nunca lhes foi contado e compreenderão o que nunca ouviram.
    status: ia-sem-revisao
  '53:1':
    texto: Quem acreditou no que ouvimos? E o braço do Senhor, a quem foi revelado?
    status: ia-sem-revisao
  '53:2':
    texto: Cresceu diante dele como um broto, como raiz em terra seca; não tinha beleza nem esplendor
      para atrair o nosso olhar, nem aspecto agradável para o desejarmos.
    status: ia-sem-revisao
  '53:3':
    texto: Era desprezado e rejeitado pelos homens, homem das dores e familiarizado com o sofrimento,
      como alguém de quem se esconde o rosto; era desprezado, e não o estimamos.
    status: ia-sem-revisao
  '53:4':
    texto: Na verdade, ele tomou sobre si as nossas enfermidades e carregou as nossas dores; e nós o considerávamos
      castigado, ferido por Deus e humilhado.
    status: ia-sem-revisao
  '53:5':
    texto: Mas ele foi traspassado por causa das nossas transgressões, esmagado por causa das nossas culpas;
      o castigo que nos traz a paz estava sobre ele, e pelas suas feridas fomos curados.
    status: ia-sem-revisao
  '53:6':
    texto: Todos nós andávamos errantes como ovelhas, cada um seguia o seu próprio caminho; e o Senhor
      fez cair sobre ele a culpa de todos nós.
    status: ia-sem-revisao
  '53:7':
    texto: Foi maltratado, mas humilhou-se e não abriu a boca; como cordeiro levado ao matadouro, como
      ovelha muda diante dos que a tosquiam, não abriu a boca.
    status: ia-sem-revisao
  '53:8':
    texto: Foi tirado por opressão e julgamento; e quem pensou na sua geração? Pois foi retirado da terra
      dos vivos, ferido pela transgressão do meu povo.
    status: ia-sem-revisao
  '53:9':
    texto: Deram-lhe sepultura entre os ímpios e, na sua morte, junto de um rico, embora não tivesse cometido
      violência nem houvesse engano na sua boca.
    status: ia-sem-revisao
  '53:10':
    texto: Mas foi vontade do Senhor esmagá-lo com o sofrimento. Se oferecer a sua vida em sacrifício
      de reparação, verá descendência, prolongará os seus dias, e a vontade do Senhor prosperará nas suas
      mãos.
    status: ia-sem-revisao
  '53:11':
    texto: Depois do trabalho da sua alma, verá a luz e ficará saciado. Pelo seu conhecimento, o meu servo
      justo justificará a muitos, e carregará as culpas deles.
    status: ia-sem-revisao
  '53:12':
    texto: Por isso lhe darei a sua parte entre os grandes, e repartirá o despojo com os fortes, porque
      entregou a sua vida à morte e foi contado entre os transgressores, ele que levou o pecado de muitos
      e intercedeu pelos transgressores.
    status: ia-sem-revisao
  '54:1':
    texto: Exulta, estéril, que não davas à luz; rompe em júbilo e canta, tu que não tiveste dores de
      parto; porque os filhos da abandonada são mais numerosos do que os da casada, diz o Senhor.
    status: ia-sem-revisao
  '54:2':
    texto: Alarga o espaço da tua tenda, estendam-se as cortinas das tuas moradas; não te contenhas, alonga
      as tuas cordas e firma as tuas estacas.
    status: ia-sem-revisao
  '54:3':
    texto: Pois te estenderás para a direita e para a esquerda; a tua descendência possuirá nações e povoará
      cidades desoladas.
    status: ia-sem-revisao
  '54:4':
    texto: Não temas, pois não serás envergonhada; não te envergonhes, pois não serás humilhada; esquecerás
      a vergonha da tua juventude e não te lembrarás mais da desonra da tua viuvez.
    status: ia-sem-revisao
  '54:5':
    texto: 'Pois o teu esposo é aquele que te fez: Senhor dos exércitos é o seu nome; o teu redentor é
      o Santo de Israel, que se chama Deus de toda a terra.'
    status: ia-sem-revisao
  '54:6':
    texto: Pois o Senhor te chamou como a uma mulher abandonada e de espírito aflito, como a esposa da
      juventude que foi repudiada, diz o teu Deus.
    status: ia-sem-revisao
  '54:7':
    texto: Por um breve instante te abandonei, mas com grande compaixão te recolherei.
    status: ia-sem-revisao
  '54:8':
    texto: Num transbordar de ira escondi de ti o meu rosto por um instante, mas com misericórdia eterna
      tenho compaixão de ti, diz o Senhor, teu redentor.
    status: ia-sem-revisao
  '54:9':
    texto: 'Será para mim como nos dias de Noé: como jurei que as águas de Noé não passariam mais sobre
      a terra, assim jurei não me irar contra ti nem te repreender.'
    status: ia-sem-revisao
  '54:10':
    texto: Ainda que os montes se removam e as colinas vacilem, a minha misericórdia não se afastará de
      ti, e a minha aliança de paz não vacilará, diz o Senhor, que tem compaixão de ti.
    status: ia-sem-revisao
  '54:11':
    texto: Aflita, açoitada pela tempestade, sem consolo, eis que assentarei as tuas pedras sobre turquesas
      e te fundarei sobre safiras.
    status: ia-sem-revisao
  '54:12':
    texto: Farei de rubis as tuas ameias, de pedras de berilo as tuas portas e de pedras preciosas todo
      o teu muro.
    status: ia-sem-revisao
  '54:13':
    texto: Todos os teus filhos serão discípulos do Senhor, e grande será a paz dos teus filhos.
    status: ia-sem-revisao
  '54:14':
    texto: Serás estabelecida na justiça; estarás longe da opressão, pois nada temerás; e do terror, pois
      não se aproximará de ti.
    status: ia-sem-revisao
  '55:1':
    texto: Ó todos vós que tendes sede, vinde às águas; vós que não tendes dinheiro, vinde, comprai e
      comei; vinde, comprai sem dinheiro e sem pagar vinho e leite.
    status: ia-sem-revisao
  '55:2':
    texto: Por que gastais dinheiro naquilo que não é pão e o vosso trabalho naquilo que não sacia? Ouvi-me
      atentamente e comei o que é bom, e a vossa alma se deleitará com iguarias.
    status: ia-sem-revisao
  '55:3':
    texto: Inclinai o ouvido e vinde a mim; ouvi, e a vossa alma viverá. Farei convosco uma aliança eterna,
      as graças firmes prometidas a Davi.
    status: ia-sem-revisao
  '55:4':
    texto: Eis que o fiz testemunha para os povos, chefe e soberano das nações.
    status: ia-sem-revisao
  '55:5':
    texto: Eis que chamarás uma nação que não conheces, e uma nação que não te conhecia correrá a ti,
      por causa do Senhor, teu Deus, e do Santo de Israel, que te glorificou.
    status: ia-sem-revisao
  '55:6':
    texto: Procurai o Senhor enquanto se deixa encontrar; invocai-o enquanto está perto.
    status: ia-sem-revisao
  '55:7':
    texto: Abandone o ímpio o seu caminho, e o homem iníquo, os seus pensamentos; volte para o Senhor,
      que terá compaixão dele, e para o nosso Deus, que é rico em perdão.
    status: ia-sem-revisao
  '55:8':
    texto: Pois os meus pensamentos não são os vossos pensamentos, nem os vossos caminhos são os meus
      caminhos, diz o Senhor.
    status: ia-sem-revisao
  '55:9':
    texto: Como o céu está acima da terra, assim os meus caminhos estão acima dos vossos caminhos, e os
      meus pensamentos, acima dos vossos pensamentos.
    status: ia-sem-revisao
  '55:10':
    texto: Assim como a chuva e a neve descem do céu e para lá não voltam sem ter regado a terra, sem
      a ter fecundado e feito germinar, para dar semente ao semeador e pão ao que come,
    status: ia-sem-revisao
  '55:11':
    texto: 'assim será a minha palavra que sai da minha boca: não voltará a mim vazia, mas realizará o
      que quero e cumprirá a missão para a qual a enviei.'
    status: ia-sem-revisao
  '56:1':
    texto: 'Assim diz o Senhor: Observai o direito e praticai a justiça, porque a minha salvação está
      para chegar, e a minha justiça, para se revelar.'
    status: ia-sem-revisao
  '56:2':
    texto: 'Feliz o homem que assim faz, o filho do homem que se apega a isso: que guarda o sábado sem
      o profanar e guarda a sua mão de fazer qualquer mal.'
    status: ia-sem-revisao
  '56:3':
    texto: 'Que o estrangeiro que se uniu ao Senhor não diga: “O Senhor certamente me separará do seu
      povo”; e que o eunuco não diga: “Eis que sou uma árvore seca.”'
    status: ia-sem-revisao
  '56:6':
    texto: Quanto aos estrangeiros que se uniram ao Senhor para o servir, para amar o nome do Senhor e
      ser seus servos, todos os que guardam o sábado sem o profanar e se mantêm firmes na minha aliança,
    status: ia-sem-revisao
  '56:7':
    texto: os levarei ao meu santo monte e os alegrarei na minha casa de oração; os seus holocaustos e
      sacrifícios serão aceitos no meu altar, pois a minha casa será chamada casa de oração para todos
      os povos.
    status: ia-sem-revisao
  '56:8':
    texto: 'Oráculo do Senhor Deus, que reúne os dispersos de Israel: Ainda reunirei outros além dos que
      já foram reunidos.'
    status: ia-sem-revisao
  '58:1':
    texto: Clama a plenos pulmões, não te contenhas; levanta a voz como a trombeta e anuncia ao meu povo
      as suas transgressões e à casa de Jacó os seus pecados.
    status: ia-sem-revisao
  '58:2':
    texto: Procuram-me dia após dia e desejam conhecer os meus caminhos, como uma nação que praticasse
      a justiça e não abandonasse o direito do seu Deus; pedem-me juízos justos, desejam a proximidade
      de Deus.
    status: ia-sem-revisao
  '58:3':
    texto: “Por que jejuamos, e tu não vês? Por que nos humilhamos, e tu não sabes?” Eis que, no dia do
      vosso jejum, cuidais dos vossos negócios e oprimis todos os vossos operários.
    status: ia-sem-revisao
  '58:4':
    texto: Eis que jejuais entre disputas e contendas e para ferir com punho iníquo; não jejuais mais
      como hoje, para fazer ouvir lá no alto a vossa voz.
    status: ia-sem-revisao
  '58:5':
    texto: 'É assim o jejum que escolhi, o dia em que o homem se humilha? Curvar a cabeça como o junco,
      deitar-se sobre saco e cinza: a isso chamareis jejum, dia agradável ao Senhor?'
    status: ia-sem-revisao
  '58:6':
    texto: 'Não é este o jejum que escolhi: soltar as cadeias da injustiça, desatar as cordas do jugo,
      libertar os oprimidos e quebrar todo jugo?'
    status: ia-sem-revisao
  '58:7':
    texto: Não é repartir o teu pão com o faminto, recolher em casa os pobres sem abrigo, vestir o que
      vês nu e não te esconderes do teu semelhante?
    status: ia-sem-revisao
  '58:8':
    texto: Então a tua luz romperá como a aurora, e a tua cura florescerá depressa; a tua justiça caminhará
      diante de ti, e a glória do Senhor será a tua retaguarda.
    status: ia-sem-revisao
  '58:9':
    texto: 'Então invocarás, e o Senhor responderá; clamarás por socorro, e ele dirá: “Eis-me aqui.” Se
      tirares do meio de ti o jugo, o gesto de ameaça e a linguagem injuriosa,'
    partes:
    - Então invocarás, e o Senhor responderá;
    - 'clamarás por socorro, e ele dirá: “Eis-me aqui.” Se tirares do meio de ti o jugo, o gesto de ameaça
      e a linguagem injuriosa,'
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '58:10':
    texto: se deres o teu pão ao faminto e saciares o aflito, a tua luz brilhará nas trevas, e a tua escuridão
      será como o meio-dia.
    status: ia-sem-revisao
  '58:11':
    texto: O Senhor te guiará sempre, saciará a tua alma em terras áridas e dará vigor aos teus ossos;
      serás como um jardim regado, como uma fonte cujas águas nunca faltam.
    status: ia-sem-revisao
  '58:12':
    texto: Reconstruirão sobre ti as ruínas antigas; levantarás os alicerces de muitas gerações; serás
      chamado reparador de brechas, restaurador de moradas.
    status: ia-sem-revisao
  '58:13':
    texto: Se contiveres o teu pé no sábado, para não fazeres a tua vontade no meu dia santo; se chamares
      ao sábado delícia, e ao dia santo do Senhor, honrado; se o honrares, evitando os teus caminhos,
      deixando de procurar a tua vontade e de falar palavras vãs,
    status: ia-sem-revisao
  '58:14':
    texto: então te deleitarás no Senhor, e eu te farei cavalgar sobre as alturas da terra e te alimentarei
      com a herança de Jacó, teu pai; pois a boca do Senhor o disse.
    status: ia-sem-revisao
  '60:1':
    texto: Levanta-te, resplandece, porque vem a tua luz, e a glória do Senhor se levanta sobre ti.
    status: ia-sem-revisao
  '60:2':
    texto: Pois eis que as trevas cobrem a terra e a escuridão, os povos; mas sobre ti se levanta o Senhor,
      e a sua glória aparece sobre ti.
    status: ia-sem-revisao
  '60:3':
    texto: As nações caminharão à tua luz, e os reis, ao clarão da tua aurora.
    status: ia-sem-revisao
  '60:4':
    texto: 'Levanta os olhos ao redor e olha: todos se reúnem e vêm a ti; os teus filhos vêm de longe,
      e as tuas filhas são carregadas nos braços.'
    status: ia-sem-revisao
  '60:5':
    texto: Então verás e ficarás radiante, o teu coração palpitará e se dilatará, porque a riqueza do
      mar se voltará para ti, e os bens das nações virão a ti.
    status: ia-sem-revisao
  '60:6':
    texto: Uma multidão de camelos te cobrirá, dromedários de Madiã e de Efa; todos virão de Sabá, trarão
      ouro e incenso e proclamarão os louvores do Senhor.
    status: ia-sem-revisao
  '61:1':
    texto: O espírito do Senhor Deus está sobre mim, porque o Senhor me ungiu. Enviou-me para anunciar
      boas notícias aos pobres, para curar os de coração quebrantado, para proclamar a liberdade aos cativos
      e a libertação aos prisioneiros,
    status: ia-sem-revisao
  '61:2':
    texto: para proclamar o ano de graça do Senhor, o dia da vingança do nosso Deus, para consolar todos
      os que choram,
    partes:
    - para proclamar o ano de graça do Senhor,
    - o dia da vingança do nosso Deus, para consolar todos os que choram,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '61:3':
    texto: para dar aos aflitos de Sião, em vez de cinza, uma coroa; em vez de luto, óleo de alegria;
      em vez de espírito abatido, veste de louvor. Serão chamados terebintos de justiça, plantação do
      Senhor para a sua glória.
    partes:
    - para dar aos aflitos de Sião,
    - em vez de cinza, uma coroa; em vez de luto, óleo de alegria; em vez de espírito abatido, veste de
      louvor. Serão chamados terebintos de justiça, plantação do Senhor para a sua glória.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '61:6':
    texto: Vós, porém, sereis chamados sacerdotes do Senhor, ministros do nosso Deus; comereis as riquezas
      das nações e vos gloriareis da sua glória.
    partes:
    - Vós, porém, sereis chamados sacerdotes do Senhor,
    - ministros do nosso Deus; comereis as riquezas das nações e vos gloriareis da sua glória.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '61:8':
    texto: Pois eu, o Senhor, amo o direito e odeio o roubo e a injustiça; darei fielmente a sua recompensa
      e farei com eles uma aliança eterna.
    partes:
    - Pois eu, o Senhor, amo o direito e odeio o roubo e a injustiça;
    - darei fielmente a sua recompensa e farei com eles uma aliança eterna.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '61:9':
    texto: A sua descendência será conhecida entre as nações, e os seus descendentes, no meio dos povos;
      todos os que os virem os reconhecerão como descendência abençoada pelo Senhor.
    status: ia-sem-revisao
  '61:10':
    texto: Exulto de alegria no Senhor, a minha alma se alegra no meu Deus, porque me vestiu com vestes
      de salvação e me envolveu com o manto da justiça, como o noivo que se adorna com uma coroa e como
      a noiva que se enfeita com as suas joias.
    status: ia-sem-revisao
  '61:11':
    texto: Pois, como a terra faz brotar a sua vegetação e como o jardim faz germinar o que nele se semeia,
      assim o Senhor Deus fará brotar a justiça e o louvor diante de todas as nações.
    status: ia-sem-revisao
  '62:1':
    texto: Por amor de Sião não me calarei, por amor de Jerusalém não descansarei, até que a sua justiça
      brilhe como a aurora, e a sua salvação, como uma tocha acesa.
    status: ia-sem-revisao
  '62:2':
    texto: As nações verão a tua justiça, e todos os reis, a tua glória; e serás chamada por um nome novo,
      que a boca do Senhor designará.
    status: ia-sem-revisao
  '62:3':
    texto: Serás uma coroa de esplendor na mão do Senhor, um diadema real na palma do teu Deus.
    status: ia-sem-revisao
  '62:4':
    texto: Já não te chamarão “Abandonada”, nem a tua terra será chamada “Desolada”; mas serás chamada
      “Minha Querida”, e a tua terra, “Desposada”, porque o Senhor se compraz em ti, e a tua terra terá
      esposo.
    status: ia-sem-revisao
  '62:5':
    texto: Como o jovem desposa uma virgem, assim te desposarão os teus filhos; e como a alegria do noivo
      pela noiva, assim se alegrará por ti o teu Deus.
    status: ia-sem-revisao
  '62:11':
    texto: 'Eis que o Senhor fez ouvir até os confins da terra: Dizei à filha de Sião: “Eis que vem a
      tua salvação; eis que o seu salário está com ele, e a sua recompensa vai diante dele.”'
    status: ia-sem-revisao
  '62:12':
    texto: Chamá-los-ão Povo Santo, Redimidos do Senhor; e tu serás chamada Procurada, Cidade Não Abandonada.
    status: ia-sem-revisao
  '63:16':
    texto: Pois tu és o nosso Pai; Abraão não nos conhece, e Israel não nos reconhece. Tu, Senhor, és
      o nosso Pai; o teu nome, desde sempre, é “Nosso Redentor”.
    partes:
    - Pois tu és o nosso Pai; Abraão não nos conhece, e Israel não nos reconhece.
    - Tu, Senhor, és o nosso Pai; o teu nome, desde sempre, é “Nosso Redentor”.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '63:17':
    texto: Por que, Senhor, nos deixas errar longe dos teus caminhos e endureces o nosso coração, para
      que não te temamos? Volta, por amor dos teus servos, das tribos da tua herança.
    status: ia-sem-revisao
  '63:19':
    texto: Somos desde há muito como aqueles sobre quem nunca dominaste, sobre quem nunca foi invocado
      o teu nome. Oh, se rasgasses os céus e descesses! Diante de ti os montes se derreteriam,
    status: ia-sem-revisao
  '64:2':
    texto: como quando o fogo acende os gravetos e faz a água ferver, para dar a conhecer o teu nome aos
      teus adversários e fazer as nações tremer diante de ti.
    partes:
    - como quando o fogo acende os gravetos e faz a água ferver,
    - para dar a conhecer o teu nome aos teus adversários e fazer as nações tremer diante de ti.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '64:3':
    texto: Quando fizeste coisas terríveis que não esperávamos, desceste, e os montes se derreteram diante
      de ti.
    status: ia-sem-revisao
  '64:4':
    texto: Desde sempre não se ouviu, não se escutou, olho algum viu, a não ser a ti, ó Deus, que agisses
      em favor de quem espera em ti.
    status: ia-sem-revisao
  '64:5':
    texto: Vais ao encontro de quem pratica a justiça com alegria e se lembra de ti nos teus caminhos.
      Eis que te irritaste, e pecamos; durante muito tempo estivemos nos pecados, e seremos salvos?
    status: ia-sem-revisao
  '64:6':
    texto: Todos nós nos tornamos como o impuro, e todas as nossas justiças são como um pano imundo; todos
      murchamos como folha, e as nossas culpas nos levam como o vento.
    status: ia-sem-revisao
  '64:7':
    texto: Ninguém invoca o teu nome, ninguém se desperta para te segurar; pois escondeste de nós o teu
      rosto e nos entregaste ao poder das nossas culpas.
    status: ia-sem-revisao
  '65:17':
    texto: Pois eis que crio novos céus e nova terra; das coisas passadas não haverá lembrança, nem virão
      mais ao pensamento.
    status: ia-sem-revisao
  '65:18':
    texto: Alegrai-vos, antes, e exultai para sempre pelo que vou criar; pois eis que farei de Jerusalém
      uma alegria, e do seu povo, um júbilo.
    status: ia-sem-revisao
  '65:19':
    texto: Exultarei em Jerusalém e me alegrarei no meu povo; nela não se ouvirá mais voz de pranto nem
      voz de clamor.
    status: ia-sem-revisao
  '65:20':
    texto: Já não haverá nela criança que viva poucos dias, nem velho que não complete os seus dias; quem
      morrer aos cem anos será considerado jovem, e o pecador de cem anos será considerado maldito.
    status: ia-sem-revisao
  '65:21':
    texto: Construirão casas e as habitarão; plantarão vinhas e comerão o seu fruto.
    status: ia-sem-revisao
  '66:10':
    texto: Alegrai-vos com Jerusalém e exultai por ela, todos os que a amais; enchei-vos de alegria com
      ela, todos os que por ela fazíeis luto,
    status: ia-sem-revisao
  '66:11':
    texto: para que sejais amamentados e vos sacieis com o seio das suas consolações, para que sugueis
      e vos deleiteis com a abundância da sua glória.
    status: ia-sem-revisao
  '66:12':
    texto: 'Pois assim diz o Senhor: Eis que farei correr para ela a paz como um rio e a glória das nações
      como uma torrente transbordante; sereis amamentados, levados nos braços e acalentados sobre os joelhos.'
    status: ia-sem-revisao
  '66:13':
    texto: Como a mãe consola o seu filho, assim eu vos consolarei; em Jerusalém sereis consolados.
    status: ia-sem-revisao
  '66:14':
    texto: Vós o vereis, e o vosso coração se alegrará; os vossos ossos florescerão como a relva; a mão
      do Senhor se dará a conhecer aos seus servos, mas a sua ira, aos seus inimigos.
    partes:
    - Vós o vereis, e o vosso coração se alegrará;
    - os vossos ossos florescerão como a relva;
    - a mão do Senhor se dará a conhecer aos seus servos, mas a sua ira, aos seus inimigos.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '66:18':
    texto: Eu, conhecendo as suas obras e os seus pensamentos, venho reunir todas as nações e línguas;
      elas virão e verão a minha glória.
    status: ia-sem-revisao
  '66:19':
    texto: 'Porei entre eles um sinal e enviarei alguns deles, sobreviventes, às nações: a Társis, Pul
      e Lud, que manejam o arco, a Tubal e Javã, às ilhas distantes que nunca ouviram falar de mim nem
      viram a minha glória; e anunciarão a minha glória entre as nações.'
    status: ia-sem-revisao
  '66:20':
    texto: Trarão todos os vossos irmãos de todas as nações como oferta ao Senhor, em cavalos, carros,
      liteiras, mulas e dromedários, ao meu santo monte, Jerusalém, diz o Senhor, como os filhos de Israel
      trazem a oferta em vaso puro à casa do Senhor.
    status: ia-sem-revisao
  '66:21':
    texto: Também deles tomarei sacerdotes e levitas, diz o Senhor.
    status: ia-sem-revisao
