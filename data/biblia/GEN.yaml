livro: GEN
fonte: oshb
versiculos:
  '1:1':
    texto: No princípio, Deus criou os céus e a terra.
    status: ia-sem-revisao
  '1:2':
    texto: A terra estava informe e vazia, e havia trevas sobre a face do abismo, e o espírito de Deus
      pairava sobre a face das águas.
    status: ia-sem-revisao
  '1:3':
    texto: 'Deus disse: “Haja luz!” E houve luz.'
    status: ia-sem-revisao
  '1:4':
    texto: Deus viu que a luz era boa, e Deus separou a luz das trevas.
    status: ia-sem-revisao
  '1:5':
    texto: 'Deus chamou à luz “dia” e às trevas chamou “noite”. Houve tarde e houve manhã: primeiro dia.'
    status: ia-sem-revisao
  '1:6':
    texto: 'Deus disse: “Haja um firmamento no meio das águas, que separe águas de águas.”'
    status: ia-sem-revisao
  '1:7':
    texto: Deus fez o firmamento e separou as águas que estão debaixo do firmamento das águas que estão
      acima do firmamento. E assim se fez.
    status: ia-sem-revisao
  '1:8':
    texto: 'Deus chamou ao firmamento “céu”. Houve tarde e houve manhã: segundo dia.'
    status: ia-sem-revisao
  '1:9':
    texto: 'Deus disse: “Ajuntem-se as águas que estão debaixo do céu num só lugar, e apareça o solo seco.”
      E assim se fez.'
    status: ia-sem-revisao
  '1:10':
    texto: Deus chamou ao solo seco “terra” e ao ajuntamento das águas chamou “mares”. E Deus viu que
      era bom.
    status: ia-sem-revisao
  '1:11':
    texto: 'Deus disse: “Produza a terra vegetação: ervas que deem semente e árvores frutíferas que deem
      fruto segundo a sua espécie, com a semente nele, sobre a terra.” E assim se fez.'
    status: ia-sem-revisao
  '1:12':
    texto: 'A terra produziu vegetação: ervas que dão semente segundo a sua espécie e árvores que dão
      fruto com a semente nele, segundo a sua espécie. E Deus viu que era bom.'
    status: ia-sem-revisao
  '1:13':
    texto: 'Houve tarde e houve manhã: terceiro dia.'
    status: ia-sem-revisao
  '1:14':
    texto: 'Deus disse: “Haja luzeiros no firmamento do céu, para separar o dia da noite; e sirvam de
      sinais, para as estações, os dias e os anos;'
    status: ia-sem-revisao
  '1:15':
    texto: e sirvam de luzeiros no firmamento do céu para iluminar a terra.” E assim se fez.
    status: ia-sem-revisao
  '1:16':
    texto: 'Deus fez os dois grandes luzeiros: o luzeiro maior para presidir ao dia e o luzeiro menor
      para presidir à noite; e também as estrelas.'
    status: ia-sem-revisao
  '1:17':
    texto: Deus os pôs no firmamento do céu para iluminar a terra,
    status: ia-sem-revisao
  '1:18':
    texto: para presidir ao dia e à noite e para separar a luz das trevas. E Deus viu que era bom.
    status: ia-sem-revisao
  '1:19':
    texto: 'Houve tarde e houve manhã: quarto dia.'
    status: ia-sem-revisao
  '1:20':
    texto: 'Deus disse: “Fervilhem as águas de seres vivos, e voem aves sobre a terra, sob o firmamento
      do céu.”'
    status: ia-sem-revisao
  '1:21':
    texto: Deus criou os grandes monstros marinhos e todos os seres vivos que se movem, com os quais fervilham
      as águas, segundo a sua espécie, e todas as aves aladas segundo a sua espécie. E Deus viu que era
      bom.
    status: ia-sem-revisao
  '1:22':
    texto: 'Deus os abençoou, dizendo: “Sede fecundos e multiplicai-vos, enchei as águas dos mares, e
      multipliquem-se as aves sobre a terra.”'
    status: ia-sem-revisao
  '1:23':
    texto: 'Houve tarde e houve manhã: quinto dia.'
    status: ia-sem-revisao
  '1:24':
    texto: 'Deus disse: “Produza a terra seres vivos segundo a sua espécie: animais domésticos, répteis
      e feras da terra segundo a sua espécie.” E assim se fez.'
    status: ia-sem-revisao
  '1:25':
    texto: Deus fez as feras da terra segundo a sua espécie, os animais domésticos segundo a sua espécie
      e todos os répteis do solo segundo a sua espécie. E Deus viu que era bom.
    status: ia-sem-revisao
  '1:26':
    texto: 'Deus disse: “Façamos o homem à nossa imagem, segundo a nossa semelhança, e domine ele sobre
      os peixes do mar, sobre as aves do céu, sobre os animais domésticos, sobre toda a terra e sobre
      todos os répteis que rastejam sobre a terra.”'
    status: ia-sem-revisao
  '1:27':
    texto: Deus criou o homem à sua imagem; à imagem de Deus o criou; homem e mulher os criou.
    status: ia-sem-revisao
  '1:28':
    texto: 'Deus os abençoou e lhes disse: “Sede fecundos e multiplicai-vos, enchei a terra e submetei-a;
      dominai sobre os peixes do mar, sobre as aves do céu e sobre todos os seres vivos que se movem sobre
      a terra.”'
    status: ia-sem-revisao
  '1:29':
    texto: 'Deus disse: “Eis que vos dou todas as ervas que dão semente, sobre a face de toda a terra,
      e todas as árvores que têm fruto com semente: vos servirão de alimento.'
    status: ia-sem-revisao
  '1:30':
    texto: E a todos os animais da terra, a todas as aves do céu e a tudo o que rasteja sobre a terra
      e em que há vida, dou toda erva verde por alimento.” E assim se fez.
    status: ia-sem-revisao
  '1:31':
    texto: 'Deus viu tudo o que tinha feito, e eis que era muito bom. Houve tarde e houve manhã: sexto
      dia.'
    status: ia-sem-revisao
  '2:1':
    texto: Assim foram concluídos os céus e a terra, com todo o seu exército.
    status: ia-sem-revisao
  '2:2':
    texto: No sétimo dia, Deus concluiu a obra que fizera e, no sétimo dia, descansou de toda a obra que
      fizera.
    status: ia-sem-revisao
  '2:3':
    texto: Deus abençoou o sétimo dia e o santificou, porque nele descansou de toda a obra que fizera
      ao criar.
    status: ia-sem-revisao
  '2:4':
    texto: Esta é a origem dos céus e da terra quando foram criados, no dia em que o Senhor Deus fez a
      terra e os céus.
    partes:
    - Esta é a origem dos céus e da terra quando foram criados,
    - no dia em que o Senhor Deus fez a terra e os céus.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '2:5':
    texto: Ainda não havia nenhum arbusto do campo na terra, e nenhuma erva do campo tinha brotado, porque
      o Senhor Deus não tinha feito chover sobre a terra, e não havia homem para cultivar o solo.
    status: ia-sem-revisao
  '2:6':
    texto: Mas subia da terra um vapor que regava toda a superfície do solo.
    status: ia-sem-revisao
  '2:7':
    texto: O Senhor Deus formou o homem do pó do solo e insuflou-lhe nas narinas o sopro da vida, e o
      homem tornou-se um ser vivo.
    status: ia-sem-revisao
  '2:8':
    texto: O Senhor Deus plantou um jardim no Éden, a oriente, e ali colocou o homem que formara.
    status: ia-sem-revisao
  '2:9':
    texto: O Senhor Deus fez brotar do solo todo tipo de árvores agradáveis à vista e boas para comer,
      e a árvore da vida no meio do jardim e a árvore do conhecimento do bem e do mal.
    status: ia-sem-revisao
  '2:15':
    texto: O Senhor Deus tomou o homem e o colocou no jardim do Éden, para o cultivar e guardar.
    status: ia-sem-revisao
  '2:16':
    texto: 'O Senhor Deus deu ao homem esta ordem: “De todas as árvores do jardim poderás comer livremente,'
    status: ia-sem-revisao
  '2:17':
    texto: mas da árvore do conhecimento do bem e do mal não comerás, porque no dia em que dela comeres,
      certamente morrerás.”
    status: ia-sem-revisao
  '2:18':
    texto: 'O Senhor Deus disse: “Não é bom que o homem esteja só; lhe farei uma auxiliar que lhe corresponda.”'
    status: ia-sem-revisao
  '2:19':
    texto: O Senhor Deus formou do solo todos os animais do campo e todas as aves do céu e os levou ao
      homem, para ver como os chamaria; e o nome que o homem desse a cada ser vivo, esse seria o seu nome.
    status: ia-sem-revisao
  '2:20':
    texto: O homem deu nomes a todos os animais domésticos, às aves do céu e a todas as feras do campo;
      mas, para o homem, não encontrou uma auxiliar que lhe correspondesse.
    status: ia-sem-revisao
  '2:21':
    texto: Então o Senhor Deus fez cair sobre o homem um sono profundo e, enquanto ele dormia, tomou uma
      das suas costelas e fechou a carne no seu lugar.
    status: ia-sem-revisao
  '2:22':
    texto: Da costela que tomara do homem, o Senhor Deus formou uma mulher e a levou ao homem.
    status: ia-sem-revisao
  '2:23':
    texto: 'Então o homem disse: “Esta, sim, é osso dos meus ossos e carne da minha carne! Chamar-se-á
      mulher, porque do homem foi tirada.”'
    status: ia-sem-revisao
  '2:24':
    texto: Por isso o homem deixa o seu pai e a sua mãe e se une à sua mulher, e os dois se tornam uma
      só carne.
    status: ia-sem-revisao
  '2:25':
    texto: Os dois estavam nus, o homem e a sua mulher, e não se envergonhavam.
    status: ia-sem-revisao
  '3:1':
    texto: 'A serpente era o mais astuto de todos os animais do campo que o Senhor Deus tinha feito. Disse
      à mulher: “É verdade que Deus disse: ‘Não comereis de nenhuma árvore do jardim’?”'
    status: ia-sem-revisao
  '3:2':
    texto: 'A mulher respondeu à serpente: “Podemos comer do fruto das árvores do jardim,'
    status: ia-sem-revisao
  '3:3':
    texto: 'mas do fruto da árvore que está no meio do jardim Deus disse: ‘Não comereis dele, nem o tocareis,
      para que não morrais.’”'
    status: ia-sem-revisao
  '3:4':
    texto: 'A serpente disse à mulher: “Não morrereis!'
    status: ia-sem-revisao
  '3:5':
    texto: Pois Deus sabe que, no dia em que dele comerdes, os vossos olhos se abrirão e sereis como Deus,
      conhecendo o bem e o mal.”
    status: ia-sem-revisao
  '3:6':
    texto: A mulher viu que a árvore era boa para comer, agradável aos olhos e desejável para adquirir
      sabedoria; tomou do seu fruto e comeu; deu também ao marido, que estava com ela, e ele comeu.
    status: ia-sem-revisao
  '3:7':
    texto: Então os olhos de ambos se abriram, e perceberam que estavam nus; coseram folhas de figueira
      e fizeram para si cintas.
    status: ia-sem-revisao
  '3:8':
    texto: Ouviram o Senhor Deus que passeava no jardim à brisa da tarde, e o homem e a sua mulher esconderam-se
      da presença do Senhor Deus entre as árvores do jardim.
    status: ia-sem-revisao
  '3:9':
    texto: 'O Senhor Deus chamou o homem e lhe disse: “Onde estás?”'
    status: ia-sem-revisao
  '3:10':
    texto: 'Ele respondeu: “Ouvi o teu passo no jardim e tive medo, porque estou nu; e me escondi.”'
    status: ia-sem-revisao
  '3:11':
    texto: 'Ele disse: “Quem te fez saber que estás nu? Comeste da árvore de que te proibi comer?”'
    status: ia-sem-revisao
  '3:12':
    texto: 'O homem respondeu: “A mulher que me deste por companheira, ela me deu da árvore, e eu comi.”'
    status: ia-sem-revisao
  '3:13':
    texto: 'O Senhor Deus disse à mulher: “Que foi que fizeste?” A mulher respondeu: “A serpente me enganou,
      e eu comi.”'
    status: ia-sem-revisao
  '3:14':
    texto: 'O Senhor Deus disse à serpente: “Porque fizeste isso, maldita serás entre todos os animais
      domésticos e todas as feras do campo; andarás sobre o teu ventre e comerás pó todos os dias da tua
      vida.'
    status: ia-sem-revisao
  '3:15':
    texto: 'Porei inimizade entre ti e a mulher, entre a tua descendência e a descendência dela: ela te
      ferirá a cabeça, e tu lhe ferirás o calcanhar.”'
    status: ia-sem-revisao
    observacao: O hebraico traz “ele” (a descendência); a Vulgata traz “ela”, em algumas edições, referindo-se
      à mulher.
  '3:16':
    texto: 'À mulher disse: “Multiplicarei os sofrimentos da tua gravidez; com dor darás à luz filhos;
      o teu desejo te impelirá para o teu marido, e ele te dominará.”'
    status: ia-sem-revisao
  '3:17':
    texto: 'Ao homem disse: “Porque ouviste a voz da tua mulher e comeste da árvore de que te ordenei:
      ‘Não comerás dela’, maldita seja a terra por tua causa; com sofrimento tirarás dela o alimento todos
      os dias da tua vida.'
    status: ia-sem-revisao
  '3:18':
    texto: Ela te dará espinhos e abrolhos, e comerás a erva do campo.
    status: ia-sem-revisao
  '3:19':
    texto: Com o suor do teu rosto comerás o teu pão, até que voltes à terra, pois dela foste tirado;
      porque és pó e ao pó voltarás.”
    status: ia-sem-revisao
  '3:20':
    texto: O homem chamou à sua mulher Eva, porque ela foi a mãe de todos os viventes.
    status: ia-sem-revisao
  '3:21':
    texto: O Senhor Deus fez para o homem e para a sua mulher túnicas de pele e os vestiu.
    status: ia-sem-revisao
  '3:22':
    texto: 'O Senhor Deus disse: “Eis que o homem se tornou como um de nós, conhecendo o bem e o mal.
      Agora, que ele não estenda a mão, não tome também da árvore da vida, coma e viva para sempre!”'
    status: ia-sem-revisao
  '3:23':
    texto: E o Senhor Deus o expulsou do jardim do Éden, para cultivar o solo de onde fora tirado.
    status: ia-sem-revisao
  '3:24':
    texto: Expulsou o homem e colocou, a oriente do jardim do Éden, os querubins e a chama da espada fulgurante,
      para guardar o caminho da árvore da vida.
    status: ia-sem-revisao
  '4:1':
    texto: 'O homem conheceu Eva, sua mulher, que concebeu e deu à luz Caim, e disse: “Adquiri um homem
      com o favor do Senhor.”'
    status: ia-sem-revisao
  '4:2':
    texto: Deu à luz depois o irmão dele, Abel. Abel foi pastor de ovelhas, e Caim foi lavrador.
    status: ia-sem-revisao
  '4:3':
    texto: Passado algum tempo, Caim trouxe ao Senhor uma oferta dos frutos da terra.
    status: ia-sem-revisao
  '4:4':
    texto: Abel trouxe também ele as primícias do seu rebanho e a gordura delas. O Senhor olhou com agrado
      para Abel e para a sua oferta,
    status: ia-sem-revisao
  '4:5':
    texto: mas não olhou com agrado para Caim e para a sua oferta. Caim ficou muito irado, e o seu rosto
      abateu-se.
    status: ia-sem-revisao
  '4:6':
    texto: 'O Senhor disse a Caim: “Por que estás irado, e por que está abatido o teu rosto?'
    status: ia-sem-revisao
  '4:7':
    texto: Se agires bem, não levantarás o rosto? Mas, se não agires bem, o pecado está à porta, espreitando-te;
      o seu desejo é contra ti, mas tu deves dominá-lo.”
    status: ia-sem-revisao
  '4:8':
    texto: Caim disse a Abel, seu irmão... E, estando eles no campo, Caim atacou Abel, seu irmão, e o
      matou.
    status: ia-sem-revisao
    observacao: O hebraico não traz as palavras de Caim; a Septuaginta e a Vulgata acrescentam “Vamos
      ao campo”.
  '4:9':
    texto: 'O Senhor disse a Caim: “Onde está Abel, teu irmão?” Ele respondeu: “Não sei. Acaso sou eu
      o guarda do meu irmão?”'
    status: ia-sem-revisao
  '4:10':
    texto: 'Disse o Senhor: “Que fizeste? A voz do sangue do teu irmão clama da terra até mim.'
    status: ia-sem-revisao
  '4:11':
    texto: Agora, pois, maldito serás, banido da terra que abriu a boca para receber das tuas mãos o sangue
      do teu irmão.
    status: ia-sem-revisao
  '4:12':
    texto: Quando cultivares o solo, ele não te dará mais a sua força; serás fugitivo e errante sobre
      a terra.”
    status: ia-sem-revisao
  '4:13':
    texto: 'Caim disse ao Senhor: “A minha culpa é grande demais para ser suportada.'
    status: ia-sem-revisao
  '4:14':
    texto: Eis que hoje me expulsas da face da terra, e eu terei de me esconder da tua face; serei fugitivo
      e errante sobre a terra, e quem me encontrar me matará.”
    status: ia-sem-revisao
  '4:15':
    texto: 'O Senhor lhe disse: “Por isso, quem matar Caim sofrerá a vingança sete vezes.” E o Senhor
      pôs em Caim um sinal, para que não o ferisse quem o encontrasse.'
    status: ia-sem-revisao
  '4:25':
    texto: 'Adão conheceu ainda a sua mulher, que deu à luz um filho e lhe pôs o nome de Set, dizendo:
      “Deus me concedeu outra descendência no lugar de Abel, que Caim matou.”'
    status: ia-sem-revisao
  '6:5':
    texto: O Senhor viu que a maldade do homem era grande na terra e que toda a inclinação dos pensamentos
      do seu coração era só para o mal, em todo o tempo.
    status: ia-sem-revisao
  '6:6':
    texto: O Senhor arrependeu-se de ter feito o homem na terra e sentiu dor no seu coração.
    status: ia-sem-revisao
  '6:7':
    texto: 'E disse: “Exterminarei da face da terra o homem que criei, e com o homem os animais domésticos,
      os répteis e as aves do céu, porque me arrependo de os ter feito.”'
    status: ia-sem-revisao
  '6:8':
    texto: Noé, porém, encontrou graça aos olhos do Senhor.
    status: ia-sem-revisao
  '7:1':
    texto: 'O Senhor disse a Noé: “Entra na arca, tu e toda a tua casa, pois vi que és justo diante de
      mim, nesta geração.'
    status: ia-sem-revisao
  '7:2':
    texto: De todos os animais puros tomarás sete casais, o macho e a sua fêmea; dos animais que não são
      puros, um casal, o macho e a sua fêmea;
    status: ia-sem-revisao
  '7:3':
    texto: também das aves do céu, sete casais, macho e fêmea, para conservar a espécie sobre a face de
      toda a terra.
    status: ia-sem-revisao
  '7:4':
    texto: Pois, daqui a sete dias, farei chover sobre a terra durante quarenta dias e quarenta noites,
      e exterminarei da face da terra todos os seres que fiz.”
    status: ia-sem-revisao
  '7:5':
    texto: Noé fez tudo o que o Senhor lhe tinha ordenado.
    status: ia-sem-revisao
  '7:10':
    texto: Passados os sete dias, as águas do dilúvio vieram sobre a terra.
    status: ia-sem-revisao
  '8:6':
    texto: Ao fim de quarenta dias, Noé abriu a janela da arca que tinha feito.
    status: ia-sem-revisao
  '8:7':
    texto: Soltou o corvo, que saiu, indo e voltando, até que as águas secaram sobre a terra.
    status: ia-sem-revisao
  '8:8':
    texto: Depois soltou a pomba, para ver se as águas tinham baixado sobre a face da terra.
    status: ia-sem-revisao
  '8:9':
    texto: Mas a pomba não achou onde pousar o pé e voltou para ele, para a arca, porque havia água sobre
      toda a face da terra. Ele estendeu a mão, tomou-a e a recolheu consigo na arca.
    status: ia-sem-revisao
  '8:10':
    texto: Esperou ainda outros sete dias e soltou de novo a pomba da arca.
    status: ia-sem-revisao
  '8:11':
    texto: A pomba voltou a ele ao entardecer, e eis que trazia no bico uma folha fresca de oliveira.
      Noé compreendeu que as águas tinham baixado sobre a terra.
    status: ia-sem-revisao
  '8:12':
    texto: Esperou ainda outros sete dias e soltou a pomba, que já não voltou a ele.
    status: ia-sem-revisao
  '8:13':
    texto: No ano seiscentos e um, no primeiro mês, no primeiro dia do mês, as águas secaram sobre a terra.
      Noé removeu a cobertura da arca, olhou e viu que a superfície do solo estava seca.
    status: ia-sem-revisao
  '8:20':
    texto: Noé construiu um altar ao Senhor; tomou de todos os animais puros e de todas as aves puras
      e ofereceu holocaustos sobre o altar.
    status: ia-sem-revisao
  '8:21':
    texto: 'O Senhor aspirou o suave perfume e disse em seu coração: “Nunca mais amaldiçoarei a terra
      por causa do homem, porque a inclinação do coração do homem é má desde a sua juventude; nunca mais
      ferirei todos os seres vivos, como fiz.'
    status: ia-sem-revisao
  '8:22':
    texto: Enquanto durar a terra, não cessarão a semeadura e a colheita, o frio e o calor, o verão e
      o inverno, o dia e a noite.”
    status: ia-sem-revisao
  '9:1':
    texto: 'Deus abençoou Noé e os seus filhos e lhes disse: “Sede fecundos, multiplicai-vos e enchei
      a terra.'
    status: ia-sem-revisao
  '9:2':
    texto: 'O temor e o pavor de vós virão sobre todos os animais da terra, sobre todas as aves do céu,
      sobre tudo o que se move na terra e sobre todos os peixes do mar: foram entregues nas vossas mãos.'
    status: ia-sem-revisao
  '9:3':
    texto: Tudo o que se move e tem vida vos servirá de alimento; como a erva verde, tudo vos dou.
    status: ia-sem-revisao
  '9:4':
    texto: Somente não comereis a carne com a sua vida, isto é, com o seu sangue.
    status: ia-sem-revisao
  '9:5':
    texto: 'Pedirei contas do vosso sangue, da vossa vida: pedirei contas a todo animal e ao homem; ao
      homem, a cada um, pedirei contas da vida do seu irmão.'
    status: ia-sem-revisao
  '9:6':
    texto: Quem derramar o sangue do homem, pelo homem seu sangue será derramado, porque Deus fez o homem
      à sua imagem.
    status: ia-sem-revisao
  '9:7':
    texto: E vós, sede fecundos e multiplicai-vos; povoai a terra e dominai-a.”
    status: ia-sem-revisao
  '9:8':
    texto: 'Deus disse a Noé e aos seus filhos que estavam com ele:'
    status: ia-sem-revisao
  '9:9':
    texto: “Eis que estabeleço a minha aliança convosco e com a vossa descendência depois de vós,
    status: ia-sem-revisao
  '9:10':
    texto: 'e com todos os seres vivos que estão convosco: as aves, os animais domésticos e todas as feras
      da terra que estão convosco, todos os que saíram da arca, todos os animais da terra.'
    status: ia-sem-revisao
  '9:11':
    texto: 'Estabeleço a minha aliança convosco: nunca mais será exterminada toda carne pelas águas do
      dilúvio, nem haverá mais dilúvio para destruir a terra.”'
    status: ia-sem-revisao
  '9:12':
    texto: 'Deus disse: “Este é o sinal da aliança que estabeleço entre mim e vós e todos os seres vivos
      que estão convosco, por todas as gerações futuras:'
    status: ia-sem-revisao
  '9:13':
    texto: Pus o meu arco nas nuvens, e será sinal da aliança entre mim e a terra.
    status: ia-sem-revisao
  '9:14':
    texto: Quando eu reunir nuvens sobre a terra, o arco aparecerá nas nuvens,
    status: ia-sem-revisao
  '9:15':
    texto: e eu me lembrarei da minha aliança convosco e com todos os seres vivos de toda carne; e nunca
      mais as águas se tornarão um dilúvio para destruir toda carne.
    status: ia-sem-revisao
  '11:1':
    texto: Toda a terra tinha uma só língua e as mesmas palavras.
    status: ia-sem-revisao
  '11:2':
    texto: Ao deslocarem-se para o oriente, encontraram uma planície na terra de Senaar e ali se estabeleceram.
    status: ia-sem-revisao
  '11:3':
    texto: 'Disseram uns aos outros: “Vamos, façamos tijolos e cozamo-los ao fogo.” O tijolo lhes servia
      de pedra, e o betume, de argamassa.'
    status: ia-sem-revisao
  '11:4':
    texto: 'Disseram: “Vamos, construamos para nós uma cidade e uma torre cujo topo toque o céu, e façamos
      um nome para nós, para não sermos dispersos sobre toda a face da terra.”'
    status: ia-sem-revisao
  '11:5':
    texto: O Senhor desceu para ver a cidade e a torre que os filhos dos homens estavam construindo.
    status: ia-sem-revisao
  '11:6':
    texto: 'E o Senhor disse: “Eis que são um só povo e têm todos uma só língua, e este é o começo da
      sua obra; agora nada os impedirá de realizar o que projetarem.'
    status: ia-sem-revisao
  '11:7':
    texto: Vamos, desçamos e confundamos ali a sua língua, para que não entendam mais a língua uns dos
      outros.”
    status: ia-sem-revisao
  '11:8':
    texto: O Senhor os dispersou dali sobre toda a face da terra, e eles cessaram de construir a cidade.
    status: ia-sem-revisao
  '11:9':
    texto: Por isso se chamou Babel, porque ali o Senhor confundiu a língua de toda a terra, e dali o
      Senhor os dispersou sobre toda a face da terra.
    status: ia-sem-revisao
  '12:1':
    texto: 'O Senhor disse a Abrão: “Sai da tua terra, da tua parentela e da casa do teu pai, para a terra
      que eu te mostrarei.'
    status: ia-sem-revisao
  '12:2':
    texto: Farei de ti uma grande nação, te abençoarei e engrandecerei o teu nome; e serás uma bênção.
    status: ia-sem-revisao
  '12:3':
    texto: Abençoarei os que te abençoarem e amaldiçoarei os que te amaldiçoarem; em ti serão abençoadas
      todas as famílias da terra.”
    status: ia-sem-revisao
  '12:4':
    texto: Abrão partiu, como o Senhor lhe tinha dito, e Ló foi com ele. Abrão tinha setenta e cinco anos
      quando saiu de Harã.
    partes:
    - Abrão partiu, como o Senhor lhe tinha dito, e Ló foi com ele.
    - Abrão tinha setenta e cinco anos quando saiu de Harã.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '12:5':
    texto: Abrão tomou Sarai, sua mulher, e Ló, filho do seu irmão, com todos os bens que tinham adquirido
      e as pessoas que tinham obtido em Harã, e saíram em direção à terra de Canaã. Chegaram à terra de
      Canaã.
    status: ia-sem-revisao
  '12:6':
    texto: Abrão atravessou a terra até o lugar de Siquém, até o carvalho de Moré. Os cananeus estavam
      então na terra.
    status: ia-sem-revisao
  '12:7':
    texto: 'O Senhor apareceu a Abrão e disse: “À tua descendência darei esta terra.” Ele construiu ali
      um altar ao Senhor, que lhe tinha aparecido.'
    status: ia-sem-revisao
  '12:8':
    texto: Dali passou para o monte, a oriente de Betel, e armou a sua tenda, tendo Betel a ocidente e
      Ai a oriente. Construiu ali um altar ao Senhor e invocou o nome do Senhor.
    status: ia-sem-revisao
  '12:9':
    texto: Depois Abrão partiu, avançando por etapas em direção ao Negueb.
    status: ia-sem-revisao
  '13:2':
    texto: Abrão era muito rico em gado, em prata e em ouro.
    status: ia-sem-revisao
  '13:5':
    texto: Também Ló, que acompanhava Abrão, tinha ovelhas, bois e tendas.
    status: ia-sem-revisao
  '13:6':
    texto: A terra não podia sustentá-los a todos juntos, porque os seus bens eram grandes, e não podiam
      habitar juntos.
    status: ia-sem-revisao
  '13:7':
    texto: Houve contenda entre os pastores do gado de Abrão e os pastores do gado de Ló. Os cananeus
      e os fereseus habitavam então na terra.
    status: ia-sem-revisao
  '13:8':
    texto: 'Abrão disse a Ló: “Não haja discórdia entre mim e ti, entre os meus pastores e os teus, porque
      somos irmãos.'
    status: ia-sem-revisao
  '13:9':
    texto: 'Não está toda a terra diante de ti? Separa-te de mim: se fores para a esquerda, eu irei para
      a direita; se fores para a direita, eu irei para a esquerda.”'
    status: ia-sem-revisao
  '13:10':
    texto: Ló levantou os olhos e viu que toda a planície do Jordão era toda irrigada — antes de o Senhor
      destruir Sodoma e Gomorra — como o jardim do Senhor, como a terra do Egito, na direção de Segor.
    status: ia-sem-revisao
  '13:11':
    texto: Ló escolheu para si toda a planície do Jordão e partiu para o oriente; e separaram-se um do
      outro.
    status: ia-sem-revisao
  '13:12':
    texto: Abrão habitou na terra de Canaã, e Ló habitou nas cidades da planície e armou as suas tendas
      até Sodoma.
    status: ia-sem-revisao
  '13:13':
    texto: Ora, os homens de Sodoma eram maus e grandes pecadores contra o Senhor.
    status: ia-sem-revisao
  '13:14':
    texto: 'O Senhor disse a Abrão, depois que Ló se separou dele: “Levanta os olhos e olha, do lugar
      onde estás, para o norte e para o sul, para o oriente e para o ocidente,'
    status: ia-sem-revisao
  '13:15':
    texto: pois toda a terra que vês, eu a darei a ti e à tua descendência para sempre.
    status: ia-sem-revisao
  '13:16':
    texto: 'Farei a tua descendência como o pó da terra: se alguém puder contar o pó da terra, também
      a tua descendência poderá ser contada.'
    status: ia-sem-revisao
  '13:17':
    texto: Levanta-te, percorre a terra em seu comprimento e largura, porque a ti a darei.”
    status: ia-sem-revisao
  '13:18':
    texto: Abrão levantou as suas tendas e foi habitar junto ao carvalho de Mambré, que está em Hebron,
      e ali construiu um altar ao Senhor.
    status: ia-sem-revisao
  '14:18':
    texto: Melquisedec, rei de Salém, trouxe pão e vinho; era sacerdote do Deus Altíssimo.
    status: ia-sem-revisao
  '14:19':
    texto: 'Abençoou Abrão, dizendo: “Bendito seja Abrão pelo Deus Altíssimo, criador do céu e da terra,'
    status: ia-sem-revisao
  '14:20':
    texto: e bendito seja o Deus Altíssimo, que entregou os teus inimigos nas tuas mãos.” E Abrão deu-lhe
      o dízimo de tudo.
    status: ia-sem-revisao
  '15:1':
    texto: 'Depois desses acontecimentos, a palavra do Senhor veio a Abrão numa visão: “Não temas, Abrão!
      Eu sou o teu escudo; a tua recompensa será muito grande.”'
    status: ia-sem-revisao
  '15:2':
    texto: 'Abrão respondeu: “Senhor Deus, que me darás? Vou-me sem filhos, e o herdeiro da minha casa
      é Eliezer de Damasco.'
    status: ia-sem-revisao
  '15:3':
    texto: Eis que não me deste descendência, e um servo da minha casa será o meu herdeiro.”
    status: ia-sem-revisao
  '15:4':
    texto: 'Eis que a palavra do Senhor lhe foi dirigida: “Esse não será o teu herdeiro; mas aquele que
      sair das tuas entranhas será o teu herdeiro.”'
    status: ia-sem-revisao
  '15:5':
    texto: 'Levou-o para fora e disse: “Olha para o céu e conta as estrelas, se és capaz de contá-las.”
      E acrescentou: “Assim será a tua descendência.”'
    status: ia-sem-revisao
  '15:6':
    texto: Abrão creu no Senhor, e isso lhe foi atribuído como justiça.
    status: ia-sem-revisao
  '15:7':
    texto: 'Disse-lhe: “Eu sou o Senhor, que te fiz sair de Ur dos caldeus para te dar esta terra em herança.”'
    status: ia-sem-revisao
  '15:8':
    texto: 'Ele respondeu: “Senhor Deus, como saberei que a possuirei?”'
    status: ia-sem-revisao
  '15:9':
    texto: 'Disse-lhe: “Traze-me uma novilha de três anos, uma cabra de três anos, um carneiro de três
      anos, uma rola e um pombinho.”'
    status: ia-sem-revisao
  '15:10':
    texto: Trouxe-lhe todos esses animais, dividiu-os ao meio e pôs cada metade em frente da outra; mas
      as aves não as dividiu.
    status: ia-sem-revisao
  '15:11':
    texto: As aves de rapina desciam sobre os cadáveres, mas Abrão as afugentava.
    status: ia-sem-revisao
  '15:12':
    texto: Ao pôr do sol, um sono profundo caiu sobre Abrão, e eis que um grande terror e uma densa escuridão
      desceram sobre ele.
    status: ia-sem-revisao
  '15:17':
    texto: Quando o sol se pôs e veio a escuridão, eis que um braseiro fumegante e uma tocha de fogo passaram
      por entre os animais divididos.
    status: ia-sem-revisao
  '15:18':
    texto: 'Naquele dia o Senhor fez uma aliança com Abrão, dizendo: “À tua descendência dei esta terra,
      desde o rio do Egito até o grande rio, o rio Eufrates:'
    status: ia-sem-revisao
  '15:21':
    texto: os amorreus, os cananeus, os gergeseus e os jebuseus.”
    partes:
    - os amorreus, os cananeus,
    - os gergeseus e os jebuseus.”
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '16:1':
    texto: Sarai, mulher de Abrão, não lhe tinha dado filhos. Tinha uma serva egípcia chamada Agar.
    status: ia-sem-revisao
  '16:2':
    texto: 'Sarai disse a Abrão: “O Senhor me impediu de ter filhos. Une-te, peço-te, à minha serva; talvez
      eu tenha filhos por meio dela.” Abrão atendeu à voz de Sarai.'
    status: ia-sem-revisao
  '16:3':
    texto: Sarai, mulher de Abrão, tomou Agar, a egípcia, sua serva, e a deu por mulher a Abrão, seu marido,
      depois de dez anos que Abrão habitava na terra de Canaã.
    status: ia-sem-revisao
  '16:4':
    texto: Ele uniu-se a Agar, que concebeu. Quando ela viu que estava grávida, passou a desprezar a sua
      senhora.
    status: ia-sem-revisao
  '16:5':
    texto: 'Sarai disse a Abrão: “Que a injustiça que sofro recaia sobre ti! Eu mesma pus a minha serva
      nos teus braços; mas, vendo que concebeu, passou a desprezar-me. Julgue o Senhor entre mim e ti!”'
    status: ia-sem-revisao
  '16:6':
    texto: 'Abrão disse a Sarai: “Eis que a tua serva está nas tuas mãos; faze com ela o que bem te parecer.”
      Sarai a maltratou, e ela fugiu da sua presença.'
    status: ia-sem-revisao
  '16:7':
    texto: O anjo do Senhor a encontrou junto a uma fonte de água no deserto, a fonte que está no caminho
      de Sur.
    status: ia-sem-revisao
  '16:8':
    texto: 'Ele disse: “Agar, serva de Sarai, de onde vens e para onde vais?” Ela respondeu: “Fujo da
      presença de Sarai, minha senhora.”'
    status: ia-sem-revisao
  '16:9':
    texto: 'O anjo do Senhor disse-lhe: “Volta para a tua senhora e submete-te a ela.”'
    status: ia-sem-revisao
  '16:10':
    texto: 'O anjo do Senhor disse-lhe: “Multiplicarei muito a tua descendência, de modo que não poderá
      ser contada, de tão numerosa.”'
    status: ia-sem-revisao
  '16:11':
    texto: 'O anjo do Senhor disse-lhe: “Eis que estás grávida e darás à luz um filho, e lhe porás o nome
      de Ismael, porque o Senhor ouviu a tua aflição.'
    status: ia-sem-revisao
  '16:12':
    texto: 'Ele será um homem como um asno selvagem: a sua mão contra todos, e a mão de todos contra ele;
      e habitará diante de todos os seus irmãos.”'
    status: ia-sem-revisao
  '16:15':
    texto: Agar deu à luz um filho a Abrão, e Abrão chamou Ismael ao filho que Agar lhe deu.
    status: ia-sem-revisao
  '16:16':
    texto: Abrão tinha oitenta e seis anos quando Agar lhe deu Ismael.
    status: ia-sem-revisao
  '17:1':
    texto: 'Quando Abrão tinha noventa e nove anos, o Senhor lhe apareceu e disse: “Eu sou o Deus Todo-Poderoso;
      anda na minha presença e sê íntegro.'
    status: ia-sem-revisao
  '17:3':
    texto: 'Abrão prostrou-se com o rosto em terra, e Deus lhe falou:'
    status: ia-sem-revisao
  '17:4':
    texto: '“Quanto a mim, eis a minha aliança contigo: serás pai de uma multidão de nações.'
    status: ia-sem-revisao
  '17:5':
    texto: Já não te chamarás Abrão, mas teu nome será Abraão, porque te faço pai de uma multidão de nações.
    status: ia-sem-revisao
  '17:6':
    texto: Eu te tornarei extremamente fecundo, farei de ti nações, e de ti sairão reis.
    status: ia-sem-revisao
  '17:7':
    texto: Estabelecerei a minha aliança entre mim e ti e a tua descendência depois de ti, de geração
      em geração, como aliança eterna, para ser o teu Deus e o da tua descendência depois de ti.
    status: ia-sem-revisao
  '17:8':
    texto: Darei a ti e à tua descendência depois de ti a terra em que habitas como estrangeiro, toda
      a terra de Canaã, em posse perpétua, e serei o seu Deus.”
    status: ia-sem-revisao
  '17:9':
    texto: 'Deus disse a Abraão: “Quanto a ti, guardarás a minha aliança, tu e a tua descendência depois
      de ti, de geração em geração.'
    status: ia-sem-revisao
  '17:10':
    texto: 'Esta é a minha aliança, que guardareis entre mim e vós e a tua descendência depois de ti:
      todo varão entre vós será circuncidado.'
    status: ia-sem-revisao
  '17:15':
    texto: 'Deus disse a Abraão: “A tua mulher Sarai não a chamarás Sarai, mas o seu nome será Sara.'
    status: ia-sem-revisao
  '17:16':
    texto: Eu a abençoarei e dela te darei um filho; a abençoarei, e ela se tornará nações, e dela sairão
      reis de povos.”
    status: ia-sem-revisao
  '17:17':
    texto: 'Abraão prostrou-se com o rosto em terra e riu, e disse em seu coração: “A um homem de cem
      anos nascerá um filho? E Sara, com noventa anos, dará à luz?”'
    status: ia-sem-revisao
  '17:18':
    texto: 'Abraão disse a Deus: “Oxalá Ismael viva diante de ti!”'
    status: ia-sem-revisao
  '17:19':
    texto: 'Deus disse: “Não, mas Sara, tua mulher, te dará um filho, e lhe porás o nome de Isaac. Estabelecerei
      com ele a minha aliança como aliança eterna, para a sua descendência depois dele.'
    status: ia-sem-revisao
  '17:20':
    texto: 'Quanto a Ismael, eu te ouvi: eis que o abençoei, o tornarei fecundo e o multiplicarei extremamente;
      gerará doze príncipes, e farei dele uma grande nação.'
    status: ia-sem-revisao
  '17:21':
    texto: Mas a minha aliança a estabelecerei com Isaac, que Sara te dará à luz no ano que vem, por esta
      época.”
    status: ia-sem-revisao
  '17:22':
    texto: Quando acabou de falar com ele, Deus subiu de junto de Abraão.
    status: ia-sem-revisao
  '18:1':
    texto: O Senhor apareceu-lhe junto ao carvalho de Mambré, quando ele estava sentado à porta da tenda,
      no calor do dia.
    status: ia-sem-revisao
  '18:2':
    texto: Levantou os olhos e viu que três homens estavam de pé diante dele. Ao vê-los, correu da porta
      da tenda ao seu encontro e prostrou-se por terra.
    status: ia-sem-revisao
  '18:3':
    texto: 'E disse: “Meu senhor, se encontrei graça aos teus olhos, não passes adiante sem parar junto
      do teu servo.'
    status: ia-sem-revisao
  '18:4':
    texto: Traga-se um pouco de água, lavai os pés e repousai debaixo da árvore.
    status: ia-sem-revisao
  '18:5':
    texto: 'Irei buscar um pedaço de pão para que reconforteis o vosso coração; depois seguireis adiante,
      pois foi para isso que passastes junto do vosso servo.” Eles responderam: “Faze como disseste.”'
    status: ia-sem-revisao
  '18:6':
    texto: 'Abraão correu à tenda, a Sara, e disse: “Depressa, toma três medidas de flor de farinha, amassa-a
      e faze pães.”'
    status: ia-sem-revisao
  '18:7':
    texto: Abraão correu ao rebanho, tomou um novilho tenro e bom e o entregou ao servo, que se apressou
      a prepará-lo.
    status: ia-sem-revisao
  '18:8':
    texto: Tomou coalhada, leite e o novilho que preparara, e os pôs diante deles; ele mesmo ficou de
      pé junto deles, debaixo da árvore, enquanto comiam.
    status: ia-sem-revisao
  '18:9':
    texto: 'Disseram-lhe: “Onde está Sara, tua mulher?” Ele respondeu: “Está na tenda.”'
    status: ia-sem-revisao
  '18:10':
    texto: 'Disse um deles: “Voltarei a ti dentro de um ano, e então Sara, tua mulher, terá um filho.”
      Sara estava escutando à entrada da tenda, atrás dele.'
    status: ia-sem-revisao
  '18:11':
    texto: Abraão e Sara eram velhos, avançados em anos; Sara já não tinha o fluxo das mulheres.
    status: ia-sem-revisao
  '18:12':
    texto: 'Sara riu consigo mesma, dizendo: “Depois de envelhecida, terei ainda prazer? E o meu senhor
      também é velho!”'
    status: ia-sem-revisao
  '18:13':
    texto: 'O Senhor disse a Abraão: “Por que riu Sara, dizendo: ‘Será verdade que darei à luz, sendo
      velha?’'
    status: ia-sem-revisao
  '18:14':
    texto: Haverá algo impossível para o Senhor? Na data marcada voltarei a ti, dentro de um ano, e Sara
      terá um filho.”
    status: ia-sem-revisao
  '18:15':
    texto: 'Sara negou, dizendo: “Não ri”, pois teve medo. Ele disse: “Sim, riste.”'
    status: ia-sem-revisao
  '18:16':
    texto: Os homens levantaram-se dali e olharam na direção de Sodoma; Abraão ia com eles para os acompanhar.
    status: ia-sem-revisao
  '18:17':
    texto: 'O Senhor disse: “Ocultarei eu a Abraão o que vou fazer?'
    status: ia-sem-revisao
  '18:18':
    texto: Abraão se tornará uma nação grande e poderosa, e nele serão abençoadas todas as nações da terra.
    status: ia-sem-revisao
  '18:19':
    texto: Pois eu o escolhi para que ordene a seus filhos e à sua casa depois dele que guardem o caminho
      do Senhor, praticando a justiça e o direito, para que o Senhor realize em favor de Abraão o que
      lhe prometeu.”
    status: ia-sem-revisao
  '18:20':
    texto: 'O Senhor disse: “O clamor contra Sodoma e Gomorra é grande, e o seu pecado é muito grave.'
    status: ia-sem-revisao
  '18:21':
    texto: Descerei para ver se o que fizeram corresponde ao clamor que chegou a mim; e, se não, saberei.”
    status: ia-sem-revisao
  '18:22':
    texto: Os homens partiram dali e foram para Sodoma, mas Abraão permaneceu de pé diante do Senhor.
    status: ia-sem-revisao
  '18:23':
    texto: 'Abraão aproximou-se e disse: “Destruirás o justo junto com o ímpio?'
    status: ia-sem-revisao
  '18:24':
    texto: Talvez haja cinquenta justos na cidade. Destruirás também a cidade e não a perdoarás por causa
      dos cinquenta justos que nela estão?
    status: ia-sem-revisao
  '18:25':
    texto: Longe de ti agir assim, matar o justo com o ímpio, de modo que o justo seja tratado como o
      ímpio! Longe de ti! O juiz de toda a terra não fará justiça?”
    status: ia-sem-revisao
  '18:26':
    texto: 'O Senhor disse: “Se eu encontrar em Sodoma cinquenta justos na cidade, perdoarei a todo o
      lugar por causa deles.”'
    status: ia-sem-revisao
  '18:27':
    texto: 'Abraão respondeu: “Eis que me atrevi a falar ao meu Senhor, eu que sou pó e cinza.'
    status: ia-sem-revisao
  '18:28':
    texto: 'Talvez faltem cinco aos cinquenta justos; destruirás por cinco toda a cidade?” Ele disse:
      “Não a destruirei, se encontrar ali quarenta e cinco.”'
    status: ia-sem-revisao
  '18:29':
    texto: 'Abraão continuou a falar-lhe: “Talvez se encontrem ali quarenta.” Ele disse: “Não o farei
      por causa dos quarenta.”'
    status: ia-sem-revisao
  '18:30':
    texto: 'Disse: “Não se irrite o meu Senhor, e deixa-me falar: talvez se encontrem ali trinta.” Ele
      disse: “Não o farei, se encontrar ali trinta.”'
    status: ia-sem-revisao
  '18:31':
    texto: 'Disse: “Eis que me atrevi a falar ao meu Senhor: talvez se encontrem ali vinte.” Ele disse:
      “Não a destruirei por causa dos vinte.”'
    status: ia-sem-revisao
  '18:32':
    texto: 'Disse: “Não se irrite o meu Senhor, e falarei só mais esta vez: talvez se encontrem ali dez.”
      Ele disse: “Não a destruirei por causa dos dez.”'
    status: ia-sem-revisao
  '18:33':
    texto: O Senhor retirou-se quando acabou de falar a Abraão, e Abraão voltou ao seu lugar.
    status: ia-sem-revisao
  '19:15':
    texto: 'Ao amanhecer, os anjos instaram com Ló, dizendo: “Levanta-te, toma a tua mulher e as tuas
      duas filhas que aqui se encontram, para não pereceres no castigo da cidade.”'
    status: ia-sem-revisao
  '19:16':
    texto: Como ele hesitasse, os homens o tomaram pela mão, bem como a sua mulher e as suas duas filhas,
      por compaixão do Senhor para com ele; levaram-no para fora e o deixaram fora da cidade.
    status: ia-sem-revisao
  '19:17':
    texto: 'Quando os tinham levado para fora, um deles disse: “Salva a tua vida! Não olhes para trás
      e não pares em toda a planície; foge para o monte, para não pereceres.”'
    status: ia-sem-revisao
  '19:18':
    texto: 'Ló disse-lhes: “Não, meu senhor!'
    status: ia-sem-revisao
  '19:19':
    texto: Eis que o teu servo encontrou graça aos teus olhos, e foi grande a bondade que usaste comigo,
      salvando-me a vida; mas eu não posso fugir para o monte, para que o mal não me alcance e eu morra.
    status: ia-sem-revisao
  '19:20':
    texto: Eis aquela cidade, tão perto que se pode fugir para lá, e é pequena. Deixa-me fugir para lá
      — não é pequena? — e viverei.”
    status: ia-sem-revisao
  '19:21':
    texto: 'Disse-lhe: “Eis que também nisto te atendo e não destruirei a cidade de que falaste.'
    status: ia-sem-revisao
  '19:22':
    texto: Depressa, foge para lá, porque nada posso fazer enquanto lá não chegares.” Por isso se chamou
      Segor àquela cidade.
    status: ia-sem-revisao
  '19:23':
    texto: O sol surgia sobre a terra quando Ló chegou a Segor.
    status: ia-sem-revisao
  '19:24':
    texto: Então o Senhor fez chover sobre Sodoma e Gomorra enxofre e fogo, vindos do Senhor, do céu.
    status: ia-sem-revisao
  '19:25':
    texto: Destruiu aquelas cidades e toda a planície, todos os habitantes das cidades e a vegetação do
      solo.
    status: ia-sem-revisao
  '19:26':
    texto: A mulher de Ló olhou para trás e transformou-se numa estátua de sal.
    status: ia-sem-revisao
  '19:27':
    texto: Abraão levantou-se de manhã cedo e foi ao lugar onde estivera diante do Senhor.
    status: ia-sem-revisao
  '19:28':
    texto: Olhou para Sodoma e Gomorra e para toda a região da planície e viu que subia da terra uma fumaça
      como a fumaça de uma fornalha.
    status: ia-sem-revisao
  '19:29':
    texto: Quando Deus destruiu as cidades da planície, lembrou-se de Abraão e tirou Ló do meio da catástrofe,
      quando destruiu as cidades onde Ló habitava.
    status: ia-sem-revisao
  '21:1':
    texto: O Senhor visitou Sara, como tinha dito, e fez por ela o que havia prometido.
    status: ia-sem-revisao
  '21:2':
    texto: Sara concebeu e deu a Abraão um filho na sua velhice, no tempo que Deus lhe havia indicado.
    status: ia-sem-revisao
  '21:3':
    texto: Abraão deu o nome de Isaac ao filho que lhe nasceu, o que Sara lhe deu à luz.
    status: ia-sem-revisao
  '21:5':
    texto: Abraão tinha cem anos quando lhe nasceu o seu filho Isaac.
    status: ia-sem-revisao
  '21:8':
    texto: O menino cresceu e foi desmamado, e Abraão deu um grande banquete no dia em que Isaac foi desmamado.
    status: ia-sem-revisao
  '21:9':
    texto: Sara viu o filho de Agar, a egípcia, que ela dera a Abraão, brincando.
    status: ia-sem-revisao
  '21:10':
    texto: 'Disse a Abraão: “Expulsa essa serva e o seu filho, porque o filho dessa serva não será herdeiro
      com o meu filho Isaac.”'
    status: ia-sem-revisao
  '21:11':
    texto: Isso desagradou muito a Abraão, por causa do seu filho.
    status: ia-sem-revisao
  '21:12':
    texto: 'Deus disse a Abraão: “Não te aflija o que se refere ao menino e à tua serva. Em tudo o que
      Sara te disser, ouve a sua voz, porque é em Isaac que terás descendência com o teu nome.'
    status: ia-sem-revisao
  '21:13':
    texto: Mas também do filho da serva farei uma nação, porque é tua descendência.”
    status: ia-sem-revisao
  '21:14':
    texto: Abraão levantou-se de manhã cedo, tomou pão e um odre de água e os deu a Agar, pondo-os sobre
      o seu ombro, com o menino, e a despediu. Ela partiu e andou errante pelo deserto de Bersabeia.
    status: ia-sem-revisao
  '21:15':
    texto: Acabada a água do odre, ela deixou o menino debaixo de um arbusto.
    status: ia-sem-revisao
  '21:16':
    texto: 'Foi sentar-se defronte, a certa distância, à distância de um tiro de arco, porque dizia: “Não
      quero ver morrer o menino.” Sentou-se defronte e pôs-se a chorar em voz alta.'
    status: ia-sem-revisao
  '21:17':
    texto: 'Deus ouviu a voz do menino, e o anjo de Deus chamou Agar do céu e lhe disse: “Que tens, Agar?
      Não temas, porque Deus ouviu a voz do menino no lugar onde está.'
    status: ia-sem-revisao
  '21:18':
    texto: Levanta-te, ergue o menino e toma-o pela mão, porque farei dele uma grande nação.”
    status: ia-sem-revisao
  '21:19':
    texto: Deus abriu-lhe os olhos, e ela viu um poço de água; foi encher o odre e deu de beber ao menino.
    status: ia-sem-revisao
  '21:20':
    texto: Deus estava com o menino, que cresceu; habitou no deserto e tornou-se um flecheiro.
    status: ia-sem-revisao
  '22:1':
    texto: 'Depois desses acontecimentos, Deus pôs Abraão à prova e lhe disse: “Abraão!” Ele respondeu:
      “Eis-me aqui.”'
    status: ia-sem-revisao
  '22:2':
    texto: 'Disse: “Toma o teu filho, o teu único, a quem amas, Isaac, e vai à terra de Moriá; oferece-o
      ali em holocausto sobre um dos montes que eu te indicar.”'
    status: ia-sem-revisao
  '22:3':
    texto: Abraão levantou-se de manhã cedo, albardou o jumento, tomou consigo dois servos e Isaac, seu
      filho; rachou a lenha para o holocausto, pôs-se a caminho e foi ao lugar que Deus lhe indicara.
    status: ia-sem-revisao
  '22:4':
    texto: No terceiro dia, Abraão levantou os olhos e viu o lugar de longe.
    status: ia-sem-revisao
  '22:5':
    texto: 'Abraão disse aos seus servos: “Ficai aqui com o jumento; eu e o menino iremos até lá, adoraremos
      e voltaremos a vós.”'
    status: ia-sem-revisao
  '22:6':
    texto: Abraão tomou a lenha do holocausto e a pôs sobre Isaac, seu filho; tomou na mão o fogo e o
      cutelo, e os dois foram juntos.
    status: ia-sem-revisao
  '22:7':
    texto: 'Isaac disse a Abraão, seu pai: “Meu pai!” Ele respondeu: “Aqui estou, meu filho.” Disse: “Eis
      o fogo e a lenha, mas onde está o cordeiro para o holocausto?”'
    status: ia-sem-revisao
  '22:8':
    texto: 'Abraão respondeu: “Deus proverá o cordeiro para o holocausto, meu filho.” E os dois foram
      juntos.'
    status: ia-sem-revisao
  '22:9':
    texto: Chegaram ao lugar que Deus lhe indicara. Abraão construiu ali o altar, dispôs a lenha, amarrou
      Isaac, seu filho, e o pôs sobre o altar, em cima da lenha.
    status: ia-sem-revisao
  '22:10':
    texto: Abraão estendeu a mão e tomou o cutelo para imolar o seu filho.
    status: ia-sem-revisao
  '22:11':
    texto: 'Mas o anjo do Senhor o chamou do céu: “Abraão! Abraão!” Ele respondeu: “Eis-me aqui.”'
    status: ia-sem-revisao
  '22:12':
    texto: 'Disse: “Não estendas a mão contra o menino e não lhe faças mal algum, pois agora sei que temes
      a Deus, porque não me recusaste o teu filho, o teu único.”'
    status: ia-sem-revisao
  '22:13':
    texto: Abraão levantou os olhos e viu um carneiro preso pelos chifres num mato; foi, tomou o carneiro
      e o ofereceu em holocausto em lugar do seu filho.
    status: ia-sem-revisao
  '22:14':
    texto: 'Abraão deu àquele lugar o nome de “O Senhor proverá”, como se diz até hoje: “No monte do Senhor
      se proverá.”'
    status: ia-sem-revisao
  '22:15':
    texto: O anjo do Senhor chamou Abraão do céu pela segunda vez
    status: ia-sem-revisao
  '22:16':
    texto: 'e disse: “Juro por mim mesmo, oráculo do Senhor: porque fizeste isto e não me recusaste o
      teu filho, o teu único,'
    status: ia-sem-revisao
  '22:17':
    texto: te abençoarei e multiplicarei a tua descendência como as estrelas do céu e como a areia que
      está na praia do mar, e a tua descendência conquistará as portas dos seus inimigos.
    status: ia-sem-revisao
  '22:18':
    texto: Todas as nações da terra serão abençoadas na tua descendência, porque obedeceste à minha voz.”
    status: ia-sem-revisao
  '22:19':
    texto: Abraão voltou aos seus servos; levantaram-se e foram juntos a Bersabeia, e Abraão habitou em
      Bersabeia.
    status: ia-sem-revisao
  '23:1':
    texto: Sara viveu cento e vinte e sete anos; esses foram os anos da vida de Sara.
    status: ia-sem-revisao
  '23:2':
    texto: Sara morreu em Cariat-Arbe, que é Hebron, na terra de Canaã; Abraão veio fazer luto por Sara
      e chorá-la.
    status: ia-sem-revisao
  '23:3':
    texto: 'Depois Abraão levantou-se de junto do seu morto e falou aos filhos de Het:'
    status: ia-sem-revisao
  '23:4':
    texto: “Sou estrangeiro e residente entre vós; dai-me uma propriedade para sepultura entre vós, para
      que eu sepulte o meu morto, afastando-o da minha vista.”
    status: ia-sem-revisao
  '23:19':
    texto: Depois disso, Abraão sepultou Sara, sua mulher, na gruta do campo de Macpela, em frente a Mambré,
      que é Hebron, na terra de Canaã.
    status: ia-sem-revisao
  '24:1':
    texto: Abraão era velho, avançado em anos, e o Senhor abençoara Abraão em tudo.
    status: ia-sem-revisao
  '24:2':
    texto: 'Abraão disse ao seu servo, o mais velho da sua casa, que governava tudo o que ele possuía:
      “Põe a tua mão debaixo da minha coxa,'
    status: ia-sem-revisao
  '24:3':
    texto: e eu te farei jurar pelo Senhor, Deus do céu e Deus da terra, que não tomarás mulher para o
      meu filho das filhas dos cananeus, entre os quais habito,
    status: ia-sem-revisao
  '24:4':
    texto: mas irás à minha terra e à minha parentela, para tomar mulher para o meu filho Isaac.”
    status: ia-sem-revisao
  '24:5':
    texto: 'O servo lhe disse: “Talvez a mulher não queira vir comigo para esta terra. Devo então levar
      o teu filho à terra de onde saíste?”'
    status: ia-sem-revisao
  '24:6':
    texto: 'Abraão lhe disse: “Guarda-te de levar o meu filho para lá.'
    status: ia-sem-revisao
  '24:7':
    texto: 'O Senhor, Deus do céu, que me tirou da casa de meu pai e da terra da minha parentela, que
      me falou e me jurou, dizendo: ‘À tua descendência darei esta terra’, ele enviará o seu anjo diante
      de ti, e de lá tomarás mulher para o meu filho.'
    status: ia-sem-revisao
  '24:8':
    texto: Se a mulher não quiser vir contigo, ficarás livre deste meu juramento; só não leves para lá
      o meu filho.”
    status: ia-sem-revisao
  24:62:
    texto: Isaac tinha voltado de Beer-Lahai-Roi, pois habitava na terra do Negueb.
    status: ia-sem-revisao
  24:63:
    texto: Isaac saiu ao entardecer para meditar no campo; levantou os olhos e viu camelos que vinham.
    status: ia-sem-revisao
  24:64:
    texto: Rebeca levantou os olhos, viu Isaac e desceu do camelo.
    status: ia-sem-revisao
  24:65:
    texto: 'Disse ao servo: “Quem é aquele homem que vem pelo campo ao nosso encontro?” O servo respondeu:
      “É o meu senhor.” Ela tomou o véu e cobriu-se.'
    status: ia-sem-revisao
  24:66:
    texto: O servo contou a Isaac tudo o que tinha feito.
    status: ia-sem-revisao
  24:67:
    texto: Isaac introduziu-a na tenda de Sara, sua mãe; tomou Rebeca, e ela tornou-se sua mulher; ele
      a amou, e Isaac encontrou consolo depois da morte de sua mãe.
    status: ia-sem-revisao
  '27:1':
    texto: 'Quando Isaac envelheceu e os seus olhos se enfraqueceram a ponto de não ver, chamou Esaú,
      seu filho mais velho, e lhe disse: “Meu filho!” Ele respondeu: “Aqui estou.”'
    status: ia-sem-revisao
  '27:2':
    texto: 'Disse: “Eis que estou velho e não sei o dia da minha morte.'
    status: ia-sem-revisao
  '27:3':
    texto: Agora, toma as tuas armas, a tua aljava e o teu arco, sai ao campo e caça alguma coisa para
      mim.
    status: ia-sem-revisao
  '27:4':
    texto: Prepara-me um prato saboroso, como eu gosto, e traze-mo para eu comer, a fim de que eu te abençoe
      antes de morrer.”
    status: ia-sem-revisao
  '27:5':
    texto: Rebeca estava escutando enquanto Isaac falava a Esaú, seu filho. Esaú foi ao campo caçar para
      trazer a caça.
    status: ia-sem-revisao
  '27:15':
    texto: Rebeca tomou as melhores roupas de Esaú, seu filho mais velho, que tinha em casa, e vestiu
      Jacó, seu filho mais novo.
    status: ia-sem-revisao
  '27:16':
    texto: Com as peles dos cabritos cobriu-lhe as mãos e a parte lisa do pescoço.
    status: ia-sem-revisao
  '27:17':
    texto: Depois entregou a Jacó, seu filho, o prato saboroso e o pão que preparara.
    status: ia-sem-revisao
  '27:18':
    texto: 'Ele foi ao pai e disse: “Meu pai!” Ele respondeu: “Aqui estou. Quem és tu, meu filho?”'
    status: ia-sem-revisao
  '27:19':
    texto: 'Jacó disse ao pai: “Eu sou Esaú, o teu primogênito. Fiz como me disseste. Levanta-te, senta-te
      e come da minha caça, para que me abençoes.”'
    status: ia-sem-revisao
  '27:20':
    texto: 'Isaac disse ao filho: “Como foi que a encontraste tão depressa, meu filho?” Ele respondeu:
      “Porque o Senhor, teu Deus, a pôs diante de mim.”'
    status: ia-sem-revisao
  '27:21':
    texto: 'Isaac disse a Jacó: “Aproxima-te, meu filho, para que eu te apalpe, e veja se és mesmo o meu
      filho Esaú ou não.”'
    status: ia-sem-revisao
  '27:22':
    texto: 'Jacó aproximou-se de Isaac, seu pai, que o apalpou e disse: “A voz é a voz de Jacó, mas as
      mãos são as mãos de Esaú.”'
    status: ia-sem-revisao
  '27:23':
    texto: Não o reconheceu, porque as suas mãos estavam peludas como as de Esaú, seu irmão; e o abençoou.
    status: ia-sem-revisao
  '27:24':
    texto: 'Disse: “És tu mesmo o meu filho Esaú?” Ele respondeu: “Sou.”'
    status: ia-sem-revisao
  '27:25':
    texto: 'Disse: “Serve-me, e comerei da caça do meu filho, para que eu te abençoe.” Serviu-o, e ele
      comeu; trouxe-lhe também vinho, e ele bebeu.'
    status: ia-sem-revisao
  '27:26':
    texto: 'Isaac, seu pai, disse-lhe: “Aproxima-te, meu filho, e beija-me.”'
    status: ia-sem-revisao
  '27:27':
    texto: 'Ele se aproximou e o beijou. Isaac sentiu o cheiro das suas roupas e o abençoou, dizendo:
      “Eis que o cheiro do meu filho é como o cheiro de um campo que o Senhor abençoou.'
    status: ia-sem-revisao
  '27:28':
    texto: Que Deus te dê o orvalho do céu, a fertilidade da terra e abundância de trigo e de vinho.
    status: ia-sem-revisao
  '27:29':
    texto: Que te sirvam povos e se prostrem diante de ti nações; sê senhor dos teus irmãos, e prostrem-se
      diante de ti os filhos da tua mãe. Maldito seja quem te amaldiçoar, e bendito quem te abençoar.”
    status: ia-sem-revisao
  '28:10':
    texto: Jacó partiu de Bersabeia e foi para Harã.
    status: ia-sem-revisao
  '28:11':
    texto: Chegou a um lugar e ali passou a noite, porque o sol já se tinha posto. Tomou uma das pedras
      do lugar, pô-la por travesseiro e deitou-se naquele lugar.
    status: ia-sem-revisao
  '28:12':
    texto: 'Teve um sonho: eis uma escada apoiada na terra, cujo topo tocava o céu, e eis que os anjos
      de Deus subiam e desciam por ela.'
    status: ia-sem-revisao
  '28:13':
    texto: 'E eis que o Senhor estava de pé junto a ela e dizia: “Eu sou o Senhor, o Deus de Abraão, teu
      pai, e o Deus de Isaac. A terra em que estás deitado, a darei a ti e à tua descendência.'
    status: ia-sem-revisao
  '28:14':
    texto: A tua descendência será como o pó da terra; te estenderás para o ocidente e para o oriente,
      para o norte e para o sul; e em ti e na tua descendência serão abençoadas todas as famílias da terra.
    status: ia-sem-revisao
  '28:15':
    texto: Eis que estou contigo e te guardarei por onde quer que fores e te farei voltar a esta terra,
      porque não te abandonarei até cumprir o que te prometi.”
    status: ia-sem-revisao
  '28:16':
    texto: 'Jacó despertou do sono e disse: “Na verdade, o Senhor está neste lugar, e eu não o sabia!”'
    status: ia-sem-revisao
  '28:17':
    texto: 'Teve medo e disse: “Como é temível este lugar! Não é outra coisa senão a casa de Deus e a
      porta do céu.”'
    status: ia-sem-revisao
  '28:18':
    texto: Jacó levantou-se de manhã cedo, tomou a pedra que tinha posto por travesseiro, ergueu-a como
      estela e derramou óleo sobre o seu topo.
    status: ia-sem-revisao
  '28:19':
    texto: Deu àquele lugar o nome de Betel; mas o nome da cidade era antes Luz.
    status: ia-sem-revisao
  '28:20':
    texto: 'Jacó fez um voto, dizendo: “Se Deus estiver comigo e me guardar neste caminho que percorro,
      se me der pão para comer e roupa para vestir,'
    status: ia-sem-revisao
  '28:21':
    texto: e eu voltar em paz à casa de meu pai, então o Senhor será o meu Deus.
    status: ia-sem-revisao
  '28:22':
    texto: Esta pedra que ergui como estela será casa de Deus, e de tudo o que me deres, te darei o dízimo.”
    partes:
    - Esta pedra que ergui como estela será casa de Deus,
    - e de tudo o que me deres, te darei o dízimo.”
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '32:23':
    texto: Naquela noite levantou-se, tomou as suas duas mulheres, as suas duas servas e os seus onze
      filhos e atravessou o vau do Jaboc.
    status: ia-sem-revisao
  '32:24':
    texto: Tomou-os e os fez passar a torrente; e fez passar também tudo o que tinha.
    status: ia-sem-revisao
  '32:25':
    texto: Jacó ficou só. Então um homem lutou com ele até o romper da aurora.
    status: ia-sem-revisao
  '32:26':
    texto: Vendo que não podia vencê-lo, tocou-lhe na articulação da coxa, e a articulação da coxa de
      Jacó deslocou-se enquanto lutava com ele.
    status: ia-sem-revisao
  '32:27':
    texto: 'Disse: “Deixa-me ir, pois já rompe a aurora.” Respondeu: “Não te deixarei ir se não me abençoares.”'
    status: ia-sem-revisao
  '32:28':
    texto: 'Perguntou-lhe: “Qual é o teu nome?” Respondeu: “Jacó.”'
    status: ia-sem-revisao
  '32:29':
    texto: 'Disse: “Já não te chamarás Jacó, mas Israel, porque lutaste com Deus e com os homens e venceste.”'
    status: ia-sem-revisao
  '32:30':
    texto: 'Jacó lhe perguntou: “Dize-me, peço-te, o teu nome.” Respondeu: “Por que perguntas pelo meu
      nome?” E o abençoou ali.'
    status: ia-sem-revisao
  '32:31':
    texto: 'Jacó deu àquele lugar o nome de Fanuel, dizendo: “Vi a Deus face a face, e a minha vida foi
      salva.”'
    status: ia-sem-revisao
  '32:32':
    texto: O sol nasceu para ele quando passou Fanuel; e ele mancava da coxa.
    status: ia-sem-revisao
  '32:33':
    texto: Por isso os filhos de Israel não comem, até hoje, o nervo ciático que está na articulação da
      coxa, porque ele tocou a articulação da coxa de Jacó, no nervo ciático.
    status: ia-sem-revisao
  '37:3':
    texto: Israel amava José mais do que a todos os seus filhos, porque era o filho da sua velhice, e
      fez-lhe uma túnica longa.
    status: ia-sem-revisao
  '37:4':
    texto: Os seus irmãos viram que o pai o amava mais do que a todos eles, e o odiaram, e não podiam
      falar-lhe amigavelmente.
    status: ia-sem-revisao
  '37:12':
    texto: Os seus irmãos foram apascentar o rebanho do pai em Siquém.
    status: ia-sem-revisao
  '37:13':
    texto: 'Israel disse a José: “Os teus irmãos não estão apascentando em Siquém? Vem, vou enviar-te
      a eles.” Ele respondeu: “Aqui estou.”'
    status: ia-sem-revisao
  '37:17':
    texto: 'O homem disse: “Partiram daqui, pois ouvi-os dizer: ‘Vamos a Dotã.’” José foi atrás dos seus
      irmãos e os encontrou em Dotã.'
    status: ia-sem-revisao
  '37:18':
    texto: Eles o viram de longe e, antes que se aproximasse, tramaram matá-lo.
    status: ia-sem-revisao
  '37:19':
    texto: 'Disseram uns aos outros: “Eis que vem o sonhador!'
    status: ia-sem-revisao
  '37:20':
    texto: Vamos, matemo-lo e lancemo-lo numa destas cisternas; diremos que uma fera o devorou, e veremos
      o que será dos seus sonhos.”
    status: ia-sem-revisao
  '37:21':
    texto: 'Rúben ouviu isso e o livrou das mãos deles, dizendo: “Não lhe tiremos a vida.”'
    status: ia-sem-revisao
  '37:22':
    texto: 'Rúben disse-lhes: “Não derrameis sangue; lançai-o nesta cisterna que está no deserto, mas
      não ponhais a mão sobre ele”, com a intenção de o livrar das mãos deles e devolvê-lo ao pai.'
    status: ia-sem-revisao
  '37:23':
    texto: Quando José chegou junto dos irmãos, despojaram-no da túnica, a túnica longa que vestia.
    status: ia-sem-revisao
  '37:24':
    texto: Tomaram-no e lançaram-no na cisterna; a cisterna estava vazia, sem água.
    status: ia-sem-revisao
  '37:25':
    texto: Sentaram-se para comer e, levantando os olhos, viram uma caravana de ismaelitas que vinha de
      Galaad, com camelos carregados de resina, bálsamo e láudano, que levavam para o Egito.
    status: ia-sem-revisao
  '37:26':
    texto: 'Judá disse aos irmãos: “Que proveito teremos em matar o nosso irmão e esconder o seu sangue?'
    status: ia-sem-revisao
  '37:27':
    texto: Vinde, vendamo-lo aos ismaelitas e não ponhamos a mão sobre ele, pois é nosso irmão, nossa
      carne.” Os irmãos concordaram.
    status: ia-sem-revisao
  '37:28':
    texto: Passaram uns mercadores madianitas; tiraram José da cisterna e o venderam aos ismaelitas por
      vinte moedas de prata. E levaram José para o Egito.
    status: ia-sem-revisao
  '41:55':
    texto: 'Quando todo o Egito passou fome, o povo clamou a Faraó por pão. Faraó disse a todos os egípcios:
      “Ide a José e fazei o que ele vos disser.”'
    status: ia-sem-revisao
  '41:56':
    texto: A fome estendeu-se por toda a face da terra. José abriu todos os celeiros e vendeu trigo aos
      egípcios, pois a fome se agravava na terra do Egito.
    status: ia-sem-revisao
  '41:57':
    texto: De toda a terra vinham ao Egito comprar trigo de José, pois a fome era grave em toda a terra.
    status: ia-sem-revisao
  '42:5':
    texto: Os filhos de Israel foram comprar trigo entre os que iam, porque havia fome na terra de Canaã.
    status: ia-sem-revisao
  '42:6':
    texto: José era o governador da terra, aquele que vendia trigo a todo o povo da terra. Os irmãos de
      José chegaram e prostraram-se diante dele, com o rosto em terra.
    status: ia-sem-revisao
  '42:7':
    texto: 'José viu os seus irmãos e reconheceu-os, mas fez-se estranho a eles e falou-lhes com dureza.
      Perguntou-lhes: “De onde viestes?” Responderam: “Da terra de Canaã, para comprar mantimento.”'
    status: ia-sem-revisao
  '42:17':
    texto: E manteve-os todos em prisão durante três dias.
    status: ia-sem-revisao
  '42:18':
    texto: 'Ao terceiro dia, José disse-lhes: “Fazei isto e vivereis, pois eu temo a Deus:'
    status: ia-sem-revisao
  '42:19':
    texto: se sois homens honestos, fique um dos vossos irmãos preso na vossa prisão; e vós ide levar
      o trigo para a fome das vossas casas.
    status: ia-sem-revisao
  '42:20':
    texto: Mas trazei-me o vosso irmão mais novo, para que as vossas palavras se comprovem e não morrais.”
      E fizeram assim.
    status: ia-sem-revisao
  '42:21':
    texto: 'Disseram uns aos outros: “Na verdade, somos culpados a respeito do nosso irmão, pois vimos
      a angústia da sua alma quando nos suplicava, e não o escutamos; por isso nos sobreveio esta angústia.”'
    status: ia-sem-revisao
  '42:22':
    texto: 'Rúben respondeu-lhes: “Não vos disse eu: ‘Não pequeis contra o menino’? Mas não me escutastes.
      E agora é pedido conta do seu sangue.”'
    status: ia-sem-revisao
  '42:23':
    texto: Eles não sabiam que José os entendia, pois havia um intérprete entre eles.
    status: ia-sem-revisao
  '42:24':
    texto: Afastou-se deles e chorou; depois voltou, falou-lhes e tomou Simeão dentre eles, mandando amarrá-lo
      diante dos seus olhos.
    status: ia-sem-revisao
  '44:18':
    texto: 'Judá aproximou-se dele e disse: “Por favor, meu senhor, permite que o teu servo diga uma palavra
      aos ouvidos do meu senhor, e não se acenda a tua ira contra o teu servo, pois tu és como o próprio
      Faraó.'
    status: ia-sem-revisao
  '44:19':
    texto: 'O meu senhor perguntou aos seus servos: ‘Tendes pai ou irmão?’'
    status: ia-sem-revisao
  '44:20':
    texto: 'E respondemos ao meu senhor: ‘Temos um pai idoso e um filho da sua velhice, o mais novo; o
      irmão dele morreu, e só ele ficou da sua mãe, e o pai o ama.’'
    status: ia-sem-revisao
  '44:21':
    texto: 'Tu disseste aos teus servos: ‘Trazei-o a mim, para que eu o veja.’'
    status: ia-sem-revisao
  '44:23':
    texto: 'Disseste aos teus servos: ‘Se o vosso irmão mais novo não descer convosco, não tornareis a
      ver o meu rosto.’'
    status: ia-sem-revisao
  '44:24':
    texto: Quando subimos ao teu servo, meu pai, contamos-lhe as palavras do meu senhor.
    status: ia-sem-revisao
  '44:25':
    texto: 'E o nosso pai disse: ‘Voltai e comprai-nos um pouco de trigo.’'
    status: ia-sem-revisao
  '44:26':
    texto: 'Respondemos: ‘Não podemos descer. Se o nosso irmão mais novo for conosco, desceremos, pois
      não podemos ver o rosto desse homem se o nosso irmão mais novo não estiver conosco.’'
    status: ia-sem-revisao
  '44:27':
    texto: 'O teu servo, meu pai, disse-nos: ‘Vós sabeis que a minha mulher me deu dois filhos.'
    status: ia-sem-revisao
  '44:28':
    texto: Um saiu de junto de mim, e eu disse que certamente foi despedaçado; e até agora não o vi.
    status: ia-sem-revisao
  '44:29':
    texto: Se também este me for tirado e lhe suceder alguma desgraça, fareis descer à sepultura, com
      tristeza, os meus cabelos brancos.’
    status: ia-sem-revisao
  '45:1':
    texto: 'José já não se podia conter diante de todos os que o rodeavam, e gritou: “Fazei sair todos
      de junto de mim!” Ninguém ficou com ele quando José se deu a conhecer aos seus irmãos.'
    status: ia-sem-revisao
  '45:2':
    texto: Chorou em alta voz; os egípcios o ouviram, e a casa de Faraó também.
    status: ia-sem-revisao
  '45:3':
    texto: 'José disse aos seus irmãos: “Eu sou José! Meu pai ainda vive?” Mas os irmãos não puderam responder-lhe,
      porque ficaram perturbados diante dele.'
    status: ia-sem-revisao
  '45:4':
    texto: 'José disse aos seus irmãos: “Aproximai-vos de mim.” Eles se aproximaram. Ele disse: “Eu sou
      José, vosso irmão, a quem vendestes para o Egito.'
    status: ia-sem-revisao
  '45:5':
    texto: Agora não vos aflijais, nem vos pese terdes-me vendido para cá, pois foi para a vossa vida
      que Deus me enviou adiante de vós.”
    status: ia-sem-revisao
  '46:1':
    texto: Israel partiu com tudo o que tinha e chegou a Bersabeia, onde ofereceu sacrifícios ao Deus
      de seu pai Isaac.
    status: ia-sem-revisao
  '46:2':
    texto: 'Deus falou a Israel em visões noturnas: “Jacó! Jacó!” Ele respondeu: “Aqui estou.”'
    status: ia-sem-revisao
  '46:3':
    texto: 'Disse: “Eu sou Deus, o Deus de teu pai. Não temas descer ao Egito, porque ali farei de ti
      uma grande nação.'
    status: ia-sem-revisao
  '46:4':
    texto: Eu descerei contigo ao Egito, e eu mesmo te farei subir de novo; e José fechará os teus olhos.”
    status: ia-sem-revisao
  '46:5':
    texto: Jacó partiu de Bersabeia, e os filhos de Israel levaram Jacó, seu pai, os seus filhinhos e
      as suas mulheres nos carros que Faraó enviara para o transportar.
    status: ia-sem-revisao
  '46:6':
    texto: Tomaram os seus rebanhos e os bens que tinham adquirido na terra de Canaã e foram para o Egito,
      Jacó e toda a sua descendência com ele.
    status: ia-sem-revisao
  '46:7':
    texto: Levou consigo para o Egito os seus filhos e netos, as suas filhas e netas, e toda a sua descendência.
    status: ia-sem-revisao
  '46:28':
    texto: Enviou Judá adiante de si a José, para que lhe indicasse o caminho para Gessen. E chegaram
      à terra de Gessen.
    status: ia-sem-revisao
  '46:29':
    texto: José atrelou o seu carro e subiu a Gessen ao encontro de Israel, seu pai. Ao vê-lo, lançou-se
      ao seu pescoço e chorou longamente sobre o seu pescoço.
    status: ia-sem-revisao
  '46:30':
    texto: 'Israel disse a José: “Agora posso morrer, depois de ter visto o teu rosto e saber que ainda
      vives.”'
    status: ia-sem-revisao
  '49:1':
    texto: 'Jacó chamou os seus filhos e disse: “Reuni-vos, e vos anunciarei o que vos acontecerá nos
      dias futuros.”'
    status: ia-sem-revisao
  '49:2':
    texto: “Reuni-vos e ouvi, filhos de Jacó; escutai Israel, vosso pai.
    status: ia-sem-revisao
  '49:8':
    texto: Judá, a ti te louvarão os teus irmãos; a tua mão estará sobre o pescoço dos teus inimigos;
      diante de ti se prostrarão os filhos do teu pai.
    status: ia-sem-revisao
  '49:9':
    texto: 'Judá é um leãozinho: da presa, meu filho, subiste; agachou-se e deitou-se como leão, como
      leoa: quem o despertará?'
    status: ia-sem-revisao
  '49:10':
    texto: O cetro não se afastará de Judá, nem o bastão de comando de entre os seus pés, até que venha
      Silo, e a ele obedeçam os povos.
    status: ia-sem-revisao
    observacao: O hebraico traz “Silo” (nome de lugar ou palavra de sentido incerto); a Vulgata traz “até
      que venha aquele a quem pertence”.
  '49:29':
    texto: 'Deu-lhes esta ordem: “Eu vou reunir-me ao meu povo; sepultai-me com os meus pais na gruta
      que está no campo de Efron, o hitita,'
    status: ia-sem-revisao
  '49:30':
    texto: na gruta do campo de Macpela, em frente a Mambré, na terra de Canaã, que Abraão comprou a Efron,
      o hitita, com o campo, para sepultura.
    status: ia-sem-revisao
  '49:31':
    texto: Ali sepultaram Abraão e Sara, sua mulher; ali sepultaram Isaac e Rebeca, sua mulher; e ali
      sepultei Lia.
    status: ia-sem-revisao
  '49:32':
    texto: O campo e a gruta que nele existe foram comprados aos filhos de Het.”
    status: ia-sem-revisao
  '50:15':
    texto: 'Vendo os irmãos de José que o pai estava morto, disseram: “Quem sabe José nos odeia e vai
      retribuir-nos todo o mal que lhe fizemos?”'
    status: ia-sem-revisao
  '50:16':
    texto: 'Mandaram dizer a José: “O teu pai, antes de morrer, deu esta ordem:'
    status: ia-sem-revisao
  '50:17':
    texto: '‘Assim direis a José: Perdoa, peço-te, o crime dos teus irmãos e o seu pecado, porque te fizeram
      mal.’ Agora, pois, perdoa o crime dos servos do Deus de teu pai.” José chorou quando lhe falaram.'
    status: ia-sem-revisao
  '50:18':
    texto: 'Os seus irmãos foram também e se prostraram diante dele, dizendo: “Aqui estamos como teus
      servos.”'
    status: ia-sem-revisao
  '50:19':
    texto: 'José disse-lhes: “Não temais; porventura estou eu no lugar de Deus?'
    status: ia-sem-revisao
  '50:20':
    texto: 'Vós pensastes mal contra mim, mas Deus o transformou em bem, para realizar o que hoje se vê:
      salvar a vida de um povo numeroso.'
    status: ia-sem-revisao
  '50:21':
    texto: 'Agora, pois, não temais: eu vos sustentarei, a vós e aos vossos filhos.” E consolou-os, falando-lhes
      ao coração.'
    status: ia-sem-revisao
  '50:22':
    texto: José habitou no Egito, ele e a casa de seu pai. José viveu cento e dez anos.
    status: ia-sem-revisao
  '50:23':
    texto: José viu os filhos de Efraim até a terceira geração; também os filhos de Maquir, filho de Manassés,
      nasceram sobre os joelhos de José.
    status: ia-sem-revisao
  '50:24':
    texto: 'José disse aos seus irmãos: “Eu vou morrer, mas Deus certamente vos visitará e vos fará subir
      desta terra para a terra que jurou dar a Abraão, a Isaac e a Jacó.”'
    status: ia-sem-revisao
  '50:25':
    texto: 'José fez jurar os filhos de Israel, dizendo: “Deus certamente vos visitará, e levareis daqui
      os meus ossos.”'
    status: ia-sem-revisao
  '50:26':
    texto: José morreu com a idade de cento e dez anos. Embalsamaram-no e o puseram num caixão no Egito.
    partes:
    - José morreu com a idade de cento e dez anos.
    - Embalsamaram-no e o puseram num caixão no Egito.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
