livro: EXO
fonte: oshb
versiculos:
  '1:8':
    texto: Surgiu no Egito um novo rei, que não conhecera José.
    status: ia-sem-revisao
  '1:9':
    texto: 'Disse ao seu povo: “Eis que o povo dos filhos de Israel é mais numeroso e mais forte do que
      nós.'
    status: ia-sem-revisao
  '1:10':
    texto: Vamos, tratemos de o dominar com astúcia, para que não se multiplique ainda mais e, se estourar
      uma guerra, não se junte aos nossos inimigos, combata contra nós e saia do país.”
    status: ia-sem-revisao
  '1:11':
    texto: Puseram sobre ele chefes de trabalhos forçados para os oprimir com cargas pesadas; e construíram
      para Faraó as cidades-armazéns de Pitom e Ramsés.
    status: ia-sem-revisao
  '1:12':
    texto: Mas, quanto mais os oprimiam, mais eles se multiplicavam e se espalhavam; e os egípcios chegaram
      a sentir aversão pelos filhos de Israel.
    status: ia-sem-revisao
  '1:13':
    texto: Os egípcios sujeitaram os filhos de Israel a duro trabalho.
    status: ia-sem-revisao
  '1:14':
    texto: Tornaram-lhes amarga a vida com trabalho duro, com barro e tijolos, e com toda sorte de trabalho
      no campo; em tudo o que os faziam trabalhar, era com dureza.
    status: ia-sem-revisao
  '1:22':
    texto: 'Então Faraó deu esta ordem a todo o seu povo: “Todo filho que nascer, lançai-o ao rio; mas
      deixai viver todas as filhas.”'
    status: ia-sem-revisao
  '2:1':
    texto: Um homem da casa de Levi foi e tomou por mulher uma filha de Levi.
    status: ia-sem-revisao
  '2:2':
    texto: A mulher concebeu e deu à luz um filho; vendo que era belo, escondeu-o durante três meses.
    status: ia-sem-revisao
  '2:3':
    texto: Como já não podia escondê-lo, tomou um cesto de papiro, calafetou-o com betume e piche, pôs
      nele o menino e o colocou entre os juncos, à margem do rio.
    status: ia-sem-revisao
  '2:4':
    texto: A irmã do menino ficou de longe, para saber o que lhe aconteceria.
    status: ia-sem-revisao
  '2:5':
    texto: A filha de Faraó desceu para banhar-se no rio, enquanto as suas servas passeavam à beira do
      rio. Viu o cesto entre os juncos e mandou a sua serva buscá-lo.
    status: ia-sem-revisao
  '2:6':
    texto: 'Abriu-o e viu o menino que chorava; teve compaixão dele e disse: “É um dos meninos dos hebreus.”'
    status: ia-sem-revisao
  '2:7':
    texto: 'A irmã do menino disse à filha de Faraó: “Queres que eu vá chamar uma ama entre as hebreias,
      para que amamente o menino para ti?”'
    status: ia-sem-revisao
  '2:8':
    texto: 'A filha de Faraó respondeu: “Vai.” A jovem foi e chamou a mãe do menino.'
    status: ia-sem-revisao
  '2:9':
    texto: 'A filha de Faraó disse-lhe: “Leva este menino e amamenta-o para mim; eu te pagarei.” A mulher
      tomou o menino e amamentou-o.'
    status: ia-sem-revisao
  '2:10':
    texto: 'O menino cresceu, e ela o levou à filha de Faraó, que o adotou como filho e lhe pôs o nome
      de Moisés, dizendo: “Porque eu o tirei das águas.”'
    status: ia-sem-revisao
  '2:11':
    texto: Naqueles dias, quando Moisés já era crescido, saiu ao encontro dos seus irmãos e viu os seus
      trabalhos pesados; viu também um egípcio que ferria um hebreu, um dos seus irmãos.
    status: ia-sem-revisao
  '2:12':
    texto: Olhou para um lado e para o outro e, vendo que não havia ninguém, matou o egípcio e o escondeu
      na areia.
    status: ia-sem-revisao
  '2:13':
    texto: 'Saiu no dia seguinte e viu dois hebreus brigando; disse ao culpado: “Por que bates no teu
      companheiro?”'
    status: ia-sem-revisao
  '2:14':
    texto: 'Ele respondeu: “Quem te constituiu chefe e juiz sobre nós? Pensas matar-me, como mataste o
      egípcio?” Moisés teve medo e disse: “Com certeza o caso é conhecido.”'
    status: ia-sem-revisao
  '2:15':
    texto: Faraó soube do fato e procurou matar Moisés, mas Moisés fugiu de Faraó e foi morar na terra
      de Madiã; e sentou-se junto a um poço.
    status: ia-sem-revisao
  '3:1':
    texto: Moisés apascentava o rebanho de Jetro, seu sogro, sacerdote de Madiã. Conduziu o rebanho para
      além do deserto e chegou ao Horeb, o monte de Deus.
    status: ia-sem-revisao
  '3:2':
    texto: O anjo do Senhor apareceu-lhe numa chama de fogo, do meio de uma sarça. Ele olhou e viu que
      a sarça ardia no fogo, mas não se consumia.
    status: ia-sem-revisao
  '3:3':
    texto: 'Moisés disse: “Vou aproximar-me para ver este grande espetáculo: por que a sarça não se consome.”'
    status: ia-sem-revisao
  '3:4':
    texto: 'O Senhor viu que ele se aproximava para ver, e Deus o chamou do meio da sarça: “Moisés, Moisés!”
      Ele respondeu: “Aqui estou.”'
    status: ia-sem-revisao
  '3:5':
    texto: 'Deus disse: “Não te aproximes daqui. Tira as sandálias dos pés, porque o lugar em que estás
      é terra santa.”'
    status: ia-sem-revisao
  '3:6':
    texto: 'E disse: “Eu sou o Deus de teu pai, o Deus de Abraão, o Deus de Isaac e o Deus de Jacó.” Moisés
      cobriu o rosto, porque teve medo de olhar para Deus.'
    status: ia-sem-revisao
  '3:7':
    texto: 'O Senhor disse: “Eu vi a aflição do meu povo que está no Egito, ouvi o seu clamor por causa
      dos seus opressores e conheço os seus sofrimentos.'
    status: ia-sem-revisao
  '3:8':
    texto: Desci para o libertar da mão dos egípcios e para o fazer subir daquela terra para uma terra
      boa e vasta, uma terra onde corre leite e mel, para o lugar dos cananeus, dos hititas, dos amorreus,
      dos fereseus, dos heveus e dos jebuseus.
    partes:
    - Desci para o libertar da mão dos egípcios e para o fazer subir daquela terra para uma terra boa
      e vasta, uma terra onde corre leite e mel,
    - para o lugar dos cananeus, dos hititas, dos amorreus, dos fereseus, dos heveus e dos jebuseus.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '3:9':
    texto: Agora, eis que o clamor dos filhos de Israel chegou até mim, e vi também a opressão com que
      os egípcios os oprimem.
    status: ia-sem-revisao
  '3:10':
    texto: 'Agora, pois, vai: eu te envio a Faraó, para que tires do Egito o meu povo, os filhos de Israel.”'
    status: ia-sem-revisao
  '3:11':
    texto: 'Moisés disse a Deus: “Quem sou eu para ir a Faraó e tirar do Egito os filhos de Israel?”'
    status: ia-sem-revisao
  '3:12':
    texto: 'Deus disse: “Eu estarei contigo; e este será o sinal de que fui eu quem te enviou: quando
      tiveres tirado o povo do Egito, servireis a Deus neste monte.”'
    status: ia-sem-revisao
  '3:13':
    texto: 'Moisés disse a Deus: “Quando eu for aos filhos de Israel e lhes disser: ‘O Deus de vossos
      pais me enviou a vós’, se me perguntarem: ‘Qual é o seu nome?’, que lhes direi?”'
    status: ia-sem-revisao
  '3:14':
    texto: 'Deus disse a Moisés: “Eu sou aquele que sou.” E acrescentou: “Assim dirás aos filhos de Israel:
      ‘EU SOU me enviou a vós.’”'
    status: ia-sem-revisao
    observacao: O hebraico “ehyeh asher ehyeh” admite também “Eu serei o que serei”.
  '3:15':
    texto: 'Deus disse ainda a Moisés: “Assim dirás aos filhos de Israel: ‘O Senhor, o Deus de vossos
      pais, o Deus de Abraão, o Deus de Isaac e o Deus de Jacó, me enviou a vós.’ Este é o meu nome para
      sempre; este é o meu memorial de geração em geração.'
    status: ia-sem-revisao
  '3:16':
    texto: 'Vai, reúne os anciãos de Israel e dize-lhes: ‘O Senhor, o Deus de vossos pais, o Deus de Abraão,
      de Isaac e de Jacó, apareceu-me, dizendo: Certamente vos visitei e vi o que vos fazem no Egito.'
    status: ia-sem-revisao
  '3:17':
    texto: 'E eu disse: Far-vos-ei subir da aflição do Egito para a terra dos cananeus, dos hititas, dos
      amorreus, dos fereseus, dos heveus e dos jebuseus, uma terra onde corre leite e mel.’'
    status: ia-sem-revisao
  '3:18':
    texto: 'Eles ouvirão a tua voz; e irás, tu e os anciãos de Israel, ao rei do Egito e lhe direis: ‘O
      Senhor, o Deus dos hebreus, veio ao nosso encontro. Deixa-nos fazer uma caminhada de três dias pelo
      deserto, para oferecermos sacrifícios ao Senhor, nosso Deus.’'
    status: ia-sem-revisao
  '3:19':
    texto: Eu sei que o rei do Egito não vos deixará partir, a não ser forçado por mão forte.
    status: ia-sem-revisao
  '3:20':
    texto: Estenderei a minha mão e ferirei o Egito com todos os prodígios que farei no meio dele; depois
      disso vos deixará partir.”
    status: ia-sem-revisao
  '11:10':
    texto: Moisés e Aarão realizaram todos esses prodígios diante de Faraó; mas o Senhor endureceu o coração
      de Faraó, e ele não deixou os filhos de Israel saírem da sua terra.
    status: ia-sem-revisao
  '12:1':
    texto: 'O Senhor disse a Moisés e a Aarão na terra do Egito:'
    status: ia-sem-revisao
  '12:2':
    texto: “Este mês será para vós o princípio dos meses; será o primeiro mês do ano para vós.
    status: ia-sem-revisao
  '12:3':
    texto: 'Falai a toda a comunidade de Israel e dizei: No dia dez deste mês, cada um tome um cordeiro
      por família, um cordeiro por casa.'
    status: ia-sem-revisao
  '12:4':
    texto: Se a casa for pequena demais para um cordeiro, tome-o juntamente com o vizinho mais próximo,
      segundo o número de pessoas; calculareis o cordeiro segundo o que cada um pode comer.
    status: ia-sem-revisao
  '12:5':
    texto: Será um cordeiro sem defeito, macho, de um ano; podeis tomá-lo entre os cordeiros ou entre
      os cabritos.
    status: ia-sem-revisao
  '12:6':
    texto: Guardá-lo-eis até o dia catorze deste mês; então toda a assembleia da comunidade de Israel
      o imolará ao entardecer.
    status: ia-sem-revisao
  '12:7':
    texto: Tomarão do sangue e o porão nas duas ombreiras e na verga da porta das casas em que o comerem.
    status: ia-sem-revisao
  '12:8':
    texto: Comerão a carne naquela noite, assada no fogo, com pães ázimos e ervas amargas.
    status: ia-sem-revisao
  '12:9':
    texto: Não comereis dele nada cru nem cozido na água, mas assado no fogo, com a cabeça, as pernas
      e as entranhas.
    status: ia-sem-revisao
  '12:10':
    texto: Não deixareis nada dele até a manhã; o que sobrar até a manhã, queimá-lo-eis no fogo.
    status: ia-sem-revisao
  '12:11':
    texto: 'Assim o comereis: com os quadris cingidos, as sandálias nos pés e o cajado na mão; comê-lo-eis
      às pressas: é a Páscoa do Senhor.'
    status: ia-sem-revisao
  '12:12':
    texto: 'Naquela noite passarei pela terra do Egito e ferirei todos os primogênitos da terra do Egito,
      desde os homens até os animais, e farei justiça contra todos os deuses do Egito: eu sou o Senhor.'
    status: ia-sem-revisao
  '12:13':
    texto: O sangue será para vós um sinal nas casas em que estais; quando eu vir o sangue, passarei adiante,
      e não haverá entre vós praga destruidora quando eu ferir a terra do Egito.
    status: ia-sem-revisao
  '12:14':
    texto: Este dia será para vós um memorial, e o celebrareis como festa para o Senhor; de geração em
      geração o celebrareis como instituição perpétua.
    status: ia-sem-revisao
  '12:37':
    texto: Os filhos de Israel partiram de Ramsés para Sucot, cerca de seiscentos mil homens a pé, sem
      contar as crianças.
    status: ia-sem-revisao
  '12:38':
    texto: Subiu com eles também uma multidão mista, e rebanhos de ovelhas e bois, em grande quantidade.
    status: ia-sem-revisao
  '12:39':
    texto: 'Assaram a massa que tinham trazido do Egito em pães ázimos, porque não estava levedada: tinham
      sido expulsos do Egito e não puderam demorar-se, nem prepararam provisões para o caminho.'
    status: ia-sem-revisao
  '12:40':
    texto: O tempo que os filhos de Israel passaram no Egito foi de quatrocentos e trinta anos.
    status: ia-sem-revisao
  '12:41':
    texto: Ao fim de quatrocentos e trinta anos, naquele mesmo dia, todos os exércitos do Senhor saíram
      da terra do Egito.
    status: ia-sem-revisao
  '12:42':
    texto: Foi noite de vigília para o Senhor, para os tirar da terra do Egito; esta noite é de vigília
      para o Senhor, para todos os filhos de Israel, de geração em geração.
    status: ia-sem-revisao
  '14:5':
    texto: 'Anunciaram ao rei do Egito que o povo tinha fugido. Então o coração de Faraó e dos seus servos
      mudou em relação ao povo, e disseram: “Que fizemos, deixando Israel livrar-se do nosso serviço?”'
    status: ia-sem-revisao
  '14:6':
    texto: Atrelou o seu carro e levou consigo o seu povo.
    status: ia-sem-revisao
  '14:7':
    texto: Tomou seiscentos carros escolhidos e todos os carros do Egito, com oficiais sobre todos eles.
    status: ia-sem-revisao
  '14:8':
    texto: O Senhor endureceu o coração de Faraó, rei do Egito, que perseguiu os filhos de Israel, os
      quais saíam de mão erguida.
    status: ia-sem-revisao
  '14:9':
    texto: 'Os egípcios os perseguiram e os alcançaram acampados junto ao mar: todos os cavalos e carros
      de Faraó, os seus cavaleiros e o seu exército, perto de Pi-Hairot, diante de Baal-Sefon.'
    status: ia-sem-revisao
  '14:10':
    texto: Quando Faraó se aproximou, os filhos de Israel levantaram os olhos e viram os egípcios que
      marchavam atrás deles; encheram-se de medo e clamaram ao Senhor.
    status: ia-sem-revisao
  '14:11':
    texto: 'Disseram a Moisés: “Acaso não havia sepulturas no Egito, para nos trazeres a morrer no deserto?
      Que nos fizeste, tirando-nos do Egito?'
    status: ia-sem-revisao
  '14:12':
    texto: 'Não é isto o que te dizíamos no Egito: ‘Deixa-nos servir os egípcios’? Pois é melhor para
      nós servir os egípcios do que morrer no deserto.”'
    status: ia-sem-revisao
  '14:13':
    texto: 'Moisés respondeu ao povo: “Não temais! Ficai firmes e vede a salvação que o Senhor hoje vos
      dará; pois os egípcios que hoje vedes, nunca mais os vereis.'
    status: ia-sem-revisao
  '14:14':
    texto: O Senhor combaterá por vós, e vós ficareis calados.”
    status: ia-sem-revisao
  '14:15':
    texto: 'O Senhor disse a Moisés: “Por que clamas a mim? Dize aos filhos de Israel que marchem.'
    status: ia-sem-revisao
  '14:16':
    texto: E tu, ergue o teu cajado, estende a mão sobre o mar e divide-o, para que os filhos de Israel
      entrem a pé enxuto no meio do mar.
    status: ia-sem-revisao
  '14:17':
    texto: Eu endurecerei o coração dos egípcios, e eles entrarão atrás deles; e serei glorificado em
      Faraó e em todo o seu exército, nos seus carros e nos seus cavaleiros.
    status: ia-sem-revisao
  '14:18':
    texto: Os egípcios saberão que eu sou o Senhor, quando for glorificado em Faraó, nos seus carros e
      nos seus cavaleiros.”
    status: ia-sem-revisao
  '14:19':
    texto: O anjo de Deus, que ia à frente do acampamento de Israel, mudou de lugar e foi para trás deles;
      também a coluna de nuvem mudou de diante deles e se pôs atrás.
    status: ia-sem-revisao
  '14:20':
    texto: Colocou-se entre o acampamento dos egípcios e o acampamento de Israel; havia nuvem e escuridão,
      mas iluminava a noite; e em toda a noite um não se aproximou do outro.
    status: ia-sem-revisao
  '14:21':
    texto: Moisés estendeu a mão sobre o mar, e o Senhor fez retirar o mar com um forte vento oriental
      durante toda a noite; transformou o mar em terra seca, e as águas se dividiram.
    status: ia-sem-revisao
  '14:22':
    texto: Os filhos de Israel entraram a pé enxuto no meio do mar, e as águas formavam para eles uma
      muralha à direita e à esquerda.
    status: ia-sem-revisao
  '14:23':
    texto: Os egípcios os perseguiram e entraram atrás deles, todos os cavalos de Faraó, os seus carros
      e os seus cavaleiros, no meio do mar.
    status: ia-sem-revisao
  '14:24':
    texto: Na vigília da manhã, o Senhor, da coluna de fogo e de nuvem, olhou para o acampamento dos egípcios
      e o lançou em confusão.
    status: ia-sem-revisao
  '14:25':
    texto: 'Emperrou as rodas dos seus carros, que avançavam com dificuldade. Os egípcios disseram: “Fujamos
      de Israel, pois o Senhor combate por eles contra os egípcios.”'
    status: ia-sem-revisao
  '14:26':
    texto: 'O Senhor disse a Moisés: “Estende a mão sobre o mar, para que as águas voltem sobre os egípcios,
      sobre os seus carros e os seus cavaleiros.”'
    status: ia-sem-revisao
  '14:27':
    texto: Moisés estendeu a mão sobre o mar, e ao romper da manhã o mar voltou ao seu leito, enquanto
      os egípcios fugiam ao seu encontro; e o Senhor precipitou os egípcios no meio do mar.
    status: ia-sem-revisao
  '14:28':
    texto: As águas voltaram e cobriram os carros e os cavaleiros de todo o exército de Faraó que tinha
      entrado no mar atrás dos filhos de Israel; não sobrou nenhum deles.
    status: ia-sem-revisao
  '14:29':
    texto: Os filhos de Israel, porém, caminharam a pé enxuto no meio do mar, e as águas formavam para
      eles uma muralha à direita e à esquerda.
    status: ia-sem-revisao
  '14:30':
    texto: Naquele dia o Senhor salvou Israel da mão dos egípcios, e Israel viu os egípcios mortos na
      margem do mar.
    status: ia-sem-revisao
  '14:31':
    texto: Israel viu a mão poderosa que o Senhor exerceu contra os egípcios; o povo temeu o Senhor e
      creu no Senhor e em Moisés, seu servo.
    status: ia-sem-revisao
  '15:1':
    texto: 'Então Moisés e os filhos de Israel entoaram este cântico ao Senhor: “Cantarei ao Senhor, porque
      se cobriu de glória: lançou ao mar o cavalo e o cavaleiro.'
    status: ia-sem-revisao
  '15:2':
    texto: 'O Senhor é a minha força e o meu canto, e foi para mim a salvação. Ele é o meu Deus: eu o
      louvarei; o Deus de meu pai: eu o exaltarei.'
    status: ia-sem-revisao
  '15:3':
    texto: O Senhor é um guerreiro; o seu nome é Senhor.
    status: ia-sem-revisao
  '15:4':
    texto: Lançou ao mar os carros de Faraó e o seu exército; os seus melhores oficiais afogaram-se no
      mar Vermelho.
    status: ia-sem-revisao
  '15:5':
    texto: Os abismos os cobriram; desceram às profundezas como pedra.
    status: ia-sem-revisao
  '15:6':
    texto: A tua direita, Senhor, é gloriosa em poder; a tua direita, Senhor, esmaga o inimigo.
    status: ia-sem-revisao
  '15:8':
    texto: Ao sopro das tuas narinas as águas amontoaram-se, as correntes ergueram-se como um muro, os
      abismos coalharam no coração do mar.
    status: ia-sem-revisao
  '15:9':
    texto: 'O inimigo dizia: ‘Perseguirei, alcançarei, repartirei o despojo; a minha alma se saciará deles;
      tirarei a espada, a minha mão os destruirá.’'
    status: ia-sem-revisao
  '15:10':
    texto: Sopraste com o teu hálito, e o mar os cobriu; afundaram como chumbo em águas poderosas.
    status: ia-sem-revisao
  '15:12':
    texto: Estendeste a tua direita, e a terra os engoliu.
    status: ia-sem-revisao
  '15:17':
    texto: Tu os conduzirás e os plantarás no monte da tua herança, o lugar que preparaste, Senhor, para
      a tua morada, o santuário, Senhor, que as tuas mãos estabeleceram.
    status: ia-sem-revisao
  '15:18':
    texto: O Senhor reinará para sempre e eternamente.”
    status: ia-sem-revisao
  '16:1':
    texto: Partiram de Elim, e toda a comunidade dos filhos de Israel chegou ao deserto de Sin, que fica
      entre Elim e o Sinai, no décimo quinto dia do segundo mês depois da saída da terra do Egito.
    status: ia-sem-revisao
  '16:2':
    texto: Toda a comunidade dos filhos de Israel murmurou contra Moisés e Aarão no deserto.
    status: ia-sem-revisao
  '16:3':
    texto: 'Os filhos de Israel disseram-lhes: “Antes tivéssemos morrido pela mão do Senhor na terra do
      Egito, quando nos sentávamos junto às panelas de carne e comíamos pão à saciedade! Pois nos trouxestes
      a este deserto para matar de fome toda esta multidão.”'
    status: ia-sem-revisao
  '16:4':
    texto: 'O Senhor disse a Moisés: “Eis que farei chover para vós pão do céu; o povo sairá e colherá
      a quantidade necessária para cada dia, para que eu o ponha à prova e veja se anda ou não na minha
      lei.'
    status: ia-sem-revisao
  '16:5':
    texto: No sexto dia, porém, prepararão o que tiverem trazido, e será o dobro do que colhem cada dia.”
    status: ia-sem-revisao
  '16:9':
    texto: 'Moisés disse a Aarão: “Dize a toda a comunidade dos filhos de Israel: ‘Aproximai-vos do Senhor,
      pois ele ouviu as vossas murmurações.’”'
    status: ia-sem-revisao
  '16:10':
    texto: Enquanto Aarão falava a toda a comunidade dos filhos de Israel, eles voltaram-se para o deserto,
      e eis que a glória do Senhor apareceu na nuvem.
    status: ia-sem-revisao
  '16:11':
    texto: 'O Senhor falou a Moisés:'
    status: ia-sem-revisao
  '16:12':
    texto: '“Ouvi as murmurações dos filhos de Israel. Dize-lhes: ‘Ao entardecer comereis carne e de manhã
      vos saciareis de pão; e sabereis que eu sou o Senhor, vosso Deus.’”'
    status: ia-sem-revisao
  '16:13':
    texto: À tarde subiram codornizes e cobriram o acampamento; e de manhã havia uma camada de orvalho
      ao redor do acampamento.
    status: ia-sem-revisao
  '16:14':
    texto: Quando a camada de orvalho evaporou, eis que sobre a superfície do deserto havia uma coisa
      fina, granulosa, fina como a geada sobre a terra.
    status: ia-sem-revisao
  '16:15':
    texto: 'Os filhos de Israel viram e disseram uns aos outros: “Man hu?” — isto é, “Que é isto?” —,
      pois não sabiam o que era. Moisés disse-lhes: “É o pão que o Senhor vos deu para comer.”'
    status: ia-sem-revisao
  '17:3':
    texto: 'O povo teve sede de água naquele lugar e murmurou contra Moisés, dizendo: “Por que nos fizeste
      subir do Egito, para nos matar de sede, a nós, aos nossos filhos e aos nossos rebanhos?”'
    status: ia-sem-revisao
  '17:4':
    texto: 'Moisés clamou ao Senhor: “Que farei com este povo? Por pouco me apedrejarão.”'
    status: ia-sem-revisao
  '17:5':
    texto: 'O Senhor disse a Moisés: “Passa adiante do povo e leva contigo alguns dos anciãos de Israel;
      leva na mão o cajado com que feriste o rio, e vai.'
    status: ia-sem-revisao
  '17:6':
    texto: Eis que estarei ali diante de ti, sobre a rocha, no Horeb; ferirás a rocha, e dela sairá água
      para o povo beber.” Moisés fez assim, à vista dos anciãos de Israel.
    status: ia-sem-revisao
  '17:7':
    texto: 'Deu àquele lugar o nome de Massa e Meriba, por causa da contenda dos filhos de Israel e porque
      puseram o Senhor à prova, dizendo: “O Senhor está no meio de nós, ou não?”'
    status: ia-sem-revisao
  '17:8':
    texto: Veio Amalec e combateu Israel em Rafidim.
    status: ia-sem-revisao
  '17:9':
    texto: 'Moisés disse a Josué: “Escolhe homens para nós e sai para combater Amalec; amanhã estarei
      no cimo do monte, com o cajado de Deus na mão.”'
    status: ia-sem-revisao
  '17:10':
    texto: Josué fez como Moisés lhe dissera, combatendo Amalec; e Moisés, Aarão e Hur subiram ao cimo
      do monte.
    status: ia-sem-revisao
  '17:11':
    texto: Enquanto Moisés mantinha a mão erguida, Israel vencia; quando a baixava, vencia Amalec.
    status: ia-sem-revisao
  '17:12':
    texto: Como as mãos de Moisés ficavam pesadas, tomaram uma pedra e a puseram debaixo dele, e ele sentou-se
      sobre ela; Aarão e Hur lhe sustentavam as mãos, um de cada lado; assim as suas mãos permaneceram
      firmes até o pôr do sol.
    status: ia-sem-revisao
  '17:13':
    texto: Josué derrotou Amalec e o seu povo a fio de espada.
    status: ia-sem-revisao
  '19:1':
    texto: No terceiro mês depois da saída dos filhos de Israel da terra do Egito, nesse mesmo dia, chegaram
      ao deserto do Sinai.
    status: ia-sem-revisao
  '19:2':
    texto: Partiram de Rafidim e chegaram ao deserto do Sinai, e acamparam no deserto; Israel acampou
      ali diante do monte.
    status: ia-sem-revisao
  '19:3':
    texto: 'Moisés subiu a Deus, e o Senhor o chamou do monte, dizendo: “Assim dirás à casa de Jacó e
      anunciarás aos filhos de Israel:'
    status: ia-sem-revisao
  '19:4':
    texto: Vós vistes o que fiz aos egípcios, e como vos levei sobre asas de águias e vos trouxe a mim.
    status: ia-sem-revisao
  '19:5':
    texto: Agora, se ouvirdes a minha voz e guardardes a minha aliança, sereis para mim a propriedade
      mais preciosa entre todos os povos, porque toda a terra é minha.
    status: ia-sem-revisao
  '19:6':
    texto: Vós sereis para mim um reino de sacerdotes e uma nação santa. Estas são as palavras que dirás
      aos filhos de Israel.”
    partes:
    - Vós sereis para mim um reino de sacerdotes e uma nação santa.
    - Estas são as palavras que dirás aos filhos de Israel.”
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '19:9':
    texto: 'O Senhor disse a Moisés: “Eis que virei a ti numa nuvem densa, para que o povo ouça quando
      eu falar contigo e também creia em ti para sempre.” Moisés levou ao Senhor as palavras do povo.'
    status: ia-sem-revisao
  '19:10':
    texto: 'O Senhor disse a Moisés: “Vai ao povo e santifica-o hoje e amanhã; que lavem as suas vestes'
    status: ia-sem-revisao
  '19:11':
    texto: e estejam prontos para o terceiro dia, porque no terceiro dia o Senhor descerá, à vista de
      todo o povo, sobre o monte Sinai.”
    status: ia-sem-revisao
  '19:16':
    texto: No terceiro dia, ao amanhecer, houve trovões e relâmpagos, uma nuvem espessa sobre o monte
      e um som muito forte de trombeta; e todo o povo que estava no acampamento estremeceu.
    status: ia-sem-revisao
  '19:17':
    texto: Moisés fez o povo sair do acampamento ao encontro de Deus, e ficaram ao pé do monte.
    status: ia-sem-revisao
  '19:18':
    texto: O monte Sinai estava todo fumegante, porque o Senhor descera sobre ele em fogo; a sua fumaça
      subia como a fumaça de uma fornalha, e todo o monte tremia violentamente.
    status: ia-sem-revisao
  '19:19':
    texto: O som da trombeta ia aumentando cada vez mais; Moisés falava, e Deus lhe respondia com o trovão.
    status: ia-sem-revisao
  '19:20':
    texto: O Senhor desceu sobre o monte Sinai, no cimo do monte, e chamou Moisés ao cimo do monte; e
      Moisés subiu.
    status: ia-sem-revisao
  '20:1':
    texto: 'Deus pronunciou todas estas palavras:'
    status: ia-sem-revisao
  '20:2':
    texto: “Eu sou o Senhor, teu Deus, que te tirei da terra do Egito, da casa da escravidão.
    status: ia-sem-revisao
  '20:3':
    texto: Não terás outros deuses diante de mim.
    status: ia-sem-revisao
  '20:4':
    texto: Não farás para ti imagem esculpida, nem figura alguma do que há em cima, no céu, nem embaixo,
      na terra, nem nas águas debaixo da terra.
    status: ia-sem-revisao
  '20:5':
    texto: Não te prostrarás diante delas nem as servirás, porque eu, o Senhor, teu Deus, sou um Deus
      ciumento, que castigo a culpa dos pais nos filhos até a terceira e a quarta geração dos que me odeiam,
    status: ia-sem-revisao
  '20:6':
    texto: mas uso de misericórdia até a milésima geração com os que me amam e guardam os meus mandamentos.
    status: ia-sem-revisao
  '20:7':
    texto: Não pronunciarás em vão o nome do Senhor, teu Deus, porque o Senhor não deixará impune aquele
      que pronunciar o seu nome em vão.
    status: ia-sem-revisao
  '20:8':
    texto: Lembra-te do dia de sábado, para o santificar.
    status: ia-sem-revisao
  '20:9':
    texto: Seis dias trabalharás e farás todo o teu trabalho;
    status: ia-sem-revisao
  '20:10':
    texto: 'mas o sétimo dia é sábado para o Senhor, teu Deus: não farás nenhum trabalho, nem tu, nem
      teu filho, nem tua filha, nem teu servo, nem tua serva, nem teu animal, nem o estrangeiro que está
      dentro das tuas portas.'
    status: ia-sem-revisao
  '20:11':
    texto: Pois em seis dias o Senhor fez o céu, a terra, o mar e tudo o que neles existe, e no sétimo
      dia descansou; por isso o Senhor abençoou o dia de sábado e o santificou.
    status: ia-sem-revisao
  '20:12':
    texto: Honra teu pai e tua mãe, para que se prolonguem os teus dias na terra que o Senhor, teu Deus,
      te dá.
    status: ia-sem-revisao
  '20:13':
    texto: Não matarás.
    status: ia-sem-revisao
  '20:14':
    texto: Não cometerás adultério.
    status: ia-sem-revisao
  '20:15':
    texto: Não furtarás.
    status: ia-sem-revisao
  '20:16':
    texto: Não darás falso testemunho contra o teu próximo.
    status: ia-sem-revisao
  '20:17':
    texto: Não cobiçarás a casa do teu próximo; não cobiçarás a mulher do teu próximo, nem o seu servo,
      nem a sua serva, nem o seu boi, nem o seu jumento, nem coisa alguma que lhe pertença.”
    status: ia-sem-revisao
  '22:20':
    texto: Não maltratarás o estrangeiro nem o oprimirás, pois fostes estrangeiros na terra do Egito.
    status: ia-sem-revisao
  '22:21':
    texto: Não afligireis nenhuma viúva nem órfão.
    status: ia-sem-revisao
  '22:22':
    texto: Se os afligires e eles clamarem a mim, ouvirei o seu clamor;
    status: ia-sem-revisao
  '22:23':
    texto: a minha ira se acenderá, e vos matarei à espada; as vossas mulheres ficarão viúvas e os vossos
      filhos, órfãos.
    status: ia-sem-revisao
  '22:24':
    texto: 'Se emprestares dinheiro a um do meu povo, ao pobre que está contigo, não te comportarás com
      ele como credor: não lhe cobrareis juros.'
    status: ia-sem-revisao
  '22:25':
    texto: Se tomares em penhor o manto do teu próximo, restituir-lho-ás antes do pôr do sol,
    status: ia-sem-revisao
  '22:26':
    texto: pois é a sua única coberta, o manto com que cobre o corpo; em que se deitaria? Se ele clamar
      a mim, eu o ouvirei, porque sou compassivo.
    status: ia-sem-revisao
  '23:20':
    texto: Eis que envio um anjo diante de ti, para te guardar no caminho e te levar ao lugar que preparei.
    status: ia-sem-revisao
  '23:21':
    texto: Respeita-o e ouve a sua voz; não te rebeles contra ele, porque não perdoará as vossas transgressões,
      pois o meu nome está nele.
    status: ia-sem-revisao
  '23:22':
    texto: Mas, se ouvires atentamente a sua voz e fizeres tudo o que eu disser, serei inimigo dos teus
      inimigos e adversário dos teus adversários.
    status: ia-sem-revisao
  '23:23':
    texto: Pois o meu anjo irá adiante de ti e te levará aos amorreus, aos hititas, aos fereseus, aos
      cananeus, aos heveus e aos jebuseus, e eu os exterminarei.
    partes:
    - Pois o meu anjo irá adiante de ti e te levará aos amorreus, aos hititas, aos fereseus, aos cananeus,
      aos heveus e aos jebuseus,
    - e eu os exterminarei.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '24:3':
    texto: 'Moisés veio e contou ao povo todas as palavras do Senhor e todas as normas. Todo o povo respondeu
      a uma só voz: “Faremos tudo o que o Senhor disse.”'
    status: ia-sem-revisao
  '24:4':
    texto: Moisés escreveu todas as palavras do Senhor. De manhã cedo levantou-se, construiu um altar
      ao pé do monte e doze estelas, para as doze tribos de Israel.
    status: ia-sem-revisao
  '24:5':
    texto: Enviou jovens dos filhos de Israel, que ofereceram holocaustos e imolaram novilhos como sacrifícios
      de comunhão ao Senhor.
    status: ia-sem-revisao
  '24:6':
    texto: Moisés tomou metade do sangue e o pôs em bacias; a outra metade do sangue derramou sobre o
      altar.
    status: ia-sem-revisao
  '24:7':
    texto: 'Tomou o livro da aliança e o leu aos ouvidos do povo, que disse: “Faremos tudo o que o Senhor
      disse, e obedeceremos.”'
    status: ia-sem-revisao
  '24:8':
    texto: 'Moisés tomou o sangue e o aspergiu sobre o povo, dizendo: “Eis o sangue da aliança que o Senhor
      fez convosco, com base em todas estas palavras.”'
    status: ia-sem-revisao
  '32:7':
    texto: 'O Senhor disse a Moisés: “Vai, desce, porque se corrompeu o teu povo, que tiraste da terra
      do Egito.'
    status: ia-sem-revisao
  '32:8':
    texto: 'Depressa se desviaram do caminho que lhes ordenei: fizeram para si um bezerro de metal fundido,
      prostraram-se diante dele, ofereceram-lhe sacrifícios e disseram: ‘Este é o teu deus, ó Israel,
      que te tirou da terra do Egito.’'
    status: ia-sem-revisao
  '32:9':
    texto: Vi este povo, e eis que é um povo de dura cerviz.
    status: ia-sem-revisao
  '32:10':
    texto: 'Agora, deixa-me: a minha ira se acenderá contra eles e os consumirá; e de ti farei uma grande
      nação.”'
    status: ia-sem-revisao
  '32:11':
    texto: 'Moisés suplicou ao Senhor, seu Deus, e disse: “Por que, Senhor, se acende a tua ira contra
      o teu povo, que tiraste da terra do Egito com grande poder e mão forte?'
    status: ia-sem-revisao
  '32:12':
    texto: 'Por que hão de dizer os egípcios: ‘Foi para o mal que os tirou, para os matar nos montes e
      os exterminar da face da terra’? Abranda o ardor da tua ira e arrepende-te do mal contra o teu povo.'
    status: ia-sem-revisao
  '32:13':
    texto: 'Lembra-te de Abraão, de Isaac e de Israel, teus servos, a quem juraste por ti mesmo, dizendo:
      ‘Multiplicarei a vossa descendência como as estrelas do céu, e toda esta terra de que falei darei
      à vossa descendência, e a possuirão para sempre.’”'
    status: ia-sem-revisao
  '32:14':
    texto: O Senhor arrependeu-se do mal que dissera que faria ao seu povo.
    status: ia-sem-revisao
  '32:15':
    texto: Moisés voltou-se e desceu do monte com as duas tábuas do testemunho na mão, tábuas escritas
      dos dois lados, escritas de um lado e do outro.
    status: ia-sem-revisao
  '32:16':
    texto: As tábuas eram obra de Deus, e a escrita era a escrita de Deus, gravada nas tábuas.
    status: ia-sem-revisao
  '32:17':
    texto: 'Josué ouviu o clamor do povo que gritava e disse a Moisés: “Há um barulho de guerra no acampamento.”'
    status: ia-sem-revisao
  '32:18':
    texto: 'Moisés respondeu: “Não é grito de vitória, nem grito de derrota; o que ouço é som de canto.”'
    status: ia-sem-revisao
  '32:19':
    texto: Quando se aproximou do acampamento e viu o bezerro e as danças, a ira de Moisés se acendeu;
      ele lançou das mãos as tábuas e as quebrou ao pé do monte.
    status: ia-sem-revisao
  '32:20':
    texto: Tomou o bezerro que tinham feito, queimou-o no fogo, triturou-o até virar pó, espalhou-o sobre
      a água e fez os filhos de Israel bebê-la.
    status: ia-sem-revisao
  '32:21':
    texto: 'Moisés disse a Aarão: “Que te fez este povo, para que trouxesses sobre ele um pecado tão grande?”'
    status: ia-sem-revisao
  '32:22':
    texto: 'Aarão respondeu: “Não se acenda a ira do meu senhor. Tu mesmo sabes que este povo é inclinado
      ao mal.'
    status: ia-sem-revisao
  '32:23':
    texto: 'Disseram-me: ‘Faze-nos deuses que caminhem diante de nós, pois, quanto a esse Moisés, o homem
      que nos tirou da terra do Egito, não sabemos o que lhe aconteceu.’'
    status: ia-sem-revisao
  '32:24':
    texto: 'Eu lhes disse: ‘Quem tem ouro, tire-o.’ Deram-mo, lancei-o no fogo e saiu este bezerro.”'
    status: ia-sem-revisao
  '32:30':
    texto: 'No dia seguinte, Moisés disse ao povo: “Cometestes um grande pecado. Agora subirei ao Senhor;
      talvez eu consiga expiar o vosso pecado.”'
    status: ia-sem-revisao
  '32:31':
    texto: 'Moisés voltou ao Senhor e disse: “Ah, este povo cometeu um grande pecado: fizeram para si
      deuses de ouro.'
    status: ia-sem-revisao
  '32:32':
    texto: Agora, perdoa o seu pecado; se não, risca-me do livro que escreveste.”
    status: ia-sem-revisao
  '32:33':
    texto: 'O Senhor disse a Moisés: “Riscarei do meu livro aquele que pecou contra mim.'
    status: ia-sem-revisao
  '32:34':
    texto: Agora vai, conduze o povo para onde te falei; eis que o meu anjo irá diante de ti; mas no dia
      da minha visita, pedir-lhes-ei contas do seu pecado.”
    status: ia-sem-revisao
  '33:7':
    texto: Moisés tomava a tenda e a armava fora do acampamento, bem longe dele, e a chamava tenda do
      encontro. Todo aquele que consultava o Senhor saía para a tenda do encontro, que estava fora do
      acampamento.
    status: ia-sem-revisao
  '33:8':
    texto: Quando Moisés saía para a tenda, todo o povo se levantava, ficava de pé à entrada da sua tenda
      e seguia Moisés com os olhos até ele entrar na tenda.
    status: ia-sem-revisao
  '33:9':
    texto: Quando Moisés entrava na tenda, descia a coluna de nuvem e parava à entrada da tenda, e o Senhor
      falava com Moisés.
    status: ia-sem-revisao
  '33:10':
    texto: Todo o povo via a coluna de nuvem parada à entrada da tenda; levantava-se então e cada um se
      prostrava à entrada da sua tenda.
    status: ia-sem-revisao
  '33:11':
    texto: O Senhor falava com Moisés face a face, como um homem fala com o seu amigo. Depois Moisés voltava
      ao acampamento, mas o seu servidor, o jovem Josué, filho de Nun, não se afastava do interior da
      tenda.
    status: ia-sem-revisao
  '34:4':
    texto: Moisés talhou duas tábuas de pedra como as primeiras. Levantou-se de manhã cedo e subiu ao
      monte Sinai, como o Senhor lhe ordenara, levando na mão as duas tábuas de pedra.
    partes:
    - Moisés talhou duas tábuas de pedra como as primeiras.
    - Levantou-se de manhã cedo e subiu ao monte Sinai, como o Senhor lhe ordenara, levando na mão as
      duas tábuas de pedra.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '34:5':
    texto: O Senhor desceu na nuvem, apresentou-se ali junto dele e proclamou o nome do Senhor.
    status: ia-sem-revisao
  '34:6':
    texto: 'O Senhor passou diante dele e proclamou: “Senhor, Senhor, Deus misericordioso e clemente,
      lento para a ira e rico em misericórdia e fidelidade,'
    status: ia-sem-revisao
  '34:7':
    texto: que conserva a misericórdia por mil gerações, que perdoa a culpa, a transgressão e o pecado,
      mas não deixa impune, e castiga a culpa dos pais nos filhos e nos filhos dos filhos, até a terceira
      e a quarta geração.”
    status: ia-sem-revisao
  '34:8':
    texto: Moisés apressou-se a inclinar-se até o chão e a prostrar-se.
    status: ia-sem-revisao
  '34:9':
    texto: 'E disse: “Se encontrei graça aos teus olhos, Senhor, vá o Senhor no meio de nós, embora este
      seja um povo de dura cerviz; perdoa a nossa culpa e o nosso pecado e toma-nos como tua herança.”'
    status: ia-sem-revisao
  '34:28':
    texto: Moisés esteve ali com o Senhor quarenta dias e quarenta noites; não comeu pão nem bebeu água.
      E escreveu nas tábuas as palavras da aliança, as dez palavras.
    status: ia-sem-revisao
  '34:29':
    texto: Quando Moisés desceu do monte Sinai, com as duas tábuas do testemunho na mão, ao descer do
      monte, não sabia que a pele do seu rosto resplandecia, por ter falado com o Senhor.
    status: ia-sem-revisao
  '34:30':
    texto: Aarão e todos os filhos de Israel viram Moisés e eis que a pele do seu rosto resplandecia;
      e tiveram medo de se aproximar dele.
    status: ia-sem-revisao
  '34:31':
    texto: Moisés os chamou; Aarão e todos os chefes da comunidade voltaram a ele, e Moisés falou-lhes.
    status: ia-sem-revisao
  '34:32':
    texto: Depois disso aproximaram-se todos os filhos de Israel, e ele lhes comunicou tudo o que o Senhor
      lhe tinha dito no monte Sinai.
    status: ia-sem-revisao
  '34:33':
    texto: Quando Moisés acabou de falar com eles, pôs um véu sobre o rosto.
    status: ia-sem-revisao
  '34:34':
    texto: Quando Moisés entrava diante do Senhor para falar com ele, tirava o véu até sair; e, ao sair,
      dizia aos filhos de Israel o que lhe fora ordenado.
    status: ia-sem-revisao
  '34:35':
    texto: Os filhos de Israel viam que a pele do rosto de Moisés resplandecia; então Moisés recolocava
      o véu sobre o rosto, até entrar para falar com o Senhor.
    status: ia-sem-revisao
  '40:16':
    texto: Moisés fez tudo conforme o Senhor lhe ordenara; assim fez.
    status: ia-sem-revisao
  '40:17':
    texto: No primeiro mês do segundo ano, no primeiro dia do mês, foi erguida a Morada.
    status: ia-sem-revisao
  '40:18':
    texto: Moisés ergueu a Morada, pôs as suas bases, colocou as suas tábuas, pôs as suas travessas e
      levantou as suas colunas.
    status: ia-sem-revisao
  '40:19':
    texto: Estendeu a tenda sobre a Morada e colocou a cobertura da tenda por cima, como o Senhor ordenara
      a Moisés.
    status: ia-sem-revisao
  '40:20':
    texto: Tomou o testemunho e o pôs na arca, colocou as varas na arca e pôs o propiciatório sobre a
      arca, por cima.
    status: ia-sem-revisao
  '40:21':
    texto: Levou a arca para a Morada, pôs o véu da cortina e cobriu a arca do testemunho, como o Senhor
      ordenara a Moisés.
    status: ia-sem-revisao
  '40:34':
    texto: A nuvem cobriu a tenda do encontro, e a glória do Senhor encheu a Morada.
    status: ia-sem-revisao
  '40:35':
    texto: Moisés não podia entrar na tenda do encontro, porque a nuvem permanecia sobre ela e a glória
      do Senhor enchia a Morada.
    status: ia-sem-revisao
  '40:36':
    texto: Quando a nuvem se elevava de cima da Morada, os filhos de Israel partiam, em todas as suas
      etapas.
    status: ia-sem-revisao
  '40:37':
    texto: Mas, se a nuvem não se elevava, não partiam até o dia em que ela se elevasse.
    status: ia-sem-revisao
  '40:38':
    texto: Pois a nuvem do Senhor estava sobre a Morada durante o dia, e à noite havia nela um fogo, à
      vista de toda a casa de Israel, em todas as suas etapas.
    status: ia-sem-revisao
