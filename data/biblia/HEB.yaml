livro: HEB
fonte: sblgnt
versiculos:
  '1:1':
    texto: De muitos modos e de muitas maneiras, outrora, Deus falou aos pais pelos profetas;
    status: ia-sem-revisao
  '1:2':
    texto: Nestes últimos dias falou-nos por meio do Filho, a quem constituiu herdeiro de todas as coisas,
      por meio de quem também fez os mundos.
    status: ia-sem-revisao
  '1:3':
    texto: Ele, sendo resplendor da glória e expressão da substância de Deus, e sustentando todas as coisas
      pela palavra do seu poder, tendo realizado por si mesmo a purificação dos pecados, sentou-se à direita
      da Majestade nas alturas,
    status: ia-sem-revisao
  '1:4':
    texto: Tornando-se tanto superior aos anjos quanto herdou um nome mais excelente do que o deles.
    status: ia-sem-revisao
  '1:5':
    texto: 'Pois a qual dos anjos disse alguma vez: “Tu és o meu Filho, eu hoje te gerei”, e de novo:
      “Eu serei para ele um pai, e ele será para mim um filho”?'
    status: ia-sem-revisao
  '1:6':
    texto: 'E quando de novo introduz o Primogênito no mundo, diz: “E todos os anjos de Deus o adorem.”'
    status: ia-sem-revisao
  '1:7':
    texto: 'E, a respeito dos anjos, diz: “Aquele que faz dos seus anjos ventos, e dos seus ministros
      chama de fogo”;'
    status: ia-sem-revisao
  '1:8':
    texto: 'Mas a respeito do Filho: “O teu trono, ó Deus, é por todo o sempre, e o cetro da retidão é
      o cetro do teu reino.'
    status: ia-sem-revisao
  '1:9':
    texto: Amaste a justiça e odiaste a iniquidade; por isso Deus, o teu Deus, ungiu-te com óleo de alegria
      acima dos teus companheiros.”
    status: ia-sem-revisao
  '1:10':
    texto: 'E: “Tu, Senhor, no princípio fundaste a terra, e os céus são obra das tuas mãos;'
    status: ia-sem-revisao
  '1:11':
    texto: Eles perecerão, mas tu permaneces; e todos envelhecerão como uma veste,
    status: ia-sem-revisao
  '1:12':
    texto: E como um manto os enrolarás, como uma veste, e serão mudados; mas tu és o mesmo, e os teus
      anos não terão fim.”
    status: ia-sem-revisao
  '1:13':
    texto: 'E a qual dos anjos disse alguma vez: “Senta-te à minha direita, até que eu ponha os teus inimigos
      como estrado dos teus pés”?'
    status: ia-sem-revisao
  '1:14':
    texto: Não são todos eles espíritos a serviço, enviados em ministério em favor dos que hão de herdar
      a salvação?
    status: ia-sem-revisao
  '2:1':
    texto: Por isso, convém que prestemos atenção mais intensa ao que ouvimos, para que não nos desviemos.
    status: ia-sem-revisao
  '2:2':
    texto: Pois, se a palavra falada por meio de anjos se mostrou firme, e toda transgressão e desobediência
      recebeu justa retribuição,
    status: ia-sem-revisao
  '2:3':
    texto: Como escaparemos nós, se negligenciarmos tão grande salvação, que, tendo começado a ser anunciada
      pelo Senhor, foi confirmada a nós pelos que a ouviram,
    status: ia-sem-revisao
  '2:4':
    texto: Dando Deus testemunho juntamente com eles por sinais, prodígios e diversos milagres, e por
      distribuições do Espírito Santo segundo a sua vontade?
    status: ia-sem-revisao
  '2:5':
    texto: Pois não foi a anjos que ele submeteu o mundo vindouro, do qual falamos.
    status: ia-sem-revisao
  '2:6':
    texto: 'Alguém, porém, em algum lugar atestou, dizendo: “Que é o homem, para te lembrares dele, ou
      o filho do homem, para dele te ocupares?'
    status: ia-sem-revisao
  '2:7':
    texto: Fizeste-o por um pouco inferior aos anjos, de glória e honra o coroaste,
    status: ia-sem-revisao
  '2:8':
    texto: Tudo submeteste debaixo dos seus pés.” Ao submeter-lhe tudo, nada deixou que não lhe fosse
      submetido. Agora, porém, ainda não vemos tudo submetido a ele;
    status: ia-sem-revisao
  '2:9':
    texto: Vemos, no entanto, Jesus, feito por um pouco inferior aos anjos, coroado de glória e honra
      por causa da paixão da morte, para que, à parte de Deus, provasse a morte em favor de todos.
    status: ia-sem-revisao
    observacao: 'O texto-base traz “à parte de Deus” (alguns manuscritos: “pela graça de Deus”, leitura
      da Vulgata).'
  '2:10':
    texto: Pois convinha àquele por causa de quem e por meio de quem tudo existe, ao conduzir muitos filhos
      à glória, levar à perfeição, por meio de sofrimentos, o autor da salvação deles.
    status: ia-sem-revisao
  '2:11':
    texto: Pois tanto o que santifica quanto os que são santificados vêm todos de um só; por isso não
      se envergonha de chamá-los irmãos,
    status: ia-sem-revisao
  '2:12':
    texto: 'Dizendo: “Anunciarei o teu nome aos meus irmãos, no meio da assembleia te cantarei hinos”;'
    status: ia-sem-revisao
  '2:13':
    texto: 'E de novo: “Eu porei nele a minha confiança”; e de novo: “Eis-me aqui, e os filhos que Deus
      me deu.”'
    status: ia-sem-revisao
  '2:14':
    texto: Visto, pois, que os filhos participam de sangue e carne, também ele, de modo semelhante, participou
      das mesmas coisas, para que, pela morte, destruísse aquele que tem o poder da morte, isto é, o diabo,
    status: ia-sem-revisao
  '2:15':
    texto: E libertasse todos aqueles que, por medo da morte, estavam durante toda a vida sujeitos à escravidão.
    status: ia-sem-revisao
  '2:16':
    texto: Pois, com efeito, não é de anjos que ele se ocupa, mas da descendência de Abraão.
    status: ia-sem-revisao
  '2:17':
    texto: Por isso devia assemelhar-se em tudo aos irmãos, para ser sumo sacerdote misericordioso e fiel
      nas coisas que dizem respeito a Deus, a fim de expiar os pecados do povo;
    status: ia-sem-revisao
  '2:18':
    texto: Pois, por ter ele mesmo sofrido, tendo sido provado, pode socorrer os que são provados.
    status: ia-sem-revisao
  '3:1':
    texto: Por isso, irmãos santos, participantes de uma vocação celeste, considerai Jesus, apóstolo e
      sumo sacerdote da nossa confissão,
    status: ia-sem-revisao
  '3:2':
    texto: Que é fiel àquele que o constituiu, como também Moisés em toda a sua casa.
    status: ia-sem-revisao
  '3:3':
    texto: Pois este foi julgado digno de maior glória do que Moisés, na medida em que maior honra do
      que a casa tem aquele que a construiu.
    status: ia-sem-revisao
  '3:4':
    texto: Pois toda casa é construída por alguém, mas o que construiu todas as coisas é Deus.
    status: ia-sem-revisao
  '3:5':
    texto: E Moisés foi fiel em toda a sua casa como servo, para testemunho das coisas que haviam de ser
      ditas;
    status: ia-sem-revisao
  '3:6':
    texto: Cristo, porém, como Filho, sobre a sua casa; e a sua casa somos nós, se mantivermos firmes
      até o fim a confiança e a glória da esperança.
    status: ia-sem-revisao
  '3:7':
    texto: 'Por isso, como diz o Espírito Santo: “Hoje, se ouvirdes a sua voz,'
    status: ia-sem-revisao
  '3:8':
    texto: Não endureçais os vossos corações, como na rebelião, no dia da provação no deserto,
    status: ia-sem-revisao
  '3:9':
    texto: Onde os vossos pais me puseram à prova, pondo-me à prova, e viram as minhas obras
    status: ia-sem-revisao
  '3:10':
    texto: 'Durante quarenta anos. Por isso me irritei com essa geração e disse: ‘Sempre se extraviam
      no coração; eles não conheceram os meus caminhos’;'
    status: ia-sem-revisao
  '3:11':
    texto: 'Assim jurei na minha ira: ‘Não entrarão no meu repouso!’”'
    status: ia-sem-revisao
  '3:12':
    texto: Vede, irmãos, que não haja em algum de vós um coração mau de incredulidade, que se afaste do
      Deus vivo;
    status: ia-sem-revisao
  '3:13':
    texto: Mas exortai-vos uns aos outros cada dia, enquanto se diz “Hoje”, para que nenhum de vós se
      endureça pelo engano do pecado.
    status: ia-sem-revisao
  '3:14':
    texto: Pois nos tornamos participantes de Cristo, se de fato mantivermos firme até o fim o princípio
      da nossa confiança,
    status: ia-sem-revisao
  '3:15':
    texto: 'Enquanto se diz: “Hoje, se ouvirdes a sua voz, não endureçais os vossos corações, como na
      rebelião.”'
    status: ia-sem-revisao
  '3:16':
    texto: Quem foram, pois, os que, tendo ouvido, se rebelaram? Não foram todos os que saíram do Egito
      por meio de Moisés?
    status: ia-sem-revisao
  '3:17':
    texto: E com quem se irritou durante quarenta anos? Não foi com os que pecaram, cujos cadáveres caíram
      no deserto?
    status: ia-sem-revisao
  '3:18':
    texto: E a quem jurou que não entrariam no seu repouso, senão aos desobedientes?
    status: ia-sem-revisao
  '3:19':
    texto: E vemos que não puderam entrar por causa da incredulidade.
    status: ia-sem-revisao
  '4:1':
    texto: Temamos, pois, que, sendo deixada a promessa de entrar no seu repouso, pareça algum de vós
      ter ficado para trás.
    status: ia-sem-revisao
  '4:2':
    texto: Pois também a nós foi anunciada a boa-nova, como a eles; mas a palavra ouvida não lhes aproveitou,
      por não estarem unidos pela fé aos que a ouviram.
    status: ia-sem-revisao
  '4:3':
    texto: 'Pois entramos no repouso nós que cremos, como disse: “Assim jurei na minha ira: ‘Não entrarão
      no meu repouso!’”, embora as obras estivessem concluídas desde a fundação do mundo.'
    status: ia-sem-revisao
  '4:4':
    texto: 'Pois em algum lugar disse assim a respeito do sétimo dia: “E no sétimo dia Deus repousou de
      todas as suas obras”;'
    status: ia-sem-revisao
  '4:5':
    texto: 'E neste lugar de novo: “Não entrarão no meu repouso!”'
    status: ia-sem-revisao
  '4:6':
    texto: Visto, pois, que resta que alguns entrem nele, e os primeiros a quem foi anunciada a boa-nova
      não entraram por desobediência,
    status: ia-sem-revisao
  '4:7':
    texto: 'De novo fixa um certo dia, “Hoje”, dizendo por Davi, depois de tanto tempo, como antes foi
      dito: “Hoje, se ouvirdes a sua voz, não endureçais os vossos corações.”'
    status: ia-sem-revisao
  '4:8':
    texto: Pois, se Josué lhes tivesse dado repouso, não falaria depois disso de outro dia.
    status: ia-sem-revisao
  '4:9':
    texto: Resta, portanto, um repouso sabático para o povo de Deus;
    status: ia-sem-revisao
  '4:10':
    texto: Pois quem entrou no seu repouso também ele repousou das suas obras, como Deus das suas.
    status: ia-sem-revisao
  '4:11':
    texto: Empenhemo-nos, pois, em entrar naquele repouso, para que ninguém caia no mesmo exemplo de desobediência.
    status: ia-sem-revisao
  '4:12':
    texto: Pois a palavra de Deus é viva, eficaz e mais cortante do que qualquer espada de dois gumes,
      penetrando até a divisão da alma e do espírito, das juntas e das medulas, e discerne os pensamentos
      e as intenções do coração;
    status: ia-sem-revisao
  '4:13':
    texto: E não há criatura invisível diante dele, mas todas as coisas estão nuas e expostas aos olhos
      daquele a quem devemos prestar contas.
    status: ia-sem-revisao
  '4:14':
    texto: Tendo, pois, um grande sumo sacerdote que atravessou os céus, Jesus, o Filho de Deus, mantenhamos
      firme a nossa confissão;
    status: ia-sem-revisao
  '4:15':
    texto: Pois não temos um sumo sacerdote incapaz de compadecer-se das nossas fraquezas, mas provado
      em tudo à nossa semelhança, sem pecado.
    status: ia-sem-revisao
  '4:16':
    texto: Aproximemo-nos, pois, com confiança do trono da graça, para recebermos misericórdia e encontrarmos
      graça, para um auxílio oportuno.
    status: ia-sem-revisao
  '5:1':
    texto: Pois todo sumo sacerdote, tomado dentre os homens, é constituído em favor dos homens nas coisas
      que dizem respeito a Deus, para oferecer dons e sacrifícios pelos pecados,
    status: ia-sem-revisao
  '5:2':
    texto: Capaz de ter compaixão dos ignorantes e dos que erram, uma vez que ele mesmo está cercado de
      fraqueza,
    status: ia-sem-revisao
  '5:3':
    texto: E por causa dela deve oferecer sacrifícios pelos pecados, tanto pelo povo como por si mesmo.
    status: ia-sem-revisao
  '5:4':
    texto: E ninguém toma para si essa honra, mas é chamado por Deus, como Aarão.
    status: ia-sem-revisao
  '5:5':
    texto: 'Assim também Cristo não se glorificou a si mesmo para tornar-se sumo sacerdote, mas aquele
      que lhe disse: “Tu és o meu Filho, eu hoje te gerei”;'
    status: ia-sem-revisao
  '5:6':
    texto: 'Como também diz em outro lugar: “Tu és sacerdote para sempre, segundo a ordem de Melquisedec.”'
    status: ia-sem-revisao
  '5:7':
    texto: Ele, nos dias da sua carne, tendo oferecido orações e súplicas, com grande clamor e lágrimas,
      àquele que podia salvá-lo da morte, e tendo sido atendido por causa da sua piedade,
    status: ia-sem-revisao
  '5:8':
    texto: Embora fosse Filho, aprendeu a obediência por meio do que sofreu,
    status: ia-sem-revisao
  '5:9':
    texto: E, levado à perfeição, tornou-se para todos os que lhe obedecem causa de salvação eterna,
    status: ia-sem-revisao
  '5:10':
    texto: Proclamado por Deus sumo sacerdote segundo a ordem de Melquisedec.
    status: ia-sem-revisao
  '5:11':
    texto: Sobre isso temos muito a dizer, e difícil de explicar, porque vos tornastes lentos para ouvir.
    status: ia-sem-revisao
  '5:12':
    texto: Pois, devendo já ser mestres pelo tempo, tendes de novo necessidade de que alguém vos ensine
      os primeiros elementos dos oráculos de Deus, e tornastes-vos necessitados de leite, e não de alimento
      sólido.
    status: ia-sem-revisao
  '5:13':
    texto: Pois todo aquele que se alimenta de leite é inexperiente na palavra de justiça, porque é criança;
    status: ia-sem-revisao
  '5:14':
    texto: O alimento sólido, porém, é para os perfeitos, para aqueles que, pelo hábito, têm os sentidos
      exercitados para discernir o bem e o mal.
    status: ia-sem-revisao
  '6:1':
    texto: Por isso, deixando a palavra elementar sobre Cristo, avancemos para a perfeição, sem lançar
      de novo o fundamento da conversão das obras mortas e da fé em Deus,
    status: ia-sem-revisao
  '6:2':
    texto: Do ensino sobre batismos, da imposição das mãos, da ressurreição dos mortos e do julgamento
      eterno.
    status: ia-sem-revisao
  '6:3':
    texto: E isto faremos, se Deus o permitir.
    status: ia-sem-revisao
  '6:4':
    texto: Pois é impossível que os que uma vez foram iluminados, provaram o dom celeste, tornaram-se
      participantes do Espírito Santo,
    status: ia-sem-revisao
  '6:5':
    texto: E provaram a boa palavra de Deus e os poderes do mundo vindouro,
    status: ia-sem-revisao
  '6:6':
    texto: E caíram, sejam renovados de novo para a conversão, crucificando de novo para si mesmos o Filho
      de Deus e expondo-o ao desprezo.
    status: ia-sem-revisao
  '6:7':
    texto: Pois a terra que bebe a chuva que muitas vezes cai sobre ela e produz erva útil àqueles por
      causa dos quais é cultivada recebe bênção da parte de Deus;
    status: ia-sem-revisao
  '6:8':
    texto: Mas, se produz espinhos e abrolhos, é reprovada e está perto da maldição; o seu fim é o fogo.
    status: ia-sem-revisao
  '6:9':
    texto: Estamos, porém, persuadidos a vosso respeito, amados, de coisas melhores e que levam à salvação,
      ainda que falemos assim.
    status: ia-sem-revisao
  '6:10':
    texto: Pois Deus não é injusto para esquecer a vossa obra e o amor que mostrastes pelo seu nome, tendo
      servido e continuando a servir os santos.
    status: ia-sem-revisao
  '6:11':
    texto: Desejamos, porém, que cada um de vós mostre o mesmo empenho para a plena certeza da esperança
      até o fim,
    status: ia-sem-revisao
  '6:12':
    texto: Para que não vos torneis indolentes, mas imitadores dos que, pela fé e pela paciência, herdam
      as promessas.
    status: ia-sem-revisao
  '6:13':
    texto: Pois, quando Deus fez a promessa a Abraão, como não tinha ninguém maior por quem jurar, jurou
      por si mesmo,
    status: ia-sem-revisao
  '6:14':
    texto: 'Dizendo: “Certamente te abençoarei abundantemente e te multiplicarei grandemente.”'
    status: ia-sem-revisao
  '6:15':
    texto: E assim, tendo esperado com paciência, alcançou a promessa.
    status: ia-sem-revisao
  '6:16':
    texto: Pois os homens juram por alguém maior, e para eles o juramento é o fim de toda contestação,
      para garantia.
    status: ia-sem-revisao
  '6:17':
    texto: Por isso Deus, querendo mostrar mais abundantemente aos herdeiros da promessa a imutabilidade
      do seu propósito, interpôs um juramento,
    status: ia-sem-revisao
  '6:18':
    texto: Para que, por duas coisas imutáveis, nas quais é impossível que Deus minta, tenhamos um forte
      encorajamento nós que nos refugiamos para agarrar a esperança proposta;
    status: ia-sem-revisao
  '6:19':
    texto: A qual temos como âncora da alma, segura e firme, e que penetra no interior do véu,
    status: ia-sem-revisao
  '6:20':
    texto: Aonde Jesus entrou como precursor por nós, tornando-se sumo sacerdote para sempre, segundo
      a ordem de Melquisedec.
    status: ia-sem-revisao
  '7:1':
    texto: Pois este Melquisedec, rei de Salém, sacerdote do Deus Altíssimo, que foi ao encontro de Abraão
      quando voltava da derrota dos reis e o abençoou,
    status: ia-sem-revisao
  '7:2':
    texto: A quem também Abraão repartiu o dízimo de tudo; em primeiro lugar, o seu nome, traduzido, é
      rei de justiça, e depois também rei de Salém, isto é, rei de paz;
    status: ia-sem-revisao
  '7:3':
    texto: Sem pai, sem mãe, sem genealogia, sem princípio de dias nem fim de vida, mas assemelhado ao
      Filho de Deus, permanece sacerdote para sempre.
    status: ia-sem-revisao
  '7:4':
    texto: Considerai quão grande era este, a quem o patriarca Abraão deu o dízimo dos melhores despojos.
    status: ia-sem-revisao
  '7:5':
    texto: E os que dentre os filhos de Levi recebem o sacerdócio têm mandamento de tomar o dízimo do
      povo segundo a lei, isto é, dos seus irmãos, embora tenham saído dos lombos de Abraão;
    status: ia-sem-revisao
  '7:6':
    texto: Mas aquele cuja genealogia não procede deles tomou o dízimo de Abraão e abençoou o que tinha
      as promessas.
    status: ia-sem-revisao
  '7:7':
    texto: Ora, sem nenhuma contestação, o menor é abençoado pelo maior.
    status: ia-sem-revisao
  '7:8':
    texto: E aqui recebem dízimos homens mortais, mas ali alguém de quem se testemunha que vive.
    status: ia-sem-revisao
  '7:9':
    texto: E, por assim dizer, por meio de Abraão também Levi, que recebe dízimos, pagou dízimo,
    status: ia-sem-revisao
  '7:10':
    texto: Pois ainda estava nos lombos do pai quando Melquisedec foi ao seu encontro.
    status: ia-sem-revisao
  '7:11':
    texto: Se, pois, a perfeição fosse alcançada pelo sacerdócio levítico — pois sobre ele o povo recebeu
      a lei —, que necessidade havia ainda de se levantar outro sacerdote segundo a ordem de Melquisedec,
      e não ser chamado segundo a ordem de Aarão?
    status: ia-sem-revisao
  '7:12':
    texto: Pois, mudando-se o sacerdócio, necessariamente se faz também mudança da lei.
    status: ia-sem-revisao
  '7:13':
    texto: Pois aquele de quem se dizem estas coisas pertence a outra tribo, da qual ninguém serviu ao
      altar;
    status: ia-sem-revisao
  '7:14':
    texto: Pois é evidente que nosso Senhor surgiu de Judá, tribo a respeito da qual Moisés nada disse
      sobre sacerdotes.
    status: ia-sem-revisao
  '7:15':
    texto: E ainda mais evidente é, se segundo a semelhança de Melquisedec se levanta outro sacerdote,
    status: ia-sem-revisao
  '7:16':
    texto: Que se tornou tal não segundo a lei de uma prescrição carnal, mas segundo o poder de uma vida
      indestrutível,
    status: ia-sem-revisao
  '7:17':
    texto: 'Pois se atesta: “Tu és sacerdote para sempre, segundo a ordem de Melquisedec.”'
    status: ia-sem-revisao
  '7:18':
    texto: Com efeito, dá-se a revogação de um mandamento anterior, por causa da sua fraqueza e inutilidade,
    status: ia-sem-revisao
  '7:19':
    texto: Pois a lei nada levou à perfeição, mas é a introdução de uma esperança melhor, pela qual nos
      aproximamos de Deus.
    status: ia-sem-revisao
  '7:20':
    texto: E, na medida em que não foi sem juramento — pois aqueles tornaram-se sacerdotes sem juramento,
    status: ia-sem-revisao
  '7:21':
    texto: 'Mas este com juramento, por aquele que lhe disse: “O Senhor jurou e não se arrependerá: Tu
      és sacerdote para sempre” —'
    status: ia-sem-revisao
  '7:22':
    texto: Nessa mesma medida Jesus tornou-se fiador de uma aliança melhor.
    status: ia-sem-revisao
  '7:23':
    texto: E aqueles tornaram-se sacerdotes em maior número, porque a morte os impedia de permanecer;
    status: ia-sem-revisao
  '7:24':
    texto: Este, porém, porque permanece para sempre, tem um sacerdócio que não passa.
    status: ia-sem-revisao
  '7:25':
    texto: Por isso também pode salvar plenamente os que por ele se aproximam de Deus, vivendo sempre
      para interceder por eles.
    status: ia-sem-revisao
  '7:26':
    texto: 'Tal sumo sacerdote era, com efeito, o que nos convinha: santo, inocente, imaculado, separado
      dos pecadores e feito mais alto que os céus;'
    status: ia-sem-revisao
  '7:27':
    texto: Que não tem necessidade, como os sumos sacerdotes, de oferecer sacrifícios cada dia, primeiro
      pelos próprios pecados, depois pelos do povo — pois isto fez de uma vez por todas, oferecendo-se
      a si mesmo.
    status: ia-sem-revisao
  '7:28':
    texto: Pois a lei constitui sumos sacerdotes homens que têm fraqueza; a palavra do juramento, porém,
      posterior à lei, constitui o Filho, levado à perfeição para sempre.
    status: ia-sem-revisao
  '8:1':
    texto: 'O ponto principal do que estamos dizendo é este: temos um sumo sacerdote tal que se sentou
      à direita do trono da Majestade nos céus,'
    status: ia-sem-revisao
  '8:2':
    texto: Ministro do santuário e da tenda verdadeira, que o Senhor armou, e não o homem.
    status: ia-sem-revisao
  '8:3':
    texto: Pois todo sumo sacerdote é constituído para oferecer dons e sacrifícios; por isso é necessário
      que também este tenha algo para oferecer.
    status: ia-sem-revisao
  '8:4':
    texto: Se estivesse, pois, na terra, nem sequer seria sacerdote, havendo os que oferecem os dons segundo
      a lei —
    status: ia-sem-revisao
  '8:5':
    texto: 'Os quais servem numa cópia e sombra das realidades celestes, conforme foi divinamente advertido
      Moisés, quando ia construir a tenda: “Olha”, diz, “fará tudo segundo o modelo que te foi mostrado
      no monte.”'
    status: ia-sem-revisao
  '8:6':
    texto: Agora, porém, alcançou um ministério tanto mais excelente quanto é mediador de uma aliança
      melhor, fundada em promessas melhores.
    partes:
    - Agora, porém, alcançou um ministério tanto mais excelente quanto é mediador de uma aliança melhor,
    - fundada em promessas melhores.
    status: ia-sem-revisao
  '8:7':
    texto: Pois, se aquela primeira fosse irrepreensível, não se procuraria lugar para uma segunda.
    status: ia-sem-revisao
  '8:8':
    texto: 'Pois, censurando-os, diz: “Eis que vêm dias, diz o Senhor, em que concluirei com a casa de
      Israel e com a casa de Judá uma aliança nova,'
    status: ia-sem-revisao
  '8:9':
    texto: Não como a aliança que fiz com os seus pais no dia em que os tomei pela mão para os tirar da
      terra do Egito; porque eles não permaneceram na minha aliança, e eu me desinteressei deles, diz
      o Senhor.
    status: ia-sem-revisao
  '8:10':
    texto: 'Pois esta é a aliança que farei com a casa de Israel depois daqueles dias, diz o Senhor: colocando
      as minhas leis na mente deles, também sobre o coração deles as escreverei; e serei Deus para eles,
      e eles serão povo para mim.'
    status: ia-sem-revisao
  '8:11':
    texto: 'E de modo algum ensinará cada um o seu concidadão e cada um o seu irmão, dizendo: ‘Conhece
      o Senhor’, porque todos me conhecerão, desde o menor até o maior deles.'
    status: ia-sem-revisao
  '8:12':
    texto: Porque serei misericordioso para com as suas injustiças, e dos seus pecados não me lembrarei
      mais.”
    status: ia-sem-revisao
  '8:13':
    texto: Ao dizer “nova”, tornou antiga a primeira; e o que se torna antigo e envelhece está perto de
      desaparecer.
    status: ia-sem-revisao
  '9:1':
    texto: Tinha, pois, também a primeira aliança prescrições de culto e um santuário terreno.
    status: ia-sem-revisao
  '9:2':
    texto: Pois foi armada uma tenda, a primeira, na qual estavam o candelabro, a mesa e a exposição dos
      pães, que se chama o Santo;
    status: ia-sem-revisao
  '9:3':
    texto: E, depois do segundo véu, a tenda chamada Santo dos Santos,
    status: ia-sem-revisao
  '9:4':
    texto: Que tinha o altar de ouro do incenso e a arca da aliança, toda revestida de ouro, na qual havia
      uma urna de ouro contendo o maná, a vara de Aarão que floresceu e as tábuas da aliança;
    status: ia-sem-revisao
  '9:5':
    texto: E por cima dela os querubins da glória, que cobriam com sua sombra o propiciatório; sobre isso
      não é agora o momento de falar em detalhe.
    status: ia-sem-revisao
  '9:6':
    texto: Estando, pois, estas coisas assim dispostas, na primeira tenda entram continuamente os sacerdotes,
      realizando o culto;
    status: ia-sem-revisao
  '9:7':
    texto: Mas na segunda, uma vez por ano, somente o sumo sacerdote, não sem sangue, que oferece por
      si mesmo e pelos pecados de ignorância do povo,
    status: ia-sem-revisao
  '9:8':
    texto: Mostrando com isto o Espírito Santo que o caminho para o santuário ainda não estava manifesto,
      enquanto a primeira tenda ainda estava de pé,
    status: ia-sem-revisao
  '9:9':
    texto: A qual é um símbolo para o tempo presente, segundo o qual se oferecem dons e sacrifícios que
      não podem levar à perfeição, quanto à consciência, aquele que presta culto,
    status: ia-sem-revisao
  '9:10':
    texto: Consistindo apenas em alimentos, bebidas e diversas abluções, prescrições da carne impostas
      até o tempo da reforma.
    status: ia-sem-revisao
  '9:11':
    texto: Cristo, porém, tendo vindo como sumo sacerdote dos bens que se realizaram, passando por uma
      tenda maior e mais perfeita, não feita por mãos, isto é, não desta criação,
    status: ia-sem-revisao
  '9:12':
    texto: E não com sangue de bodes e novilhos, mas com o seu próprio sangue, entrou uma vez por todas
      no santuário, tendo obtido uma redenção eterna.
    status: ia-sem-revisao
  '9:13':
    texto: Pois, se o sangue de bodes e de touros e a cinza de uma novilha, aspergindo os contaminados,
      os santifica para a pureza da carne,
    status: ia-sem-revisao
  '9:14':
    texto: Quanto mais o sangue de Cristo, que por um Espírito eterno se ofereceu a si mesmo sem mancha
      a Deus, purificará a nossa consciência das obras mortas, para prestarmos culto ao Deus vivo!
    status: ia-sem-revisao
  '9:15':
    texto: E por isso é mediador de uma nova aliança, a fim de que, tendo ocorrido uma morte para a redenção
      das transgressões cometidas sob a primeira aliança, os chamados recebam a promessa da herança eterna.
    status: ia-sem-revisao
  '9:16':
    texto: Pois onde há testamento, é necessário que se comprove a morte do testador;
    status: ia-sem-revisao
  '9:17':
    texto: Pois um testamento é firme em caso de mortos, visto que nunca tem valor enquanto vive o testador.
    status: ia-sem-revisao
  '9:18':
    texto: Por isso nem mesmo a primeira foi inaugurada sem sangue;
    status: ia-sem-revisao
  '9:19':
    texto: Pois, depois de Moisés ter proclamado a todo o povo todo mandamento segundo a lei, tomando
      o sangue dos novilhos com água, lã escarlate e hissopo, aspergiu o próprio livro e todo o povo,
    status: ia-sem-revisao
  '9:20':
    texto: 'Dizendo: “Este é o sangue da aliança que Deus ordenou para vós.”'
    status: ia-sem-revisao
  '9:21':
    texto: E também a tenda e todos os utensílios do culto aspergiu, do mesmo modo, com o sangue.
    status: ia-sem-revisao
  '9:22':
    texto: E quase tudo, segundo a lei, é purificado com sangue, e sem derramamento de sangue não há perdão.
    status: ia-sem-revisao
  '9:23':
    texto: É necessário, pois, que as cópias das realidades que estão nos céus sejam purificadas por estes
      meios, mas as próprias realidades celestes, por sacrifícios melhores que estes.
    status: ia-sem-revisao
  '9:24':
    texto: Pois Cristo não entrou num santuário feito por mãos, figura do verdadeiro, mas no próprio céu,
      para agora comparecer por nós diante da face de Deus;
    status: ia-sem-revisao
  '9:25':
    texto: Nem para se oferecer muitas vezes, como o sumo sacerdote entra no santuário todo ano com sangue
      alheio,
    status: ia-sem-revisao
  '9:26':
    texto: Pois então deveria ter sofrido muitas vezes desde a fundação do mundo; agora, porém, uma só
      vez, na consumação dos séculos, manifestou-se para a abolição do pecado por meio do seu sacrifício.
    status: ia-sem-revisao
  '9:27':
    texto: E assim como está reservado aos homens morrer uma só vez, e depois disso o julgamento,
    status: ia-sem-revisao
  '9:28':
    texto: Assim também Cristo, tendo sido oferecido uma só vez para carregar os pecados de muitos, aparecerá
      uma segunda vez, sem pecado, aos que o esperam, para a salvação.
    status: ia-sem-revisao
  '10:1':
    texto: Pois a lei, tendo sombra dos bens futuros, e não a própria imagem das realidades, nunca pode,
      pelos mesmos sacrifícios que se oferecem continuamente, ano após ano, levar à perfeição os que se
      aproximam;
    status: ia-sem-revisao
  '10:2':
    texto: Do contrário, não teriam deixado de ser oferecidos, por já não terem consciência de pecados
      os que prestam culto, uma vez purificados?
    status: ia-sem-revisao
  '10:3':
    texto: Mas neles há, ano após ano, uma lembrança de pecados,
    status: ia-sem-revisao
  '10:4':
    texto: Pois é impossível que sangue de touros e de bodes tire pecados.
    status: ia-sem-revisao
  '10:5':
    texto: 'Por isso, ao entrar no mundo, diz: “Sacrifício e oferta não quiseste, mas um corpo me preparaste;'
    status: ia-sem-revisao
  '10:6':
    texto: Holocaustos e sacrifícios pelo pecado não te agradaram.
    status: ia-sem-revisao
  '10:7':
    texto: 'Então eu disse: ‘Eis que venho — no rolo do livro está escrito a meu respeito — para fazer,
      ó Deus, a tua vontade.’”'
    status: ia-sem-revisao
  '10:8':
    texto: 'Dizendo primeiro: “Sacrifícios, ofertas, holocaustos e sacrifícios pelo pecado não quiseste
      nem te agradaram”, os quais são oferecidos segundo a lei,'
    status: ia-sem-revisao
  '10:9':
    texto: 'Então disse: “Eis que venho para fazer a tua vontade.” Tira o primeiro para estabelecer o
      segundo.'
    status: ia-sem-revisao
  '10:10':
    texto: Nessa vontade somos santificados, pela oferta do corpo de Jesus Cristo, uma vez por todas.
    status: ia-sem-revisao
  '10:11':
    texto: E todo sacerdote está em pé, cada dia, exercendo o serviço e oferecendo muitas vezes os mesmos
      sacrifícios, que jamais podem tirar pecados.
    status: ia-sem-revisao
  '10:12':
    texto: Este, porém, tendo oferecido um único sacrifício pelos pecados, sentou-se para sempre à direita
      de Deus,
    status: ia-sem-revisao
  '10:13':
    texto: Esperando daí em diante até que os seus inimigos sejam postos como estrado dos seus pés,
    status: ia-sem-revisao
  '10:14':
    texto: Pois com uma só oferta levou à perfeição para sempre os que são santificados.
    status: ia-sem-revisao
  '10:15':
    texto: 'E dá-nos testemunho também o Espírito Santo, pois, depois de ter dito:'
    status: ia-sem-revisao
  '10:16':
    texto: '“Esta é a aliança que farei com eles depois daqueles dias, diz o Senhor: colocando as minhas
      leis sobre o coração deles, também na mente deles as escreverei”,'
    status: ia-sem-revisao
  '10:17':
    texto: “E dos seus pecados e das suas iniquidades já não me lembrarei.”
    status: ia-sem-revisao
  '10:18':
    texto: Ora, onde há perdão destes, já não há oferta pelo pecado.
    status: ia-sem-revisao
  '10:19':
    texto: Tendo, pois, irmãos, a confiança de entrar no santuário pelo sangue de Jesus,
    status: ia-sem-revisao
  '10:20':
    texto: Caminho novo e vivo que ele inaugurou para nós através do véu, isto é, da sua carne,
    status: ia-sem-revisao
  '10:21':
    texto: E tendo um grande sacerdote sobre a casa de Deus,
    status: ia-sem-revisao
  '10:22':
    texto: Aproximemo-nos com coração sincero, em plenitude de fé, com os corações purificados de má consciência
      e o corpo lavado com água pura;
    status: ia-sem-revisao
  '10:23':
    texto: Mantenhamos firme a confissão da esperança, sem vacilar, pois fiel é o que prometeu;
    status: ia-sem-revisao
  '10:24':
    texto: E atentemos uns aos outros para nos estimularmos ao amor e às boas obras,
    status: ia-sem-revisao
  '10:25':
    texto: Não abandonando a nossa reunião, como é costume de alguns, mas exortando-nos, e tanto mais
      quanto vedes aproximar-se o Dia.
    status: ia-sem-revisao
  '10:26':
    texto: Pois, se pecarmos voluntariamente depois de ter recebido o conhecimento da verdade, já não
      resta sacrifício pelos pecados,
    status: ia-sem-revisao
  '10:27':
    texto: Mas uma terrível expectativa de julgamento e um ardor de fogo que vai devorar os adversários.
    status: ia-sem-revisao
  '10:28':
    texto: Quem violou a lei de Moisés morre sem compaixão, pelo depoimento de duas ou três testemunhas;
    status: ia-sem-revisao
  '10:29':
    texto: De quanto pior castigo julgais que será considerado digno aquele que pisou o Filho de Deus,
      e considerou profano o sangue da aliança pelo qual foi santificado, e ultrajou o Espírito da graça!
    status: ia-sem-revisao
  '10:30':
    texto: 'Pois conhecemos aquele que disse: “A mim pertence a vingança, eu retribuirei”; e de novo:
      “O Senhor julgará o seu povo.”'
    status: ia-sem-revisao
  '10:31':
    texto: Terrível é cair nas mãos do Deus vivo.
    status: ia-sem-revisao
  '10:32':
    texto: Lembrai-vos, porém, dos dias anteriores, nos quais, depois de iluminados, suportastes um grande
      combate de sofrimentos,
    status: ia-sem-revisao
  '10:33':
    texto: Ora expostos como em espetáculo a injúrias e tribulações, ora tornados companheiros dos que
      viviam assim tratados;
    status: ia-sem-revisao
  '10:34':
    texto: Pois vos compadecestes dos prisioneiros e aceitastes com alegria o saque dos vossos bens, sabendo
      que possuís um bem melhor e permanente.
    status: ia-sem-revisao
  '10:35':
    texto: Não percais, pois, a vossa confiança, que tem grande recompensa;
    status: ia-sem-revisao
  '10:36':
    texto: Pois tendes necessidade de perseverança, para que, tendo feito a vontade de Deus, alcanceis
      a promessa.
    status: ia-sem-revisao
  '10:37':
    texto: “Pois ainda um pouquinho, só um pouquinho, e aquele que vem virá e não tardará;
    status: ia-sem-revisao
  '10:38':
    texto: Mas o meu justo viverá pela fé; e, se recuar, a minha alma não se agrada dele.”
    status: ia-sem-revisao
  '10:39':
    texto: Nós, porém, não somos do recuo para a perdição, mas da fé para a conquista da alma.
    status: ia-sem-revisao
  '11:1':
    texto: A fé é a garantia do que se espera, a prova das realidades que não se veem;
    status: ia-sem-revisao
  '11:2':
    texto: Pois por ela os antigos receberam testemunho.
    status: ia-sem-revisao
  '11:3':
    texto: Pela fé compreendemos que os mundos foram formados pela palavra de Deus, de modo que o que
      se vê não veio do que é visível.
    status: ia-sem-revisao
  '11:4':
    texto: Pela fé Abel ofereceu a Deus um sacrifício melhor do que o de Caim; por ela foi declarado justo,
      dando Deus testemunho sobre os seus dons; e por ela, mesmo morto, ainda fala.
    status: ia-sem-revisao
  '11:5':
    texto: Pela fé Henoc foi transladado para não ver a morte, e não foi encontrado, porque Deus o transladou;
      pois antes da transladação recebeu testemunho de que agradara a Deus.
    status: ia-sem-revisao
  '11:6':
    texto: Sem fé, porém, é impossível agradar-lhe, pois é preciso que quem se aproxima de Deus creia
      que ele existe e que se torna recompensador dos que o procuram.
    status: ia-sem-revisao
  '11:7':
    texto: Pela fé Noé, avisado por Deus sobre coisas ainda não vistas, tomado de santo temor, construiu
      uma arca para a salvação da sua casa; por ela condenou o mundo e tornou-se herdeiro da justiça que
      vem pela fé.
    status: ia-sem-revisao
  '11:8':
    texto: Pela fé Abraão, chamado, obedeceu, partindo para um lugar que devia receber como herança; e
      partiu sem saber para onde ia.
    status: ia-sem-revisao
  '11:9':
    texto: Pela fé peregrinou na terra da promessa como em terra estrangeira, habitando em tendas com
      Isaac e Jacó, co-herdeiros da mesma promessa;
    status: ia-sem-revisao
  '11:10':
    texto: Pois esperava a cidade que tem alicerces, cujo arquiteto e construtor é Deus.
    status: ia-sem-revisao
  '11:11':
    texto: Pela fé também a própria Sara recebeu poder para a concepção, mesmo fora da idade apropriada,
      porque considerou fiel aquele que prometera;
    status: ia-sem-revisao
  '11:12':
    texto: Por isso, de um só, e já como morto, nasceram descendentes tão numerosos como as estrelas do
      céu e como a areia incontável que há na praia do mar.
    status: ia-sem-revisao
  '11:13':
    texto: Na fé morreram todos estes, sem terem recebido as promessas, mas tendo-as visto e saudado de
      longe, e confessado que eram estrangeiros e peregrinos sobre a terra.
    status: ia-sem-revisao
  '11:14':
    texto: Pois os que dizem tais coisas mostram que procuram uma pátria.
    status: ia-sem-revisao
  '11:15':
    texto: E, se se lembrassem daquela de onde saíram, teriam tido oportunidade de voltar;
    status: ia-sem-revisao
  '11:16':
    texto: Mas agora aspiram a uma melhor, isto é, celeste. Por isso Deus não se envergonha deles, de
      ser chamado o Deus deles, pois lhes preparou uma cidade.
    status: ia-sem-revisao
  '11:17':
    texto: Pela fé Abraão, posto à prova, ofereceu Isaac; e oferecia o unigênito aquele que havia recebido
      as promessas,
    status: ia-sem-revisao
  '11:18':
    texto: 'Ao qual foi dito: “Em Isaac será chamada para ti uma descendência”,'
    status: ia-sem-revisao
  '11:19':
    texto: Considerando que Deus é poderoso até para ressuscitar dentre os mortos; daí também, em figura,
      o recuperou.
    status: ia-sem-revisao
  '11:20':
    texto: Pela fé, também a respeito de coisas futuras, Isaac abençoou Jacó e Esaú.
    status: ia-sem-revisao
  '11:21':
    texto: Pela fé Jacó, ao morrer, abençoou cada um dos filhos de José e adorou, apoiado na ponta do
      seu bastão.
    status: ia-sem-revisao
  '11:22':
    texto: Pela fé José, ao morrer, lembrou-se do êxodo dos filhos de Israel e deu ordens sobre os seus
      ossos.
    status: ia-sem-revisao
  '11:23':
    texto: Pela fé Moisés, ao nascer, foi escondido durante três meses pelos seus pais, porque viram que
      a criança era formosa e não temeram o decreto do rei.
    status: ia-sem-revisao
  '11:24':
    texto: Pela fé Moisés, já adulto, recusou ser chamado filho da filha do Faraó,
    status: ia-sem-revisao
  '11:25':
    texto: Preferindo ser maltratado com o povo de Deus a ter o gozo passageiro do pecado,
    status: ia-sem-revisao
  '11:26':
    texto: Considerando o opróbrio de Cristo riqueza maior do que os tesouros do Egito, pois tinha os
      olhos postos na recompensa.
    status: ia-sem-revisao
  '11:27':
    texto: Pela fé deixou o Egito, sem temer a ira do rei, pois perseverou como quem vê o invisível.
    status: ia-sem-revisao
  '11:28':
    texto: Pela fé celebrou a Páscoa e a aspersão do sangue, para que o exterminador dos primogênitos
      não tocasse nos deles.
    status: ia-sem-revisao
  '11:29':
    texto: Pela fé atravessaram o mar Vermelho como por terra seca; os egípcios, tentando o mesmo, foram
      tragados.
    status: ia-sem-revisao
  '11:30':
    texto: Pela fé os muros de Jericó caíram, depois de circundados durante sete dias.
    status: ia-sem-revisao
  '11:31':
    texto: Pela fé Raab, a prostituta, não pereceu com os desobedientes, por ter acolhido em paz os espiões.
    status: ia-sem-revisao
  '11:32':
    texto: E que mais direi? Pois o tempo me faltará se eu narrar o que se refere a Gedeão, Barac, Sansão,
      Jefté, Davi, Samuel e os profetas,
    status: ia-sem-revisao
  '11:33':
    texto: Os quais, pela fé, conquistaram reinos, praticaram a justiça, alcançaram promessas, fecharam
      a boca de leões,
    status: ia-sem-revisao
  '11:34':
    texto: Apagaram a violência do fogo, escaparam do fio da espada, de fracos tornaram-se fortes, mostraram-se
      valentes na guerra, puseram em fuga exércitos estrangeiros;
    status: ia-sem-revisao
  '11:35':
    texto: Mulheres receberam de volta os seus mortos, ressuscitados; outros foram torturados, não aceitando
      a libertação, para alcançarem melhor ressurreição;
    status: ia-sem-revisao
  '11:36':
    texto: Outros sofreram zombarias e açoites, e ainda cadeias e prisão;
    status: ia-sem-revisao
  '11:37':
    texto: Foram apedrejados, serrados, morreram pela espada, andaram errantes com peles de ovelhas, com
      peles de cabras, necessitados, atribulados, maltratados —
    status: ia-sem-revisao
  '11:38':
    texto: Dos quais o mundo não era digno — vagando por desertos, montes, cavernas e covas da terra.
    status: ia-sem-revisao
  '11:39':
    texto: E todos eles, tendo recebido testemunho pela fé, não alcançaram a promessa,
    status: ia-sem-revisao
  '11:40':
    texto: Tendo Deus providenciado algo melhor a nosso respeito, para que sem nós não chegassem à perfeição.
    status: ia-sem-revisao
  '12:1':
    texto: Portanto, também nós, tendo ao redor de nós tão grande nuvem de testemunhas, deixando todo
      peso e o pecado que facilmente nos envolve, corramos com perseverança a corrida que nos é proposta,
    status: ia-sem-revisao
  '12:2':
    texto: Com os olhos fixos em Jesus, autor e consumador da fé, que, em vez da alegria que lhe era proposta,
      suportou a cruz, desprezando a vergonha, e está sentado à direita do trono de Deus.
    status: ia-sem-revisao
  '12:3':
    texto: Considerai, pois, aquele que suportou tal oposição dos pecadores contra si mesmo, para que
      não vos canseis, desfalecendo em vossas almas.
    status: ia-sem-revisao
  '12:4':
    texto: Ainda não resististes até o sangue na luta contra o pecado,
    status: ia-sem-revisao
  '12:5':
    texto: 'E esquecestes a exortação que vos fala como a filhos: “Meu filho, não desprezes a disciplina
      do Senhor, nem desfaleças quando por ele repreendido;'
    status: ia-sem-revisao
  '12:6':
    texto: Pois o Senhor corrige aquele a quem ama e castiga todo filho que acolhe.”
    status: ia-sem-revisao
  '12:7':
    texto: 'Suportai para a disciplina: Deus vos trata como a filhos; pois que filho há a quem o pai não
      corrige?'
    status: ia-sem-revisao
  '12:8':
    texto: Mas, se estais sem a disciplina da qual todos se tornaram participantes, então sois bastardos
      e não filhos.
    status: ia-sem-revisao
  '12:9':
    texto: Além disso, tivemos os pais da nossa carne como educadores e os respeitávamos; não nos submeteremos
      muito mais ao Pai dos espíritos e viveremos?
    status: ia-sem-revisao
  '12:10':
    texto: Pois aqueles nos corrigiam por poucos dias, conforme lhes parecia bem; este, porém, para o
      nosso proveito, para participarmos da sua santidade.
    status: ia-sem-revisao
  '12:11':
    texto: Toda disciplina, no momento, não parece ser de alegria, mas de tristeza; depois, porém, produz
      um fruto pacífico de justiça naqueles que por ela foram exercitados.
    status: ia-sem-revisao
  '12:12':
    texto: Por isso, erguei as mãos cansadas e os joelhos paralisados,
    status: ia-sem-revisao
  '12:13':
    texto: E fazei veredas retas para os vossos pés, para que o que é manco não se desvie, mas antes seja
      curado.
    status: ia-sem-revisao
  '12:14':
    texto: Buscai a paz com todos, e a santificação, sem a qual ninguém verá o Senhor,
    status: ia-sem-revisao
  '12:15':
    texto: Cuidando para que ninguém fique privado da graça de Deus, para que nenhuma raiz de amargura,
      brotando, vos perturbe e por ela muitos sejam contaminados,
    status: ia-sem-revisao
  '12:16':
    texto: Para que não haja algum devasso ou profano como Esaú, que por um só alimento vendeu o seu direito
      de primogenitura.
    status: ia-sem-revisao
  '12:17':
    texto: Pois sabeis que, depois, querendo herdar a bênção, foi rejeitado, pois não encontrou lugar
      para o arrependimento, embora o tenha procurado com lágrimas.
    status: ia-sem-revisao
  '12:18':
    texto: Pois não vos aproximastes de algo palpável, de fogo ardente, de escuridão, de trevas, de tempestade,
    status: ia-sem-revisao
  '12:19':
    texto: De som de trombeta e de voz de palavras; os que a ouviram pediram que não lhes fosse acrescentada
      nenhuma palavra;
    status: ia-sem-revisao
  '12:20':
    texto: 'Pois não suportavam a ordem: “Mesmo que um animal toque o monte, será apedrejado.”'
    status: ia-sem-revisao
  '12:21':
    texto: 'E, tão terrível era o que se via, que Moisés disse: “Estou aterrorizado e trêmulo.”'
    status: ia-sem-revisao
  '12:22':
    texto: Vós, porém, vos aproximastes do monte Sião e da cidade do Deus vivo, a Jerusalém celeste, e
      de miríades de anjos, em festiva assembleia,
    status: ia-sem-revisao
  '12:23':
    texto: E da igreja dos primogênitos inscritos nos céus, e de Deus, juiz de todos, e dos espíritos
      dos justos levados à perfeição,
    status: ia-sem-revisao
  '12:24':
    texto: E de Jesus, mediador de uma nova aliança, e do sangue da aspersão, que fala melhor do que o
      de Abel.
    partes:
    - E de Jesus, mediador de uma nova aliança,
    - e do sangue da aspersão, que fala melhor do que o de Abel.
    status: ia-sem-revisao
  '12:25':
    texto: Vede que não recuseis aquele que fala; pois, se aqueles não escaparam, tendo recusado aquele
      que os advertia na terra, muito mais nós, se nos afastarmos daquele que fala dos céus;
    status: ia-sem-revisao
  '12:26':
    texto: 'A sua voz abalou então a terra, mas agora prometeu, dizendo: “Ainda uma vez abalarei não só
      a terra, mas também o céu.”'
    status: ia-sem-revisao
  '12:27':
    texto: E este “ainda uma vez” indica a mudança das coisas abaladas, como coisas criadas, para que
      permaneçam as não abaladas.
    status: ia-sem-revisao
  '12:28':
    texto: Por isso, recebendo um reino inabalável, conservemos a graça, pela qual prestemos culto agradável
      a Deus, com reverência e temor,
    status: ia-sem-revisao
  '12:29':
    texto: Pois o nosso Deus é fogo devorador.
    status: ia-sem-revisao
  '13:1':
    texto: Permaneça o amor fraterno.
    status: ia-sem-revisao
  '13:2':
    texto: Não vos esqueçais da hospitalidade, pois por ela alguns hospedaram anjos sem o saber.
    status: ia-sem-revisao
  '13:3':
    texto: Lembrai-vos dos presos como se estivésseis presos com eles, dos maltratados como sendo vós
      mesmos também de corpo.
    status: ia-sem-revisao
  '13:4':
    texto: Seja honrado por todos o matrimônio, e o leito sem mancha; pois Deus julgará os devassos e
      os adúlteros.
    status: ia-sem-revisao
  '13:5':
    texto: 'Seja o vosso modo de viver sem avareza; contentai-vos com o que tendes; pois ele mesmo disse:
      “De modo algum te deixarei, nem de modo algum te abandonarei”;'
    status: ia-sem-revisao
  '13:6':
    texto: 'De modo que, confiantes, digamos: “O Senhor é o meu auxílio, não temerei; que me fará o homem?”'
    status: ia-sem-revisao
  '13:7':
    texto: Lembrai-vos dos vossos guias, que vos falaram a palavra de Deus; considerando o desfecho da
      sua vida, imitai a sua fé.
    status: ia-sem-revisao
  '13:8':
    texto: Jesus Cristo é o mesmo ontem, hoje e para sempre.
    status: ia-sem-revisao
  '13:9':
    texto: Não vos deixeis levar por ensinamentos variados e estranhos; pois é bom que o coração seja
      fortalecido pela graça, não por alimentos, dos quais nada aproveitaram os que os seguiram.
    status: ia-sem-revisao
  '13:10':
    texto: Temos um altar do qual não têm direito de comer os que servem à tenda.
    status: ia-sem-revisao
  '13:11':
    texto: Pois os corpos dos animais cujo sangue é levado ao santuário pelo sumo sacerdote pelo pecado
      são queimados fora do acampamento;
    status: ia-sem-revisao
  '13:12':
    texto: Por isso também Jesus, para santificar o povo por meio do seu próprio sangue, sofreu fora da
      porta.
    status: ia-sem-revisao
  '13:13':
    texto: Saiamos, pois, a ele, fora do acampamento, levando o seu opróbrio.
    status: ia-sem-revisao
  '13:14':
    texto: Pois não temos aqui uma cidade permanente, mas buscamos a que há de vir;
    status: ia-sem-revisao
  '13:15':
    texto: Por meio dele, pois, ofereçamos continuamente a Deus um sacrifício de louvor, isto é, o fruto
      de lábios que confessam o seu nome.
    status: ia-sem-revisao
  '13:16':
    texto: Não vos esqueçais da beneficência e da partilha, pois com tais sacrifícios Deus se agrada.
    status: ia-sem-revisao
  '13:17':
    texto: Obedecei aos vossos guias e sede-lhes submissos, pois eles velam sobre as vossas almas, como
      quem há de prestar contas, para que o façam com alegria e não gemendo, pois isso não vos seria útil.
    status: ia-sem-revisao
  '13:18':
    texto: Orai por nós, pois estamos persuadidos de que temos boa consciência, querendo em tudo viver
      bem.
    status: ia-sem-revisao
  '13:19':
    texto: Peço-vos com mais insistência que o façais, para que eu vos seja restituído mais depressa.
    status: ia-sem-revisao
  '13:20':
    texto: O Deus da paz, que fez subir dentre os mortos o grande pastor das ovelhas, pelo sangue de uma
      aliança eterna, nosso Senhor Jesus,
    status: ia-sem-revisao
  '13:21':
    texto: Vos torne aptos em todo bem para fazer a sua vontade, realizando em nós o que lhe é agradável,
      por meio de Jesus Cristo, a quem seja a glória pelos séculos. Amém.
    status: ia-sem-revisao
  '13:22':
    texto: Peço-vos, irmãos, que suporteis a palavra de exortação, pois escrevi-vos de modo breve.
    status: ia-sem-revisao
  '13:23':
    texto: Sabei que o nosso irmão Timóteo foi libertado; com ele, se vier logo, vos verei.
    status: ia-sem-revisao
  '13:24':
    texto: Saudai todos os vossos guias e todos os santos. Saúdam-vos os da Itália.
    status: ia-sem-revisao
  '13:25':
    texto: A graça esteja com todos vós.
    status: ia-sem-revisao
