livro: 1TI
fonte: sblgnt
versiculos:
  '1:1':
    texto: Paulo, apóstolo de Cristo Jesus por ordem de Deus, nosso Salvador, e de Cristo Jesus, nossa
      esperança,
    status: ia-sem-revisao
  '1:2':
    texto: 'a Timóteo, verdadeiro filho na fé: graça, misericórdia e paz da parte de Deus Pai e de Cristo
      Jesus, nosso Senhor.'
    status: ia-sem-revisao
  '1:3':
    texto: Como te pedi, ao partir para a Macedônia, que permanecesses em Éfeso, a fim de ordenares a
      certas pessoas que não ensinem doutrinas diferentes
    status: ia-sem-revisao
  '1:4':
    texto: nem se ocupem de fábulas e genealogias intermináveis, que suscitam disputas, mais do que o
      plano de Deus, que se realiza na fé —
    status: ia-sem-revisao
  '1:5':
    texto: O fim da recomendação é o amor que vem de um coração puro, de uma boa consciência e de uma
      fé sem fingimento.
    status: ia-sem-revisao
  '1:6':
    texto: Alguns, tendo se desviado destas coisas, perderam-se em conversas vãs,
    status: ia-sem-revisao
  '1:7':
    texto: querendo ser doutores da Lei, sem entender nem o que dizem nem aquilo que afirmam com tanta
      segurança.
    status: ia-sem-revisao
  '1:8':
    texto: Sabemos que a Lei é boa, se alguém dela se serve legitimamente,
    status: ia-sem-revisao
  '1:9':
    texto: 'sabendo isto: que a Lei não foi feita para o justo, mas para os sem lei e rebeldes, os ímpios
      e pecadores, os irreligiosos e profanos, os parricidas e matricidas, os homicidas,'
    status: ia-sem-revisao
  '1:10':
    texto: os impuros, os sodomitas, os raptores de homens, os mentirosos, os perjuros e tudo o que se
      opõe à sã doutrina,
    status: ia-sem-revisao
  '1:11':
    texto: segundo o Evangelho da glória do Deus bendito, que me foi confiado.
    status: ia-sem-revisao
  '1:12':
    texto: Dou graças àquele que me deu forças, Cristo Jesus, nosso Senhor, porque me julgou fiel, colocando-me
      no ministério,
    status: ia-sem-revisao
  '1:13':
    texto: a mim, que antes fui blasfemo, perseguidor e insolente; mas alcancei misericórdia, porque agi
      por ignorância, na incredulidade;
    status: ia-sem-revisao
  '1:14':
    texto: e superabundou a graça de nosso Senhor, com a fé e o amor que há em Cristo Jesus.
    status: ia-sem-revisao
  '1:15':
    texto: 'Fiel é esta palavra e digna de toda aceitação: Cristo Jesus veio ao mundo para salvar os pecadores,
      dos quais eu sou o primeiro;'
    status: ia-sem-revisao
  '1:16':
    texto: mas por isso alcancei misericórdia, para que em mim, o primeiro, Cristo Jesus mostrasse toda
      a sua longanimidade, como exemplo para os que haviam de crer nele para a vida eterna.
    status: ia-sem-revisao
  '1:17':
    texto: Ao Rei dos séculos, incorruptível, invisível, Deus único, honra e glória pelos séculos dos
      séculos. Amém.
    status: ia-sem-revisao
  '1:18':
    texto: Confio-te esta recomendação, filho Timóteo, de acordo com as profecias que antes foram feitas
      a teu respeito, para que nelas combatas o bom combate,
    status: ia-sem-revisao
  '1:19':
    texto: mantendo a fé e a boa consciência, que alguns rejeitaram e naufragaram na fé;
    status: ia-sem-revisao
  '1:20':
    texto: entre eles estão Himeneu e Alexandre, que entreguei a Satanás para aprenderem a não blasfemar.
    status: ia-sem-revisao
  '2:1':
    texto: Recomendo, pois, antes de tudo, que se façam súplicas, orações, intercessões e ações de graças
      por todos os homens,
    status: ia-sem-revisao
  '2:2':
    texto: pelos reis e por todos os que estão em autoridade, para que levemos uma vida tranquila e serena,
      com toda piedade e dignidade.
    status: ia-sem-revisao
  '2:3':
    texto: Isto é bom e agradável diante de Deus, nosso Salvador,
    status: ia-sem-revisao
  '2:4':
    texto: que quer que todos os homens sejam salvos e cheguem ao conhecimento da verdade.
    status: ia-sem-revisao
  '2:5':
    texto: Pois há um só Deus e um só mediador entre Deus e os homens, o homem Cristo Jesus,
    status: ia-sem-revisao
  '2:6':
    texto: 'que se entregou a si mesmo em resgate por todos: testemunho dado no tempo oportuno.'
    status: ia-sem-revisao
  '2:7':
    texto: Para isto fui constituído pregador e apóstolo — digo a verdade, não minto —, mestre das nações
      na fé e na verdade.
    status: ia-sem-revisao
  '2:8':
    texto: Quero, pois, que os homens orem em todo lugar, erguendo mãos santas, sem ira nem discussão.
    status: ia-sem-revisao
  '2:9':
    texto: Do mesmo modo, que as mulheres, com traje decoroso, se enfeitem com pudor e moderação, não
      com tranças e ouro, ou pérolas, ou vestes custosas,
    status: ia-sem-revisao
  '2:10':
    texto: mas, como convém a mulheres que professam a piedade, com boas obras.
    status: ia-sem-revisao
  '2:11':
    texto: A mulher aprenda em silêncio, com toda submissão.
    status: ia-sem-revisao
  '2:12':
    texto: Não permito que a mulher ensine, nem que tenha autoridade sobre o homem, mas que permaneça
      em silêncio.
    status: ia-sem-revisao
  '2:13':
    texto: Pois Adão foi formado primeiro, depois Eva;
    status: ia-sem-revisao
  '2:14':
    texto: e Adão não foi enganado, mas a mulher, enganada, caiu em transgressão.
    status: ia-sem-revisao
  '2:15':
    texto: Será salva, porém, pela maternidade, se permanecerem na fé, no amor e na santificação, com
      sensatez.
    status: ia-sem-revisao
  '3:1':
    texto: 'Fiel é esta palavra: se alguém aspira ao episcopado, deseja uma boa obra.'
    status: ia-sem-revisao
  '3:2':
    texto: É preciso, pois, que o bispo seja irrepreensível, marido de uma só mulher, sóbrio, prudente,
      digno, hospitaleiro, capaz de ensinar,
    status: ia-sem-revisao
  '3:3':
    texto: não dado ao vinho, não violento, mas amável, pacífico, desinteressado do dinheiro,
    status: ia-sem-revisao
  '3:4':
    texto: que governe bem a sua própria casa e mantenha os filhos na obediência, com toda dignidade;
    status: ia-sem-revisao
  '3:5':
    texto: (Pois, se alguém não sabe governar a sua própria casa, como cuidará da Igreja de Deus?)
    status: ia-sem-revisao
  '3:6':
    texto: Que não seja recém-convertido, para que, ensoberbecendo-se, não caia na condenação do diabo.
    status: ia-sem-revisao
  '3:7':
    texto: É preciso também que tenha boa fama junto aos de fora, para não cair em descrédito e no laço
      do diabo.
    status: ia-sem-revisao
  '3:8':
    texto: Os diáconos, do mesmo modo, sejam dignos, de uma só palavra, não dados a muito vinho, não ávidos
      de lucro desonesto,
    status: ia-sem-revisao
  '3:9':
    texto: guardando o mistério da fé em consciência pura.
    status: ia-sem-revisao
  '3:10':
    texto: Também estes sejam provados primeiro; depois, se forem irrepreensíveis, exerçam o diaconato.
    status: ia-sem-revisao
  '3:11':
    texto: As mulheres, do mesmo modo, sejam dignas, não maldizentes, sóbrias, fiéis em tudo.
    status: ia-sem-revisao
  '3:12':
    texto: Os diáconos sejam maridos de uma só mulher, que governem bem os filhos e as suas próprias casas;
    status: ia-sem-revisao
  '3:13':
    texto: pois os que exercem bem o diaconato adquirem para si um bom grau e grande liberdade na fé em
      Cristo Jesus.
    status: ia-sem-revisao
  '3:14':
    texto: Escrevo-te estas coisas, esperando ir ter contigo em breve,
    status: ia-sem-revisao
  '3:15':
    texto: mas, caso me demore, para que saibas como proceder na casa de Deus, que é a Igreja do Deus
      vivo, coluna e sustentáculo da verdade.
    status: ia-sem-revisao
  '3:16':
    texto: 'E, sem dúvida, grande é o mistério da piedade: Aquele que se manifestou na carne, foi justificado
      no Espírito, apareceu aos anjos, foi proclamado entre as nações, foi crido no mundo, foi elevado
      em glória.'
    status: ia-sem-revisao
    observacao: O SBLGNT traz “Aquele que” (ὅς); a Nova Vulgata traz “O que”, em referência ao mistério.
      Aqui segue-se o SBLGNT.
  '4:1':
    texto: O Espírito diz expressamente que, nos últimos tempos, alguns abandonarão a fé, prestando atenção
      a espíritos enganadores e a doutrinas de demônios,
    status: ia-sem-revisao
  '4:2':
    texto: pela hipocrisia de mentirosos, marcados a ferro na sua própria consciência,
    status: ia-sem-revisao
  '4:3':
    texto: que proíbem o casamento e mandam abster-se de alimentos que Deus criou para serem recebidos
      com ação de graças pelos fiéis e por aqueles que conhecem a verdade.
    status: ia-sem-revisao
  '4:4':
    texto: Pois toda criatura de Deus é boa, e nada é de rejeitar quando recebido com ação de graças,
    status: ia-sem-revisao
  '4:5':
    texto: porque é santificado pela palavra de Deus e pela oração.
    status: ia-sem-revisao
  '4:6':
    texto: Expondo estas coisas aos irmãos, serás um bom ministro de Cristo Jesus, alimentado com as palavras
      da fé e da boa doutrina que seguiste.
    status: ia-sem-revisao
  '4:7':
    texto: Evita as fábulas profanas e de velhas; exercita-te, porém, na piedade;
    status: ia-sem-revisao
  '4:8':
    texto: pois o exercício corporal é útil por pouco, mas a piedade é útil para tudo, tendo a promessa
      da vida presente e da futura.
    status: ia-sem-revisao
  '4:9':
    texto: Fiel é esta palavra e digna de toda aceitação,
    status: ia-sem-revisao
  '4:10':
    texto: 'pois para isto nos fatigamos e somos injuriados: porque pusemos a esperança no Deus vivo,
      que é Salvador de todos os homens, sobretudo dos fiéis.'
    status: ia-sem-revisao
  '4:11':
    texto: Ordena estas coisas e ensina-as.
    status: ia-sem-revisao
  '4:12':
    texto: Ninguém despreze a tua juventude, mas sê modelo para os fiéis na palavra, na conduta, no amor,
      na fé, na pureza.
    status: ia-sem-revisao
  '4:13':
    texto: Até que eu chegue, dedica-te à leitura, à exortação, ao ensino.
    status: ia-sem-revisao
  '4:14':
    texto: Não negligencies o dom que há em ti, que te foi dado por profecia, com a imposição das mãos
      do colégio dos presbíteros.
    status: ia-sem-revisao
  '4:15':
    texto: Medita nestas coisas, vive nelas, para que o teu progresso seja manifesto a todos.
    status: ia-sem-revisao
  '4:16':
    texto: Cuida de ti mesmo e do ensino; persevera nisto; pois, fazendo-o, salvarás a ti mesmo e os que
      te ouvem.
    status: ia-sem-revisao
  '5:1':
    texto: Não repreendas com dureza o ancião, mas exorta-o como a um pai; os jovens, como a irmãos;
    status: ia-sem-revisao
  '5:2':
    texto: as idosas, como a mães; as jovens, como a irmãs, com toda pureza.
    status: ia-sem-revisao
  '5:3':
    texto: Honra as viúvas que são verdadeiramente viúvas.
    status: ia-sem-revisao
  '5:4':
    texto: Se uma viúva tem filhos ou netos, aprendam estes primeiro a ter piedade para com a própria
      família e a retribuir aos seus ascendentes, pois isto é agradável diante de Deus.
    status: ia-sem-revisao
  '5:5':
    texto: A que é verdadeiramente viúva e ficou sozinha pôs a esperança em Deus e persevera em súplicas
      e orações noite e dia;
    status: ia-sem-revisao
  '5:6':
    texto: mas a que vive entregue aos prazeres, ainda que viva, está morta.
    status: ia-sem-revisao
  '5:7':
    texto: Ordena também estas coisas, para que sejam irrepreensíveis.
    status: ia-sem-revisao
  '5:8':
    texto: Se alguém não cuida dos seus, sobretudo dos de casa, renegou a fé e é pior que um infiel.
    status: ia-sem-revisao
  '5:9':
    texto: Seja inscrita como viúva a que tiver pelo menos sessenta anos, mulher de um só marido,
    status: ia-sem-revisao
  '5:10':
    texto: 'que tenha o testemunho de boas obras: se criou filhos, se exerceu a hospitalidade, se lavou
      os pés dos santos, se socorreu os atribulados, se se dedicou a toda boa obra.'
    status: ia-sem-revisao
  '5:11':
    texto: Recusa as viúvas mais jovens; pois, quando se deixam levar por desejos contrários a Cristo,
      querem casar-se,
    status: ia-sem-revisao
  '5:12':
    texto: incorrendo em condenação por terem violado o primeiro compromisso.
    status: ia-sem-revisao
  '5:13':
    texto: Ao mesmo tempo, aprendem a ser ociosas, andando de casa em casa; e não só ociosas, mas também
      faladoras e curiosas, dizendo o que não convém.
    status: ia-sem-revisao
  '5:14':
    texto: Quero, pois, que as jovens se casem, tenham filhos, governem a casa e não deem ao adversário
      nenhuma ocasião de maledicência;
    status: ia-sem-revisao
  '5:15':
    texto: pois algumas já se desviaram para seguir Satanás.
    status: ia-sem-revisao
  '5:16':
    texto: Se alguma fiel tem viúvas, ampare-as, e não seja sobrecarregada a Igreja, para que possa amparar
      as que são verdadeiramente viúvas.
    status: ia-sem-revisao
  '5:17':
    texto: Os presbíteros que presidem bem sejam considerados dignos de dupla honra, sobretudo os que
      se afadigam na palavra e no ensino;
    status: ia-sem-revisao
  '5:18':
    texto: 'pois a Escritura diz: “Não amordaçarás o boi que debulha”, e: “O trabalhador é digno do seu
      salário.”'
    status: ia-sem-revisao
  '5:19':
    texto: Não aceites acusação contra um presbítero, a não ser com duas ou três testemunhas;
    status: ia-sem-revisao
  '5:20':
    texto: os que pecam repreende-os diante de todos, para que os demais também tenham temor.
    status: ia-sem-revisao
  '5:21':
    texto: Conjuro-te diante de Deus, de Cristo Jesus e dos anjos eleitos que observes estas coisas sem
      prevenção, nada fazendo por parcialidade.
    status: ia-sem-revisao
  '5:22':
    texto: Não imponhas as mãos a ninguém precipitadamente, nem participes dos pecados alheios; conserva-te
      puro.
    status: ia-sem-revisao
  '5:23':
    texto: Não bebas mais só água, mas usa um pouco de vinho, por causa do teu estômago e das tuas frequentes
      enfermidades.
    status: ia-sem-revisao
  '5:24':
    texto: Os pecados de alguns homens são manifestos, precedendo-os ao julgamento; os de outros os seguem;
    status: ia-sem-revisao
  '5:25':
    texto: do mesmo modo, também as boas obras são manifestas, e as que não o são não podem ficar ocultas.
    status: ia-sem-revisao
  '6:1':
    texto: Todos os que estão sob o jugo como escravos considerem os seus senhores dignos de toda honra,
      para que não sejam blasfemados o nome de Deus e a doutrina.
    status: ia-sem-revisao
  '6:2':
    texto: Os que têm senhores fiéis não os desprezem por serem irmãos; antes, sirvam-nos ainda melhor,
      porque são fiéis e amados os que recebem o benefício. Ensina e exorta estas coisas.
    status: ia-sem-revisao
  '6:3':
    texto: Se alguém ensina doutrina diferente e não se atém às sãs palavras, as de nosso Senhor Jesus
      Cristo, e à doutrina conforme a piedade,
    status: ia-sem-revisao
  '6:4':
    texto: está enfatuado, nada sabendo, mas doente por questões e disputas de palavras, das quais nascem
      inveja, discórdia, blasfêmias, suspeitas más,
    status: ia-sem-revisao
  '6:5':
    texto: contendas contínuas de homens de mente corrompida e privados da verdade, que julgam que a piedade
      é fonte de lucro.
    status: ia-sem-revisao
  '6:6':
    texto: A piedade, porém, com o contentamento, é grande fonte de lucro;
    status: ia-sem-revisao
  '6:7':
    texto: pois nada trouxemos ao mundo, e é claro que nada podemos levar dele;
    status: ia-sem-revisao
  '6:8':
    texto: tendo alimento e vestuário, estaremos contentes com isso.
    status: ia-sem-revisao
  '6:9':
    texto: Os que querem enriquecer caem em tentação, em laço e em muitos desejos insensatos e nocivos,
      que mergulham os homens na ruína e na perdição;
    status: ia-sem-revisao
  '6:10':
    texto: pois a raiz de todos os males é o amor ao dinheiro, e alguns, por se terem entregado a ele,
      se desviaram da fé e se atormentaram com muitas dores.
    status: ia-sem-revisao
  '6:11':
    texto: Tu, porém, ó homem de Deus, foge destas coisas; busca a justiça, a piedade, a fé, o amor, a
      perseverança, a mansidão.
    status: ia-sem-revisao
  '6:12':
    texto: Combate o bom combate da fé, conquista a vida eterna, para a qual foste chamado e fizeste a
      boa profissão de fé diante de muitas testemunhas.
    status: ia-sem-revisao
  '6:13':
    texto: Ordeno-te, diante de Deus, que dá vida a todas as coisas, e de Cristo Jesus, que deu o bom
      testemunho diante de Pôncio Pilatos,
    status: ia-sem-revisao
  '6:14':
    texto: que guardes o mandamento sem mancha e irrepreensível até a manifestação de nosso Senhor Jesus
      Cristo,
    status: ia-sem-revisao
  '6:15':
    texto: a qual, a seu tempo, mostrará o bem-aventurado e único Soberano, o Rei dos que reinam e Senhor
      dos que dominam,
    status: ia-sem-revisao
  '6:16':
    texto: o único que possui a imortalidade, que habita em luz inacessível, a quem nenhum dos homens
      viu nem pode ver; a ele a honra e o poder eterno. Amém.
    status: ia-sem-revisao
  '6:17':
    texto: Aos ricos deste mundo, ordena que não sejam orgulhosos nem ponham a esperança na incerteza
      da riqueza, mas em Deus, que nos dá tudo em abundância para o nosso usufruto;
    status: ia-sem-revisao
  '6:18':
    texto: que pratiquem o bem, sejam ricos em boas obras, generosos, dispostos a partilhar,
    status: ia-sem-revisao
  '6:19':
    texto: entesourando para si um bom fundamento para o futuro, a fim de alcançarem a verdadeira vida.
    status: ia-sem-revisao
  '6:20':
    texto: Ó Timóteo, guarda o depósito, evitando as conversas vãs e profanas e as objeções da falsamente
      chamada ciência,
    status: ia-sem-revisao
  '6:21':
    texto: que alguns professaram e se desviaram da fé. A graça esteja convosco.
    status: ia-sem-revisao
