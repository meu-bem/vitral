livro: 1MA
fonte: clementina
versiculos:
  '1:10':
    texto: e todos eles puseram diademas depois da sua morte, e seus filhos depois deles por muitos anos;
      e multiplicaram-se os males sobre a terra.
    status: ia-sem-revisao
    observacao: Livro deuterocanônico, traduzido do latim (Clementina).
  '1:11':
    texto: Dentre eles saiu uma raiz pecadora, Antíoco Epifânio, filho do rei Antíoco, que fora refém
      em Roma; e reinou no ano cento e trinta e sete do reino dos gregos.
    status: ia-sem-revisao
  '1:12':
    texto: 'Naqueles dias saíram de Israel filhos iníquos, que persuadiram a muitos, dizendo: “Vamos e
      façamos aliança com as nações que estão ao nosso redor, porque, desde que nos separamos delas, muitos
      males nos sobrevieram.”'
    status: ia-sem-revisao
  '1:13':
    texto: E esta palavra pareceu boa aos olhos deles.
    status: ia-sem-revisao
  '1:14':
    texto: Alguns do povo se decidiram e foram ao rei, que lhes deu poder para praticarem as normas das
      nações.
    status: ia-sem-revisao
  '1:15':
    texto: Construíram um ginásio em Jerusalém segundo os costumes das nações,
    status: ia-sem-revisao
  '1:41':
    texto: O seu santuário ficou desolado como um deserto; os seus dias de festa converteram-se em luto,
      os seus sábados em opróbrio, as suas honras em nada.
    status: ia-sem-revisao
  '1:42':
    texto: A sua ignomínia multiplicou-se segundo a sua glória, e a sua sublimidade converteu-se em luto.
    status: ia-sem-revisao
  '1:43':
    texto: O rei Antíoco escreveu a todo o seu reino que todos fossem um só povo e que cada um abandonasse
      a sua lei.
    status: ia-sem-revisao
  '1:54':
    texto: E ordenaram às cidades de Judá que sacrificassem.
    status: ia-sem-revisao
  '1:55':
    texto: 'Muitos do povo se juntaram aos que tinham abandonado a lei do Senhor e fizeram o mal sobre
      a terra:'
    status: ia-sem-revisao
  '1:56':
    texto: expulsaram o povo de Israel para lugares escondidos e ocultos, lugares de refúgio dos fugitivos.
    status: ia-sem-revisao
  '1:57':
    texto: 'No décimo quinto dia do mês de Casleu, no ano cento e quarenta e cinco, o rei Antíoco erigiu
      o abominável ídolo da desolação sobre o altar de Deus, e por todas as cidades de Judá, ao redor,
      construíram altares:'
    status: ia-sem-revisao
  1:62:
    texto: No vigésimo quinto dia do mês sacrificavam sobre o altar que estava diante do altar de Deus.
    status: ia-sem-revisao
  1:63:
    texto: As mulheres que circuncidavam os seus filhos eram executadas, por ordem do rei Antíoco,
    status: ia-sem-revisao
  1:64:
    texto: e penduravam os meninos pelo pescoço, por todas as suas casas, e matavam os que os tinham circuncidado.
    status: ia-sem-revisao
  '2:15':
    texto: Chegaram ali os enviados pelo rei Antíoco para obrigar os que se tinham refugiado na cidade
      de Modin a sacrificar, queimar incenso e abandonar a lei de Deus.
    status: ia-sem-revisao
  '2:16':
    texto: Muitos do povo de Israel consentiram e se aproximaram deles, mas Matatias e os seus filhos
      permaneceram firmes.
    status: ia-sem-revisao
  '2:17':
    texto: 'Os enviados de Antíoco disseram a Matatias: “Tu és chefe, ilustre e grande nesta cidade, e
      adornado de filhos e irmãos;'
    status: ia-sem-revisao
  '2:18':
    texto: aproxima-te, pois, primeiro, e cumpre a ordem do rei, como fizeram todas as nações, os homens
      de Judá e os que restaram em Jerusalém; e serás tu, com os teus filhos, dos amigos do rei, enriquecido
      com ouro, prata e muitos presentes.”
    status: ia-sem-revisao
  '2:19':
    texto: 'Matatias respondeu em alta voz: “Ainda que todas as nações obedeçam ao rei Antíoco, de modo
      que cada um se afaste da servidão da lei de seus pais e consinta nas ordens dele,'
    status: ia-sem-revisao
  '2:20':
    texto: eu, os meus filhos e os meus irmãos obedeceremos à lei de nossos pais.
    status: ia-sem-revisao
  '2:21':
    texto: 'Deus nos seja propício: não nos convém abandonar a lei e os preceitos de Deus.'
    status: ia-sem-revisao
  '2:22':
    texto: Não ouviremos as palavras do rei Antíoco, nem sacrificaremos, transgredindo os mandamentos
      da nossa lei, para seguir outro caminho.”
    status: ia-sem-revisao
  '2:23':
    texto: Quando ele acabou de dizer essas palavras, aproximou-se um judeu, à vista de todos, para sacrificar
      aos ídolos sobre o altar na cidade de Modin, conforme a ordem do rei.
    status: ia-sem-revisao
  '2:24':
    texto: Matatias viu, e se doeu, e estremeceram-lhe as entranhas, e a sua ira se inflamou segundo o
      juízo da lei; correndo, matou-o sobre o altar.
    status: ia-sem-revisao
  '2:25':
    texto: Matou também, naquele mesmo momento, o homem que o rei Antíoco enviara para obrigar a sacrificar,
      e destruiu o altar.
    status: ia-sem-revisao
  '2:26':
    texto: Teve zelo pela lei, como fez Finéias com Zambri, filho de Salomi.
    status: ia-sem-revisao
  '2:27':
    texto: 'Matatias gritou em alta voz na cidade: “Todo aquele que tem zelo pela lei e mantém a aliança,
      saia atrás de mim.”'
    status: ia-sem-revisao
  '2:28':
    texto: Fugiu ele e os seus filhos para os montes, e deixaram na cidade tudo o que tinham.
    status: ia-sem-revisao
  '2:29':
    texto: Então muitos que buscavam o direito e a justiça desceram ao deserto,
    status: ia-sem-revisao
  '4:36':
    texto: 'Judas e os seus irmãos disseram: “Eis que os nossos inimigos foram esmagados; subamos agora
      para purificar e renovar o santuário.”'
    status: ia-sem-revisao
  '4:37':
    texto: Todo o exército se reuniu, e subiram ao monte Sião.
    status: ia-sem-revisao
  '4:52':
    texto: Levantaram-se antes da manhã, no vigésimo quinto dia do nono mês (que é o mês de Casleu), do
      ano cento e quarenta e oito,
    status: ia-sem-revisao
  '4:53':
    texto: e ofereceram o sacrifício, segundo a lei, sobre o novo altar dos holocaustos que tinham feito.
    status: ia-sem-revisao
  '4:54':
    texto: No tempo e no dia em que as nações o tinham profanado, nesse mesmo foi renovado, entre cânticos,
      cítaras, harpas e címbalos.
    status: ia-sem-revisao
  '4:55':
    texto: Todo o povo caiu de rosto em terra, adorou e bendisse ao céu aquele que lhes dera prosperidade.
    status: ia-sem-revisao
  '4:56':
    texto: Celebraram a dedicação do altar durante oito dias e ofereceram holocaustos com alegria, e sacrifício
      de salvação e de louvor.
    status: ia-sem-revisao
  '4:57':
    texto: Ornaram a fachada do templo com coroas de ouro e escudos, renovaram as portas e as câmaras
      e lhes puseram portas.
    status: ia-sem-revisao
  '4:58':
    texto: Houve grande alegria no povo, e foi afastado o opróbrio das nações.
    status: ia-sem-revisao
  '4:59':
    texto: Judas, os seus irmãos e toda a assembleia de Israel estabeleceram que o dia da dedicação do
      altar se celebrasse em seu tempo, de ano em ano, durante oito dias, a partir do vigésimo quinto
      dia do mês de Casleu, com alegria e júbilo.
    status: ia-sem-revisao
  '6:1':
    texto: O rei Antíoco percorria as regiões superiores e ouviu dizer que havia na Pérsia uma cidade,
      Elimaida, muito famosa e rica em prata e ouro,
    status: ia-sem-revisao
  '6:2':
    texto: e que nela havia um templo muito rico, com véus de ouro, couraças e escudos que ali deixara
      Alexandre, filho de Filipe, rei da Macedônia, o primeiro que reinou na Grécia.
    status: ia-sem-revisao
  '6:3':
    texto: Foi e procurou tomar a cidade e saqueá-la, mas não pôde, porque o plano foi conhecido pelos
      que estavam na cidade;
    status: ia-sem-revisao
  '6:4':
    texto: levantaram-se para o combate, e ele fugiu dali e partiu com grande tristeza, voltando à Babilônia.
    status: ia-sem-revisao
  '6:5':
    texto: Veio alguém anunciar-lhe, na Pérsia, que os exércitos que estavam na terra de Judá tinham sido
      postos em fuga,
    status: ia-sem-revisao
  '6:6':
    texto: que Lísias, que tinha partido com um exército muito forte, fora posto em fuga diante dos judeus,
      e que estes tinham se fortalecido com armas, forças e muitos despojos que tomaram dos exércitos
      que derrotaram,
    status: ia-sem-revisao
  '6:7':
    texto: que tinham destruído a abominação que ele edificara sobre o altar de Jerusalém, e tinham cercado
      de altos muros o santuário, como antes, e também Betsura, a sua cidade.
    status: ia-sem-revisao
  '6:8':
    texto: Quando o rei ouviu essas palavras, ficou assustado e muito abalado; caiu na cama e adoeceu
      de tristeza, porque não lhe aconteceu como pensava.
    status: ia-sem-revisao
  '6:9':
    texto: Ficou ali por muitos dias, porque nele se renovou uma grande tristeza, e julgou que ia morrer.
    status: ia-sem-revisao
  '6:10':
    texto: 'Chamou todos os seus amigos e lhes disse: “O sono fugiu dos meus olhos, e desfaleci e caí
      em ânimo por causa da inquietação.'
    status: ia-sem-revisao
  '6:11':
    texto: 'Disse no meu coração: ‘Em que tribulação cheguei e em que ondas de tristeza me encontro agora,
      eu que era feliz e amado no meu poder!’'
    status: ia-sem-revisao
  '6:12':
    texto: Agora, porém, recordo os males que fiz em Jerusalém, de onde tirei todos os despojos de ouro
      e prata que havia nela, e mandei exterminar sem motivo os habitantes de Judá.
    status: ia-sem-revisao
  '6:13':
    texto: Reconheço, pois, que por isso me sobrevieram estes males; e eis que morro de grande tristeza
      em terra estrangeira.”
    status: ia-sem-revisao
