livro: TOB
fonte: clementina
versiculos:
  '1:1':
    texto: Tobias, da tribo e da cidade de Neftali (que fica na parte alta da Galileia, acima de Naasson,
      depois do caminho que leva ao ocidente, tendo à esquerda a cidade de Safete),
    partes:
    - Tobias, da tribo e da cidade de Neftali
    - (que fica na parte alta da Galileia, acima de Naasson, depois do caminho que leva ao ocidente, tendo
      à esquerda a cidade de Safete),
    status: ia-sem-revisao
    observacao: 'Livro deuterocanônico, traduzido do latim (Clementina). partes: divisão pela pontuação
      e pelo sentido; a do Lecionário pode diferir.'
  '1:2':
    texto: tendo sido levado cativo nos dias de Salmanasar, rei dos assírios, nem por isso, posto no cativeiro,
      abandonou o caminho da verdade,
    status: ia-sem-revisao
  '1:3':
    texto: de modo que tudo o que podia ter repartia cada dia com os irmãos cativos, que eram da sua estirpe.
    partes:
    - de modo que tudo o que podia ter
    - repartia cada dia com os irmãos cativos, que eram da sua estirpe.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '2:1':
    texto: Depois disso, sendo dia de festa do Senhor, e tendo-se preparado um bom almoço na casa de Tobias,
    partes:
    - Depois disso,
    - sendo dia de festa do Senhor,
    - e tendo-se preparado um bom almoço na casa de Tobias,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '2:2':
    texto: 'disse ao seu filho: “Vai e traze alguns da nossa tribo, que temam a Deus, para que banqueteiem
      conosco.”'
    status: ia-sem-revisao
  '2:3':
    texto: Tendo ele saído, voltou e anunciou-lhe que um dos filhos de Israel jazia estrangulado na praça.
      Imediatamente, saltando do seu leito, deixando o almoço, foi em jejum até o corpo,
    status: ia-sem-revisao
  '2:4':
    texto: e, levantando-o, levou-o em segredo para sua casa, para sepultá-lo com cautela quando o sol
      se pusesse.
    status: ia-sem-revisao
  '2:5':
    texto: Tendo escondido o corpo, comeu o pão com luto e tremor,
    status: ia-sem-revisao
  '2:6':
    texto: 'lembrando aquela palavra que o Senhor disse pelo profeta Amós: “As vossas festas se converterão
      em lamentação e luto.”'
    status: ia-sem-revisao
  '2:7':
    texto: Quando o sol se pôs, foi e o sepultou.
    status: ia-sem-revisao
  '2:8':
    texto: 'Todos os seus vizinhos o repreendiam, dizendo: “Já por causa disso foste condenado a morrer
      e mal escapaste à sentença de morte, e ainda sepultas os mortos?”'
    status: ia-sem-revisao
  '2:9':
    texto: Mas Tobias, temendo mais a Deus do que ao rei, recolhia os corpos dos mortos, escondia-os em
      sua casa e os sepultava à meia-noite.
    status: ia-sem-revisao
  '2:10':
    texto: Aconteceu que, certo dia, cansado do sepultamento, ao chegar a sua casa, atirou-se junto à
      parede e adormeceu,
    status: ia-sem-revisao
  '2:11':
    texto: e do ninho das andorinhas caiu sobre os seus olhos, enquanto dormia, esterco quente, e ele
      ficou cego.
    status: ia-sem-revisao
  '2:12':
    texto: O Senhor permitiu que essa provação lhe sucedesse para que fosse dado aos pósteros um exemplo
      da sua paciência, como o de Jó.
    status: ia-sem-revisao
  '2:13':
    texto: Pois, tendo desde a infância sempre temido a Deus e guardado os seus mandamentos, não se entristeceu
      contra Deus por lhe ter sobrevindo a praga da cegueira,
    status: ia-sem-revisao
  '2:14':
    texto: mas permaneceu imóvel no temor de Deus, dando graças a Deus todos os dias da sua vida.
    status: ia-sem-revisao
  '3:1':
    texto: Então Tobias gemeu e começou a orar com lágrimas,
    status: ia-sem-revisao
  '3:2':
    texto: 'dizendo: “Tu és justo, Senhor, e todos os teus juízos são justos, e todos os teus caminhos
      são misericórdia, verdade e juízo.'
    status: ia-sem-revisao
  '3:3':
    texto: E agora, Senhor, lembra-te de mim, não tomes vingança dos meus pecados, nem te recordes das
      minhas faltas ou das de meus pais.
    status: ia-sem-revisao
  '3:4':
    texto: Porque não obedecemos aos teus preceitos, fomos entregues à pilhagem, ao cativeiro e à morte,
      e a ser fábula e opróbrio para todas as nações entre as quais nos dispersaste.
    status: ia-sem-revisao
  '3:5':
    texto: E agora, Senhor, grandes são os teus juízos, porque não agimos segundo os teus preceitos e
      não andamos com sinceridade diante de ti.
    status: ia-sem-revisao
  '3:6':
    texto: E agora, Senhor, faze comigo segundo a tua vontade e manda que o meu espírito seja recebido
      em paz; pois me convém mais morrer do que viver.”
    status: ia-sem-revisao
  '3:7':
    texto: No mesmo dia, aconteceu que Sara, filha de Raguel, em Rages, cidade dos medos, também ela ouviu
      um insulto de uma das servas de seu pai,
    status: ia-sem-revisao
  '3:8':
    texto: porque tinha sido dada a sete maridos, e o demônio chamado Asmodeu os matara logo que entravam
      junto dela.
    status: ia-sem-revisao
  '3:9':
    texto: 'Repreendendo a moça por causa dessa culpa, a serva respondeu-lhe: “Que não vejamos mais de
      ti filho nem filha sobre a terra, assassina dos teus maridos!'
    status: ia-sem-revisao
  '3:10':
    texto: Queres matar-me também a mim, como já mataste sete maridos?” Ao ouvir essa palavra, ela subiu
      ao quarto superior da sua casa e durante três dias e três noites não comeu nem bebeu,
    status: ia-sem-revisao
  '3:11':
    texto: mas, perseverando em oração, com lágrimas suplicava a Deus que a libertasse desse opróbrio.
    status: ia-sem-revisao
  '3:16':
    texto: Tu sabes, Senhor, que nunca desejei marido e conservei pura a minha alma de toda concupiscência.
    status: ia-sem-revisao
  '3:17':
    texto: Nunca me misturei com os que se divertem, nem me fiz companheira dos que andam na leviandade.
    status: ia-sem-revisao
  '6:10':
    texto: 'Tobias lhe disse: “Onde queres que fiquemos?”'
    status: ia-sem-revisao
  '7:1':
    texto: Entraram na casa de Raguel, e Raguel os recebeu com alegria.
    status: ia-sem-revisao
  '7:9':
    texto: Depois que conversaram, Raguel mandou imolar um carneiro e preparar um banquete. Enquanto os
      exortava a sentar-se para o almoço,
    status: ia-sem-revisao
  '7:10':
    texto: 'Tobias disse: “Aqui não comerei nem beberei hoje, a não ser que antes confirmes o meu pedido
      e me prometas dar Sara, tua filha.”'
    status: ia-sem-revisao
  '7:11':
    texto: Ao ouvir essa palavra, Raguel se assustou, sabendo o que acontecera àqueles sete homens que
      tinham entrado junto dela; e começou a temer que também a este sucedesse o mesmo. E, como hesitava
      e não dava resposta alguma a quem pedia,
    status: ia-sem-revisao
  '7:12':
    texto: 'o anjo lhe disse: “Não temas dá-la a este, pois a este que teme a Deus a tua filha é devida
      como esposa; por isso outro não pôde tê-la.”'
    status: ia-sem-revisao
  '7:13':
    texto: 'Então Raguel disse: “Não duvido de que Deus tenha admitido em sua presença as minhas preces
      e lágrimas.'
    status: ia-sem-revisao
  '7:14':
    texto: E creio que por isso vos fez vir a mim, para que esta se unisse ao seu parentesco segundo a
      lei de Moisés; e agora não tenhas dúvida de que a entregarei a ti.”
    status: ia-sem-revisao
  '8:4':
    texto: 'Então Tobias exortou a virgem e lhe disse: “Sara, levanta-te, e oremos a Deus hoje, amanhã
      e depois de amanhã, porque nestas três noites estamos unidos a Deus; passada a terceira noite, estaremos
      no nosso matrimônio.'
    status: ia-sem-revisao
  '8:5':
    texto: Pois somos filhos de santos e não podemos unir-nos como as nações que ignoram a Deus.”
    status: ia-sem-revisao
  '8:6':
    texto: Levantando-se juntos, oravam ambos com insistência, para que lhes fosse dada saúde.
    status: ia-sem-revisao
  '8:7':
    texto: 'E Tobias disse: “Senhor, Deus de nossos pais, bendigam-te os céus e a terra, o mar, as fontes,
      os rios e todas as tuas criaturas que neles existem.'
    status: ia-sem-revisao
  '8:8':
    texto: Tu fizeste Adão do barro da terra e lhe deste por auxílio Eva.
    status: ia-sem-revisao
  '11:5':
    texto: Ana, porém, sentava-se todos os dias à beira do caminho, no alto do monte, de onde podia olhar
      ao longe.
    status: ia-sem-revisao
  '11:6':
    texto: 'Enquanto dali observava a chegada dele, viu de longe e logo reconheceu o seu filho que vinha;
      correndo, anunciou ao marido: “Eis que vem o teu filho.”'
    status: ia-sem-revisao
  '11:7':
    texto: 'E Rafael disse a Tobias: “Quando entrares em tua casa, adora logo o Senhor, teu Deus, e, dando-lhe
      graças, aproxima-te de teu pai e beija-o.'
    status: ia-sem-revisao
  '11:8':
    texto: Em seguida, unta os olhos dele com este fel de peixe, que levas contigo; saibas que logo se
      abrirão os seus olhos, e teu pai verá a luz do céu e se alegrará ao ver-te.”
    status: ia-sem-revisao
  '11:9':
    texto: Então correu à frente o cão que fora com eles no caminho e, como mensageiro que chega, alegrava-se
      abanando a cauda.
    status: ia-sem-revisao
  '11:10':
    texto: Levantando-se, o pai cego começou a correr, tropeçando com os pés; e, dando a mão a um servo,
      foi ao encontro do filho.
    status: ia-sem-revisao
  '11:11':
    texto: Acolhendo-o, beijou-o, com a sua mulher, e ambos começaram a chorar de alegria.
    status: ia-sem-revisao
  '11:12':
    texto: Depois de adorarem a Deus e darem graças, sentaram-se.
    status: ia-sem-revisao
  '11:13':
    texto: Então Tobias, tomando o fel do peixe, untou os olhos de seu pai.
    status: ia-sem-revisao
  '11:14':
    texto: Esperou cerca de meia hora, e começou a sair dos seus olhos uma película, como a membrana de
      um ovo.
    status: ia-sem-revisao
  '11:15':
    texto: Tobias, segurando-a, tirou-a dos seus olhos, e imediatamente ele recuperou a vista.
    status: ia-sem-revisao
  '11:16':
    texto: Glorificavam a Deus ele, a sua mulher e todos os que o conheciam.
    status: ia-sem-revisao
  '11:17':
    texto: 'E Tobias dizia: “Bendigo-te, Senhor, Deus de Israel, porque tu me castigaste e tu me salvaste;
      e eis que vejo meu filho Tobias.”'
    status: ia-sem-revisao
  '12:1':
    texto: 'Então Tobias chamou a si o seu filho e lhe disse: “Que podemos dar a este santo homem que
      veio contigo?”'
    status: ia-sem-revisao
  '12:5':
    texto: Chamando-o, pai e filho, levaram-no à parte e começaram a rogar-lhe que se dignasse aceitar
      a metade de tudo o que tinham trazido.
    status: ia-sem-revisao
  '12:6':
    texto: 'Então ele lhes disse em segredo: “Bendizei o Deus do céu e, diante de todos os viventes, confessai-o,
      porque usou convosco da sua misericórdia.'
    status: ia-sem-revisao
  '12:7':
    texto: Pois é bom esconder o segredo do rei, mas revelar e confessar as obras de Deus é honroso.
    status: ia-sem-revisao
  '12:8':
    texto: Boa é a oração com jejum, e a esmola vale mais do que guardar tesouros de ouro,
    status: ia-sem-revisao
  '12:9':
    texto: porque a esmola livra da morte, ela purifica os pecados e faz encontrar misericórdia e o caminho
      eterno.
    status: ia-sem-revisao
  '12:10':
    texto: Mas os que cometem o pecado e a iniquidade são inimigos da sua própria alma.
    status: ia-sem-revisao
  '12:11':
    texto: Manifesto-vos, pois, a verdade e não vos esconderei palavra oculta.
    status: ia-sem-revisao
  '12:12':
    texto: Quando orabas com lágrimas, sepultavas os mortos, deixavas o teu almoço e escondias de dia
      os mortos em tua casa e de noite os sepultavas, eu apresentei a tua oração ao Senhor.
    status: ia-sem-revisao
  '12:13':
    texto: E, porque eras agradável a Deus, foi necessário que a tentação te provasse.
    status: ia-sem-revisao
  '12:14':
    texto: E agora o Senhor me enviou para te curar e livrar do demônio Sara, mulher do teu filho.
    status: ia-sem-revisao
  '12:15':
    texto: Pois eu sou o anjo Rafael, um dos sete que assistimos diante do Senhor.
    status: ia-sem-revisao
  '12:20':
    texto: É tempo, portanto, de voltar àquele que me enviou; vós, porém, bendizei a Deus e narrai todas
      as suas maravilhas.”
    status: ia-sem-revisao
  '13:2':
    texto: porque tu castigas e salvas, conduzes aos infernos e de lá reconduzes, e não há quem escape
      da tua mão.
    status: ia-sem-revisao
  '13:3':
    texto: Confessai o Senhor, filhos de Israel, e louvai-o à vista das nações;
    status: ia-sem-revisao
  '13:6':
    texto: vede, pois, o que fez conosco e, com temor e tremor, confessai-o; exaltai o rei dos séculos
      com as vossas obras.
    status: ia-sem-revisao
  '13:7':
    texto: Eu, porém, na terra do meu cativeiro o confessarei, porque mostrou a sua majestade a um povo
      pecador.
    status: ia-sem-revisao
  '13:8':
    texto: Convertei-vos, pois, pecadores, e praticai a justiça diante de Deus, crendo que ele usará convosco
      da sua misericórdia.
    status: ia-sem-revisao
