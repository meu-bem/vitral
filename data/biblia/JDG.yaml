livro: JDG
fonte: oshb
versiculos:
  '2:11':
    texto: Os filhos de Israel fizeram o que é mau aos olhos do Senhor e serviram aos baais.
    status: ia-sem-revisao
  '2:12':
    texto: Abandonaram o Senhor, Deus dos seus pais, que os tirara da terra do Egito, e foram atrás de
      outros deuses, dos deuses dos povos ao redor deles; prostraram-se diante deles e provocaram a ira
      do Senhor.
    status: ia-sem-revisao
  '2:13':
    texto: Abandonaram o Senhor e serviram a Baal e a Astarotes.
    status: ia-sem-revisao
  '2:14':
    texto: A ira do Senhor se acendeu contra Israel; entregou-os na mão de saqueadores, que os saquearam,
      e vendeu-os na mão dos inimigos ao redor, e já não puderam resistir diante dos seus inimigos.
    status: ia-sem-revisao
  '2:15':
    texto: Por onde quer que saíssem, a mão do Senhor estava contra eles para o mal, como o Senhor dissera
      e como o Senhor lhes jurara; e ficaram em grande angústia.
    status: ia-sem-revisao
  '2:16':
    texto: O Senhor suscitou juízes, que os salvaram da mão dos seus saqueadores.
    status: ia-sem-revisao
  '2:17':
    texto: Mas também aos seus juízes não deram ouvidos, pois se prostituíram atrás de outros deuses e
      se prostraram diante deles; desviaram-se depressa do caminho que seus pais tinham seguido, ouvindo
      os mandamentos do Senhor; não fizeram como eles.
    status: ia-sem-revisao
  '2:18':
    texto: Quando o Senhor lhes suscitava juízes, o Senhor estava com o juiz e os salvava da mão dos inimigos
      durante todos os dias daquele juiz, porque o Senhor se compadecia dos seus gemidos diante dos que
      os oprimiam e os afligiam.
    status: ia-sem-revisao
  '2:19':
    texto: Mas, quando o juiz morria, voltavam e se corrompiam mais do que seus pais, indo atrás de outros
      deuses, servindo-os e prostrando-se diante deles; nada deixavam das suas práticas nem do seu caminho
      obstinado.
    status: ia-sem-revisao
  '6:11':
    texto: O anjo do Senhor veio e sentou-se debaixo do carvalho que estava em Ofra, pertencente a Joás,
      o abiezerita; seu filho Gedeão debulhava trigo no lagar, para o pôr a salvo dos madianitas.
    status: ia-sem-revisao
  '6:12':
    texto: 'O anjo do Senhor apareceu-lhe e disse: “O Senhor está contigo, valente guerreiro!”'
    status: ia-sem-revisao
  '6:13':
    texto: 'Gedeão respondeu: “Ah, meu senhor, se o Senhor está conosco, por que nos aconteceu tudo isto?
      Onde estão todas as suas maravilhas, que nossos pais nos contaram, dizendo: ‘Não foi o Senhor que
      nos fez subir do Egito?’ Agora o Senhor nos abandonou e nos entregou na mão de Madiã.”'
    status: ia-sem-revisao
  '6:14':
    texto: 'O Senhor voltou-se para ele e disse: “Vai com essa tua força e salva Israel da mão de Madiã.
      Não sou eu que te envio?”'
    status: ia-sem-revisao
  '6:15':
    texto: 'Ele respondeu: “Ah, meu Senhor, com que salvarei Israel? Eis que o meu clã é o mais pobre
      de Manassés, e eu sou o menor na casa de meu pai.”'
    status: ia-sem-revisao
  '6:16':
    texto: 'O Senhor lhe disse: “Eu estarei contigo, e ferirás Madiã como se fosse um só homem.”'
    status: ia-sem-revisao
  '6:17':
    texto: 'Ele disse: “Se achei graça aos teus olhos, dá-me um sinal de que és tu que falas comigo.'
    status: ia-sem-revisao
  '6:18':
    texto: 'Não te retires daqui até que eu volte a ti, traga a minha oferta e a ponha diante de ti.”
      Ele disse: “Eu esperarei até que voltes.”'
    status: ia-sem-revisao
  '6:19':
    texto: Gedeão foi, preparou um cabrito e uma efa de farinha em pães ázimos; pôs a carne num cesto
      e o caldo numa panela, levou tudo a ele debaixo do carvalho e o apresentou.
    status: ia-sem-revisao
  '6:20':
    texto: 'O anjo de Deus lhe disse: “Toma a carne e os pães ázimos, coloca-os sobre esta rocha e derrama
      o caldo.” E ele assim fez.'
    status: ia-sem-revisao
  '6:21':
    texto: O anjo do Senhor estendeu a ponta do bastão que tinha na mão e tocou a carne e os pães ázimos;
      subiu fogo da rocha e consumiu a carne e os pães ázimos. E o anjo do Senhor desapareceu dos seus
      olhos.
    status: ia-sem-revisao
  '6:22':
    texto: 'Gedeão viu que era o anjo do Senhor e disse: “Ai de mim, Senhor Deus! Pois vi o anjo do Senhor
      face a face!”'
    status: ia-sem-revisao
  '6:23':
    texto: 'O Senhor lhe disse: “A paz esteja contigo! Não temas, não morrerás.”'
    status: ia-sem-revisao
  '6:24':
    texto: Gedeão edificou ali um altar ao Senhor e lhe chamou “O Senhor é Paz”. Até hoje ele está em
      Ofra dos abiezeritas.
    status: ia-sem-revisao
  '9:6':
    texto: Reuniram-se todos os senhores de Siquém e toda a casa de Milo, foram e proclamaram rei Abimelec,
      junto ao carvalho do monumento que está em Siquém.
    status: ia-sem-revisao
  '9:7':
    texto: 'Avisaram Jotão, que foi, parou no cimo do monte Garizim e, levantando a voz, gritou-lhes:
      “Ouvi-me, senhores de Siquém, e Deus vos ouvirá!'
    status: ia-sem-revisao
  '9:8':
    texto: 'Um dia as árvores saíram para ungir um rei sobre elas e disseram à oliveira: ‘Reina sobre
      nós.’'
    status: ia-sem-revisao
  '9:9':
    texto: 'A oliveira lhes respondeu: ‘Deixaria eu o meu óleo, com o qual se honram deuses e homens,
      para ir balançar-me sobre as árvores?’'
    status: ia-sem-revisao
  '9:10':
    texto: 'As árvores disseram à figueira: ‘Vem tu, reina sobre nós.’'
    status: ia-sem-revisao
  '9:11':
    texto: 'A figueira lhes respondeu: ‘Deixaria eu a minha doçura e o meu bom fruto, para ir balançar-me
      sobre as árvores?’'
    status: ia-sem-revisao
  '9:12':
    texto: 'As árvores disseram à videira: ‘Vem tu, reina sobre nós.’'
    status: ia-sem-revisao
  '9:13':
    texto: 'A videira lhes respondeu: ‘Deixaria eu o meu vinho novo, que alegra deuses e homens, para
      ir balançar-me sobre as árvores?’'
    status: ia-sem-revisao
  '9:14':
    texto: 'Então todas as árvores disseram ao espinheiro: ‘Vem tu, reina sobre nós.’'
    status: ia-sem-revisao
  '9:15':
    texto: 'O espinheiro respondeu às árvores: ‘Se de verdade me ungis rei sobre vós, vinde, abrigai-vos
      à minha sombra; se não, sairá fogo do espinheiro e devorará os cedros do Líbano.’'
    status: ia-sem-revisao
  '11:29':
    texto: O espírito do Senhor veio sobre Jefté; ele atravessou Galaad e Manassés, passou por Masfa de
      Galaad e, de Masfa de Galaad, avançou contra os amonitas.
    status: ia-sem-revisao
  '11:30':
    texto: 'Jefté fez um voto ao Senhor e disse: “Se de fato entregares os amonitas na minha mão,'
    status: ia-sem-revisao
  '11:31':
    texto: aquele que sair da porta da minha casa ao meu encontro, quando eu voltar em paz dos amonitas,
      será do Senhor, e eu o oferecerei em holocausto.”
    status: ia-sem-revisao
  '11:32':
    texto: Jefté passou aos amonitas para combatê-los, e o Senhor os entregou na sua mão.
    status: ia-sem-revisao
  '11:33':
    texto: Feriu-os desde Aroer até a entrada de Minit, vinte cidades, e até Abel-Queramim, com uma derrota
      muito grande; os amonitas foram humilhados diante dos filhos de Israel.
    status: ia-sem-revisao
  '11:34':
    texto: Jefté voltou a Masfa, à sua casa, e eis que a sua filha saía ao seu encontro com tamborins
      e danças. Era a sua única filha; fora dela, não tinha filho nem filha.
    status: ia-sem-revisao
  '11:35':
    texto: 'Ao vê-la, rasgou as suas vestes e disse: “Ai, minha filha! Tu me prostraste, tu estás entre
      os que me afligem! Eu abri a boca ao Senhor e não posso voltar atrás.”'
    status: ia-sem-revisao
  '11:36':
    texto: 'Ela lhe disse: “Meu pai, abriste a boca ao Senhor; faze comigo conforme saiu da tua boca,
      pois o Senhor te concedeu vingança sobre os teus inimigos, os amonitas.”'
    status: ia-sem-revisao
  '11:37':
    texto: 'Disse ainda ao pai: “Que me seja concedido isto: deixa-me por dois meses, para que eu vá e
      desça pelos montes e chore a minha virgindade, eu e as minhas companheiras.”'
    status: ia-sem-revisao
  '11:38':
    texto: 'Ele disse: “Vai.” E a deixou partir por dois meses; ela foi com as suas companheiras e chorou
      a sua virgindade pelos montes.'
    status: ia-sem-revisao
  '11:39':
    texto: 'Ao fim de dois meses, ela voltou ao pai, e ele fez com ela o voto que tinha feito. Ela não
      conhecera homem. E tornou-se costume em Israel:'
    partes:
    - Ao fim de dois meses, ela voltou ao pai, e ele fez com ela o voto que tinha feito.
    - 'Ela não conhecera homem. E tornou-se costume em Israel:'
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '13:2':
    texto: Havia um homem de Saraá, da família dos danitas, chamado Manoá; sua mulher era estéril e não
      tinha dado à luz.
    status: ia-sem-revisao
  '13:3':
    texto: 'O anjo do Senhor apareceu à mulher e lhe disse: “Eis que és estéril e não tiveste filhos,
      mas conceberás e darás à luz um filho.'
    status: ia-sem-revisao
  '13:4':
    texto: 'Agora, guarda-te: não bebas vinho nem bebida forte e não comas nada impuro.'
    status: ia-sem-revisao
  '13:5':
    texto: Pois eis que conceberás e darás à luz um filho; a navalha não passará sobre a sua cabeça, porque
      o menino será nazireu de Deus desde o ventre; e ele começará a salvar Israel da mão dos filisteus.”
    status: ia-sem-revisao
  '13:6':
    texto: 'A mulher foi dizer ao marido: “Veio a mim um homem de Deus; o seu aspecto era como o aspecto
      de um anjo de Deus, muito terrível. Não lhe perguntei de onde era, e ele não me disse o seu nome.'
    status: ia-sem-revisao
  '13:7':
    texto: 'Ele me disse: ‘Eis que conceberás e darás à luz um filho; agora não bebas vinho nem bebida
      forte e não comas nada impuro, porque o menino será nazireu de Deus desde o ventre até o dia da
      sua morte.’”'
    status: ia-sem-revisao
  '13:24':
    texto: A mulher deu à luz um filho e pôs-lhe o nome de Sansão. O menino cresceu, e o Senhor o abençoou.
    status: ia-sem-revisao
  '13:25':
    texto: O espírito do Senhor começou a agitá-lo no acampamento de Dã, entre Saraá e Estaol.
    status: ia-sem-revisao
