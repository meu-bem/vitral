livro: DAN
fonte: oshb
versiculos:
  '1:1':
    texto: No terceiro ano do reinado de Joaquim, rei de Judá, veio Nabucodonosor, rei da Babilônia, a
      Jerusalém e a sitiou.
    status: ia-sem-revisao
  '1:2':
    texto: O Senhor entregou em suas mãos Joaquim, rei de Judá, e parte dos utensílios da casa de Deus;
      ele os levou para a terra de Senaar, para o templo do seu deus, e depositou os utensílios no tesouro
      do seu deus.
    status: ia-sem-revisao
  '1:3':
    texto: O rei ordenou a Asfenez, chefe dos seus eunucos, que trouxesse alguns dos filhos de Israel,
      da linhagem real e da nobreza,
    status: ia-sem-revisao
  '1:4':
    texto: jovens sem defeito algum, de belo aspecto, instruídos em toda a sabedoria, dotados de conhecimento
      e de discernimento, capazes de servir no palácio do rei, e que fossem ensinados na escrita e na
      língua dos caldeus.
    status: ia-sem-revisao
  '1:5':
    texto: O rei designou-lhes uma ração diária da comida do rei e do vinho que ele bebia, para serem
      educados durante três anos, ao fim dos quais ficariam ao serviço do rei.
    status: ia-sem-revisao
  '1:6':
    texto: Entre eles estavam, dos filhos de Judá, Daniel, Ananias, Misael e Azarias.
    status: ia-sem-revisao
  '1:8':
    texto: Daniel resolveu no seu coração não se contaminar com a comida do rei nem com o vinho que ele
      bebia, e pediu ao chefe dos eunucos que não o obrigasse a contaminar-se.
    status: ia-sem-revisao
  '1:9':
    texto: Deus fez que Daniel encontrasse graça e compaixão diante do chefe dos eunucos.
    status: ia-sem-revisao
  '1:10':
    texto: 'O chefe dos eunucos disse a Daniel: “Tenho medo do meu senhor, o rei, que determinou a vossa
      comida e a vossa bebida. Por que ele veria o vosso rosto mais abatido do que o dos jovens da vossa
      idade? Assim poríeis em risco a minha cabeça diante do rei.”'
    status: ia-sem-revisao
  '1:11':
    texto: 'Daniel disse ao guarda que o chefe dos eunucos tinha posto sobre Daniel, Ananias, Misael e
      Azarias:'
    status: ia-sem-revisao
  '1:12':
    texto: '“Peço-te que ponhas os teus servos à prova durante dez dias: que nos deem legumes para comer
      e água para beber.'
    status: ia-sem-revisao
  '1:13':
    texto: Depois compara o nosso aspecto com o dos jovens que comem da comida do rei, e faze com os teus
      servos conforme o que vires.”
    status: ia-sem-revisao
  '1:14':
    texto: Ele atendeu-os nisso e pô-los à prova durante dez dias.
    status: ia-sem-revisao
  '1:15':
    texto: Ao fim de dez dias, o seu aspecto era melhor e eles estavam mais robustos do que todos os jovens
      que comiam da comida do rei.
    status: ia-sem-revisao
  '1:16':
    texto: Assim o guarda retirava-lhes a comida e o vinho que deviam beber e dava-lhes legumes.
    status: ia-sem-revisao
  '1:17':
    texto: A estes quatro jovens Deus deu conhecimento e inteligência em toda a escrita e sabedoria; e
      Daniel compreendia toda visão e sonhos.
    status: ia-sem-revisao
  '1:18':
    texto: Ao fim do tempo que o rei tinha fixado para que fossem apresentados, o chefe dos eunucos levou-os
      à presença de Nabucodonosor.
    status: ia-sem-revisao
  '1:19':
    texto: O rei falou com eles, e entre todos não se achou ninguém como Daniel, Ananias, Misael e Azarias;
      e ficaram ao serviço do rei.
    status: ia-sem-revisao
  '1:20':
    texto: Em todo assunto de sabedoria e inteligência sobre o qual o rei os interrogou, achou-os dez
      vezes superiores a todos os magos e adivinhos de todo o seu reino.
    status: ia-sem-revisao
  '2:31':
    texto: Tu, ó rei, estavas olhando, e eis uma grande estátua; era uma estátua imensa, de brilho extraordinário,
      que estava de pé diante de ti, e o seu aspecto era terrível.
    status: ia-sem-revisao
  '2:32':
    texto: A cabeça dessa estátua era de ouro fino, o peito e os braços eram de prata, o ventre e as coxas,
      de bronze,
    status: ia-sem-revisao
  '2:33':
    texto: as pernas, de ferro, e os pés, em parte de ferro, em parte de barro.
    status: ia-sem-revisao
  '2:34':
    texto: Estavas olhando, quando uma pedra se desprendeu sem intervenção de mão e atingiu a estátua
      nos pés de ferro e de barro e os esmigalhou.
    status: ia-sem-revisao
  '2:35':
    texto: Então se despedaçaram juntos o ferro, o barro, o bronze, a prata e o ouro, e ficaram como a
      palha da eira no verão; o vento os levou, e não se encontrou mais lugar para eles. A pedra que atingira
      a estátua tornou-se um grande monte e encheu toda a terra.
    status: ia-sem-revisao
  '2:36':
    texto: Este é o sonho; agora diremos ao rei a sua interpretação.
    status: ia-sem-revisao
  '2:37':
    texto: Tu, ó rei, és rei de reis, a quem o Deus do céu deu o reino, o poder, a força e a glória.
    status: ia-sem-revisao
  '2:38':
    texto: 'Em toda parte onde habitam os filhos dos homens, os animais do campo e as aves do céu, ele
      os entregou nas tuas mãos e te fez dominar sobre todos eles: tu és a cabeça de ouro.'
    status: ia-sem-revisao
  '2:39':
    texto: Depois de ti surgirá outro reino, inferior ao teu, e um terceiro reino, de bronze, que dominará
      sobre toda a terra.
    status: ia-sem-revisao
  '2:40':
    texto: Haverá um quarto reino, forte como o ferro; assim como o ferro quebra e esmaga tudo, como o
      ferro que tudo despedaça, também ele quebrará e esmagará todos esses.
    status: ia-sem-revisao
  '2:41':
    texto: Como viste os pés e os dedos em parte de barro de oleiro e em parte de ferro, será um reino
      dividido; mas haverá nele algo da firmeza do ferro, pois viste o ferro misturado com barro de argila.
    status: ia-sem-revisao
  '2:42':
    texto: Os dedos dos pés, em parte de ferro e em parte de barro, indicam que o reino será em parte
      forte e em parte frágil.
    status: ia-sem-revisao
  '2:43':
    texto: Como viste o ferro misturado com barro de argila, eles se misturarão por casamentos, mas não
      se unirão uns aos outros, assim como o ferro não se mistura com o barro.
    status: ia-sem-revisao
  '2:44':
    texto: No tempo desses reis, o Deus do céu suscitará um reino que jamais será destruído, e esse reino
      não passará a outro povo; esmagará e aniquilará todos esses reinos, e ele mesmo subsistirá para
      sempre,
    status: ia-sem-revisao
  '2:45':
    texto: conforme viste que uma pedra se desprendeu do monte sem intervenção de mão e esmigalhou o ferro,
      o bronze, o barro, a prata e o ouro. O grande Deus mostrou ao rei o que acontecerá depois disto.
      O sonho é verdadeiro, e a sua interpretação, digna de confiança.
    status: ia-sem-revisao
  '3:14':
    texto: 'Nabucodonosor tomou a palavra e disse-lhes: “É verdade, Sidrac, Misac e Abdênago, que não
      servis os meus deuses e não adorais a estátua de ouro que ergui?'
    status: ia-sem-revisao
  '3:15':
    texto: Agora, se estais prontos, quando ouvirdes o som da trombeta, da flauta, da cítara, da harpa,
      do saltério, da gaita de foles e de todo tipo de música, a prostrar-vos e adorar a estátua que fiz...
      Mas, se não a adorardes, no mesmo instante sereis lançados na fornalha de fogo ardente; e quem é
      o deus que vos livrará das minhas mãos?”
    status: ia-sem-revisao
  '3:16':
    texto: 'Sidrac, Misac e Abdênago responderam ao rei: “Nabucodonosor, não temos necessidade de te responder
      sobre isso.'
    status: ia-sem-revisao
  '3:17':
    texto: Se o nosso Deus, a quem servimos, pode livrar-nos, ele nos livrará da fornalha de fogo ardente
      e da tua mão, ó rei.
    status: ia-sem-revisao
  '3:18':
    texto: E, se não, fica sabendo, ó rei, que não serviremos os teus deuses nem adoraremos a estátua
      de ouro que ergueste.”
    status: ia-sem-revisao
  '3:19':
    texto: Então Nabucodonosor encheu-se de furor, e o aspecto do seu rosto mudou contra Sidrac, Misac
      e Abdênago. Tomou a palavra e mandou aquecer a fornalha sete vezes mais do que de costume.
    status: ia-sem-revisao
  '3:20':
    texto: Ordenou aos homens mais fortes do seu exército que amarrassem Sidrac, Misac e Abdênago e os
      lançassem na fornalha de fogo ardente.
    status: ia-sem-revisao
  '3:25':
    texto: 'Azarias, de pé, orou assim; abriu a boca no meio do fogo e disse:'
    status: ia-sem-revisao
    observacao: Trecho dos acréscimos gregos de Daniel, traduzido do latim (Clementina); numeração católica
      (Dn 3,24-90).
  '3:34':
    texto: Não nos abandones para sempre, te pedimos, por causa do teu nome, e não anules a tua aliança.
    status: ia-sem-revisao
  '3:35':
    texto: Não retires de nós a tua misericórdia, por causa de Abraão, o teu amado, de Isaac, o teu servo,
      e de Israel, o teu santo,
    status: ia-sem-revisao
  '3:36':
    texto: a quem falaste, prometendo multiplicar a sua descendência como as estrelas do céu e como a
      areia que está na praia do mar.
    status: ia-sem-revisao
  '3:37':
    texto: Pois, Senhor, tornamo-nos menores do que todas as nações e hoje somos humilhados em toda a
      terra por causa dos nossos pecados.
    status: ia-sem-revisao
  '3:38':
    texto: Neste tempo já não há príncipe, nem chefe, nem profeta, nem holocausto, nem sacrifício, nem
      oferta, nem incenso, nem lugar para oferecer as primícias diante de ti,
    status: ia-sem-revisao
  '3:39':
    texto: para podermos encontrar a tua misericórdia; mas, com a alma contrita e o espírito humilde,
      sejamos acolhidos.
    status: ia-sem-revisao
  '3:40':
    texto: Como em holocaustos de carneiros e de touros, como em milhares de cordeiros gordos, assim seja
      hoje o nosso sacrifício diante de ti, para que te agrade, pois não há vergonha para os que confiam
      em ti.
    status: ia-sem-revisao
  '3:41':
    texto: E agora seguimos-te de todo o coração, tememos-te e procuramos a tua face.
    status: ia-sem-revisao
  '3:42':
    texto: Não nos envergonhes; mas age conosco segundo a tua bondade e segundo a abundância da tua misericórdia.
    status: ia-sem-revisao
  '3:52':
    texto: 'Bendito és tu, Senhor, Deus dos nossos pais: digno de louvor, glorioso e exaltado acima de
      tudo para sempre. Bendito o teu nome santo e glorioso: digno de louvor e exaltado acima de tudo
      em todos os séculos.'
    status: ia-sem-revisao
    observacao: Trecho dos acréscimos gregos de Daniel, traduzido do latim (Clementina).
  '3:53':
    texto: 'Bendito és tu no templo santo da tua glória: digno de louvor e de glória acima de tudo para
      sempre.'
    status: ia-sem-revisao
  '3:54':
    texto: 'Bendito és tu no trono do teu reino: digno de louvor e exaltado acima de tudo para sempre.'
    status: ia-sem-revisao
  '3:55':
    texto: 'Bendito és tu, que sondas os abismos e te assentas sobre os querubins: digno de louvor e exaltado
      acima de tudo para sempre.'
    status: ia-sem-revisao
  '3:56':
    texto: 'Bendito és tu no firmamento do céu: digno de louvor e de glória para sempre.'
    status: ia-sem-revisao
  '3:57':
    texto: Obras todas do Senhor, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  '3:58':
    texto: Anjos do Senhor, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  '3:59':
    texto: Céus, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:60:
    texto: Águas todas que estais acima dos céus, bendizei o Senhor; louvai-o e exaltai-o acima de tudo
      para sempre.
    status: ia-sem-revisao
  3:61:
    texto: Potências todas do Senhor, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:62:
    texto: Sol e lua, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:63:
    texto: Estrelas do céu, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:64:
    texto: Chuvas todas e orvalhos, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:65:
    texto: Espíritos todos de Deus, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:66:
    texto: Fogo e calor, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:67:
    texto: Frio e calor, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:68:
    texto: Orvalhos e geadas, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:69:
    texto: Gelo e frio, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:70:
    texto: Gelo e neves, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:71:
    texto: Noites e dias, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:72:
    texto: Luz e trevas, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:73:
    texto: Relâmpagos e nuvens, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:74:
    texto: Bendiga a terra o Senhor; louve-o e exalte-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:75:
    texto: Montes e colinas, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:76:
    texto: Tudo o que germina na terra, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:77:
    texto: Fontes, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:78:
    texto: Mares e rios, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:79:
    texto: Monstros marinhos e tudo o que se move nas águas, bendizei o Senhor; louvai-o e exaltai-o acima
      de tudo para sempre.
    status: ia-sem-revisao
  3:80:
    texto: Aves todas do céu, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:81:
    texto: Feras e rebanhos todos, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:82:
    texto: Filhos dos homens, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:83:
    texto: Bendiga Israel o Senhor; louve-o e exalte-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:84:
    texto: Sacerdotes do Senhor, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:85:
    texto: Servos do Senhor, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:86:
    texto: Espíritos e almas dos justos, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:87:
    texto: Santos e humildes de coração, bendizei o Senhor; louvai-o e exaltai-o acima de tudo para sempre.
    status: ia-sem-revisao
  3:91:
    texto: 'Então o rei Nabucodonosor ficou atônito e levantou-se depressa; tomou a palavra e disse aos
      seus conselheiros: “Não lançamos três homens atados no meio do fogo?” Responderam ao rei: “Certamente,
      ó rei.”'
    status: ia-sem-revisao
  3:92:
    texto: 'Respondeu: “Eis que vejo quatro homens soltos, que andam no meio do fogo sem sofrer dano algum;
      e o aspecto do quarto é semelhante a um filho dos deuses.”'
    status: ia-sem-revisao
    observacao: O aramaico traz “filho dos deuses” (bar-elahin); a Vulgata traz “filho de Deus”.
  3:95:
    texto: 'Nabucodonosor tomou a palavra e disse: “Bendito seja o Deus de Sidrac, Misac e Abdênago, que
      enviou o seu anjo e livrou os seus servos que nele confiaram, desobedeceram à ordem do rei e entregaram
      o corpo para não servir nem adorar nenhum deus que não fosse o seu Deus.”'
    status: ia-sem-revisao
  '5:1':
    texto: O rei Baltasar deu um grande banquete a mil dos seus nobres e bebeu vinho diante dos mil.
    status: ia-sem-revisao
  '5:2':
    texto: Baltasar, ao saborear o vinho, mandou trazer os utensílios de ouro e de prata que Nabucodonosor,
      seu pai, tirara do templo de Jerusalém, para neles beberem o rei, os seus nobres, as suas mulheres
      e as suas concubinas.
    status: ia-sem-revisao
  '5:3':
    texto: Foram então trazidos os utensílios de ouro tirados do templo, da casa de Deus em Jerusalém,
      e neles beberam o rei, os seus nobres, as suas mulheres e as suas concubinas.
    status: ia-sem-revisao
  '5:4':
    texto: Beberam vinho e louvaram os deuses de ouro e de prata, de bronze, de ferro, de madeira e de
      pedra.
    status: ia-sem-revisao
  '5:5':
    texto: Naquele instante apareceram dedos de mão de homem, que escreviam, diante do candelabro, no
      reboco da parede do palácio do rei; e o rei via a palma da mão que escrevia.
    status: ia-sem-revisao
  '5:6':
    texto: Então o rosto do rei mudou, os seus pensamentos o perturbaram, as juntas dos seus rins se afrouxaram
      e os seus joelhos batiam um contra o outro.
    status: ia-sem-revisao
  '5:13':
    texto: 'Então Daniel foi levado à presença do rei. O rei tomou a palavra e disse a Daniel: “És tu
      Daniel, um dos exilados de Judá, que o rei, meu pai, trouxe de Judá?'
    status: ia-sem-revisao
  '5:14':
    texto: Ouvi dizer a teu respeito que em ti está o espírito dos deuses e que em ti se encontram luz,
      inteligência e uma sabedoria extraordinária.
    status: ia-sem-revisao
  '5:16':
    texto: Ouvi dizer a teu respeito que podes dar interpretações e resolver dificuldades. Agora, se puderes
      ler esta escrita e dar-me a sua interpretação, serás vestido de púrpura, terás um colar de ouro
      no pescoço e serás o terceiro no governo do reino.”
    status: ia-sem-revisao
  '5:17':
    texto: 'Então Daniel tomou a palavra e disse diante do rei: “Guarda para ti os teus presentes e dá
      a outro as tuas recompensas; contudo, lerei a escrita ao rei e lhe darei a interpretação.'
    status: ia-sem-revisao
  '5:23':
    texto: 'Tu te exaltaste contra o Senhor do céu: trouxeram à tua presença os utensílios da sua casa,
      e tu, os teus nobres, as tuas mulheres e as tuas concubinas bebestes vinho neles; louvaste os deuses
      de prata e de ouro, de bronze, de ferro, de madeira e de pedra, que não veem, não ouvem e não sabem
      nada; mas ao Deus que tem nas mãos o teu fôlego e todos os teus caminhos, não glorificaste.'
    status: ia-sem-revisao
  '5:24':
    texto: Por isso, da parte dele foi enviada esta palma de mão, e foi traçada esta escrita.
    status: ia-sem-revisao
  '5:25':
    texto: 'Esta é a escrita que foi traçada: MENE, MENE, TEQUEL e PARSIN.'
    status: ia-sem-revisao
  '5:26':
    texto: 'Esta é a interpretação das palavras: MENE: Deus contou o teu reino e lhe pôs fim.'
    status: ia-sem-revisao
  '5:27':
    texto: 'TEQUEL: foste pesado na balança e achado em falta.'
    status: ia-sem-revisao
  '5:28':
    texto: 'PERES: o teu reino foi dividido e dado aos medos e aos persas.”'
    status: ia-sem-revisao
  '6:12':
    texto: Então aqueles homens se reuniram e encontraram Daniel a pedir e a suplicar diante do seu Deus.
    status: ia-sem-revisao
  '6:13':
    texto: 'Aproximaram-se e disseram diante do rei, a respeito do decreto real: “Não assinaste um decreto
      segundo o qual todo homem que, durante trinta dias, fizer um pedido a qualquer deus ou homem, exceto
      a ti, ó rei, seria lançado na cova dos leões?” O rei respondeu: “A coisa é certa, segundo a lei
      dos medos e dos persas, que não se revoga.”'
    status: ia-sem-revisao
  '6:14':
    texto: 'Então responderam diante do rei: “Daniel, um dos exilados de Judá, não faz caso de ti, ó rei,
      nem do decreto que assinaste; três vezes por dia faz a sua oração.”'
    status: ia-sem-revisao
  '6:15':
    texto: Quando o rei ouviu isso, ficou muito aflito e procurou com empenho livrar Daniel; até o pôr
      do sol esforçou-se por salvá-lo.
    status: ia-sem-revisao
  '6:16':
    texto: 'Então aqueles homens foram em tumulto ao rei e lhe disseram: “Sabe, ó rei, que é lei dos medos
      e dos persas que nenhum decreto ou edito que o rei sancione pode ser mudado.”'
    status: ia-sem-revisao
  '6:17':
    texto: 'Então o rei deu ordem, e trouxeram Daniel e o lançaram na cova dos leões. O rei disse a Daniel:
      “O teu Deus, a quem serves constantemente, é quem te livrará.”'
    status: ia-sem-revisao
  '6:18':
    texto: Trouxeram uma pedra e a puseram sobre a entrada da cova; o rei selou-a com o seu anel e com
      o anel dos seus nobres, para que nada se mudasse a respeito de Daniel.
    status: ia-sem-revisao
  '6:19':
    texto: Depois o rei foi ao seu palácio e passou a noite em jejum; não lhe trouxeram instrumentos de
      música, e o sono fugiu dele.
    status: ia-sem-revisao
  '6:20':
    texto: Pela madrugada, ao romper da aurora, o rei levantou-se e foi depressa à cova dos leões.
    status: ia-sem-revisao
  '6:21':
    texto: 'Ao aproximar-se da cova, chamou Daniel com voz angustiada; o rei tomou a palavra e disse a
      Daniel: “Daniel, servo do Deus vivo, o teu Deus, a quem serves constantemente, pôde livrar-te dos
      leões?”'
    status: ia-sem-revisao
  '6:22':
    texto: 'Então Daniel falou ao rei: “Ó rei, vive para sempre!'
    status: ia-sem-revisao
  '6:23':
    texto: O meu Deus enviou o seu anjo e fechou a boca dos leões, que não me fizeram mal, porque fui
      achado inocente diante dele; e também diante de ti, ó rei, não cometi nenhum mal.”
    status: ia-sem-revisao
  '6:24':
    texto: O rei ficou muito contente e mandou tirar Daniel da cova. Daniel foi tirado da cova, e nele
      não se achou nenhum ferimento, porque tinha confiado no seu Deus.
    status: ia-sem-revisao
  '6:25':
    texto: O rei ordenou que trouxessem os homens que tinham acusado Daniel e que os lançassem na cova
      dos leões, eles, os seus filhos e as suas mulheres; e não tinham chegado ao fundo da cova quando
      os leões os dominaram e lhes trituraram todos os ossos.
    status: ia-sem-revisao
  '6:26':
    texto: 'Então o rei Dario escreveu a todos os povos, nações e línguas que habitam em toda a terra:
      “A vossa paz seja grande!'
    status: ia-sem-revisao
  '6:27':
    texto: Por mim é decretado que, em todo o domínio do meu reino, se tema e se reverencie o Deus de
      Daniel, porque ele é o Deus vivo, que subsiste para sempre; o seu reino não será destruído, e o
      seu domínio durará até o fim.
    status: ia-sem-revisao
  '6:28':
    texto: Ele salva e liberta, faz sinais e prodígios no céu e na terra; foi ele quem livrou Daniel das
      garras dos leões.”
    status: ia-sem-revisao
  '7:2':
    texto: 'Daniel tomou a palavra e disse: Eu olhava na minha visão noturna, e eis que os quatro ventos
      do céu agitavam o grande mar.'
    status: ia-sem-revisao
  '7:3':
    texto: Quatro grandes feras subiram do mar, diferentes umas das outras.
    status: ia-sem-revisao
  '7:4':
    texto: A primeira era como um leão e tinha asas de águia. Eu olhava, até que lhe arrancaram as asas;
      foi levantada do chão, posta de pé como um homem, e foi-lhe dado um coração de homem.
    status: ia-sem-revisao
  '7:5':
    texto: 'Eis que apareceu outra fera, a segunda, semelhante a um urso; estava levantada de um lado
      e tinha três costelas na boca, entre os dentes. Diziam-lhe: ‘Levanta-te, devora muita carne.’'
    status: ia-sem-revisao
  '7:6':
    texto: Depois disso eu olhava, e eis outra fera, semelhante a um leopardo; tinha nas costas quatro
      asas de ave, e a fera tinha quatro cabeças; e foi-lhe dado domínio.
    status: ia-sem-revisao
  '7:7':
    texto: Depois disso eu olhava nas visões noturnas, e eis uma quarta fera, terrível, espantosa e extremamente
      forte; tinha enormes dentes de ferro, devorava, triturava e pisava com os pés o que sobrava; era
      diferente de todas as feras anteriores e tinha dez chifres.
    status: ia-sem-revisao
  '7:8':
    texto: Eu observava os chifres, e eis que outro chifre, pequeno, subiu entre eles, e três dos primeiros
      chifres foram arrancados diante dele; e eis que esse chifre tinha olhos como olhos de homem e uma
      boca que proferia palavras arrogantes.
    status: ia-sem-revisao
  '7:9':
    texto: Eu continuava a olhar, até que foram postos tronos e um Ancião de dias se assentou; a sua veste
      era branca como a neve, e os cabelos da sua cabeça, como lã pura; o seu trono eram chamas de fogo,
      e as suas rodas, fogo ardente.
    status: ia-sem-revisao
  '7:10':
    texto: Um rio de fogo corria e saía de diante dele; mil milhares o serviam, e dez mil miríades estavam
      de pé diante dele. O tribunal sentou-se, e os livros foram abertos.
    status: ia-sem-revisao
  '7:11':
    texto: Eu olhava então, por causa do som das palavras arrogantes que o chifre proferia; olhava até
      que a fera foi morta, o seu corpo destruído e entregue ao fogo ardente.
    status: ia-sem-revisao
  '7:12':
    texto: Quanto às outras feras, foi-lhes tirado o domínio, mas foi-lhes concedida prolongação de vida
      por um tempo determinado.
    status: ia-sem-revisao
  '7:13':
    texto: Eu continuava a olhar nas visões noturnas, e eis que, com as nuvens do céu, vinha alguém como
      um filho de homem; chegou até o Ancião de dias e foi apresentado diante dele.
    status: ia-sem-revisao
  '7:14':
    texto: Foram-lhe dados domínio, glória e reino, e todos os povos, nações e línguas o serviram; o seu
      domínio é um domínio eterno, que não passará, e o seu reino não será destruído.
    status: ia-sem-revisao
  '7:15':
    texto: O meu espírito, o meu, de Daniel, ficou perturbado dentro do corpo, e as visões da minha cabeça
      me assustaram.
    status: ia-sem-revisao
  '7:16':
    texto: 'Aproximei-me de um dos que estavam ali de pé e lhe pedi a verdade sobre tudo isso. Ele me
      falou e me deu a interpretação das coisas:'
    status: ia-sem-revisao
  '7:17':
    texto: “Estas grandes feras, que são quatro, são quatro reis que se levantarão da terra.
    status: ia-sem-revisao
  '7:18':
    texto: Mas os santos do Altíssimo receberão o reino e possuirão o reino para sempre, pelos séculos
      dos séculos.”
    status: ia-sem-revisao
  '7:19':
    texto: Então quis saber a verdade sobre a quarta fera, que era diferente de todas as outras, extremamente
      terrível, com dentes de ferro e garras de bronze, que devorava, triturava e pisava com os pés o
      que sobrava;
    status: ia-sem-revisao
  '7:20':
    texto: e sobre os dez chifres que tinha na cabeça e sobre o outro que subiu, diante do qual caíram
      três, aquele chifre que tinha olhos e uma boca que proferia palavras arrogantes e cujo aspecto era
      maior que o dos outros.
    status: ia-sem-revisao
  '7:21':
    texto: Eu olhava, e esse chifre fazia guerra contra os santos e prevalecia sobre eles,
    status: ia-sem-revisao
  '7:22':
    texto: até que veio o Ancião de dias e foi feita justiça aos santos do Altíssimo; e chegou o tempo
      em que os santos tomaram posse do reino.
    status: ia-sem-revisao
  '7:23':
    texto: 'Ele disse assim: “A quarta fera será um quarto reino na terra, diferente de todos os reinos;
      devorará toda a terra, pisá-la-á e a triturará.'
    status: ia-sem-revisao
  '7:24':
    texto: Os dez chifres são dez reis que se levantarão desse reino; depois deles se levantará outro,
      diferente dos primeiros, e abaterá três reis.
    status: ia-sem-revisao
  '7:25':
    texto: Proferirá palavras contra o Altíssimo, oprimirá os santos do Altíssimo e pensará em mudar os
      tempos e a lei; os santos serão entregues nas suas mãos por um tempo, tempos e metade de um tempo.
    status: ia-sem-revisao
  '7:26':
    texto: Mas o tribunal se assentará, e o seu domínio lhe será tirado, para ser destruído e aniquilado
      até o fim.
    status: ia-sem-revisao
  '7:27':
    texto: O reino, o domínio e a grandeza dos reinos que há debaixo de todo o céu serão dados ao povo
      dos santos do Altíssimo; o seu reino é um reino eterno, e todos os domínios o servirão e lhe obedecerão.”
    status: ia-sem-revisao
  '9:4':
    texto: 'Orei ao Senhor, meu Deus, e fiz esta confissão: “Ah, Senhor, Deus grande e temível, que guardas
      a aliança e a misericórdia para com os que te amam e observam os teus mandamentos!'
    partes:
    - 'Orei ao Senhor, meu Deus, e fiz esta confissão:'
    - “Ah, Senhor, Deus grande e temível, que guardas a aliança e a misericórdia para com os que te amam
      e observam os teus mandamentos!
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '9:5':
    texto: Pecamos, cometemos iniquidade, agimos com impiedade, rebelamo-nos e nos afastamos dos teus
      mandamentos e dos teus juízos.
    status: ia-sem-revisao
  '9:6':
    texto: Não demos ouvidos aos teus servos, os profetas, que falaram em teu nome aos nossos reis, aos
      nossos príncipes, aos nossos pais e a todo o povo da terra.
    status: ia-sem-revisao
  '9:7':
    texto: A ti, Senhor, pertence a justiça, e a nós, a vergonha no rosto, como hoje se vê, aos homens
      de Judá, aos habitantes de Jerusalém e a todo o Israel, aos que estão perto e aos que estão longe,
      em todas as terras para onde os dispersaste por causa da infidelidade com que te traíram.
    status: ia-sem-revisao
  '9:8':
    texto: Senhor, a nós pertence a vergonha no rosto, aos nossos reis, aos nossos príncipes e aos nossos
      pais, porque pecamos contra ti.
    status: ia-sem-revisao
  '9:9':
    texto: Ao Senhor, nosso Deus, pertencem a compaixão e o perdão, porque nos rebelamos contra ele.
    status: ia-sem-revisao
  '9:10':
    texto: Não ouvimos a voz do Senhor, nosso Deus, para andarmos nas leis que ele pôs diante de nós por
      meio dos seus servos, os profetas.
    status: ia-sem-revisao
  '9:11':
    texto: Todo o Israel transgrediu a tua lei e se desviou, não escutando a tua voz; e caíram sobre nós
      a maldição e o juramento escritos na lei de Moisés, servo de Deus, porque pecamos contra ele.
    partes:
    - Todo o Israel transgrediu a tua lei e se desviou, não escutando a tua voz;
    - e caíram sobre nós a maldição e o juramento escritos na lei de Moisés, servo de Deus, porque pecamos
      contra ele.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '12:1':
    texto: Naquele tempo, levantar-se-á Miguel, o grande príncipe, que protege os filhos do teu povo;
      será um tempo de angústia, como nunca houve desde que existem nações até aquele tempo. Naquele tempo,
      o teu povo será salvo, todo aquele que se achar inscrito no livro.
    status: ia-sem-revisao
  '12:2':
    texto: 'Muitos dos que dormem no pó da terra despertarão: uns para a vida eterna, outros para a vergonha
      e o horror eterno.'
    status: ia-sem-revisao
  '12:3':
    texto: Os que forem sábios resplandecerão como o esplendor do firmamento, e os que tiverem conduzido
      muitos à justiça, como as estrelas, para sempre.
    status: ia-sem-revisao
  '13:1':
    texto: Havia um homem que habitava em Babilônia, chamado Joaquim,
    status: ia-sem-revisao
    observacao: Trecho deuterocanônico (Susana), traduzido do latim (Clementina); numeração católica (Dn
      13).
  '13:2':
    texto: que tomou por mulher Susana, filha de Helcias, muito bela e temente a Deus.
    status: ia-sem-revisao
  '13:3':
    texto: Pois os pais dela, que eram justos, tinham instruído a filha segundo a lei de Moisés.
    status: ia-sem-revisao
  '13:4':
    texto: Joaquim era muito rico e tinha um jardim junto à sua casa; os judeus reuniam-se em casa dele,
      porque era o mais honrado de todos.
    status: ia-sem-revisao
  '13:5':
    texto: 'Naquele ano foram constituídos juízes do povo dois anciãos, daqueles de quem o Senhor disse:
      ‘A iniquidade saiu de Babilônia, dos anciãos que eram juízes e pareciam governar o povo.’'
    status: ia-sem-revisao
  '13:6':
    texto: Eles frequentavam a casa de Joaquim, e a eles vinham todos os que tinham alguma causa a julgar.
    status: ia-sem-revisao
  '13:7':
    texto: Quando o povo se retirava ao meio-dia, Susana entrava e passeava no jardim do marido.
    status: ia-sem-revisao
  '13:8':
    texto: Os dois anciãos viam-na todos os dias entrar e passear, e arderam de desejo por ela.
    status: ia-sem-revisao
  '13:9':
    texto: Perverteram o seu juízo e desviaram os olhos para não verem o céu nem se lembrarem dos justos
      julgamentos.
    status: ia-sem-revisao
  '13:15':
    texto: Ora, enquanto esperavam um dia oportuno, ela entrou certa vez, como na véspera e na antevéspera,
      só com duas servas, e quis banhar-se no jardim, pois fazia calor.
    status: ia-sem-revisao
  '13:16':
    texto: Não havia ali ninguém, a não ser os dois anciãos, escondidos, que a observavam.
    status: ia-sem-revisao
  '13:17':
    texto: 'Disse, pois, às servas: “Trazei-me óleo e perfumes e fechai as portas do jardim, para que
      eu me banhe.”'
    status: ia-sem-revisao
  '13:19':
    texto: 'Quando as servas saíram, levantaram-se os dois anciãos, correram até ela e disseram:'
    status: ia-sem-revisao
  '13:20':
    texto: “Eis que as portas do jardim estão fechadas, e ninguém nos vê; nós te desejamos ardentemente.
      Por isso, consente e une-te a nós.
    status: ia-sem-revisao
  '13:21':
    texto: Se não quiseres, daremos testemunho contra ti, dizendo que estava contigo um jovem e que por
      isso despediste as servas.”
    status: ia-sem-revisao
  '13:22':
    texto: 'Susana gemeu e disse: “Estou cercada de angústias por todos os lados: se fizer isto, é a morte
      para mim; se não fizer, não escaparei das vossas mãos.'
    status: ia-sem-revisao
  '13:23':
    texto: Mas é melhor para mim cair nas vossas mãos sem o ter feito do que pecar diante do Senhor.”
    status: ia-sem-revisao
  '13:24':
    texto: E Susana gritou em alta voz; mas os anciãos também gritaram contra ela.
    status: ia-sem-revisao
  '13:25':
    texto: Um deles correu e abriu as portas do jardim.
    status: ia-sem-revisao
  '13:26':
    texto: Ouvindo o grito no jardim, os servos da casa precipitaram-se pela porta lateral para ver o
      que acontecia.
    status: ia-sem-revisao
  '13:27':
    texto: Depois que os anciãos falaram, os servos ficaram muito envergonhados, pois nunca se dissera
      tal coisa de Susana. E chegou o dia seguinte.
    status: ia-sem-revisao
  '13:28':
    texto: Quando o povo veio à casa de Joaquim, seu marido, vieram também os dois anciãos, cheios de
      maus pensamentos contra Susana, para a fazerem morrer.
    status: ia-sem-revisao
  '13:29':
    texto: 'Disseram diante do povo: “Mandai chamar Susana, filha de Helcias, mulher de Joaquim.” E logo
      mandaram chamá-la.'
    status: ia-sem-revisao
  '13:30':
    texto: Ela veio com os pais, os filhos e todos os seus parentes.
    status: ia-sem-revisao
  '13:33':
    texto: Choravam os seus e todos os que a conheciam.
    status: ia-sem-revisao
  '13:34':
    texto: Levantando-se no meio do povo, os dois anciãos puseram as mãos sobre a cabeça dela.
    status: ia-sem-revisao
  '13:35':
    texto: Ela, chorando, levantou os olhos para o céu, pois o seu coração confiava no Senhor.
    status: ia-sem-revisao
  '13:36':
    texto: 'Os anciãos disseram: “Enquanto passeávamos sozinhos no jardim, esta entrou com duas servas,
      fechou as portas do jardim e despediu as servas.'
    status: ia-sem-revisao
  '13:37':
    texto: Veio então a ela um jovem, que estava escondido, e se deitou com ela.
    status: ia-sem-revisao
  '13:38':
    texto: Nós, que estávamos num canto do jardim, vendo a iniquidade, corremos até eles e os vimos juntos.
    status: ia-sem-revisao
  '13:39':
    texto: Ao jovem não pudemos prender, porque era mais forte do que nós e, abrindo as portas, escapou.
    status: ia-sem-revisao
  '13:40':
    texto: Quanto a esta, depois de a prendermos, perguntamos quem era o jovem, e ela não quis dizer-nos.
      Disto somos testemunhas.”
    status: ia-sem-revisao
  '13:41':
    texto: A multidão acreditou neles, como em anciãos e juízes do povo, e condenou-a à morte.
    status: ia-sem-revisao
  '13:42':
    texto: 'Susana exclamou em alta voz e disse: “Deus eterno, que conheces o que está oculto, que sabes
      todas as coisas antes que aconteçam,'
    status: ia-sem-revisao
  '13:43':
    texto: tu sabes que prestaram falso testemunho contra mim; e eis que morro sem ter feito nada do que
      estes maliciosamente inventaram contra mim.”
    status: ia-sem-revisao
  '13:44':
    texto: O Senhor ouviu a sua voz.
    status: ia-sem-revisao
  '13:45':
    texto: Quando era levada à morte, o Senhor suscitou o espírito santo de um jovem chamado Daniel,
    status: ia-sem-revisao
  '13:46':
    texto: 'que exclamou em alta voz: “Estou inocente do sangue desta mulher.”'
    status: ia-sem-revisao
  '13:47':
    texto: 'Todo o povo, voltando-se para ele, disse: “Que palavra é esta que disseste?”'
    status: ia-sem-revisao
  '13:48':
    texto: 'Ele, de pé no meio deles, disse: “Assim, filhos de Israel, tão insensatos, sem julgar nem
      conhecer a verdade, condenastes uma filha de Israel?'
    status: ia-sem-revisao
  '13:49':
    texto: Voltai ao tribunal, porque estes prestaram falso testemunho contra ela.”
    status: ia-sem-revisao
  '13:50':
    texto: 'O povo voltou depressa, e os anciãos lhe disseram: “Vem, senta-te no meio de nós e informa-nos,
      pois Deus te concedeu a honra da ancianidade.”'
    status: ia-sem-revisao
  '13:51':
    texto: 'Daniel disse-lhes: “Separai-os um do outro, longe, e eu os julgarei.”'
    status: ia-sem-revisao
  '13:52':
    texto: 'Quando foram separados um do outro, chamou um deles e disse-lhe: “Envelhecido em dias maus,
      agora vieram os teus pecados, que praticavas antes:'
    status: ia-sem-revisao
  '13:53':
    texto: 'proferindo julgamentos injustos, oprimindo inocentes e deixando livres os culpados, apesar
      de o Senhor ter dito: ‘Não matarás o inocente e o justo.’'
    status: ia-sem-revisao
  '13:54':
    texto: 'Agora, pois, se a viste, dize-me sob que árvore os viste conversando juntos.” Ele respondeu:
      “Sob um lentisco.”'
    status: ia-sem-revisao
  '13:55':
    texto: 'Daniel disse: “Com razão mentiste contra a tua própria cabeça: eis que o anjo de Deus, tendo
      já recebido a sentença, te partirá ao meio.”'
    status: ia-sem-revisao
  '13:56':
    texto: 'Mandou-o retirar, ordenou que viesse o outro e lhe disse: “Descendência de Canaã, e não de
      Judá, a beleza te enganou e a concupiscência perverteu o teu coração.'
    status: ia-sem-revisao
  '13:57':
    texto: Assim faziam às filhas de Israel, que, por medo, falavam convosco; mas uma filha de Judá não
      suportou a vossa iniquidade.
    status: ia-sem-revisao
  '13:58':
    texto: 'Agora, pois, dize-me sob que árvore os surpreendeste conversando juntos.” Ele respondeu: “Sob
      uma azinheira.”'
    status: ia-sem-revisao
  '13:59':
    texto: 'Daniel disse-lhe: “Com razão também tu mentiste contra a tua própria cabeça: pois o anjo do
      Senhor está esperando, com a espada na mão, para te partir ao meio e matar-vos a ambos.”'
    status: ia-sem-revisao
  13:60:
    texto: Toda a assembleia exclamou em alta voz e bendisse a Deus, que salva os que nele esperam.
    status: ia-sem-revisao
  13:61:
    texto: Levantaram-se contra os dois anciãos — pois Daniel os convencera, pela sua própria boca, de
      terem prestado falso testemunho — e fizeram-lhes o mesmo mal que tinham feito ao próximo,
    status: ia-sem-revisao
  13:62:
    texto: cumprindo a lei de Moisés. Mataram-nos, e naquele dia foi salvo o sangue inocente.
    status: ia-sem-revisao
