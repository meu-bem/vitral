livro: 2TH
fonte: sblgnt
versiculos:
  '1:1':
    texto: 'Paulo, Silvano e Timóteo, à Igreja dos tessalonicenses em Deus, nosso Pai, e no Senhor Jesus
      Cristo:'
    status: ia-sem-revisao
  '1:2':
    texto: Graça e paz a vós da parte de Deus Pai e do Senhor Jesus Cristo.
    status: ia-sem-revisao
  '1:3':
    texto: Devemos dar sempre graças a Deus por vós, irmãos, como é digno, porque a vossa fé cresce extraordinariamente
      e abunda o amor de cada um de todos vós uns para com os outros,
    status: ia-sem-revisao
  '1:4':
    texto: De modo que nós mesmos nos gloriamos de vós nas Igrejas de Deus, pela vossa perseverança e
      fé em todas as vossas perseguições e nas tribulações que suportais,
    status: ia-sem-revisao
  '1:5':
    texto: Prova do justo julgamento de Deus, para serdes considerados dignos do Reino de Deus, pelo qual
      também sofreis,
    status: ia-sem-revisao
  '1:6':
    texto: Se é justo diante de Deus retribuir com tribulação aos que vos atribulam
    status: ia-sem-revisao
  '1:7':
    texto: E dar a vós, atribulados, descanso conosco, na revelação do Senhor Jesus, vindo do céu com
      os anjos do seu poder,
    status: ia-sem-revisao
  '1:8':
    texto: Em chama de fogo, fazendo justiça contra os que não conhecem a Deus e contra os que não obedecem
      ao Evangelho de nosso Senhor Jesus,
    status: ia-sem-revisao
  '1:9':
    texto: Os quais sofrerão como castigo a ruína eterna, longe da face do Senhor e da glória do seu poder,
    status: ia-sem-revisao
  '1:10':
    texto: Quando vier, naquele dia, para ser glorificado em seus santos e admirado em todos os que creram,
      porque foi acreditado o nosso testemunho entre vós.
    status: ia-sem-revisao
  '1:11':
    texto: Para isso também rezamos sempre por vós, para que o nosso Deus vos torne dignos da vocação
      e leve à perfeição, com poder, todo desejo de bondade e obra de fé,
    status: ia-sem-revisao
  '1:12':
    texto: Para que o nome de nosso Senhor Jesus seja glorificado em vós, e vós nele, segundo a graça
      de nosso Deus e do Senhor Jesus Cristo.
    status: ia-sem-revisao
  '2:1':
    texto: Quanto à vinda de nosso Senhor Jesus Cristo e à nossa reunião com ele, pedimo-vos, irmãos,
    status: ia-sem-revisao
  '2:2':
    texto: Que não vos deixeis abalar depressa no vosso modo de pensar, nem vos alarmeis, nem por espírito,
      nem por palavra, nem por carta como se fosse nossa, dizendo que o dia do Senhor já chegou.
    status: ia-sem-revisao
  '2:3':
    texto: Que ninguém vos engane de modo algum; porque primeiro deve vir a apostasia e revelar-se o homem
      da iniquidade, o filho da perdição,
    status: ia-sem-revisao
  '2:4':
    texto: O adversário, que se exalta acima de tudo o que se chama deus ou é objeto de culto, a ponto
      de sentar-se no templo de Deus, proclamando-se a si mesmo Deus.
    status: ia-sem-revisao
  '2:5':
    texto: Não vos lembrais de que, quando ainda estava convosco, eu vos dizia isto?
    status: ia-sem-revisao
  '2:6':
    texto: E agora sabeis o que o detém, para que ele se revele no seu devido tempo;
    status: ia-sem-revisao
  '2:7':
    texto: Pois o mistério da iniquidade já está em ação; só falta que aquele que agora o detém seja afastado.
    status: ia-sem-revisao
  '2:8':
    texto: Então será revelado o iníquo, a quem o Senhor Jesus destruirá com o sopro da sua boca e aniquilará
      com o esplendor da sua vinda,
    status: ia-sem-revisao
  '2:9':
    texto: Aquele cuja vinda se dá por ação de Satanás, com todo poder, sinais e prodígios de mentira,
    status: ia-sem-revisao
  '2:10':
    texto: E com todo engano de injustiça para os que se perdem, porque não acolheram o amor da verdade
      para serem salvos.
    status: ia-sem-revisao
  '2:11':
    texto: Por isso Deus lhes envia uma ação de erro, para que creiam na mentira,
    status: ia-sem-revisao
  '2:12':
    texto: A fim de serem julgados todos os que não creram na verdade, mas se comprouveram na injustiça.
    status: ia-sem-revisao
  '2:13':
    texto: Nós, porém, devemos dar sempre graças a Deus por vós, irmãos amados pelo Senhor, porque Deus
      vos escolheu como primícias para a salvação, na santificação do Espírito e na fé na verdade,
    status: ia-sem-revisao
  '2:14':
    texto: Para o que vos chamou por meio do nosso Evangelho, para alcançardes a glória de nosso Senhor
      Jesus Cristo.
    status: ia-sem-revisao
  '2:15':
    texto: Portanto, irmãos, permanecei firmes e guardai as tradições que aprendestes, quer por palavra,
      quer por carta nossa.
    status: ia-sem-revisao
  '2:16':
    texto: O próprio Senhor nosso Jesus Cristo e Deus, nosso Pai, que nos amou e nos deu, pela graça,
      eterna consolação e boa esperança,
    status: ia-sem-revisao
  '2:17':
    texto: Consolem os vossos corações e os confirmem em toda boa obra e palavra.
    status: ia-sem-revisao
  '3:1':
    texto: Quanto ao mais, irmãos, orai por nós, para que a palavra do Senhor se propague rapidamente
      e seja glorificada, como entre vós,
    status: ia-sem-revisao
  '3:2':
    texto: E para que sejamos livrados dos homens perversos e maus, pois nem todos têm a fé.
    status: ia-sem-revisao
  '3:3':
    texto: Mas fiel é o Senhor, que vos confirmará e guardará do Maligno.
    status: ia-sem-revisao
  '3:4':
    texto: Temos confiança no Senhor a vosso respeito de que fazeis e fareis o que ordenamos.
    status: ia-sem-revisao
  '3:5':
    texto: O Senhor dirija os vossos corações ao amor de Deus e à perseverança de Cristo.
    status: ia-sem-revisao
  '3:6':
    texto: Ordenamos-vos, irmãos, em nome de nosso Senhor Jesus Cristo, que vos afasteis de todo irmão
      que vive desordenadamente e não segundo a tradição que de nós recebeu.
    status: ia-sem-revisao
  '3:7':
    texto: Vós mesmos sabeis como deveis imitar-nos, porque não vivemos desordenadamente entre vós,
    status: ia-sem-revisao
  '3:8':
    texto: Nem comemos de graça o pão de ninguém, mas com trabalho e fadiga, noite e dia, trabalhamos
      para não pesar a nenhum de vós;
    status: ia-sem-revisao
  '3:9':
    texto: Não porque não tivéssemos o direito, mas para vos darmos em nós um modelo a imitar.
    status: ia-sem-revisao
  '3:10':
    texto: 'Pois, quando estávamos convosco, vos ordenávamos isto: “Se alguém não quer trabalhar, também
      não coma.”'
    status: ia-sem-revisao
  '3:11':
    texto: Ouvimos, com efeito, que alguns entre vós vivem desordenadamente, sem trabalhar, mas ocupando-se
      com coisas inúteis;
    status: ia-sem-revisao
  '3:12':
    texto: A esses ordenamos e exortamos, no Senhor Jesus Cristo, que, trabalhando com tranquilidade,
      comam o seu próprio pão.
    status: ia-sem-revisao
  '3:13':
    texto: Vós, irmãos, não vos canseis de fazer o bem.
    status: ia-sem-revisao
  '3:14':
    texto: Se alguém não obedece ao que dizemos por esta carta, assinalai-o e não vos associeis a ele,
      para que se envergonhe;
    status: ia-sem-revisao
  '3:15':
    texto: Contudo, não o considereis inimigo, mas admoestai-o como irmão.
    status: ia-sem-revisao
  '3:16':
    texto: O próprio Senhor da paz vos dê a paz sempre e de todos os modos. O Senhor esteja com todos
      vós.
    status: ia-sem-revisao
  '3:17':
    texto: A saudação é de minha própria mão, Paulo; é o sinal em todas as cartas; assim escrevo.
    status: ia-sem-revisao
  '3:18':
    texto: A graça de nosso Senhor Jesus Cristo esteja com todos vós.
    status: ia-sem-revisao
