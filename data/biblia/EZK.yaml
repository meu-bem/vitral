livro: EZK
fonte: oshb
versiculos:
  '1:2':
    texto: No quinto dia do mês — era o quinto ano do exílio do rei Joaquin —
    status: ia-sem-revisao
  '1:3':
    texto: a palavra do Senhor foi dirigida ao sacerdote Ezequiel, filho de Buzi, na terra dos caldeus,
      junto ao rio Cobar; e ali veio sobre ele a mão do Senhor.
    status: ia-sem-revisao
  '1:4':
    texto: Eu olhei, e eis que um vento de tempestade vinha do norte, uma grande nuvem, com fogo faiscante
      e um resplendor ao redor; e do meio dele brilhava algo como electro, no meio do fogo.
    status: ia-sem-revisao
  '1:5':
    texto: 'Do meio dele surgia a figura de quatro seres vivos; e este era o seu aspecto: tinham figura
      humana.'
    status: ia-sem-revisao
  '1:24':
    texto: Ouvi o ruído das suas asas, como o ruído de muitas águas, como a voz do Todo-Poderoso, quando
      andavam; um ruído de tumulto, como o ruído de um acampamento; quando paravam, abaixavam as asas.
    status: ia-sem-revisao
  '1:25':
    texto: Ouvia-se uma voz acima do firmamento que estava sobre a cabeça deles; quando paravam, abaixavam
      as asas.
    status: ia-sem-revisao
  '1:26':
    texto: Acima do firmamento que estava sobre a cabeça deles havia algo como uma pedra de safira, em
      forma de trono; e sobre essa forma de trono, no alto, uma figura de aspecto humano.
    status: ia-sem-revisao
  '1:27':
    texto: Vi algo como electro, com aspecto de fogo em redor dele, desde o que parecia ser a sua cintura
      para cima; e, desde o que parecia ser a sua cintura para baixo, vi algo como fogo, e um resplendor
      ao redor.
    status: ia-sem-revisao
  '1:28':
    texto: Como o aspecto do arco que aparece na nuvem em dia de chuva, assim era o aspecto do resplendor
      ao redor. Era a aparência da figura da glória do Senhor. Ao vê-la, caí com o rosto em terra e ouvi
      a voz de alguém que falava.
    status: ia-sem-revisao
  '2:2':
    texto: Entrou em mim um espírito, enquanto ele me falava, e me pôs de pé; e ouvi aquele que me falava.
    status: ia-sem-revisao
  '2:3':
    texto: 'Disse-me: “Filho do homem, eu te envio aos filhos de Israel, a nações rebeldes que se revoltaram
      contra mim; eles e os seus pais pecaram contra mim até este mesmo dia.'
    status: ia-sem-revisao
  '2:4':
    texto: 'Aos filhos de rosto duro e coração obstinado eu te envio, e lhes dirás: Assim diz o Senhor
      Deus.'
    status: ia-sem-revisao
  '2:5':
    texto: Quer escutem, quer não — pois são uma casa rebelde —, saberão que houve um profeta no meio
      deles.
    status: ia-sem-revisao
  '2:8':
    texto: 'Tu, filho do homem, escuta o que te digo: não sejas rebelde como a casa rebelde. Abre a boca
      e come o que te vou dar.”'
    status: ia-sem-revisao
  '2:9':
    texto: Olhei, e eis que uma mão estendida para mim segurava um rolo de livro.
    status: ia-sem-revisao
  '2:10':
    texto: Ele o desenrolou diante de mim; estava escrito pela frente e por trás, e nele estavam escritos
      lamentos, gemidos e ais.
    status: ia-sem-revisao
  '3:1':
    texto: 'Disse-me: “Filho do homem, come o que achares; come este rolo e vai falar à casa de Israel.”'
    status: ia-sem-revisao
  '3:2':
    texto: Abri a boca, e ele me fez comer o rolo.
    status: ia-sem-revisao
  '3:3':
    texto: 'Disse-me: “Filho do homem, alimenta o teu ventre e enche as tuas entranhas com este rolo que
      te dou.” Eu o comi, e foi na minha boca doce como mel.'
    status: ia-sem-revisao
  '3:4':
    texto: 'Disse-me: “Filho do homem, vai à casa de Israel e fala-lhes com as minhas palavras.”'
    status: ia-sem-revisao
  '3:16':
    texto: 'Ao fim de sete dias, a palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '3:17':
    texto: “Filho do homem, fiz de ti sentinela da casa de Israel; quando ouvires uma palavra da minha
      boca, advertirás da minha parte.
    status: ia-sem-revisao
  '3:18':
    texto: 'Quando eu disser ao ímpio: ‘Certamente morrerás’, e tu não o advertires, não falares para
      dissuadir o ímpio do seu mau caminho, para lhe salvar a vida, esse ímpio morrerá na sua culpa, mas
      o seu sangue eu o pedirei da tua mão.'
    status: ia-sem-revisao
  '3:19':
    texto: Se, porém, advertires o ímpio e ele não se converter da sua impiedade e do seu mau caminho,
      ele morrerá na sua culpa, mas tu salvarás a tua vida.
    status: ia-sem-revisao
  '3:20':
    texto: Quando o justo se desviar da sua justiça e praticar a iniquidade, porei uma pedra de tropeço
      diante dele, e ele morrerá; se não o advertires, morrerá no seu pecado, e as suas obras de justiça
      não serão lembradas, mas o seu sangue eu o pedirei da tua mão.
    status: ia-sem-revisao
  '3:21':
    texto: Se, porém, advertires o justo para que o justo não peque, e ele não pecar, certamente viverá,
      porque foi advertido, e tu salvarás a tua vida.”
    status: ia-sem-revisao
  '9:1':
    texto: 'Clamou aos meus ouvidos com voz forte: “Aproximai-vos, vós que tendes a cidade a vosso cargo,
      cada um com o seu instrumento de destruição na mão!”'
    status: ia-sem-revisao
  '9:2':
    texto: E eis que seis homens vinham pelo caminho da porta superior, que olha para o norte, cada um
      com o seu instrumento de destruição na mão; no meio deles havia um homem vestido de linho, com um
      estojo de escriba à cintura. Entraram e pararam junto ao altar de bronze.
    status: ia-sem-revisao
  '9:3':
    texto: A glória do Deus de Israel subiu de sobre o querubim, onde estava, até a soleira do templo;
      e chamou o homem vestido de linho, que tinha à cintura o estojo de escriba.
    status: ia-sem-revisao
  '9:4':
    texto: 'O Senhor disse-lhe: “Passa pelo meio da cidade, pelo meio de Jerusalém, e marca com um tau
      a testa dos homens que gemem e se lamentam por todas as abominações que nela se cometem.”'
    status: ia-sem-revisao
  '9:5':
    texto: 'E aos outros disse aos meus ouvidos: “Passai pela cidade atrás dele e feri; que o vosso olho
      não poupe, e não tenhais compaixão.'
    status: ia-sem-revisao
  '9:6':
    texto: Matai até o extermínio velhos, jovens, moças, crianças e mulheres; mas não toqueis em nenhum
      homem que tenha o tau. E começai pelo meu santuário.” Começaram pelos anciãos que estavam diante
      do templo.
    status: ia-sem-revisao
  '9:7':
    texto: 'Disse-lhes: “Contaminai o templo e enchei os átrios de mortos; saí!” Eles saíram e feriram
      na cidade.'
    status: ia-sem-revisao
  '10:18':
    texto: A glória do Senhor saiu de sobre a soleira do templo e parou sobre os querubins.
    status: ia-sem-revisao
  '10:19':
    texto: Os querubins abriram as asas e se elevaram da terra diante dos meus olhos, quando partiram,
      e as rodas ao lado deles; pararam à entrada da porta oriental da casa do Senhor, e a glória do Deus
      de Israel estava sobre eles, no alto.
    status: ia-sem-revisao
  '10:20':
    texto: Eram os seres vivos que eu tinha visto debaixo do Deus de Israel junto ao rio Cobar; e compreendi
      que eram querubins.
    status: ia-sem-revisao
  '10:21':
    texto: Cada um tinha quatro rostos e quatro asas, e debaixo das asas havia algo como mãos de homem.
    status: ia-sem-revisao
  '10:22':
    texto: A figura dos seus rostos era a dos rostos que eu tinha visto junto ao rio Cobar, com o mesmo
      aspecto; e cada um caminhava direto para a frente.
    status: ia-sem-revisao
  '12:1':
    texto: 'A palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '12:2':
    texto: “Filho do homem, habitas no meio de uma casa rebelde; eles têm olhos para ver e não veem, têm
      ouvidos para ouvir e não ouvem, porque são uma casa rebelde.
    status: ia-sem-revisao
  '12:3':
    texto: 'Tu, filho do homem, prepara a bagagem do exílio e vai para o exílio de dia, diante dos olhos
      deles; deixarás o teu lugar para outro, diante dos seus olhos: talvez vejam que são uma casa rebelde.'
    status: ia-sem-revisao
  '12:4':
    texto: Tirarás a tua bagagem, como bagagem de exilado, de dia, diante dos olhos deles; e tu mesmo
      sairás à tarde, diante dos seus olhos, como saem os exilados.
    status: ia-sem-revisao
  '12:5':
    texto: Diante dos seus olhos, abre um buraco na parede e sai por ele.
    status: ia-sem-revisao
  '12:6':
    texto: Diante dos seus olhos, leva a bagagem ao ombro e sai ao escurecer; cobre o rosto para não ver
      a terra, pois fiz de ti um sinal para a casa de Israel.”
    status: ia-sem-revisao
  '12:7':
    texto: 'Fiz assim, como me fora ordenado: de dia tirei a minha bagagem, como bagagem de exilado; à
      tarde abri com a mão um buraco na parede; ao escurecer, saí, levando-a ao ombro, diante dos seus
      olhos.'
    status: ia-sem-revisao
  '12:8':
    texto: 'De manhã, a palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '12:9':
    texto: '“Filho do homem, não te perguntou a casa de Israel, a casa rebelde: ‘Que fazes?’'
    status: ia-sem-revisao
  '12:10':
    texto: 'Dize-lhes: Assim diz o Senhor Deus: Este oráculo diz respeito ao príncipe em Jerusalém e a
      toda a casa de Israel que está no meio dela.'
    status: ia-sem-revisao
  '12:11':
    texto: 'Dize: Eu sou o vosso sinal; como eu fiz, assim se fará com eles: irão para o exílio, para
      o cativeiro.'
    status: ia-sem-revisao
  '12:12':
    texto: O príncipe que está no meio deles levará a bagagem ao ombro, ao escurecer, e sairá; abrirão
      um buraco na parede para o fazer sair; cobrirá o rosto, para não ver a terra com os olhos.
    status: ia-sem-revisao
  '16:1':
    texto: 'A palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '16:2':
    texto: “Filho do homem, faze conhecer a Jerusalém as suas abominações.
    status: ia-sem-revisao
  '16:3':
    texto: 'Dirás: Assim diz o Senhor Deus a Jerusalém: Pela tua origem e pelo teu nascimento, és da terra
      de Canaã; teu pai era amorreu, e tua mãe, hitita.'
    status: ia-sem-revisao
  '16:4':
    texto: Quanto ao teu nascimento, no dia em que nasceste, não te cortaram o cordão umbilical, não te
      lavaram com água para te limpar, não te esfregaram com sal nem te envolveram em faixas.
    status: ia-sem-revisao
  '16:5':
    texto: Nenhum olho teve compaixão de ti para te fazer uma só dessas coisas por piedade; foste lançada
      ao campo aberto, com desprezo pela tua vida, no dia em que nasceste.
    status: ia-sem-revisao
  '16:6':
    texto: 'Passei junto de ti e te vi debatendo-te no teu sangue; e te disse, no teu sangue: ‘Vive!’
      Sim, disse-te, no teu sangue: ‘Vive!’'
    status: ia-sem-revisao
  '16:7':
    texto: Fiz-te crescer como a planta do campo; cresceste, tornaste-te grande e chegaste à plenitude
      da beleza; os teus seios se formaram, os teus cabelos cresceram; mas estavas nua e despida.
    status: ia-sem-revisao
  '16:8':
    texto: Passei junto de ti e te vi; eis que era o teu tempo, o tempo do amor. Estendi sobre ti a minha
      veste e cobri a tua nudez; jurei-te e fiz aliança contigo — oráculo do Senhor Deus — e tornaste-te
      minha.
    status: ia-sem-revisao
  '16:9':
    texto: Lavei-te com água, limpei de ti o sangue e te ungi com óleo.
    status: ia-sem-revisao
  '16:10':
    texto: Vesti-te com roupa bordada, calcei-te com couro fino, cingi-te com linho e te cobri de seda.
    status: ia-sem-revisao
  '16:11':
    texto: Enfeitei-te com adornos, pus pulseiras nos teus braços e um colar no teu pescoço.
    status: ia-sem-revisao
  '16:12':
    texto: Pus um anel no teu nariz, brincos nas tuas orelhas e uma coroa magnífica na tua cabeça.
    status: ia-sem-revisao
  '16:13':
    texto: Assim te enfeitaste de ouro e prata; as tuas vestes eram de linho fino, seda e bordados; comeste
      flor de farinha, mel e óleo; ficaste muito, muito bela, e chegaste à realeza.
    status: ia-sem-revisao
  '16:14':
    texto: A tua fama se espalhou entre as nações por causa da tua beleza, pois era perfeita, graças ao
      meu esplendor que eu pusera sobre ti — oráculo do Senhor Deus.
    status: ia-sem-revisao
  '16:15':
    texto: 'Mas confiaste na tua beleza e te prostituíste, valendo-te da tua fama; e prodigalizaste as
      tuas prostituições a todo o que passava: tua era a beleza.'
    status: ia-sem-revisao
  16:60:
    texto: Eu, porém, me lembrarei da minha aliança contigo nos dias da tua juventude e estabelecerei
      contigo uma aliança eterna.
    status: ia-sem-revisao
  16:63:
    texto: para que te lembres e te envergonhes, e nunca mais abras a boca por causa da tua humilhação,
      quando eu te tiver perdoado tudo o que fizeste — oráculo do Senhor Deus.”
    status: ia-sem-revisao
  '17:22':
    texto: 'Assim diz o Senhor Deus: Eu mesmo tomarei um broto do cimo do cedro alto e o plantarei; do
      mais alto dos seus ramos arrancarei um tenro e o plantarei sobre um monte alto e elevado.'
    status: ia-sem-revisao
  '17:23':
    texto: Eu o plantarei no monte alto de Israel; ele produzirá ramos e dará fruto e se tornará um cedro
      magnífico; debaixo dele habitarão aves de toda espécie, à sombra dos seus ramos descansarão.
    status: ia-sem-revisao
  '17:24':
    texto: Todas as árvores do campo saberão que eu, o Senhor, abaixei a árvore alta e elevei a árvore
      baixa, sequei a árvore verde e fiz florescer a árvore seca. Eu, o Senhor, o disse e o farei.
    status: ia-sem-revisao
  '18:1':
    texto: 'A palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '18:2':
    texto: '“Que tendes vós, que repetis este provérbio na terra de Israel: ‘Os pais comeram uvas verdes,
      e os dentes dos filhos ficaram embotados’?'
    status: ia-sem-revisao
  '18:3':
    texto: Por minha vida — oráculo do Senhor Deus —, não repetireis mais este provérbio em Israel.
    status: ia-sem-revisao
  '18:4':
    texto: 'Eis que todas as vidas me pertencem: tanto a vida do pai como a vida do filho me pertencem;
      quem pecar, esse morrerá.'
    status: ia-sem-revisao
  '18:5':
    texto: Se um homem é justo e pratica o direito e a justiça,
    status: ia-sem-revisao
  '18:6':
    texto: se não come nos montes nem levanta os olhos para os ídolos da casa de Israel, se não contamina
      a mulher do seu próximo nem se aproxima de uma mulher durante a sua impureza,
    status: ia-sem-revisao
  '18:7':
    texto: se não oprime ninguém, devolve o penhor ao devedor, não pratica roubo, dá o seu pão ao faminto
      e cobre de roupa o nu,
    status: ia-sem-revisao
  '18:8':
    texto: se não empresta a juros nem aceita usura, retira a mão da injustiça e julga com verdade entre
      um homem e outro,
    status: ia-sem-revisao
  '18:9':
    texto: 'se anda nos meus estatutos e guarda os meus juízos, praticando a fidelidade, esse é justo:
      certamente viverá — oráculo do Senhor Deus.'
    status: ia-sem-revisao
  '18:10':
    texto: Se gera um filho violento, derramador de sangue, que faz alguma dessas coisas contra o seu
      irmão,
    status: ia-sem-revisao
  '18:13':
    texto: 'emprestou a juros e recebeu usura: viverá? Não viverá! Praticou todas essas abominações: certamente
      morrerá, e o seu sangue cairá sobre ele.'
    partes:
    - 'emprestou a juros e recebeu usura: viverá? Não viverá!'
    - 'Praticou todas essas abominações: certamente morrerá, e o seu sangue cairá sobre ele.'
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '18:21':
    texto: Mas, se o ímpio se converter de todos os pecados que cometeu, guardar todos os meus estatutos
      e praticar o direito e a justiça, certamente viverá; não morrerá.
    status: ia-sem-revisao
  '18:22':
    texto: Não se recordará nenhuma das transgressões que cometeu; pela justiça que praticou, viverá.
    status: ia-sem-revisao
  '18:23':
    texto: Acaso me agrado eu da morte do ímpio — oráculo do Senhor Deus — e não, antes, de que se converta
      dos seus caminhos e viva?
    status: ia-sem-revisao
  '18:24':
    texto: Mas, se o justo se desviar da sua justiça e praticar a iniquidade, imitando todas as abominações
      que o ímpio pratica, viverá? Todas as obras de justiça que fez não serão lembradas; pela infidelidade
      que cometeu e pelo pecado que praticou, por eles morrerá.
    status: ia-sem-revisao
  '18:25':
    texto: 'Dizeis: ‘O caminho do Senhor não é correto.’ Ouvi, casa de Israel: é o meu caminho que não
      é correto? Não são os vossos caminhos que não são corretos?'
    status: ia-sem-revisao
  '18:26':
    texto: Quando o justo se desvia da sua justiça e pratica a iniquidade, morre por isso; por causa da
      iniquidade que praticou, morre.
    status: ia-sem-revisao
  '18:27':
    texto: E, quando o ímpio se converte da impiedade que praticou e pratica o direito e a justiça, ele
      salva a sua vida.
    status: ia-sem-revisao
  '18:28':
    texto: 'Reconsiderou e converteu-se de todas as suas transgressões que cometeu: certamente viverá;
      não morrerá.'
    status: ia-sem-revisao
  '18:30':
    texto: Por isso, eu vos julgarei, cada um segundo os seus caminhos, casa de Israel — oráculo do Senhor
      Deus. Convertei-vos e afastai-vos de todas as vossas transgressões, e a iniquidade não será a vossa
      ruína.
    status: ia-sem-revisao
  '18:31':
    texto: Lançai para longe de vós todas as transgressões que cometestes e formai para vós um coração
      novo e um espírito novo. Por que haveis de morrer, casa de Israel?
    status: ia-sem-revisao
  '18:32':
    texto: Pois não me agrado da morte de quem morre — oráculo do Senhor Deus. Convertei-vos, e vivei!”
    status: ia-sem-revisao
  '24:15':
    texto: 'A palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '24:16':
    texto: “Filho do homem, eis que de repente te tirarei o desejo dos teus olhos; não te lamentarás,
      nem chorarás, nem correrão as tuas lágrimas.
    status: ia-sem-revisao
  '24:17':
    texto: Suspira em silêncio, não faças luto pelos mortos; põe o turbante na cabeça e as sandálias nos
      pés; não cubras o bigode e não comas o pão dos que fazem luto.”
    status: ia-sem-revisao
  '24:18':
    texto: De manhã falei ao povo, e à tarde morreu a minha mulher; na manhã seguinte fiz como me fora
      ordenado.
    status: ia-sem-revisao
  '24:19':
    texto: 'O povo disse-me: “Não nos explicarás o que significa para nós o que fazes?”'
    status: ia-sem-revisao
  '24:20':
    texto: 'Respondi-lhes: “A palavra do Senhor foi-me dirigida:'
    status: ia-sem-revisao
  '24:21':
    texto: 'Dize à casa de Israel: Assim diz o Senhor Deus: Eis que profanarei o meu santuário, o orgulho
      da vossa força, o desejo dos vossos olhos e a ternura da vossa alma; e os vossos filhos e filhas
      que deixastes cairão à espada.'
    status: ia-sem-revisao
  '24:22':
    texto: 'Fareis como eu fiz: não cobrireis o bigode e não comereis o pão dos que fazem luto.'
    status: ia-sem-revisao
  '24:23':
    texto: Terei os vossos turbantes na cabeça e as sandálias nos pés; não vos lamentareis nem chorareis,
      mas definhareis pelas vossas culpas e gemereis uns com os outros.
    status: ia-sem-revisao
  '24:24':
    texto: 'Ezequiel será para vós um sinal: tudo o que ele fez, fareis quando isso acontecer; e sabereis
      que eu sou o Senhor Deus.”'
    status: ia-sem-revisao
  '28:1':
    texto: 'A palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '28:2':
    texto: '“Filho do homem, dize ao príncipe de Tiro: Assim diz o Senhor Deus: Porque o teu coração se
      exaltou e disseste: ‘Eu sou um deus, sentei-me no trono de Deus no coração dos mares’, sendo tu
      homem e não Deus, e tendo igualado o teu coração ao coração de Deus,'
    status: ia-sem-revisao
  '28:3':
    texto: eis que és mais sábio do que Daniel; nenhum segredo te é obscuro.
    status: ia-sem-revisao
  '28:4':
    texto: Com a tua sabedoria e a tua inteligência, ganhaste riquezas e amontoaste ouro e prata nos teus
      tesouros.
    status: ia-sem-revisao
  '28:5':
    texto: Pela grande sabedoria do teu comércio, multiplicaste as tuas riquezas, e o teu coração se exaltou
      por causa delas.
    status: ia-sem-revisao
  '28:6':
    texto: 'Por isso, assim diz o Senhor Deus: Porque igualaste o teu coração ao coração de Deus,'
    status: ia-sem-revisao
  '28:7':
    texto: eis que trarei contra ti estrangeiros, os mais violentos das nações; desembainharão as espadas
      contra a beleza da tua sabedoria e profanarão o teu esplendor.
    status: ia-sem-revisao
  '28:8':
    texto: Lançar-te-ão na cova, e morrerás da morte dos traspassados, no coração dos mares.
    status: ia-sem-revisao
  '28:9':
    texto: 'Dirás ainda: ‘Eu sou um deus’, diante dos que te matam, sendo tu homem e não Deus, nas mãos
      dos que te profanam?'
    status: ia-sem-revisao
  '28:10':
    texto: Morrerás da morte dos incircuncisos, pela mão de estrangeiros, porque eu o disse — oráculo
      do Senhor Deus.”
    status: ia-sem-revisao
  '33:7':
    texto: “Quanto a ti, filho do homem, fiz de ti sentinela da casa de Israel; quando ouvires uma palavra
      da minha boca, advertirás da minha parte.
    status: ia-sem-revisao
  '33:8':
    texto: 'Quando eu disser ao ímpio: ‘Ímpio, certamente morrerás’, e tu não falares para advertir o
      ímpio do seu caminho, esse ímpio morrerá na sua culpa, mas o seu sangue eu o pedirei da tua mão.'
    status: ia-sem-revisao
  '33:9':
    texto: Se, porém, advertires o ímpio do seu caminho para que se converta e ele não se converter, morrerá
      na sua culpa, mas tu salvarás a tua vida.”
    status: ia-sem-revisao
  '34:1':
    texto: 'A palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '34:2':
    texto: '“Filho do homem, profetiza contra os pastores de Israel, profetiza e dize-lhes, aos pastores:
      Assim diz o Senhor Deus: Ai dos pastores de Israel, que apascentam a si mesmos! Não é o rebanho
      que os pastores devem apascentar?'
    status: ia-sem-revisao
  '34:3':
    texto: Tomais o leite, vestis-vos com a lã, matais as ovelhas gordas, mas não apascentais o rebanho.
    status: ia-sem-revisao
  '34:4':
    texto: Não fortalecestes as ovelhas fracas, não curastes a doente, não enfaixastes a ferida, não reconduzistes
      a desgarrada, não procurastes a perdida; mas as dominastes com violência e dureza.
    status: ia-sem-revisao
  '34:5':
    texto: Por falta de pastor, elas se dispersaram e tornaram-se presa de todas as feras do campo; foram
      dispersadas.
    status: ia-sem-revisao
  '34:6':
    texto: As minhas ovelhas andam errantes por todos os montes e por todas as colinas altas; as minhas
      ovelhas estão dispersas por toda a face da terra, e não há quem as procure nem quem as busque.
    status: ia-sem-revisao
  '34:7':
    texto: 'Por isso, pastores, ouvi a palavra do Senhor:'
    status: ia-sem-revisao
  '34:8':
    texto: Por minha vida — oráculo do Senhor Deus —, porque as minhas ovelhas foram entregues à pilhagem
      e tornaram-se presa de todas as feras do campo, por falta de pastor, e os meus pastores não procuraram
      as minhas ovelhas, mas apascentaram-se a si mesmos e não apascentaram as minhas ovelhas,
    status: ia-sem-revisao
  '34:9':
    texto: 'por isso, pastores, ouvi a palavra do Senhor:'
    status: ia-sem-revisao
  '34:10':
    texto: 'Assim diz o Senhor Deus: Eis que estou contra os pastores; lhes pedirei contas das minhas
      ovelhas e farei que deixem de apascentar o rebanho; os pastores não apascentarão mais a si mesmos.
      Livrarei as minhas ovelhas da sua boca, e não serão mais o seu alimento.'
    status: ia-sem-revisao
  '34:11':
    texto: 'Pois assim diz o Senhor Deus: Eis que eu mesmo procurarei as minhas ovelhas e cuidarei delas.'
    status: ia-sem-revisao
  '34:12':
    texto: Como o pastor cuida do seu rebanho quando está no meio das suas ovelhas dispersas, assim cuidarei
      das minhas ovelhas e as livrarei de todos os lugares para onde se dispersaram num dia de nuvem e
      de escuridão.
    status: ia-sem-revisao
  '34:13':
    texto: Eu as tirarei dentre os povos, as reunirei dentre as terras e as levarei para a sua terra;
      as apascentarei nos montes de Israel, junto às correntes e em todas as moradas da terra.
    status: ia-sem-revisao
  '34:14':
    texto: Eu as apascentarei em boas pastagens, e nos altos montes de Israel será o seu aprisco; ali
      se deitarão em bom aprisco e pastarão em pastagens fartas nos montes de Israel.
    status: ia-sem-revisao
  '34:15':
    texto: Eu mesmo apascentarei as minhas ovelhas e eu as farei repousar — oráculo do Senhor Deus.
    status: ia-sem-revisao
  '34:16':
    texto: Procurarei a perdida, reconduzirei a desgarrada, enfaixarei a ferida e fortalecerei a doente;
      mas exterminarei a gorda e a forte. Eu as apascentarei com justiça.
    status: ia-sem-revisao
  '34:17':
    texto: 'Quanto a vós, minhas ovelhas, assim diz o Senhor Deus: Eis que eu julgo entre ovelha e ovelha,
      entre carneiros e bodes.'
    status: ia-sem-revisao
  '36:16':
    texto: 'A palavra do Senhor foi dirigida a mim:'
    status: ia-sem-revisao
  '36:17':
    texto: “Filho do homem, quando a casa de Israel habitava na sua terra, contaminou-a com a sua conduta
      e as suas ações; como a impureza da mulher em seu período foi a sua conduta diante de mim.
    partes:
    - “Filho do homem, quando a casa de Israel habitava na sua terra, contaminou-a com a sua conduta e
      as suas ações;
    - como a impureza da mulher em seu período foi a sua conduta diante de mim.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '36:18':
    texto: Derramei então o meu furor sobre eles, por causa do sangue que derramaram sobre a terra e porque
      a contaminaram com os seus ídolos.
    status: ia-sem-revisao
  '36:19':
    texto: Dispersei-os entre as nações e foram espalhados pelas terras; julguei-os segundo a sua conduta
      e as suas ações.
    status: ia-sem-revisao
  '36:20':
    texto: 'Chegaram às nações para onde foram e profanaram o meu santo nome, pois diziam deles: ‘Estes
      são o povo do Senhor, e saíram da sua terra.’'
    status: ia-sem-revisao
  '36:21':
    texto: Tive compaixão do meu santo nome, que a casa de Israel profanou entre as nações para onde foi.
    status: ia-sem-revisao
  '36:22':
    texto: 'Por isso, dize à casa de Israel: Assim diz o Senhor Deus: Não é por vossa causa que eu ajo,
      casa de Israel, mas por causa do meu santo nome, que profanastes entre as nações para onde fostes.'
    status: ia-sem-revisao
  '36:23':
    texto: Santificarei o meu grande nome, profanado entre as nações, que profanastes no meio delas; e
      as nações saberão que eu sou o Senhor — oráculo do Senhor Deus — quando eu me santificar em vós
      diante dos seus olhos.
    status: ia-sem-revisao
  '36:24':
    texto: Eu vos tomarei dentre as nações, vos reunirei de todas as terras e vos levarei para a vossa
      terra.
    status: ia-sem-revisao
  '36:25':
    texto: Aspergirei sobre vós água pura, e ficareis puros; de todas as vossas impurezas e de todos os
      vossos ídolos vos purificarei.
    status: ia-sem-revisao
  '36:26':
    texto: Eu vos darei um coração novo e porei em vós um espírito novo; tirarei do vosso corpo o coração
      de pedra e vos darei um coração de carne.
    status: ia-sem-revisao
  '36:27':
    texto: Porei em vós o meu espírito e farei que andeis nos meus estatutos e guardeis e pratiqueis os
      meus juízos.
    status: ia-sem-revisao
  '36:28':
    texto: Habitareis na terra que dei a vossos pais; sereis o meu povo, e eu serei o vosso Deus.
    status: ia-sem-revisao
  '37:1':
    texto: A mão do Senhor veio sobre mim; levou-me no espírito do Senhor e pôs-me no meio de um vale
      cheio de ossos.
    status: ia-sem-revisao
  '37:2':
    texto: Fez-me passar ao redor deles, e eis que eram muitíssimos na superfície do vale e estavam completamente
      secos.
    status: ia-sem-revisao
  '37:3':
    texto: 'Disse-me: “Filho do homem, poderão estes ossos reviver?” Respondi: “Senhor Deus, tu o sabes.”'
    status: ia-sem-revisao
  '37:4':
    texto: 'Disse-me: “Profetiza sobre estes ossos e dize-lhes: Ossos secos, ouvi a palavra do Senhor.'
    status: ia-sem-revisao
  '37:5':
    texto: 'Assim diz o Senhor Deus a estes ossos: Eis que vou fazer entrar em vós um espírito, e vivereis.'
    status: ia-sem-revisao
  '37:6':
    texto: Porei sobre vós nervos, farei crescer carne sobre vós, vos cobrirei de pele, porei em vós um
      espírito, e vivereis; e sabereis que eu sou o Senhor.”
    status: ia-sem-revisao
  '37:7':
    texto: Profetizei como me fora ordenado; e, enquanto eu profetizava, ouviu-se um ruído, um estrondo,
      e os ossos se aproximaram uns dos outros.
    status: ia-sem-revisao
  '37:8':
    texto: Olhei, e eis que sobre eles havia nervos, e a carne cresceu, e a pele os cobriu por cima; mas
      não havia espírito neles.
    status: ia-sem-revisao
  '37:9':
    texto: 'Disse-me: “Profetiza ao espírito, profetiza, filho do homem, e dize ao espírito: Assim diz
      o Senhor Deus: Vem dos quatro ventos, espírito, e sopra sobre estes mortos, para que vivam.”'
    status: ia-sem-revisao
  '37:10':
    texto: 'Profetizei como ele me ordenara; o espírito entrou neles, e eles viveram e ficaram de pé:
      um exército imenso, muito grande.'
    status: ia-sem-revisao
  '37:11':
    texto: 'Disse-me: “Filho do homem, estes ossos são toda a casa de Israel. Eis que dizem: ‘Os nossos
      ossos secaram, a nossa esperança pereceu, estamos perdidos.’'
    status: ia-sem-revisao
  '37:12':
    texto: 'Por isso, profetiza e dize-lhes: Assim diz o Senhor Deus: Eis que abro os vossos túmulos,
      faço-vos sair deles, meu povo, e vos levo para a terra de Israel.'
    status: ia-sem-revisao
  '37:13':
    texto: Sabereis que eu sou o Senhor, quando eu abrir os vossos túmulos e vos fizer sair deles, meu
      povo.
    status: ia-sem-revisao
  '37:14':
    texto: Porei em vós o meu espírito, e vivereis; vos colocarei na vossa terra, e sabereis que eu, o
      Senhor, o disse e o fiz — oráculo do Senhor.”
    status: ia-sem-revisao
  '37:21':
    texto: 'Dize-lhes: Assim diz o Senhor Deus: Eis que vou tomar os filhos de Israel dentre as nações
      para onde foram, os reunirei de todos os lados e os levarei para a sua terra.'
    status: ia-sem-revisao
  '37:22':
    texto: Farei deles uma só nação na terra, nos montes de Israel, e um só rei reinará sobre todos eles;
      não serão mais duas nações, nem se dividirão mais em dois reinos.
    status: ia-sem-revisao
  '37:23':
    texto: Não se contaminarão mais com os seus ídolos, com as suas abominações e com todas as suas transgressões;
      os salvarei de todas as moradas onde pecaram e os purificarei; e serão o meu povo, e eu serei o
      seu Deus.
    status: ia-sem-revisao
  '37:24':
    texto: O meu servo Davi será rei sobre eles, e todos terão um só pastor; andarão nos meus juízos,
      guardarão os meus estatutos e os porão em prática.
    status: ia-sem-revisao
  '37:25':
    texto: Habitarão na terra que dei ao meu servo Jacó, na qual habitaram os vossos pais; ali habitarão
      eles, os seus filhos e os filhos dos seus filhos, para sempre; e Davi, meu servo, será o seu príncipe
      para sempre.
    status: ia-sem-revisao
  '37:26':
    texto: Farei com eles uma aliança de paz, que será uma aliança eterna; os estabelecerei, os multiplicarei
      e porei o meu santuário no meio deles para sempre.
    status: ia-sem-revisao
  '37:27':
    texto: A minha morada estará com eles; eu serei o seu Deus, e eles serão o meu povo.
    status: ia-sem-revisao
  '37:28':
    texto: E as nações saberão que eu sou o Senhor, que santifico Israel, quando o meu santuário estiver
      no meio deles para sempre.
    status: ia-sem-revisao
  '43:1':
    texto: Levou-me à porta, a que olha para o oriente.
    status: ia-sem-revisao
  '43:2':
    texto: E eis que a glória do Deus de Israel vinha do oriente; a sua voz era como o ruído de muitas
      águas, e a terra resplandecia com a sua glória.
    status: ia-sem-revisao
  '43:3':
    texto: A visão que tive era como a visão que tinha visto quando vim destruir a cidade, e como a visão
      que tinha visto junto ao rio Cobar; e caí com o rosto em terra.
    status: ia-sem-revisao
  '43:4':
    texto: A glória do Senhor entrou no templo pela porta que olha para o oriente.
    status: ia-sem-revisao
  '43:5':
    texto: O espírito levantou-me e levou-me ao átrio interior; e eis que a glória do Senhor enchia o
      templo.
    status: ia-sem-revisao
  '43:6':
    texto: Ouvi alguém que me falava de dentro do templo, enquanto um homem estava de pé ao meu lado.
    status: ia-sem-revisao
  '43:7':
    texto: 'Disse-me: “Filho do homem, este é o lugar do meu trono e o lugar da planta dos meus pés, onde
      habitarei para sempre no meio dos filhos de Israel; e a casa de Israel não contaminará mais o meu
      santo nome, nem eles, nem os seus reis, com as suas prostituições e com os cadáveres dos seus reis
      nos seus lugares altos.'
    partes:
    - 'Disse-me: “Filho do homem, este é o lugar do meu trono e o lugar da planta dos meus pés, onde habitarei
      para sempre no meio dos filhos de Israel;'
    - e a casa de Israel não contaminará mais o meu santo nome, nem eles, nem os seus reis, com as suas
      prostituições e com os cadáveres dos seus reis nos seus lugares altos.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '47:1':
    texto: Levou-me de volta à entrada do templo, e eis que saía água de debaixo da soleira do templo,
      em direção ao oriente, pois a fachada do templo dava para o oriente; a água descia de debaixo do
      lado direito do templo, ao sul do altar.
    status: ia-sem-revisao
  '47:2':
    texto: Fez-me sair pelo caminho da porta do norte e levou-me ao redor, por fora, até a porta exterior,
      que olha para o oriente; e eis que a água corria do lado direito.
    status: ia-sem-revisao
  '47:3':
    texto: Quando o homem saiu para o oriente, tinha na mão um cordel de medir; mediu mil côvados e fez-me
      passar pela água, que dava pelos tornozelos.
    status: ia-sem-revisao
  '47:4':
    texto: Mediu mais mil e fez-me passar pela água, que dava pelos joelhos; mediu mais mil e fez-me passar,
      e a água dava pela cintura.
    status: ia-sem-revisao
  '47:5':
    texto: 'Mediu mais mil: era uma torrente que eu não podia atravessar, porque a água tinha subido,
      água para se nadar, uma torrente intransponível.'
    status: ia-sem-revisao
  '47:6':
    texto: 'Disse-me: “Viste, filho do homem?” Depois levou-me e fez-me voltar à margem da torrente.'
    status: ia-sem-revisao
  '47:7':
    texto: Ao voltar, eis que na margem da torrente havia muitíssimas árvores, de um lado e do outro.
    status: ia-sem-revisao
  '47:8':
    texto: 'Disse-me: “Estas águas saem para a região oriental, descem à Arabá e entram no mar; desembocando
      no mar, as águas do mar tornam-se saudáveis.'
    status: ia-sem-revisao
  '47:9':
    texto: Todo ser vivo que se move, aonde quer que chegue a torrente, viverá; haverá peixe em grande
      quantidade, porque estas águas chegam até lá e tornam saudáveis as outras; e viverá tudo aonde chegar
      a torrente.
    status: ia-sem-revisao
  '47:12':
    texto: Junto à torrente, de um lado e do outro, nascerão árvores frutíferas de toda espécie; as suas
      folhas não murcharão, e os seus frutos não faltarão; produzirão frutos novos cada mês, porque as
      suas águas saem do santuário; o seu fruto servirá de alimento, e as suas folhas, de remédio.
    status: ia-sem-revisao
