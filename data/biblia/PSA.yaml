livro: PSA
fonte: oshb
versiculos:
  '1:1':
    texto: Feliz o homem que não anda segundo o conselho dos ímpios, nem se detém no caminho dos pecadores,
      nem se assenta na roda dos zombadores.
    status: ia-sem-revisao
  '1:2':
    texto: Mas seu prazer está na lei do Senhor, e na sua lei medita dia e noite.
    status: ia-sem-revisao
  '1:3':
    texto: Será como árvore plantada junto a correntes de águas, que dá o seu fruto no tempo certo, e
      cuja folha não murcha; tudo o que fizer prosperará.
    status: ia-sem-revisao
  '1:4':
    texto: Não são assim os ímpios; são como a palha que o vento dispersa.
    status: ia-sem-revisao
  '1:6':
    texto: Pois o Senhor conhece o caminho dos justos, mas o caminho dos ímpios perecerá.
    status: ia-sem-revisao
  '2:1':
    texto: Por que se agitam as nações, e os povos tramam em vão?
    status: ia-sem-revisao
  '2:2':
    texto: 'Os reis da terra se levantam, e os príncipes conspiram juntos contra o Senhor e contra o seu
      ungido:'
    status: ia-sem-revisao
  '2:3':
    texto: “Rompamos as suas correntes e lancemos de nós as suas cordas!”
    status: ia-sem-revisao
  '2:4':
    texto: Aquele que habita nos céus ri; o Senhor zomba deles.
    status: ia-sem-revisao
  '2:5':
    texto: 'Então lhes fala na sua ira e, no seu furor, os aterra:'
    status: ia-sem-revisao
  '2:6':
    texto: “Eu mesmo estabeleci o meu rei sobre Sião, o meu santo monte.”
    status: ia-sem-revisao
  '2:7':
    texto: 'Proclamarei o decreto do Senhor: ele me disse: “Tu és meu filho; eu hoje te gerei.'
    status: ia-sem-revisao
  '2:8':
    texto: Pede-me, e te darei as nações por herança e as extremidades da terra por propriedade.
    status: ia-sem-revisao
  '2:9':
    texto: Com cetro de ferro as quebrarás, como vaso de oleiro as despedaçarás.”
    status: ia-sem-revisao
  '2:10':
    texto: Agora, ó reis, sede prudentes; deixai-vos corrigir, juízes da terra.
    status: ia-sem-revisao
  '2:11':
    texto: Servi ao Senhor com temor e exultai com tremor.
    status: ia-sem-revisao
  '3:2':
    texto: Senhor, como são numerosos os meus adversários! Muitos se levantam contra mim.
    status: ia-sem-revisao
  '3:3':
    texto: 'Muitos dizem de mim: “Para ele não há salvação em Deus.” Pausa.'
    status: ia-sem-revisao
  '3:4':
    texto: Mas tu, Senhor, és escudo ao meu redor, minha glória, tu que me levantas a cabeça.
    status: ia-sem-revisao
  '3:5':
    texto: Com a minha voz clamo ao Senhor, e ele me responde do seu santo monte. Pausa.
    status: ia-sem-revisao
  '3:6':
    texto: Eu me deitei e adormeci; despertei, porque o Senhor me sustenta.
    status: ia-sem-revisao
  '3:7':
    texto: Não temo as multidões do povo que se postam contra mim ao redor.
    status: ia-sem-revisao
  '3:8':
    texto: Levanta-te, Senhor! Salva-me, meu Deus! Pois feriste no rosto todos os meus inimigos, quebraste
      os dentes dos ímpios.
    partes:
    - Levanta-te, Senhor! Salva-me, meu Deus!
    - Pois feriste no rosto todos os meus inimigos, quebraste os dentes dos ímpios.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '4:2':
    texto: Quando eu clamo, responde-me, Deus da minha justiça; na angústia me deste largueza; tem piedade
      de mim e escuta a minha oração.
    status: ia-sem-revisao
  '4:3':
    texto: Filhos de homens, até quando a minha honra será ultrajada? Até quando amareis a vaidade e procurareis
      a mentira? Pausa.
    status: ia-sem-revisao
  '4:4':
    texto: Sabei que o Senhor separou para si o seu fiel; o Senhor me ouve quando clamo a ele.
    status: ia-sem-revisao
  '4:5':
    texto: Tremei, e não pequeis; falai no vosso coração, sobre o vosso leito, e calai-vos. Pausa.
    status: ia-sem-revisao
  '4:7':
    texto: 'Muitos dizem: “Quem nos mostrará o bem?” Levanta sobre nós, Senhor, a luz do teu rosto.'
    status: ia-sem-revisao
  '4:8':
    texto: Puseste mais alegria no meu coração do que quando abundam o trigo e o vinho novo deles.
    status: ia-sem-revisao
  '4:9':
    texto: Em paz me deito e logo adormeço, porque só tu, Senhor, me fazes habitar em segurança.
    status: ia-sem-revisao
  '5:2':
    texto: Dá ouvidos às minhas palavras, Senhor; atende ao meu gemido.
    status: ia-sem-revisao
  '5:3':
    texto: Presta atenção ao clamor da minha súplica, meu Rei e meu Deus, pois a ti eu oro.
    partes:
    - Presta atenção ao clamor da minha súplica, meu Rei e meu Deus,
    - pois a ti eu oro.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '5:5':
    texto: Pois tu não és um Deus que se agrade da maldade; o mal não habita junto de ti.
    status: ia-sem-revisao
  '5:6':
    texto: Os arrogantes não subsistem diante dos teus olhos; detestas todos os que praticam a iniquidade.
    partes:
    - Os arrogantes não subsistem diante dos teus olhos;
    - detestas todos os que praticam a iniquidade.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '5:7':
    texto: Destróis os que falam mentira; o Senhor abomina o homem sanguinário e fraudulento.
    status: ia-sem-revisao
  '5:8':
    texto: Eu, porém, pela abundância da tua misericórdia entro na tua casa; prostro-me diante do teu
      santo templo, em temor de ti.
    status: ia-sem-revisao
  '5:12':
    texto: Alegrem-se todos os que em ti se refugiam; cantem de júbilo para sempre. Protege-os, e exultem
      em ti os que amam o teu nome.
    status: ia-sem-revisao
  '7:2':
    texto: Senhor, meu Deus, em ti me refugio; salva-me de todos os que me perseguem e livra-me,
    status: ia-sem-revisao
  '7:3':
    texto: para que não me despedacem como leão, arrebatando-me sem que haja quem me livre.
    status: ia-sem-revisao
  '7:9':
    texto: O Senhor julga os povos. Julga-me, Senhor, segundo a minha justiça e segundo a minha integridade.
    partes:
    - O Senhor julga os povos.
    - Julga-me, Senhor, segundo a minha justiça
    - e segundo a minha integridade.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '7:10':
    texto: Acabe, peço-te, a maldade dos ímpios, e firma o justo, tu que provas os corações e os rins,
      ó Deus justo.
    status: ia-sem-revisao
  '7:11':
    texto: O meu escudo está em Deus, que salva os retos de coração.
    status: ia-sem-revisao
  '7:12':
    texto: Deus é juiz justo, um Deus que se indigna todos os dias.
    status: ia-sem-revisao
  '8:2':
    texto: Senhor, nosso Senhor, como é majestoso o teu nome em toda a terra! Tu, cuja glória se estende
      acima dos céus!
    partes:
    - Senhor, nosso Senhor, como é majestoso o teu nome em toda a terra!
    - Tu, cuja glória se estende acima dos céus!
    status: ia-sem-revisao
  '8:3':
    texto: Da boca das crianças e dos que ainda mamam firmaste um baluarte, por causa dos teus adversários,
      para fazer calar o inimigo e o vingador.
    partes:
    - Da boca das crianças e dos que ainda mamam firmaste um baluarte, por causa dos teus adversários,
    - para fazer calar o inimigo e o vingador.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '8:4':
    texto: Quando vejo os teus céus, obra dos teus dedos, a lua e as estrelas que fixaste,
    status: ia-sem-revisao
  '8:5':
    texto: que é o homem, para te lembrares dele? E o filho do homem, para dele cuidares?
    status: ia-sem-revisao
  '8:6':
    texto: Tu o fizeste pouco menor que Deus e o coroaste de glória e de esplendor.
    status: ia-sem-revisao
    observacao: O hebraico traz Elohim (“Deus”); a Vulgata e a Septuaginta trazem “anjos”.
  '8:7':
    texto: 'Deste-lhe domínio sobre as obras das tuas mãos; tudo puseste debaixo dos seus pés:'
    partes:
    - Deste-lhe domínio sobre as obras das tuas mãos;
    - 'tudo puseste debaixo dos seus pés:'
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '8:8':
    texto: ovelhas e bois, todos eles, e também os animais do campo,
    status: ia-sem-revisao
  '8:9':
    texto: as aves do céu e os peixes do mar, tudo o que percorre as veredas dos mares.
    status: ia-sem-revisao
  '9:2':
    texto: Darei graças ao Senhor de todo o meu coração; contarei todas as tuas maravilhas.
    status: ia-sem-revisao
  '9:3':
    texto: Alegrar-me-ei e exultarei em ti; cantarei ao teu nome, ó Altíssimo.
    status: ia-sem-revisao
  '9:4':
    texto: Quando os meus inimigos recuam, tropeçam e perecem diante de ti.
    status: ia-sem-revisao
  '9:6':
    texto: Repreendeste as nações, destruíste o ímpio; apagaste o nome deles para sempre e eternamente.
    status: ia-sem-revisao
  '9:8':
    texto: Mas o Senhor reina para sempre; firmou o seu trono para o julgamento.
    partes:
    - Mas o Senhor reina para sempre;
    - firmou o seu trono
    - para o julgamento.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '9:9':
    texto: Ele mesmo julgará o mundo com justiça; julgará os povos com retidão.
    status: ia-sem-revisao
  '9:10':
    texto: O Senhor seja refúgio para o oprimido, refúgio nos tempos de angústia.
    status: ia-sem-revisao
  '9:11':
    texto: Confiam em ti os que conhecem o teu nome, pois não abandonaste, Senhor, os que te buscam.
    status: ia-sem-revisao
  '9:12':
    texto: Cantai ao Senhor, que habita em Sião; anunciai entre os povos as suas obras.
    status: ia-sem-revisao
  '9:13':
    texto: Pois aquele que pede contas do sangue deles se lembrou; não esqueceu o clamor dos aflitos.
    status: ia-sem-revisao
  '9:16':
    texto: As nações afundaram na cova que fizeram; na rede que esconderam, prendeu-se o seu pé.
    status: ia-sem-revisao
  '9:19':
    texto: Pois o pobre não será esquecido para sempre, nem a esperança dos aflitos perecerá eternamente.
    status: ia-sem-revisao
  '10:1':
    texto: Por que, Senhor, ficas ao longe e te escondes nos tempos de angústia?
    status: ia-sem-revisao
  '10:2':
    texto: Na sua soberba, o ímpio persegue o pobre; que sejam apanhados nas tramas que urdiram.
    status: ia-sem-revisao
  '10:3':
    texto: Pois o ímpio se gaba do desejo da sua alma; o ganancioso abençoa e despreza o Senhor.
    status: ia-sem-revisao
  '10:4':
    texto: 'O ímpio, na sua altivez, não investiga: “Não há Deus”; este é todo o seu pensamento.'
    status: ia-sem-revisao
  '10:7':
    texto: A sua boca está cheia de maldição, de enganos e de opressão; debaixo da sua língua há dano
      e iniquidade.
    status: ia-sem-revisao
  '10:8':
    texto: Fica à espreita nas aldeias, nos lugares escondidos mata o inocente; os seus olhos espreitam
      o infeliz.
    status: ia-sem-revisao
  '10:14':
    texto: Tu o viste, pois observas o sofrimento e a aflição, para tomá-los em tuas mãos. A ti o infeliz
      se entrega; tu és o auxílio do órfão.
    status: ia-sem-revisao
  '11:4':
    texto: O Senhor está no seu santo templo; o trono do Senhor está nos céus. Os seus olhos observam,
      as suas pálpebras examinam os filhos dos homens.
    status: ia-sem-revisao
  '11:5':
    texto: O Senhor examina o justo e o ímpio; e quem ama a violência, a sua alma o detesta.
    status: ia-sem-revisao
  '11:7':
    texto: Pois o Senhor é justo e ama a justiça; os retos contemplarão o seu rosto.
    status: ia-sem-revisao
  '12:2':
    texto: Salva-nos, Senhor, pois o fiel já não existe; desapareceram os homens leais entre os filhos
      dos homens.
    status: ia-sem-revisao
  '12:3':
    texto: Falam mentira uns aos outros; com lábios lisonjeiros e coração duplo falam.
    status: ia-sem-revisao
  '12:4':
    texto: Corte o Senhor todos os lábios lisonjeiros, a língua que fala com arrogância,
    status: ia-sem-revisao
  '12:5':
    texto: 'os que dizem: “Pela nossa língua prevaleceremos; os nossos lábios são nossos; quem será senhor
      sobre nós?”'
    status: ia-sem-revisao
  '12:7':
    texto: As palavras do Senhor são palavras puras, prata depurada em cadinho de barro, refinada sete
      vezes.
    status: ia-sem-revisao
  '12:8':
    texto: Tu, Senhor, os guardarás, tu nos protegerás desta geração para sempre.
    status: ia-sem-revisao
  '13:4':
    texto: Olha, responde-me, Senhor, meu Deus; ilumina os meus olhos, para que eu não adormeça na morte,
    status: ia-sem-revisao
  '13:5':
    texto: 'para que o meu inimigo não diga: “Eu o venci”, nem os meus adversários exultem se eu vacilar.'
    status: ia-sem-revisao
  '13:6':
    texto: Eu, porém, confio na tua misericórdia; meu coração exultará na tua salvação. Cantarei ao Senhor,
      porque me fez bem.
    status: ia-sem-revisao
  '15:2':
    texto: Aquele que anda sem culpa, pratica a justiça e fala a verdade de coração;
    status: ia-sem-revisao
  '15:3':
    texto: que não calunia com a sua língua, que não faz mal ao seu próximo e não lança ultraje contra
      o seu vizinho;
    partes:
    - que não calunia com a sua língua,
    - que não faz mal ao seu próximo
    - e não lança ultraje contra o seu vizinho;
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '15:4':
    texto: a seus olhos o réprobo é desprezível, mas honra os que temem o Senhor; jura com dano próprio
      e não se retrata;
    partes:
    - a seus olhos o réprobo é desprezível,
    - mas honra os que temem o Senhor; jura com dano próprio e não se retrata;
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '15:5':
    texto: que não empresta o seu dinheiro a juros nem aceita suborno contra o inocente. Quem assim procede
      jamais vacilará.
    status: ia-sem-revisao
  '16:1':
    texto: Guarda-me, ó Deus, pois em ti me refugio.
    titulo: Poema de Davi.
    status: ia-sem-revisao
  '16:2':
    texto: 'Disse ao Senhor: “Tu és o meu Senhor; não há bem para mim fora de ti.”'
    partes:
    - 'Disse ao Senhor: “Tu és o meu Senhor;'
    - não há bem para mim fora de ti.”
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '16:4':
    texto: Multiplicam-se as dores dos que correm atrás de outros deuses; não derramarei as suas libações
      de sangue, nem tomarei os seus nomes nos meus lábios.
    status: ia-sem-revisao
  '16:5':
    texto: O Senhor é a porção da minha herança e do meu cálice; tu sustentas a minha sorte.
    status: ia-sem-revisao
  '16:7':
    texto: Bendigo o Senhor, que me aconselha; até de noite o meu íntimo me instrui.
    status: ia-sem-revisao
  '16:8':
    texto: Tenho sempre o Senhor diante de mim; estando ele à minha direita, não vacilarei.
    status: ia-sem-revisao
  '16:9':
    texto: Por isso o meu coração se alegra e a minha glória exulta; também o meu corpo repousa em segurança.
    status: ia-sem-revisao
  '16:10':
    texto: Pois não abandonarás a minha vida no abismo, nem permitirás que o teu fiel veja a cova.
    status: ia-sem-revisao
  '16:11':
    texto: Far-me-ás conhecer a vereda da vida; a plenitude de alegrias está diante do teu rosto, delícias
      à tua direita para sempre.
    status: ia-sem-revisao
  '17:1':
    texto: Ouve, Senhor, a causa justa; atende ao meu clamor; presta ouvidos à minha oração, que não sai
      de lábios enganadores.
    titulo: Oração de Davi.
    status: ia-sem-revisao
  '17:2':
    texto: Que o meu julgamento venha de ti; que os teus olhos vejam a retidão.
    status: ia-sem-revisao
  '17:3':
    texto: Provaste o meu coração, visitaste-me de noite, examinaste-me pelo fogo e nada achaste; a minha
      boca não transgride.
    status: ia-sem-revisao
  '17:5':
    texto: Os meus passos se firmaram nas tuas veredas; os meus pés não vacilaram.
    status: ia-sem-revisao
  '17:6':
    texto: Eu te invoco, pois tu me respondes, ó Deus; inclina o teu ouvido para mim, escuta as minhas
      palavras.
    status: ia-sem-revisao
  '17:7':
    texto: Mostra as maravilhas da tua misericórdia, tu que salvas, pela tua destra, os que se refugiam
      em ti dos que se levantam contra eles.
    status: ia-sem-revisao
  '17:8':
    texto: Guarda-me como a pupila dos olhos; esconde-me à sombra das tuas asas.
    status: ia-sem-revisao
  '17:15':
    texto: Eu, porém, na justiça contemplarei o teu rosto; ao despertar, saciar-me-ei com a tua imagem.
    status: ia-sem-revisao
  '18:2':
    texto: 'E disse: “Eu te amo, Senhor, minha força.”'
    status: ia-sem-revisao
  '18:3':
    texto: O Senhor é a minha rocha, a minha fortaleza e o meu libertador; meu Deus, meu rochedo, em quem
      me refugio, meu escudo e a força da minha salvação, meu baluarte.
    partes:
    - O Senhor é a minha rocha,
    - a minha fortaleza
    - e o meu libertador;
    - meu Deus, meu rochedo, em quem me refugio,
    - meu escudo e a força da minha salvação,
    - meu baluarte.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '18:4':
    texto: Invoco o Senhor, digno de louvor, e fico a salvo dos meus inimigos.
    status: ia-sem-revisao
  '18:5':
    texto: Cercaram-me as cordas da morte, e as torrentes de Belial me apavoraram.
    status: ia-sem-revisao
  '18:6':
    texto: As cordas do abismo me envolveram, os laços da morte me surpreenderam.
    status: ia-sem-revisao
  '18:7':
    texto: Na minha angústia invoquei o Senhor, e a meu Deus gritei por socorro; do seu templo ouviu a
      minha voz, e o meu grito chegou aos seus ouvidos.
    status: ia-sem-revisao
  '18:31':
    texto: O caminho de Deus é perfeito; a palavra do Senhor é provada no fogo; ele é escudo para todos
      os que nele se refugiam.
    status: ia-sem-revisao
  '18:47':
    texto: Viva o Senhor! Bendito seja o meu rochedo! Seja exaltado o Deus da minha salvação.
    status: ia-sem-revisao
  '18:50':
    texto: Por isso te darei graças entre as nações, Senhor, e cantarei ao teu nome.
    status: ia-sem-revisao
  '18:51':
    texto: Ele engrandece as vitórias do seu rei e usa de misericórdia para com o seu ungido, para com
      Davi e a sua descendência, para sempre.
    partes:
    - Ele engrandece as vitórias do seu rei
    - e usa de misericórdia para com o seu ungido, para com Davi e a sua descendência, para sempre.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '19:2':
    texto: Os céus proclamam a glória de Deus, e o firmamento anuncia a obra das suas mãos.
    status: ia-sem-revisao
  '19:3':
    texto: Um dia derrama a mensagem a outro dia, e uma noite revela conhecimento a outra noite.
    status: ia-sem-revisao
  '19:4':
    texto: Não há fala nem palavras, nem se ouve a sua voz;
    status: ia-sem-revisao
  '19:5':
    texto: por toda a terra se estende o seu alcance, e até os confins do mundo as suas palavras. Ali
      pôs uma tenda para o sol.
    partes:
    - por toda a terra se estende o seu alcance,
    - e até os confins do mundo as suas palavras. Ali pôs uma tenda para o sol.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '19:8':
    texto: A lei do Senhor é perfeita e reconforta a alma; o testemunho do Senhor é fiel e dá sabedoria
      ao simples.
    status: ia-sem-revisao
  '19:9':
    texto: Os preceitos do Senhor são retos e alegram o coração; o mandamento do Senhor é puro e ilumina
      os olhos.
    status: ia-sem-revisao
  '19:10':
    texto: O temor do Senhor é puro e permanece para sempre; os juízos do Senhor são verdadeiros, todos
      igualmente justos.
    status: ia-sem-revisao
  '19:11':
    texto: São mais desejáveis do que o ouro, do que muito ouro fino; mais doces do que o mel, do que
      o favo que escorre.
    status: ia-sem-revisao
  '19:12':
    texto: Também o teu servo é por eles advertido; em guardá-los há grande recompensa.
    status: ia-sem-revisao
  '19:13':
    texto: Quem pode discernir os próprios erros? Purifica-me das faltas ocultas.
    status: ia-sem-revisao
  '19:14':
    texto: Preserva também o teu servo da soberba, para que ela não me domine; então serei íntegro e livre
      de grande transgressão.
    status: ia-sem-revisao
  '19:15':
    texto: Sejam agradáveis diante de ti as palavras da minha boca e a meditação do meu coração, Senhor,
      minha rocha e meu redentor.
    status: ia-sem-revisao
  '21:2':
    texto: Senhor, o rei se alegra na tua força; e como exulta muito na tua salvação!
    status: ia-sem-revisao
  '21:3':
    texto: Concedeste-lhe o desejo do seu coração e não recusaste o pedido dos seus lábios. Pausa.
    status: ia-sem-revisao
  '21:4':
    texto: Pois vais ao seu encontro com bênçãos de bondade; pões na sua cabeça uma coroa de ouro puro.
    status: ia-sem-revisao
  '21:5':
    texto: 'Pediu-te vida, e a deste a ele: longos dias, para sempre e eternamente.'
    status: ia-sem-revisao
  '21:6':
    texto: Grande é a sua glória pela tua salvação; de esplendor e majestade o revestes.
    status: ia-sem-revisao
  '21:7':
    texto: Pois o fazes bênção para sempre e o alegras com a alegria da tua presença.
    status: ia-sem-revisao
  '22:8':
    texto: 'Todos os que me veem zombam de mim; torcem os lábios, balançam a cabeça:'
    status: ia-sem-revisao
  '22:9':
    texto: “Confiou no Senhor; que ele o livre! Que o salve, já que nele se compraz!”
    status: ia-sem-revisao
  '22:17':
    texto: Cães me cercaram, um bando de malfeitores me envolveu; furaram as minhas mãos e os meus pés.
    status: ia-sem-revisao
  '22:18':
    texto: Posso contar todos os meus ossos; eles me olham e me observam.
    partes:
    - Posso contar todos os meus ossos;
    - eles me olham e me observam.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '22:19':
    texto: Repartem entre si as minhas vestes e lançam sorte sobre a minha túnica.
    status: ia-sem-revisao
  '22:20':
    texto: Tu, porém, Senhor, não te afastes; força minha, vem depressa em meu auxílio.
    status: ia-sem-revisao
  '22:23':
    texto: Anunciarei o teu nome aos meus irmãos; no meio da assembleia te louvarei.
    status: ia-sem-revisao
  '22:24':
    texto: Vós que temeis o Senhor, louvai-o; descendência toda de Jacó, glorificai-o; temei-o, descendência
      toda de Israel.
    status: ia-sem-revisao
  '22:26':
    texto: De ti vem o meu louvor na grande assembleia; cumprirei os meus votos diante dos que o temem.
    partes:
    - De ti vem o meu louvor na grande assembleia;
    - cumprirei os meus votos diante dos que o temem.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '22:27':
    texto: 'Os pobres comerão e ficarão saciados; louvarão o Senhor os que o buscam: viva o vosso coração
      para sempre!'
    status: ia-sem-revisao
  '22:28':
    texto: Lembrar-se-ão e voltarão ao Senhor todos os confins da terra, e diante de ti se prostrarão
      todas as famílias das nações.
    status: ia-sem-revisao
  '22:29':
    texto: Pois do Senhor é o reino; ele governa as nações.
    status: ia-sem-revisao
  '22:30':
    texto: Todos os grandes da terra comerão e se prostrarão; diante dele se curvarão todos os que descem
      ao pó, aquele que não pode conservar a própria vida.
    partes:
    - Todos os grandes da terra comerão e se prostrarão;
    - diante dele se curvarão todos os que descem ao pó, aquele que não pode conservar a própria vida.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '22:31':
    texto: A descendência o servirá; falar-se-á do Senhor à geração futura.
    status: ia-sem-revisao
  '22:32':
    texto: 'Virão e anunciarão a sua justiça ao povo que há de nascer: eis o que ele fez.'
    status: ia-sem-revisao
  '23:1':
    texto: O Senhor é o meu pastor; nada me faltará.
    titulo: Salmo de Davi.
    status: ia-sem-revisao
  '23:2':
    texto: Faz-me repousar em verdes pastagens, conduz-me a águas tranquilas.
    status: ia-sem-revisao
  '23:3':
    texto: Restaura-me a alma, guia-me por caminhos justos por causa do seu nome.
    partes:
    - Restaura-me a alma,
    - guia-me por caminhos justos por causa do seu nome.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '23:4':
    texto: Ainda que eu caminhe por vale tenebroso, não temerei mal algum, pois tu estás comigo; o teu
      bastão e o teu cajado me consolam.
    status: ia-sem-revisao
  '23:5':
    texto: Preparas diante de mim uma mesa à vista dos meus adversários; unges com óleo a minha cabeça,
      e o meu cálice transborda.
    status: ia-sem-revisao
  '23:6':
    texto: Sim, bondade e misericórdia me seguirão todos os dias da minha vida, e habitarei na casa do
      Senhor por longos dias.
    status: ia-sem-revisao
  '24:1':
    texto: Do Senhor é a terra e tudo o que ela contém, o mundo e os que nele habitam.
    titulo: De Davi. Salmo.
    status: ia-sem-revisao
  '24:2':
    texto: Pois foi ele quem a fundou sobre os mares e a firmou sobre os rios.
    status: ia-sem-revisao
  '24:3':
    texto: Quem subirá ao monte do Senhor? Quem permanecerá no seu santo lugar?
    status: ia-sem-revisao
  '24:4':
    texto: Quem tem as mãos limpas e o coração puro, quem não entrega a sua alma à vaidade nem jura com
      engano.
    partes:
    - Quem tem as mãos limpas e o coração puro,
    - quem não entrega a sua alma à vaidade nem jura com engano.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '24:5':
    texto: Esse receberá a bênção do Senhor e a justiça do Deus da sua salvação.
    status: ia-sem-revisao
  '24:6':
    texto: Tal é a geração dos que o buscam, dos que procuram a tua face, Deus de Jacó. Pausa.
    status: ia-sem-revisao
  '24:7':
    texto: Levantai, ó portas, os vossos umbrais; erguei-vos, portais antigos, para que entre o rei da
      glória.
    status: ia-sem-revisao
  '24:8':
    texto: Quem é esse rei da glória? O Senhor, forte e poderoso, o Senhor, poderoso na guerra.
    status: ia-sem-revisao
  '24:9':
    texto: Levantai, ó portas, os vossos umbrais; erguei-vos, portais antigos, para que entre o rei da
      glória.
    status: ia-sem-revisao
  '24:10':
    texto: 'Quem é esse rei da glória? O Senhor dos exércitos: ele é o rei da glória. Pausa.'
    status: ia-sem-revisao
  '25:2':
    texto: Meu Deus, em ti confio; não seja eu envergonhado, nem exultem sobre mim os meus inimigos.
    status: ia-sem-revisao
  '25:3':
    texto: Também nenhum dos que esperam em ti será envergonhado; serão envergonhados os que traem sem
      motivo.
    status: ia-sem-revisao
  '25:4':
    texto: Faze-me conhecer, Senhor, os teus caminhos; ensina-me as tuas veredas.
    status: ia-sem-revisao
  '25:5':
    texto: Conduze-me na tua verdade e ensina-me, pois tu és o Deus da minha salvação; em ti espero o
      dia todo.
    partes:
    - Conduze-me na tua verdade e ensina-me,
    - pois tu és o Deus da minha salvação; em ti espero o dia todo.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '25:6':
    texto: Lembra-te, Senhor, das tuas misericórdias e do teu amor, pois são de sempre.
    status: ia-sem-revisao
  '25:7':
    texto: Não te lembres dos pecados da minha juventude nem das minhas transgressões; lembra-te de mim
      segundo a tua misericórdia, por causa da tua bondade, Senhor.
    partes:
    - Não te lembres dos pecados da minha juventude nem das minhas transgressões;
    - lembra-te de mim segundo a tua misericórdia,
    - por causa da tua bondade, Senhor.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '25:8':
    texto: O Senhor é bom e reto; por isso mostra o caminho aos pecadores.
    status: ia-sem-revisao
  '25:9':
    texto: Guia os humildes na justiça e ensina aos humildes o seu caminho.
    status: ia-sem-revisao
  '25:10':
    texto: Todas as veredas do Senhor são misericórdia e fidelidade para os que guardam a sua aliança
      e os seus testemunhos.
    status: ia-sem-revisao
  '25:14':
    texto: A intimidade do Senhor é para os que o temem, e a sua aliança, para lhes ser dada a conhecer.
    status: ia-sem-revisao
  '26:2':
    texto: Examina-me, Senhor, e prova-me; purifica no fogo os meus rins e o meu coração.
    status: ia-sem-revisao
  '26:3':
    texto: Pois a tua misericórdia está diante dos meus olhos, e ando na tua verdade.
    status: ia-sem-revisao
  '26:9':
    texto: Não juntes a minha alma à dos pecadores, nem a minha vida à dos homens sanguinários,
    status: ia-sem-revisao
  '26:10':
    texto: em cujas mãos há maldade e cuja direita está cheia de suborno.
    status: ia-sem-revisao
  '26:11':
    texto: Eu, porém, ando na minha integridade; redime-me e tem piedade de mim.
    status: ia-sem-revisao
  '26:12':
    texto: O meu pé está firme em terreno plano; nas assembleias bendirei o Senhor.
    status: ia-sem-revisao
  '27:1':
    texto: 'O Senhor é a minha luz e a minha salvação: de quem terei medo? O Senhor é a fortaleza da minha
      vida: diante de quem tremerei?'
    titulo: De Davi.
    status: ia-sem-revisao
  '27:2':
    texto: Quando os malfeitores avançam contra mim para devorar a minha carne, são os meus adversários
      e inimigos que tropeçam e caem.
    status: ia-sem-revisao
  '27:3':
    texto: Ainda que um exército acampe contra mim, o meu coração não temerá; ainda que a guerra se levante
      contra mim, mesmo então confiarei.
    status: ia-sem-revisao
  '27:4':
    texto: 'Uma só coisa pedi ao Senhor, e é o que procuro: habitar na casa do Senhor todos os dias da
      minha vida, para contemplar a beleza do Senhor e visitar o seu templo.'
    status: ia-sem-revisao
  '27:5':
    texto: Pois ele me abrigará na sua tenda no dia da desgraça, esconder-me-á no recesso da sua morada,
      elevar-me-á sobre uma rocha.
    status: ia-sem-revisao
  '27:7':
    texto: Ouve, Senhor, a minha voz quando clamo; tem piedade de mim e responde-me.
    status: ia-sem-revisao
  '27:8':
    texto: 'Por ti diz o meu coração: “Buscai a minha face!” A tua face, Senhor, eu busco.'
    partes:
    - 'Por ti diz o meu coração: “Buscai a minha face!”'
    - A tua face, Senhor, eu busco.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '27:9':
    texto: Não escondas de mim o teu rosto, não repilas com ira o teu servo; foste o meu auxílio, não
      me rejeites nem me abandones, Deus da minha salvação.
    partes:
    - Não escondas de mim o teu rosto,
    - não repilas com ira o teu servo;
    - foste o meu auxílio, não me rejeites nem me abandones, Deus da minha salvação.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '27:13':
    texto: Ah, se eu não tivesse confiado em ver a bondade do Senhor na terra dos viventes!
    status: ia-sem-revisao
    observacao: Os pontos sobre “se não” no hebraico marcam a expressão como duvidosa; a Vulgata lê “Creio
      que verei”.
  '27:14':
    texto: Espera no Senhor, sê forte, e fortaleça-se o teu coração; sim, espera no Senhor.
    status: ia-sem-revisao
  '28:2':
    texto: Ouve a voz da minha súplica quando grito a ti, quando ergo as mãos para o teu santuário.
    status: ia-sem-revisao
  '28:7':
    texto: O Senhor é a minha força e o meu escudo; nele confiou o meu coração, e fui socorrido; por isso
      o meu coração exulta, e o louvarei com o meu cântico.
    status: ia-sem-revisao
  '28:8':
    texto: O Senhor é a força do seu povo, e a fortaleza salvadora do seu ungido.
    partes:
    - O Senhor é a força do seu povo,
    - e a fortaleza salvadora do seu ungido.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '28:9':
    texto: Salva o teu povo e abençoa a tua herança; apascenta-os e leva-os para sempre.
    status: ia-sem-revisao
  '29:1':
    texto: Tributai ao Senhor, filhos de Deus, tributai ao Senhor glória e poder.
    titulo: Salmo de Davi.
    partes:
    - Salmo de Davi.
    - Tributai ao Senhor, filhos de Deus, tributai ao Senhor glória e poder.
    status: ia-sem-revisao
    observacao: 'partes: a = título, b = versículo. O hebraico traz “filhos de Deus” (ou “dos deuses”);
      a Vulgata, “filhos de Deus”.'
  '29:2':
    texto: Tributai ao Senhor a glória do seu nome; prostrai-vos diante do Senhor no esplendor da santidade.
    status: ia-sem-revisao
  '29:3':
    texto: A voz do Senhor sobre as águas; o Deus da glória troveja, o Senhor, sobre as muitas águas.
    partes:
    - A voz do Senhor sobre as águas;
    - o Deus da glória troveja,
    - o Senhor, sobre as muitas águas.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '29:4':
    texto: A voz do Senhor é poderosa; a voz do Senhor é majestosa.
    status: ia-sem-revisao
  '29:9':
    texto: 'A voz do Senhor faz as cervas darem à luz e despe as florestas; e no seu templo todos dizem:
      “Glória!”'
    partes:
    - A voz do Senhor faz as cervas darem à luz e despe as florestas;
    - 'e no seu templo todos dizem: “Glória!”'
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '29:10':
    texto: O Senhor sentou-se sobre o dilúvio; o Senhor senta-se como rei para sempre.
    status: ia-sem-revisao
  '30:2':
    texto: Exalto-te, Senhor, porque me levantaste e não deixaste que os meus inimigos se alegrassem de
      mim.
    status: ia-sem-revisao
  '30:4':
    texto: Senhor, fizeste subir a minha alma do abismo; deste-me vida, para que eu não descesse à cova.
    status: ia-sem-revisao
  '30:5':
    texto: Cantai ao Senhor, vós que sois os seus fiéis, e dai graças ao seu santo nome.
    status: ia-sem-revisao
  '30:6':
    texto: Pois a sua ira dura um instante, mas o seu favor, a vida inteira; à tarde vem o pranto, mas
      pela manhã, o grito de alegria.
    status: ia-sem-revisao
  '30:11':
    texto: Ouve, Senhor, e tem piedade de mim; Senhor, sê o meu auxílio.
    status: ia-sem-revisao
  '30:12':
    texto: Mudaste o meu lamento em dança, desataste o meu pano de saco e me cingiste de alegria,
    partes:
    - Mudaste o meu lamento em dança,
    - desataste o meu pano de saco e me cingiste de alegria,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '30:13':
    texto: para que a minha glória te cante e não se cale. Senhor, meu Deus, eu te louvarei para sempre.
    partes:
    - para que a minha glória te cante e não se cale.
    - Senhor, meu Deus, eu te louvarei para sempre.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '31:2':
    texto: Em ti, Senhor, me refugio; que eu jamais seja envergonhado; por tua justiça, livra-me.
    status: ia-sem-revisao
  '31:3':
    texto: Inclina para mim o teu ouvido, apressa-te em libertar-me; sê para mim rocha de refúgio, casa
      fortificada que me salve.
    partes:
    - Inclina para mim o teu ouvido,
    - apressa-te em libertar-me;
    - sê para mim rocha de refúgio,
    - casa fortificada que me salve.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '31:4':
    texto: Pois tu és a minha rocha e a minha fortaleza; por causa do teu nome me conduzirás e me guiarás.
    status: ia-sem-revisao
  '31:5':
    texto: Tirar-me-ás da rede que esconderam para mim, pois tu és o meu refúgio.
    status: ia-sem-revisao
  '31:6':
    texto: Em tuas mãos entrego o meu espírito; tu me resgataste, Senhor, Deus fiel.
    status: ia-sem-revisao
  '31:7':
    texto: Detesto os que se apegam a vaidades inúteis; eu, porém, confio no Senhor.
    status: ia-sem-revisao
  '31:8':
    texto: Exultarei e me alegrarei na tua misericórdia, pois viste a minha aflição e conheceste as angústias
      da minha alma.
    partes:
    - Exultarei e me alegrarei na tua misericórdia,
    - pois viste a minha aflição e conheceste as angústias da minha alma.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '31:12':
    texto: De todos os meus adversários tornei-me opróbrio, e sobretudo para os meus vizinhos, e objeto
      de pavor para os meus conhecidos; os que me veem na rua fogem de mim.
    status: ia-sem-revisao
  '31:13':
    texto: Fui esquecido como um morto, afastado do coração; sou como um vaso quebrado.
    status: ia-sem-revisao
  '31:14':
    texto: Pois ouvi o cochicho de muitos, o terror ao redor, quando se conjuram contra mim e tramam tirar-me
      a vida.
    status: ia-sem-revisao
  '31:15':
    texto: 'Eu, porém, confio em ti, Senhor; digo: “Tu és o meu Deus.”'
    status: ia-sem-revisao
  '31:16':
    texto: Nas tuas mãos estão os meus tempos; livra-me da mão dos meus inimigos e dos que me perseguem.
    partes:
    - Nas tuas mãos estão os meus tempos;
    - livra-me da mão dos meus inimigos
    - e dos que me perseguem.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '31:17':
    texto: Faze brilhar a tua face sobre o teu servo; salva-me pela tua misericórdia.
    status: ia-sem-revisao
  '31:20':
    texto: Como é grande a tua bondade, que reservaste para os que te temem, e que realizas, à vista dos
      homens, para os que se refugiam em ti!
    status: ia-sem-revisao
  '31:21':
    texto: Tu os escondes no abrigo da tua face, longe das intrigas dos homens; guardas-os numa tenda,
      longe das línguas que contendem.
    partes:
    - Tu os escondes no abrigo da tua face, longe das intrigas dos homens;
    - guardas-os numa tenda,
    - longe das línguas que contendem.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '31:22':
    texto: Bendito seja o Senhor, que me mostrou maravilhas de misericórdia numa cidade sitiada.
    status: ia-sem-revisao
  '31:23':
    texto: 'Eu dizia na minha pressa: “Fui cortado da tua presença!” Mas tu ouviste a voz da minha súplica
      quando gritei a ti.'
    status: ia-sem-revisao
  '31:24':
    texto: Amai o Senhor, todos os seus fiéis; o Senhor guarda os leais e retribui com abundância ao soberbo.
    status: ia-sem-revisao
  '31:25':
    texto: Sede fortes, e fortaleça-se o vosso coração, todos os que esperais no Senhor.
    status: ia-sem-revisao
  '32:1':
    texto: Feliz aquele cuja transgressão é perdoada e cujo pecado é coberto.
    titulo: De Davi. Poema.
    status: ia-sem-revisao
  '32:2':
    texto: Feliz o homem a quem o Senhor não atribui culpa e em cujo espírito não há engano.
    status: ia-sem-revisao
  '32:5':
    texto: 'Reconheci diante de ti o meu pecado e não encobri a minha culpa. Disse: “Confessarei ao Senhor
      as minhas transgressões”; e tu perdoaste a culpa do meu pecado. Pausa.'
    status: ia-sem-revisao
  '32:6':
    texto: Por isso, todo fiel te suplique no tempo em que podes ser encontrado; ainda que as muitas águas
      transbordem, não o alcançarão.
    status: ia-sem-revisao
  '32:7':
    texto: Tu és o meu abrigo; livras-me da angústia; cercas-me de cantos de libertação. Pausa.
    status: ia-sem-revisao
  '32:11':
    texto: Alegrai-vos no Senhor e exultai, justos; e cantai de júbilo, todos os retos de coração.
    status: ia-sem-revisao
  '33:1':
    texto: Exultai, justos, no Senhor; aos retos convém o louvor.
    status: ia-sem-revisao
  '33:2':
    texto: Louvai o Senhor com a cítara, cantai-lhe com a harpa de dez cordas.
    status: ia-sem-revisao
  '33:3':
    texto: Cantai-lhe um canto novo, tocai com arte, em aclamação.
    status: ia-sem-revisao
  '33:4':
    texto: Pois reta é a palavra do Senhor, e toda a sua obra é feita com fidelidade.
    status: ia-sem-revisao
  '33:5':
    texto: Ele ama a justiça e o direito; da misericórdia do Senhor está cheia a terra.
    status: ia-sem-revisao
  '33:6':
    texto: Pela palavra do Senhor foram feitos os céus, e pelo sopro da sua boca, todo o seu exército.
    status: ia-sem-revisao
  '33:7':
    texto: Ele junta como num odre as águas do mar, põe os abismos em reservatórios.
    status: ia-sem-revisao
  '33:8':
    texto: Tema o Senhor toda a terra; tremam diante dele todos os habitantes do mundo.
    status: ia-sem-revisao
  '33:9':
    texto: Pois ele falou, e tudo se fez; ele mandou, e tudo surgiu.
    status: ia-sem-revisao
  '33:10':
    texto: O Senhor desfaz o plano das nações, frustra os projetos dos povos.
    status: ia-sem-revisao
  '33:11':
    texto: O plano do Senhor subsiste para sempre; os projetos do seu coração, de geração em geração.
    status: ia-sem-revisao
  '33:12':
    texto: Feliz a nação cujo Deus é o Senhor, o povo que ele escolheu como herança.
    status: ia-sem-revisao
  '33:13':
    texto: Do céu o Senhor olha e vê todos os filhos dos homens.
    status: ia-sem-revisao
  '33:14':
    texto: Do lugar da sua morada observa todos os habitantes da terra.
    status: ia-sem-revisao
  '33:15':
    texto: Ele, que forma o coração de todos eles, e discerne todas as suas obras.
    status: ia-sem-revisao
  '33:18':
    texto: Eis que os olhos do Senhor estão sobre os que o temem, sobre os que esperam na sua misericórdia,
    status: ia-sem-revisao
  '33:19':
    texto: para livrar da morte a sua alma e mantê-los vivos na fome.
    status: ia-sem-revisao
  '33:20':
    texto: A nossa alma espera o Senhor; ele é o nosso auxílio e o nosso escudo.
    status: ia-sem-revisao
  '33:21':
    texto: Pois nele se alegra o nosso coração, porque confiamos no seu santo nome.
    status: ia-sem-revisao
  '33:22':
    texto: Seja sobre nós, Senhor, a tua misericórdia, assim como esperamos em ti.
    status: ia-sem-revisao
  '34:2':
    texto: Bendirei o Senhor em todo o tempo; o seu louvor estará sempre nos meus lábios.
    status: ia-sem-revisao
  '34:3':
    texto: Em o Senhor gloria-se a minha alma; ouçam os humildes e se alegrem.
    status: ia-sem-revisao
  '34:4':
    texto: Engrandecei o Senhor comigo; exaltemos juntos o seu nome.
    status: ia-sem-revisao
  '34:5':
    texto: Busquei o Senhor, e ele me respondeu; de todos os meus temores me livrou.
    status: ia-sem-revisao
  '34:6':
    texto: Olhai para ele e ficareis radiantes, e o vosso rosto não se cobrirá de vergonha.
    status: ia-sem-revisao
  '34:7':
    texto: Este pobre clamou, e o Senhor o ouviu; de todas as suas angústias o salvou.
    status: ia-sem-revisao
  '34:8':
    texto: O anjo do Senhor acampa ao redor dos que o temem e os livra.
    status: ia-sem-revisao
  '34:9':
    texto: Provai e vede como o Senhor é bom; feliz o homem que nele se refugia.
    status: ia-sem-revisao
  '34:10':
    texto: Temei o Senhor, vós que sois os seus santos, pois nada falta aos que o temem.
    status: ia-sem-revisao
  '34:11':
    texto: Os leõezinhos passam necessidade e fome, mas aos que buscam o Senhor não faltará nenhum bem.
    status: ia-sem-revisao
  '34:12':
    texto: 'Vinde, filhos, escutai-me: ensinar-vos-ei o temor do Senhor.'
    status: ia-sem-revisao
  '34:13':
    texto: Quem é o homem que ama a vida e deseja longos dias para ver o bem?
    status: ia-sem-revisao
  '34:14':
    texto: Guarda a tua língua do mal e os teus lábios de falar engano.
    status: ia-sem-revisao
  '34:15':
    texto: Afasta-te do mal e faze o bem; procura a paz e segue-a.
    status: ia-sem-revisao
  '34:16':
    texto: Os olhos do Senhor estão voltados para os justos, e os seus ouvidos, para o seu clamor.
    status: ia-sem-revisao
  '34:17':
    texto: O rosto do Senhor está contra os que fazem o mal, para apagar da terra a sua memória.
    status: ia-sem-revisao
  '34:18':
    texto: Os justos clamaram, e o Senhor os ouviu; de todas as suas angústias os livrou.
    status: ia-sem-revisao
  '34:19':
    texto: O Senhor está perto dos que têm o coração quebrantado e salva os de espírito abatido.
    status: ia-sem-revisao
  '34:20':
    texto: Muitas são as desgraças do justo, mas de todas o Senhor o livra.
    status: ia-sem-revisao
  '34:21':
    texto: Ele guarda todos os seus ossos; nenhum deles será quebrado.
    status: ia-sem-revisao
  '34:22':
    texto: A desgraça matará o ímpio, e os que odeiam o justo serão condenados.
    status: ia-sem-revisao
  '34:23':
    texto: O Senhor resgata a vida dos seus servos, e não serão condenados os que nele se refugiam.
    status: ia-sem-revisao
  '36:6':
    texto: Senhor, a tua misericórdia chega até os céus, a tua fidelidade até as nuvens.
    status: ia-sem-revisao
  '36:7':
    texto: A tua justiça é como os montes de Deus, os teus juízos, como o grande abismo; ao homem e ao
      animal tu salvas, Senhor.
    partes:
    - A tua justiça é como os montes de Deus, os teus juízos, como o grande abismo;
    - ao homem e ao animal tu salvas, Senhor.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '36:8':
    texto: Como é preciosa a tua misericórdia, ó Deus! Os filhos dos homens se abrigam à sombra das tuas
      asas.
    status: ia-sem-revisao
  '36:9':
    texto: Saciam-se da abundância da tua casa, e na torrente das tuas delícias lhes dás de beber.
    status: ia-sem-revisao
  '36:10':
    texto: Pois em ti está a fonte da vida; na tua luz vemos a luz.
    status: ia-sem-revisao
  '36:11':
    texto: Prolonga a tua misericórdia aos que te conhecem e a tua justiça aos retos de coração.
    status: ia-sem-revisao
  '37:3':
    texto: Confia no Senhor e faze o bem; habita a terra e apascenta-te de fidelidade.
    status: ia-sem-revisao
  '37:4':
    texto: Deleita-te no Senhor, e ele te concederá os desejos do teu coração.
    status: ia-sem-revisao
  '37:5':
    texto: Entrega ao Senhor o teu caminho, confia nele, e ele agirá.
    status: ia-sem-revisao
  '37:6':
    texto: Fará brilhar como a luz a tua justiça, e o teu direito como o meio-dia.
    status: ia-sem-revisao
  '37:18':
    texto: O Senhor conhece os dias dos íntegros, e a herança deles durará para sempre.
    status: ia-sem-revisao
  '37:19':
    texto: Não serão envergonhados no tempo da desgraça, e nos dias de fome se saciarão.
    status: ia-sem-revisao
  '37:23':
    texto: Os passos do homem são firmados pelo Senhor, que se compraz no seu caminho.
    status: ia-sem-revisao
  '37:24':
    texto: Se cair, não ficará prostrado, porque o Senhor lhe sustenta a mão.
    status: ia-sem-revisao
  '37:27':
    texto: Afasta-te do mal e faze o bem, e habitarás para sempre.
    status: ia-sem-revisao
  '37:28':
    texto: Pois o Senhor ama o direito e não abandona os seus fiéis; serão guardados para sempre, mas
      a descendência dos ímpios será exterminada.
    status: ia-sem-revisao
  '37:29':
    texto: Os justos herdarão a terra e habitarão nela para sempre.
    status: ia-sem-revisao
  '37:30':
    texto: A boca do justo profere sabedoria, e a sua língua fala o que é reto.
    status: ia-sem-revisao
  '37:31':
    texto: A lei do seu Deus está no seu coração; os seus passos não vacilam.
    status: ia-sem-revisao
  '37:39':
    texto: A salvação dos justos vem do Senhor; ele é a sua fortaleza no tempo da angústia.
    status: ia-sem-revisao
  '37:40':
    texto: O Senhor os ajuda e os liberta; liberta-os dos ímpios e os salva, porque nele se refugiaram.
    status: ia-sem-revisao
  '40:2':
    texto: Esperei, esperei pelo Senhor; ele se inclinou para mim e ouviu o meu clamor.
    status: ia-sem-revisao
  '40:3':
    texto: Tirou-me de uma cova de perdição, do lodo do pântano, e pôs os meus pés sobre uma rocha, firmando
      os meus passos.
    status: ia-sem-revisao
  '40:4':
    texto: Pôs-me na boca um canto novo, um louvor ao nosso Deus. Muitos verão e temerão e confiarão no
      Senhor.
    partes:
    - Pôs-me na boca um canto novo,
    - um louvor ao nosso Deus.
    - Muitos verão e temerão
    - e confiarão no Senhor.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '40:5':
    texto: Feliz o homem que põe no Senhor a sua confiança e não se volta para os soberbos nem para os
      que seguem a mentira.
    status: ia-sem-revisao
  '40:7':
    texto: Sacrifício e oferta não quiseste; abriste-me os ouvidos; holocausto e sacrifício pelo pecado
      não pediste.
    status: ia-sem-revisao
    observacao: O hebraico traz “abriste-me os ouvidos”; a Septuaginta (citada em Hb 10,5) traz “preparaste-me
      um corpo”.
  '40:8':
    texto: 'Então eu disse: “Eis que venho; no rolo do livro está escrito a meu respeito.”'
    partes:
    - 'Então eu disse: “Eis que venho;'
    - no rolo do livro está escrito a meu respeito.”
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '40:9':
    texto: Fazer a tua vontade, meu Deus, é o meu prazer, e a tua lei está no meu íntimo.
    status: ia-sem-revisao
  '40:10':
    texto: Anunciei a justiça na grande assembleia; eis que não fecho os meus lábios, Senhor, tu o sabes.
    status: ia-sem-revisao
  '40:11':
    texto: Não escondi a tua justiça no meu coração; proclamei a tua fidelidade e a tua salvação; não
      ocultei a tua misericórdia e a tua verdade à grande assembleia.
    status: ia-sem-revisao
  '40:17':
    texto: 'Exultem e se alegrem em ti todos os que te buscam; digam sempre os que amam a tua salvação:
      “Seja engrandecido o Senhor!”'
    status: ia-sem-revisao
  '40:18':
    texto: Eu sou pobre e necessitado; o Senhor pensa em mim. Tu és o meu auxílio e o meu libertador;
      meu Deus, não te demores.
    status: ia-sem-revisao
  '41:2':
    texto: Feliz aquele que cuida do pobre; no dia da desgraça o Senhor o livrará.
    status: ia-sem-revisao
  '41:3':
    texto: O Senhor o guardará e lhe conservará a vida; será feliz na terra, e não o entregarás à vontade
      dos seus inimigos.
    status: ia-sem-revisao
  '41:4':
    texto: O Senhor o sustentará no leito da doença; transformas toda a sua cama na sua enfermidade.
    status: ia-sem-revisao
  '41:5':
    texto: 'Eu disse: “Senhor, tem piedade de mim; cura a minha alma, porque pequei contra ti.”'
    status: ia-sem-revisao
  '41:13':
    texto: Quanto a mim, sustentaste-me na minha integridade e me estabeleceste para sempre diante de
      ti.
    status: ia-sem-revisao
  '41:14':
    texto: Bendito seja o Senhor, Deus de Israel, de eternidade em eternidade. Amém e amém.
    status: ia-sem-revisao
  '42:2':
    texto: Como a corça anseia por águas correntes, assim a minha alma anseia por ti, ó Deus.
    status: ia-sem-revisao
  '42:3':
    texto: A minha alma tem sede de Deus, do Deus vivo. Quando poderei entrar e ver a face de Deus?
    status: ia-sem-revisao
  '42:5':
    texto: 'Recordo estas coisas e derramo sobre mim a minha alma: como eu caminhava com a multidão e
      avançava com ela para a casa de Deus, entre vozes de júbilo e louvor, numa multidão em festa.'
    partes:
    - 'Recordo estas coisas e derramo sobre mim a minha alma:'
    - como eu caminhava com a multidão e avançava com ela para a casa de Deus,
    - entre vozes de júbilo e louvor, numa multidão em festa.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '43:1':
    texto: Julga-me, ó Deus, e defende a minha causa contra um povo sem lealdade; livra-me do homem enganador
      e injusto.
    status: ia-sem-revisao
  '43:2':
    texto: Pois tu és o Deus da minha fortaleza; por que me rejeitaste? Por que ando de luto, oprimido
      pelo inimigo?
    status: ia-sem-revisao
  '43:3':
    texto: 'Envia a tua luz e a tua verdade: elas me guiarão e me conduzirão ao teu santo monte e às tuas
      moradas.'
    status: ia-sem-revisao
  '43:4':
    texto: Então irei ao altar de Deus, ao Deus que é a alegria do meu júbilo, e te louvarei com a harpa,
      ó Deus, meu Deus.
    status: ia-sem-revisao
  '44:10':
    texto: Contudo, nos rejeitaste e nos cobriste de vergonha; já não sais com os nossos exércitos.
    status: ia-sem-revisao
  '44:11':
    texto: Fazes-nos recuar diante do adversário, e os que nos odeiam saqueiam à vontade.
    status: ia-sem-revisao
  '44:14':
    texto: Fazes de nós o opróbrio dos nossos vizinhos, escárnio e zombaria dos que nos rodeiam.
    status: ia-sem-revisao
  '44:15':
    texto: Fazes de nós um provérbio entre as nações, motivo de balançar de cabeça entre os povos.
    status: ia-sem-revisao
  '44:24':
    texto: Desperta! Por que dormes, Senhor? Levanta-te, não nos rejeites para sempre!
    status: ia-sem-revisao
  '44:25':
    texto: Por que escondes o teu rosto e esqueces a nossa aflição e a nossa opressão?
    status: ia-sem-revisao
  '45:1':
    texto: Ao mestre de canto. Sobre “Os Lírios”. Dos filhos de Coré. Poema. Cântico de amor.
    status: ia-sem-revisao
  '45:2':
    texto: 'O meu coração transborda de palavras belas. Digo: “A minha obra é para o rei.” A minha língua
      é como a pena de um escriba ágil.'
    status: ia-sem-revisao
  '45:3':
    texto: Tu és o mais belo dos filhos dos homens; a graça foi derramada nos teus lábios; por isso Deus
      te abençoou para sempre.
    status: ia-sem-revisao
  '45:4':
    texto: Cinge a tua espada à coxa, ó valente, com o teu esplendor e a tua majestade.
    status: ia-sem-revisao
  '45:5':
    texto: Na tua majestade, avança vitorioso, em favor da verdade, da humildade e da justiça; a tua direita
      te ensine feitos admiráveis.
    status: ia-sem-revisao
  '45:6':
    texto: As tuas flechas são agudas; sob ti caem povos; elas atingem o coração dos inimigos do rei.
    status: ia-sem-revisao
  '45:7':
    texto: O teu trono, ó Deus, é eterno e para sempre; cetro de retidão é o cetro do teu reino.
    status: ia-sem-revisao
    observacao: O hebraico admite também “O teu trono divino”; seguiu-se a leitura “ó Deus”, que é a da
      Vulgata e a citada em Hb 1,8.
  '45:8':
    texto: Amaste a justiça e odiaste a maldade; por isso Deus, o teu Deus, te ungiu com óleo de alegria,
      mais do que aos teus companheiros.
    status: ia-sem-revisao
  '45:9':
    texto: Mirra, aloés e cássia perfumam todas as tuas vestes; de palácios de marfim a música das cordas
      te alegra.
    status: ia-sem-revisao
  '45:10':
    texto: Filhas de reis estão entre as tuas damas; à tua direita está a rainha, com ouro de Ofir.
    status: ia-sem-revisao
  '45:11':
    texto: 'Ouve, filha, vê e inclina o teu ouvido: esquece o teu povo e a casa de teu pai.'
    status: ia-sem-revisao
  '45:12':
    texto: 'O rei deseja a tua beleza; ele é o teu senhor: presta-lhe homenagem.'
    status: ia-sem-revisao
  '45:13':
    texto: A filha de Tiro virá com presentes; os mais ricos do povo procurarão o teu favor.
    status: ia-sem-revisao
  '45:14':
    texto: Toda gloriosa está a filha do rei no interior; o seu vestido é tecido de ouro.
    status: ia-sem-revisao
  '45:15':
    texto: Em vestes bordadas é conduzida ao rei; as virgens, suas companheiras, a seguem e são levadas
      a ti.
    status: ia-sem-revisao
  '45:16':
    texto: São conduzidas com alegria e júbilo, e entram no palácio do rei.
    status: ia-sem-revisao
  '45:17':
    texto: No lugar dos teus pais estarão os teus filhos; tu os farás príncipes por toda a terra.
    status: ia-sem-revisao
  '45:18':
    texto: Farei lembrar o teu nome de geração em geração; por isso os povos te louvarão para sempre e
      eternamente.
    status: ia-sem-revisao
  '46:2':
    texto: Deus é para nós refúgio e fortaleza, socorro sempre presente na angústia.
    status: ia-sem-revisao
  '46:3':
    texto: Por isso não temeremos, ainda que a terra se transtorne e os montes se movam para o fundo do
      mar.
    status: ia-sem-revisao
  '46:4':
    texto: Ainda que bramem as suas águas e se agitem, e os montes tremam com a sua fúria. Pausa.
    partes:
    - Ainda que bramem as suas águas
    - e se agitem,
    - e os montes tremam com a sua fúria. Pausa.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '46:5':
    texto: Há um rio cujas correntes alegram a cidade de Deus, a santa morada do Altíssimo.
    status: ia-sem-revisao
  '46:6':
    texto: Deus está no meio dela; não será abalada. Deus a socorrerá ao romper da manhã.
    status: ia-sem-revisao
  '46:8':
    texto: O Senhor dos exércitos está conosco; o Deus de Jacó é o nosso refúgio. Pausa.
    status: ia-sem-revisao
  '46:9':
    texto: Vinde e vede as obras do Senhor, que faz maravilhas na terra.
    status: ia-sem-revisao
  '47:2':
    texto: Povos todos, batei palmas; aclamai a Deus com vozes de alegria.
    status: ia-sem-revisao
  '47:3':
    texto: Pois o Senhor, o Altíssimo, é temível, grande rei sobre toda a terra.
    status: ia-sem-revisao
  '47:4':
    texto: Ele submete os povos a nós e as nações aos nossos pés.
    status: ia-sem-revisao
  '47:5':
    texto: Escolhe para nós a nossa herança, a glória de Jacó, a quem amou. Pausa.
    status: ia-sem-revisao
  '47:6':
    texto: Deus subiu entre aclamações, o Senhor, ao som da trombeta.
    status: ia-sem-revisao
  '47:7':
    texto: Cantai a Deus, cantai; cantai ao nosso rei, cantai.
    status: ia-sem-revisao
  '47:8':
    texto: Pois Deus é o rei de toda a terra; cantai um poema.
    status: ia-sem-revisao
  '47:9':
    texto: Deus reina sobre as nações; Deus se assenta no seu santo trono.
    status: ia-sem-revisao
  '47:10':
    texto: Os príncipes dos povos se reúnem com o povo do Deus de Abraão, pois a Deus pertencem os escudos
      da terra; ele é muito exaltado.
    status: ia-sem-revisao
  '48:2':
    texto: Grande é o Senhor e digno de todo louvor na cidade do nosso Deus, o seu santo monte.
    status: ia-sem-revisao
  '48:3':
    texto: Bela em altura, alegria de toda a terra, o monte Sião, nos confins do norte, cidade do grande
      Rei.
    partes:
    - Bela em altura, alegria de toda a terra, o monte Sião,
    - nos confins do norte, cidade do grande Rei.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '48:4':
    texto: Deus, nos seus palácios, deu-se a conhecer como fortaleza.
    status: ia-sem-revisao
  '48:5':
    texto: Pois eis que os reis se reuniram e avançaram juntos.
    status: ia-sem-revisao
  '48:6':
    texto: Eles viram e ficaram atônitos; assustaram-se e fugiram apavorados.
    status: ia-sem-revisao
  '48:7':
    texto: Ali o tremor os tomou, dor como a da mulher que dá à luz.
    status: ia-sem-revisao
  '48:8':
    texto: Com o vento do oriente quebras os navios de Társis.
    status: ia-sem-revisao
  '48:9':
    texto: 'Como ouvimos, assim vimos, na cidade do Senhor dos exércitos, na cidade do nosso Deus: Deus
      a firmará para sempre. Pausa.'
    status: ia-sem-revisao
  '48:10':
    texto: Meditamos, ó Deus, na tua misericórdia, no meio do teu templo.
    status: ia-sem-revisao
  '48:11':
    texto: Como o teu nome, ó Deus, assim o teu louvor chega até os confins da terra; a tua direita está
      cheia de justiça.
    status: ia-sem-revisao
  '49:2':
    texto: Ouvi isto, povos todos; escutai, todos os habitantes do mundo,
    status: ia-sem-revisao
  '49:3':
    texto: tanto os filhos do homem como os filhos de gente importante, ricos e pobres juntos.
    status: ia-sem-revisao
  '49:6':
    texto: Por que temerei nos dias maus, quando me cerca a malícia dos que me perseguem,
    status: ia-sem-revisao
  '49:7':
    texto: os que confiam na sua riqueza e se gloriam na abundância de seus bens?
    status: ia-sem-revisao
  '49:8':
    texto: Ninguém pode resgatar o seu irmão nem pagar a Deus o seu resgate.
    status: ia-sem-revisao
  '49:9':
    texto: O resgate da vida deles é muito caro, e nunca bastará,
    status: ia-sem-revisao
  '49:10':
    texto: para que continue a viver para sempre e não veja a cova.
    status: ia-sem-revisao
  '49:11':
    texto: Pois se vê que os sábios morrem; o insensato e o tolo perecem juntos e deixam a outros a sua
      riqueza.
    status: ia-sem-revisao
  '49:14':
    texto: Este é o caminho dos que confiam em si mesmos, e o fim dos que se comprazem nas suas palavras.
      Pausa.
    status: ia-sem-revisao
  '49:15':
    texto: Como ovelhas, são postos no abismo; a morte os pastoreia. Os retos dominarão sobre eles pela
      manhã, e a sua figura se desfará no abismo, longe da sua morada.
    status: ia-sem-revisao
  '49:16':
    texto: Mas Deus resgatará a minha vida do poder do abismo, pois me tomará consigo. Pausa.
    status: ia-sem-revisao
  '49:17':
    texto: Não temas quando um homem se enriquece, quando aumenta a glória da sua casa;
    status: ia-sem-revisao
  '49:18':
    texto: pois, ao morrer, nada levará consigo, e a sua glória não descerá com ele.
    status: ia-sem-revisao
  '49:19':
    texto: Ainda que em vida se tenha abençoado a si mesmo — “Louvar-te-ão, porque te tratas bem” —,
    status: ia-sem-revisao
  '49:20':
    texto: irá juntar-se à geração dos seus pais, que nunca mais verão a luz.
    status: ia-sem-revisao
  '50:1':
    texto: O Deus dos deuses, o Senhor, falou e convocou a terra, do nascer do sol ao seu ocaso.
    titulo: Salmo de Asaf.
    status: ia-sem-revisao
  '50:2':
    texto: De Sião, perfeição de beleza, Deus resplandeceu.
    status: ia-sem-revisao
  '50:5':
    texto: “Reuni-me os meus fiéis, os que selaram a minha aliança com sacrifício.”
    status: ia-sem-revisao
  '50:6':
    texto: Os céus proclamam a sua justiça, pois Deus mesmo é juiz. Pausa.
    status: ia-sem-revisao
  '50:7':
    texto: '“Ouve, meu povo, e eu falarei; Israel, eu testemunharei contra ti: eu sou Deus, o teu Deus.'
    status: ia-sem-revisao
  '50:8':
    texto: Não é pelos teus sacrifícios que te repreendo; os teus holocaustos estão sempre diante de mim.
    status: ia-sem-revisao
  '50:9':
    texto: Não tomarei novilho da tua casa, nem bodes dos teus currais.
    status: ia-sem-revisao
  '50:10':
    texto: Pois são meus todos os animais da floresta, e o gado aos milhares nos montes.
    status: ia-sem-revisao
  '50:11':
    texto: Conheço todas as aves das montanhas, e o que se move no campo me pertence.
    status: ia-sem-revisao
  '50:12':
    texto: Se eu tivesse fome, não to diria, pois meu é o mundo e tudo o que ele contém.
    status: ia-sem-revisao
  '50:13':
    texto: Acaso como carne de touros ou bebo sangue de bodes?
    status: ia-sem-revisao
  '50:14':
    texto: Oferece a Deus um sacrifício de louvor e cumpre os teus votos ao Altíssimo.
    status: ia-sem-revisao
  '50:15':
    texto: 'Invoca-me no dia da angústia: eu te livrarei, e tu me glorificarás.”'
    status: ia-sem-revisao
  '50:16':
    texto: 'Mas ao ímpio Deus diz: “Que tens tu que recitar os meus estatutos e tomar a minha aliança
      nos teus lábios?'
    partes:
    - 'Mas ao ímpio Deus diz:'
    - “Que tens tu que recitar os meus estatutos
    - e tomar a minha aliança nos teus lábios?
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '50:17':
    texto: Tu odeias a disciplina e lanças as minhas palavras para trás de ti.
    status: ia-sem-revisao
  '50:18':
    texto: Se vês um ladrão, corres com ele, e com os adúlteros tens a tua parte.
    status: ia-sem-revisao
  '50:19':
    texto: A tua boca solta a maldade, e a tua língua trama o engano.
    status: ia-sem-revisao
  '50:20':
    texto: Sentas-te e falas contra o teu irmão, difamas o filho da tua mãe.
    status: ia-sem-revisao
  '50:21':
    texto: Fizeste isto, e eu me calei; pensaste que eu era como tu. Mas eu te repreenderei e te porei
      tudo diante dos olhos.
    status: ia-sem-revisao
  '50:22':
    texto: Compreendei isto, vós que esqueceis a Deus, para que eu não vos despedace sem que haja quem
      vos livre.
    status: ia-sem-revisao
  '50:23':
    texto: Quem oferece sacrifício de louvor me glorifica; e a quem anda no caminho certo mostrarei a
      salvação de Deus.”
    status: ia-sem-revisao
  '51:3':
    texto: Tem piedade de mim, ó Deus, segundo a tua misericórdia; segundo a abundância da tua compaixão,
      apaga a minha transgressão.
    status: ia-sem-revisao
  '51:4':
    texto: Lava-me por completo da minha culpa e purifica-me do meu pecado.
    status: ia-sem-revisao
  '51:5':
    texto: Pois eu reconheço a minha transgressão, e o meu pecado está sempre diante de mim.
    status: ia-sem-revisao
  '51:6':
    texto: Contra ti, contra ti somente pequei, e fiz o que é mau aos teus olhos, de modo que és justo
      quando falas e reto quando julgas.
    partes:
    - Contra ti, contra ti somente pequei, e fiz o que é mau aos teus olhos,
    - de modo que és justo quando falas e reto quando julgas.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '51:7':
    texto: Eis que nasci na culpa, e minha mãe me concebeu no pecado.
    status: ia-sem-revisao
  '51:8':
    texto: Eis que desejas a verdade no íntimo; no mais secreto me ensinas a sabedoria.
    status: ia-sem-revisao
  '51:9':
    texto: Purifica-me com o hissopo, e ficarei limpo; lava-me, e ficarei mais branco que a neve.
    status: ia-sem-revisao
  '51:10':
    texto: Faze-me ouvir júbilo e alegria, e exultarão os ossos que esmagaste.
    status: ia-sem-revisao
  '51:11':
    texto: Esconde o teu rosto dos meus pecados e apaga todas as minhas culpas.
    status: ia-sem-revisao
  '51:12':
    texto: Cria em mim, ó Deus, um coração puro e renova dentro de mim um espírito firme.
    status: ia-sem-revisao
  '51:13':
    texto: Não me rejeites da tua presença e não retires de mim o teu santo espírito.
    status: ia-sem-revisao
  '51:14':
    texto: Devolve-me a alegria da tua salvação e sustenta-me com um espírito generoso.
    status: ia-sem-revisao
  '51:15':
    texto: Ensinarei aos transgressores os teus caminhos, e os pecadores voltarão a ti.
    status: ia-sem-revisao
  '51:16':
    texto: Livra-me do sangue derramado, ó Deus, Deus da minha salvação, e a minha língua aclamará a tua
      justiça.
    status: ia-sem-revisao
  '51:17':
    texto: Senhor, abre os meus lábios, e a minha boca anunciará o teu louvor.
    status: ia-sem-revisao
  '51:18':
    texto: Pois não te agradas de sacrifício, ou eu o ofereceria; não te comprazes em holocausto.
    status: ia-sem-revisao
  '51:19':
    texto: Meu sacrifício, ó Deus, é um espírito quebrantado; um coração quebrantado e contrito, ó Deus,
      não desprezarás.
    status: ia-sem-revisao
  '51:20':
    texto: Por tua bondade, faze o bem a Sião; reconstrói os muros de Jerusalém.
    status: ia-sem-revisao
  '51:21':
    texto: Então te agradarás dos sacrifícios de justiça, do holocausto e da oferta total; então se oferecerão
      novilhos sobre o teu altar.
    partes:
    - Então te agradarás dos sacrifícios de justiça, do holocausto e da oferta total;
    - então se oferecerão novilhos sobre o teu altar.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '52:10':
    texto: Eu, porém, como oliveira verdejante na casa de Deus, confio na misericórdia de Deus para sempre
      e eternamente.
    status: ia-sem-revisao
  '52:11':
    texto: Dar-te-ei graças para sempre, porque agiste; e esperarei no teu nome, porque é bom, diante
      dos teus fiéis.
    status: ia-sem-revisao
  '54:3':
    texto: Ó Deus, salva-me pelo teu nome e faze-me justiça pelo teu poder.
    status: ia-sem-revisao
  '54:4':
    texto: Ó Deus, ouve a minha oração, escuta as palavras da minha boca.
    status: ia-sem-revisao
  '54:5':
    texto: Pois estranhos se levantaram contra mim, e violentos procuram a minha vida; não têm Deus diante
      de si. Pausa.
    status: ia-sem-revisao
  '54:6':
    texto: Eis que Deus é o meu auxílio; o Senhor está com os que sustentam a minha vida.
    status: ia-sem-revisao
  '54:8':
    texto: De coração livre te oferecerei sacrifício; darei graças ao teu nome, Senhor, porque é bom.
    status: ia-sem-revisao
  '55:7':
    texto: 'E eu disse: “Quem me dera ter asas como a pomba! Voaria e acharia repouso.'
    status: ia-sem-revisao
  '55:8':
    texto: Eis que fugiria para longe e pernoitaria no deserto. Pausa.
    status: ia-sem-revisao
  '55:9':
    texto: Apressar-me-ia a buscar abrigo contra o vento impetuoso e a tempestade.”
    status: ia-sem-revisao
  '55:10':
    texto: Devora-os, Senhor, confunde-lhes a língua, pois vi violência e discórdia na cidade.
    partes:
    - Devora-os, Senhor, confunde-lhes a língua,
    - pois vi violência e discórdia na cidade.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '55:11':
    texto: De dia e de noite rondam por cima das suas muralhas; no seu interior há iniquidade e opressão.
    partes:
    - De dia e de noite rondam por cima das suas muralhas;
    - no seu interior há iniquidade e opressão.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '55:23':
    texto: Lança sobre o Senhor o teu fardo, e ele te sustentará; jamais permitirá que o justo vacile.
    status: ia-sem-revisao
  '56:2':
    texto: Tem piedade de mim, ó Deus, pois homens me pisam; o dia todo me oprimem na luta.
    status: ia-sem-revisao
  '56:3':
    texto: Os meus inimigos me pisam o dia todo, pois são muitos os que me combatem do alto.
    status: ia-sem-revisao
  '56:9':
    texto: Tu contaste as minhas errâncias; recolhe as minhas lágrimas no teu odre. Não estão elas no
      teu livro?
    status: ia-sem-revisao
  '56:10':
    texto: 'Então os meus inimigos recuarão no dia em que eu clamar; disto sei: Deus está por mim.'
    status: ia-sem-revisao
  '56:11':
    texto: Em Deus louvo a sua palavra, no Senhor louvo a sua palavra.
    status: ia-sem-revisao
  '56:12':
    texto: 'Em Deus confio e não temo: que poderá fazer-me o homem?'
    status: ia-sem-revisao
  '56:13':
    texto: Devo-te, ó Deus, os meus votos; cumpri-los-ei com ações de graças.
    status: ia-sem-revisao
  '56:14':
    texto: Pois livraste a minha vida da morte, e os meus pés da queda, para que eu ande diante de Deus
      na luz dos vivos.
    status: ia-sem-revisao
  '57:2':
    texto: Tem piedade de mim, ó Deus, tem piedade de mim, pois em ti se refugia a minha alma; à sombra
      das tuas asas me refugio, até que passe a calamidade.
    status: ia-sem-revisao
  '57:3':
    texto: Clamo a Deus, o Altíssimo, ao Deus que leva a bom termo o que faz por mim.
    status: ia-sem-revisao
  '57:4':
    texto: Do céu envie ele a sua ajuda e me salve; confunda quem me persegue. Pausa. Envie Deus a sua
      misericórdia e a sua fidelidade.
    status: ia-sem-revisao
  '57:6':
    texto: Eleva-te acima dos céus, ó Deus; sobre toda a terra seja a tua glória.
    status: ia-sem-revisao
  '57:8':
    texto: Meu coração está firme, ó Deus, meu coração está firme; cantarei e tocarei.
    status: ia-sem-revisao
  '57:9':
    texto: Desperta, minha glória! Despertai, harpa e cítara! Despertarei a aurora.
    status: ia-sem-revisao
  '57:10':
    texto: Louvar-te-ei entre os povos, Senhor; cantar-te-ei entre as nações.
    status: ia-sem-revisao
  '57:11':
    texto: Pois a tua misericórdia é grande até os céus, e a tua fidelidade até as nuvens.
    status: ia-sem-revisao
  '57:12':
    texto: Eleva-te acima dos céus, ó Deus; sobre toda a terra seja a tua glória.
    status: ia-sem-revisao
  '59:2':
    texto: Livra-me dos meus inimigos, ó meu Deus; protege-me dos que se levantam contra mim.
    status: ia-sem-revisao
  '59:3':
    texto: Livra-me dos que praticam a iniquidade e salva-me dos homens sanguinários.
    status: ia-sem-revisao
  '59:4':
    texto: Pois eis que armam emboscadas contra mim; poderosos se juntam contra mim, sem que haja em mim
      transgressão nem pecado, Senhor.
    status: ia-sem-revisao
  '59:10':
    texto: Para ti, ó minha força, olharei, porque Deus é o meu refúgio.
    status: ia-sem-revisao
  '59:11':
    texto: O meu Deus, que me favorece com a sua misericórdia, virá ao meu encontro; Deus me fará ver
      a sorte dos meus adversários.
    status: ia-sem-revisao
  '59:17':
    texto: Eu, porém, cantarei a tua força e de manhã aclamarei a tua misericórdia, porque foste para
      mim um refúgio e um abrigo no dia da minha angústia.
    status: ia-sem-revisao
  '59:18':
    texto: Ó minha força, cantarei a ti, pois Deus é o meu refúgio, o Deus da minha misericórdia.
    status: ia-sem-revisao
  '60:3':
    texto: Ó Deus, rejeitaste-nos, abriste brechas em nós, irritaste-te; volta-te para nós.
    status: ia-sem-revisao
  '60:4':
    texto: Fizeste tremer a terra e a fendeste; sara as suas brechas, pois ela vacila.
    status: ia-sem-revisao
  '60:5':
    texto: Fizeste o teu povo ver coisas duras; deste-nos a beber vinho que faz cambalear.
    status: ia-sem-revisao
  '60:12':
    texto: Não és tu, ó Deus, que nos rejeitaste e já não sais com os nossos exércitos?
    status: ia-sem-revisao
  '60:13':
    texto: Dá-nos socorro contra o adversário, pois vã é a salvação que vem do homem.
    status: ia-sem-revisao
  '60:14':
    texto: Com Deus faremos proezas, e ele pisará os nossos adversários.
    status: ia-sem-revisao
  '62:2':
    texto: Só em Deus repousa em silêncio a minha alma; dele vem a minha salvação.
    status: ia-sem-revisao
  '62:3':
    texto: 'Só ele é a minha rocha e a minha salvação, o meu baluarte: não vacilarei muito.'
    status: ia-sem-revisao
  '62:6':
    texto: Só em Deus repousa em silêncio a minha alma, pois dele vem a minha esperança.
    status: ia-sem-revisao
  '62:7':
    texto: 'Só ele é a minha rocha e a minha salvação, o meu baluarte: não vacilarei.'
    status: ia-sem-revisao
  '62:8':
    texto: Em Deus estão a minha salvação e a minha glória; a rocha da minha força, o meu refúgio, está
      em Deus.
    status: ia-sem-revisao
  '62:9':
    texto: 'Confiai nele em todo o tempo, ó povo; derramai diante dele o vosso coração: Deus é o nosso
      refúgio. Pausa.'
    status: ia-sem-revisao
  '63:2':
    texto: Ó Deus, tu és o meu Deus; eu te procuro desde a aurora. A minha alma tem sede de ti, por ti
      anseia a minha carne, numa terra seca, exausta, sem água.
    status: ia-sem-revisao
  '63:3':
    texto: Assim te contemplei no santuário, para ver o teu poder e a tua glória.
    status: ia-sem-revisao
  '63:4':
    texto: Pois a tua misericórdia vale mais do que a vida; os meus lábios te louvarão.
    status: ia-sem-revisao
  '63:5':
    texto: Assim te bendirei enquanto viver; em teu nome levantarei as minhas mãos.
    status: ia-sem-revisao
  '63:6':
    texto: Como de gordura e de banquete se saciará a minha alma, e com lábios jubilosos a minha boca
      te louvará.
    status: ia-sem-revisao
  '63:7':
    texto: Quando me lembro de ti no meu leito, nas vigílias da noite medito em ti.
    status: ia-sem-revisao
  '63:8':
    texto: Pois foste o meu auxílio, e à sombra das tuas asas exultarei.
    status: ia-sem-revisao
  '63:9':
    texto: A minha alma se apega a ti; a tua direita me sustenta.
    status: ia-sem-revisao
  '65:10':
    texto: Visitas a terra e a regas; tu a enriqueces abundantemente; o rio de Deus está cheio de água;
      tu preparas o trigo deles, pois assim a preparaste.
    status: ia-sem-revisao
  '65:11':
    texto: Regas os seus sulcos, aplainas os seus torrões; com chuvas a amoleces e abençoas o seu produto.
    status: ia-sem-revisao
  '65:12':
    texto: Coroas o ano com a tua bondade, e os teus caminhos destilam abundância.
    status: ia-sem-revisao
  '65:13':
    texto: Destilam as pastagens do deserto, e as colinas se cingem de alegria.
    status: ia-sem-revisao
  '65:14':
    texto: Os prados se revestem de rebanhos, e os vales se cobrem de trigo; aclamam e cantam.
    status: ia-sem-revisao
  '66:1':
    texto: Aclamai a Deus, terra inteira.
    titulo: Ao mestre de canto. Cântico. Salmo.
    status: ia-sem-revisao
  '66:2':
    texto: Cantai a glória do seu nome, dai glória ao seu louvor.
    status: ia-sem-revisao
  '66:3':
    texto: 'Dizei a Deus: “Como são admiráveis as tuas obras! Pela grandeza do teu poder, os teus inimigos
      te adulam.'
    partes:
    - 'Dizei a Deus: “Como são admiráveis as tuas obras!'
    - Pela grandeza do teu poder, os teus inimigos te adulam.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '66:4':
    texto: Toda a terra se prostra diante de ti e canta para ti; canta ao teu nome.” Pausa.
    status: ia-sem-revisao
  '66:5':
    texto: Vinde e vede as obras de Deus, temível nos seus feitos em favor dos filhos dos homens.
    status: ia-sem-revisao
  '66:6':
    texto: Mudou o mar em terra seca, atravessaram o rio a pé enxuto; ali nos alegramos nele.
    status: ia-sem-revisao
  '66:7':
    texto: Ele domina para sempre pelo seu poder; os seus olhos vigiam as nações; que os rebeldes não
      se levantem. Pausa.
    partes:
    - Ele domina para sempre pelo seu poder;
    - os seus olhos vigiam as nações; que os rebeldes não se levantem. Pausa.
    status: ia-sem-revisao
  '66:8':
    texto: Bendizei, povos, o nosso Deus, e fazei ouvir a voz do seu louvor.
    status: ia-sem-revisao
  '66:9':
    texto: Foi ele quem nos conservou a vida e não deixou vacilar os nossos pés.
    status: ia-sem-revisao
  '66:16':
    texto: Vinde, ouvi, todos os que temeis a Deus, e eu vos contarei o que ele fez por mim.
    status: ia-sem-revisao
  '66:17':
    texto: A ele clamei com a minha boca, e o exaltei com a minha língua.
    status: ia-sem-revisao
  '66:20':
    texto: Bendito seja Deus, que não rejeitou a minha oração nem afastou de mim a sua misericórdia.
    status: ia-sem-revisao
  '67:2':
    texto: Deus tenha piedade de nós e nos abençoe; faça resplandecer sobre nós a sua face. Pausa.
    status: ia-sem-revisao
  '67:3':
    texto: Para que se conheça na terra o teu caminho e, entre todas as nações, a tua salvação.
    status: ia-sem-revisao
  '67:5':
    texto: Alegrem-se e exultem as nações, porque julgas os povos com retidão e governas as nações na
      terra. Pausa.
    status: ia-sem-revisao
  '67:6':
    texto: Louvem-te os povos, ó Deus; louvem-te todos os povos.
    status: ia-sem-revisao
  '67:7':
    texto: A terra deu o seu fruto; Deus, o nosso Deus, nos abençoa.
    status: ia-sem-revisao
  '67:8':
    texto: Abençoe-nos Deus, e o temam todos os confins da terra.
    status: ia-sem-revisao
  '68:2':
    texto: Levante-se Deus, dispersem-se os seus inimigos, e fujam diante dele os que o odeiam.
    status: ia-sem-revisao
  '68:3':
    texto: Como se dissipa a fumaça, assim os dissipas; como a cera se derrete diante do fogo, assim pereçam
      os ímpios diante de Deus.
    status: ia-sem-revisao
  '68:4':
    texto: Mas os justos se alegrem, exultem diante de Deus e saltem de alegria.
    status: ia-sem-revisao
  '68:5':
    texto: Cantai a Deus, salmodiai ao seu nome; abri caminho àquele que cavalga pelas planícies — Yah
      é o seu nome — e exultai diante dele.
    partes:
    - Cantai a Deus, salmodiai ao seu nome;
    - abri caminho àquele que cavalga pelas planícies — Yah é o seu nome —
    - e exultai diante dele.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '68:6':
    texto: Pai dos órfãos e defensor das viúvas é Deus na sua santa morada.
    status: ia-sem-revisao
  '68:7':
    texto: Deus dá aos solitários uma casa e liberta os presos para a prosperidade; mas os rebeldes habitam
      em terra árida.
    partes:
    - Deus dá aos solitários uma casa e liberta os presos para a prosperidade;
    - mas os rebeldes habitam em terra árida.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '68:10':
    texto: Derramaste uma chuva generosa, ó Deus; a tua herança, esgotada, tu a restabeleceste.
    status: ia-sem-revisao
  '68:11':
    texto: O teu rebanho nela habitou; na tua bondade, ó Deus, preparaste o sustento para o pobre.
    status: ia-sem-revisao
  '68:20':
    texto: Bendito seja o Senhor, que dia após dia leva o nosso fardo; o Deus que é a nossa salvação.
      Pausa.
    status: ia-sem-revisao
  '68:21':
    texto: Nosso Deus é um Deus que salva, e do Senhor Deus vêm as saídas da morte.
    status: ia-sem-revisao
  '68:29':
    texto: Teu Deus decretou a tua força; confirma, ó Deus, o que fizeste por nós.
    status: ia-sem-revisao
  '68:30':
    texto: Desde o teu templo, acima de Jerusalém, reis te trarão presentes.
    status: ia-sem-revisao
  '68:33':
    texto: Reinos da terra, cantai a Deus, salmodiai ao Senhor. Pausa.
    status: ia-sem-revisao
  '68:34':
    texto: Àquele que cavalga nos céus dos céus antigos; eis que ele faz ressoar a sua voz, voz poderosa.
    status: ia-sem-revisao
  '68:35':
    texto: 'Reconhecei o poder de Deus: a sua majestade está sobre Israel, e o seu poder, nas nuvens.'
    status: ia-sem-revisao
  '68:36':
    texto: Tu és temível, ó Deus, desde o teu santuário; o Deus de Israel dá força e poder ao povo. Bendito
      seja Deus!
    status: ia-sem-revisao
  '69:3':
    texto: Afundo em lodo profundo, e não há onde pisar; entrei em águas fundas, e a correnteza me arrasta.
    status: ia-sem-revisao
  '69:5':
    texto: Mais numerosos que os cabelos da minha cabeça são os que me odeiam sem motivo; poderosos são
      os que me destroem, os meus inimigos sem razão; o que não roubei, tenho de restituir.
    status: ia-sem-revisao
  '69:8':
    texto: Por ti suportei afronta, e a vergonha me cobriu o rosto.
    status: ia-sem-revisao
  '69:9':
    texto: Tornei-me estranho aos meus irmãos e forasteiro aos filhos da minha mãe.
    status: ia-sem-revisao
  '69:10':
    texto: Pois o zelo pela tua casa me consome, e as afrontas dos que te insultam caem sobre mim.
    status: ia-sem-revisao
  '69:14':
    texto: Eu, porém, dirijo a ti a minha oração, Senhor, em tempo favorável; ó Deus, na abundância da
      tua misericórdia, responde-me, com a verdade da tua salvação.
    status: ia-sem-revisao
  '69:15':
    texto: Tira-me do lodo, para que eu não afunde; livra-me dos que me odeiam e das águas profundas.
    status: ia-sem-revisao
  '69:16':
    texto: Que a correnteza das águas não me arraste, nem o abismo me engula, nem o poço feche sobre mim
      a sua boca.
    status: ia-sem-revisao
  '69:17':
    texto: Responde-me, Senhor, porque é boa a tua misericórdia; olha para mim segundo a abundância da
      tua compaixão.
    status: ia-sem-revisao
  '69:21':
    texto: A afronta me quebrou o coração, e estou desfalecido; esperei compaixão, e não houve; consoladores,
      e não os achei.
    status: ia-sem-revisao
  '69:22':
    texto: Deram-me fel por comida e, na minha sede, deram-me vinagre a beber.
    status: ia-sem-revisao
  '69:30':
    texto: Eu, porém, sou pobre e sofredor; a tua salvação, ó Deus, me proteja.
    status: ia-sem-revisao
  '69:31':
    texto: Louvarei o nome de Deus com um cântico e o engrandecerei com ação de graças.
    status: ia-sem-revisao
  '69:33':
    texto: Vejam os humildes e se alegrem; vós que buscais a Deus, viva o vosso coração.
    status: ia-sem-revisao
  '69:34':
    texto: Pois o Senhor ouve os pobres e não despreza os seus cativos.
    status: ia-sem-revisao
  '69:35':
    texto: Louvem-no os céus e a terra, os mares e tudo o que neles se move.
    status: ia-sem-revisao
  '69:36':
    texto: Pois Deus salvará Sião e reconstruirá as cidades de Judá, e ali habitarão e a possuirão.
    partes:
    - Pois Deus salvará Sião e reconstruirá as cidades de Judá,
    - e ali habitarão e a possuirão.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '69:37':
    texto: A descendência dos seus servos a herdará, e os que amam o seu nome habitarão nela.
    status: ia-sem-revisao
  '71:1':
    texto: Em ti, Senhor, me refugio; que eu jamais seja envergonhado.
    status: ia-sem-revisao
  '71:2':
    texto: Por tua justiça, livra-me e salva-me; inclina para mim o teu ouvido e liberta-me.
    status: ia-sem-revisao
  '71:3':
    texto: Sê para mim uma rocha de abrigo, onde sempre possa entrar; decidiste salvar-me, pois tu és
      a minha rocha e a minha fortaleza.
    status: ia-sem-revisao
  '71:4':
    texto: Meu Deus, livra-me da mão do ímpio, da mão do homem injusto e violento.
    partes:
    - Meu Deus, livra-me da mão do ímpio,
    - da mão do homem injusto e violento.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '71:5':
    texto: Pois tu és a minha esperança, Senhor Deus, a minha confiança desde a juventude.
    status: ia-sem-revisao
  '71:6':
    texto: Em ti me apoiei desde o ventre; desde o seio de minha mãe és tu o meu amparo; o meu louvor
      está sempre em ti.
    partes:
    - Em ti me apoiei desde o ventre;
    - desde o seio de minha mãe és tu o meu amparo; o meu louvor está sempre em ti.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '71:8':
    texto: A minha boca está cheia do teu louvor, da tua glória o dia inteiro.
    status: ia-sem-revisao
  '71:9':
    texto: Não me rejeites no tempo da velhice; quando me faltarem as forças, não me abandones.
    status: ia-sem-revisao
  '71:14':
    texto: Eu, porém, esperarei sempre e aumentarei todo o teu louvor.
    status: ia-sem-revisao
  '71:15':
    texto: A minha boca anunciará a tua justiça, a tua salvação, o dia inteiro, embora eu não lhes saiba
      o número.
    partes:
    - A minha boca anunciará a tua justiça,
    - a tua salvação, o dia inteiro, embora eu não lhes saiba o número.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '71:16':
    texto: Virei com os feitos poderosos do Senhor Deus; recordarei a tua justiça, só a tua.
    status: ia-sem-revisao
  '71:17':
    texto: Ó Deus, tu me ensinaste desde a juventude, e até agora anuncio as tuas maravilhas.
    status: ia-sem-revisao
  '71:22':
    texto: Também eu te darei graças ao som da harpa pela tua fidelidade, meu Deus; cantar-te-ei com a
      cítara, Santo de Israel.
    status: ia-sem-revisao
  '72:1':
    texto: Ó Deus, dá ao rei o teu julgamento e ao filho do rei a tua justiça.
    titulo: De Salomão.
    status: ia-sem-revisao
  '72:2':
    texto: Que ele julgue o teu povo com justiça e os teus pobres com direito.
    status: ia-sem-revisao
  '72:3':
    texto: Tragam os montes paz ao povo, e as colinas, justiça.
    status: ia-sem-revisao
  '72:4':
    texto: Que ele faça justiça aos pobres do povo, salve os filhos do indigente e esmague o opressor.
    partes:
    - Que ele faça justiça aos pobres do povo,
    - salve os filhos do indigente e esmague o opressor.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '72:7':
    texto: Floresça em seus dias a justiça, e abundância de paz, até que não haja mais lua.
    status: ia-sem-revisao
  '72:8':
    texto: Domine de mar a mar, e do Rio até os confins da terra.
    status: ia-sem-revisao
  '72:10':
    texto: Os reis de Társis e das ilhas lhe trarão tributo; os reis de Sabá e de Seba lhe oferecerão
      presentes.
    status: ia-sem-revisao
  '72:11':
    texto: Prostrem-se diante dele todos os reis; sirvam-no todas as nações.
    status: ia-sem-revisao
  '72:12':
    texto: Pois ele livrará o indigente que clama e o pobre que não tem quem o ajude.
    status: ia-sem-revisao
  '72:13':
    texto: Terá compaixão do fraco e do indigente, e salvará a vida dos necessitados.
    status: ia-sem-revisao
  '72:14':
    texto: Da opressão e da violência resgatará a sua vida, e o seu sangue será precioso aos seus olhos.
    status: ia-sem-revisao
  '72:15':
    texto: Que ele viva e lhe seja dado o ouro de Sabá; que por ele se ore continuamente, e todo o dia
      o bendigam.
    partes:
    - Que ele viva e lhe seja dado o ouro de Sabá;
    - que por ele se ore continuamente,
    - e todo o dia o bendigam.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '72:17':
    texto: Seja o seu nome eterno; perpetue-se o seu nome enquanto durar o sol; nele serão abençoadas
      todas as nações, e o proclamarão feliz.
    status: ia-sem-revisao
  '72:18':
    texto: Bendito seja o Senhor Deus, Deus de Israel, o único que faz maravilhas.
    status: ia-sem-revisao
  '72:19':
    texto: E bendito seja para sempre o seu nome glorioso; que toda a terra se encha da sua glória. Amém
      e amém.
    status: ia-sem-revisao
  '74:1':
    texto: Por que, ó Deus, nos rejeitaste para sempre? Por que arde a tua ira contra o rebanho do teu
      pasto?
    titulo: Poema de Asaf.
    status: ia-sem-revisao
  '74:2':
    texto: Lembra-te da tua comunidade, que adquiriste desde a antiguidade, a tribo da tua herança que
      resgataste; lembra-te do monte Sião, onde habitaste.
    status: ia-sem-revisao
  '74:3':
    texto: Dirige os teus passos para as ruínas perpétuas; o inimigo destruiu tudo no santuário.
    status: ia-sem-revisao
  '74:4':
    texto: Rugiram os teus adversários no meio do teu lugar de assembleia; puseram os seus estandartes
      como sinais.
    status: ia-sem-revisao
  '74:5':
    texto: Pareciam homens que erguem o machado contra a espessura da floresta.
    status: ia-sem-revisao
    observacao: Texto hebraico de leitura difícil nos vv. 5-6; a tradução segue o sentido mais corrente.
  '74:6':
    texto: E agora quebram a golpes todas as suas obras esculpidas, com machados e martelos.
    status: ia-sem-revisao
  '74:7':
    texto: Lançaram fogo ao teu santuário; profanaram, derrubando-a, a morada do teu nome.
    status: ia-sem-revisao
  '74:20':
    texto: Olha para a aliança, pois os recantos da terra estão cheios de covis de violência.
    status: ia-sem-revisao
  '74:21':
    texto: Que o oprimido não volte envergonhado; o pobre e o indigente louvem o teu nome.
    status: ia-sem-revisao
  '77:12':
    texto: Recordo as obras do Senhor; sim, lembrarei as tuas maravilhas de outrora.
    status: ia-sem-revisao
  '77:13':
    texto: Meditarei em toda a tua obra e refletirei sobre os teus feitos.
    status: ia-sem-revisao
  '77:14':
    texto: Ó Deus, santo é o teu caminho; que deus é grande como Deus?
    status: ia-sem-revisao
  '77:15':
    texto: Tu és o Deus que realiza maravilhas; deste a conhecer o teu poder entre os povos.
    status: ia-sem-revisao
  '77:16':
    texto: Com o teu braço resgataste o teu povo, os filhos de Jacó e de José. Pausa.
    status: ia-sem-revisao
  '77:21':
    texto: Guiaste o teu povo como um rebanho, pela mão de Moisés e de Aarão.
    status: ia-sem-revisao
  '78:1':
    texto: Escuta, meu povo, o meu ensinamento; inclinai o ouvido às palavras da minha boca.
    titulo: Poema de Asaf.
    status: ia-sem-revisao
  '78:2':
    texto: Abrirei a boca em parábolas, proporei enigmas desde a antiguidade.
    status: ia-sem-revisao
  '78:3':
    texto: O que ouvimos e conhecemos, e o que os nossos pais nos contaram,
    status: ia-sem-revisao
  '78:4':
    texto: não o esconderemos aos seus filhos, contando à geração seguinte os louvores do Senhor e o seu
      poder, e as maravilhas que realizou.
    partes:
    - não o esconderemos aos seus filhos,
    - contando à geração seguinte os louvores do Senhor e o seu poder,
    - e as maravilhas que realizou.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '78:6':
    texto: Para que a geração seguinte as conheça, os filhos que hão de nascer, e eles se levantem e as
      contem aos seus filhos.
    partes:
    - Para que a geração seguinte as conheça,
    - os filhos que hão de nascer,
    - e eles se levantem e as contem aos seus filhos.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '78:7':
    texto: Para que ponham em Deus a sua confiança, não esqueçam as obras de Deus e guardem os seus mandamentos;
    status: ia-sem-revisao
  '78:8':
    texto: e não sejam como os seus pais, geração rebelde e obstinada, geração de coração instável, cujo
      espírito não foi fiel a Deus.
    status: ia-sem-revisao
  '78:18':
    texto: Puseram Deus à prova no seu coração, pedindo comida a seu gosto.
    status: ia-sem-revisao
  '78:19':
    texto: 'Falaram contra Deus, dizendo: “Poderá Deus preparar uma mesa no deserto?”'
    status: ia-sem-revisao
  '78:23':
    texto: Mas ele mandou às nuvens do alto e abriu as portas do céu.
    status: ia-sem-revisao
  '78:24':
    texto: Fez chover sobre eles o maná para comerem e deu-lhes o trigo do céu.
    status: ia-sem-revisao
  '78:25':
    texto: O homem comeu o pão dos fortes; enviou-lhes provisões à saciedade.
    status: ia-sem-revisao
  '78:26':
    texto: Fez soprar no céu o vento do oriente e conduziu com o seu poder o vento do sul.
    status: ia-sem-revisao
  '78:27':
    texto: Fez chover carne sobre eles como pó, e aves aladas como a areia dos mares.
    status: ia-sem-revisao
  '78:28':
    texto: Fê-las cair no meio do seu acampamento, ao redor das suas tendas.
    status: ia-sem-revisao
  '78:34':
    texto: Quando os fazia morrer, então o buscavam; voltavam e procuravam a Deus com ardor.
    status: ia-sem-revisao
  '78:35':
    texto: Lembravam-se de que Deus era a sua rocha e o Deus Altíssimo, o seu redentor.
    status: ia-sem-revisao
  '78:36':
    texto: Mas o lisonjeavam com a boca e com a língua lhe mentiam.
    status: ia-sem-revisao
  '78:37':
    texto: O seu coração não era firme para com ele, e não eram fiéis à sua aliança.
    status: ia-sem-revisao
  '78:38':
    texto: Ele, porém, compassivo, perdoava a culpa e não os destruía; muitas vezes reprimiu a sua ira
      e não despertou toda a sua fúria.
    status: ia-sem-revisao
  '78:54':
    texto: Introduziu-os no território da sua santidade, nesta montanha que a sua direita conquistou.
    status: ia-sem-revisao
  '78:56':
    texto: Mas puseram à prova o Deus Altíssimo, e se rebelaram contra ele, e não guardaram os seus testemunhos.
    status: ia-sem-revisao
  '78:57':
    texto: Afastaram-se e traíram como os seus pais; voltaram-se como um arco enganador.
    status: ia-sem-revisao
  '78:58':
    texto: Irritaram-no com os seus altos e provocaram o seu ciúme com os seus ídolos.
    status: ia-sem-revisao
  '78:59':
    texto: Deus ouviu e se indignou, e rejeitou totalmente Israel.
    status: ia-sem-revisao
  78:61:
    texto: Entregou ao cativeiro a sua força, e a sua glória, à mão do inimigo.
    status: ia-sem-revisao
  78:62:
    texto: Entregou o seu povo à espada e indignou-se contra a sua herança.
    status: ia-sem-revisao
  '79:1':
    texto: Ó Deus, as nações invadiram a tua herança, profanaram o teu santo templo, reduziram Jerusalém
      a ruínas.
    titulo: Salmo de Asaf.
    status: ia-sem-revisao
  '79:2':
    texto: Deram os cadáveres dos teus servos como alimento às aves do céu, e a carne dos teus fiéis aos
      animais da terra.
    status: ia-sem-revisao
  '79:3':
    texto: Derramaram o sangue deles como água ao redor de Jerusalém, e não havia quem os sepultasse.
    status: ia-sem-revisao
  '79:4':
    texto: Tornamo-nos o opróbrio dos nossos vizinhos, objeto de escárnio e zombaria dos que nos cercam.
    status: ia-sem-revisao
  '79:5':
    texto: Até quando, Senhor? Estarás irado para sempre? Arderá como fogo o teu ciúme?
    status: ia-sem-revisao
  '79:8':
    texto: Não te lembres contra nós das culpas dos nossos antepassados; venham depressa ao nosso encontro
      as tuas misericórdias, pois estamos muito abatidos.
    status: ia-sem-revisao
  '79:9':
    texto: Ajuda-nos, Deus da nossa salvação, pela glória do teu nome; livra-nos e perdoa os nossos pecados
      por amor do teu nome.
    status: ia-sem-revisao
  '79:11':
    texto: Chegue à tua presença o gemido do prisioneiro; pela grandeza do teu braço, preserva os condenados
      à morte.
    status: ia-sem-revisao
  '79:13':
    texto: Nós, teu povo e rebanho do teu pasto, te daremos graças para sempre; de geração em geração
      proclamaremos o teu louvor.
    status: ia-sem-revisao
  '80:2':
    texto: Pastor de Israel, escuta, tu que conduzes José como um rebanho, tu que te assentas sobre os
      querubins, resplandece.
    partes:
    - Pastor de Israel, escuta,
    - tu que conduzes José como um rebanho,
    - tu que te assentas sobre os querubins, resplandece.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '80:3':
    texto: Diante de Efraim, Benjamim e Manassés, desperta o teu poder e vem salvar-nos.
    partes:
    - Diante de Efraim, Benjamim e Manassés,
    - desperta o teu poder e vem salvar-nos.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '80:5':
    texto: Senhor, Deus dos exércitos, até quando te irritarás contra a oração do teu povo?
    status: ia-sem-revisao
  '80:6':
    texto: Deste-lhes a comer pão de lágrimas e a beber lágrimas em abundância.
    status: ia-sem-revisao
  '80:7':
    texto: Fazes de nós motivo de disputa para os nossos vizinhos, e os nossos inimigos zombam de nós.
    status: ia-sem-revisao
  '80:9':
    texto: Tiraste do Egito uma videira; expulsaste nações e a plantaste.
    status: ia-sem-revisao
  '80:12':
    texto: Estendia os seus ramos até o mar e os seus renovos até o rio.
    status: ia-sem-revisao
  '80:13':
    texto: Por que derrubaste as suas cercas, de modo que todos os que passam pelo caminho a vindimam?
    status: ia-sem-revisao
  '80:14':
    texto: O javali da floresta a devasta, e os animais do campo a devoram.
    status: ia-sem-revisao
  '80:15':
    texto: Deus dos exércitos, volta-te, olha do céu e vê; visita esta videira,
    status: ia-sem-revisao
  '80:16':
    texto: a cepa que a tua direita plantou, e o rebento que fortaleceste para ti.
    status: ia-sem-revisao
  '80:18':
    texto: Esteja a tua mão sobre o homem da tua direita, sobre o filho do homem que fortaleceste para
      ti.
    status: ia-sem-revisao
  '80:19':
    texto: E não nos afastaremos de ti; dá-nos vida, e invocaremos o teu nome.
    status: ia-sem-revisao
  '80:20':
    texto: Senhor, Deus dos exércitos, restaura-nos; faze resplandecer o teu rosto, e seremos salvos.
    status: ia-sem-revisao
  '81:3':
    texto: Entoai o canto, tocai o tamborim, a harpa suave com a cítara.
    status: ia-sem-revisao
  '81:4':
    texto: Tocai a trombeta na lua nova, na lua cheia, no dia da nossa festa.
    status: ia-sem-revisao
  '81:5':
    texto: Pois é decreto para Israel, ordenança do Deus de Jacó.
    status: ia-sem-revisao
  '81:6':
    texto: 'Deu-o como testemunho a José, quando saiu contra a terra do Egito. “Ouvi uma língua que eu
      não conhecia:'
    partes:
    - Deu-o como testemunho a José,
    - quando saiu contra a terra do Egito.
    - '“Ouvi uma língua que eu não conhecia:'
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '81:7':
    texto: Aliviei do fardo o seu ombro, as suas mãos largaram o cesto.
    status: ia-sem-revisao
  '81:8':
    texto: Na angústia clamaste, e eu te livrei; respondi-te do esconderijo do trovão; provei-te nas águas
      de Meriba. Pausa.
    partes:
    - Na angústia clamaste, e eu te livrei;
    - respondi-te do esconderijo do trovão;
    - provei-te nas águas de Meriba. Pausa.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '81:9':
    texto: Ouve, meu povo, e eu te advertirei; Israel, oxalá me escutasses!
    status: ia-sem-revisao
  '81:10':
    texto: Não haverá no meio de ti deus estranho, nem te prostrarás diante de deus estrangeiro.
    status: ia-sem-revisao
  '81:11':
    texto: Eu sou o Senhor, teu Deus, que te fiz subir da terra do Egito; abre bem a boca, e eu a encherei.
    partes:
    - Eu sou o Senhor, teu Deus, que te fiz subir da terra do Egito;
    - abre bem a boca, e eu a encherei.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '81:12':
    texto: Mas o meu povo não escutou a minha voz, e Israel não me quis.
    status: ia-sem-revisao
  '81:13':
    texto: 'Por isso os entreguei à dureza do seu coração: que andem segundo os seus próprios conselhos.'
    status: ia-sem-revisao
  '81:14':
    texto: Oxalá o meu povo me escutasse e Israel andasse nos meus caminhos!
    status: ia-sem-revisao
  '81:15':
    texto: Em pouco tempo eu humilharia os seus inimigos e voltaria a minha mão contra os seus adversários.
    status: ia-sem-revisao
  '81:16':
    texto: Os que odeiam o Senhor lhe adulariam, e o seu tempo duraria para sempre.
    status: ia-sem-revisao
  '81:17':
    texto: Eu o alimentaria com a flor do trigo e te saciaria com mel da rocha.”
    status: ia-sem-revisao
  '82:3':
    texto: Fazei justiça ao fraco e ao órfão; defendei o direito do aflito e do indigente.
    status: ia-sem-revisao
  '82:4':
    texto: Livrai o fraco e o necessitado; arrancai-os da mão dos ímpios.
    status: ia-sem-revisao
  '82:6':
    texto: 'Eu disse: “Sois deuses, todos vós sois filhos do Altíssimo.”'
    status: ia-sem-revisao
  '82:7':
    texto: Contudo, morrereis como homens e caireis como qualquer dos príncipes.
    status: ia-sem-revisao
  '84:2':
    texto: Quão amáveis são as tuas moradas, Senhor dos exércitos!
    status: ia-sem-revisao
  '84:3':
    texto: A minha alma suspira e desfalece pelos átrios do Senhor; o meu coração e a minha carne exultam
      pelo Deus vivo.
    status: ia-sem-revisao
  '84:4':
    texto: 'Até o pássaro encontra casa, e a andorinha, um ninho para si, onde põe os seus filhotes: perto
      dos teus altares, Senhor dos exércitos, meu rei e meu Deus!'
    status: ia-sem-revisao
  '84:5':
    texto: 'Felizes os que habitam na tua casa: continuamente te louvam. Pausa.'
    status: ia-sem-revisao
  '84:6':
    texto: Feliz o homem cuja força está em ti, em cujo coração estão os caminhos que sobem.
    partes:
    - Feliz o homem cuja força está em ti,
    - em cujo coração estão os caminhos que sobem.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '84:8':
    texto: Vão de força em força, até que Deus seja visto em Sião.
    partes:
    - Vão de força em força,
    - até que Deus seja visto em Sião.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '84:9':
    texto: Senhor, Deus dos exércitos, ouve a minha oração; escuta, Deus de Jacó. Pausa.
    status: ia-sem-revisao
  '84:10':
    texto: Ó Deus, escudo nosso, olha, e vê o rosto do teu ungido.
    status: ia-sem-revisao
  '84:11':
    texto: Pois vale mais um dia nos teus átrios do que mil fora deles; prefiro estar à porta da casa
      do meu Deus a habitar nas tendas dos ímpios.
    status: ia-sem-revisao
  '84:12':
    texto: Pois o Senhor Deus é sol e escudo; o Senhor concede graça e glória e não recusa o bem aos que
      andam na integridade.
    status: ia-sem-revisao
  '85:2':
    texto: Favoreceste, Senhor, a tua terra; restabeleceste a sorte de Jacó.
    status: ia-sem-revisao
  '85:3':
    texto: Perdoaste a culpa do teu povo, cobriste todos os seus pecados. Pausa.
    status: ia-sem-revisao
  '85:4':
    texto: Retiraste toda a tua cólera, desististe do ardor da tua ira.
    status: ia-sem-revisao
  '85:5':
    texto: Restaura-nos, Deus da nossa salvação, e cessa a tua indignação contra nós.
    status: ia-sem-revisao
  '85:6':
    texto: Ficarás irado conosco para sempre? Prolongarás a tua ira de geração em geração?
    status: ia-sem-revisao
  '85:7':
    texto: Não tornarás a dar-nos a vida, para que o teu povo se alegre em ti?
    status: ia-sem-revisao
  '85:8':
    texto: Mostra-nos, Senhor, a tua misericórdia e concede-nos a tua salvação.
    status: ia-sem-revisao
  '85:9':
    texto: Escutarei o que Deus, o Senhor, fala; pois fala de paz ao seu povo e aos seus fiéis; e que
      não voltem à insensatez.
    partes:
    - Escutarei o que Deus, o Senhor, fala;
    - pois fala de paz ao seu povo e aos seus fiéis; e que não voltem à insensatez.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '85:10':
    texto: Sim, a sua salvação está próxima dos que o temem, para que a glória habite na nossa terra.
    status: ia-sem-revisao
  '85:11':
    texto: Misericórdia e verdade se encontraram; justiça e paz se beijaram.
    status: ia-sem-revisao
  '85:12':
    texto: A verdade brota da terra, e a justiça se inclina do céu.
    status: ia-sem-revisao
  '85:13':
    texto: O Senhor também dará o bem, e a nossa terra dará o seu fruto.
    status: ia-sem-revisao
  '85:14':
    texto: A justiça caminhará diante dele e porá os seus passos no caminho.
    status: ia-sem-revisao
  '86:1':
    texto: Inclina, Senhor, o teu ouvido e responde-me, pois sou pobre e indigente.
    titulo: Oração de Davi.
    status: ia-sem-revisao
  '86:2':
    texto: Guarda a minha vida, porque sou fiel; salva o teu servo, que em ti confia. Tu és o meu Deus.
    status: ia-sem-revisao
  '86:3':
    texto: Tem piedade de mim, Senhor, pois a ti clamo o dia inteiro.
    status: ia-sem-revisao
  '86:4':
    texto: Alegra a alma do teu servo, pois a ti, Senhor, elevo a minha alma.
    status: ia-sem-revisao
  '86:5':
    texto: Pois tu, Senhor, és bom e perdoas, e és rico em misericórdia para todos os que te invocam.
    status: ia-sem-revisao
  '86:6':
    texto: Dá ouvidos, Senhor, à minha oração e atende à voz das minhas súplicas.
    status: ia-sem-revisao
  '86:9':
    texto: Todas as nações que fizeste virão e se prostrarão diante de ti, Senhor, e glorificarão o teu
      nome.
    status: ia-sem-revisao
  '86:10':
    texto: Pois tu és grande e fazes maravilhas; só tu és Deus.
    status: ia-sem-revisao
  '86:15':
    texto: Mas tu, Senhor, és Deus compassivo e misericordioso, lento para a ira e rico em misericórdia
      e fidelidade.
    status: ia-sem-revisao
  '86:16':
    texto: Volta-te para mim e tem piedade de mim; dá a tua força ao teu servo e salva o filho da tua
      serva.
    status: ia-sem-revisao
  '87:1':
    texto: Ele a fundou sobre os montes santos.
    titulo: Dos filhos de Coré. Salmo. Cântico.
    status: ia-sem-revisao
  '87:2':
    texto: O Senhor ama as portas de Sião mais do que todas as moradas de Jacó.
    status: ia-sem-revisao
  '87:3':
    texto: Coisas gloriosas se dizem de ti, cidade de Deus. Pausa.
    status: ia-sem-revisao
  '87:4':
    texto: 'Mencionarei Raab e Babilônia entre os que me conhecem; eis a Filisteia, Tiro e Cuxe: “Este
      nasceu ali.”'
    status: ia-sem-revisao
  '87:5':
    texto: 'E de Sião se dirá: “Este e aquele nasceram nela”; e o próprio Altíssimo a firmará.'
    status: ia-sem-revisao
  '87:6':
    texto: 'O Senhor registrará no livro dos povos: “Este nasceu ali.” Pausa.'
    status: ia-sem-revisao
  '87:7':
    texto: 'E cantarão e dançarão: “Todas as minhas fontes estão em ti.”'
    status: ia-sem-revisao
  '88:2':
    texto: Senhor, Deus da minha salvação, de dia clamo e de noite estou diante de ti.
    status: ia-sem-revisao
  '88:3':
    texto: Chegue à tua presença a minha oração; inclina o teu ouvido ao meu clamor.
    status: ia-sem-revisao
  '88:4':
    texto: Pois a minha alma está saturada de males, e a minha vida chegou perto do abismo.
    status: ia-sem-revisao
  '88:5':
    texto: Sou contado entre os que descem à cova; sou como um homem sem forças.
    status: ia-sem-revisao
  '88:6':
    texto: Abandonado entre os mortos, como os traspassados que jazem no sepulcro, dos quais já não te
      lembras, e que foram separados da tua mão.
    status: ia-sem-revisao
  '88:7':
    texto: Puseste-me na cova mais profunda, em lugares tenebrosos, nas profundezas.
    status: ia-sem-revisao
  '88:8':
    texto: Sobre mim pesa o teu furor, e me abates com todas as tuas ondas. Pausa.
    status: ia-sem-revisao
  '88:10':
    texto: Os meus olhos se consomem de aflição; clamo a ti, Senhor, todos os dias, estendo para ti as
      minhas mãos.
    partes:
    - Os meus olhos se consomem de aflição;
    - clamo a ti, Senhor, todos os dias,
    - estendo para ti as minhas mãos.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '88:11':
    texto: Acaso farás maravilhas pelos mortos? Ou as sombras se levantarão para te louvar? Pausa.
    status: ia-sem-revisao
  '88:12':
    texto: Anuncia-se no sepulcro a tua misericórdia, ou a tua fidelidade na região da perdição?
    status: ia-sem-revisao
  '88:13':
    texto: Conhecem-se na treva as tuas maravilhas, ou a tua justiça na terra do esquecimento?
    status: ia-sem-revisao
  '88:14':
    texto: Eu, porém, clamo a ti, Senhor, e de manhã a minha oração chega à tua presença.
    status: ia-sem-revisao
  '88:15':
    texto: Por que, Senhor, rejeitas a minha alma e escondes de mim o teu rosto?
    status: ia-sem-revisao
  '89:2':
    texto: Cantarei para sempre as misericórdias do Senhor; de geração em geração anunciarei com a minha
      boca a tua fidelidade.
    status: ia-sem-revisao
  '89:3':
    texto: 'Pois eu disse: “A misericórdia está edificada para sempre; no próprio céu firmas a tua fidelidade.”'
    status: ia-sem-revisao
  '89:4':
    texto: '“Fiz aliança com o meu eleito, jurei a Davi, meu servo:'
    status: ia-sem-revisao
  '89:5':
    texto: Para sempre firmarei a tua descendência e edificarei o teu trono de geração em geração.” Pausa.
    status: ia-sem-revisao
  '89:6':
    texto: Os céus louvam as tuas maravilhas, Senhor, e a tua fidelidade, na assembleia dos santos.
    status: ia-sem-revisao
  '89:7':
    texto: Pois quem nas nuvens se compara ao Senhor? Quem entre os filhos de Deus é semelhante ao Senhor?
    status: ia-sem-revisao
  '89:16':
    texto: Feliz o povo que sabe aclamar-te, Senhor; andam à luz do teu rosto.
    status: ia-sem-revisao
  '89:17':
    texto: Em teu nome exultam o dia inteiro e na tua justiça são exaltados.
    status: ia-sem-revisao
  '89:18':
    texto: Pois tu és a glória da sua força, e com o teu favor ergues a nossa fronte.
    status: ia-sem-revisao
  '89:19':
    texto: Pois do Senhor é o nosso escudo, e do Santo de Israel, o nosso rei.
    status: ia-sem-revisao
  '89:20':
    texto: 'Então falaste em visão aos teus fiéis e disseste: “Pus um socorro sobre um valente, exaltei
      um escolhido do povo.'
    status: ia-sem-revisao
  '89:21':
    texto: Encontrei Davi, meu servo; com o meu óleo santo o ungi.
    status: ia-sem-revisao
  '89:22':
    texto: A minha mão o sustentará, e o meu braço o fortalecerá.
    status: ia-sem-revisao
  '89:25':
    texto: A minha fidelidade e a minha misericórdia estarão com ele, e em meu nome será exaltada a sua
      fronte.
    status: ia-sem-revisao
  '89:26':
    texto: Porei a sua mão sobre o mar e a sua direita sobre os rios.
    status: ia-sem-revisao
  '89:27':
    texto: 'Ele me invocará: ‘Tu és meu Pai, meu Deus e rochedo da minha salvação.’'
    status: ia-sem-revisao
  '89:28':
    texto: Eu também o farei meu primogênito, o mais alto entre os reis da terra.
    status: ia-sem-revisao
  '89:29':
    texto: Para sempre lhe guardarei a minha misericórdia, e a minha aliança com ele será firme.
    status: ia-sem-revisao
  '89:30':
    texto: Farei durar para sempre a sua descendência, e o seu trono, como os dias do céu.
    status: ia-sem-revisao
  '89:31':
    texto: Se os seus filhos abandonarem a minha lei e não andarem nos meus juízos,
    status: ia-sem-revisao
  '89:32':
    texto: se profanarem os meus estatutos e não guardarem os meus mandamentos,
    status: ia-sem-revisao
  '89:33':
    texto: castigarei com vara a sua transgressão e com açoites a sua culpa.
    status: ia-sem-revisao
  '89:34':
    texto: Mas não retirarei dele a minha misericórdia, nem faltarei à minha fidelidade.
    status: ia-sem-revisao
  '90:2':
    texto: Antes que os montes nascessem e que a terra e o mundo fossem gerados, desde sempre e para sempre
      tu és Deus.
    status: ia-sem-revisao
  '90:3':
    texto: 'Fazes voltar o homem ao pó e dizes: “Voltai, filhos dos homens.”'
    status: ia-sem-revisao
  '90:4':
    texto: Pois mil anos aos teus olhos são como o dia de ontem que passou, como uma vigília da noite.
    status: ia-sem-revisao
  '90:5':
    texto: Tu os arrebatas como um sono; de manhã são como a erva que renasce.
    status: ia-sem-revisao
  '90:6':
    texto: De manhã floresce e renasce; à tarde é cortada e seca.
    status: ia-sem-revisao
  '90:10':
    texto: Os dias dos nossos anos são setenta anos, ou, para os mais fortes, oitenta; e o seu orgulho
      é fadiga e vaidade, pois passam depressa, e nós voamos.
    status: ia-sem-revisao
  '90:12':
    texto: Ensina-nos a contar os nossos dias, para que alcancemos um coração sábio.
    status: ia-sem-revisao
  '90:13':
    texto: Volta, Senhor! Até quando? Tem compaixão dos teus servos.
    status: ia-sem-revisao
  '90:14':
    texto: Sacia-nos de manhã com a tua misericórdia, e exultaremos e nos alegraremos todos os nossos
      dias.
    status: ia-sem-revisao
  '90:15':
    texto: Alegra-nos pelos dias em que nos afligiste, pelos anos em que vimos a desgraça.
    status: ia-sem-revisao
  '90:16':
    texto: Apareça aos teus servos a tua obra, e a tua glória, aos seus filhos.
    status: ia-sem-revisao
  '90:17':
    texto: Seja sobre nós a bondade do Senhor, nosso Deus; confirma a obra das nossas mãos, sim, confirma
      a obra das nossas mãos.
    status: ia-sem-revisao
  '91:1':
    texto: Aquele que habita no abrigo do Altíssimo e mora à sombra do Onipotente
    status: ia-sem-revisao
  '91:2':
    texto: 'diz ao Senhor: “Meu refúgio e minha fortaleza, meu Deus, em quem confio!”'
    status: ia-sem-revisao
  '91:3':
    texto: Pois ele te livrará do laço do caçador e da peste mortífera.
    status: ia-sem-revisao
  '91:4':
    texto: Cobrir-te-á com as suas penas, e sob as suas asas te refugiarás; a sua fidelidade é escudo
      e couraça.
    status: ia-sem-revisao
  '91:5':
    texto: Não temerás o terror da noite, nem a flecha que voa de dia,
    status: ia-sem-revisao
  '91:6':
    texto: nem a peste que caminha na escuridão, nem a epidemia que devasta ao meio-dia.
    status: ia-sem-revisao
  '91:10':
    texto: Nenhum mal te sucederá, e praga alguma chegará à tua tenda.
    status: ia-sem-revisao
  '91:11':
    texto: Pois ele dará ordens aos seus anjos a teu respeito, para que te guardem em todos os teus caminhos.
    status: ia-sem-revisao
  '91:12':
    texto: Em suas mãos te levarão, para que não tropeces em pedra alguma.
    status: ia-sem-revisao
  '91:13':
    texto: Pisarás o leão e a víbora, calcarás o leãozinho e o dragão.
    status: ia-sem-revisao
  '91:14':
    texto: “Porque se apegou a mim, eu o livrarei; protegê-lo-ei, porque conhece o meu nome.
    status: ia-sem-revisao
  '91:15':
    texto: Quando me invocar, eu lhe responderei; estarei com ele na angústia, livrá-lo-ei e o glorificarei.
    partes:
    - Quando me invocar, eu lhe responderei;
    - estarei com ele na angústia,
    - livrá-lo-ei e o glorificarei.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '91:16':
    texto: Saciá-lo-ei de longos dias e lhe mostrarei a minha salvação.”
    status: ia-sem-revisao
  '92:2':
    texto: É bom dar graças ao Senhor e cantar ao teu nome, ó Altíssimo,
    status: ia-sem-revisao
  '92:3':
    texto: anunciar de manhã a tua misericórdia e de noite a tua fidelidade.
    status: ia-sem-revisao
  '92:13':
    texto: O justo florescerá como a palmeira, crescerá como o cedro do Líbano.
    status: ia-sem-revisao
  '92:14':
    texto: Plantados na casa do Senhor, florescerão nos átrios do nosso Deus.
    status: ia-sem-revisao
  '92:15':
    texto: Ainda na velhice darão fruto, serão cheios de seiva e verdes,
    status: ia-sem-revisao
  '92:16':
    texto: para anunciar que o Senhor é reto, minha rocha, e nele não há injustiça.
    status: ia-sem-revisao
  '93:1':
    texto: O Senhor reina; vestiu-se de majestade; o Senhor se vestiu, cingiu-se de poder. Por isso o
      mundo está firme e não vacila.
    partes:
    - O Senhor reina;
    - vestiu-se de majestade;
    - o Senhor se vestiu,
    - cingiu-se de poder.
    - Por isso o mundo está firme e não vacila.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '93:2':
    texto: Firme é o teu trono desde a eternidade; tu existes desde sempre.
    status: ia-sem-revisao
  '93:5':
    texto: Os teus testemunhos são muito fiéis; a santidade convém à tua casa, Senhor, por longos dias.
    status: ia-sem-revisao
  '94:5':
    texto: Esmagam o teu povo, Senhor, e oprimem a tua herança.
    status: ia-sem-revisao
  '94:6':
    texto: Matam a viúva e o estrangeiro e assassinam os órfãos.
    status: ia-sem-revisao
  '94:7':
    texto: 'E dizem: “O Senhor não vê, o Deus de Jacó não percebe.”'
    status: ia-sem-revisao
  '94:8':
    texto: Entendei, os mais estúpidos do povo; e vós, insensatos, quando sereis sábios?
    status: ia-sem-revisao
  '94:9':
    texto: Aquele que plantou o ouvido, não ouvirá? Aquele que formou o olho, não verá?
    status: ia-sem-revisao
  '94:10':
    texto: Aquele que corrige as nações, não repreenderá? Aquele que ensina o saber ao homem...
    status: ia-sem-revisao
  '94:12':
    texto: Feliz o homem a quem corriges, Senhor, e a quem ensinas a tua lei,
    status: ia-sem-revisao
  '94:13':
    texto: para lhe dar descanso nos dias maus, até que se cave a cova para o ímpio.
    partes:
    - para lhe dar descanso nos dias maus,
    - até que se cave a cova para o ímpio.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '94:14':
    texto: Pois o Senhor não rejeitará o seu povo, nem abandonará a sua herança.
    status: ia-sem-revisao
  '94:15':
    texto: Pois o julgamento voltará à justiça, e todos os retos de coração o seguirão.
    status: ia-sem-revisao
  '94:17':
    texto: Se o Senhor não me tivesse socorrido, em pouco a minha alma habitaria no silêncio.
    status: ia-sem-revisao
  '94:18':
    texto: 'Quando eu digo: “O meu pé vacila”, a tua misericórdia, Senhor, me sustenta.'
    status: ia-sem-revisao
  '94:19':
    texto: Quando as preocupações se multiplicam dentro de mim, os teus consolos alegram a minha alma.
    status: ia-sem-revisao
  '95:1':
    texto: Vinde, cantemos ao Senhor com júbilo, aclamemos a rocha da nossa salvação.
    status: ia-sem-revisao
  '95:2':
    texto: Apresentemo-nos diante dele com louvores, aclamemo-lo com cânticos.
    status: ia-sem-revisao
  '95:3':
    texto: Pois o Senhor é um Deus grande, um grande rei acima de todos os deuses.
    status: ia-sem-revisao
  '95:4':
    texto: Em suas mãos estão as profundezas da terra, e os cumes dos montes lhe pertencem.
    status: ia-sem-revisao
  '95:5':
    texto: Dele é o mar, pois ele o fez; e as suas mãos formaram a terra firme.
    status: ia-sem-revisao
  '95:6':
    texto: Vinde, adoremos e prostremo-nos; ajoelhemos diante do Senhor que nos criou.
    status: ia-sem-revisao
  '95:7':
    texto: Pois ele é o nosso Deus, e nós somos o povo do seu pasto e o rebanho conduzido por sua mão.
      Oxalá hoje ouvísseis a sua voz!
    partes:
    - Pois ele é o nosso Deus, e nós somos o povo do seu pasto e o rebanho conduzido por sua mão.
    - Oxalá hoje ouvísseis a sua voz!
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '95:8':
    texto: “Não endureçais o vosso coração como em Meriba, como no dia de Massa, no deserto,
    status: ia-sem-revisao
  '95:9':
    texto: quando os vossos pais me puseram à prova, me tentaram, embora vissem as minhas obras.
    status: ia-sem-revisao
  '95:10':
    texto: 'Durante quarenta anos senti desgosto daquela geração e disse: ‘É um povo de coração errante,
      que não conhece os meus caminhos.’'
    status: ia-sem-revisao
  '95:11':
    texto: 'Por isso jurei na minha ira: ‘Não entrarão no meu repouso.’”'
    status: ia-sem-revisao
  '96:1':
    texto: Cantai ao Senhor um canto novo; cantai ao Senhor, terra inteira.
    status: ia-sem-revisao
  '96:2':
    texto: Cantai ao Senhor, bendizei o seu nome; anunciai dia após dia a sua salvação.
    partes:
    - Cantai ao Senhor, bendizei o seu nome;
    - anunciai dia após dia a sua salvação.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '96:3':
    texto: Proclamai entre as nações a sua glória, entre todos os povos as suas maravilhas.
    status: ia-sem-revisao
  '96:4':
    texto: Pois o Senhor é grande e digno de todo louvor, mais temível do que todos os deuses.
    status: ia-sem-revisao
  '96:5':
    texto: Pois todos os deuses dos povos são ídolos, mas o Senhor fez os céus.
    partes:
    - Pois todos os deuses dos povos são ídolos,
    - mas o Senhor fez os céus.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '96:6':
    texto: Esplendor e majestade estão diante dele; poder e beleza, no seu santuário.
    status: ia-sem-revisao
  '96:7':
    texto: Tributai ao Senhor, famílias dos povos, tributai ao Senhor glória e poder.
    status: ia-sem-revisao
  '96:8':
    texto: Tributai ao Senhor a glória do seu nome; trazei oferendas e entrai nos seus átrios.
    partes:
    - Tributai ao Senhor a glória do seu nome;
    - trazei oferendas e entrai nos seus átrios.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '96:9':
    texto: Prostrai-vos diante do Senhor no esplendor da santidade; tremei diante dele, terra inteira.
    status: ia-sem-revisao
  '96:10':
    texto: 'Dizei entre as nações: “O Senhor reina!” Por isso o mundo está firme e não vacila; ele julgará
      os povos com retidão.'
    partes:
    - 'Dizei entre as nações: “O Senhor reina!”'
    - Por isso o mundo está firme e não vacila;
    - ele julgará os povos com retidão.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '96:11':
    texto: Alegrem-se os céus e exulte a terra; ruja o mar e tudo o que ele contém.
    status: ia-sem-revisao
  '96:12':
    texto: Exultem os campos e tudo o que neles existe; então cantarão de alegria todas as árvores da
      floresta,
    partes:
    - Exultem os campos e tudo o que neles existe;
    - então cantarão de alegria todas as árvores da floresta,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '96:13':
    texto: diante do Senhor, que vem, porque vem julgar a terra. Julgará o mundo com justiça e os povos
      com a sua fidelidade.
    status: ia-sem-revisao
  '97:1':
    texto: O Senhor reina! Exulte a terra, alegrem-se as muitas ilhas.
    status: ia-sem-revisao
  '97:2':
    texto: Nuvem e escuridão o rodeiam; justiça e direito são o fundamento do seu trono.
    partes:
    - Nuvem e escuridão o rodeiam;
    - justiça e direito são o fundamento do seu trono.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '97:3':
    texto: Um fogo vai adiante dele e devora ao redor os seus adversários.
    status: ia-sem-revisao
  '97:4':
    texto: Os seus relâmpagos iluminam o mundo; a terra o vê e estremece.
    status: ia-sem-revisao
  '97:5':
    texto: Os montes se derretem como cera diante do Senhor, diante do Senhor de toda a terra.
    status: ia-sem-revisao
  '97:6':
    texto: Os céus proclamam a sua justiça, e todos os povos veem a sua glória.
    status: ia-sem-revisao
  '97:7':
    texto: Sejam envergonhados todos os que servem a imagens, os que se gloriam em ídolos. Prostrai-vos
      diante dele, todos os deuses.
    partes:
    - Sejam envergonhados todos os que servem a imagens,
    - os que se gloriam em ídolos.
    - Prostrai-vos diante dele, todos os deuses.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '97:9':
    texto: Pois tu, Senhor, és o Altíssimo sobre toda a terra, muito exaltado acima de todos os deuses.
    status: ia-sem-revisao
  '97:10':
    texto: Vós que amais o Senhor, odiai o mal; ele guarda a vida dos seus fiéis e os livra da mão dos
      ímpios.
    status: ia-sem-revisao
  '97:11':
    texto: A luz se semeia para o justo, e a alegria para os retos de coração.
    status: ia-sem-revisao
  '97:12':
    texto: Alegrai-vos no Senhor, justos, e dai graças ao seu santo nome.
    status: ia-sem-revisao
  '98:1':
    texto: Cantai ao Senhor um canto novo, porque fez maravilhas; a sua direita e o seu santo braço lhe
      deram a vitória.
    titulo: Salmo.
    status: ia-sem-revisao
  '98:2':
    texto: O Senhor deu a conhecer a sua salvação, revelou a sua justiça aos olhos das nações.
    status: ia-sem-revisao
  '98:3':
    texto: Lembrou-se da sua misericórdia e da sua fidelidade para com a casa de Israel; todos os confins
      da terra viram a salvação do nosso Deus.
    partes:
    - Lembrou-se da sua misericórdia
    - e da sua fidelidade para com a casa de Israel;
    - todos os confins da terra
    - viram a salvação do nosso Deus.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '98:4':
    texto: Aclamai o Senhor, terra inteira; rompei em júbilo, cantai e tocai.
    status: ia-sem-revisao
  '98:5':
    texto: Tocai para o Senhor com a cítara, com a cítara e ao som de melodias.
    status: ia-sem-revisao
  '98:6':
    texto: Com trombetas e ao som da corneta aclamai diante do Senhor, o Rei.
    status: ia-sem-revisao
  '98:7':
    texto: Ruja o mar e tudo o que ele contém, o mundo e os que nele habitam.
    status: ia-sem-revisao
  '98:8':
    texto: Os rios batam palmas, e os montes cantem de alegria
    status: ia-sem-revisao
  '98:9':
    texto: diante do Senhor, que vem julgar a terra. Julgará o mundo com justiça e os povos com retidão.
    status: ia-sem-revisao
  '99:5':
    texto: 'Exaltai o Senhor, nosso Deus, e prostrai-vos diante do seu estrado: ele é santo.'
    status: ia-sem-revisao
  '99:6':
    texto: Moisés e Aarão entre os seus sacerdotes, e Samuel entre os que invocavam o seu nome, clamavam
      ao Senhor, e ele lhes respondia.
    status: ia-sem-revisao
  '99:7':
    texto: Falava-lhes na coluna de nuvem; eles guardavam os seus testemunhos e o decreto que lhes dera.
    status: ia-sem-revisao
  '99:8':
    texto: Senhor, nosso Deus, tu lhes respondias; foste para eles um Deus que perdoa, mas que castiga
      os seus malfeitos.
    status: ia-sem-revisao
  '99:9':
    texto: Exaltai o Senhor, nosso Deus, e prostrai-vos diante do seu santo monte, pois santo é o Senhor,
      nosso Deus.
    status: ia-sem-revisao
  '100:1':
    texto: Aclamai o Senhor, terra inteira.
    titulo: Salmo de ação de graças.
    status: ia-sem-revisao
  '100:2':
    texto: Servi ao Senhor com alegria, entrai na sua presença com júbilo.
    status: ia-sem-revisao
  '100:3':
    texto: 'Sabei que o Senhor é Deus; foi ele quem nos fez, e somos seus: seu povo e rebanho do seu pasto.'
    status: ia-sem-revisao
    observacao: 'O hebraico escrito (ketiv) traz “e não nós”; seguiu-se a leitura tradicional (qere):
      “e somos seus”, que é também a da Vulgata.'
  '100:4':
    texto: Entrai pelas suas portas com ação de graças, pelos seus átrios com louvor; dai-lhe graças,
      bendizei o seu nome.
    status: ia-sem-revisao
  '100:5':
    texto: Pois o Senhor é bom; a sua misericórdia dura para sempre, e a sua fidelidade, de geração em
      geração.
    status: ia-sem-revisao
  '101:1':
    texto: Cantarei a misericórdia e o direito; a ti, Senhor, tocarei.
    titulo: De Davi. Salmo.
    status: ia-sem-revisao
  '101:2':
    texto: 'Procurarei o caminho da integridade: quando virás a mim? Andarei com coração íntegro no interior
      da minha casa.'
    partes:
    - 'Procurarei o caminho da integridade:'
    - quando virás a mim?
    - Andarei com coração íntegro no interior da minha casa.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '101:3':
    texto: 'Não porei diante dos meus olhos coisa vil; odeio a conduta dos que se desviam: não se prenderá
      a mim.'
    partes:
    - Não porei diante dos meus olhos coisa vil;
    - 'odeio a conduta dos que se desviam: não se prenderá a mim.'
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '101:5':
    texto: Quem difama em segredo o seu próximo, eu o farei calar; o olhar altivo e o coração arrogante,
      não os suportarei.
    status: ia-sem-revisao
  '101:6':
    texto: Meus olhos estão postos nos fiéis da terra, para que habitem comigo; quem anda no caminho da
      integridade, esse me servirá.
    status: ia-sem-revisao
  '102:2':
    texto: Senhor, escuta a minha oração, e chegue a ti o meu clamor.
    status: ia-sem-revisao
  '102:3':
    texto: Não escondas de mim o teu rosto no dia da minha angústia; inclina para mim o teu ouvido; no
      dia em que te invocar, responde-me depressa.
    status: ia-sem-revisao
  '102:13':
    texto: Tu, porém, Senhor, permaneces para sempre, e a tua memória, de geração em geração.
    status: ia-sem-revisao
  '102:14':
    texto: Tu te levantarás e terás compaixão de Sião, pois é tempo de lhe fazeres graça, pois chegou
      a hora.
    status: ia-sem-revisao
  '102:15':
    texto: Pois os teus servos amam as suas pedras e se compadecem do seu pó.
    status: ia-sem-revisao
  '102:16':
    texto: As nações temerão o nome do Senhor, e todos os reis da terra, a tua glória,
    status: ia-sem-revisao
  '102:17':
    texto: quando o Senhor tiver reconstruído Sião e aparecido na sua glória;
    status: ia-sem-revisao
  '102:18':
    texto: quando se voltar para a oração dos despojados e não desprezar a sua súplica.
    status: ia-sem-revisao
  '102:19':
    texto: Isto se escreva para a geração futura, e o povo que será criado louvará o Senhor.
    status: ia-sem-revisao
  '102:20':
    texto: Pois do alto do seu santuário o Senhor olhou, do céu observou a terra,
    status: ia-sem-revisao
  '102:21':
    texto: para ouvir o gemido do prisioneiro e libertar os condenados à morte,
    status: ia-sem-revisao
  '102:22':
    texto: para que se proclame em Sião o nome do Senhor e o seu louvor em Jerusalém,
    status: ia-sem-revisao
  '102:23':
    texto: quando se reunirem os povos e os reinos para servir ao Senhor.
    status: ia-sem-revisao
  '102:29':
    texto: Os filhos dos teus servos habitarão seguros, e a sua descendência permanecerá firme diante
      de ti.
    status: ia-sem-revisao
  '103:1':
    texto: Bendize o Senhor, ó minha alma, e tudo o que há em mim bendiga o seu santo nome.
    titulo: De Davi.
    status: ia-sem-revisao
  '103:2':
    texto: Bendize o Senhor, ó minha alma, e não te esqueças de nenhum dos seus benefícios.
    status: ia-sem-revisao
  '103:3':
    texto: Ele perdoa todas as tuas culpas e cura todas as tuas enfermidades.
    status: ia-sem-revisao
  '103:4':
    texto: Ele redime a tua vida da cova e te coroa de misericórdia e compaixão.
    status: ia-sem-revisao
  '103:6':
    texto: O Senhor faz justiça e dá direito a todos os oprimidos.
    status: ia-sem-revisao
  '103:7':
    texto: Deu a conhecer os seus caminhos a Moisés e os seus feitos aos filhos de Israel.
    status: ia-sem-revisao
  '103:8':
    texto: O Senhor é compassivo e misericordioso, lento para a ira e cheio de bondade.
    status: ia-sem-revisao
  '103:9':
    texto: Não repreende para sempre, nem guarda rancor eternamente.
    status: ia-sem-revisao
  '103:10':
    texto: Não nos trata segundo os nossos pecados, nem nos retribui segundo as nossas culpas.
    status: ia-sem-revisao
  '103:11':
    texto: Pois, quanto o céu se eleva acima da terra, tanto prevalece a sua misericórdia sobre os que
      o temem.
    status: ia-sem-revisao
  '103:12':
    texto: Quanto dista o oriente do ocidente, tanto afastou de nós as nossas transgressões.
    status: ia-sem-revisao
  '103:13':
    texto: Como um pai tem compaixão dos filhos, assim o Senhor tem compaixão dos que o temem.
    status: ia-sem-revisao
  '103:14':
    texto: Pois ele conhece a nossa formação, lembra-se de que somos pó.
    status: ia-sem-revisao
  '103:15':
    texto: Os dias do homem são como a erva; como a flor do campo, assim ele floresce.
    status: ia-sem-revisao
  '103:16':
    texto: Passa o vento por ele, e já não existe; o seu lugar já não o reconhece.
    status: ia-sem-revisao
  '103:17':
    texto: Mas a misericórdia do Senhor é de eternidade em eternidade para os que o temem, e a sua justiça,
      para os filhos dos filhos,
    status: ia-sem-revisao
  '103:18':
    texto: para os que guardam a sua aliança e se lembram de cumprir os seus preceitos.
    status: ia-sem-revisao
  '103:19':
    texto: O Senhor estabeleceu no céu o seu trono, e o seu reino domina sobre tudo.
    status: ia-sem-revisao
  '103:20':
    texto: Bendizei o Senhor, vós, seus anjos, poderosos em força, que cumpris as suas ordens, obedecendo
      à voz da sua palavra.
    status: ia-sem-revisao
  '104:1':
    texto: Bendize o Senhor, ó minha alma. Senhor, meu Deus, como és grande! De esplendor e majestade
      estás revestido.
    partes:
    - Bendize o Senhor, ó minha alma.
    - Senhor, meu Deus, como és grande! De esplendor e majestade estás revestido.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '104:2':
    texto: Envolves-te de luz como de um manto; estendes os céus como uma tenda.
    partes:
    - Envolves-te de luz como de um manto;
    - estendes os céus como uma tenda.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '104:3':
    texto: Constróis sobre as águas os teus aposentos; fazes das nuvens o teu carro e caminhas sobre as
      asas do vento.
    status: ia-sem-revisao
  '104:4':
    texto: Fazes dos ventos os teus mensageiros, e do fogo ardente, os teus servos.
    status: ia-sem-revisao
  '104:5':
    texto: Fundaste a terra sobre as suas bases; jamais será abalada.
    status: ia-sem-revisao
  '104:6':
    texto: O abismo a cobria como um vestido; as águas estavam acima dos montes.
    status: ia-sem-revisao
  '104:10':
    texto: Fazes brotar fontes nos vales; correm entre os montes.
    status: ia-sem-revisao
  '104:11':
    texto: Dão de beber a todos os animais do campo; os asnos selvagens matam a sua sede.
    status: ia-sem-revisao
  '104:12':
    texto: Junto delas habitam as aves do céu e cantam entre a folhagem.
    status: ia-sem-revisao
  '104:13':
    texto: Das tuas moradas regas os montes; a terra se sacia do fruto das tuas obras.
    status: ia-sem-revisao
  '104:14':
    texto: Fazes brotar a erva para o gado e as plantas para o serviço do homem, para tirar da terra o
      pão,
    status: ia-sem-revisao
  '104:24':
    texto: Quão numerosas são as tuas obras, Senhor! Fizeste todas com sabedoria; a terra está cheia das
      tuas criaturas.
    partes:
    - Quão numerosas são as tuas obras, Senhor!
    - Fizeste todas com sabedoria;
    - a terra está cheia das tuas criaturas.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '104:25':
    texto: 'Eis o mar, grande e vasto: nele se movem seres sem número, animais pequenos e grandes.'
    status: ia-sem-revisao
  '104:27':
    texto: Todos esperam de ti que lhes dês o alimento a seu tempo.
    status: ia-sem-revisao
  '104:28':
    texto: Tu lhes dás, e eles recolhem; abres a mão, e se saciam de bens.
    status: ia-sem-revisao
  '104:29':
    texto: Se escondes o teu rosto, ficam aterrados; se lhes retiras o espírito, expiram e voltam ao seu
      pó.
    partes:
    - Se escondes o teu rosto, ficam aterrados;
    - se lhes retiras o espírito, expiram
    - e voltam ao seu pó.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '104:30':
    texto: Envias o teu espírito, e são criados, e renovas a face da terra.
    status: ia-sem-revisao
  '104:31':
    texto: Seja eterna a glória do Senhor; alegre-se o Senhor nas suas obras.
    status: ia-sem-revisao
  '104:34':
    texto: Seja-lhe agradável o meu cântico; eu me alegro no Senhor.
    status: ia-sem-revisao
  '104:35':
    texto: Desapareçam os pecadores da terra, e os ímpios não existam mais. Bendize o Senhor, ó minha
      alma. Aleluia.
    partes:
    - Desapareçam os pecadores da terra,
    - e os ímpios não existam mais.
    - Bendize o Senhor, ó minha alma. Aleluia.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '105:1':
    texto: Dai graças ao Senhor, invocai o seu nome, dai a conhecer entre os povos as suas obras.
    status: ia-sem-revisao
  '105:2':
    texto: Cantai-lhe, tocai para ele, falai de todas as suas maravilhas.
    status: ia-sem-revisao
  '105:3':
    texto: Gloriai-vos no seu santo nome; alegre-se o coração dos que buscam o Senhor.
    status: ia-sem-revisao
  '105:4':
    texto: Procurai o Senhor e a sua força, buscai sempre a sua face.
    status: ia-sem-revisao
  '105:5':
    texto: Lembrai-vos das maravilhas que realizou, dos seus prodígios e dos juízos da sua boca,
    status: ia-sem-revisao
  '105:6':
    texto: descendência de Abraão, seu servo, filhos de Jacó, seus escolhidos.
    status: ia-sem-revisao
  '105:7':
    texto: Ele é o Senhor, nosso Deus; os seus juízos estão em toda a terra.
    status: ia-sem-revisao
  '105:8':
    texto: Lembra-se para sempre da sua aliança, da palavra que ordenou para mil gerações,
    status: ia-sem-revisao
  '105:9':
    texto: da aliança que fez com Abraão e do juramento que fez a Isaac.
    status: ia-sem-revisao
  '105:16':
    texto: Chamou a fome sobre a terra e quebrou todo o sustento de pão.
    status: ia-sem-revisao
  '105:17':
    texto: 'Enviou adiante deles um homem: José, vendido como escravo.'
    status: ia-sem-revisao
  '105:18':
    texto: Apertaram-lhe os pés com grilhões; o ferro lhe entrou na alma.
    status: ia-sem-revisao
  '105:19':
    texto: Até o tempo em que se cumpriu a sua palavra, a palavra do Senhor o provou.
    status: ia-sem-revisao
  '105:20':
    texto: O rei mandou soltá-lo, o governante dos povos o libertou.
    status: ia-sem-revisao
  '105:21':
    texto: Fê-lo senhor da sua casa e governador de todos os seus bens.
    status: ia-sem-revisao
  '105:24':
    texto: Fez o seu povo crescer muito e o tornou mais forte do que os seus adversários.
    status: ia-sem-revisao
  '105:25':
    texto: Mudou o coração deles para que odiassem o seu povo e usassem de astúcia contra os seus servos.
    status: ia-sem-revisao
  '105:26':
    texto: Enviou Moisés, seu servo, e Aarão, a quem escolheu.
    status: ia-sem-revisao
  '105:27':
    texto: Eles realizaram entre eles os seus sinais e prodígios na terra de Cam.
    status: ia-sem-revisao
  '105:36':
    texto: Feriu todos os primogênitos da sua terra, as primícias de todo o seu vigor.
    status: ia-sem-revisao
  '105:37':
    texto: Fê-los sair com prata e ouro, e não havia entre as suas tribos quem tropeçasse.
    status: ia-sem-revisao
  '105:42':
    texto: Pois se lembrou da sua santa palavra, dada a Abraão, seu servo.
    status: ia-sem-revisao
  '105:43':
    texto: Fez sair o seu povo com alegria, os seus escolhidos, com cantos de júbilo.
    status: ia-sem-revisao
  '106:1':
    texto: Dai graças ao Senhor, porque é bom, porque a sua misericórdia dura para sempre.
    titulo: Aleluia.
    status: ia-sem-revisao
  '106:2':
    texto: Quem poderá narrar os feitos poderosos do Senhor ou proclamar todo o seu louvor?
    status: ia-sem-revisao
  '106:3':
    texto: Felizes os que observam o direito e praticam a justiça em todo o tempo.
    status: ia-sem-revisao
  '106:4':
    texto: Lembra-te de mim, Senhor, com o favor que tens para com o teu povo; visita-me com a tua salvação,
    partes:
    - Lembra-te de mim, Senhor, com o favor que tens para com o teu povo;
    - visita-me com a tua salvação,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '106:5':
    texto: para que eu veja a prosperidade dos teus escolhidos, me alegre com a alegria da tua nação e
      me glorie com a tua herança.
    status: ia-sem-revisao
  '106:6':
    texto: Pecamos como os nossos pais, cometemos culpas, agimos com maldade.
    status: ia-sem-revisao
  '106:7':
    texto: Os nossos pais, no Egito, não compreenderam as tuas maravilhas, não se lembraram da multidão
      das tuas misericórdias e se rebelaram junto ao mar, no mar Vermelho.
    partes:
    - Os nossos pais, no Egito, não compreenderam as tuas maravilhas, não se lembraram da multidão das
      tuas misericórdias
    - e se rebelaram junto ao mar, no mar Vermelho.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '106:13':
    texto: Logo esqueceram as suas obras, não esperaram o seu conselho.
    status: ia-sem-revisao
  '106:14':
    texto: Cobiçaram ardentemente no deserto e puseram Deus à prova na solidão.
    status: ia-sem-revisao
  '106:19':
    texto: Fizeram um bezerro em Horeb e adoraram uma imagem de fundição.
    status: ia-sem-revisao
  '106:20':
    texto: Trocaram a sua glória pela figura de um touro que come erva.
    status: ia-sem-revisao
  '106:21':
    texto: Esqueceram Deus, o seu salvador, que fizera grandes coisas no Egito,
    status: ia-sem-revisao
  '106:22':
    texto: maravilhas na terra de Cam, coisas terríveis junto ao mar Vermelho.
    status: ia-sem-revisao
  '106:23':
    texto: Disse que os exterminaria, não fosse Moisés, o seu escolhido, ter-se posto na brecha diante
      dele, para desviar a sua ira de os destruir.
    status: ia-sem-revisao
  '106:34':
    texto: Não exterminaram os povos, como o Senhor lhes ordenara.
    status: ia-sem-revisao
  '106:35':
    texto: Misturaram-se com as nações e aprenderam as suas obras.
    status: ia-sem-revisao
  '106:36':
    texto: Serviram aos seus ídolos, que se tornaram para eles uma armadilha.
    status: ia-sem-revisao
  '106:37':
    texto: Sacrificaram os seus filhos e as suas filhas aos demônios.
    status: ia-sem-revisao
  '106:39':
    texto: Contaminaram-se com as suas obras e prostituíram-se com as suas ações.
    status: ia-sem-revisao
  '106:40':
    texto: Acendeu-se a ira do Senhor contra o seu povo, e ele abominou a sua herança.
    status: ia-sem-revisao
  '106:43':
    texto: Muitas vezes os livrou, mas eles se rebelaram nos seus planos e afundaram-se na sua culpa.
    status: ia-sem-revisao
  '106:44':
    texto: Ele, porém, viu a sua angústia quando ouviu o seu clamor.
    status: ia-sem-revisao
  '107:2':
    texto: Digam-no os redimidos do Senhor, os que ele resgatou da mão do inimigo,
    status: ia-sem-revisao
  '107:3':
    texto: os que reuniu das terras, do oriente e do ocidente, do norte e do sul.
    status: ia-sem-revisao
  '107:4':
    texto: Erraram pelo deserto, por ermos sem caminho; não acharam cidade onde habitar.
    status: ia-sem-revisao
  '107:5':
    texto: Famintos e sedentos, a sua alma desfalecia dentro deles.
    status: ia-sem-revisao
  '107:6':
    texto: Na sua angústia clamaram ao Senhor, e ele os livrou das suas aflições.
    status: ia-sem-revisao
  '107:7':
    texto: Conduziu-os por caminho reto, até chegarem a uma cidade onde habitar.
    status: ia-sem-revisao
  '107:8':
    texto: Deem graças ao Senhor pela sua misericórdia e pelas suas maravilhas em favor dos filhos dos
      homens.
    status: ia-sem-revisao
  '107:9':
    texto: Pois saciou a alma sedenta e encheu de bens a alma faminta.
    status: ia-sem-revisao
  '107:23':
    texto: Os que desciam ao mar em navios, fazendo negócios nas grandes águas,
    status: ia-sem-revisao
  '107:24':
    texto: viram as obras do Senhor e as suas maravilhas no abismo.
    status: ia-sem-revisao
  '107:25':
    texto: Ele falou e suscitou um vento de tempestade, que levantou as ondas.
    status: ia-sem-revisao
  '107:26':
    texto: Subiam ao céu, desciam aos abismos; a sua alma se consumia no perigo.
    status: ia-sem-revisao
  '107:28':
    texto: Na sua angústia clamaram ao Senhor, e ele os fez sair das suas aflições.
    status: ia-sem-revisao
  '107:29':
    texto: Reduziu a tempestade a uma brisa, e as ondas se calaram.
    status: ia-sem-revisao
  '107:30':
    texto: Alegraram-se porque se acalmaram, e ele os conduziu ao porto desejado.
    status: ia-sem-revisao
  '107:31':
    texto: Deem graças ao Senhor pela sua misericórdia e pelas suas maravilhas em favor dos filhos dos
      homens.
    status: ia-sem-revisao
  '109:21':
    texto: Tu, porém, Senhor Deus, age comigo por amor do teu nome; livra-me, porque é boa a tua misericórdia.
    status: ia-sem-revisao
  '109:22':
    texto: Pois sou pobre e indigente, e o meu coração está ferido dentro de mim.
    status: ia-sem-revisao
  '109:26':
    texto: Ajuda-me, Senhor, meu Deus; salva-me segundo a tua misericórdia.
    status: ia-sem-revisao
  '109:27':
    texto: Saibam que é a tua mão; que tu, Senhor, o fizeste.
    status: ia-sem-revisao
  '109:30':
    texto: Darei muitas graças ao Senhor com a minha boca e o louvarei no meio da multidão.
    status: ia-sem-revisao
  '109:31':
    texto: Pois ele está à direita do pobre, para salvá-lo dos que o condenam à morte.
    status: ia-sem-revisao
  '110:1':
    texto: 'Oráculo do Senhor ao meu senhor: “Senta-te à minha direita, até que eu ponha os teus inimigos
      por escabelo dos teus pés.”'
    titulo: De Davi. Salmo.
    status: ia-sem-revisao
  '110:2':
    texto: 'O Senhor estenderá de Sião o cetro do teu poder: “Domina no meio dos teus inimigos.'
    status: ia-sem-revisao
  '110:3':
    texto: O teu povo se oferece voluntariamente no dia do teu poder; em esplendor sagrado, desde o seio
      da aurora, tens o orvalho da tua juventude.”
    status: ia-sem-revisao
    observacao: Verso de leitura difícil no hebraico; a Vulgata e a Septuaginta divergem (“antes da aurora
      eu te gerei”).
  '110:4':
    texto: 'O Senhor jurou, e não se arrependerá: “Tu és sacerdote para sempre, segundo a ordem de Melquisedec.”'
    status: ia-sem-revisao
  '111:1':
    texto: Darei graças ao Senhor de todo o coração, no conselho dos retos e na assembleia.
    titulo: Aleluia.
    status: ia-sem-revisao
  '111:2':
    texto: Grandes são as obras do Senhor, procuradas por todos os que as apreciam.
    status: ia-sem-revisao
  '111:3':
    texto: Esplendor e majestade é a sua obra, e a sua justiça permanece para sempre.
    status: ia-sem-revisao
  '111:4':
    texto: Deixou memória das suas maravilhas; o Senhor é compassivo e misericordioso.
    status: ia-sem-revisao
  '111:5':
    texto: Deu alimento aos que o temem; lembra-se para sempre da sua aliança.
    status: ia-sem-revisao
  '111:6':
    texto: Mostrou ao seu povo o poder das suas obras, dando-lhes a herança das nações.
    status: ia-sem-revisao
  '111:7':
    texto: As obras das suas mãos são verdade e justiça; fiéis são todos os seus preceitos,
    status: ia-sem-revisao
  '111:8':
    texto: firmes para sempre, feitos com verdade e retidão.
    status: ia-sem-revisao
  '111:9':
    texto: Enviou a redenção ao seu povo; estabeleceu para sempre a sua aliança. Santo e temível é o seu
      nome.
    status: ia-sem-revisao
  '111:10':
    texto: O princípio da sabedoria é o temor do Senhor; têm bom senso todos os que o praticam; o seu
      louvor permanece para sempre.
    partes:
    - O princípio da sabedoria é o temor do Senhor;
    - têm bom senso todos os que o praticam;
    - o seu louvor permanece para sempre.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '112:1':
    texto: Feliz o homem que teme o Senhor e tem grande prazer nos seus mandamentos.
    titulo: Aleluia.
    status: ia-sem-revisao
  '112:2':
    texto: A sua descendência será poderosa na terra; a geração dos retos será abençoada.
    status: ia-sem-revisao
  '112:3':
    texto: Riqueza e bens há em sua casa, e a sua justiça permanece para sempre.
    status: ia-sem-revisao
  '112:4':
    texto: 'Brilha nas trevas como luz para os retos: é compassivo, misericordioso e justo.'
    status: ia-sem-revisao
  '112:5':
    texto: Feliz o homem que se compadece e empresta, e que conduz os seus negócios com justiça.
    status: ia-sem-revisao
  '112:6':
    texto: Pois jamais vacilará; o justo será lembrado para sempre.
    status: ia-sem-revisao
  '112:7':
    texto: Não temerá notícia má; o seu coração está firme, confiando no Senhor.
    partes:
    - Não temerá notícia má;
    - o seu coração está firme, confiando no Senhor.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '112:8':
    texto: O seu coração está seguro, não temerá, até que veja a derrota dos seus adversários.
    partes:
    - O seu coração está seguro, não temerá,
    - até que veja a derrota dos seus adversários.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '112:9':
    texto: Distribuiu, deu aos pobres; a sua justiça permanece para sempre; a sua fronte se levantará
      com honra.
    status: ia-sem-revisao
  '113:1':
    texto: Louvai, servos do Senhor, louvai o nome do Senhor.
    titulo: Aleluia.
    status: ia-sem-revisao
  '113:2':
    texto: Seja bendito o nome do Senhor, desde agora e para sempre.
    status: ia-sem-revisao
  '113:3':
    texto: Do nascer do sol ao seu ocaso, seja louvado o nome do Senhor.
    status: ia-sem-revisao
  '113:4':
    texto: O Senhor está acima de todas as nações; a sua glória está acima dos céus.
    status: ia-sem-revisao
  '113:5':
    texto: Quem é como o Senhor, nosso Deus, que se assenta nas alturas,
    partes:
    - Quem é como o Senhor, nosso Deus,
    - que se assenta nas alturas,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '113:6':
    texto: e se inclina para olhar os céus e a terra?
    status: ia-sem-revisao
  '113:7':
    texto: Do pó levanta o fraco, do lixo ergue o indigente,
    status: ia-sem-revisao
  '113:8':
    texto: para fazê-lo sentar-se com os príncipes, com os príncipes do seu povo.
    status: ia-sem-revisao
  '114:1':
    texto: Quando Israel saiu do Egito, a casa de Jacó, de um povo de língua estranha,
    status: ia-sem-revisao
  '114:2':
    texto: Judá tornou-se o seu santuário, Israel, o seu domínio.
    status: ia-sem-revisao
  '114:3':
    texto: O mar viu e fugiu, o Jordão voltou atrás.
    status: ia-sem-revisao
  '114:4':
    texto: Os montes saltaram como carneiros, as colinas como cordeiros.
    status: ia-sem-revisao
  '114:5':
    texto: Que tens, ó mar, que foges? E tu, Jordão, que voltas atrás?
    status: ia-sem-revisao
  '114:6':
    texto: Montes, por que saltais como carneiros? E vós, colinas, como cordeiros?
    status: ia-sem-revisao
  '115:1':
    texto: Não a nós, Senhor, não a nós, mas ao teu nome dá glória, por causa da tua misericórdia e da
      tua fidelidade.
    status: ia-sem-revisao
  '115:2':
    texto: 'Por que hão de dizer as nações: “Onde está o seu Deus?”'
    status: ia-sem-revisao
  '115:3':
    texto: 'O nosso Deus está no céu: tudo o que quer, ele o faz.'
    status: ia-sem-revisao
  '115:4':
    texto: Os ídolos deles são prata e ouro, obra de mãos humanas.
    status: ia-sem-revisao
  '115:5':
    texto: Têm boca, mas não falam; têm olhos, mas não veem;
    status: ia-sem-revisao
  '115:6':
    texto: têm ouvidos, mas não ouvem; têm nariz, mas não cheiram;
    status: ia-sem-revisao
  '115:7':
    texto: têm mãos, mas não tocam; têm pés, mas não andam; não emitem som da garganta.
    status: ia-sem-revisao
  '115:8':
    texto: Como eles serão os que os fazem, todos os que neles confiam.
    status: ia-sem-revisao
  '115:9':
    texto: 'Israel, confia no Senhor: ele é o seu auxílio e o seu escudo.'
    status: ia-sem-revisao
  '115:10':
    texto: 'Casa de Aarão, confia no Senhor: ele é o seu auxílio e o seu escudo.'
    status: ia-sem-revisao
  '115:15':
    texto: Sois benditos do Senhor, que fez o céu e a terra.
    status: ia-sem-revisao
  '115:16':
    texto: Os céus são os céus do Senhor, mas a terra, deu-a aos filhos dos homens.
    status: ia-sem-revisao
  '116:1':
    texto: Amo o Senhor, porque ouviu a minha voz e as minhas súplicas.
    status: ia-sem-revisao
  '116:2':
    texto: Porque inclinou para mim o seu ouvido, invocá-lo-ei enquanto viver.
    status: ia-sem-revisao
  '116:3':
    texto: Envolveram-me as cordas da morte, e as angústias do abismo me alcançaram; encontrei aflição
      e tristeza.
    status: ia-sem-revisao
  '116:4':
    texto: 'Então invoquei o nome do Senhor: “Ah, Senhor, salva a minha vida!”'
    status: ia-sem-revisao
  '116:5':
    texto: O Senhor é misericordioso e justo; o nosso Deus é compassivo.
    status: ia-sem-revisao
  '116:6':
    texto: O Senhor guarda os simples; fui humilhado, e ele me salvou.
    status: ia-sem-revisao
  '116:8':
    texto: Pois livraste a minha vida da morte, os meus olhos das lágrimas e os meus pés da queda.
    status: ia-sem-revisao
  '116:9':
    texto: Andarei na presença do Senhor na terra dos vivos.
    status: ia-sem-revisao
  '116:10':
    texto: 'Tive fé, mesmo quando disse: “Estou muito aflito.”'
    status: ia-sem-revisao
  '116:11':
    texto: 'Eu dizia na minha pressa: “Todo homem é mentiroso.”'
    status: ia-sem-revisao
  '116:12':
    texto: Que retribuirei ao Senhor por todo o bem que me fez?
    status: ia-sem-revisao
  '116:13':
    texto: Erguerei o cálice da salvação e invocarei o nome do Senhor.
    status: ia-sem-revisao
  '116:14':
    texto: Cumprirei os meus votos ao Senhor, na presença de todo o seu povo.
    status: ia-sem-revisao
  '116:15':
    texto: Preciosa é aos olhos do Senhor a morte dos seus fiéis.
    status: ia-sem-revisao
  '116:16':
    texto: Ah, Senhor, sou teu servo, teu servo, filho da tua serva; quebraste as minhas cadeias.
    status: ia-sem-revisao
  '116:17':
    texto: A ti oferecerei um sacrifício de ação de graças e invocarei o nome do Senhor.
    status: ia-sem-revisao
  '116:18':
    texto: Cumprirei os meus votos ao Senhor, na presença de todo o seu povo,
    status: ia-sem-revisao
  '116:19':
    texto: nos átrios da casa do Senhor, no meio de ti, Jerusalém. Aleluia.
    status: ia-sem-revisao
  '117:1':
    texto: Louvai o Senhor, nações todas; glorificai-o, povos todos.
    status: ia-sem-revisao
  '117:2':
    texto: Pois foi forte a sua misericórdia para conosco, e a fidelidade do Senhor dura para sempre.
      Aleluia.
    status: ia-sem-revisao
  '118:1':
    texto: Dai graças ao Senhor, porque é bom, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '118:2':
    texto: 'Diga Israel: a sua misericórdia dura para sempre.'
    status: ia-sem-revisao
  '118:3':
    texto: 'Diga a casa de Aarão: a sua misericórdia dura para sempre.'
    status: ia-sem-revisao
  '118:4':
    texto: 'Digam os que temem o Senhor: a sua misericórdia dura para sempre.'
    status: ia-sem-revisao
  '118:8':
    texto: É melhor refugiar-se no Senhor do que confiar no homem.
    status: ia-sem-revisao
  '118:9':
    texto: É melhor refugiar-se no Senhor do que confiar nos príncipes.
    status: ia-sem-revisao
  '118:13':
    texto: Empurraram-me com violência para que eu caísse, mas o Senhor me ajudou.
    status: ia-sem-revisao
  '118:14':
    texto: O Senhor é a minha força e o meu cântico; ele foi a minha salvação.
    status: ia-sem-revisao
  '118:15':
    texto: 'Há gritos de júbilo e de salvação nas tendas dos justos: a direita do Senhor faz proezas.'
    status: ia-sem-revisao
  '118:16':
    texto: A direita do Senhor se levantou, a direita do Senhor faz proezas.
    partes:
    - A direita do Senhor se levantou,
    - a direita do Senhor faz proezas.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '118:17':
    texto: Não morrerei, mas viverei e contarei as obras do Senhor.
    status: ia-sem-revisao
  '118:18':
    texto: O Senhor me castigou duramente, mas não me entregou à morte.
    status: ia-sem-revisao
  '118:19':
    texto: Abri-me as portas da justiça; entrarei por elas e darei graças ao Senhor.
    status: ia-sem-revisao
  '118:20':
    texto: 'Esta é a porta do Senhor: por ela entrarão os justos.'
    status: ia-sem-revisao
  '118:21':
    texto: Dou-te graças porque me ouviste e foste a minha salvação.
    status: ia-sem-revisao
  '118:22':
    texto: A pedra que os construtores rejeitaram tornou-se a pedra angular.
    status: ia-sem-revisao
  '118:23':
    texto: Isto veio do Senhor, e é admirável aos nossos olhos.
    status: ia-sem-revisao
  '118:24':
    texto: 'Este é o dia que o Senhor fez: exultemos e alegremo-nos nele.'
    status: ia-sem-revisao
  '118:25':
    texto: Ah, Senhor, salva-nos! Ah, Senhor, dá-nos prosperidade!
    status: ia-sem-revisao
  '118:26':
    texto: Bendito o que vem em nome do Senhor! Da casa do Senhor vos abençoamos.
    status: ia-sem-revisao
  '118:27':
    texto: O Senhor é Deus e nos iluminou. Ordenai a procissão com ramos até os chifres do altar.
    partes:
    - O Senhor é Deus e nos iluminou.
    - Ordenai a procissão com ramos até os chifres do altar.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '118:28':
    texto: Tu és o meu Deus, e te darei graças; meu Deus, eu te exaltarei.
    status: ia-sem-revisao
  '118:29':
    texto: Dai graças ao Senhor, porque é bom, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '119:1':
    texto: Felizes os que têm um caminho íntegro, os que andam na lei do Senhor.
    status: ia-sem-revisao
  '119:2':
    texto: Felizes os que guardam os seus testemunhos e o procuram de todo o coração.
    status: ia-sem-revisao
  '119:4':
    texto: Tu ordenaste que os teus preceitos sejam guardados com todo o cuidado.
    status: ia-sem-revisao
  '119:5':
    texto: Oxalá os meus caminhos se firmem em guardar os teus estatutos!
    status: ia-sem-revisao
  '119:7':
    texto: Dar-te-ei graças com retidão de coração, quando aprender os teus justos juízos.
    status: ia-sem-revisao
  '119:8':
    texto: Guardarei os teus estatutos; não me abandones totalmente.
    status: ia-sem-revisao
  '119:9':
    texto: Como um jovem purificará o seu caminho? Guardando a tua palavra.
    status: ia-sem-revisao
  '119:10':
    texto: De todo o meu coração te procurei; não me deixes desviar dos teus mandamentos.
    status: ia-sem-revisao
  '119:11':
    texto: Guardei no meu coração a tua palavra, para não pecar contra ti.
    status: ia-sem-revisao
  '119:12':
    texto: Bendito és tu, Senhor; ensina-me os teus estatutos.
    status: ia-sem-revisao
  '119:13':
    texto: Com os meus lábios proclamei todos os juízos da tua boca.
    status: ia-sem-revisao
  '119:14':
    texto: No caminho dos teus testemunhos me alegrei, como em todas as riquezas.
    status: ia-sem-revisao
  '119:16':
    texto: Nos teus estatutos me deleitarei; não esquecerei a tua palavra.
    status: ia-sem-revisao
  '119:17':
    texto: Faze bem ao teu servo, para que eu viva e guarde a tua palavra.
    status: ia-sem-revisao
  '119:18':
    texto: Abre os meus olhos, para que eu contemple as maravilhas da tua lei.
    status: ia-sem-revisao
  '119:20':
    texto: A minha alma se consome desejando os teus juízos em todo o tempo.
    status: ia-sem-revisao
  '119:23':
    texto: Mesmo que os príncipes se assentem e falem contra mim, o teu servo medita nos teus estatutos.
    status: ia-sem-revisao
  '119:24':
    texto: Os teus testemunhos são também o meu prazer, os meus conselheiros.
    status: ia-sem-revisao
  '119:26':
    texto: Contei-te os meus caminhos, e me respondeste; ensina-me os teus estatutos.
    status: ia-sem-revisao
  '119:27':
    texto: Faze-me entender o caminho dos teus preceitos, e meditarei nas tuas maravilhas.
    status: ia-sem-revisao
  '119:29':
    texto: Afasta de mim o caminho da mentira e concede-me a graça da tua lei.
    status: ia-sem-revisao
  '119:30':
    texto: Escolhi o caminho da fidelidade; coloquei diante de mim os teus juízos.
    status: ia-sem-revisao
  '119:33':
    texto: Ensina-me, Senhor, o caminho dos teus estatutos, e eu o seguirei até o fim.
    status: ia-sem-revisao
  '119:34':
    texto: Dá-me entendimento, e guardarei a tua lei e a cumprirei de todo o coração.
    status: ia-sem-revisao
  '119:35':
    texto: Conduze-me pela vereda dos teus mandamentos, pois nela me comprazo.
    status: ia-sem-revisao
  '119:36':
    texto: Inclina o meu coração para os teus testemunhos, e não para o lucro.
    status: ia-sem-revisao
  '119:37':
    texto: Desvia os meus olhos de contemplar a vaidade; faze-me viver no teu caminho.
    status: ia-sem-revisao
  '119:40':
    texto: Eis que anseio pelos teus preceitos; pela tua justiça, faze-me viver.
    status: ia-sem-revisao
  '119:41':
    texto: Venham a mim, Senhor, as tuas misericórdias, a tua salvação, segundo a tua palavra.
    status: ia-sem-revisao
  '119:43':
    texto: Não tires da minha boca a palavra da verdade, pois espero nos teus juízos.
    status: ia-sem-revisao
  '119:44':
    texto: Guardarei a tua lei sempre, para sempre e eternamente.
    status: ia-sem-revisao
  '119:45':
    texto: Andarei em liberdade, pois procurei os teus preceitos.
    status: ia-sem-revisao
  '119:47':
    texto: Deleitar-me-ei nos teus mandamentos, que amo.
    status: ia-sem-revisao
  '119:48':
    texto: Erguerei as minhas mãos para os teus mandamentos, que amo, e meditarei nos teus estatutos.
    status: ia-sem-revisao
  '119:53':
    texto: Um furor me tomou por causa dos ímpios que abandonam a tua lei.
    status: ia-sem-revisao
  '119:57':
    texto: O Senhor é a minha herança; eu disse que guardaria as tuas palavras.
    status: ia-sem-revisao
  119:61:
    texto: Os laços dos ímpios me envolveram, mas não esqueci a tua lei.
    status: ia-sem-revisao
  119:66:
    texto: Ensina-me bom senso e conhecimento, pois creio nos teus mandamentos.
    status: ia-sem-revisao
  119:67:
    texto: Antes de ser humilhado, eu andava errado; agora guardo a tua palavra.
    status: ia-sem-revisao
  119:68:
    texto: Tu és bom e fazes o bem; ensina-me os teus estatutos.
    status: ia-sem-revisao
  119:71:
    texto: Foi bom para mim ter sido humilhado, para aprender os teus estatutos.
    status: ia-sem-revisao
  119:72:
    texto: Vale mais para mim a lei da tua boca do que milhares de moedas de ouro e prata.
    status: ia-sem-revisao
  119:75:
    texto: Sei, Senhor, que os teus juízos são justos e que, com fidelidade, me humilhaste.
    status: ia-sem-revisao
  119:76:
    texto: Venha a tua misericórdia consolar-me, segundo a promessa que fizeste ao teu servo.
    status: ia-sem-revisao
  119:77:
    texto: Venham a mim as tuas compaixões, e viverei, pois a tua lei é o meu prazer.
    status: ia-sem-revisao
  119:79:
    texto: Voltem-se para mim os que te temem e conhecem os teus testemunhos.
    status: ia-sem-revisao
  119:80:
    texto: Seja o meu coração íntegro nos teus estatutos, para que eu não seja envergonhado.
    status: ia-sem-revisao
  119:89:
    texto: Para sempre, Senhor, a tua palavra permanece firme nos céus.
    status: ia-sem-revisao
  119:90:
    texto: A tua fidelidade vale de geração em geração; firmaste a terra, e ela permanece.
    status: ia-sem-revisao
  119:91:
    texto: Por tuas ordens tudo subsiste até hoje, pois todas as coisas te servem.
    status: ia-sem-revisao
  119:93:
    texto: Jamais esquecerei os teus preceitos, pois por eles me deste a vida.
    status: ia-sem-revisao
  119:94:
    texto: 'Sou teu: salva-me, pois procurei os teus preceitos.'
    status: ia-sem-revisao
  119:95:
    texto: Os ímpios me espreitam para me destruir; eu medito nos teus testemunhos.
    status: ia-sem-revisao
  119:97:
    texto: Como amo a tua lei! Ela é a minha meditação o dia inteiro.
    status: ia-sem-revisao
  119:98:
    texto: Pelos teus mandamentos me tornas mais sábio do que os meus inimigos, pois eles estão sempre
      comigo.
    status: ia-sem-revisao
  119:99:
    texto: Tenho mais entendimento do que todos os meus mestres, pois medito nos teus testemunhos.
    status: ia-sem-revisao
  119:100:
    texto: Tenho mais discernimento do que os anciãos, pois guardo os teus preceitos.
    status: ia-sem-revisao
  119:101:
    texto: Retive os meus pés de todo mau caminho, para guardar a tua palavra.
    status: ia-sem-revisao
  119:102:
    texto: Não me afastei dos teus juízos, pois tu mesmo me ensinaste.
    status: ia-sem-revisao
  119:103:
    texto: Como são doces ao meu paladar as tuas palavras, mais do que o mel à minha boca!
    status: ia-sem-revisao
  119:104:
    texto: Dos teus preceitos recebo entendimento; por isso odeio todo caminho de mentira.
    status: ia-sem-revisao
  119:111:
    texto: Os teus testemunhos são a minha herança para sempre, pois são a alegria do meu coração.
    status: ia-sem-revisao
  119:125:
    texto: Sou teu servo; dá-me entendimento, para que eu conheça os teus testemunhos.
    status: ia-sem-revisao
  119:127:
    texto: Por isso amo os teus mandamentos mais do que o ouro, mais do que o ouro fino.
    status: ia-sem-revisao
  119:128:
    texto: Por isso considero retos todos os teus preceitos e odeio todo caminho de mentira.
    status: ia-sem-revisao
  119:129:
    texto: Admiráveis são os teus testemunhos; por isso a minha alma os guarda.
    status: ia-sem-revisao
  119:130:
    texto: A explicação das tuas palavras ilumina e dá entendimento aos simples.
    status: ia-sem-revisao
  119:131:
    texto: Abro a boca e suspiro, pois anseio pelos teus mandamentos.
    status: ia-sem-revisao
  119:132:
    texto: Volta-te para mim e tem piedade de mim, como convém aos que amam o teu nome.
    status: ia-sem-revisao
  119:133:
    texto: Firma os meus passos na tua palavra, e que nenhuma maldade me domine.
    status: ia-sem-revisao
  119:134:
    texto: Livra-me da opressão dos homens, e guardarei os teus preceitos.
    status: ia-sem-revisao
  119:135:
    texto: Faze brilhar o teu rosto sobre o teu servo e ensina-me os teus estatutos.
    status: ia-sem-revisao
  119:150:
    texto: Aproximam-se os que perseguem a maldade; estão longe da tua lei.
    status: ia-sem-revisao
  119:155:
    texto: Longe dos ímpios está a salvação, pois não procuram os teus estatutos.
    status: ia-sem-revisao
  119:157:
    texto: Muitos são os que me perseguem e me oprimem, mas não me desvio dos teus testemunhos.
    status: ia-sem-revisao
  119:158:
    texto: Vi os traidores e senti repugnância, pois não guardam a tua palavra.
    status: ia-sem-revisao
  119:160:
    texto: A essência da tua palavra é a verdade, e cada um dos teus justos juízos dura para sempre.
    status: ia-sem-revisao
  119:161:
    texto: Príncipes me perseguem sem motivo, mas o meu coração teme as tuas palavras.
    status: ia-sem-revisao
  119:163:
    texto: Odeio a mentira e a abomino; amo a tua lei.
    status: ia-sem-revisao
  119:165:
    texto: Grande paz têm os que amam a tua lei, e para eles não há tropeço.
    status: ia-sem-revisao
  119:166:
    texto: Espero a tua salvação, Senhor, e cumpro os teus mandamentos.
    status: ia-sem-revisao
  119:168:
    texto: Guardo os teus preceitos e os teus testemunhos, pois todos os meus caminhos estão diante de
      ti.
    status: ia-sem-revisao
  119:171:
    texto: Os meus lábios derramarão louvor, pois me ensinas os teus estatutos.
    status: ia-sem-revisao
  119:172:
    texto: A minha língua cantará a tua palavra, pois todos os teus mandamentos são justos.
    status: ia-sem-revisao
  119:174:
    texto: Anseio pela tua salvação, Senhor, e a tua lei é o meu prazer.
    status: ia-sem-revisao
  119:175:
    texto: Viva a minha alma e te louve, e os teus juízos me ajudem.
    status: ia-sem-revisao
  '121:1':
    texto: 'Levanto os meus olhos para os montes: de onde virá o meu socorro?'
    titulo: Cântico das subidas.
    status: ia-sem-revisao
  '121:2':
    texto: O meu socorro vem do Senhor, que fez o céu e a terra.
    status: ia-sem-revisao
  '121:3':
    texto: Ele não deixará vacilar o teu pé; não dormirá aquele que te guarda.
    status: ia-sem-revisao
  '121:4':
    texto: Eis que não dormirá nem adormecerá o guarda de Israel.
    status: ia-sem-revisao
  '121:5':
    texto: O Senhor é o teu guarda, o Senhor é a tua sombra à tua direita.
    status: ia-sem-revisao
  '121:6':
    texto: De dia o sol não te ferirá, nem a lua, de noite.
    status: ia-sem-revisao
  '121:7':
    texto: O Senhor te guardará de todo mal; guardará a tua vida.
    status: ia-sem-revisao
  '121:8':
    texto: O Senhor guardará a tua saída e a tua entrada, desde agora e para sempre.
    status: ia-sem-revisao
  '122:1':
    texto: 'Alegrei-me quando me disseram: “À casa do Senhor iremos!”'
    titulo: Cântico das subidas. De Davi.
    status: ia-sem-revisao
  '122:2':
    texto: Já se detêm os nossos pés às tuas portas, Jerusalém.
    status: ia-sem-revisao
  '122:3':
    texto: Jerusalém, construída como uma cidade bem unida em si mesma.
    status: ia-sem-revisao
  '122:4':
    texto: Para lá sobem as tribos, as tribos do Senhor, como testemunho para Israel, para dar graças
      ao nome do Senhor.
    partes:
    - Para lá sobem as tribos, as tribos do Senhor,
    - como testemunho para Israel, para dar graças ao nome do Senhor.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir. O hebraico
      traz Yah (forma abreviada do nome divino), traduzido “Senhor”.'
  '122:5':
    texto: Pois ali estão postos os tronos do julgamento, os tronos da casa de Davi.
    status: ia-sem-revisao
  '122:6':
    texto: 'Pedi a paz para Jerusalém: vivam tranquilos os que te amam.'
    status: ia-sem-revisao
  '122:7':
    texto: Haja paz dentro das tuas muralhas, e tranquilidade nos teus palácios.
    status: ia-sem-revisao
  '122:8':
    texto: 'Por causa dos meus irmãos e amigos, direi: “Haja paz em ti.”'
    status: ia-sem-revisao
  '122:9':
    texto: Por causa da casa do Senhor, nosso Deus, procurarei o teu bem.
    status: ia-sem-revisao
  '123:1':
    texto: A ti levanto os meus olhos, a ti que habitas nos céus.
    titulo: Cântico das subidas.
    status: ia-sem-revisao
  '123:2':
    texto: Eis que, como os olhos dos servos fitam a mão do seu senhor, como os olhos da serva a mão da
      sua senhora, assim os nossos olhos fitam o Senhor, nosso Deus, até que tenha piedade de nós.
    partes:
    - Eis que, como os olhos dos servos fitam a mão do seu senhor,
    - como os olhos da serva a mão da sua senhora,
    - assim os nossos olhos fitam o Senhor, nosso Deus,
    - até que tenha piedade de nós.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '123:3':
    texto: Tem piedade de nós, Senhor, tem piedade de nós, pois estamos fartos de desprezo.
    status: ia-sem-revisao
  '123:4':
    texto: Estamos fartos do escárnio dos soberbos e do desprezo dos orgulhosos.
    status: ia-sem-revisao
  '124:1':
    texto: Se o Senhor não estivesse do nosso lado — que o diga Israel —,
    titulo: Cântico das subidas. De Davi.
    status: ia-sem-revisao
  '124:2':
    texto: se o Senhor não estivesse do nosso lado quando os homens se levantaram contra nós,
    status: ia-sem-revisao
  '124:3':
    texto: eles nos teriam engolido vivos, quando a sua ira se acendeu contra nós.
    status: ia-sem-revisao
  '124:4':
    texto: Então as águas nos teriam arrastado, uma torrente teria passado sobre nós.
    status: ia-sem-revisao
  '124:5':
    texto: Então teriam passado sobre nós as águas impetuosas.
    status: ia-sem-revisao
  '124:6':
    texto: Bendito seja o Senhor, que não nos entregou como presa aos seus dentes.
    status: ia-sem-revisao
  '124:7':
    texto: A nossa alma escapou como um pássaro do laço dos caçadores; o laço se rompeu, e nós escapamos.
    partes:
    - A nossa alma escapou como um pássaro
    - do laço dos caçadores;
    - o laço se rompeu,
    - e nós escapamos.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '124:8':
    texto: O nosso socorro está no nome do Senhor, que fez o céu e a terra.
    status: ia-sem-revisao
  '126:1':
    texto: Quando o Senhor trouxe de volta os cativos de Sião, estávamos como quem sonha.
    titulo: Cântico das subidas.
    status: ia-sem-revisao
  '126:2':
    texto: 'Então a nossa boca se encheu de riso, e a nossa língua, de júbilo. Então se dizia entre as
      nações: “O Senhor fez grandes coisas por eles.”'
    partes:
    - Então a nossa boca se encheu de riso,
    - e a nossa língua, de júbilo.
    - 'Então se dizia entre as nações:'
    - “O Senhor fez grandes coisas por eles.”
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '126:3':
    texto: O Senhor fez grandes coisas por nós, e estamos alegres.
    status: ia-sem-revisao
  '126:4':
    texto: Faze voltar, Senhor, os nossos cativos, como as torrentes no Negueb.
    status: ia-sem-revisao
  '126:5':
    texto: Os que semeiam entre lágrimas colherão com júbilo.
    status: ia-sem-revisao
  '126:6':
    texto: Vai chorando, levando a semente; voltará com júbilo, trazendo os seus feixes.
    status: ia-sem-revisao
  '128:1':
    texto: Feliz todo aquele que teme o Senhor e anda nos seus caminhos.
    titulo: Cântico das subidas.
    status: ia-sem-revisao
  '128:2':
    texto: Comerás do trabalho das tuas mãos; serás feliz, e tudo te irá bem.
    status: ia-sem-revisao
  '128:3':
    texto: A tua esposa será como videira fecunda no interior da tua casa; os teus filhos, como rebentos
      de oliveira ao redor da tua mesa.
    status: ia-sem-revisao
  '128:4':
    texto: Eis como será abençoado o homem que teme o Senhor.
    status: ia-sem-revisao
  '128:5':
    texto: O Senhor te abençoe desde Sião, e vejas a prosperidade de Jerusalém todos os dias da tua vida.
    status: ia-sem-revisao
  '128:6':
    texto: E vejas os filhos dos teus filhos. Paz sobre Israel!
    status: ia-sem-revisao
  '130:1':
    texto: Das profundezas clamo a ti, Senhor.
    titulo: Cântico das subidas.
    status: ia-sem-revisao
  '130:2':
    texto: Senhor, escuta a minha voz; estejam atentos os teus ouvidos à voz das minhas súplicas.
    status: ia-sem-revisao
  '130:3':
    texto: Se levares em conta as culpas, Senhor, quem poderá subsistir?
    status: ia-sem-revisao
  '130:4':
    texto: Mas em ti está o perdão, para que sejas temido.
    status: ia-sem-revisao
  '130:5':
    texto: Espero no Senhor, a minha alma espera, e aguardo a sua palavra.
    status: ia-sem-revisao
  '130:6':
    texto: A minha alma espera o Senhor mais do que os guardas esperam a aurora, mais do que os guardas
      esperam a aurora.
    status: ia-sem-revisao
  '130:7':
    texto: Espere Israel no Senhor, pois no Senhor está a misericórdia, e com ele há abundante redenção.
    status: ia-sem-revisao
  '130:8':
    texto: Ele mesmo redimirá Israel de todas as suas culpas.
    status: ia-sem-revisao
  '131:1':
    texto: Senhor, o meu coração não é soberbo, nem os meus olhos são altivos; não ando atrás de grandezas
      nem de coisas maravilhosas demais para mim.
    titulo: Cântico das subidas. De Davi.
    partes:
    - Cântico das subidas. De Davi.
    - Senhor, o meu coração não é soberbo,
    - nem os meus olhos são altivos;
    - não ando atrás de grandezas
    - nem de coisas maravilhosas demais para mim.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '131:2':
    texto: Pelo contrário, acalmei e sosseguei a minha alma, como criança desmamada no colo da mãe; como
      criança desmamada está em mim a minha alma.
    status: ia-sem-revisao
  '131:3':
    texto: Espere Israel no Senhor, desde agora e para sempre.
    status: ia-sem-revisao
  '132:1':
    texto: Lembra-te, Senhor, de Davi e de todas as suas fadigas,
    titulo: Cântico das subidas.
    status: ia-sem-revisao
  '132:2':
    texto: 'de como jurou ao Senhor e fez voto ao Poderoso de Jacó:'
    status: ia-sem-revisao
  '132:3':
    texto: “Não entrarei na tenda da minha casa, nem subirei ao leito em que repouso,
    status: ia-sem-revisao
  '132:4':
    texto: não darei sono aos meus olhos, nem repouso às minhas pálpebras,
    status: ia-sem-revisao
  '132:5':
    texto: até encontrar um lugar para o Senhor, uma morada para o Poderoso de Jacó.”
    status: ia-sem-revisao
  '132:6':
    texto: Eis que ouvimos falar dela em Éfrata, e a encontramos nos campos de Jaar.
    status: ia-sem-revisao
  '132:7':
    texto: Entremos na sua morada, prostremo-nos diante do seu estrado.
    status: ia-sem-revisao
  '132:8':
    texto: Levanta-te, Senhor, para o teu repouso, tu e a arca do teu poder.
    status: ia-sem-revisao
  '132:9':
    texto: Revistam-se de justiça os teus sacerdotes, e os teus fiéis exultem de alegria.
    status: ia-sem-revisao
  '132:10':
    texto: Por amor de Davi, teu servo, não rejeites o rosto do teu ungido.
    status: ia-sem-revisao
  '132:11':
    texto: 'O Senhor jurou a Davi uma verdade, da qual não voltará atrás: “Um fruto do teu ventre porei
      sobre o teu trono.'
    status: ia-sem-revisao
  '132:12':
    texto: Se os teus filhos guardarem a minha aliança e os meus testemunhos que eu lhes ensinar, também
      os filhos deles se assentarão para sempre no teu trono.”
    status: ia-sem-revisao
  '132:13':
    texto: 'Pois o Senhor escolheu Sião, desejou-a para sua morada:'
    status: ia-sem-revisao
  '132:14':
    texto: “Este é o meu repouso para sempre; aqui habitarei, porque o desejei.
    status: ia-sem-revisao
  '132:17':
    texto: Ali farei brotar um poder para Davi; preparei uma lâmpada para o meu ungido.
    status: ia-sem-revisao
  '132:18':
    texto: Cobrirei de vergonha os seus inimigos, mas sobre ele florescerá a sua coroa.”
    status: ia-sem-revisao
  '135:1':
    texto: Louvai o nome do Senhor, louvai-o, servos do Senhor,
    titulo: Aleluia.
    status: ia-sem-revisao
  '135:2':
    texto: vós que estais na casa do Senhor, nos átrios da casa do nosso Deus.
    status: ia-sem-revisao
  '135:3':
    texto: Louvai o Senhor, porque o Senhor é bom; cantai ao seu nome, porque é agradável.
    status: ia-sem-revisao
  '135:4':
    texto: Pois o Senhor escolheu para si Jacó, Israel, para sua propriedade.
    status: ia-sem-revisao
  '135:5':
    texto: Eu bem sei que o Senhor é grande, que o nosso Senhor está acima de todos os deuses.
    status: ia-sem-revisao
  '135:6':
    texto: Tudo o que o Senhor quis, ele o fez no céu e na terra, nos mares e em todos os abismos.
    status: ia-sem-revisao
  '136:1':
    texto: Dai graças ao Senhor, porque é bom, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:2':
    texto: Dai graças ao Deus dos deuses, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:3':
    texto: Dai graças ao Senhor dos senhores, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:10':
    texto: Àquele que feriu o Egito nos seus primogênitos, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:11':
    texto: E tirou Israel do meio deles, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:12':
    texto: Com mão forte e braço estendido, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:13':
    texto: Àquele que dividiu o mar Vermelho em duas partes, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:14':
    texto: E fez Israel passar pelo meio dele, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:15':
    texto: E lançou Faraó e o seu exército no mar Vermelho, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:16':
    texto: Àquele que conduziu o seu povo pelo deserto, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:17':
    texto: Àquele que feriu grandes reis, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:18':
    texto: E matou reis poderosos, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:21':
    texto: E deu a terra deles em herança, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:22':
    texto: Em herança a Israel, seu servo, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:23':
    texto: Àquele que se lembrou de nós na nossa humilhação, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '136:24':
    texto: E nos libertou dos nossos adversários, porque a sua misericórdia dura para sempre.
    status: ia-sem-revisao
  '137:1':
    texto: Junto aos rios da Babilônia, ali nos sentamos e choramos, lembrando-nos de Sião.
    status: ia-sem-revisao
  '137:2':
    texto: Nos salgueiros que havia ali, penduramos as nossas harpas.
    status: ia-sem-revisao
  '137:3':
    texto: 'Pois ali os que nos levaram cativos pediam-nos canções, e os que nos atormentavam, alegria:
      “Cantai-nos um dos cânticos de Sião!”'
    status: ia-sem-revisao
  '137:4':
    texto: Como poderíamos cantar o cântico do Senhor em terra estrangeira?
    status: ia-sem-revisao
  '137:5':
    texto: Se eu me esquecer de ti, Jerusalém, esqueça-se de mim a minha direita.
    status: ia-sem-revisao
  '137:6':
    texto: Que a minha língua se cole ao meu paladar, se de ti não me lembrar, se não puser Jerusalém
      acima da minha maior alegria.
    status: ia-sem-revisao
  '138:1':
    texto: Dar-te-ei graças de todo o coração; diante dos deuses te cantarei.
    titulo: De Davi.
    status: ia-sem-revisao
  '138:2':
    texto: Prostro-me diante do teu santo templo e dou graças ao teu nome por causa da tua misericórdia
      e da tua fidelidade, pois engrandeceste a tua palavra acima de todo o teu nome.
    partes:
    - Prostro-me diante do teu santo templo
    - e dou graças ao teu nome por causa da tua misericórdia e da tua fidelidade,
    - pois engrandeceste a tua palavra acima de todo o teu nome.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '138:3':
    texto: No dia em que te invoquei, tu me respondeste; deste-me ousadia, fortaleceste a minha alma.
    status: ia-sem-revisao
  '138:4':
    texto: Todos os reis da terra te darão graças, Senhor, porque ouviram as palavras da tua boca.
    status: ia-sem-revisao
  '138:5':
    texto: Cantarão os caminhos do Senhor, porque grande é a glória do Senhor.
    status: ia-sem-revisao
  '138:6':
    texto: Pois o Senhor é excelso e olha para os humildes, mas os soberbos ele os conhece de longe.
    status: ia-sem-revisao
  '138:7':
    texto: Ainda que eu ande em meio à angústia, tu me conservas a vida; estendes a mão contra a ira dos
      meus inimigos, e a tua direita me salva.
    partes:
    - Ainda que eu ande em meio à angústia, tu me conservas a vida;
    - estendes a mão contra a ira dos meus inimigos,
    - e a tua direita me salva.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '138:8':
    texto: O Senhor levará a termo o que me diz respeito. Senhor, a tua misericórdia dura para sempre;
      não abandones a obra das tuas mãos.
    status: ia-sem-revisao
  '139:1':
    texto: Senhor, tu me sondas e me conheces.
    titulo: Ao mestre de canto. De Davi. Salmo.
    status: ia-sem-revisao
  '139:2':
    texto: Tu conheces o meu sentar e o meu levantar; de longe penetras os meus pensamentos.
    status: ia-sem-revisao
  '139:3':
    texto: Examinas o meu andar e o meu repouso, e conheces todos os meus caminhos.
    partes:
    - Examinas o meu andar e o meu repouso,
    - e conheces todos os meus caminhos.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '139:4':
    texto: Ainda a palavra não chegou à minha língua, e já, Senhor, tu a conheces inteiramente.
    status: ia-sem-revisao
  '139:5':
    texto: Por trás e pela frente me envolves, e pões sobre mim a tua mão.
    status: ia-sem-revisao
  '139:6':
    texto: Maravilhosa demais para mim é essa ciência; é alta demais, não posso alcançá-la.
    status: ia-sem-revisao
  '139:7':
    texto: Para onde irei longe do teu espírito? Para onde fugirei da tua presença?
    status: ia-sem-revisao
  '139:8':
    texto: Se subir aos céus, ali estás; se fizer a minha cama no abismo, ali te encontro.
    status: ia-sem-revisao
  '139:9':
    texto: Se tomar as asas da aurora e habitar nos confins do mar,
    status: ia-sem-revisao
  '139:10':
    texto: também ali a tua mão me conduzirá, e a tua direita me sustentará.
    status: ia-sem-revisao
  '139:11':
    texto: 'Se eu disser: “Que as trevas me cubram, e a luz ao meu redor se faça noite”,'
    status: ia-sem-revisao
  '139:12':
    texto: nem as trevas são escuras para ti; a noite brilha como o dia, as trevas como a luz.
    partes:
    - nem as trevas são escuras para ti;
    - a noite brilha como o dia, as trevas como a luz.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '139:13':
    texto: Pois tu formaste os meus rins, tu me teceste no seio da minha mãe.
    status: ia-sem-revisao
  '139:14':
    texto: Dou-te graças porque fui feito de modo admirável; maravilhosas são as tuas obras, e a minha
      alma o reconhece bem.
    partes:
    - Dou-te graças porque fui feito de modo admirável;
    - maravilhosas são as tuas obras, e a minha alma o reconhece bem.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '139:15':
    texto: Não te foi oculto o meu ser quando fui formado em segredo, quando fui tecido nas profundezas
      da terra.
    status: ia-sem-revisao
  '139:23':
    texto: Sonda-me, ó Deus, e conhece o meu coração; examina-me e conhece os meus pensamentos.
    status: ia-sem-revisao
  '139:24':
    texto: Vê se há em mim algum caminho de dor e conduze-me pelo caminho eterno.
    status: ia-sem-revisao
  '141:1':
    texto: Senhor, a ti clamo; vem depressa a mim; escuta a minha voz quando te invoco.
    titulo: Salmo de Davi.
    status: ia-sem-revisao
  '141:2':
    texto: Suba a minha oração como incenso diante de ti, e o levantar das minhas mãos, como a oferta
      da tarde.
    status: ia-sem-revisao
  '141:3':
    texto: Põe, Senhor, uma guarda à minha boca; vigia a porta dos meus lábios.
    status: ia-sem-revisao
  '141:8':
    texto: 'Pois os meus olhos estão voltados para ti, Senhor Deus; em ti me refugio: não abandones a
      minha vida.'
    status: ia-sem-revisao
  '144:1':
    texto: Bendito seja o Senhor, minha rocha, que adestra as minhas mãos para o combate e os meus dedos
      para a guerra.
    titulo: De Davi.
    partes:
    - De Davi.
    - Bendito seja o Senhor, minha rocha, que adestra as minhas mãos para o combate e os meus dedos para
      a guerra.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '144:2':
    texto: Ele é a minha misericórdia e a minha fortaleza, o meu baluarte e o meu libertador, o meu escudo,
      em quem me refugio, aquele que submete a mim o meu povo.
    partes:
    - Ele é a minha misericórdia e a minha fortaleza,
    - o meu baluarte e o meu libertador,
    - o meu escudo, em quem me refugio,
    - aquele que submete a mim o meu povo.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '144:3':
    texto: Senhor, que é o homem, para que o conheças? O filho do homem, para que penses nele?
    status: ia-sem-revisao
  '144:4':
    texto: O homem é semelhante a um sopro; os seus dias são como a sombra que passa.
    status: ia-sem-revisao
  '144:9':
    texto: Ó Deus, cantar-te-ei um canto novo; tocar-te-ei com a harpa de dez cordas,
    status: ia-sem-revisao
  '144:10':
    texto: a ti que dás a vitória aos reis, que livras Davi, teu servo, da espada maligna.
    status: ia-sem-revisao
  '145:1':
    texto: Exalto-te, meu Deus e rei, e bendigo o teu nome para sempre e eternamente.
    titulo: Louvor. De Davi.
    status: ia-sem-revisao
  '145:2':
    texto: Todos os dias te bendirei e louvarei o teu nome para sempre e eternamente.
    status: ia-sem-revisao
  '145:3':
    texto: Grande é o Senhor e digno de todo louvor; a sua grandeza é insondável.
    status: ia-sem-revisao
  '145:4':
    texto: Uma geração louvará à outra as tuas obras e proclamará os teus feitos poderosos.
    status: ia-sem-revisao
  '145:5':
    texto: Falarei do esplendor glorioso da tua majestade e das tuas maravilhas.
    status: ia-sem-revisao
  '145:6':
    texto: Dirão o poder dos teus feitos terríveis, e contarei a tua grandeza.
    status: ia-sem-revisao
  '145:7':
    texto: Celebrarão a memória da tua grande bondade e aclamarão a tua justiça.
    status: ia-sem-revisao
  '145:8':
    texto: O Senhor é compassivo e misericordioso, lento para a ira e rico em bondade.
    status: ia-sem-revisao
  '145:9':
    texto: O Senhor é bom para com todos, e a sua compaixão se estende a todas as suas obras.
    status: ia-sem-revisao
  '145:10':
    texto: Todas as tuas obras te darão graças, Senhor, e os teus fiéis te bendirão.
    status: ia-sem-revisao
  '145:11':
    texto: Dirão a glória do teu reino e falarão do teu poder,
    status: ia-sem-revisao
  '145:12':
    texto: para dar a conhecer aos filhos dos homens os teus feitos poderosos e a glória esplêndida do
      teu reino.
    status: ia-sem-revisao
  '145:13':
    texto: O teu reino é um reino de todos os séculos, e o teu domínio, de geração em geração. O Senhor
      é fiel em todas as suas palavras, e santo em todas as suas obras.
    partes:
    - O teu reino é um reino de todos os séculos,
    - e o teu domínio, de geração em geração.
    - O Senhor é fiel em todas as suas palavras,
    - e santo em todas as suas obras.
    status: ia-sem-revisao
    observacao: 'O hebraico (texto-base) traz só a primeira metade do verso; “O Senhor é fiel em todas
      as suas palavras, e santo em todas as suas obras” vem da Vulgata, da Septuaginta e de Qumran, e
      é a parte que o Lecionário cita como c e d. Partes: a e b do hebraico, c e d da Vulgata.'
  '145:14':
    texto: O Senhor sustenta todos os que caem e levanta todos os que estão curvados.
    status: ia-sem-revisao
  '145:15':
    texto: Os olhos de todos esperam em ti, e tu lhes dás o alimento a seu tempo.
    status: ia-sem-revisao
  '145:16':
    texto: Abres a tua mão e satisfazes o desejo de todo ser vivo.
    status: ia-sem-revisao
  '145:17':
    texto: O Senhor é justo em todos os seus caminhos e bondoso em todas as suas obras.
    status: ia-sem-revisao
  '145:18':
    texto: O Senhor está perto de todos os que o invocam, de todos os que o invocam com sinceridade.
    status: ia-sem-revisao
  '145:19':
    texto: Realiza o desejo dos que o temem, ouve o seu clamor e os salva.
    status: ia-sem-revisao
  '145:20':
    texto: O Senhor guarda todos os que o amam, mas aniquilará todos os ímpios.
    status: ia-sem-revisao
  '145:21':
    texto: A minha boca proclamará o louvor do Senhor, e toda carne bendirá o seu santo nome para sempre
      e eternamente.
    status: ia-sem-revisao
  '146:1':
    texto: Louva o Senhor, ó minha alma.
    titulo: Aleluia.
    status: ia-sem-revisao
  '146:2':
    texto: Louvarei o Senhor enquanto viver; cantarei ao meu Deus enquanto existir.
    status: ia-sem-revisao
  '146:3':
    texto: Não confieis nos príncipes, nos filhos dos homens, que não podem salvar.
    status: ia-sem-revisao
  '146:4':
    texto: Quando lhes falta o sopro, voltam à terra; naquele dia perecem os seus projetos.
    status: ia-sem-revisao
  '146:5':
    texto: Feliz aquele que tem por auxílio o Deus de Jacó, cuja esperança está no Senhor, seu Deus,
    status: ia-sem-revisao
  '146:6':
    texto: que fez o céu e a terra, o mar e tudo o que neles existe, e que guarda a fidelidade para sempre;
    partes:
    - que fez o céu e a terra,
    - o mar e tudo o que neles existe,
    - e que guarda a fidelidade para sempre;
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '146:7':
    texto: que faz justiça aos oprimidos, dá pão aos famintos. O Senhor liberta os presos.
    status: ia-sem-revisao
  '146:8':
    texto: O Senhor abre os olhos aos cegos, o Senhor levanta os curvados, o Senhor ama os justos.
    status: ia-sem-revisao
  '146:9':
    texto: O Senhor protege os estrangeiros, sustenta o órfão e a viúva, mas desvia o caminho dos ímpios.
    partes:
    - O Senhor protege os estrangeiros,
    - sustenta o órfão e a viúva,
    - mas desvia o caminho dos ímpios.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '146:10':
    texto: O Senhor reinará para sempre; o teu Deus, ó Sião, de geração em geração. Aleluia.
    status: ia-sem-revisao
  '147:1':
    texto: Pois é bom cantar ao nosso Deus; é agradável e conveniente louvá-lo.
    titulo: Aleluia.
    status: ia-sem-revisao
  '147:2':
    texto: O Senhor reconstrói Jerusalém e reúne os dispersos de Israel.
    status: ia-sem-revisao
  '147:3':
    texto: Ele cura os de coração quebrantado e enfaixa as suas feridas.
    status: ia-sem-revisao
  '147:4':
    texto: Ele conta o número das estrelas e chama cada uma pelo nome.
    status: ia-sem-revisao
  '147:5':
    texto: Grande é o nosso Senhor e imenso o seu poder; a sua inteligência não tem medida.
    status: ia-sem-revisao
  '147:6':
    texto: O Senhor sustenta os humildes e abate os ímpios até o chão.
    status: ia-sem-revisao
  '147:12':
    texto: Glorifica o Senhor, Jerusalém; louva o teu Deus, Sião.
    status: ia-sem-revisao
  '147:13':
    texto: Pois reforçou os ferrolhos das tuas portas e abençoou os teus filhos no teu meio.
    status: ia-sem-revisao
  '147:14':
    texto: Ele estabelece a paz nas tuas fronteiras e te sacia com a flor do trigo.
    status: ia-sem-revisao
  '147:15':
    texto: Ele envia a sua palavra à terra, e a sua ordem corre velozmente.
    status: ia-sem-revisao
  '147:16':
    texto: Ele dá a neve como lã e espalha a geada como cinza.
    status: ia-sem-revisao
  '147:19':
    texto: Anuncia a sua palavra a Jacó, os seus estatutos e juízos a Israel.
    status: ia-sem-revisao
  '147:20':
    texto: Não fez assim a nenhuma outra nação, e os seus juízos elas não os conhecem. Aleluia.
    status: ia-sem-revisao
  '148:1':
    texto: Louvai o Senhor, desde os céus, louvai-o nas alturas.
    titulo: Aleluia.
    status: ia-sem-revisao
  '148:2':
    texto: Louvai-o, todos os seus anjos; louvai-o, todos os seus exércitos.
    status: ia-sem-revisao
  '148:11':
    texto: Reis da terra e todos os povos, príncipes e todos os juízes da terra,
    status: ia-sem-revisao
  '148:12':
    texto: jovens e moças, velhos e crianças.
    status: ia-sem-revisao
  '148:13':
    texto: Louvem o nome do Senhor, pois só o seu nome é sublime; a sua majestade está acima da terra
      e do céu.
    partes:
    - Louvem o nome do Senhor,
    - pois só o seu nome é sublime;
    - a sua majestade está acima da terra e do céu.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '148:14':
    texto: Ele fortaleceu o seu povo; é louvor para todos os seus fiéis, para os filhos de Israel, o povo
      que lhe é próximo. Aleluia.
    status: ia-sem-revisao
  '149:1':
    texto: Cantai ao Senhor um canto novo; o seu louvor na assembleia dos fiéis.
    titulo: Aleluia.
    status: ia-sem-revisao
  '149:2':
    texto: Alegre-se Israel no seu Criador; os filhos de Sião exultem no seu Rei.
    status: ia-sem-revisao
  '149:3':
    texto: Louvem o seu nome com danças, cantem-lhe com tamborim e cítara.
    status: ia-sem-revisao
  '149:4':
    texto: Pois o Senhor se compraz no seu povo e coroa os humildes com a salvação.
    status: ia-sem-revisao
  '149:5':
    texto: Exultem os fiéis na glória e cantem de alegria sobre os seus leitos.
    status: ia-sem-revisao
  '149:6':
    texto: Os louvores a Deus estejam na sua garganta, e a espada de dois gumes, na sua mão,
    partes:
    - Os louvores a Deus estejam na sua garganta,
    - e a espada de dois gumes, na sua mão,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '149:9':
    texto: 'para executar contra eles a sentença escrita: esta é a glória de todos os seus fiéis. Aleluia.'
    partes:
    - 'para executar contra eles a sentença escrita:'
    - esta é a glória de todos os seus fiéis. Aleluia.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '150:1':
    texto: Louvai a Deus no seu santuário, louvai-o no seu poderoso firmamento.
    titulo: Aleluia.
    status: ia-sem-revisao
  '150:2':
    texto: Louvai-o pelos seus feitos poderosos, louvai-o segundo a sua imensa grandeza.
    status: ia-sem-revisao
  '150:3':
    texto: Louvai-o ao som da trombeta, louvai-o com a harpa e a cítara.
    status: ia-sem-revisao
  '150:4':
    texto: Louvai-o com tamborim e dança, louvai-o com instrumentos de corda e flauta.
    status: ia-sem-revisao
  '150:5':
    texto: Louvai-o com címbalos sonoros, louvai-o com címbalos de júbilo.
    status: ia-sem-revisao
  '150:6':
    texto: Tudo o que respira louve o Senhor. Aleluia.
    status: ia-sem-revisao
