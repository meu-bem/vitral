livro: JOL
fonte: oshb
versiculos:
  '1:13':
    texto: Cingi-vos de saco e lamentai, sacerdotes; gemei, ministros do altar; vinde, passai a noite
      em saco, ministros do meu Deus, porque da casa do vosso Deus foram retiradas a oferta e a libação.
    status: ia-sem-revisao
  '1:14':
    texto: Proclamai um jejum santo, convocai uma assembleia, reuni os anciãos e todos os habitantes da
      terra na casa do Senhor, vosso Deus, e clamai ao Senhor.
    status: ia-sem-revisao
  '1:15':
    texto: Ai daquele dia! Pois o dia do Senhor está próximo; como devastação vinda do Todo-Poderoso ele
      virá.
    status: ia-sem-revisao
  '2:1':
    texto: 'Tocai a trombeta em Sião, soai o alarme no meu santo monte; tremam todos os habitantes da
      terra, porque vem o dia do Senhor, porque está próximo:'
    status: ia-sem-revisao
  '2:2':
    texto: dia de trevas e escuridão, dia de nuvens e de névoa espessa. Como a aurora se estende sobre
      os montes, vem um povo numeroso e forte, como nunca houve desde a antiguidade, nem depois dele haverá,
      até os anos de geração em geração.
    status: ia-sem-revisao
  '2:12':
    texto: Mesmo agora — oráculo do Senhor — voltai a mim de todo o vosso coração, com jejum, com choro
      e com lamento.
    status: ia-sem-revisao
  '2:13':
    texto: Rasgai o vosso coração, e não as vossas vestes, e voltai ao Senhor, vosso Deus, pois ele é
      clemente e misericordioso, lento para a ira, rico em bondade, e se arrepende do mal.
    status: ia-sem-revisao
  '2:14':
    texto: 'Quem sabe? Talvez volte atrás e se arrependa e deixe depois de si uma bênção: oferta e libação
      para o Senhor, vosso Deus.'
    status: ia-sem-revisao
  '2:15':
    texto: Tocai a trombeta em Sião, proclamai um jejum santo, convocai uma assembleia.
    status: ia-sem-revisao
  '2:16':
    texto: Reuni o povo, santificai a comunidade, juntai os anciãos, reuni as crianças e os que mamam;
      saia o noivo do seu quarto e a noiva do seu leito nupcial.
    status: ia-sem-revisao
  '2:17':
    texto: 'Entre o pórtico e o altar chorem os sacerdotes, ministros do Senhor, e digam: “Poupa, Senhor,
      o teu povo, e não entregues a tua herança ao opróbrio, para que as nações dominem sobre ela. Por
      que se dirá entre os povos: ‘Onde está o seu Deus?’”'
    status: ia-sem-revisao
  '2:18':
    texto: O Senhor teve ciúme da sua terra e compadeceu-se do seu povo.
    status: ia-sem-revisao
  '4:12':
    texto: Que despertem as nações e subam ao vale de Josafá, porque ali me assentarei para julgar todas
      as nações ao redor.
    status: ia-sem-revisao
  '4:13':
    texto: Lançai a foice, porque a messe está madura; vinde, pisai, porque o lagar está cheio, as tinas
      transbordam, pois grande é a sua maldade.
    status: ia-sem-revisao
  '4:14':
    texto: Multidões, multidões no vale da decisão! Pois o dia do Senhor está próximo no vale da decisão.
    status: ia-sem-revisao
  '4:15':
    texto: O sol e a lua se escurecem, e as estrelas retiram o seu brilho.
    status: ia-sem-revisao
  '4:16':
    texto: O Senhor ruge de Sião e levanta a sua voz de Jerusalém; tremem os céus e a terra; mas o Senhor
      é refúgio para o seu povo e fortaleza para os filhos de Israel.
    status: ia-sem-revisao
  '4:17':
    texto: Sabereis que eu sou o Senhor, vosso Deus, que habito em Sião, meu santo monte; Jerusalém será
      santa, e estrangeiros já não passarão por ela.
    status: ia-sem-revisao
  '4:18':
    texto: Naquele dia os montes destilarão vinho doce, as colinas fluirão leite, e todos os leitos de
      Judá correrão com água; uma fonte sairá da casa do Senhor e regará o vale das Acácias.
    status: ia-sem-revisao
  '4:19':
    texto: O Egito será uma desolação, e Edom um deserto desolado, por causa da violência contra os filhos
      de Judá, em cuja terra derramaram sangue inocente.
    status: ia-sem-revisao
  '4:20':
    texto: Mas Judá será habitada para sempre, e Jerusalém, de geração em geração.
    status: ia-sem-revisao
  '4:21':
    texto: Vingarei o sangue deles, que ainda não vinguei; e o Senhor habita em Sião.
    status: ia-sem-revisao
    observacao: O verbo hebraico pode significar “absolver” ou “vingar”.
