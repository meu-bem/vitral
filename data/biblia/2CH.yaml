livro: 2CH
fonte: oshb
versiculos:
  '24:17':
    texto: Depois da morte de Joiada, vieram os chefes de Judá e prostraram-se diante do rei; então o
      rei os ouviu.
    status: ia-sem-revisao
  '24:18':
    texto: Abandonaram a casa do Senhor, Deus dos seus pais, e serviram às aserás e aos ídolos; e houve
      ira contra Judá e Jerusalém por esta sua culpa.
    status: ia-sem-revisao
  '24:19':
    texto: Ele lhes enviou profetas para os fazer voltar ao Senhor; testemunharam contra eles, mas não
      deram ouvidos.
    status: ia-sem-revisao
  '24:20':
    texto: 'O espírito de Deus revestiu Zacarias, filho do sacerdote Joiada, que se pôs diante do povo
      e lhes disse: “Assim diz Deus: Por que transgredis os mandamentos do Senhor? Não prosperareis! Porque
      abandonastes o Senhor, ele também vos abandonou.”'
    status: ia-sem-revisao
  '24:21':
    texto: Conspiraram contra ele e, por ordem do rei, o apedrejaram no pátio da casa do Senhor.
    status: ia-sem-revisao
  '24:22':
    texto: 'O rei Joás não se lembrou da bondade que Joiada, pai de Zacarias, lhe tinha feito, e matou
      o filho dele. Ao morrer, este disse: “Que o Senhor veja e peça contas!”'
    status: ia-sem-revisao
  '24:23':
    texto: No fim do ano subiu contra ele o exército de Aram; entraram em Judá e em Jerusalém, destruíram
      do povo todos os chefes e enviaram todo o seu despojo ao rei de Damasco.
    status: ia-sem-revisao
  '24:24':
    texto: Embora o exército de Aram tivesse vindo com poucos homens, o Senhor entregou nas suas mãos
      um exército muito grande, porque tinham abandonado o Senhor, Deus dos seus pais; e executaram o
      juízo sobre Joás.
    status: ia-sem-revisao
  '24:25':
    texto: Ao retirarem-se, deixando-o gravemente enfermo, os seus servos conspiraram contra ele, por
      causa do sangue do filho do sacerdote Joiada, e o mataram na sua cama. Ele morreu e o sepultaram
      na Cidade de Davi, mas não nos sepulcros dos reis.
    status: ia-sem-revisao
  '36:14':
    texto: Também todos os chefes dos sacerdotes e o povo multiplicaram as infidelidades, conforme todas
      as abominações das nações, e contaminaram a casa do Senhor, que ele santificara em Jerusalém.
    status: ia-sem-revisao
  '36:15':
    texto: O Senhor, Deus dos seus pais, enviou-lhes, por meio dos seus mensageiros, advertências desde
      cedo e continuamente, porque tinha compaixão do seu povo e da sua morada.
    status: ia-sem-revisao
  '36:16':
    texto: Mas eles zombavam dos mensageiros de Deus, desprezavam as suas palavras e escarneciam dos seus
      profetas, até que a ira do Senhor se levantou contra o seu povo, sem remédio.
    status: ia-sem-revisao
  '36:19':
    texto: Queimaram a casa de Deus, derrubaram a muralha de Jerusalém, queimaram a fogo todos os seus
      palácios e destruíram todos os seus objetos preciosos.
    status: ia-sem-revisao
  '36:20':
    texto: Os que escaparam da espada, ele os deportou para a Babilônia, onde foram servos dele e de seus
      filhos até o domínio do reino da Pérsia,
    status: ia-sem-revisao
  '36:21':
    texto: para que se cumprisse a palavra do Senhor pela boca de Jeremias, até que a terra pagasse os
      seus sábados; todos os dias da desolação ela descansou, até se completarem setenta anos.
    status: ia-sem-revisao
  '36:22':
    texto: 'No primeiro ano de Ciro, rei da Pérsia, para que se cumprisse a palavra do Senhor pela boca
      de Jeremias, o Senhor despertou o espírito de Ciro, rei da Pérsia, que fez passar uma proclamação
      por todo o seu reino e também por escrito:'
    status: ia-sem-revisao
  '36:23':
    texto: '“Assim diz Ciro, rei da Pérsia: O Senhor, Deus do céu, deu-me todos os reinos da terra e me
      encarregou de lhe edificar uma casa em Jerusalém, que está em Judá. Quem de vós, de todo o seu povo,
      — o Senhor, seu Deus, esteja com ele — suba.”'
    status: ia-sem-revisao
