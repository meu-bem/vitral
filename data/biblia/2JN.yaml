livro: 2JN
fonte: sblgnt
versiculos:
  '1:1':
    texto: O presbítero à senhora eleita e aos seus filhos, a quem eu amo na verdade, e não só eu, mas
      também todos os que conheceram a verdade,
    status: ia-sem-revisao
  '1:2':
    texto: 'Por causa da verdade que permanece em nós e estará conosco para sempre:'
    status: ia-sem-revisao
  '1:3':
    texto: Estarão conosco graça, misericórdia e paz da parte de Deus Pai e de Jesus Cristo, o Filho do
      Pai, na verdade e no amor.
    status: ia-sem-revisao
  '1:4':
    texto: Alegrei-me muito por ter encontrado, entre os teus filhos, quem anda na verdade, conforme o
      mandamento que recebemos do Pai.
    status: ia-sem-revisao
  '1:5':
    texto: 'E agora te peço, senhora, não como quem escreve um mandamento novo, mas o que tínhamos desde
      o princípio: que nos amemos uns aos outros.'
    status: ia-sem-revisao
  '1:6':
    texto: 'E este é o amor: que andemos segundo os seus mandamentos. Este é o mandamento, como ouvistes
      desde o princípio: que andeis nele.'
    status: ia-sem-revisao
  '1:7':
    texto: Pois muitos sedutores saíram pelo mundo, os que não confessam Jesus Cristo vindo na carne.
      Este é o sedutor e o anticristo.
    status: ia-sem-revisao
  '1:8':
    texto: Olhai por vós mesmos, para não perderdes o que realizamos, mas receberdes salário completo.
    status: ia-sem-revisao
  '1:9':
    texto: Todo aquele que se adianta e não permanece na doutrina de Cristo não tem Deus; quem permanece
      na doutrina, esse tem o Pai e o Filho.
    status: ia-sem-revisao
  '1:10':
    texto: Se alguém vem a vós e não traz esta doutrina, não o recebais em casa nem lhe digais “Salve!”,
    status: ia-sem-revisao
  '1:11':
    texto: Pois quem lhe diz “Salve!” participa das suas obras más.
    status: ia-sem-revisao
  '1:12':
    texto: Tendo muitas coisas a vos escrever, não quis fazê-lo com papel e tinta, mas espero ir ter convosco
      e falar de boca a boca, para que a vossa alegria seja plena.
    status: ia-sem-revisao
  '1:13':
    texto: Saúdam-te os filhos da tua irmã eleita.
    status: ia-sem-revisao
