livro: 2PE
fonte: sblgnt
versiculos:
  '1:1':
    texto: 'Simeão Pedro, servo e apóstolo de Jesus Cristo, aos que receberam, por sorte, uma fé de igual
      preço que a nossa, na justiça do nosso Deus e Salvador Jesus Cristo:'
    status: ia-sem-revisao
  '1:2':
    texto: Graça e paz vos sejam multiplicadas no conhecimento de Deus e de Jesus, nosso Senhor.
    status: ia-sem-revisao
  '1:3':
    texto: Como o seu divino poder nos concedeu tudo o que se refere à vida e à piedade, mediante o conhecimento
      daquele que nos chamou por sua própria glória e virtude,
    status: ia-sem-revisao
  '1:4':
    texto: Pelas quais nos foram concedidas as promessas preciosas e maiores, para que por elas vos torneis
      participantes da natureza divina, tendo escapado da corrupção que há no mundo por causa da concupiscência.
    status: ia-sem-revisao
  '1:5':
    texto: Por isso mesmo, empregando toda a diligência, acrescentai à vossa fé a virtude; à virtude,
      o conhecimento;
    status: ia-sem-revisao
  '1:6':
    texto: Ao conhecimento, o domínio de si; ao domínio de si, a perseverança; à perseverança, a piedade;
    status: ia-sem-revisao
  '1:7':
    texto: À piedade, o amor fraterno; ao amor fraterno, a caridade.
    status: ia-sem-revisao
  '1:8':
    texto: Pois, estando estas coisas em vós e crescendo, não vos deixam ociosos nem infrutuosos para
      o conhecimento de nosso Senhor Jesus Cristo.
    status: ia-sem-revisao
  '1:9':
    texto: Pois aquele em quem estas coisas não estão presentes é cego, de vista curta, esquecido da purificação
      dos seus antigos pecados.
    status: ia-sem-revisao
  '1:10':
    texto: Por isso, irmãos, empenhai-vos ainda mais em tornar firme a vossa vocação e eleição; pois,
      fazendo isso, jamais tropeçareis.
    status: ia-sem-revisao
  '1:11':
    texto: Assim, será generosamente concedida a vós a entrada no reino eterno de nosso Senhor e Salvador
      Jesus Cristo.
    status: ia-sem-revisao
  '1:12':
    texto: Por isso, sempre vos lembrarei destas coisas, ainda que as saibais e estejais firmados na verdade
      presente.
    status: ia-sem-revisao
  '1:13':
    texto: Julgo justo, enquanto estiver nesta tenda, despertar-vos com recordações,
    status: ia-sem-revisao
  '1:14':
    texto: Sabendo que está próxima a minha deposição desta tenda, como também nosso Senhor Jesus Cristo
      me deu a conhecer.
    status: ia-sem-revisao
  '1:15':
    texto: Empenhar-me-ei, porém, para que, também depois da minha partida, possais sempre fazer memória
      destas coisas.
    status: ia-sem-revisao
  '1:16':
    texto: Pois não seguindo fábulas engenhosamente inventadas vos demos a conhecer o poder e a vinda
      de nosso Senhor Jesus Cristo, mas tendo sido testemunhas oculares da sua majestade.
    status: ia-sem-revisao
  '1:17':
    texto: 'Pois ele recebeu de Deus Pai honra e glória, quando lhe foi trazida da magnífica glória uma
      voz como esta: “Este é o meu Filho amado, em quem eu me comprazo” —'
    status: ia-sem-revisao
  '1:18':
    texto: E esta voz nós a ouvimos vinda do céu, estando com ele no santo monte.
    status: ia-sem-revisao
  '1:19':
    texto: E temos ainda mais firme a palavra profética, à qual fazeis bem em prestar atenção, como a
      uma lâmpada que brilha em lugar escuro, até que o dia desponte e a estrela da manhã se levante nos
      vossos corações;
    status: ia-sem-revisao
  '1:20':
    texto: 'Sabendo primeiro isto: que nenhuma profecia da Escritura se resolve por interpretação própria,'
    status: ia-sem-revisao
  '1:21':
    texto: Pois jamais uma profecia foi trazida por vontade humana, mas homens falaram da parte de Deus
      movidos pelo Espírito Santo.
    status: ia-sem-revisao
  '2:1':
    texto: Houve, porém, também falsos profetas no povo, como também entre vós haverá falsos mestres,
      que introduzirão heresias de perdição, negando até o Soberano que os resgatou, trazendo sobre si
      uma ruína repentina;
    status: ia-sem-revisao
  '2:2':
    texto: E muitos seguirão as suas libertinagens, por causa dos quais o caminho da verdade será blasfemado;
    status: ia-sem-revisao
  '2:3':
    texto: E, na ganância, vos explorarão com palavras fabricadas; a sentença contra eles, desde há muito,
      não tarda, e a sua perdição não dorme.
    status: ia-sem-revisao
  '2:4':
    texto: Pois, se Deus não poupou os anjos que pecaram, mas, lançando-os no Tártaro, entregou-os a cadeias
      de trevas, guardados para o julgamento;
    status: ia-sem-revisao
  '2:5':
    texto: E não poupou o mundo antigo, mas guardou Noé, o oitavo, pregador da justiça, ao trazer o dilúvio
      sobre o mundo dos ímpios;
    status: ia-sem-revisao
  '2:6':
    texto: E, reduzindo a cinzas as cidades de Sodoma e Gomorra, condenou-as à destruição, pondo-as como
      exemplo para os que haveriam de viver na impiedade;
    status: ia-sem-revisao
  '2:7':
    texto: E livrou o justo Ló, oprimido pelo comportamento libertino dos sem lei —
    status: ia-sem-revisao
  '2:8':
    texto: Pois aquele justo, habitando entre eles, dia após dia atormentava a sua alma justa pelo que
      via e ouvia das suas obras sem lei —
    status: ia-sem-revisao
  '2:9':
    texto: Sabe o Senhor livrar da provação os piedosos e reservar os injustos, sob castigo, para o dia
      do julgamento,
    status: ia-sem-revisao
  '2:10':
    texto: Sobretudo os que andam atrás da carne, no desejo de contaminação, e desprezam a soberania.
      Ousados, arrogantes, não temem blasfemar contra as glórias,
    status: ia-sem-revisao
  '2:11':
    texto: Quando os anjos, sendo maiores em força e poder, não proferem contra elas um julgamento injurioso
      diante do Senhor.
    status: ia-sem-revisao
  '2:12':
    texto: Estes, porém, como animais irracionais, nascidos por natureza para serem capturados e destruídos,
      blasfemando contra o que ignoram, em sua corrupção também serão corrompidos,
    status: ia-sem-revisao
  '2:13':
    texto: Recebendo o salário da injustiça. Consideram prazer o deleite em pleno dia; são nódoas e manchas,
      deleitando-se nos seus enganos enquanto banqueteiam convosco,
    status: ia-sem-revisao
  '2:14':
    texto: Tendo olhos cheios de adultério e insaciáveis de pecado, seduzindo almas instáveis, tendo o
      coração treinado na ganância, filhos de maldição.
    status: ia-sem-revisao
  '2:15':
    texto: Abandonando o caminho reto, extraviaram-se, seguindo o caminho de Balaão, filho de Bosor, que
      amou o salário da injustiça,
    status: ia-sem-revisao
  '2:16':
    texto: 'Mas teve repreensão pela sua própria transgressão: uma jumenta muda, falando com voz de homem,
      impediu a loucura do profeta.'
    status: ia-sem-revisao
  '2:17':
    texto: Estes são fontes sem água e brumas impelidas pela tempestade, para os quais está reservada
      a escuridão das trevas.
    status: ia-sem-revisao
  '2:18':
    texto: Pois, proferindo palavras altissonantes de vaidade, seduzem, pelas paixões da carne e por libertinagens,
      os que mal escaparam dos que vivem no erro,
    status: ia-sem-revisao
  '2:19':
    texto: Prometendo-lhes liberdade, quando eles mesmos são escravos da corrupção; pois aquilo por que
      alguém é vencido, disso se tornou escravo.
    status: ia-sem-revisao
  '2:20':
    texto: Pois, se, tendo escapado das contaminações do mundo pelo conhecimento do Senhor e Salvador
      Jesus Cristo, se deixam de novo enredar nelas e são vencidos, o seu último estado tornou-se pior
      que o primeiro.
    status: ia-sem-revisao
  '2:21':
    texto: Melhor lhes teria sido não ter conhecido o caminho da justiça do que, depois de conhecê-lo,
      voltar atrás do santo mandamento que lhes foi transmitido.
    status: ia-sem-revisao
  '2:22':
    texto: 'Aconteceu-lhes o que diz o provérbio verdadeiro: “O cão voltou ao seu próprio vômito” e “A
      porca lavada, à lama para revolver-se”.'
    status: ia-sem-revisao
  '3:1':
    texto: Esta já é, amados, a segunda carta que vos escrevo, nas quais desperto, com recordações, a
      vossa mente sincera,
    status: ia-sem-revisao
  '3:2':
    texto: Para que vos lembreis das palavras anunciadas de antemão pelos santos profetas e do mandamento
      do Senhor e Salvador, transmitido pelos vossos apóstolos,
    status: ia-sem-revisao
  '3:3':
    texto: 'Sabendo primeiro isto: que nos últimos dias virão zombadores, com zombaria, andando segundo
      os seus próprios desejos,'
    status: ia-sem-revisao
  '3:4':
    texto: 'E dizendo: “Onde está a promessa da sua vinda? Pois desde que os pais adormeceram, tudo permanece
      assim desde o princípio da criação.”'
    status: ia-sem-revisao
  '3:5':
    texto: 'Pois deliberadamente lhes escapa isto: que havia céus desde há muito e uma terra surgida da
      água e pela água, pela palavra de Deus,'
    status: ia-sem-revisao
  '3:6':
    texto: Pelas quais o mundo de então, inundado pela água, pereceu;
    status: ia-sem-revisao
  '3:7':
    texto: Mas os céus e a terra de agora, pela mesma palavra, estão reservados para o fogo, guardados
      para o dia do julgamento e da perdição dos homens ímpios.
    status: ia-sem-revisao
  '3:8':
    texto: 'Que isto, porém, não vos escape, amados: um dia para o Senhor é como mil anos, e mil anos
      como um dia.'
    status: ia-sem-revisao
  '3:9':
    texto: O Senhor não tarda em cumprir a promessa, como alguns pensam ser demora, mas é paciente para
      convosco, não querendo que alguns pereçam, mas que todos cheguem à conversão.
    status: ia-sem-revisao
  '3:10':
    texto: Virá, porém, o dia do Senhor como um ladrão; nele os céus passarão com estrondo, os elementos,
      abrasados, serão dissolvidos, e a terra e as obras que nela há serão descobertas.
    status: ia-sem-revisao
  '3:11':
    texto: Dissolvendo-se assim todas estas coisas, que tipo de pessoas convém que sejais, em santo proceder
      e piedade,
    status: ia-sem-revisao
  '3:12':
    texto: Aguardando e apressando a vinda do dia de Deus, por causa do qual os céus em chamas serão dissolvidos
      e os elementos abrasados se derreterão!
    status: ia-sem-revisao
  '3:13':
    texto: Esperamos, porém, segundo a sua promessa, novos céus e uma nova terra, nos quais habita a justiça.
    status: ia-sem-revisao
  '3:14':
    texto: Por isso, amados, aguardando estas coisas, empenhai-vos em ser achados por ele em paz, sem
      mancha e sem defeito,
    status: ia-sem-revisao
  '3:15':
    texto: E considerai a paciência de nosso Senhor como salvação, como também nosso amado irmão Paulo
      vos escreveu, segundo a sabedoria que lhe foi dada,
    partes:
    - E considerai a paciência de nosso Senhor como salvação,
    - como também nosso amado irmão Paulo vos escreveu, segundo a sabedoria que lhe foi dada,
    status: ia-sem-revisao
  '3:16':
    texto: Como também em todas as cartas, falando nelas sobre estas coisas; nelas há algumas difíceis
      de entender, que os ignorantes e instáveis torcem, como também as demais Escrituras, para a sua
      própria perdição.
    status: ia-sem-revisao
  '3:17':
    texto: Vós, pois, amados, sabendo isto de antemão, guardai-vos, para que, arrastados pelo erro dos
      sem lei, não decaiais da vossa própria firmeza,
    status: ia-sem-revisao
  '3:18':
    texto: Mas crescei na graça e no conhecimento de nosso Senhor e Salvador Jesus Cristo. A ele a glória,
      agora e até o dia da eternidade. Amém.
    status: ia-sem-revisao
