livro: JUD
fonte: sblgnt
versiculos:
  '1:1':
    texto: 'Judas, servo de Jesus Cristo e irmão de Tiago, aos chamados que são amados em Deus Pai e guardados
      para Jesus Cristo:'
    status: ia-sem-revisao
  '1:2':
    texto: Misericórdia, paz e amor vos sejam multiplicados.
    status: ia-sem-revisao
  '1:3':
    texto: Amados, tendo toda a pressa em vos escrever sobre a nossa salvação comum, foi-me necessário
      escrever-vos exortando-vos a combater pela fé que foi transmitida de uma vez por todas aos santos.
    status: ia-sem-revisao
  '1:4':
    texto: Pois infiltraram-se alguns homens, há muito tempo destinados a esta condenação, ímpios, que
      transformam a graça do nosso Deus em libertinagem e negam o nosso único Soberano e Senhor, Jesus
      Cristo.
    status: ia-sem-revisao
  '1:5':
    texto: Quero, pois, lembrar-vos, embora tudo já saibais de uma vez por todas, que Jesus, depois de
      salvar um povo da terra do Egito, destruiu em seguida os que não creram;
    status: ia-sem-revisao
    observacao: O texto-base traz “Jesus”; outros manuscritos trazem “o Senhor” ou “Deus”.
  '1:6':
    texto: e aos anjos que não guardaram a sua dignidade, mas abandonaram a própria morada, ele os tem
      guardado em prisões eternas, sob as trevas, para o julgamento do grande dia;
    status: ia-sem-revisao
  '1:7':
    texto: assim como Sodoma e Gomorra e as cidades vizinhas, que, de modo semelhante a eles, se entregaram
      à prostituição e foram atrás de outra carne, são postas como exemplo, sofrendo o castigo de um fogo
      eterno.
    status: ia-sem-revisao
  '1:8':
    texto: De modo semelhante, também estes, entregues aos seus delírios, contaminam a carne, rejeitam
      a soberania e blasfemam contra as glórias.
    status: ia-sem-revisao
  '1:9':
    texto: 'Mas o arcanjo Miguel, quando disputava com o diabo, discutindo sobre o corpo de Moisés, não
      ousou proferir um juízo injurioso, mas disse: “O Senhor te repreenda!”'
    status: ia-sem-revisao
  '1:10':
    texto: Estes, porém, blasfemam contra tudo o que ignoram; e naquilo que conhecem por instinto, como
      os animais irracionais, nisso se corrompem.
    status: ia-sem-revisao
  '1:11':
    texto: Ai deles! Pois seguiram o caminho de Caim, por lucro se lançaram no erro de Balaão e pereceram
      na rebelião de Coré.
    status: ia-sem-revisao
  '1:12':
    texto: Estes são rochas ocultas nos vossos banquetes de amor, banqueteando-se sem temor, apascentando-se
      a si mesmos; nuvens sem água, levadas pelos ventos; árvores outonais sem fruto, duas vezes mortas,
      arrancadas pela raiz;
    status: ia-sem-revisao
  '1:13':
    texto: ondas bravias do mar, espumando as suas próprias vergonhas; estrelas errantes, para as quais
      está guardada para sempre a escuridão das trevas.
    status: ia-sem-revisao
  '1:14':
    texto: 'Profetizou também a respeito deles Henoc, o sétimo depois de Adão, dizendo: “Eis que veio
      o Senhor com as suas santas miríades,'
    status: ia-sem-revisao
  '1:15':
    texto: para executar o julgamento contra todos e para convencer todos os ímpios de todas as obras
      de impiedade que impiamente praticaram, e de todas as palavras duras que pecadores ímpios falaram
      contra ele.”
    status: ia-sem-revisao
  '1:16':
    texto: Estes são murmuradores, descontentes, que andam segundo os seus desejos; a sua boca fala com
      arrogância, e lisonjeiam as pessoas por interesse.
    status: ia-sem-revisao
  '1:17':
    texto: Vós, porém, amados, lembrai-vos das palavras anunciadas de antemão pelos apóstolos de nosso
      Senhor Jesus Cristo,
    status: ia-sem-revisao
  '1:18':
    texto: 'pois vos diziam: “No último tempo haverá zombadores, que andam segundo os seus próprios desejos
      ímpios.”'
    status: ia-sem-revisao
  '1:19':
    texto: Estes são os que causam divisões, homens naturais, que não têm o Espírito.
    status: ia-sem-revisao
  '1:20':
    texto: Vós, porém, amados, edificando-vos na vossa santíssima fé, orando no Espírito Santo,
    status: ia-sem-revisao
  '1:21':
    texto: guardai-vos no amor de Deus, aguardando a misericórdia de nosso Senhor Jesus Cristo para a
      vida eterna.
    status: ia-sem-revisao
  '1:22':
    texto: E de uns, que duvidam, tende misericórdia;
    status: ia-sem-revisao
  '1:23':
    texto: a outros salvai, arrebatando-os do fogo; e de outros tende misericórdia com temor, odiando
      até a túnica manchada pela carne.
    status: ia-sem-revisao
  '1:24':
    texto: Àquele que é capaz de vos guardar sem tropeço e de vos apresentar diante da sua glória, irrepreensíveis,
      em exultação,
    status: ia-sem-revisao
  '1:25':
    texto: ao único Deus, nosso Salvador, por meio de Jesus Cristo, nosso Senhor, glória, majestade, poder
      e autoridade, antes de todo o tempo, agora e por todos os séculos. Amém.
    status: ia-sem-revisao
