livro: ROM
fonte: sblgnt
versiculos:
  '1:1':
    texto: Paulo, servo de Cristo Jesus, apóstolo por chamado, separado para o Evangelho de Deus,
    status: ia-sem-revisao
  '1:2':
    texto: que ele prometeu de antemão por meio dos seus profetas nas santas Escrituras,
    status: ia-sem-revisao
  '1:3':
    texto: a respeito do seu Filho, nascido da descendência de Davi segundo a carne,
    status: ia-sem-revisao
  '1:4':
    texto: constituído Filho de Deus com poder, segundo o Espírito de santidade, pela ressurreição dos
      mortos, Jesus Cristo, nosso Senhor,
    status: ia-sem-revisao
  '1:5':
    texto: por quem recebemos a graça e o apostolado, para obter a obediência da fé entre todas as nações,
      em favor do seu nome,
    status: ia-sem-revisao
  '1:6':
    texto: entre as quais estais também vós, chamados de Jesus Cristo,
    status: ia-sem-revisao
  '1:7':
    texto: 'a todos os que estão em Roma, amados de Deus, chamados santos: graça e paz a vós da parte
      de Deus, nosso Pai, e do Senhor Jesus Cristo.'
    status: ia-sem-revisao
  '1:8':
    texto: Primeiramente, dou graças ao meu Deus por Jesus Cristo, por todos vós, porque a vossa fé é
      anunciada em todo o mundo.
    status: ia-sem-revisao
  '1:9':
    texto: Pois Deus, a quem sirvo em meu espírito no Evangelho do seu Filho, é testemunha de que sem
      cessar faço memória de vós
    status: ia-sem-revisao
  '1:10':
    texto: sempre nas minhas orações, pedindo que, de algum modo, enfim, pela vontade de Deus, me seja
      aberto o caminho para ir ter convosco.
    status: ia-sem-revisao
  '1:11':
    texto: Pois desejo ardentemente ver-vos, para vos comunicar algum dom espiritual que vos fortaleça,
    status: ia-sem-revisao
  '1:12':
    texto: isto é, para sermos juntamente consolados entre vós, pela fé que mutuamente temos, vós e eu.
    status: ia-sem-revisao
  '1:13':
    texto: Não quero que ignoreis, irmãos, que muitas vezes me propus ir ter convosco, e fui impedido
      até agora, para colher algum fruto também entre vós, como entre as demais nações.
    status: ia-sem-revisao
  '1:14':
    texto: Sou devedor a gregos e bárbaros, a sábios e ignorantes;
    status: ia-sem-revisao
  '1:15':
    texto: assim, quanto está em mim, estou pronto a anunciar o Evangelho também a vós que estais em Roma.
    status: ia-sem-revisao
  '1:16':
    texto: Pois não me envergonho do Evangelho, porque é poder de Deus para a salvação de todo aquele
      que crê, do judeu primeiro e também do grego;
    status: ia-sem-revisao
  '1:17':
    texto: 'pois nele se revela a justiça de Deus, de fé em fé, como está escrito: “O justo viverá pela
      fé.”'
    status: ia-sem-revisao
  '1:18':
    texto: Revela-se, com efeito, do céu a ira de Deus contra toda impiedade e injustiça dos homens que
      mantêm a verdade prisioneira da injustiça,
    status: ia-sem-revisao
  '1:19':
    texto: porque o que se pode conhecer de Deus é manifesto entre eles, pois Deus o manifestou a eles.
    status: ia-sem-revisao
  '1:20':
    texto: 'Pois as suas perfeições invisíveis, desde a criação do mundo, são contempladas, compreendidas
      por meio das obras: o seu eterno poder e divindade, de modo que eles são inescusáveis;'
    status: ia-sem-revisao
  '1:21':
    texto: porque, tendo conhecido a Deus, não o glorificaram como Deus nem lhe deram graças, mas tornaram-se
      vãos nos seus raciocínios, e o seu coração insensato se obscureceu.
    status: ia-sem-revisao
  '1:22':
    texto: Dizendo-se sábios, tornaram-se loucos,
    status: ia-sem-revisao
  '1:23':
    texto: e trocaram a glória do Deus incorruptível por uma imagem semelhante ao homem corruptível, e
      a aves, quadrúpedes e répteis.
    status: ia-sem-revisao
  '1:24':
    texto: Por isso Deus os entregou, nos desejos dos seus corações, à impureza, de modo que desonrassem
      entre si os seus corpos,
    status: ia-sem-revisao
  '1:25':
    texto: eles que trocaram a verdade de Deus pela mentira, e adoraram e serviram à criatura em lugar
      do Criador, que é bendito pelos séculos. Amém.
    status: ia-sem-revisao
  '1:26':
    texto: Por isso Deus os entregou a paixões desonrosas; pois as suas mulheres trocaram o uso natural
      pelo que é contra a natureza,
    status: ia-sem-revisao
  '1:27':
    texto: e igualmente os homens, deixando o uso natural da mulher, abrasaram-se em seu desejo uns pelos
      outros, homens com homens praticando a indecência e recebendo em si mesmos a paga merecida do seu
      desvio.
    status: ia-sem-revisao
  '1:28':
    texto: E, como não julgaram bom ter a Deus no conhecimento, Deus os entregou a um modo de pensar reprovável,
      para fazerem o que não convém,
    status: ia-sem-revisao
  '1:29':
    texto: cheios de toda injustiça, maldade, cobiça, malícia; repletos de inveja, homicídio, contenda,
      engano, malignidade; difamadores,
    status: ia-sem-revisao
  '1:30':
    texto: maldizentes, inimigos de Deus, insolentes, soberbos, jactanciosos, inventores de males, rebeldes
      aos pais,
    status: ia-sem-revisao
  '1:31':
    texto: insensatos, desleais, sem afeto, sem misericórdia;
    status: ia-sem-revisao
  '1:32':
    texto: os quais, conhecendo o decreto de Deus, de que os que praticam tais coisas são dignos de morte,
      não só as fazem, mas ainda aprovam os que as praticam.
    status: ia-sem-revisao
  '2:1':
    texto: Por isso és inescusável, ó homem, quem quer que sejas que julgas; pois, naquilo em que julgas
      o outro, condenas a ti mesmo, porque praticas as mesmas coisas, tu que julgas.
    status: ia-sem-revisao
  '2:2':
    texto: Sabemos que o julgamento de Deus é segundo a verdade sobre os que praticam tais coisas.
    status: ia-sem-revisao
  '2:3':
    texto: Julgas tu, ó homem que julgas os que praticam tais coisas e as fazes, que escaparás ao julgamento
      de Deus?
    status: ia-sem-revisao
  '2:4':
    texto: Ou desprezas as riquezas da sua bondade, paciência e longanimidade, ignorando que a bondade
      de Deus te leva à conversão?
    status: ia-sem-revisao
  '2:5':
    texto: Por causa da tua dureza e do teu coração impenitente, acumulas para ti ira para o dia da ira
      e da revelação do justo julgamento de Deus,
    status: ia-sem-revisao
  '2:6':
    texto: 'que retribuirá a cada um segundo as suas obras:'
    status: ia-sem-revisao
  '2:7':
    texto: A vida eterna, aos que, com perseverança na boa obra, buscam glória, honra e incorruptibilidade;
    status: ia-sem-revisao
  '2:8':
    texto: mas, aos que, por espírito de rivalidade, desobedecem à verdade e obedecem à injustiça, ira
      e furor,
    status: ia-sem-revisao
  '2:9':
    texto: tribulação e angústia sobre toda alma humana que pratica o mal, do judeu primeiro e também
      do grego;
    status: ia-sem-revisao
  '2:10':
    texto: mas glória, honra e paz a todo o que pratica o bem, ao judeu primeiro e também ao grego;
    status: ia-sem-revisao
  '2:11':
    texto: pois em Deus não há acepção de pessoas.
    status: ia-sem-revisao
  '2:12':
    texto: Todos os que pecaram sem a Lei, sem a Lei também perecerão; e todos os que pecaram sob a Lei,
      pela Lei serão julgados;
    status: ia-sem-revisao
  '2:13':
    texto: pois não são justos diante de Deus os que ouvem a Lei, mas os que a praticam serão justificados.
    status: ia-sem-revisao
  '2:14':
    texto: Quando os gentios, que não têm Lei, praticam naturalmente o que é da Lei, eles, não tendo Lei,
      são lei para si mesmos;
    status: ia-sem-revisao
  '2:15':
    texto: eles mostram que a obra da Lei está escrita nos seus corações, dando testemunho a sua consciência
      e os seus pensamentos, que ora os acusam, ora os defendem,
    status: ia-sem-revisao
  '2:16':
    texto: no dia em que Deus julgar os segredos dos homens, segundo o meu Evangelho, por meio de Cristo
      Jesus.
    status: ia-sem-revisao
  '2:17':
    texto: Mas se tu te chamas judeu, e te apoias na Lei, e te glorias em Deus,
    status: ia-sem-revisao
  '2:18':
    texto: e conheces a sua vontade e discernes o que é melhor, instruído pela Lei,
    status: ia-sem-revisao
  '2:19':
    texto: e tens a convicção de ser guia de cegos, luz dos que estão nas trevas,
    status: ia-sem-revisao
  '2:20':
    texto: educador de insensatos, mestre de crianças, tendo na Lei a expressão do conhecimento e da verdade
      —
    status: ia-sem-revisao
  '2:21':
    texto: tu, pois, que ensinas o outro, não te ensinas a ti mesmo? Tu que pregas que não se deve roubar,
      roubas?
    status: ia-sem-revisao
  '2:22':
    texto: Tu que dizes que não se deve cometer adultério, cometes adultério? Tu que tens horror aos ídolos,
      saqueias templos?
    status: ia-sem-revisao
  '2:23':
    texto: Tu que te glorias na Lei, desonras a Deus pela transgressão da Lei?
    status: ia-sem-revisao
  '2:24':
    texto: Pois o nome de Deus, por vossa causa, é blasfemado entre as nações, como está escrito.
    status: ia-sem-revisao
  '2:25':
    texto: A circuncisão é útil se praticares a Lei; mas, se és transgressor da Lei, a tua circuncisão
      tornou-se incircuncisão.
    status: ia-sem-revisao
  '2:26':
    texto: Se, pois, o incircunciso guarda os preceitos da Lei, não será a sua incircuncisão considerada
      circuncisão?
    status: ia-sem-revisao
  '2:27':
    texto: E o incircunciso de nascença, que cumpre a Lei, te julgará a ti, que, com a letra e a circuncisão,
      és transgressor da Lei.
    status: ia-sem-revisao
  '2:28':
    texto: Pois judeu não é o que o é exteriormente, nem é circuncisão a que é exterior, na carne;
    status: ia-sem-revisao
  '2:29':
    texto: mas judeu é o que o é interiormente, e circuncisão é a do coração, no espírito, não na letra;
      o seu louvor não vem dos homens, mas de Deus.
    status: ia-sem-revisao
  '3:1':
    texto: Qual é, pois, a vantagem do judeu, ou qual a utilidade da circuncisão?
    status: ia-sem-revisao
  '3:2':
    texto: Grande, de todos os modos. Primeiramente, porque lhes foram confiadas as palavras de Deus.
    status: ia-sem-revisao
  '3:3':
    texto: Então? Se alguns foram infiéis, a sua infidelidade anulará a fidelidade de Deus?
    status: ia-sem-revisao
  '3:4':
    texto: 'De modo algum! Seja Deus verdadeiro, e todo homem mentiroso, como está escrito: “Para que
      sejas justificado nas tuas palavras e venças quando fores julgado.”'
    status: ia-sem-revisao
  '3:5':
    texto: Mas, se a nossa injustiça põe em relevo a justiça de Deus, que diremos? Que Deus é injusto
      ao infligir a ira? Falo como homem.
    status: ia-sem-revisao
  '3:6':
    texto: De modo algum! Pois, então, como Deus julgará o mundo?
    status: ia-sem-revisao
  '3:7':
    texto: Se a verdade de Deus abundou para a sua glória por causa da minha mentira, por que ainda sou
      julgado como pecador?
    status: ia-sem-revisao
  '3:8':
    texto: 'E por que não dizer, como somos caluniados e como alguns afirmam que dizemos: “Façamos o mal
      para que venha o bem”? A condenação desses é justa.'
    status: ia-sem-revisao
  '3:9':
    texto: Então? Levamos vantagem? De modo algum! Pois já acusamos de estarem todos sob o pecado, tanto
      judeus como gregos,
    status: ia-sem-revisao
  '3:10':
    texto: 'como está escrito: “Não há justo, nem um sequer;'
    status: ia-sem-revisao
  '3:11':
    texto: não há quem entenda, não há quem busque a Deus;
    status: ia-sem-revisao
  '3:12':
    texto: todos se desviaram, juntos se tornaram inúteis; não há quem faça o bem, não há sequer um.
    status: ia-sem-revisao
  '3:13':
    texto: Sepulcro aberto é a sua garganta, com as suas línguas enganam, veneno de serpentes há sob os
      seus lábios,
    status: ia-sem-revisao
  '3:14':
    texto: a sua boca está cheia de maldição e amargura;
    status: ia-sem-revisao
  '3:15':
    texto: os seus pés são velozes para derramar sangue,
    status: ia-sem-revisao
  '3:16':
    texto: ruína e miséria há nos seus caminhos,
    status: ia-sem-revisao
  '3:17':
    texto: e o caminho da paz não conheceram;
    status: ia-sem-revisao
  '3:18':
    texto: não há temor de Deus diante dos seus olhos.”
    status: ia-sem-revisao
  '3:19':
    texto: Sabemos que tudo o que a Lei diz, o diz aos que estão sob a Lei, para que toda boca se feche
      e o mundo inteiro se torne réu diante de Deus;
    status: ia-sem-revisao
  '3:20':
    texto: porque, pelas obras da Lei, nenhuma carne será justificada diante dele, pois pela Lei vem o
      conhecimento do pecado.
    status: ia-sem-revisao
  '3:21':
    texto: Agora, porém, sem a Lei, manifestou-se a justiça de Deus, atestada pela Lei e pelos Profetas,
    status: ia-sem-revisao
  '3:22':
    texto: justiça de Deus pela fé em Jesus Cristo, para todos os que creem, pois não há distinção.
    status: ia-sem-revisao
  '3:23':
    texto: Pois todos pecaram e estão privados da glória de Deus,
    status: ia-sem-revisao
  '3:24':
    texto: sendo justificados gratuitamente, por sua graça, mediante a redenção que há em Cristo Jesus.
    status: ia-sem-revisao
  '3:25':
    texto: A ele Deus destinou como instrumento de propiciação, pela fé, no seu sangue, para manifestação
      da sua justiça, por ter deixado impunes os pecados cometidos anteriormente,
    status: ia-sem-revisao
  '3:26':
    texto: no tempo da paciência de Deus, para manifestação da sua justiça no tempo presente, a fim de
      ser justo e justificar aquele que é da fé em Jesus.
    status: ia-sem-revisao
  '3:27':
    texto: Onde está, pois, a jactância? Foi excluída. Por qual lei? A das obras? Não, mas pela lei da
      fé.
    status: ia-sem-revisao
  '3:28':
    texto: Pois julgamos que o homem é justificado pela fé, sem as obras da Lei.
    status: ia-sem-revisao
  '3:29':
    texto: Ou é Deus somente dos judeus? Não o é também das nações? Sim, também das nações,
    status: ia-sem-revisao
  '3:30':
    texto: se é que há um só Deus, que justificará a circuncisão pela fé e a incircuncisão por meio da
      fé.
    status: ia-sem-revisao
  '3:31':
    texto: Anulamos, então, a Lei pela fé? De modo algum! Antes, confirmamos a Lei.
    status: ia-sem-revisao
  '4:1':
    texto: Que diremos, pois, ter obtido Abraão, nosso pai segundo a carne?
    status: ia-sem-revisao
  '4:2':
    texto: Se Abraão foi justificado pelas obras, tem de que se gloriar, mas não diante de Deus.
    status: ia-sem-revisao
  '4:3':
    texto: Pois que diz a Escritura? “Abraão creu em Deus, e isso lhe foi atribuído como justiça.”
    status: ia-sem-revisao
  '4:4':
    texto: Ao que trabalha, o salário não lhe é atribuído como graça, mas como dívida;
    status: ia-sem-revisao
  '4:5':
    texto: ao que não trabalha, mas crê naquele que justifica o ímpio, a sua fé lhe é atribuída como justiça,
    status: ia-sem-revisao
  '4:6':
    texto: 'assim como Davi também proclama a bem-aventurança do homem a quem Deus atribui justiça independentemente
      das obras:'
    status: ia-sem-revisao
  '4:7':
    texto: “Bem-aventurados aqueles cujas iniquidades foram perdoadas e cujos pecados foram cobertos;
    status: ia-sem-revisao
  '4:8':
    texto: bem-aventurado o homem a quem o Senhor não atribui pecado.”
    status: ia-sem-revisao
  '4:9':
    texto: 'Esta bem-aventurança é só para a circuncisão ou também para a incircuncisão? Dizemos, com
      efeito: “A fé foi atribuída a Abraão como justiça.”'
    status: ia-sem-revisao
  '4:10':
    texto: Como lhe foi atribuída? Quando estava circuncidado ou incircunciso? Não na circuncisão, mas
      na incircuncisão;
    status: ia-sem-revisao
  '4:11':
    texto: e recebeu o sinal da circuncisão como selo da justiça da fé que tinha na incircuncisão, para
      ser pai de todos os que creem sem ser circuncidados, para que também a eles a justiça seja atribuída,
    status: ia-sem-revisao
  '4:12':
    texto: e pai dos circuncidados, dos que não são apenas da circuncisão, mas também seguem as pegadas
      da fé que nosso pai Abraão teve na incircuncisão.
    status: ia-sem-revisao
  '4:13':
    texto: Pois não foi mediante a Lei que se deu a Abraão ou à sua descendência a promessa de ser herdeiro
      do mundo, mas mediante a justiça da fé;
    status: ia-sem-revisao
  '4:14':
    texto: pois, se os herdeiros são os da Lei, a fé fica esvaziada e a promessa anulada;
    status: ia-sem-revisao
  '4:15':
    texto: porque a Lei produz ira; mas onde não há Lei, não há transgressão.
    status: ia-sem-revisao
  '4:16':
    texto: Por isso é pela fé, para que seja por graça, a fim de que a promessa seja firme para toda a
      descendência, não só para a que é da Lei, mas também para a que é da fé de Abraão (que é pai de
      todos nós,
    status: ia-sem-revisao
  '4:17':
    texto: 'como está escrito: “Constituí-te pai de muitas nações”), diante de Deus em quem creu, que
      dá vida aos mortos e chama à existência as coisas que não existem;'
    status: ia-sem-revisao
  '4:18':
    texto: 'ele, contra toda esperança, creu com esperança, para vir a ser pai de muitas nações, segundo
      o que lhe fora dito: “Assim será a tua descendência.”'
    status: ia-sem-revisao
  '4:19':
    texto: E, sem fraquejar na fé, considerou o seu próprio corpo já sem vigor, pois tinha cerca de cem
      anos, e o seio morto de Sara;
    status: ia-sem-revisao
  '4:20':
    texto: diante da promessa de Deus não vacilou por incredulidade, mas fortaleceu-se na fé, dando glória
      a Deus,
    status: ia-sem-revisao
  '4:21':
    texto: plenamente convencido de que ele é poderoso para cumprir o que prometeu.
    status: ia-sem-revisao
  '4:22':
    texto: Por isso lhe foi atribuído como justiça.
    status: ia-sem-revisao
  '4:23':
    texto: Não foi escrito só por causa dele que isso lhe foi atribuído,
    status: ia-sem-revisao
  '4:24':
    texto: mas também por causa de nós, a quem será atribuído, a nós que cremos naquele que ressuscitou
      dos mortos Jesus, nosso Senhor,
    status: ia-sem-revisao
  '4:25':
    texto: que foi entregue por causa das nossas transgressões e ressuscitou para a nossa justificação.
    status: ia-sem-revisao
  '5:1':
    texto: Justificados, pois, pela fé, temos paz com Deus por meio de nosso Senhor Jesus Cristo,
    status: ia-sem-revisao
  '5:2':
    texto: por quem temos também acesso, pela fé, a esta graça em que estamos firmes, e nos gloriamos
      na esperança da glória de Deus;
    status: ia-sem-revisao
  '5:3':
    texto: e não só isso, mas também nos gloriamos nas tribulações, sabendo que a tribulação produz a
      perseverança,
    status: ia-sem-revisao
  '5:4':
    texto: a perseverança, a virtude comprovada, e a virtude comprovada, a esperança.
    status: ia-sem-revisao
  '5:5':
    texto: E a esperança não decepciona, porque o amor de Deus foi derramado em nossos corações pelo Espírito
      Santo que nos foi dado.
    partes:
    - E a esperança não decepciona,
    - porque o amor de Deus foi derramado em nossos corações pelo Espírito Santo que nos foi dado.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '5:6':
    texto: Pois, quando ainda éramos fracos, Cristo, no tempo marcado, morreu pelos ímpios.
    status: ia-sem-revisao
  '5:7':
    texto: Dificilmente alguém morrerá por um justo; por um homem bom talvez alguém se anime a morrer;
    status: ia-sem-revisao
  '5:8':
    texto: mas Deus demonstra o seu amor para conosco em que, quando ainda éramos pecadores, Cristo morreu
      por nós.
    status: ia-sem-revisao
  '5:9':
    texto: Muito mais, portanto, agora justificados pelo seu sangue, seremos salvos por ele da ira.
    status: ia-sem-revisao
  '5:10':
    texto: Pois, se, quando éramos inimigos, fomos reconciliados com Deus pela morte do seu Filho, muito
      mais, reconciliados, seremos salvos pela sua vida;
    status: ia-sem-revisao
  '5:11':
    texto: e não só isso, mas também nos gloriamos em Deus por nosso Senhor Jesus Cristo, por quem agora
      recebemos a reconciliação.
    status: ia-sem-revisao
  '5:12':
    texto: Por isso, como por um só homem entrou o pecado no mundo, e pelo pecado a morte, e assim a morte
      passou a todos os homens, porque todos pecaram —
    status: ia-sem-revisao
    observacao: O grego “ἐφʼ ᾧ” é discutido; aqui é traduzido por “porque”. A frase fica interrompida,
      como no texto-base, e é retomada no v. 18.
  '5:13':
    texto: pois até a Lei havia pecado no mundo, mas o pecado não é imputado onde não há Lei;
    status: ia-sem-revisao
  '5:14':
    texto: contudo, a morte reinou desde Adão até Moisés, mesmo sobre os que não pecaram à semelhança
      da transgressão de Adão, que é figura daquele que havia de vir.
    status: ia-sem-revisao
  '5:15':
    texto: Mas o dom não é como a transgressão; pois, se pela transgressão de um só morreram os muitos,
      muito mais a graça de Deus e o dom, dado pela graça de um só homem, Jesus Cristo, abundaram para
      os muitos.
    partes:
    - Mas o dom não é como a transgressão;
    - pois, se pela transgressão de um só morreram os muitos, muito mais a graça de Deus e o dom, dado
      pela graça de um só homem, Jesus Cristo, abundaram para os muitos.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '5:16':
    texto: 'E o dom não é como o que veio por um só que pecou: o julgamento, a partir de um só, levou
      à condenação; o dom, a partir de muitas transgressões, levou à justificação.'
    status: ia-sem-revisao
  '5:17':
    texto: Pois, se pela transgressão de um só a morte reinou por meio de um só, muito mais os que recebem
      a abundância da graça e do dom da justiça reinarão na vida por meio de um só, Jesus Cristo.
    status: ia-sem-revisao
  '5:18':
    texto: Assim, pois, como por uma só transgressão veio a condenação para todos os homens, assim também
      por um só ato de justiça veio para todos os homens a justificação que dá a vida;
    status: ia-sem-revisao
  '5:19':
    texto: pois, como pela desobediência de um só homem os muitos foram constituídos pecadores, assim
      também pela obediência de um só os muitos serão constituídos justos.
    status: ia-sem-revisao
  '5:20':
    texto: A Lei interveio para que a transgressão se multiplicasse; mas onde se multiplicou o pecado,
      superabundou a graça,
    partes:
    - A Lei interveio para que a transgressão se multiplicasse;
    - mas onde se multiplicou o pecado, superabundou a graça,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '5:21':
    texto: para que, como o pecado reinou na morte, assim também a graça reine pela justiça para a vida
      eterna, por Jesus Cristo, nosso Senhor.
    status: ia-sem-revisao
  '6:1':
    texto: Que diremos, pois? Permaneceremos no pecado, para que a graça abunde?
    status: ia-sem-revisao
  '6:2':
    texto: De modo algum! Nós, que morremos para o pecado, como ainda viveremos nele?
    status: ia-sem-revisao
  '6:3':
    texto: Ou ignorais que todos os que fomos batizados em Cristo Jesus fomos batizados na sua morte?
    status: ia-sem-revisao
  '6:4':
    texto: Fomos, pois, sepultados com ele pelo batismo na morte, para que, como Cristo ressuscitou dos
      mortos pela glória do Pai, assim também nós andemos em novidade de vida.
    status: ia-sem-revisao
  '6:5':
    texto: Se fomos unidos a ele por uma morte semelhante à sua, o seremos também por uma ressurreição
      semelhante;
    status: ia-sem-revisao
  '6:6':
    texto: 'sabendo isto: que o nosso velho homem foi crucificado com ele, para que fosse destruído o
      corpo do pecado, a fim de não servirmos mais ao pecado;'
    status: ia-sem-revisao
  '6:7':
    texto: pois quem morreu está justificado do pecado.
    status: ia-sem-revisao
  '6:8':
    texto: Se morremos com Cristo, cremos que também viveremos com ele,
    status: ia-sem-revisao
  '6:9':
    texto: sabendo que Cristo, ressuscitado dos mortos, já não morre; a morte já não tem domínio sobre
      ele.
    status: ia-sem-revisao
  '6:10':
    texto: Pois, ao morrer, morreu para o pecado uma vez por todas; mas, ao viver, vive para Deus.
    status: ia-sem-revisao
  '6:11':
    texto: Assim também vós, considerai-vos mortos para o pecado e vivos para Deus em Cristo Jesus.
    status: ia-sem-revisao
  '6:12':
    texto: Não reine, pois, o pecado no vosso corpo mortal, de modo que obedeçais aos seus desejos,
    status: ia-sem-revisao
  '6:13':
    texto: nem ofereçais os vossos membros ao pecado como armas de injustiça, mas oferecei-vos a Deus
      como vivos dentre os mortos, e os vossos membros a Deus como armas de justiça.
    status: ia-sem-revisao
  '6:14':
    texto: Pois o pecado não dominará sobre vós, porque não estais sob a Lei, mas sob a graça.
    status: ia-sem-revisao
  '6:15':
    texto: Que então? Pecaremos porque não estamos sob a Lei, mas sob a graça? De modo algum!
    status: ia-sem-revisao
  '6:16':
    texto: Não sabeis que, àquele a quem vos ofereceis como escravos para obedecer, sois escravos daquele
      a quem obedeceis, seja do pecado, para a morte, seja da obediência, para a justiça?
    status: ia-sem-revisao
  '6:17':
    texto: Graças a Deus, porque éreis escravos do pecado, mas obedecestes de coração à forma de doutrina
      a que fostes entregues;
    status: ia-sem-revisao
  '6:18':
    texto: libertados do pecado, fostes feitos escravos da justiça.
    status: ia-sem-revisao
  '6:19':
    texto: 'Falo à maneira humana, por causa da fraqueza da vossa carne: como oferecestes os vossos membros
      como escravos à impureza e à iniquidade, para a iniquidade, assim oferecei agora os vossos membros
      como escravos à justiça, para a santificação.'
    status: ia-sem-revisao
  '6:20':
    texto: Pois, quando éreis escravos do pecado, éreis livres em relação à justiça.
    status: ia-sem-revisao
  '6:21':
    texto: Que fruto tínheis então daquelas coisas de que agora vos envergonhais? Pois o fim delas é a
      morte.
    status: ia-sem-revisao
  '6:22':
    texto: Agora, porém, libertados do pecado e feitos servos de Deus, tendes o vosso fruto para a santificação,
      e por fim a vida eterna.
    status: ia-sem-revisao
  '6:23':
    texto: Pois o salário do pecado é a morte, mas o dom gratuito de Deus é a vida eterna em Cristo Jesus,
      nosso Senhor.
    status: ia-sem-revisao
  '7:1':
    texto: Ou ignorais, irmãos — pois falo a quem conhece a Lei —, que a Lei tem domínio sobre o homem
      enquanto ele vive?
    status: ia-sem-revisao
  '7:2':
    texto: A mulher casada está ligada por lei ao marido enquanto ele vive; mas, se o marido morre, fica
      livre da lei do marido.
    status: ia-sem-revisao
  '7:3':
    texto: Assim, enquanto o marido vive, será chamada adúltera se se unir a outro homem; mas, se o marido
      morre, está livre da lei, de modo que não é adúltera se se unir a outro homem.
    status: ia-sem-revisao
  '7:4':
    texto: Assim também vós, meus irmãos, fostes mortos para a Lei pelo corpo de Cristo, para pertencerdes
      a outro, àquele que ressuscitou dos mortos, a fim de darmos fruto para Deus.
    status: ia-sem-revisao
  '7:5':
    texto: Pois, quando estávamos na carne, as paixões dos pecados, suscitadas pela Lei, atuavam nos nossos
      membros para darmos fruto para a morte;
    status: ia-sem-revisao
  '7:6':
    texto: agora, porém, fomos libertados da Lei, mortos para aquilo que nos mantinha prisioneiros, de
      modo que sirvamos na novidade do espírito e não na velhice da letra.
    status: ia-sem-revisao
  '7:7':
    texto: 'Que diremos, então? Que a Lei é pecado? De modo algum! Mas eu não teria conhecido o pecado
      senão pela Lei; pois não conheceria a cobiça se a Lei não dissesse: “Não cobiçarás.”'
    status: ia-sem-revisao
  '7:8':
    texto: Mas o pecado, aproveitando a ocasião, por meio do mandamento produziu em mim toda espécie de
      cobiça; pois, sem a Lei, o pecado está morto.
    status: ia-sem-revisao
  '7:9':
    texto: Eu, outrora, vivia sem a Lei; mas, quando veio o mandamento, o pecado reviveu,
    status: ia-sem-revisao
  '7:10':
    texto: e eu morri; e o mandamento, que era para a vida, mostrou-se-me para a morte.
    status: ia-sem-revisao
  '7:11':
    texto: Pois o pecado, aproveitando a ocasião, por meio do mandamento enganou-me e por ele me matou.
    status: ia-sem-revisao
  '7:12':
    texto: Assim, a Lei é santa, e o mandamento é santo, justo e bom.
    status: ia-sem-revisao
  '7:13':
    texto: Então o que é bom tornou-se para mim morte? De modo algum! Foi o pecado, para se mostrar pecado,
      produzindo em mim a morte por meio do que é bom; para que o pecado se tornasse sobremaneira pecaminoso
      por meio do mandamento.
    status: ia-sem-revisao
  '7:14':
    texto: Sabemos que a Lei é espiritual; eu, porém, sou carnal, vendido ao poder do pecado.
    status: ia-sem-revisao
  '7:15':
    texto: Pois não entendo o que faço; porque não pratico o que quero, mas faço o que odeio.
    status: ia-sem-revisao
  '7:16':
    texto: Ora, se faço o que não quero, concordo com a Lei que ela é boa.
    status: ia-sem-revisao
  '7:17':
    texto: Mas, nesse caso, já não sou eu que faço isso, e sim o pecado que habita em mim.
    status: ia-sem-revisao
  '7:18':
    texto: Sei que em mim, isto é, na minha carne, não habita o bem; pois o querer está ao meu alcance,
      mas o realizar o bem, não.
    status: ia-sem-revisao
  '7:19':
    texto: Pois não faço o bem que quero, mas pratico o mal que não quero.
    status: ia-sem-revisao
  '7:20':
    texto: Se faço o que não quero, já não sou eu que o faço, mas o pecado que habita em mim.
    status: ia-sem-revisao
  '7:21':
    texto: 'Encontro, pois, esta lei: quando quero fazer o bem, o mal está ao meu lado.'
    status: ia-sem-revisao
  '7:22':
    texto: Pois me comprazo na lei de Deus segundo o homem interior,
    status: ia-sem-revisao
  '7:23':
    texto: mas vejo nos meus membros outra lei, que luta contra a lei da minha mente e me torna prisioneiro
      da lei do pecado que está nos meus membros.
    status: ia-sem-revisao
  '7:24':
    texto: Miserável de mim! Quem me libertará deste corpo de morte?
    status: ia-sem-revisao
  '7:25':
    texto: Graças a Deus por Jesus Cristo, nosso Senhor! Assim, eu mesmo, com a mente sirvo à lei de Deus,
      mas com a carne, à lei do pecado.
    partes:
    - Graças a Deus por Jesus Cristo, nosso Senhor!
    - Assim, eu mesmo, com a mente sirvo à lei de Deus, mas com a carne, à lei do pecado.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '8:1':
    texto: Portanto, nenhuma condenação há agora para os que estão em Cristo Jesus.
    status: ia-sem-revisao
  '8:2':
    texto: Pois a lei do Espírito da vida em Cristo Jesus te libertou da lei do pecado e da morte.
    status: ia-sem-revisao
  '8:3':
    texto: 'O que era impossível à Lei, porque enfraquecida pela carne, Deus o fez: enviando o seu próprio
      Filho em semelhança de carne pecadora e por causa do pecado, condenou o pecado na carne,'
    status: ia-sem-revisao
  '8:4':
    texto: a fim de que a justiça exigida pela Lei se cumprisse em nós, que não andamos segundo a carne,
      mas segundo o Espírito.
    status: ia-sem-revisao
  '8:5':
    texto: Pois os que vivem segundo a carne têm os pensamentos da carne; os que vivem segundo o Espírito,
      os do Espírito.
    status: ia-sem-revisao
  '8:6':
    texto: Pois o pensamento da carne é morte, mas o pensamento do Espírito é vida e paz;
    status: ia-sem-revisao
  '8:7':
    texto: 'porque o pensamento da carne é inimizade contra Deus: não se submete à lei de Deus, nem pode
      submeter-se.'
    status: ia-sem-revisao
  '8:8':
    texto: Os que estão na carne não podem agradar a Deus.
    status: ia-sem-revisao
  '8:9':
    texto: Vós, porém, não estais na carne, mas no Espírito, se de fato o Espírito de Deus habita em vós.
      Se alguém não tem o Espírito de Cristo, esse não é dele.
    status: ia-sem-revisao
  '8:10':
    texto: Mas, se Cristo está em vós, o corpo está morto por causa do pecado, mas o espírito é vida por
      causa da justiça.
    status: ia-sem-revisao
  '8:11':
    texto: E, se o Espírito daquele que ressuscitou Jesus dos mortos habita em vós, aquele que ressuscitou
      Cristo Jesus dos mortos dará vida também aos vossos corpos mortais, por meio do seu Espírito que
      habita em vós.
    status: ia-sem-revisao
  '8:12':
    texto: Assim, irmãos, somos devedores, mas não à carne, para vivermos segundo a carne;
    status: ia-sem-revisao
  '8:13':
    texto: pois, se viveis segundo a carne, morrereis; se, pelo Espírito, fazeis morrer as obras do corpo,
      vivereis.
    status: ia-sem-revisao
  '8:14':
    texto: Pois todos os que são conduzidos pelo Espírito de Deus são filhos de Deus.
    status: ia-sem-revisao
  '8:15':
    texto: 'Com efeito, não recebestes um espírito de escravidão para recair no temor, mas recebestes
      um espírito de adoção, no qual clamamos: “Abbá, Pai!”'
    status: ia-sem-revisao
  '8:16':
    texto: O próprio Espírito dá testemunho, com o nosso espírito, de que somos filhos de Deus.
    status: ia-sem-revisao
  '8:17':
    texto: 'E, se filhos, também herdeiros: herdeiros de Deus e co-herdeiros de Cristo, se realmente sofremos
      com ele, para sermos também glorificados com ele.'
    status: ia-sem-revisao
  '8:18':
    texto: Julgo, com efeito, que os sofrimentos do tempo presente não têm proporção com a glória que
      há de se revelar em nós.
    status: ia-sem-revisao
  '8:19':
    texto: Pois a criação aguarda ansiosamente a revelação dos filhos de Deus;
    status: ia-sem-revisao
  '8:20':
    texto: porque a criação foi submetida à vaidade, não por vontade própria, mas por causa daquele que
      a submeteu, na esperança
    status: ia-sem-revisao
  '8:21':
    texto: de que também a própria criação será libertada da escravidão da corrupção para a liberdade
      da glória dos filhos de Deus.
    status: ia-sem-revisao
  '8:22':
    texto: Sabemos que toda a criação, até agora, geme e sofre dores de parto.
    status: ia-sem-revisao
  '8:23':
    texto: E não só ela, mas também nós, que temos as primícias do Espírito, gememos em nós mesmos, aguardando
      a adoção, a redenção do nosso corpo.
    status: ia-sem-revisao
  '8:24':
    texto: Pois fomos salvos na esperança; ora, a esperança que se vê não é esperança; pois o que alguém
      vê, como o espera?
    status: ia-sem-revisao
  '8:25':
    texto: Mas, se esperamos o que não vemos, nós o aguardamos com perseverança.
    status: ia-sem-revisao
  '8:26':
    texto: Do mesmo modo, também o Espírito vem em auxílio da nossa fraqueza; pois não sabemos o que pedir
      como convém, mas o próprio Espírito intercede por nós com gemidos inexprimíveis;
    status: ia-sem-revisao
  '8:27':
    texto: e aquele que sonda os corações sabe qual é o pensamento do Espírito, porque intercede pelos
      santos segundo Deus.
    status: ia-sem-revisao
  '8:28':
    texto: Sabemos que, para os que amam a Deus, tudo concorre para o bem, para os que são chamados segundo
      o seu desígnio.
    status: ia-sem-revisao
  '8:29':
    texto: Pois aqueles que ele de antemão conheceu, também os predestinou a serem conformes à imagem
      do seu Filho, para que ele seja o primogênito entre muitos irmãos;
    status: ia-sem-revisao
  '8:30':
    texto: e aqueles que predestinou, também os chamou; e aqueles que chamou, também os justificou; e
      aqueles que justificou, também os glorificou.
    status: ia-sem-revisao
  '8:31':
    texto: Que diremos, pois, diante disto? Se Deus é por nós, quem será contra nós?
    partes:
    - Que diremos, pois, diante disto?
    - Se Deus é por nós, quem será contra nós?
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '8:32':
    texto: Ele, que não poupou o seu próprio Filho, mas o entregou por todos nós, como não nos dará também
      com ele todas as coisas?
    status: ia-sem-revisao
  '8:33':
    texto: Quem acusará os eleitos de Deus? Deus é quem justifica;
    status: ia-sem-revisao
  '8:34':
    texto: quem condenará? Cristo, que morreu, mais ainda, que ressuscitou, que está à direita de Deus
      e intercede por nós?
    status: ia-sem-revisao
  '8:35':
    texto: Quem nos separará do amor de Cristo? A tribulação, ou a angústia, ou a perseguição, ou a fome,
      ou a nudez, ou o perigo, ou a espada?
    status: ia-sem-revisao
  '8:36':
    texto: 'Como está escrito: “Por tua causa somos postos à morte o dia inteiro, fomos considerados como
      ovelhas para o matadouro.”'
    status: ia-sem-revisao
  '8:37':
    texto: Mas em todas essas coisas somos mais que vencedores, por aquele que nos amou.
    status: ia-sem-revisao
  '8:38':
    texto: Pois estou convencido de que nem a morte, nem a vida, nem anjos, nem principados, nem o presente,
      nem o futuro, nem poderes,
    status: ia-sem-revisao
  '8:39':
    texto: nem a altura, nem a profundidade, nem outra criatura qualquer poderá separar-nos do amor de
      Deus que está em Cristo Jesus, nosso Senhor.
    status: ia-sem-revisao
  '9:1':
    texto: 'Digo a verdade em Cristo, não minto, dando-me testemunho a minha consciência no Espírito Santo:'
    status: ia-sem-revisao
  '9:2':
    texto: Tenho grande tristeza e uma dor incessante no meu coração;
    status: ia-sem-revisao
  '9:3':
    texto: pois eu mesmo desejaria ser anátema, separado de Cristo, em favor dos meus irmãos, meus parentes
      segundo a carne,
    status: ia-sem-revisao
  '9:4':
    texto: que são israelitas, a quem pertencem a adoção, a glória, as alianças, a legislação, o culto
      e as promessas;
    status: ia-sem-revisao
  '9:5':
    texto: a quem pertencem os patriarcas e de quem procede Cristo segundo a carne, ele que está acima
      de tudo, Deus bendito pelos séculos. Amém.
    status: ia-sem-revisao
  '9:6':
    texto: Não que a palavra de Deus tenha falhado. Pois nem todos os que são de Israel são Israel;
    status: ia-sem-revisao
  '9:7':
    texto: 'nem, por serem descendência de Abraão, são todos filhos, mas: “Em Isaac será chamada a tua
      descendência.”'
    status: ia-sem-revisao
  '9:8':
    texto: Isto é, não são os filhos da carne que são filhos de Deus, mas os filhos da promessa são contados
      como descendência.
    status: ia-sem-revisao
  '9:9':
    texto: 'Pois esta é a palavra da promessa: “Por este tempo virei, e Sara terá um filho.”'
    status: ia-sem-revisao
  '9:10':
    texto: E não só isso, mas também Rebeca, que concebeu de um só, Isaac, nosso pai;
    status: ia-sem-revisao
  '9:11':
    texto: pois, antes de nascerem e de terem feito algo de bom ou de mau, para que permanecesse o desígnio
      de Deus, segundo a eleição,
    status: ia-sem-revisao
  '9:12':
    texto: 'não por causa das obras, mas por aquele que chama, foi-lhe dito: “O maior servirá ao menor.”'
    status: ia-sem-revisao
  '9:13':
    texto: 'Como está escrito: “Amei Jacó, mas preteri Esaú.”'
    status: ia-sem-revisao
    observacao: 'Grego: ἐμίσησα (“odiei”), citando Ml 1,2-3. Em hebraico, “odiar” é o oposto de escolher:
      deixar de lado, não eleger. Traduzido pelo sentido (ver Lc 14,26); a forma literal seria “mas odiei
      Esaú”.'
  '9:14':
    texto: Que diremos, pois? Que há injustiça em Deus? De modo algum!
    status: ia-sem-revisao
  '9:15':
    texto: 'Pois diz a Moisés: “Terei misericórdia de quem eu quiser ter misericórdia, e me compadecerei
      de quem eu quiser ter compaixão.”'
    status: ia-sem-revisao
  '9:16':
    texto: Assim, pois, não depende de quem quer nem de quem corre, mas de Deus que tem misericórdia.
    status: ia-sem-revisao
  '9:17':
    texto: 'Pois a Escritura diz ao faraó: “Foi para isto mesmo que te suscitei: para mostrar em ti o
      meu poder e para que o meu nome seja proclamado em toda a terra.”'
    status: ia-sem-revisao
  '9:18':
    texto: Assim, pois, de quem quer tem misericórdia, e a quem quer endurece.
    status: ia-sem-revisao
  '9:19':
    texto: 'Tu me dirás, então: “Por que ainda se queixa? Pois quem resiste à sua vontade?”'
    status: ia-sem-revisao
  '9:20':
    texto: 'Antes, ó homem, quem és tu para replicar a Deus? Dirá a obra ao que a modelou: “Por que me
      fizeste assim?”'
    status: ia-sem-revisao
  '9:21':
    texto: Ou não tem o oleiro poder sobre o barro, para fazer da mesma massa um vaso para uso nobre e
      outro para uso vil?
    status: ia-sem-revisao
  '9:22':
    texto: E se Deus, querendo mostrar a sua ira e dar a conhecer o seu poder, suportou com muita paciência
      vasos de ira, preparados para a perdição,
    status: ia-sem-revisao
  '9:23':
    texto: e para dar a conhecer as riquezas da sua glória em vasos de misericórdia, que de antemão preparou
      para a glória,
    status: ia-sem-revisao
  '9:24':
    texto: isto é, a nós, que também chamou, não só dentre os judeus, mas também dentre as nações? —
    status: ia-sem-revisao
  '9:25':
    texto: 'como diz também em Oseias: “Chamarei meu povo àquele que não era meu povo, e amada à que não
      era amada;'
    status: ia-sem-revisao
  '9:26':
    texto: 'e acontecerá que, no lugar onde lhes foi dito: Vós não sois meu povo, ali serão chamados filhos
      do Deus vivo.”'
    status: ia-sem-revisao
  '9:27':
    texto: 'E Isaías clama a respeito de Israel: “Ainda que o número dos filhos de Israel seja como a
      areia do mar, só o resto será salvo;'
    status: ia-sem-revisao
  '9:28':
    texto: pois o Senhor executará a sua palavra sobre a terra, plena e rapidamente.”
    status: ia-sem-revisao
  '9:29':
    texto: 'E como Isaías predisse: “Se o Senhor dos Exércitos não nos tivesse deixado descendência, nos
      teríamos tornado como Sodoma e seríamos semelhantes a Gomorra.”'
    status: ia-sem-revisao
  '9:30':
    texto: Que diremos, pois? Que as nações, que não buscavam a justiça, alcançaram a justiça, a justiça
      que vem da fé;
    status: ia-sem-revisao
  '9:31':
    texto: mas Israel, que buscava uma lei de justiça, não chegou a essa lei.
    status: ia-sem-revisao
  '9:32':
    texto: Por quê? Porque não a buscou pela fé, mas como se fosse pelas obras; tropeçaram na pedra de
      tropeço,
    status: ia-sem-revisao
  '9:33':
    texto: 'como está escrito: “Eis que ponho em Sião uma pedra de tropeço e uma rocha de escândalo, e
      quem nela crê não será confundido.”'
    status: ia-sem-revisao
  '10:1':
    texto: Irmãos, o desejo do meu coração e a minha oração a Deus a favor deles é para a salvação.
    status: ia-sem-revisao
  '10:2':
    texto: Pois dou testemunho a seu favor de que têm zelo por Deus, mas não segundo o conhecimento;
    status: ia-sem-revisao
  '10:3':
    texto: pois, desconhecendo a justiça de Deus e procurando estabelecer a sua própria, não se submeteram
      à justiça de Deus;
    status: ia-sem-revisao
  '10:4':
    texto: pois o fim da Lei é Cristo, para a justiça de todo aquele que crê.
    status: ia-sem-revisao
  '10:5':
    texto: 'Moisés escreve a respeito da justiça que vem da Lei: “O homem que a praticar viverá por ela.”'
    status: ia-sem-revisao
  '10:6':
    texto: 'Mas a justiça que vem da fé diz assim: “Não digas no teu coração: Quem subirá ao céu?” Isto
      é, para fazer Cristo descer;'
    status: ia-sem-revisao
  '10:7':
    texto: 'ou: “Quem descerá ao abismo?” Isto é, para fazer Cristo subir dentre os mortos.'
    status: ia-sem-revisao
  '10:8':
    texto: Mas que diz? “Perto de ti está a palavra, na tua boca e no teu coração”; isto é, a palavra
      da fé que pregamos.
    status: ia-sem-revisao
  '10:9':
    texto: Pois, se confessares com a tua boca que Jesus é Senhor, e creres no teu coração que Deus o
      ressuscitou dos mortos, serás salvo;
    status: ia-sem-revisao
  '10:10':
    texto: pois com o coração se crê para a justiça, e com a boca se confessa para a salvação.
    status: ia-sem-revisao
  '10:11':
    texto: 'Pois a Escritura diz: “Todo aquele que nele crê não será confundido.”'
    status: ia-sem-revisao
  '10:12':
    texto: Não há distinção entre judeu e grego, pois o mesmo é o Senhor de todos, rico para com todos
      os que o invocam;
    status: ia-sem-revisao
  '10:13':
    texto: pois “todo aquele que invocar o nome do Senhor será salvo”.
    status: ia-sem-revisao
  '10:14':
    texto: Como invocarão aquele em quem não creram? Como crerão naquele de quem não ouviram falar? Como
      ouvirão sem alguém que pregue?
    status: ia-sem-revisao
  '10:15':
    texto: 'Como pregarão se não forem enviados? Como está escrito: “Quão belos os pés dos que anunciam
      boas-novas!”'
    status: ia-sem-revisao
  '10:16':
    texto: 'Mas nem todos obedeceram ao Evangelho; pois Isaías diz: “Senhor, quem creu em nossa pregação?”'
    status: ia-sem-revisao
  '10:17':
    texto: Assim, a fé vem da pregação, e a pregação, pela palavra de Cristo.
    status: ia-sem-revisao
  '10:18':
    texto: 'Mas pergunto: não ouviram? Pelo contrário: “Por toda a terra se espalhou a sua voz, e até
      os confins do mundo as suas palavras.”'
    status: ia-sem-revisao
  '10:19':
    texto: 'Mas pergunto: Israel não entendeu? Primeiro Moisés diz: “Eu vos provocarei ciúme com o que
      não é nação, com uma nação insensata vos provocarei ira.”'
    status: ia-sem-revisao
  '10:20':
    texto: 'E Isaías ousa dizer: “Fui encontrado pelos que não me buscavam, manifestei-me aos que não
      perguntavam por mim.”'
    status: ia-sem-revisao
  '10:21':
    texto: 'Mas a respeito de Israel diz: “Todo o dia estendi as minhas mãos a um povo desobediente e
      rebelde.”'
    status: ia-sem-revisao
  '11:1':
    texto: 'Pergunto, então: Deus rejeitou o seu povo? De modo algum! Pois eu também sou israelita, da
      descendência de Abraão, da tribo de Benjamim.'
    status: ia-sem-revisao
  '11:2':
    texto: Deus não rejeitou o seu povo, que de antemão conheceu. Ou não sabeis o que diz a Escritura
      sobre Elias, como ele intercede junto a Deus contra Israel?
    status: ia-sem-revisao
  '11:3':
    texto: “Senhor, mataram os teus profetas, derrubaram os teus altares; fiquei só eu, e procuram tirar-me
      a vida.”
    status: ia-sem-revisao
  '11:4':
    texto: Mas que lhe diz a resposta divina? “Reservei para mim sete mil homens que não dobraram o joelho
      diante de Baal.”
    status: ia-sem-revisao
  '11:5':
    texto: Assim também no tempo presente há um resto, segundo a eleição da graça;
    status: ia-sem-revisao
  '11:6':
    texto: e, se é por graça, já não é pelas obras, pois então a graça já não seria graça.
    status: ia-sem-revisao
  '11:7':
    texto: Que então? O que Israel procura, isso não alcançou; mas a eleição o alcançou; os demais foram
      endurecidos,
    status: ia-sem-revisao
  '11:8':
    texto: 'como está escrito: “Deus lhes deu um espírito de torpor, olhos para não ver e ouvidos para
      não ouvir, até o dia de hoje.”'
    status: ia-sem-revisao
  '11:9':
    texto: 'E Davi diz: “Torne-se a sua mesa um laço, uma armadilha, uma pedra de tropeço e uma retribuição
      para eles;'
    status: ia-sem-revisao
  '11:10':
    texto: escureçam os seus olhos para que não vejam, e curva-lhes sempre o dorso.”
    status: ia-sem-revisao
  '11:11':
    texto: 'Pergunto, então: tropeçaram para cair? De modo algum! Mas pela sua queda veio a salvação aos
      gentios, para lhes provocar ciúme.'
    status: ia-sem-revisao
  '11:12':
    texto: Se a sua queda é riqueza para o mundo e o seu diminuir é riqueza para os gentios, quanto mais
      a sua plenitude!
    status: ia-sem-revisao
  '11:13':
    texto: 'Digo isto a vós, gentios: enquanto sou apóstolo dos gentios, glorifico o meu ministério,'
    status: ia-sem-revisao
  '11:14':
    texto: para ver se provoco ciúme aos da minha carne e salvo alguns deles.
    status: ia-sem-revisao
  '11:15':
    texto: Pois, se a sua rejeição é reconciliação do mundo, que será a sua admissão, senão vida dentre
      os mortos?
    status: ia-sem-revisao
  '11:16':
    texto: Se as primícias são santas, também a massa; e, se a raiz é santa, também os ramos.
    status: ia-sem-revisao
  '11:17':
    texto: Se alguns dos ramos foram cortados, e tu, sendo oliveira brava, foste enxertado entre eles
      e te tornaste participante da raiz e da seiva da oliveira,
    status: ia-sem-revisao
  '11:18':
    texto: não te glories contra os ramos; e, se te glorias, não és tu que sustentas a raiz, mas a raiz
      a ti.
    status: ia-sem-revisao
  '11:19':
    texto: 'Dirás, então: “Ramos foram cortados para que eu fosse enxertado.”'
    status: ia-sem-revisao
  '11:20':
    texto: Bem; foram cortados por incredulidade, e tu estás firme pela fé. Não te ensoberbeças, mas teme;
    status: ia-sem-revisao
  '11:21':
    texto: pois, se Deus não poupou os ramos naturais, também não te poupará a ti.
    status: ia-sem-revisao
  '11:22':
    texto: 'Considera, pois, a bondade e a severidade de Deus: severidade para com os que caíram, mas
      bondade de Deus para contigo, se permaneceres nessa bondade; caso contrário, também tu serás cortado.'
    status: ia-sem-revisao
  '11:23':
    texto: Também aqueles, se não permanecerem na incredulidade, serão enxertados; pois Deus é capaz de
      os enxertar de novo.
    status: ia-sem-revisao
  '11:24':
    texto: Pois, se tu foste cortado da oliveira brava, natural, e contra a natureza enxertado em oliveira
      boa, quanto mais estes, que são ramos naturais, serão enxertados na sua própria oliveira.
    status: ia-sem-revisao
  '11:25':
    texto: 'Pois não quero, irmãos, que ignoreis este mistério, para não vos julgardes sábios: o endurecimento
      atingiu uma parte de Israel até que entre a plenitude das nações,'
    status: ia-sem-revisao
  '11:26':
    texto: 'e assim todo Israel será salvo, como está escrito: “Virá de Sião o libertador, afastará de
      Jacó as impiedades;'
    status: ia-sem-revisao
  '11:27':
    texto: e esta será a minha aliança com eles, quando eu tirar os seus pecados.”
    status: ia-sem-revisao
  '11:28':
    texto: Quanto ao Evangelho, são inimigos por causa de vós; quanto à eleição, são amados por causa
      dos patriarcas;
    status: ia-sem-revisao
  '11:29':
    texto: pois os dons e o chamamento de Deus são irrevogáveis.
    status: ia-sem-revisao
  '11:30':
    texto: Assim como vós outrora fostes desobedientes a Deus, mas agora alcançastes misericórdia por
      causa da desobediência deles,
    status: ia-sem-revisao
  '11:31':
    texto: assim também eles agora foram desobedientes, por causa da misericórdia que vos foi feita, para
      que também eles agora alcancem misericórdia;
    status: ia-sem-revisao
  '11:32':
    texto: pois Deus encerrou todos na desobediência, para ter misericórdia de todos.
    status: ia-sem-revisao
  '11:33':
    texto: Ó profundidade da riqueza, da sabedoria e do conhecimento de Deus! Como são insondáveis os
      seus juízos e inescrutáveis os seus caminhos!
    status: ia-sem-revisao
  '11:34':
    texto: Pois quem conheceu o pensamento do Senhor? Ou quem foi seu conselheiro?
    status: ia-sem-revisao
  '11:35':
    texto: Ou quem lhe deu primeiro, para que lhe seja retribuído?
    status: ia-sem-revisao
  '11:36':
    texto: 'Porque dele, por ele e para ele são todas as coisas: a ele a glória pelos séculos. Amém.'
    status: ia-sem-revisao
  '12:1':
    texto: 'Exorto-vos, pois, irmãos, pelas misericórdias de Deus, a oferecer os vossos corpos como sacrifício
      vivo, santo, agradável a Deus: este é o vosso culto espiritual.'
    status: ia-sem-revisao
  '12:2':
    texto: E não vos conformeis a este mundo, mas transformai-vos pela renovação da mente, para discernirdes
      qual é a vontade de Deus, o que é bom, agradável e perfeito.
    status: ia-sem-revisao
  '12:3':
    texto: Pela graça que me foi dada, digo a cada um dentre vós que não tenha de si mesmo um conceito
      mais elevado do que convém, mas que pense com sensatez, segundo a medida de fé que Deus repartiu
      a cada um.
    status: ia-sem-revisao
  '12:4':
    texto: Pois, como em um só corpo temos muitos membros, e todos os membros não têm a mesma função,
    status: ia-sem-revisao
  '12:5':
    texto: assim nós, que somos muitos, somos um só corpo em Cristo, e cada um é membro dos outros.
    status: ia-sem-revisao
  '12:6':
    texto: 'Temos dons diferentes, segundo a graça que nos foi dada: se é a profecia, seja segundo a medida
      da fé;'
    status: ia-sem-revisao
  '12:7':
    texto: se é o serviço, no serviço; o que ensina, no ensino;
    status: ia-sem-revisao
  '12:8':
    texto: o que exorta, na exortação; o que reparte, com simplicidade; o que preside, com zelo; o que
      pratica a misericórdia, com alegria.
    status: ia-sem-revisao
  '12:9':
    texto: O amor seja sem fingimento. Detestai o mal, apegai-vos ao bem;
    status: ia-sem-revisao
  '12:10':
    texto: amai-vos cordialmente uns aos outros com amor fraterno, adiantai-vos em honrar-vos mutuamente;
    status: ia-sem-revisao
  '12:11':
    texto: não sejais negligentes no zelo, sede fervorosos no espírito, servindo ao Senhor;
    status: ia-sem-revisao
  '12:12':
    texto: alegrai-vos na esperança, sede pacientes na tribulação, perseverai na oração;
    status: ia-sem-revisao
  '12:13':
    texto: socorrei as necessidades dos santos, praticai a hospitalidade.
    status: ia-sem-revisao
  '12:14':
    texto: Abençoai os que vos perseguem; abençoai e não amaldiçoeis.
    status: ia-sem-revisao
  '12:15':
    texto: Alegrai-vos com os que se alegram, chorai com os que choram.
    status: ia-sem-revisao
  '12:16':
    texto: Tende o mesmo sentimento uns para com os outros; não alimenteis pensamentos altivos, mas deixai-vos
      levar pelas coisas humildes. Não vos considereis sábios.
    partes:
    - Tende o mesmo sentimento uns para com os outros; não alimenteis pensamentos altivos, mas deixai-vos
      levar pelas coisas humildes.
    - Não vos considereis sábios.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '12:17':
    texto: A ninguém pagueis mal com mal; procurai o bem diante de todos os homens;
    status: ia-sem-revisao
  '12:18':
    texto: se possível, quanto depender de vós, vivei em paz com todos os homens;
    status: ia-sem-revisao
  '12:19':
    texto: 'não vos vingueis a vós mesmos, amados, mas deixai lugar à ira, pois está escrito: “A mim a
      vingança; eu retribuirei, diz o Senhor.”'
    status: ia-sem-revisao
  '12:20':
    texto: Pelo contrário, se o teu inimigo tiver fome, dá-lhe de comer; se tiver sede, dá-lhe de beber;
      pois, fazendo isto, amontoarás brasas sobre a sua cabeça.
    status: ia-sem-revisao
  '12:21':
    texto: Não te deixes vencer pelo mal, mas vence o mal com o bem.
    status: ia-sem-revisao
  '13:1':
    texto: Toda pessoa esteja submetida às autoridades superiores, pois não há autoridade que não venha
      de Deus, e as que existem foram estabelecidas por Deus.
    status: ia-sem-revisao
  '13:2':
    texto: De modo que quem resiste à autoridade opõe-se à ordem estabelecida por Deus, e os que se opõem
      trarão sobre si a condenação.
    status: ia-sem-revisao
  '13:3':
    texto: Pois os governantes não são motivo de temor para a boa conduta, mas para a má. Queres não temer
      a autoridade? Pratica o bem e dela receberás louvor;
    status: ia-sem-revisao
  '13:4':
    texto: pois é ministro de Deus para o teu bem. Mas, se praticas o mal, teme; pois não é em vão que
      traz a espada; é ministro de Deus, vingador para castigar o que pratica o mal.
    status: ia-sem-revisao
  '13:5':
    texto: Por isso é necessário submeter-se, não só por causa da ira, mas também por dever de consciência.
    status: ia-sem-revisao
  '13:6':
    texto: Por isso também pagais tributos, pois são ministros de Deus, dedicados a este mesmo serviço.
    status: ia-sem-revisao
  '13:7':
    texto: 'Pagai a todos o que lhes é devido: a quem o tributo, o tributo; a quem o imposto, o imposto;
      a quem o temor, o temor; a quem a honra, a honra.'
    status: ia-sem-revisao
  '13:8':
    texto: A ninguém devais coisa alguma, a não ser o amor mútuo; pois quem ama o próximo cumpriu a Lei.
    status: ia-sem-revisao
  '13:9':
    texto: 'Com efeito, “Não cometerás adultério”, “Não matarás”, “Não roubarás”, “Não cobiçarás”, e qualquer
      outro mandamento, resumem-se nesta palavra: “Amarás o teu próximo como a ti mesmo.”'
    status: ia-sem-revisao
  '13:10':
    texto: O amor não faz mal ao próximo; portanto, o amor é o cumprimento da Lei.
    status: ia-sem-revisao
  '13:11':
    texto: 'E isto, conhecendo o tempo: já é hora de despertardes do sono, pois agora a salvação está
      mais próxima de nós do que quando abraçamos a fé.'
    status: ia-sem-revisao
  '13:12':
    texto: A noite avançou, o dia está próximo. Deixemos, pois, as obras das trevas e revistamo-nos das
      armas da luz.
    status: ia-sem-revisao
  '13:13':
    texto: 'Andemos decentemente, como em pleno dia: não em orgias e bebedeiras, não em devassidão e libertinagem,
      não em rixas e ciúmes;'
    status: ia-sem-revisao
  '13:14':
    texto: mas revesti-vos do Senhor Jesus Cristo, e não cuideis da carne para satisfazer os seus desejos.
    status: ia-sem-revisao
  '14:1':
    texto: Acolhei o que é fraco na fé, sem discutir opiniões.
    status: ia-sem-revisao
  '14:2':
    texto: Um crê que pode comer de tudo; o fraco come legumes.
    status: ia-sem-revisao
  '14:3':
    texto: Quem come não despreze quem não come, e quem não come não julgue quem come, pois Deus o acolheu.
    status: ia-sem-revisao
  '14:4':
    texto: Quem és tu para julgar o servo alheio? Ele está de pé ou cai diante do seu próprio senhor;
      e ficará de pé, pois o Senhor tem poder para o sustentar.
    status: ia-sem-revisao
  '14:5':
    texto: Um julga um dia superior a outro; outro julga iguais todos os dias. Cada um tenha plena convicção
      em sua própria mente.
    status: ia-sem-revisao
  '14:6':
    texto: Quem observa o dia, observa-o para o Senhor. Quem come, come para o Senhor, pois dá graças
      a Deus; e quem não come, não come para o Senhor, e dá graças a Deus.
    status: ia-sem-revisao
  '14:7':
    texto: Pois nenhum de nós vive para si mesmo, e ninguém morre para si mesmo;
    status: ia-sem-revisao
  '14:8':
    texto: se vivemos, vivemos para o Senhor; se morremos, morremos para o Senhor. Quer vivamos, quer
      morramos, pertencemos ao Senhor.
    status: ia-sem-revisao
  '14:9':
    texto: 'Para isto Cristo morreu e viveu: para ser Senhor dos mortos e dos vivos.'
    status: ia-sem-revisao
  '14:10':
    texto: Tu, por que julgas o teu irmão? Ou tu, por que desprezas o teu irmão? Pois todos compareceremos
      diante do tribunal de Deus,
    status: ia-sem-revisao
  '14:11':
    texto: 'pois está escrito: “Eu vivo, diz o Senhor: diante de mim se dobrará todo joelho, e toda língua
      dará glória a Deus.”'
    status: ia-sem-revisao
  '14:12':
    texto: Assim, cada um de nós dará contas de si mesmo a Deus.
    status: ia-sem-revisao
  '14:13':
    texto: 'Não nos julguemos mais uns aos outros; antes, decidi isto: não pôr obstáculo ou escândalo
      diante do irmão.'
    status: ia-sem-revisao
  '14:14':
    texto: Sei e estou convencido no Senhor Jesus de que nada é impuro em si mesmo; mas, para quem considera
      algo impuro, para esse é impuro.
    status: ia-sem-revisao
  '14:15':
    texto: Se por causa de um alimento teu irmão se entristece, já não andas segundo o amor. Não faças
      perecer, com o teu alimento, aquele por quem Cristo morreu.
    status: ia-sem-revisao
  '14:16':
    texto: Não seja, pois, difamado o bem que possuís.
    status: ia-sem-revisao
  '14:17':
    texto: Pois o Reino de Deus não é comida e bebida, mas justiça, paz e alegria no Espírito Santo;
    status: ia-sem-revisao
  '14:18':
    texto: quem assim serve a Cristo é agradável a Deus e aprovado pelos homens.
    status: ia-sem-revisao
  '14:19':
    texto: Procuremos, pois, o que contribui para a paz e para a edificação mútua.
    status: ia-sem-revisao
  '14:20':
    texto: Não destruas a obra de Deus por causa de um alimento. Tudo é puro, mas é mau para o homem que
      come causando tropeço.
    status: ia-sem-revisao
  '14:21':
    texto: É bom não comer carne, nem beber vinho, nem fazer algo em que o teu irmão tropece, ou se escandalize,
      ou se enfraqueça;
    status: ia-sem-revisao
  '14:22':
    texto: a fé que tens, guarda-a para ti diante de Deus. Bem-aventurado quem não se condena naquilo
      que aprova.
    status: ia-sem-revisao
  '14:23':
    texto: Mas quem duvida e come está condenado, porque não age por fé; e tudo o que não procede da fé
      é pecado.
    status: ia-sem-revisao
  '15:1':
    texto: Nós, os fortes, devemos suportar as fraquezas dos fracos e não buscar o nosso próprio agrado.
    status: ia-sem-revisao
  '15:2':
    texto: Cada um de nós procure agradar ao próximo, para o bem, em vista da edificação;
    status: ia-sem-revisao
  '15:3':
    texto: 'pois também Cristo não buscou o seu próprio agrado; mas, como está escrito: “Os insultos dos
      que te insultam caíram sobre mim.”'
    status: ia-sem-revisao
  '15:4':
    texto: Pois tudo o que foi escrito anteriormente foi escrito para nossa instrução, para que, pela
      perseverança e pela consolação das Escrituras, tenhamos esperança.
    status: ia-sem-revisao
  '15:5':
    texto: O Deus da perseverança e da consolação vos conceda ter o mesmo sentimento uns para com os outros,
      segundo Cristo Jesus,
    status: ia-sem-revisao
  '15:6':
    texto: para que, unânimes, a uma só voz, glorifiqueis o Deus e Pai de nosso Senhor Jesus Cristo.
    status: ia-sem-revisao
  '15:7':
    texto: Por isso, acolhei-vos uns aos outros, como também Cristo vos acolheu, para a glória de Deus.
    status: ia-sem-revisao
  '15:8':
    texto: Digo, com efeito, que Cristo se fez servidor dos circuncisos, em favor da veracidade de Deus,
      para confirmar as promessas feitas aos pais,
    status: ia-sem-revisao
  '15:9':
    texto: 'e para que as nações glorifiquem a Deus pela misericórdia, como está escrito: “Por isso te
      louvarei entre as nações, e cantarei ao teu nome.”'
    status: ia-sem-revisao
  '15:10':
    texto: 'E diz ainda: “Alegrai-vos, nações, com o seu povo.”'
    status: ia-sem-revisao
  '15:11':
    texto: 'E ainda: “Louvai o Senhor, todas as nações, e celebrem-no todos os povos.”'
    status: ia-sem-revisao
  '15:12':
    texto: 'E ainda Isaías diz: “Surgirá a raiz de Jessé, aquele que se levanta para governar as nações;
      nele as nações esperarão.”'
    status: ia-sem-revisao
  '15:13':
    texto: O Deus da esperança vos encha de toda a alegria e paz na fé, para que abundeis na esperança,
      pelo poder do Espírito Santo.
    status: ia-sem-revisao
  '15:14':
    texto: Estou persuadido, meus irmãos, eu mesmo a vosso respeito, de que também vós estais cheios de
      bondade, repletos de todo conhecimento, capazes de vos advertir uns aos outros.
    status: ia-sem-revisao
  '15:15':
    texto: Escrevi-vos, em parte, com mais ousadia, como que para vos recordar, por causa da graça que
      me foi dada por Deus,
    status: ia-sem-revisao
  '15:16':
    texto: para ser ministro de Cristo Jesus junto às nações, exercendo o ofício sagrado do Evangelho
      de Deus, para que a oferta das nações seja agradável, santificada no Espírito Santo.
    status: ia-sem-revisao
  '15:17':
    texto: Tenho, pois, em Cristo Jesus, de que me gloriar nas coisas que se referem a Deus;
    status: ia-sem-revisao
  '15:18':
    texto: pois não ousarei falar de nada que Cristo não tenha realizado por meu intermédio para a obediência
      das nações, por palavra e por obra,
    status: ia-sem-revisao
  '15:19':
    texto: com o poder de sinais e prodígios, com o poder do Espírito; de modo que, desde Jerusalém e
      arredores até a Ilíria, levei à plenitude o Evangelho de Cristo,
    status: ia-sem-revisao
  '15:20':
    texto: esforçando-me assim por anunciar o Evangelho onde Cristo ainda não fora nomeado, para não edificar
      sobre alicerce alheio,
    status: ia-sem-revisao
  '15:21':
    texto: 'mas, como está escrito: “Aqueles a quem não foi anunciado a seu respeito verão, e os que não
      ouviram compreenderão.”'
    status: ia-sem-revisao
  '15:22':
    texto: Por isso fui muitas vezes impedido de ir ter convosco;
    status: ia-sem-revisao
  '15:23':
    texto: agora, porém, não tendo mais campo de ação nestas regiões, e desejando há muitos anos ir ter
      convosco,
    status: ia-sem-revisao
  '15:24':
    texto: quando for para a Espanha, espero ver-vos de passagem e ser por vós encaminhado para lá, depois
      de ter gozado um pouco da vossa companhia —
    status: ia-sem-revisao
  '15:25':
    texto: agora, porém, vou a Jerusalém, a serviço dos santos.
    status: ia-sem-revisao
  '15:26':
    texto: Pois a Macedônia e a Acaia houveram por bem fazer uma coleta em favor dos pobres entre os santos
      que estão em Jerusalém.
    status: ia-sem-revisao
  '15:27':
    texto: Houveram por bem, e são devedores deles; pois, se as nações participaram dos seus bens espirituais,
      devem também servi-los nos bens materiais.
    status: ia-sem-revisao
  '15:28':
    texto: Cumprido isto, e entregue a eles este fruto, partirei por vós para a Espanha;
    status: ia-sem-revisao
  '15:29':
    texto: e sei que, ao ir ter convosco, irei na plenitude da bênção de Cristo.
    status: ia-sem-revisao
  '15:30':
    texto: Peço-vos, irmãos, por nosso Senhor Jesus Cristo e pelo amor do Espírito, que luteis comigo
      nas orações a Deus por mim,
    status: ia-sem-revisao
  '15:31':
    texto: para que eu seja livrado dos descrentes na Judeia e o meu serviço a Jerusalém seja bem recebido
      pelos santos,
    status: ia-sem-revisao
  '15:32':
    texto: para que, chegando a vós com alegria, pela vontade de Deus, eu descanse junto a vós.
    status: ia-sem-revisao
  '15:33':
    texto: O Deus da paz esteja com todos vós. Amém.
    status: ia-sem-revisao
  '16:1':
    texto: Recomendo-vos Febe, nossa irmã, que é também diaconisa da Igreja de Cencreia,
    status: ia-sem-revisao
  '16:2':
    texto: para que a acolhais no Senhor, de modo digno dos santos, e a assistais em tudo o que ela precisar
      de vós; pois ela mesma foi protetora de muitos e de mim mesmo.
    status: ia-sem-revisao
  '16:3':
    texto: Saudai Prisca e Áquila, meus colaboradores em Cristo Jesus,
    status: ia-sem-revisao
  '16:4':
    texto: que por minha vida expuseram o seu próprio pescoço, aos quais não só eu agradeço, mas também
      todas as Igrejas das nações;
    status: ia-sem-revisao
  '16:5':
    texto: saudai também a Igreja que se reúne em sua casa. Saudai Epêneto, meu amado, que é as primícias
      da Ásia para Cristo.
    status: ia-sem-revisao
  '16:6':
    texto: Saudai Maria, que muito trabalhou por vós.
    status: ia-sem-revisao
  '16:7':
    texto: Saudai Andrônico e Júnia, meus parentes e companheiros de prisão, notáveis entre os apóstolos,
      que estiveram em Cristo antes de mim.
    status: ia-sem-revisao
  '16:8':
    texto: Saudai Amplíato, meu amado no Senhor.
    status: ia-sem-revisao
  '16:9':
    texto: Saudai Urbano, nosso colaborador em Cristo, e Estáquis, meu amado.
    status: ia-sem-revisao
  '16:10':
    texto: Saudai Apeles, aprovado em Cristo. Saudai os da casa de Aristóbulo.
    status: ia-sem-revisao
  '16:11':
    texto: Saudai Herodião, meu parente. Saudai os da casa de Narciso que estão no Senhor.
    status: ia-sem-revisao
  '16:12':
    texto: Saudai Trifena e Trifosa, que trabalham no Senhor. Saudai a amada Pérside, que muito trabalhou
      no Senhor.
    status: ia-sem-revisao
  '16:13':
    texto: Saudai Rufo, eleito no Senhor, e a mãe dele, que é também minha.
    status: ia-sem-revisao
  '16:14':
    texto: Saudai Asíncrito, Flegonte, Hermes, Pátrobas, Hermas e os irmãos que estão com eles.
    status: ia-sem-revisao
  '16:15':
    texto: Saudai Filólogo e Júlia, Nereu e sua irmã, e Olimpas, e todos os santos que estão com eles.
    status: ia-sem-revisao
  '16:16':
    texto: Saudai-vos uns aos outros com um beijo santo. Todas as Igrejas de Cristo vos saúdam.
    status: ia-sem-revisao
  '16:17':
    texto: Peço-vos, irmãos, que vigieis aqueles que provocam divisões e escândalos contra a doutrina
      que aprendestes, e afastai-vos deles;
    status: ia-sem-revisao
  '16:18':
    texto: pois tais pessoas não servem a nosso Senhor Cristo, mas ao próprio ventre, e com palavras suaves
      e lisonjeiras seduzem os corações dos incautos.
    status: ia-sem-revisao
  '16:19':
    texto: A vossa obediência é conhecida de todos; alegro-me, pois, por vossa causa, e quero que sejais
      sábios para o bem e inocentes para o mal.
    status: ia-sem-revisao
  '16:20':
    texto: O Deus da paz esmagará em breve Satanás debaixo dos vossos pés. A graça de nosso Senhor Jesus
      esteja convosco.
    status: ia-sem-revisao
  '16:21':
    texto: Saúda-vos Timóteo, meu colaborador, e Lúcio, Jasão e Sosípatro, meus parentes.
    status: ia-sem-revisao
  '16:22':
    texto: Eu, Tércio, que escrevi esta carta, saúdo-vos no Senhor.
    status: ia-sem-revisao
  '16:23':
    texto: Saúda-vos Gaio, que me hospeda a mim e a toda a Igreja. Saúdam-vos Erasto, tesoureiro da cidade,
      e o irmão Quarto.
    status: ia-sem-revisao
  '16:24':
    texto: A graça de nosso Senhor Jesus Cristo esteja com todos vós. Amém.
    status: ia-sem-revisao
  '16:25':
    texto: Àquele que tem poder de vos confirmar segundo o meu Evangelho e a pregação de Jesus Cristo,
      segundo a revelação do mistério guardado em silêncio durante tempos eternos,
    status: ia-sem-revisao
    observacao: Rm 16,25-27 não consta do SBLGNT; o texto-base aqui é o Nestle 1904 (domínio público).
      Ver docs/TRADUCAO.md.
  '16:26':
    texto: mas agora manifestado e, por meio de escritos proféticos, segundo o mandato do Deus eterno,
      dado a conhecer a todas as nações para a obediência da fé,
    status: ia-sem-revisao
  '16:27':
    texto: ao único Deus sábio, por meio de Jesus Cristo, a quem seja a glória pelos séculos dos séculos.
      Amém.
    status: ia-sem-revisao
