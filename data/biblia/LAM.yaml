livro: LAM
fonte: oshb
versiculos:
  '2:2':
    texto: O Senhor devorou sem compaixão todas as moradas de Jacó; derrubou na sua ira as fortalezas
      da filha de Judá, lançou por terra, profanou o reino e os seus príncipes.
    status: ia-sem-revisao
  '2:10':
    texto: Sentam-se por terra, em silêncio, os anciãos da filha de Sião; lançaram pó sobre a cabeça,
      cingiram-se de saco; as virgens de Jerusalém curvam a cabeça até o chão.
    status: ia-sem-revisao
  '2:11':
    texto: Os meus olhos se consomem em lágrimas, as minhas entranhas se agitam, o meu fígado se derrama
      por terra, pela ruína da filha do meu povo, porque desfalecem o menino e o lactente nas praças da
      cidade.
    status: ia-sem-revisao
  '2:12':
    texto: 'Dizem às suas mães: “Onde há trigo e vinho?”, enquanto desfalecem como feridos nas praças
      da cidade, enquanto a sua vida se derrama no colo de suas mães.'
    status: ia-sem-revisao
  '2:13':
    texto: 'Que testemunho te darei? A quem te compararei, filha de Jerusalém? A quem te igualarei para
      te consolar, virgem filha de Sião? Pois grande como o mar é a tua ruína: quem te curará?'
    status: ia-sem-revisao
  '2:14':
    texto: Os teus profetas viram para ti visões vãs e insípidas e não revelaram a tua iniquidade para
      restaurar a tua sorte; viram para ti oráculos vãos e enganosos.
    status: ia-sem-revisao
  '2:18':
    texto: 'O coração deles clamou ao Senhor: Muralha da filha de Sião, deixa correr as lágrimas como
      uma torrente, de dia e de noite; não te dês descanso, não se cale a menina dos teus olhos.'
    status: ia-sem-revisao
  '2:19':
    texto: Levanta-te, grita de noite, no início das vigílias; derrama como água o teu coração diante
      da face do Senhor; levanta a ele as tuas mãos pela vida dos teus pequeninos, que desfalecem de fome
      nas esquinas de todas as ruas.
    status: ia-sem-revisao
  '3:17':
    texto: Foi afastada da paz a minha alma; esqueci o que é bom.
    status: ia-sem-revisao
  '3:18':
    texto: 'E disse: “Pereceu a minha força e a minha esperança no Senhor.”'
    status: ia-sem-revisao
  '3:19':
    texto: Lembra-te da minha aflição e do meu abandono, do absinto e do fel.
    status: ia-sem-revisao
  '3:20':
    texto: Certamente a minha alma se lembra e se abate dentro de mim.
    status: ia-sem-revisao
  '3:21':
    texto: 'Isto trarei ao meu coração, e por isso esperarei:'
    status: ia-sem-revisao
  '3:22':
    texto: as bondades do Senhor não se acabaram, as suas misericórdias não têm fim;
    status: ia-sem-revisao
  '3:23':
    texto: renovam-se cada manhã; grande é a tua fidelidade.
    status: ia-sem-revisao
  '3:24':
    texto: O Senhor é a minha porção, diz a minha alma; por isso esperarei nele.
    status: ia-sem-revisao
  '3:25':
    texto: Bom é o Senhor para os que nele esperam, para a alma que o procura.
    status: ia-sem-revisao
  '3:26':
    texto: É bom esperar em silêncio a salvação do Senhor.
    status: ia-sem-revisao
