livro: 1SA
fonte: oshb
versiculos:
  '1:1':
    texto: Havia um homem de Ramataim-Sofim, da montanha de Efraim, cujo nome era Elcana, filho de Jeroam,
      filho de Eliú, filho de Toú, filho de Suf, efraimita.
    status: ia-sem-revisao
  '1:2':
    texto: 'Ele tinha duas mulheres: o nome de uma era Ana, e o nome da outra, Fenena. Fenena tinha filhos,
      mas Ana não tinha filhos.'
    status: ia-sem-revisao
  '1:3':
    texto: Esse homem subia de sua cidade, a cada ano, para se prostrar e sacrificar ao Senhor dos Exércitos
      em Silo. Ali estavam os dois filhos de Heli, Hofni e Finéias, sacerdotes do Senhor.
    status: ia-sem-revisao
  '1:4':
    texto: Chegou o dia, e Elcana ofereceu o sacrifício; deu porções a Fenena, sua mulher, e a todos os
      seus filhos e filhas.
    status: ia-sem-revisao
  '1:5':
    texto: Mas a Ana dava uma porção dupla, porque amava Ana; o Senhor, porém, havia fechado o seu ventre.
    status: ia-sem-revisao
  '1:6':
    texto: A sua rival a provocava duramente, só para a exasperar, porque o Senhor havia fechado o seu
      ventre.
    status: ia-sem-revisao
  '1:7':
    texto: 'Assim ele fazia ano após ano: cada vez que ela subia à casa do Senhor, a outra a provocava;
      e ela chorava e não comia.'
    status: ia-sem-revisao
  '1:8':
    texto: 'Elcana, seu marido, disse-lhe: “Ana, por que choras? Por que não comes? Por que está triste
      o teu coração? Não sou eu melhor para ti do que dez filhos?”'
    status: ia-sem-revisao
  '1:9':
    texto: Depois de comer e beber em Silo, Ana levantou-se. Heli, o sacerdote, estava sentado na cadeira,
      junto ao batente do templo do Senhor.
    status: ia-sem-revisao
  '1:10':
    texto: Ela, amargurada na alma, orou ao Senhor e chorou copiosamente.
    status: ia-sem-revisao
  '1:11':
    texto: 'Fez um voto e disse: “Senhor dos Exércitos, se olhares bem para a aflição da tua serva, te
      lembrares de mim e não esqueceres a tua serva, e deres à tua serva uma descendência de varões, eu
      o darei ao Senhor por todos os dias da sua vida, e a navalha não passará sobre a sua cabeça.”'
    status: ia-sem-revisao
  '1:12':
    texto: Enquanto ela prolongava a oração diante do Senhor, Heli observava a sua boca.
    status: ia-sem-revisao
  '1:13':
    texto: Ana falava em seu coração; só os seus lábios se moviam, e a sua voz não se ouvia. Heli pensou
      que ela estava embriagada.
    status: ia-sem-revisao
  '1:14':
    texto: 'Heli disse-lhe: “Até quando estarás embriagada? Afasta de ti o teu vinho!”'
    status: ia-sem-revisao
  '1:15':
    texto: 'Ana respondeu: “Não, meu senhor! Sou uma mulher de espírito abatido. Não bebi vinho nem bebida
      forte, mas derramo a minha alma diante do Senhor.'
    status: ia-sem-revisao
  '1:16':
    texto: Não tomes a tua serva por uma filha de Belial, pois foi por causa da grande angústia e do meu
      desgosto que falei até agora.”
    status: ia-sem-revisao
  '1:17':
    texto: 'Heli respondeu: “Vai em paz, e o Deus de Israel te conceda o pedido que lhe fizeste.”'
    status: ia-sem-revisao
  '1:18':
    texto: 'Ela disse: “Que a tua serva encontre graça aos teus olhos.” A mulher foi pelo seu caminho,
      comeu, e o seu rosto já não era o mesmo.'
    status: ia-sem-revisao
  '1:19':
    texto: Levantaram-se de manhã cedo, prostraram-se diante do Senhor e voltaram para a sua casa, em
      Ramá. Elcana conheceu Ana, sua mulher, e o Senhor se lembrou dela.
    status: ia-sem-revisao
  '1:20':
    texto: No decorrer dos dias, Ana concebeu e deu à luz um filho, e pôs-lhe o nome de Samuel, “porque
      o pedi ao Senhor”.
    status: ia-sem-revisao
  '1:21':
    texto: O homem Elcana subiu com toda a sua casa para oferecer ao Senhor o sacrifício anual e cumprir
      o seu voto.
    status: ia-sem-revisao
  '1:22':
    texto: 'Ana não subiu, pois disse ao marido: “Quando o menino for desmamado, eu o levarei; ele verá
      a face do Senhor e ficará ali para sempre.”'
    status: ia-sem-revisao
  '1:24':
    texto: Quando o desmamou, subiu com ele, levando três touros, uma efa de farinha e um odre de vinho,
      e o trouxe à casa do Senhor, em Silo. O menino era ainda muito pequeno.
    status: ia-sem-revisao
  '1:25':
    texto: Imolaram o touro e levaram o menino a Heli.
    status: ia-sem-revisao
  '1:26':
    texto: 'Ela disse: “Ó meu senhor, por tua vida, meu senhor, eu sou a mulher que esteve aqui, junto
      de ti, orando ao Senhor.'
    status: ia-sem-revisao
  '1:27':
    texto: Era por este menino que eu orava, e o Senhor me concedeu o que eu lhe pedira.
    status: ia-sem-revisao
  '1:28':
    texto: 'Também eu o cedo ao Senhor: por todos os dias em que existir, ele é cedido ao Senhor.” E ali
      se prostrou diante do Senhor.'
    status: ia-sem-revisao
  '2:1':
    texto: 'Ana orou e disse: “Exulta o meu coração no Senhor, o meu chifre se ergue no Senhor; a minha
      boca se abre contra os meus inimigos, porque me alegro na tua salvação.'
    status: ia-sem-revisao
  '2:4':
    texto: O arco dos valentes é quebrado, e os que tropeçavam cingem-se de vigor.
    status: ia-sem-revisao
  '2:5':
    texto: Os fartos se alugam por pão, e os famintos descansam; até a estéril dá à luz sete, e a de muitos
      filhos definha.
    status: ia-sem-revisao
  '2:6':
    texto: O Senhor faz morrer e faz viver; faz descer ao Xeol e dali faz subir.
    status: ia-sem-revisao
  '2:7':
    texto: O Senhor empobrece e enriquece; humilha e também exalta.
    status: ia-sem-revisao
  '2:8':
    texto: Levanta do pó o pobre, ergue do monturo o necessitado, para os fazer sentar com os nobres e
      dar-lhes em herança um trono de glória; pois do Senhor são as colunas da terra, e sobre elas assentou
      o mundo.
    status: ia-sem-revisao
  '3:1':
    texto: O menino Samuel servia ao Senhor diante de Heli. A palavra do Senhor era rara naqueles dias;
      não havia visão que irrompesse.
    status: ia-sem-revisao
  '3:2':
    texto: Naquele dia, Heli estava deitado no seu lugar — os seus olhos começavam a se enfraquecer, e
      ele não podia ver —
    status: ia-sem-revisao
  '3:3':
    texto: A lâmpada de Deus ainda não se apagara, e Samuel estava deitado no templo do Senhor, onde estava
      a arca de Deus.
    partes:
    - A lâmpada de Deus ainda não se apagara,
    - e Samuel estava deitado no templo do Senhor, onde estava a arca de Deus.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '3:4':
    texto: 'O Senhor chamou Samuel, e ele disse: “Eis-me aqui!”'
    status: ia-sem-revisao
  '3:5':
    texto: 'Correu até Heli e disse: “Eis-me aqui, pois me chamaste.” Heli respondeu: “Não chamei; volta
      a deitar-te.” E ele foi deitar-se.'
    status: ia-sem-revisao
  '3:6':
    texto: 'O Senhor tornou a chamar Samuel. Samuel levantou-se, foi a Heli e disse: “Eis-me aqui, pois
      me chamaste.” Ele respondeu: “Não chamei, meu filho; volta a deitar-te.”'
    status: ia-sem-revisao
  '3:7':
    texto: Samuel ainda não conhecia o Senhor, pois a palavra do Senhor ainda não lhe tinha sido revelada.
    status: ia-sem-revisao
  '3:8':
    texto: 'O Senhor chamou Samuel pela terceira vez. Ele se levantou, foi a Heli e disse: “Eis-me aqui,
      pois me chamaste.” Heli compreendeu que era o Senhor que chamava o menino.'
    status: ia-sem-revisao
  '3:9':
    texto: 'Heli disse a Samuel: “Vai deitar-te; e, se te chamar, dirás: ‘Fala, Senhor, porque o teu servo
      escuta.’” Samuel foi e deitou-se no seu lugar.'
    status: ia-sem-revisao
  '3:10':
    texto: 'O Senhor veio, pôs-se ali e chamou como das outras vezes: “Samuel! Samuel!” Samuel respondeu:
      “Fala, porque o teu servo escuta.”'
    status: ia-sem-revisao
  '3:19':
    texto: Samuel cresceu, e o Senhor estava com ele e não deixou cair por terra nenhuma das suas palavras.
    status: ia-sem-revisao
  '3:20':
    texto: Todo o Israel, desde Dã até Bersabeia, soube que Samuel era profeta fiel do Senhor.
    status: ia-sem-revisao
  '4:1':
    texto: A palavra de Samuel chegou a todo o Israel. Israel saiu ao encontro dos filisteus para a guerra
      e acampou junto a Eben-Ézer, enquanto os filisteus acampavam em Afec.
    status: ia-sem-revisao
  '4:2':
    texto: Os filisteus se dispuseram em linha contra Israel; a batalha se estendeu, e Israel foi derrotado
      diante dos filisteus, que mataram em campo aberto cerca de quatro mil homens.
    status: ia-sem-revisao
  '4:3':
    texto: 'O povo voltou ao acampamento, e os anciãos de Israel disseram: “Por que o Senhor nos derrotou
      hoje diante dos filisteus? Tragamos de Silo a arca da aliança do Senhor, para que venha ao nosso
      meio e nos salve da mão dos nossos inimigos.”'
    status: ia-sem-revisao
  '4:4':
    texto: O povo enviou mensageiros a Silo, e de lá trouxeram a arca da aliança do Senhor dos Exércitos,
      que se assenta sobre os querubins. Os dois filhos de Heli, Hofni e Finéias, estavam ali com a arca
      da aliança de Deus.
    status: ia-sem-revisao
  '4:5':
    texto: Quando a arca da aliança do Senhor chegou ao acampamento, todo o Israel levantou um grande
      clamor, e a terra estremeceu.
    status: ia-sem-revisao
  '4:6':
    texto: 'Os filisteus ouviram o som do clamor e disseram: “Que significa este grande clamor no acampamento
      dos hebreus?” E souberam que a arca do Senhor tinha chegado ao acampamento.'
    status: ia-sem-revisao
  '4:7':
    texto: 'Os filisteus ficaram com medo, pois diziam: ‘Deus veio ao acampamento!’ E disseram: “Ai de
      nós! Nunca aconteceu algo assim, nem ontem nem anteontem.'
    status: ia-sem-revisao
  '4:8':
    texto: Ai de nós! Quem nos livrará da mão desses deuses poderosos? São esses os deuses que feriram
      o Egito com toda sorte de pragas no deserto.
    status: ia-sem-revisao
  '4:9':
    texto: Fortalecei-vos e sede homens, ó filisteus, para que não sirvais aos hebreus como eles serviram
      a vós. Sede homens e combatei!”
    status: ia-sem-revisao
  '4:10':
    texto: 'Os filisteus combateram, e Israel foi derrotado; cada um fugiu para a sua tenda. A derrota
      foi muito grande: caíram de Israel trinta mil homens de infantaria.'
    status: ia-sem-revisao
  '4:11':
    texto: A arca de Deus foi capturada, e morreram os dois filhos de Heli, Hofni e Finéias.
    status: ia-sem-revisao
  '8:4':
    texto: Reuniram-se todos os anciãos de Israel e foram a Samuel, em Ramá.
    status: ia-sem-revisao
  '8:5':
    texto: 'Disseram-lhe: “Eis que estás velho, e os teus filhos não andam nos teus caminhos. Agora, dá-nos
      um rei para nos governar, como todas as nações.”'
    status: ia-sem-revisao
  '8:6':
    texto: 'Aquela palavra desagradou a Samuel, quando disseram: “Dá-nos um rei para nos governar.” E
      Samuel orou ao Senhor.'
    status: ia-sem-revisao
  '8:7':
    texto: 'O Senhor disse a Samuel: “Escuta a voz do povo em tudo o que te disserem, pois não foi a ti
      que rejeitaram, mas a mim, para que eu não reine sobre eles.'
    status: ia-sem-revisao
  '8:10':
    texto: Samuel repetiu todas as palavras do Senhor ao povo que lhe pedia um rei.
    status: ia-sem-revisao
  '8:11':
    texto: 'Disse: “Este será o direito do rei que reinará sobre vós: tomará os vossos filhos e os porá
      nos seus carros e entre os seus cavaleiros, e eles correrão diante do seu carro.'
    status: ia-sem-revisao
  '8:12':
    texto: Fará deles chefes de mil e chefes de cinquenta, e os fará lavrar os seus campos, ceifar as
      suas messes e fabricar as suas armas de guerra e os equipamentos dos seus carros.
    status: ia-sem-revisao
  '8:13':
    texto: Tomará as vossas filhas para perfumistas, cozinheiras e padeiras.
    status: ia-sem-revisao
  '8:14':
    texto: Tomará os vossos campos, as vossas vinhas e os vossos melhores olivais, e os dará aos seus
      servos.
    status: ia-sem-revisao
  '8:15':
    texto: Tomará o dízimo das vossas sementes e das vossas vinhas e o dará aos seus eunucos e servos.
    status: ia-sem-revisao
  '8:16':
    texto: Tomará os vossos servos e servas, os vossos melhores jovens e os vossos jumentos, e os empregará
      no seu trabalho.
    status: ia-sem-revisao
  '8:17':
    texto: Tomará o dízimo do vosso rebanho, e vós sereis seus servos.
    status: ia-sem-revisao
  '8:18':
    texto: Naquele dia clamareis por causa do rei que escolhestes para vós, mas o Senhor não vos responderá
      naquele dia.”
    status: ia-sem-revisao
  '8:19':
    texto: 'O povo recusou-se a ouvir a voz de Samuel e disse: “Não! Queremos um rei sobre nós!'
    status: ia-sem-revisao
  '8:20':
    texto: 'Seremos também nós como todas as nações: o nosso rei nos governará, sairá à nossa frente e
      combaterá os nossos combates.”'
    status: ia-sem-revisao
  '8:21':
    texto: Samuel ouviu todas as palavras do povo e as repetiu aos ouvidos do Senhor.
    status: ia-sem-revisao
  '8:22':
    texto: 'O Senhor disse a Samuel: “Escuta a voz deles e estabelece-lhes um rei.” Samuel disse aos homens
      de Israel: “Ide, cada um para a sua cidade.”'
    partes:
    - 'O Senhor disse a Samuel: “Escuta a voz deles e estabelece-lhes um rei.”'
    - 'Samuel disse aos homens de Israel: “Ide, cada um para a sua cidade.”'
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '9:1':
    texto: Havia um homem de Benjamim, chamado Cis, filho de Abiel, filho de Seror, filho de Becorat,
      filho de Afia, filho de um benjaminita, homem valente.
    status: ia-sem-revisao
  '9:2':
    texto: 'Ele tinha um filho chamado Saul, jovem e belo; não havia entre os filhos de Israel homem mais
      belo do que ele: do ombro para cima, sobressaía a todo o povo.'
    status: ia-sem-revisao
  '9:3':
    texto: 'Perderam-se as jumentas de Cis, pai de Saul. Cis disse a Saul, seu filho: “Toma contigo um
      dos servos, levanta-te e vai procurar as jumentas.”'
    status: ia-sem-revisao
  '9:4':
    texto: Atravessaram a montanha de Efraim e a terra de Salisa, e não as encontraram; atravessaram a
      terra de Saalim, e nada; atravessaram a terra de Benjamim, e não as encontraram.
    status: ia-sem-revisao
  '9:17':
    texto: 'Quando Samuel viu Saul, o Senhor lhe respondeu: “Este é o homem de quem te falei; ele governará
      o meu povo.”'
    status: ia-sem-revisao
  '9:18':
    texto: 'Saul aproximou-se de Samuel no meio da porta e disse: “Indica-me, por favor, onde fica a casa
      do vidente.”'
    status: ia-sem-revisao
  '9:19':
    texto: 'Samuel respondeu a Saul: “Eu sou o vidente. Sobe diante de mim ao lugar alto; comereis hoje
      comigo, e de manhã eu te despedirei e te direi tudo o que está no teu coração.'
    status: ia-sem-revisao
  '10:1':
    texto: 'Samuel tomou o frasco de óleo, derramou-o sobre a cabeça de Saul, beijou-o e disse: “Não é
      o Senhor que te ungiu como chefe da sua herança?'
    status: ia-sem-revisao
  '15:16':
    texto: 'Samuel disse a Saul: “Para! Vou contar-te o que o Senhor me disse esta noite.” Ele lhe disse:
      “Fala.”'
    status: ia-sem-revisao
  '15:17':
    texto: 'Samuel disse: “Não é verdade que, embora te julgues pequeno, és a cabeça das tribos de Israel?
      O Senhor te ungiu rei sobre Israel.'
    status: ia-sem-revisao
  '15:18':
    texto: 'O Senhor te enviou em missão e disse: ‘Vai, consagra ao extermínio esses pecadores, os amalecitas,
      e combate-os até os aniquilar.’'
    status: ia-sem-revisao
  '15:19':
    texto: Por que não ouviste a voz do Senhor e te lançaste sobre o despojo, fazendo o que é mau aos
      olhos do Senhor?”
    status: ia-sem-revisao
  '15:20':
    texto: 'Saul disse a Samuel: “Eu ouvi a voz do Senhor e andei pelo caminho por onde o Senhor me enviou;
      trouxe Agag, rei de Amalec, e consagrei Amalec ao extermínio.'
    status: ia-sem-revisao
  '15:21':
    texto: Mas o povo tomou do despojo ovelhas e bois, as primícias do anátema, para sacrificar ao Senhor,
      teu Deus, em Guilgal.”
    status: ia-sem-revisao
  '15:22':
    texto: 'Samuel disse: “Acaso o Senhor se compraz tanto em holocaustos e sacrifícios como em que se
      ouça a voz do Senhor? Eis: obedecer é melhor do que o sacrifício, e escutar, melhor do que a gordura
      dos carneiros.'
    status: ia-sem-revisao
  '15:23':
    texto: Pois a rebeldia é como o pecado da adivinhação, e a obstinação, como a iniquidade e os terafim.
      Porque rejeitaste a palavra do Senhor, ele também te rejeitou como rei.”
    status: ia-sem-revisao
  '16:1':
    texto: 'O Senhor disse a Samuel: “Até quando lamentarás por Saul, se eu o rejeitei como rei sobre
      Israel? Enche de óleo o teu chifre e vai; eu te envio a Jessé, o belemita, porque entre os seus
      filhos escolhi para mim um rei.”'
    partes:
    - 'O Senhor disse a Samuel: “Até quando lamentarás por Saul, se eu o rejeitei como rei sobre Israel?'
    - Enche de óleo o teu chifre e vai; eu te envio a Jessé, o belemita, porque entre os seus filhos escolhi
      para mim um rei.”
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '16:2':
    texto: 'Samuel disse: “Como irei? Saul o saberá e me matará.” O Senhor disse: “Toma contigo uma novilha
      e dize: ‘Vim sacrificar ao Senhor.’'
    status: ia-sem-revisao
  '16:3':
    texto: Convida Jessé para o sacrifício, e eu te farei saber o que deves fazer; ungirás para mim aquele
      que eu te disser.”
    status: ia-sem-revisao
  '16:4':
    texto: 'Samuel fez o que o Senhor lhe tinha dito e foi a Belém. Os anciãos da cidade foram, tremendo,
      ao seu encontro e disseram: “Vens em paz?”'
    status: ia-sem-revisao
  '16:5':
    texto: 'Ele respondeu: “Em paz. Vim sacrificar ao Senhor. Santificai-vos e vinde comigo ao sacrifício.”
      Santificou Jessé e seus filhos e os convidou para o sacrifício.'
    status: ia-sem-revisao
  '16:6':
    texto: 'Quando chegaram, ele viu Eliab e disse: “Certamente diante do Senhor está o seu ungido.”'
    status: ia-sem-revisao
  '16:7':
    texto: 'Mas o Senhor disse a Samuel: “Não olhes para a sua aparência nem para a sua grande estatura,
      porque eu o rejeitei; pois o Senhor não vê como vê o homem: o homem vê o que aparece aos olhos,
      mas o Senhor vê o coração.”'
    status: ia-sem-revisao
  '16:8':
    texto: 'Jessé chamou Abinadab e o fez passar diante de Samuel, que disse: “Também a este o Senhor
      não escolheu.”'
    status: ia-sem-revisao
  '16:9':
    texto: 'Jessé fez passar Sama, e Samuel disse: “Também a este o Senhor não escolheu.”'
    status: ia-sem-revisao
  '16:10':
    texto: 'Jessé fez passar os seus sete filhos diante de Samuel, e Samuel disse a Jessé: “O Senhor não
      escolheu a estes.”'
    status: ia-sem-revisao
  '16:11':
    texto: 'Samuel perguntou a Jessé: “Acabaram-se os jovens?” Ele respondeu: “Resta ainda o menor, que
      está apascentando o rebanho.” Samuel disse a Jessé: “Manda buscá-lo, pois não nos sentaremos à mesa
      até que ele chegue aqui.”'
    status: ia-sem-revisao
  '16:12':
    texto: 'Jessé mandou buscá-lo e o fez entrar. Era ruivo, de belos olhos e boa aparência. O Senhor
      disse: “Levanta-te e unge-o, pois é este.”'
    status: ia-sem-revisao
  '16:13':
    texto: Samuel tomou o chifre de óleo e o ungiu no meio dos seus irmãos; e o espírito do Senhor veio
      sobre Davi com poder, desde aquele dia em diante. Samuel levantou-se e foi para Ramá.
    partes:
    - Samuel tomou o chifre de óleo e o ungiu no meio dos seus irmãos;
    - e o espírito do Senhor veio sobre Davi com poder, desde aquele dia em diante. Samuel levantou-se
      e foi para Ramá.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '17:32':
    texto: 'Davi disse a Saul: “Que ninguém perca a coragem por causa dele; o teu servo irá e combaterá
      este filisteu.”'
    status: ia-sem-revisao
  '17:33':
    texto: 'Saul disse a Davi: “Não podes ir contra esse filisteu para combater com ele, pois és apenas
      um jovem, e ele é homem de guerra desde a juventude.”'
    status: ia-sem-revisao
  '17:37':
    texto: 'Davi disse: “O Senhor, que me livrou da mão do leão e da mão do urso, ele me livrará da mão
      deste filisteu.” Saul disse a Davi: “Vai, e o Senhor esteja contigo.”'
    status: ia-sem-revisao
  '17:40':
    texto: Tomou na mão o seu cajado, escolheu para si no ribeiro cinco pedras lisas e pô-las no alforje
      de pastor que tinha, na sacola; com a funda na mão, aproximou-se do filisteu.
    status: ia-sem-revisao
  '17:41':
    texto: O filisteu avançava, aproximando-se de Davi, e o seu escudeiro ia diante dele.
    status: ia-sem-revisao
  '17:42':
    texto: O filisteu olhou, viu Davi e o desprezou, porque era jovem, ruivo e de belo aspecto.
    status: ia-sem-revisao
  '17:43':
    texto: 'O filisteu disse a Davi: “Acaso sou um cão, para vires a mim com paus?” E o filisteu amaldiçoou
      Davi pelos seus deuses.'
    status: ia-sem-revisao
  '17:44':
    texto: 'O filisteu disse a Davi: “Vem a mim, e darei a tua carne às aves do céu e às feras do campo.”'
    status: ia-sem-revisao
  '17:45':
    texto: 'Davi disse ao filisteu: “Tu vens a mim com espada, lança e dardo; eu vou a ti em nome do Senhor
      dos Exércitos, Deus dos exércitos de Israel, que tu desafiaste.'
    status: ia-sem-revisao
  '17:46':
    texto: Hoje o Senhor te entregará na minha mão; eu te ferirei, tirarei a tua cabeça de cima de ti
      e darei hoje os cadáveres do exército dos filisteus às aves do céu e às feras da terra, e toda a
      terra saberá que há um Deus em Israel.
    status: ia-sem-revisao
  '17:47':
    texto: E toda esta assembleia saberá que não é com espada nem com lança que o Senhor salva, pois do
      Senhor é a guerra, e ele vos entregará em nossas mãos.”
    status: ia-sem-revisao
  '17:48':
    texto: Quando o filisteu se levantou e avançou ao encontro de Davi, Davi correu depressa para a linha
      de batalha, ao encontro do filisteu.
    status: ia-sem-revisao
  '17:49':
    texto: Davi meteu a mão no alforje, tirou dali uma pedra, lançou-a com a funda e feriu o filisteu
      na testa; a pedra se cravou na sua testa, e ele caiu de bruços por terra.
    status: ia-sem-revisao
  '17:50':
    texto: Assim Davi prevaleceu sobre o filisteu com a funda e com a pedra; feriu o filisteu e o matou,
      sem ter espada na mão.
    status: ia-sem-revisao
  '18:6':
    texto: Quando voltaram, ao regressar Davi de ferir o filisteu, as mulheres saíram de todas as cidades
      de Israel, cantando e dançando, ao encontro do rei Saul, com tamborins, com alegria e com triângulos.
    status: ia-sem-revisao
  '18:7':
    texto: 'As mulheres que se divertiam cantavam alternadamente e diziam: “Saul feriu os seus milhares,
      e Davi, as suas dezenas de milhares.”'
    status: ia-sem-revisao
  '18:8':
    texto: 'Saul irritou-se muito, e essa palavra lhe desagradou. Disse: “Deram dezenas de milhares a
      Davi, e a mim deram milhares. Só lhe falta o reino!”'
    status: ia-sem-revisao
  '18:9':
    texto: Desde aquele dia em diante, Saul vigiava Davi com olhar desconfiado.
    status: ia-sem-revisao
  '19:1':
    texto: Saul falou a seu filho Jônatas e a todos os seus servos sobre matar Davi; mas Jônatas, filho
      de Saul, tinha grande afeição por Davi.
    status: ia-sem-revisao
  '19:2':
    texto: 'Jônatas avisou Davi: “Meu pai Saul procura matar-te. Agora, toma cuidado amanhã de manhã:
      fica num lugar retirado e esconde-te.'
    status: ia-sem-revisao
  '19:3':
    texto: Eu sairei e ficarei ao lado de meu pai, no campo onde estiveres, e falarei de ti a meu pai;
      verei o que há e te direi.”
    status: ia-sem-revisao
  '19:4':
    texto: 'Jônatas falou bem de Davi a Saul, seu pai, e lhe disse: “Que o rei não peque contra o seu
      servo Davi, pois ele não pecou contra ti, e as suas obras te têm sido muito proveitosas.'
    status: ia-sem-revisao
  '19:5':
    texto: Pôs a sua vida na palma da mão e feriu o filisteu, e o Senhor operou uma grande salvação para
      todo o Israel. Tu a viste e te alegraste. Por que pecarias, então, contra sangue inocente, matando
      Davi sem motivo?”
    status: ia-sem-revisao
  '19:6':
    texto: 'Saul ouviu a voz de Jônatas e jurou: “Pela vida do Senhor, ele não morrerá.”'
    status: ia-sem-revisao
  '19:7':
    texto: Jônatas chamou Davi e lhe contou todas essas palavras; depois levou Davi a Saul, e ele esteve
      diante dele como antes.
    status: ia-sem-revisao
  '24:3':
    texto: Saul tomou três mil homens escolhidos de todo o Israel e foi procurar Davi e os seus homens
      sobre as Rochas das Cabras-monteses.
    status: ia-sem-revisao
  '24:4':
    texto: Chegou aos currais de ovelhas junto ao caminho, onde havia uma gruta; Saul entrou para se aliviar,
      e Davi e os seus homens estavam sentados no fundo da gruta.
    status: ia-sem-revisao
  '24:5':
    texto: 'Os homens de Davi lhe disseram: “Eis o dia de que o Senhor te falou: ‘Eis que entrego o teu
      inimigo na tua mão; faze-lhe como parecer bem aos teus olhos.’” Davi levantou-se e cortou às escondidas
      a ponta do manto de Saul.'
    status: ia-sem-revisao
  '24:6':
    texto: Depois disso, o coração de Davi o feriu por ter cortado a ponta do manto de Saul.
    status: ia-sem-revisao
  '24:7':
    texto: 'Disse aos seus homens: “Longe de mim, da parte do Senhor, fazer tal coisa ao meu senhor, ao
      ungido do Senhor, estendendo a minha mão contra ele, porque ele é o ungido do Senhor.”'
    status: ia-sem-revisao
  '24:8':
    texto: Davi repreendeu os seus homens com palavras e não lhes permitiu levantar-se contra Saul. Saul
      saiu da gruta e seguiu o seu caminho.
    status: ia-sem-revisao
  '24:9':
    texto: 'Depois disso, Davi levantou-se, saiu da gruta e gritou atrás de Saul: “Meu senhor, o rei!”
      Saul olhou para trás, e Davi inclinou-se com o rosto em terra e se prostrou.'
    status: ia-sem-revisao
  '24:10':
    texto: 'Davi disse a Saul: “Por que escutas as palavras dos homens que dizem: ‘Davi procura o teu
      mal’?'
    status: ia-sem-revisao
  '24:11':
    texto: 'Hoje os teus olhos viram que o Senhor te entregou hoje na minha mão, na gruta. Disseram-me
      que te matasse, mas eu te poupei e disse: ‘Não estenderei a minha mão contra o meu senhor, pois
      é o ungido do Senhor.’'
    status: ia-sem-revisao
  '24:12':
    texto: Meu pai, olha, olha a ponta do teu manto na minha mão! Porque, ao cortar a ponta do teu manto,
      não te matei. Reconhece e vê que não há em minha mão mal nem rebeldia, e que não pequei contra ti;
      e tu andas à caça da minha vida para a tirar.
    status: ia-sem-revisao
  '24:13':
    texto: Que o Senhor julgue entre mim e ti, e que o Senhor me vingue de ti; mas a minha mão não será
      contra ti.
    status: ia-sem-revisao
  '24:14':
    texto: 'Como diz o provérbio antigo: ‘Dos ímpios sai a impiedade’; mas a minha mão não será contra
      ti.'
    status: ia-sem-revisao
  '24:15':
    texto: Atrás de quem saiu o rei de Israel? Atrás de quem vás correndo? Atrás de um cão morto, atrás
      de uma pulga!
    status: ia-sem-revisao
  '24:16':
    texto: Que o Senhor seja juiz e julgue entre mim e ti; que veja, defenda a minha causa e me julgue,
      livrando-me da tua mão.”
    status: ia-sem-revisao
  '24:17':
    texto: 'Quando Davi acabou de dizer essas palavras a Saul, Saul disse: “É esta a tua voz, meu filho
      Davi?” E Saul levantou a voz e chorou.'
    status: ia-sem-revisao
  '24:18':
    texto: 'Disse a Davi: “Tu és mais justo do que eu, pois me retribuíste com o bem, e eu te retribuí
      com o mal.'
    status: ia-sem-revisao
  '24:19':
    texto: 'Hoje mostraste o bem que fizeste a mim: o Senhor me entregou na tua mão, e não me mataste.'
    status: ia-sem-revisao
  '24:20':
    texto: Se alguém encontra o seu inimigo, deixa-o ir por bom caminho? O Senhor te retribuirá com o
      bem pelo que hoje fizeste por mim.
    status: ia-sem-revisao
  '24:21':
    texto: Agora sei que certamente reinarás e que o reino de Israel se firmará na tua mão.”
    status: ia-sem-revisao
  '26:2':
    texto: Saul levantou-se e desceu ao deserto de Zif com três mil homens escolhidos de Israel, para
      procurar Davi no deserto de Zif.
    status: ia-sem-revisao
  '26:7':
    texto: Davi e Abisai foram de noite ao meio do povo, e eis que Saul dormia deitado no acampamento,
      com a lança cravada no chão à cabeceira, e Abner e o povo deitados ao redor dele.
    status: ia-sem-revisao
  '26:8':
    texto: 'Abisai disse a Davi: “Deus entregou hoje o teu inimigo na tua mão. Agora deixa-me cravá-lo
      com a lança no chão, de um só golpe; não será preciso um segundo.”'
    status: ia-sem-revisao
  '26:9':
    texto: 'Davi disse a Abisai: “Não o destruas! Quem estende a mão contra o ungido do Senhor e fica
      sem culpa?”'
    status: ia-sem-revisao
  '26:12':
    texto: Davi tomou a lança e a bilha de água da cabeceira de Saul, e foram-se embora; ninguém viu,
      ninguém soube, ninguém acordou, pois todos dormiam, porque um sono profundo do Senhor caíra sobre
      eles.
    status: ia-sem-revisao
  '26:13':
    texto: Davi passou para o outro lado e parou, a distância, no cume do monte; grande era o espaço entre
      eles.
    status: ia-sem-revisao
  '26:22':
    texto: 'Davi respondeu: “Eis a lança do rei! Que venha um dos jovens buscá-la.'
    status: ia-sem-revisao
  '26:23':
    texto: O Senhor retribuirá a cada um a sua justiça e a sua fidelidade; hoje o Senhor te entregou na
      minha mão, mas não quis estender a minha mão contra o ungido do Senhor.
    status: ia-sem-revisao
