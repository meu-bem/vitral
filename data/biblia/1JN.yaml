livro: 1JN
fonte: sblgnt
versiculos:
  '1:1':
    texto: O que era desde o princípio, o que ouvimos, o que vimos com os nossos olhos, o que contemplamos
      e as nossas mãos tocaram, a respeito da Palavra da vida —
    status: ia-sem-revisao
  '1:2':
    texto: Pois a vida se manifestou, e nós a vimos, e damos testemunho, e vos anunciamos a vida eterna,
      que estava junto do Pai e nos foi manifestada —
    status: ia-sem-revisao
  '1:3':
    texto: O que vimos e ouvimos, isso vos anunciamos também a vós, para que também vós tenhais comunhão
      conosco; e a nossa comunhão é com o Pai e com o seu Filho Jesus Cristo.
    status: ia-sem-revisao
  '1:4':
    texto: E isto vos escrevemos, para que a nossa alegria seja plena.
    status: ia-sem-revisao
  '1:5':
    texto: 'E esta é a mensagem que ouvimos dele e vos anunciamos: que Deus é luz e nele não há treva
      alguma.'
    status: ia-sem-revisao
  '1:6':
    texto: Se dissermos que temos comunhão com ele e andarmos nas trevas, mentimos e não praticamos a
      verdade;
    status: ia-sem-revisao
  '1:7':
    texto: Mas se andarmos na luz, como ele está na luz, temos comunhão uns com os outros, e o sangue
      de Jesus, seu Filho, nos purifica de todo pecado.
    status: ia-sem-revisao
  '1:8':
    texto: Se dissermos que não temos pecado, enganamo-nos a nós mesmos, e a verdade não está em nós.
    status: ia-sem-revisao
  '1:9':
    texto: Se confessarmos os nossos pecados, ele é fiel e justo para nos perdoar os pecados e nos purificar
      de toda injustiça.
    status: ia-sem-revisao
  '1:10':
    texto: Se dissermos que não pecamos, fazemo-lo mentiroso, e a sua palavra não está em nós.
    status: ia-sem-revisao
  '2:1':
    texto: Meus filhinhos, escrevo-vos estas coisas para que não pequeis. Mas, se alguém pecar, temos
      junto do Pai um advogado, Jesus Cristo, o justo;
    status: ia-sem-revisao
  '2:2':
    texto: E ele é propiciação pelos nossos pecados, e não somente pelos nossos, mas também pelos de todo
      o mundo.
    status: ia-sem-revisao
  '2:3':
    texto: 'E por isto sabemos que o conhecemos: se guardamos os seus mandamentos.'
    status: ia-sem-revisao
  '2:4':
    texto: 'Quem diz: “Conheço-o”, e não guarda os seus mandamentos, é mentiroso, e nele a verdade não
      está;'
    status: ia-sem-revisao
  '2:5':
    texto: 'Mas quem guarda a sua palavra, nele verdadeiramente o amor de Deus se tornou perfeito. Por
      isto sabemos que estamos nele:'
    status: ia-sem-revisao
  '2:6':
    texto: Quem diz que permanece nele deve andar também como ele andou.
    status: ia-sem-revisao
  '2:7':
    texto: Amados, não vos escrevo um mandamento novo, mas um mandamento antigo, que tínheis desde o princípio;
      o mandamento antigo é a palavra que ouvistes.
    status: ia-sem-revisao
  '2:8':
    texto: Por outro lado, escrevo-vos um mandamento novo, o que é verdadeiro nele e em vós, porque as
      trevas passam e a luz verdadeira já brilha.
    status: ia-sem-revisao
  '2:9':
    texto: Quem diz estar na luz e odeia o seu irmão está nas trevas até agora.
    status: ia-sem-revisao
  '2:10':
    texto: Quem ama o seu irmão permanece na luz, e nele não há ocasião de queda;
    status: ia-sem-revisao
  '2:11':
    texto: Mas quem odeia o seu irmão está nas trevas e anda nas trevas, e não sabe para onde vai, porque
      as trevas cegaram os seus olhos.
    status: ia-sem-revisao
  '2:12':
    texto: Escrevo-vos, filhinhos, porque vos foram perdoados os pecados por causa do seu nome;
    status: ia-sem-revisao
  '2:13':
    texto: Escrevo-vos, pais, porque conhecestes aquele que é desde o princípio; escrevo-vos, jovens,
      porque vencestes o Maligno.
    status: ia-sem-revisao
  '2:14':
    texto: Escrevi-vos, crianças, porque conhecestes o Pai; escrevi-vos, pais, porque conhecestes aquele
      que é desde o princípio; escrevi-vos, jovens, porque sois fortes, e a palavra de Deus permanece
      em vós, e vencestes o Maligno.
    status: ia-sem-revisao
  '2:15':
    texto: Não ameis o mundo nem as coisas que há no mundo. Se alguém ama o mundo, o amor do Pai não está
      nele;
    status: ia-sem-revisao
  '2:16':
    texto: Porque tudo o que há no mundo — a concupiscência da carne, a concupiscência dos olhos e a soberba
      da vida — não vem do Pai, mas vem do mundo;
    status: ia-sem-revisao
  '2:17':
    texto: E o mundo passa, e também a sua concupiscência, mas quem faz a vontade de Deus permanece para
      sempre.
    status: ia-sem-revisao
  '2:18':
    texto: Filhinhos, é a última hora; e, como ouvistes que o anticristo vem, já agora muitos anticristos
      surgiram; daí sabemos que é a última hora.
    status: ia-sem-revisao
  '2:19':
    texto: Saíram de entre nós, mas não eram dos nossos; pois, se fossem dos nossos, teriam permanecido
      conosco; mas isso foi para que se manifestasse que nem todos são dos nossos.
    status: ia-sem-revisao
  '2:20':
    texto: E vós tendes unção da parte do Santo, e todos sabeis.
    status: ia-sem-revisao
  '2:21':
    texto: Não vos escrevi porque não conheceis a verdade, mas porque a conheceis, e porque nenhuma mentira
      procede da verdade.
    status: ia-sem-revisao
  '2:22':
    texto: 'Quem é o mentiroso, senão aquele que nega que Jesus é o Cristo? Este é o anticristo: o que
      nega o Pai e o Filho.'
    status: ia-sem-revisao
  '2:23':
    texto: Todo aquele que nega o Filho tampouco tem o Pai; quem confessa o Filho tem também o Pai.
    status: ia-sem-revisao
  '2:24':
    texto: Quanto a vós, o que ouvistes desde o princípio permaneça em vós; se permanecer em vós o que
      ouvistes desde o princípio, também vós permanecereis no Filho e no Pai.
    status: ia-sem-revisao
  '2:25':
    texto: 'E esta é a promessa que ele mesmo nos fez: a vida eterna.'
    status: ia-sem-revisao
  '2:26':
    texto: Isto vos escrevi a respeito dos que vos enganam.
    status: ia-sem-revisao
  '2:27':
    texto: E a unção que recebestes dele permanece em vós, e não tendes necessidade de que alguém vos
      ensine; mas, como a sua unção vos ensina sobre tudo, e é verdadeira e não é mentira, assim como
      vos ensinou, permanecei nele.
    status: ia-sem-revisao
  '2:28':
    texto: E agora, filhinhos, permanecei nele, para que, quando ele se manifestar, tenhamos confiança
      e não sejamos envergonhados diante dele na sua vinda.
    status: ia-sem-revisao
  '2:29':
    texto: Se sabeis que ele é justo, reconhecei que todo aquele que pratica a justiça nasceu dele.
    status: ia-sem-revisao
  '3:1':
    texto: Vede que amor nos deu o Pai, para sermos chamados filhos de Deus; e o somos. Por isso o mundo
      não nos conhece, porque não o conheceu.
    status: ia-sem-revisao
  '3:2':
    texto: Amados, agora somos filhos de Deus, e ainda não se manifestou o que seremos. Sabemos que, quando
      ele se manifestar, seremos semelhantes a ele, porque o veremos como ele é.
    status: ia-sem-revisao
  '3:3':
    texto: E todo aquele que tem nele esta esperança purifica-se, como ele é puro.
    status: ia-sem-revisao
  '3:4':
    texto: Todo aquele que pratica o pecado pratica também a iniquidade, e o pecado é a iniquidade.
    status: ia-sem-revisao
  '3:5':
    texto: E sabeis que ele se manifestou para tirar os pecados, e nele não há pecado.
    status: ia-sem-revisao
  '3:6':
    texto: Todo aquele que permanece nele não peca; todo aquele que peca não o viu nem o conheceu.
    status: ia-sem-revisao
  '3:7':
    texto: 'Filhinhos, ninguém vos engane: quem pratica a justiça é justo, como ele é justo;'
    status: ia-sem-revisao
  '3:8':
    texto: 'Quem pratica o pecado é do diabo, porque o diabo peca desde o princípio. Para isto se manifestou
      o Filho de Deus: para destruir as obras do diabo.'
    status: ia-sem-revisao
  '3:9':
    texto: Todo aquele que nasceu de Deus não pratica o pecado, porque a sua semente permanece nele, e
      não pode pecar, porque nasceu de Deus.
    status: ia-sem-revisao
  '3:10':
    texto: 'Nisto se manifestam os filhos de Deus e os filhos do diabo: todo aquele que não pratica a
      justiça não é de Deus, nem aquele que não ama o seu irmão.'
    status: ia-sem-revisao
  '3:11':
    texto: 'Pois esta é a mensagem que ouvistes desde o princípio: que nos amemos uns aos outros;'
    status: ia-sem-revisao
  '3:12':
    texto: Não como Caim, que era do Maligno e matou o seu irmão. E por que o matou? Porque as suas obras
      eram más, e as do seu irmão, justas.
    status: ia-sem-revisao
  '3:13':
    texto: Não vos admireis, irmãos, se o mundo vos odeia.
    status: ia-sem-revisao
  '3:14':
    texto: Nós sabemos que passamos da morte para a vida, porque amamos os irmãos; quem não ama permanece
      na morte.
    status: ia-sem-revisao
  '3:15':
    texto: Todo aquele que odeia o seu irmão é homicida, e sabeis que nenhum homicida tem a vida eterna
      permanecendo nele.
    status: ia-sem-revisao
  '3:16':
    texto: 'Nisto conhecemos o amor: ele deu a sua vida por nós; e nós devemos dar a vida pelos irmãos.'
    status: ia-sem-revisao
  '3:17':
    texto: Mas quem tiver os bens do mundo e vir o seu irmão em necessidade e fechar o seu coração para
      ele, como permanece nele o amor de Deus?
    status: ia-sem-revisao
  '3:18':
    texto: Filhinhos, não amemos com palavra nem com a língua, mas com obras e em verdade.
    status: ia-sem-revisao
  '3:19':
    texto: Nisto conheceremos que somos da verdade, e diante dele tranquilizaremos o nosso coração,
    status: ia-sem-revisao
  '3:20':
    texto: Naquilo em que o nosso coração nos condenar, porque Deus é maior que o nosso coração e conhece
      tudo.
    status: ia-sem-revisao
  '3:21':
    texto: Amados, se o nosso coração não nos condena, temos confiança diante de Deus,
    status: ia-sem-revisao
  '3:22':
    texto: E o que pedirmos dele recebemos, porque guardamos os seus mandamentos e fazemos o que lhe agrada.
    status: ia-sem-revisao
  '3:23':
    texto: 'E este é o seu mandamento: que creiamos no nome do seu Filho Jesus Cristo e nos amemos uns
      aos outros, como nos deu o mandamento.'
    status: ia-sem-revisao
  '3:24':
    texto: 'E quem guarda os seus mandamentos permanece nele, e ele nele; e nisto sabemos que ele permanece
      em nós: pelo Espírito que nos deu.'
    status: ia-sem-revisao
  '4:1':
    texto: Amados, não acrediteis em todo espírito, mas provai os espíritos para ver se são de Deus, porque
      muitos falsos profetas saíram pelo mundo.
    status: ia-sem-revisao
  '4:2':
    texto: 'Nisto conheceis o Espírito de Deus: todo espírito que confessa Jesus Cristo vindo na carne
      é de Deus;'
    status: ia-sem-revisao
  '4:3':
    texto: E todo espírito que não confessa Jesus não é de Deus; este é o do anticristo, que ouvistes
      que vem, e já agora está no mundo.
    status: ia-sem-revisao
  '4:4':
    texto: Vós sois de Deus, filhinhos, e os vencestes, porque maior é aquele que está em vós do que aquele
      que está no mundo.
    status: ia-sem-revisao
  '4:5':
    texto: Eles são do mundo; por isso falam do mundo, e o mundo os ouve.
    status: ia-sem-revisao
  '4:6':
    texto: Nós somos de Deus; quem conhece a Deus nos ouve; quem não é de Deus não nos ouve. Daí conhecemos
      o espírito da verdade e o espírito do erro.
    status: ia-sem-revisao
  '4:7':
    texto: Amados, amemo-nos uns aos outros, porque o amor é de Deus, e todo aquele que ama nasceu de
      Deus e conhece a Deus.
    status: ia-sem-revisao
  '4:8':
    texto: Quem não ama não conheceu a Deus, porque Deus é amor.
    status: ia-sem-revisao
  '4:9':
    texto: 'Nisto se manifestou o amor de Deus entre nós: Deus enviou ao mundo o seu Filho unigênito,
      para que vivamos por meio dele.'
    status: ia-sem-revisao
  '4:10':
    texto: 'Nisto está o amor: não que nós tenhamos amado a Deus, mas que ele nos amou e enviou o seu
      Filho como propiciação pelos nossos pecados.'
    status: ia-sem-revisao
  '4:11':
    texto: Amados, se Deus assim nos amou, também nós devemos amar-nos uns aos outros.
    status: ia-sem-revisao
  '4:12':
    texto: Ninguém jamais contemplou a Deus; se nos amamos uns aos outros, Deus permanece em nós, e o
      seu amor em nós é levado à perfeição.
    status: ia-sem-revisao
  '4:13':
    texto: 'Nisto conhecemos que permanecemos nele e ele em nós: ele nos deu do seu Espírito.'
    status: ia-sem-revisao
  '4:14':
    texto: E nós contemplamos e testemunhamos que o Pai enviou o Filho como Salvador do mundo.
    status: ia-sem-revisao
  '4:15':
    texto: Quem confessar que Jesus é o Filho de Deus, Deus permanece nele, e ele em Deus.
    status: ia-sem-revisao
  '4:16':
    texto: E nós conhecemos e cremos no amor que Deus tem por nós. Deus é amor, e quem permanece no amor
      permanece em Deus, e Deus permanece nele.
    status: ia-sem-revisao
  '4:17':
    texto: 'Nisto o amor chegou à perfeição entre nós: para que tenhamos confiança no dia do julgamento,
      porque como ele é, também nós somos neste mundo.'
    status: ia-sem-revisao
  '4:18':
    texto: No amor não há temor, mas o amor perfeito lança fora o temor, porque o temor implica castigo,
      e quem teme não chegou à perfeição no amor.
    status: ia-sem-revisao
  '4:19':
    texto: Nós amamos, porque ele nos amou primeiro.
    status: ia-sem-revisao
  '4:20':
    texto: 'Se alguém disser: “Amo a Deus”, e odiar o seu irmão, é mentiroso; pois quem não ama o seu
      irmão, que viu, não pode amar a Deus, que não viu.'
    status: ia-sem-revisao
  '4:21':
    texto: 'E este mandamento temos dele: que quem ama a Deus ame também o seu irmão.'
    status: ia-sem-revisao
  '5:1':
    texto: Todo aquele que crê que Jesus é o Cristo nasceu de Deus, e todo aquele que ama o que gerou
      ama também o que dele nasceu.
    status: ia-sem-revisao
  '5:2':
    texto: 'Nisto conhecemos que amamos os filhos de Deus: quando amamos a Deus e cumprimos os seus mandamentos;'
    status: ia-sem-revisao
  '5:3':
    texto: 'Pois este é o amor de Deus: que guardemos os seus mandamentos; e os seus mandamentos não são
      pesados,'
    status: ia-sem-revisao
  '5:4':
    texto: 'Porque tudo o que nasceu de Deus vence o mundo. E esta é a vitória que venceu o mundo: a nossa
      fé.'
    status: ia-sem-revisao
  '5:5':
    texto: Quem é o que vence o mundo, senão aquele que crê que Jesus é o Filho de Deus?
    status: ia-sem-revisao
  '5:6':
    texto: Este é o que veio por meio de água e sangue, Jesus Cristo; não somente na água, mas na água
      e no sangue; e o Espírito é o que dá testemunho, porque o Espírito é a verdade.
    status: ia-sem-revisao
  '5:7':
    texto: 'Porque são três os que dão testemunho:'
    status: ia-sem-revisao
  '5:8':
    texto: O Espírito, a água e o sangue, e os três convergem num só.
    status: ia-sem-revisao
  '5:9':
    texto: 'Se aceitamos o testemunho dos homens, o testemunho de Deus é maior, porque este é o testemunho
      de Deus: que ele testemunhou acerca do seu Filho.'
    status: ia-sem-revisao
  '5:10':
    texto: Quem crê no Filho de Deus tem em si o testemunho; quem não crê em Deus fê-lo mentiroso, porque
      não creu no testemunho que Deus deu acerca do seu Filho.
    status: ia-sem-revisao
  '5:11':
    texto: 'E este é o testemunho: que Deus nos deu a vida eterna, e esta vida está no seu Filho.'
    status: ia-sem-revisao
  '5:12':
    texto: Quem tem o Filho tem a vida; quem não tem o Filho de Deus não tem a vida.
    status: ia-sem-revisao
  '5:13':
    texto: Escrevi-vos estas coisas para que saibais que tendes a vida eterna, vós que credes no nome
      do Filho de Deus.
    status: ia-sem-revisao
  '5:14':
    texto: 'E esta é a confiança que temos diante dele: que, se pedirmos algo segundo a sua vontade, ele
      nos ouve.'
    status: ia-sem-revisao
  '5:15':
    texto: E, se sabemos que ele nos ouve naquilo que pedimos, sabemos que temos os pedidos que lhe fizemos.
    status: ia-sem-revisao
  '5:16':
    texto: Se alguém vir o seu irmão cometer um pecado que não é para a morte, peça, e ele lhe dará a
      vida, aos que pecam não para a morte. Há pecado para a morte; não digo que se peça por esse.
    status: ia-sem-revisao
  '5:17':
    texto: Toda injustiça é pecado, e há pecado que não é para a morte.
    status: ia-sem-revisao
  '5:18':
    texto: Sabemos que todo aquele que nasceu de Deus não peca, mas aquele que nasceu de Deus o guarda,
      e o Maligno não o toca.
    status: ia-sem-revisao
  '5:19':
    texto: Sabemos que somos de Deus, e o mundo inteiro jaz no Maligno.
    status: ia-sem-revisao
  '5:20':
    texto: Sabemos também que o Filho de Deus veio e nos deu inteligência para conhecermos o Verdadeiro;
      e estamos no Verdadeiro, no seu Filho Jesus Cristo. Este é o verdadeiro Deus e a vida eterna.
    status: ia-sem-revisao
  '5:21':
    texto: Filhinhos, guardai-vos dos ídolos.
    status: ia-sem-revisao
