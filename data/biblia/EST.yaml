livro: EST
fonte: oshb
versiculos:
  '4:17':
    texto: 'Mardoqueu orou ao Senhor, lembrando-se de todas as suas obras, e disse: “Senhor, Senhor, rei
      onipotente, em teu domínio estão postas todas as coisas, e não há quem possa resistir à tua vontade,
      se decidires salvar Israel. Tu fizeste o céu e a terra e tudo o que se contém no âmbito do céu.
      Tu és o Senhor de tudo, e não há quem resista à tua majestade. Tu sabes tudo, e sabes que não fiz
      isso por soberba, desprezo ou desejo de glória, para não adorar Amã, o soberbíssimo (de bom grado,
      pela salvação de Israel, eu estaria pronto a beijar até a planta dos seus pés), mas temi transferir
      a um homem a honra do meu Deus e adorar alguém, exceto o meu Deus. E agora, Senhor rei, Deus de
      Abraão, tem piedade do teu povo, porque os nossos inimigos querem destruir-nos e aniquilar a tua
      herança. Não desprezes a tua parte, que resgataste para ti do Egito. Escuta a minha súplica e sê
      propício à tua sorte e ao teu quinhão, e converte o nosso luto em alegria, para que, vivos, louvemos
      o teu nome, Senhor, e não feches a boca dos que te cantam.” Todo o Israel, com a mesma disposição
      e súplica, clamou ao Senhor, porque lhe pendia uma morte certa. A rainha Ester também se refugiou
      no Senhor, apavorada com o perigo que ameaçava; e, depois de deixar as vestes reais, vestiu roupas
      próprias para o pranto e o luto, no lugar de perfumes variados encheu a cabeça de cinza e esterco,
      humilhou o corpo com jejuns e cobriu de cabelos arrancados todos os lugares onde antes costumava
      alegrar-se. Orava ao Senhor, Deus de Israel, dizendo: “Senhor meu, que és o nosso único rei, ajuda-me,
      solitária, que não tenho outro auxiliador além de ti. O perigo está nas minhas mãos. Ouvi de meu
      pai que tu, Senhor, tiraste Israel de entre todas as nações, e os nossos pais de entre todos os
      seus antepassados, para possuíres uma herança eterna, e fizeste por eles como falaste. Pecamos na
      tua presença, e por isso nos entregaste nas mãos dos nossos inimigos, pois prestamos culto aos deuses
      deles. Tu és justo, Senhor. E agora não lhes basta oprimir-nos com duríssima servidão: atribuindo
      a força das suas mãos ao poder dos ídolos, querem mudar as tuas promessas, aniquilar a tua herança,
      fechar a boca dos que te louvam e extinguir a glória do teu templo e do teu altar, para abrirem
      a boca das nações e louvarem a força dos ídolos e proclamarem para sempre um rei de carne. Não entregues,
      Senhor, o teu cetro aos que não existem, para que não riam da nossa ruína; mas faze recair o conselho
      deles sobre eles mesmos e dispersa aquele que começou a ensandecer contra nós. Lembra-te, Senhor,
      e mostra-te a nós no tempo da nossa tribulação, e dá-me confiança, Senhor, rei dos deuses e de todo
      poder; concede-me um discurso bem composto em minha boca diante do leão e transforma o coração dele
      em ódio ao nosso inimigo, para que pereça ele e os que com ele consentem. Quanto a nós, liberta-nos
      com a tua mão e ajuda-me, que não tenho outro auxílio senão tu, Senhor, que tens a ciência de tudo.”'
    partes:
    - Mardoqueu orou ao Senhor, lembrando-se de todas as suas obras,
    - 'e disse: “Senhor, Senhor, rei onipotente, em teu domínio estão postas todas as coisas, e não há
      quem possa resistir à tua vontade, se decidires salvar Israel.'
    - Tu fizeste o céu e a terra e tudo o que se contém no âmbito do céu.
    - Tu és o Senhor de tudo, e não há quem resista à tua majestade.
    - Tu sabes tudo, e sabes que não fiz isso por soberba, desprezo ou desejo de glória, para não adorar
      Amã, o soberbíssimo (de bom grado, pela salvação de Israel, eu estaria pronto a beijar até a planta
      dos seus pés), mas temi transferir a um homem a honra do meu Deus e adorar alguém, exceto o meu
      Deus.
    - E agora, Senhor rei, Deus de Abraão, tem piedade do teu povo, porque os nossos inimigos querem destruir-nos
      e aniquilar a tua herança.
    - Não desprezes a tua parte, que resgataste para ti do Egito.
    - Escuta a minha súplica e sê propício à tua sorte e ao teu quinhão, e converte o nosso luto em alegria,
      para que, vivos, louvemos o teu nome, Senhor, e não feches a boca dos que te cantam.”
    - Todo o Israel, com a mesma disposição e súplica, clamou ao Senhor, porque lhe pendia uma morte certa.
    - A rainha Ester também se refugiou no Senhor, apavorada com o perigo que ameaçava; e, depois de deixar
      as vestes reais, vestiu roupas próprias para o pranto e o luto, no lugar de perfumes variados encheu
      a cabeça de cinza e esterco, humilhou o corpo com jejuns e cobriu de cabelos arrancados todos os
      lugares onde antes costumava alegrar-se.
    - 'Orava ao Senhor, Deus de Israel, dizendo: “Senhor meu, que és o nosso único rei,'
    - ajuda-me, solitária, que não tenho outro auxiliador além de ti.
    - O perigo está nas minhas mãos.
    - Ouvi de meu pai que tu, Senhor, tiraste Israel de entre todas as nações, e os nossos pais de entre
      todos os seus antepassados, para possuíres uma herança eterna, e fizeste por eles como falaste.
    - Pecamos na tua presença, e por isso nos entregaste nas mãos dos nossos inimigos, pois prestamos
      culto aos deuses deles. Tu és justo, Senhor.
    - 'E agora não lhes basta oprimir-nos com duríssima servidão: atribuindo a força das suas mãos ao
      poder dos ídolos, querem mudar as tuas promessas, aniquilar a tua herança, fechar a boca dos que
      te louvam e extinguir a glória do teu templo e do teu altar,'
    - para abrirem a boca das nações e louvarem a força dos ídolos e proclamarem para sempre um rei de
      carne. Não entregues, Senhor, o teu cetro aos que não existem, para que não riam da nossa ruína;
      mas faze recair o conselho deles sobre eles mesmos e dispersa aquele que começou a ensandecer contra
      nós.
    - Lembra-te, Senhor, e mostra-te a nós no tempo da nossa tribulação, e dá-me confiança, Senhor, rei
      dos deuses e de todo poder;
    - concede-me um discurso bem composto em minha boca diante do leão e transforma o coração dele em
      ódio ao nosso inimigo, para que pereça ele e os que com ele consentem.
    - Quanto a nós, liberta-nos com a tua mão e ajuda-me, que não tenho outro auxílio senão tu, Senhor,
      que tens a ciência de tudo.”
    status: ia-sem-revisao
    observacao: 'Reconstrução: os versículos de Est 4,17a-t (Lecionário) vêm do latim da Clementina, Est
      13,8–14,14 (acréscimos gregos; ausentes do hebraico). A divisão em letras é aproximada e pode diferir
      da do Lecionário. O texto-base do versículo em hebraico é “Mardoqueu foi e fez tudo o que Ester
      lhe ordenara”.'
  '5:1':
    texto: No terceiro dia, Ester vestiu-se de rainha e parou no pátio interior da casa do rei, diante
      da casa do rei, estando o rei sentado no seu trono real, na casa real, diante da entrada da casa.
    partes:
    - No terceiro dia, Ester vestiu-se de rainha e parou no pátio interior da casa do rei, diante da casa
      do rei,
    - estando o rei sentado no seu trono real, na casa real, diante da entrada da casa.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '5:2':
    texto: Quando o rei viu a rainha Ester de pé no pátio, ela achou graça aos seus olhos; o rei estendeu
      a Ester o cetro de ouro que tinha na mão, e Ester aproximou-se e tocou a ponta do cetro.
    status: ia-sem-revisao
  '7:2':
    texto: 'O rei disse a Ester, também no segundo dia, durante o banquete do vinho: “Qual é o teu pedido,
      rainha Ester? Ser-te-á concedido. E qual é a tua petição? Até metade do reino, e será feita.”'
    partes:
    - 'O rei disse a Ester, também no segundo dia, durante o banquete do vinho: “Qual é o teu pedido,
      rainha Ester? Ser-te-á concedido.'
    - E qual é a tua petição? Até metade do reino, e será feita.”
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '7:3':
    texto: 'A rainha Ester respondeu: “Se achei graça aos teus olhos, ó rei, e se parece bem ao rei, que
      me seja dada a minha vida a meu pedido, e o meu povo, à minha petição.'
    status: ia-sem-revisao
