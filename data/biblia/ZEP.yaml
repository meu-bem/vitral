livro: ZEP
fonte: oshb
versiculos:
  '2:3':
    texto: Procurai o Senhor, todos os humildes da terra, que praticais o seu juízo; procurai a justiça,
      procurai a humildade; talvez sejais abrigados no dia da ira do Senhor.
    status: ia-sem-revisao
  '3:1':
    texto: Ai da rebelde e contaminada, da cidade opressora!
    status: ia-sem-revisao
  '3:2':
    texto: Não ouviu a voz, não aceitou a correção, não confiou no Senhor, não se aproximou do seu Deus.
    status: ia-sem-revisao
  '3:9':
    texto: Então darei aos povos lábios puros, para que todos invoquem o nome do Senhor e o sirvam num
      só ombro.
    status: ia-sem-revisao
  '3:10':
    texto: De além dos rios de Cuxe os meus suplicantes, a filha dos meus dispersos, me trarão oferendas.
    status: ia-sem-revisao
  '3:11':
    texto: Naquele dia não terás vergonha de todas as tuas ações com que te rebelaste contra mim, pois
      então removerei do teu meio os que se alegram com a tua soberba, e não mais te exaltarás no meu
      santo monte.
    status: ia-sem-revisao
  '3:12':
    texto: Deixarei no teu meio um povo humilde e pobre, e eles se refugiarão no nome do Senhor.
    status: ia-sem-revisao
  '3:13':
    texto: O resto de Israel não cometerá injustiça, não falará mentira, e não se achará na sua boca língua
      enganosa; pois pastarão e repousarão, sem que ninguém os assuste.
    status: ia-sem-revisao
  '3:14':
    texto: Canta de alegria, filha de Sião; aclama, Israel; alegra-te e exulta de todo o coração, filha
      de Jerusalém.
    status: ia-sem-revisao
  '3:15':
    texto: O Senhor afastou as sentenças contra ti, afastou o teu inimigo; o rei de Israel, o Senhor,
      está no teu meio; já não temerás o mal.
    status: ia-sem-revisao
  '3:16':
    texto: 'Naquele dia dir-se-á a Jerusalém: “Não temas, Sião; não se enfraqueçam as tuas mãos.'
    status: ia-sem-revisao
  '3:17':
    texto: O Senhor, teu Deus, está no teu meio, valente, ele salva; exulta de alegria por ti, silencia
      no seu amor, alegra-se por ti com gritos de júbilo.”
    status: ia-sem-revisao
  '3:18':
    texto: Reuni de ti os que se afligiam longe das festas; para ti eram um fardo, uma vergonha.
    status: ia-sem-revisao
