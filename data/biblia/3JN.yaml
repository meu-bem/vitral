livro: 3JN
fonte: sblgnt
versiculos:
  '1:1':
    texto: O presbítero ao amado Gaio, a quem eu amo na verdade.
    status: ia-sem-revisao
  '1:2':
    texto: Amado, em tudo peço que prosperes e tenhas saúde, assim como prospera a tua alma.
    status: ia-sem-revisao
  '1:3':
    texto: Alegrei-me muito, pois vieram irmãos e testemunharam a tua verdade, como tu andas na verdade.
    status: ia-sem-revisao
  '1:4':
    texto: 'Não tenho maior alegria do que esta: ouvir que os meus filhos andam na verdade.'
    status: ia-sem-revisao
  '1:5':
    texto: Amado, procedes fielmente em tudo o que fazes pelos irmãos, e isso sendo forasteiros,
    status: ia-sem-revisao
  '1:6':
    texto: Que testemunharam o teu amor diante da igreja; farás bem em encaminhá-los de modo digno de
      Deus,
    status: ia-sem-revisao
  '1:7':
    texto: Pois partiram por causa do Nome, sem receber nada dos gentios.
    status: ia-sem-revisao
  '1:8':
    texto: Nós, portanto, devemos acolher tais pessoas, para nos tornarmos colaboradores da verdade.
    status: ia-sem-revisao
  '1:9':
    texto: Escrevi algo à igreja, mas Diótrefes, que gosta de ter o primeiro lugar entre eles, não nos
      acolhe.
    status: ia-sem-revisao
  '1:10':
    texto: Por isso, se eu for, lembrarei as obras que ele pratica, falando contra nós com palavras más;
      e, não contente com isso, nem ele mesmo acolhe os irmãos, e impede os que querem, e os expulsa da
      igreja.
    status: ia-sem-revisao
  '1:11':
    texto: Amado, não imites o mal, mas o bem. Quem pratica o bem é de Deus; quem pratica o mal não viu
      a Deus.
    status: ia-sem-revisao
  '1:12':
    texto: Em favor de Demétrio há testemunho de todos e da própria verdade; também nós testemunhamos,
      e sabes que o nosso testemunho é verdadeiro.
    status: ia-sem-revisao
  '1:13':
    texto: Tinha muitas coisas a escrever-te, mas não quero escrever-te com tinta e pena;
    status: ia-sem-revisao
  '1:14':
    texto: Espero ver-te em breve, e falaremos de boca a boca.
    status: ia-sem-revisao
  '1:15':
    texto: Paz a ti. Saúdam-te os amigos. Saúda os amigos, cada um pelo nome.
    status: ia-sem-revisao
