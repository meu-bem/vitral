livro: 2MA
fonte: clementina
versiculos:
  '6:18':
    texto: Eleazar, um dos principais escribas, homem de idade avançada e de belo semblante, era forçado
      a abrir a boca para comer carne de porco.
    status: ia-sem-revisao
    observacao: Livro deuterocanônico, traduzido do latim (Clementina).
  '6:19':
    texto: Mas ele, abraçando uma morte gloriosíssima em vez de uma vida odiosa, ia voluntariamente ao
      suplício.
    status: ia-sem-revisao
  '6:20':
    texto: Considerando como devia proceder, suportando com paciência, decidiu não admitir coisas ilícitas
      por amor à vida.
    status: ia-sem-revisao
  '6:21':
    texto: Os que estavam presentes, movidos por uma compaixão iníqua, por causa da antiga amizade com
      o homem, tomaram-no à parte e lhe rogaram que se trouxessem carnes que lhe era lícito comer, para
      que fingisse ter comido das carnes do sacrifício, como o rei mandara,
    status: ia-sem-revisao
  '6:22':
    texto: a fim de que, assim fazendo, fosse libertado da morte; e, por causa da velha amizade com o
      homem, usavam com ele esta humanidade.
    status: ia-sem-revisao
  '6:23':
    texto: Mas ele começou a considerar a dignidade da sua idade e da sua velhice, a cabeleira branca
      de uma nobreza inata e os atos de ótima conduta desde menino; e, segundo as prescrições da lei santa
      e estabelecida por Deus, respondeu logo, dizendo que queria ser enviado antes ao inferno.
    status: ia-sem-revisao
  '6:24':
    texto: “Pois não é digno da nossa idade, disse, fingir, para que muitos jovens, pensando que Eleazar,
      aos noventa anos, passou à vida dos estrangeiros,
    status: ia-sem-revisao
  '6:25':
    texto: sejam também eles enganados por causa da minha simulação e por um pouco de tempo de vida corruptível,
      e assim eu atraia mancha e execração para a minha velhice.
    status: ia-sem-revisao
  '6:26':
    texto: Pois, ainda que no tempo presente eu seja arrancado aos suplícios dos homens, não escaparei
      da mão do Todo-Poderoso nem vivo nem morto.
    status: ia-sem-revisao
  '6:27':
    texto: Por isso, deixando a vida com coragem, me mostrarei digno da velhice;
    status: ia-sem-revisao
  '6:28':
    texto: e deixarei aos jovens um nobre exemplo, se, com ânimo pronto e forte, sofrer uma morte honrosa
      pelas leis gravíssimas e santíssimas.” Dito isto, foi logo arrastado ao suplício.
    status: ia-sem-revisao
  '6:29':
    texto: Os que o conduziam, que pouco antes eram mais brandos, converteram-se em ira por causa das
      palavras que ele dissera, as quais julgavam proferidas por arrogância.
    status: ia-sem-revisao
  '6:30':
    texto: 'Quando estava sendo morto a golpes, gemeu e disse: “Senhor, que tens a ciência santa, tu sabes
      claramente que, podendo ser libertado da morte, suporto duras dores no corpo; segundo a alma, porém,
      de bom grado sofro estas coisas por temor de ti.”'
    status: ia-sem-revisao
  '6:31':
    texto: E assim este deixou a vida, deixando não só aos jovens, mas a toda a nação a memória da sua
      morte como exemplo de virtude e fortaleza.
    status: ia-sem-revisao
  '7:1':
    texto: Aconteceu também que sete irmãos, presos juntamente com a mãe, foram obrigados pelo rei a comer,
      contra a lei, carnes de porco, atormentados com açoites e nervos de boi.
    status: ia-sem-revisao
  '7:2':
    texto: 'Um deles, o primeiro, falou assim: “Que perguntas e que queres saber de nós? Estamos prontos
      a morrer, em vez de transgredir as leis de Deus, recebidas de nossos pais.”'
    status: ia-sem-revisao
  '7:9':
    texto: 'No último alento, falou assim: “Tu, celeradíssimo, nos tiras da vida presente; mas o Rei do
      mundo, por suas leis, nos ressuscitará, mortos, para a ressurreição da vida eterna.”'
    status: ia-sem-revisao
  '7:10':
    texto: Depois dele, escarneceram o terceiro; pedida a língua, apresentou-a logo e estendeu as mãos
      com firmeza,
    status: ia-sem-revisao
  '7:11':
    texto: 'e disse com confiança: “Do céu possuo estes membros, mas por causa das leis de Deus agora
      os desprezo, porque dele espero recebê-los de novo”,'
    status: ia-sem-revisao
  '7:12':
    texto: de modo que o rei e os que estavam com ele se admiravam do ânimo do jovem, que tinha os tormentos
      por nada.
    status: ia-sem-revisao
  '7:13':
    texto: Morto este, atormentaram do mesmo modo o quarto, torturando-o.
    status: ia-sem-revisao
  '7:14':
    texto: 'Ao chegar à morte, falou assim: “É preferível, tendo sido entregues à morte pelos homens,
      esperar de Deus a esperança de ser por ele ressuscitados; para ti, porém, não haverá ressurreição
      para a vida.”'
    status: ia-sem-revisao
  '7:20':
    texto: 'A mãe, porém, era sobremodo admirável e digna de memória feliz: via perecer sete filhos num
      só dia e o suportava com bom ânimo, por causa da esperança que tinha em Deus.'
    status: ia-sem-revisao
  '7:21':
    texto: Exortava cada um deles, na língua dos pais, cheia de sabedoria; e, pondo um ânimo varonil num
      pensamento de mulher,
    status: ia-sem-revisao
  '7:22':
    texto: 'dizia-lhes: “Não sei como aparecestes no meu ventre; não fui eu que vos dei o espírito, a
      alma e a vida, nem fui eu que compus os membros de cada um.'
    status: ia-sem-revisao
  '7:23':
    texto: Foi o Criador do mundo, que formou o nascimento do homem e descobriu a origem de todas as coisas,
      que, com misericórdia, vos devolverá o espírito e a vida, como agora vos desprezais a vós mesmos
      por causa das suas leis.”
    status: ia-sem-revisao
  '7:24':
    texto: Antíoco, pensando-se desprezado e, ao mesmo tempo, considerando uma ofensa a voz de quem o
      repreendia, como ainda restasse o mais jovem, não só o exortava com palavras, mas também lhe assegurava
      com juramento que o faria rico e feliz, que, apartado das leis dos pais, o teria por amigo e lhe
      daria as coisas necessárias.
    status: ia-sem-revisao
  '7:25':
    texto: Como o jovem não se inclinasse de modo algum a isso, o rei chamou a mãe e a persuadia a aconselhar
      o jovem para a sua salvação.
    status: ia-sem-revisao
  '7:26':
    texto: Depois de a ter exortado com muitas palavras, ela prometeu que persuadiria o filho.
    status: ia-sem-revisao
  '7:27':
    texto: 'Inclinando-se, pois, para ele, zombando do cruel tirano, disse em língua pátria: “Filho meu,
      tem piedade de mim, que te carreguei no ventre nove meses, te dei de mamar durante três anos, te
      alimentei e te trouxe a esta idade.'
    status: ia-sem-revisao
  '7:28':
    texto: Peço-te, meu filho, que olhes para o céu e a terra e para tudo o que neles há, e entendas que
      Deus os fez do nada, e também o gênero humano.
    status: ia-sem-revisao
  '7:29':
    texto: Assim, não temas este carrasco, mas, tornando-te digno dos teus irmãos, aceita a morte, para
      que, naquela misericórdia, eu te receba com os teus irmãos.”
    status: ia-sem-revisao
  '7:30':
    texto: 'Enquanto ela ainda dizia isso, disse o jovem: “Quem esperais? Não obedeço ao mandamento do
      rei, mas ao mandamento da lei que nos foi dada por Moisés.'
    status: ia-sem-revisao
  '7:31':
    texto: E tu, que te fizeste inventor de todo o mal contra os hebreus, não escaparás da mão de Deus.”
    status: ia-sem-revisao
