livro: PHP
fonte: sblgnt
versiculos:
  '1:1':
    texto: 'Paulo e Timóteo, servos de Cristo Jesus, a todos os santos em Cristo Jesus que estão em Filipos,
      com os bispos e diáconos:'
    status: ia-sem-revisao
  '1:2':
    texto: Graça e paz a vós da parte de Deus, nosso Pai, e do Senhor Jesus Cristo.
    status: ia-sem-revisao
  '1:3':
    texto: Dou graças ao meu Deus todas as vezes que me lembro de vós,
    status: ia-sem-revisao
  '1:4':
    texto: Sempre, em todas as minhas orações por todos vós, fazendo com alegria a minha súplica,
    status: ia-sem-revisao
  '1:5':
    texto: Pela vossa comunhão no Evangelho, desde o primeiro dia até agora,
    status: ia-sem-revisao
  '1:6':
    texto: 'Convencido disto mesmo: de que aquele que começou em vós a boa obra a levará à perfeição até
      o dia de Cristo Jesus.'
    status: ia-sem-revisao
  '1:7':
    texto: É justo que eu pense assim de todos vós, por vos ter no coração, a todos vós que, tanto nas
      minhas prisões como na defesa e confirmação do Evangelho, sois participantes comigo da graça.
    status: ia-sem-revisao
  '1:8':
    texto: Pois Deus é testemunha de quanto vos quero a todos nas entranhas de Cristo Jesus.
    status: ia-sem-revisao
  '1:9':
    texto: 'E peço isto: que o vosso amor cresça cada vez mais em conhecimento e em todo discernimento,'
    status: ia-sem-revisao
  '1:10':
    texto: Para que saibais discernir o que é melhor, a fim de serdes puros e irrepreensíveis para o dia
      de Cristo,
    status: ia-sem-revisao
  '1:11':
    texto: Cheios do fruto de justiça que vem por Jesus Cristo, para a glória e o louvor de Deus.
    status: ia-sem-revisao
  '1:12':
    texto: Quero que saibais, irmãos, que o que me aconteceu redundou antes em progresso do Evangelho,
    status: ia-sem-revisao
  '1:13':
    texto: De modo que as minhas prisões se tornaram conhecidas em Cristo em todo o pretório e por todos
      os demais,
    status: ia-sem-revisao
  '1:14':
    texto: E a maior parte dos irmãos, confiando no Senhor por causa das minhas prisões, ousa com mais
      coragem anunciar sem temor a palavra.
    status: ia-sem-revisao
  '1:15':
    texto: Alguns, de fato, pregam a Cristo por inveja e rivalidade; outros, porém, por boa vontade.
    status: ia-sem-revisao
  '1:16':
    texto: Estes o fazem por amor, sabendo que fui posto para a defesa do Evangelho;
    status: ia-sem-revisao
  '1:17':
    texto: Aqueles anunciam a Cristo por espírito de partido, não com pureza, pensando suscitar tribulação
      para as minhas prisões.
    status: ia-sem-revisao
  '1:18':
    texto: Que importa? De qualquer modo, quer por pretexto, quer por verdade, Cristo é anunciado, e com
      isso me alegro; e me alegrarei ainda,
    partes:
    - Que importa? De qualquer modo, quer por pretexto, quer por verdade, Cristo é anunciado, e com isso
      me alegro;
    - e me alegrarei ainda,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '1:19':
    texto: Pois sei que isto redundará em minha salvação, graças à vossa oração e ao auxílio do Espírito
      de Jesus Cristo,
    status: ia-sem-revisao
  '1:20':
    texto: Segundo a minha expectativa e esperança de que em nada serei envergonhado, mas, com toda a
      ousadia, como sempre e também agora, Cristo será engrandecido no meu corpo, seja pela vida, seja
      pela morte.
    partes:
    - Segundo a minha expectativa e esperança de que em nada serei envergonhado,
    - mas, com toda a ousadia, como sempre e também agora, Cristo será engrandecido no meu corpo,
    - seja pela vida, seja pela morte.
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '1:21':
    texto: Pois para mim o viver é Cristo, e o morrer é ganho.
    status: ia-sem-revisao
  '1:22':
    texto: Mas, se o viver na carne significa para mim fruto do trabalho, não sei o que escolher.
    status: ia-sem-revisao
  '1:23':
    texto: 'Sinto-me pressionado dos dois lados: tenho o desejo de partir e estar com Cristo, o que é
      muitíssimo melhor;'
    status: ia-sem-revisao
  '1:24':
    texto: Mas permanecer na carne é mais necessário por causa de vós.
    status: ia-sem-revisao
  '1:25':
    texto: Convencido disto, sei que ficarei e permanecerei com todos vós, para o vosso progresso e alegria
      na fé,
    status: ia-sem-revisao
  '1:26':
    texto: Para que o vosso orgulho abunde em Cristo Jesus, por minha causa, com a minha nova presença
      entre vós.
    status: ia-sem-revisao
  '1:27':
    texto: Somente levai uma vida digna do Evangelho de Cristo, para que, quer eu vá e vos veja, quer
      ausente ouça falar de vós, vos mantenhais firmes em um só espírito, lutando juntos, com uma só alma,
      pela fé do Evangelho,
    partes:
    - Somente levai uma vida digna do Evangelho de Cristo,
    - para que, quer eu vá e vos veja, quer ausente ouça falar de vós, vos mantenhais firmes em um só
      espírito, lutando juntos, com uma só alma, pela fé do Evangelho,
    status: ia-sem-revisao
    observacao: 'partes: divisão pela pontuação e pelo sentido; a do Lecionário pode diferir.'
  '1:28':
    texto: Sem vos deixar intimidar em nada pelos adversários (o que para eles é sinal de perdição, e
      para vós de salvação, e isto da parte de Deus),
    status: ia-sem-revisao
  '1:29':
    texto: Porque vos foi concedida a graça, em favor de Cristo, não somente de crer nele, mas também
      de sofrer por ele,
    status: ia-sem-revisao
  '1:30':
    texto: Travando o mesmo combate que vistes em mim e agora ouvis dizer que ainda é o meu.
    status: ia-sem-revisao
  '2:1':
    texto: Se, pois, há alguma exortação em Cristo, algum consolo de amor, alguma comunhão do Espírito,
      alguma ternura e compaixão,
    status: ia-sem-revisao
  '2:2':
    texto: Completai a minha alegria, tendo um mesmo pensar, o mesmo amor, uma só alma, um só sentimento,
    status: ia-sem-revisao
  '2:3':
    texto: Nada fazendo por rivalidade ou vanglória, mas com humildade, considerando cada um os outros
      superiores a si mesmo,
    status: ia-sem-revisao
  '2:4':
    texto: Não buscando cada um só os seus interesses, mas também os dos outros.
    status: ia-sem-revisao
  '2:5':
    texto: Tende em vós o mesmo sentimento que houve também em Cristo Jesus,
    status: ia-sem-revisao
  '2:6':
    texto: Que, existindo em forma de Deus, não considerou o ser igual a Deus como algo a que se agarrar,
    status: ia-sem-revisao
  '2:7':
    texto: Mas esvaziou-se a si mesmo, tomando a forma de servo, tornando-se semelhante aos homens; e,
      reconhecido em aspecto como homem,
    status: ia-sem-revisao
  '2:8':
    texto: Humilhou-se a si mesmo, fazendo-se obediente até a morte, e morte de cruz.
    status: ia-sem-revisao
  '2:9':
    texto: Por isso Deus o exaltou soberanamente e lhe concedeu o nome que está acima de todo nome,
    status: ia-sem-revisao
  '2:10':
    texto: Para que, ao nome de Jesus, todo joelho se dobre nos céus, na terra e debaixo da terra,
    status: ia-sem-revisao
  '2:11':
    texto: E toda língua confesse que Jesus Cristo é Senhor, para a glória de Deus Pai.
    status: ia-sem-revisao
  '2:12':
    texto: Assim, meus amados, como sempre obedecestes, não só na minha presença, mas agora muito mais
      na minha ausência, com temor e tremor trabalhai pela vossa salvação,
    status: ia-sem-revisao
  '2:13':
    texto: Pois é Deus quem opera em vós tanto o querer como o realizar, segundo a sua benevolência.
    status: ia-sem-revisao
  '2:14':
    texto: Fazei tudo sem murmurações nem discussões,
    status: ia-sem-revisao
  '2:15':
    texto: Para que sejais irrepreensíveis e íntegros, filhos de Deus sem mancha no meio de uma geração
      perversa e depravada, na qual brilhais como luzeiros no mundo,
    status: ia-sem-revisao
  '2:16':
    texto: Mantendo firme a palavra de vida, para glória minha no dia de Cristo, pois não corri em vão
      nem trabalhei em vão.
    status: ia-sem-revisao
  '2:17':
    texto: Mas, ainda que eu seja derramado em libação sobre o sacrifício e o serviço sagrado da vossa
      fé, alegro-me e me alegro com todos vós;
    status: ia-sem-revisao
  '2:18':
    texto: Do mesmo modo, alegrai-vos vós também e alegrai-vos comigo.
    status: ia-sem-revisao
  '2:19':
    texto: Espero no Senhor Jesus enviar-vos em breve Timóteo, para que eu também me anime, conhecendo
      a vossa situação.
    status: ia-sem-revisao
  '2:20':
    texto: Pois não tenho ninguém de igual sentimento que se preocupe sinceramente com as vossas coisas;
    status: ia-sem-revisao
  '2:21':
    texto: Todos buscam os seus próprios interesses, não os de Jesus Cristo.
    status: ia-sem-revisao
  '2:22':
    texto: Conheceis a sua comprovada virtude, pois, como um filho com o pai, serviu comigo ao Evangelho.
    status: ia-sem-revisao
  '2:23':
    texto: Espero, pois, enviá-lo logo que eu veja como me vão as coisas;
    status: ia-sem-revisao
  '2:24':
    texto: E confio no Senhor que eu mesmo também irei em breve.
    status: ia-sem-revisao
  '2:25':
    texto: Julguei necessário enviar-vos Epafrodito, meu irmão, colaborador e companheiro de combate,
      vosso enviado e ministro das minhas necessidades,
    status: ia-sem-revisao
  '2:26':
    texto: Porque tinha saudades de todos vós e estava angustiado por terdes ouvido que adoeceu.
    status: ia-sem-revisao
  '2:27':
    texto: De fato, adoeceu, quase à morte; mas Deus teve misericórdia dele, e não só dele, mas também
      de mim, para que eu não tivesse tristeza sobre tristeza.
    status: ia-sem-revisao
  '2:28':
    texto: Enviei-o, pois, com mais pressa, para que, vendo-o de novo, vos alegreis e eu fique com menos
      tristeza.
    status: ia-sem-revisao
  '2:29':
    texto: Recebei-o, pois, no Senhor, com toda a alegria, e tende em honra os que são como ele,
    status: ia-sem-revisao
  '2:30':
    texto: Porque, pela obra de Cristo, chegou perto da morte, arriscando a vida para suprir a vossa ausência
      no serviço que me prestáveis.
    status: ia-sem-revisao
  '3:1':
    texto: Quanto ao mais, meus irmãos, alegrai-vos no Senhor. Escrever-vos as mesmas coisas não me é
      penoso, e para vós é segurança.
    status: ia-sem-revisao
  '3:2':
    texto: Cuidado com os cães, cuidado com os maus operários, cuidado com a falsa circuncisão.
    status: ia-sem-revisao
  '3:3':
    texto: Pois a circuncisão somos nós, que prestamos culto pelo Espírito de Deus e nos gloriamos em
      Cristo Jesus, sem pôr confiança na carne,
    status: ia-sem-revisao
  '3:4':
    texto: 'Embora eu mesmo tenha motivo de confiança também na carne. Se alguém julga ter motivo de confiança
      na carne, eu mais:'
    status: ia-sem-revisao
  '3:5':
    texto: Circuncidado ao oitavo dia, da linhagem de Israel, da tribo de Benjamim, hebreu filho de hebreus,
      quanto à Lei, fariseu;
    status: ia-sem-revisao
  '3:6':
    texto: Quanto ao zelo, perseguidor da Igreja; quanto à justiça que há na Lei, irrepreensível.
    status: ia-sem-revisao
  '3:7':
    texto: Mas as coisas que eram para mim lucro, essas considerei perda por causa de Cristo.
    status: ia-sem-revisao
  '3:8':
    texto: Mais ainda, considero tudo como perda diante da superioridade do conhecimento de Cristo Jesus,
      meu Senhor, por quem perdi tudo e tudo considero como lixo, para ganhar a Cristo
    status: ia-sem-revisao
  '3:9':
    texto: E ser achado nele, não tendo uma justiça minha, que vem da Lei, mas a que vem pela fé em Cristo,
      a justiça que vem de Deus, baseada na fé,
    status: ia-sem-revisao
  '3:10':
    texto: Para conhecê-lo, a ele e ao poder da sua ressurreição e a comunhão nos seus sofrimentos, tornando-me
      semelhante a ele na sua morte,
    status: ia-sem-revisao
  '3:11':
    texto: Para ver se alcanço a ressurreição dentre os mortos.
    status: ia-sem-revisao
  '3:12':
    texto: Não que já tenha alcançado ou já seja perfeito, mas prossigo para ver se o alcanço, tendo sido
      eu mesmo alcançado por Cristo.
    status: ia-sem-revisao
  '3:13':
    texto: 'Irmãos, eu não julgo ter alcançado ainda; mas uma coisa faço: esquecendo o que fica para trás
      e lançando-me para o que está à frente,'
    status: ia-sem-revisao
  '3:14':
    texto: Prossigo em direção à meta, para o prêmio da vocação do alto, que Deus nos dá em Cristo Jesus.
    status: ia-sem-revisao
  '3:15':
    texto: Todos nós, que somos perfeitos, tenhamos este sentimento; e, se em algo pensais diferente,
      também isso Deus vos revelará.
    status: ia-sem-revisao
  '3:16':
    texto: Contudo, naquilo a que chegamos, caminhemos na mesma linha.
    status: ia-sem-revisao
  '3:17':
    texto: Sede juntos meus imitadores, irmãos, e observai os que assim andam, segundo o modelo que tendes
      em nós.
    status: ia-sem-revisao
  '3:18':
    texto: Pois muitos andam — de quem muitas vezes vos falei e agora o digo até chorando — como inimigos
      da cruz de Cristo,
    status: ia-sem-revisao
  '3:19':
    texto: Cujo fim é a perdição, cujo deus é o ventre e cuja glória está na sua vergonha, os que só pensam
      nas coisas da terra.
    status: ia-sem-revisao
  '3:20':
    texto: Nós, porém, somos cidadãos do céu, de onde também aguardamos como Salvador o Senhor Jesus Cristo,
    status: ia-sem-revisao
  '3:21':
    texto: Que transformará o nosso corpo humilhado, tornando-o semelhante ao seu corpo glorioso, pela
      atuação do poder que tem de sujeitar a si todas as coisas.
    status: ia-sem-revisao
  '4:1':
    texto: Assim, meus irmãos amados e queridos, minha alegria e coroa, permanecei assim firmes no Senhor,
      amados.
    status: ia-sem-revisao
  '4:2':
    texto: Exorto Evódia e exorto Síntique a terem o mesmo sentimento no Senhor.
    status: ia-sem-revisao
  '4:3':
    texto: Sim, peço-te também a ti, fiel companheiro, que as ajudes, pois combateram comigo pelo Evangelho,
      com Clemente e os demais meus colaboradores, cujos nomes estão no livro da vida.
    status: ia-sem-revisao
  '4:4':
    texto: 'Alegrai-vos sempre no Senhor; repito: alegrai-vos.'
    status: ia-sem-revisao
  '4:5':
    texto: A vossa amabilidade seja conhecida de todos os homens. O Senhor está próximo.
    status: ia-sem-revisao
  '4:6':
    texto: Não vos inquieteis com coisa alguma; em tudo, pela oração e súplica, com ação de graças, apresentai
      a Deus os vossos pedidos.
    status: ia-sem-revisao
  '4:7':
    texto: E a paz de Deus, que excede todo entendimento, guardará os vossos corações e os vossos pensamentos
      em Cristo Jesus.
    status: ia-sem-revisao
  '4:8':
    texto: Quanto ao mais, irmãos, tudo o que é verdadeiro, tudo o que é nobre, tudo o que é justo, tudo
      o que é puro, tudo o que é amável, tudo o que é de boa fama, se há alguma virtude e se há algum
      louvor, isso considerai.
    status: ia-sem-revisao
  '4:9':
    texto: O que também aprendestes, recebestes, ouvistes e vistes em mim, isso praticai; e o Deus da
      paz estará convosco.
    status: ia-sem-revisao
  '4:10':
    texto: Alegrei-me muito no Senhor porque finalmente reviveu o vosso cuidado por mim; já o tínheis,
      mas não tínheis oportunidade.
    status: ia-sem-revisao
  '4:11':
    texto: Não digo isto por necessidade, pois aprendi a bastar-me nas condições em que me encontro.
    status: ia-sem-revisao
  '4:12':
    texto: 'Sei viver na humilhação, sei viver na abundância; em tudo e por tudo fui iniciado: tanto a
      ter fartura como a passar fome, tanto a ter abundância como a sofrer privação.'
    status: ia-sem-revisao
  '4:13':
    texto: Tudo posso naquele que me fortalece.
    status: ia-sem-revisao
  '4:14':
    texto: Contudo, fizestes bem em tomar parte na minha tribulação.
    status: ia-sem-revisao
  '4:15':
    texto: Sabeis também vós, filipenses, que no início do Evangelho, quando saí da Macedônia, nenhuma
      Igreja teve comigo relação de dar e receber, a não ser vós sozinhos,
    status: ia-sem-revisao
  '4:16':
    texto: Pois também em Tessalônica, uma e duas vezes, enviastes para as minhas necessidades.
    status: ia-sem-revisao
  '4:17':
    texto: Não que eu procure o dom, mas procuro o fruto que se acumula em vosso favor.
    status: ia-sem-revisao
  '4:18':
    texto: Tenho tudo e tenho em abundância; estou cheio, tendo recebido de Epafrodito o que me enviastes,
      suave perfume, sacrifício aceito, agradável a Deus.
    status: ia-sem-revisao
  '4:19':
    texto: O meu Deus preencherá todas as vossas necessidades segundo a sua riqueza, na glória, em Cristo
      Jesus.
    status: ia-sem-revisao
  '4:20':
    texto: A nosso Deus e Pai seja a glória pelos séculos dos séculos. Amém.
    status: ia-sem-revisao
  '4:21':
    texto: Saudai todos os santos em Cristo Jesus. Os irmãos que estão comigo vos saúdam.
    status: ia-sem-revisao
  '4:22':
    texto: Todos os santos vos saúdam, sobretudo os da casa de César.
    status: ia-sem-revisao
  '4:23':
    texto: A graça do Senhor Jesus Cristo esteja com o vosso espírito.
    status: ia-sem-revisao
