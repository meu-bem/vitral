livro: HAB
fonte: oshb
versiculos:
  '1:2':
    texto: 'Até quando, Senhor, clamarei por socorro, e não ouvirás? Gritarei a ti: “Violência!”, e não
      salvarás?'
    status: ia-sem-revisao
  '1:3':
    texto: Por que me fazes ver a iniquidade e contemplar a opressão? Destruição e violência estão diante
      de mim; há litígio e contenda se levanta.
    status: ia-sem-revisao
  '1:12':
    texto: Não és tu desde a eternidade, Senhor, meu Deus, meu Santo? Não morreremos. Senhor, para o juízo
      o puseste; ó Rocha, para o castigo o estabeleceste.
    status: ia-sem-revisao
  '1:13':
    texto: Teus olhos são puros demais para ver o mal, e não podes contemplar a opressão. Por que contemplas
      os traidores e calas quando o ímpio devora quem é mais justo do que ele?
    status: ia-sem-revisao
  '1:14':
    texto: Fazes os homens como os peixes do mar, como os répteis que não têm governante.
    status: ia-sem-revisao
  '1:15':
    texto: Ele os tira todos com anzol, apanha-os na sua rede e os recolhe na sua tarrafa; por isso se
      alegra e exulta.
    status: ia-sem-revisao
  '1:16':
    texto: Por isso sacrifica à sua rede e queima incenso à sua tarrafa, porque por elas a sua porção
      é gorda e a sua comida, abundante.
    status: ia-sem-revisao
  '1:17':
    texto: Continuará, então, a esvaziar a sua rede e a matar sem piedade as nações para sempre?
    status: ia-sem-revisao
  '2:1':
    texto: Ficarei no meu posto de guarda, em pé sobre a torre, e vigiarei para ver o que ele me dirá
      e que responderei à minha queixa.
    status: ia-sem-revisao
  '2:2':
    texto: 'O Senhor me respondeu: “Escreve a visão e grava-a sobre tabuinhas, para que se possa lê-la
      correndo.'
    status: ia-sem-revisao
  '2:3':
    texto: Pois a visão ainda espera o seu tempo, mas tende para o fim e não mentirá; se tardar, espera-a,
      porque certamente virá, não tardará.
    status: ia-sem-revisao
  '2:4':
    texto: Eis que o soberbo não tem a alma reta dentro de si, mas o justo viverá pela sua fidelidade.”
    status: ia-sem-revisao
    observacao: '“Fidelidade” (ʼemunah): também pode ser “fé”.'
